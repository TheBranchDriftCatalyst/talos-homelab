name: security posture

on:
  pull_request:
    paths:
      - 'infrastructure/base/crowdsec/**'
      - 'infrastructure/base/honeypot/**'
      - 'infrastructure/base/iocaine/**'
      - 'infrastructure/base/traefik/**'
      - 'scripts/security/**'
      - '.github/workflows/security-posture.yaml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/base/crowdsec/**'
      - 'infrastructure/base/honeypot/**'
      - 'infrastructure/base/iocaine/**'
      - 'infrastructure/base/traefik/**'
      - 'scripts/security/**'
      - '.github/workflows/security-posture.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      # No cluster credentials, VPN, traffic generation or fault injection in CI.
      # Live-system assertions are explicitly skipped without --live.
      - run: python scripts/security/test_security_posture.py
