name: security posture

on:
  pull_request:
    paths:
      - 'applications/bt-radar/**'
      - 'infrastructure/base/crowdsec/**'
      - 'infrastructure/base/honeypot/**'
      - 'infrastructure/base/iocaine/**'
      - 'infrastructure/base/traefik/**'
      - 'tests/**'
      - 'scripts/security/**'
      - '.github/workflows/security-posture.yaml'
  push:
    branches: [main]
    paths:
      - 'applications/bt-radar/**'
      - 'infrastructure/base/crowdsec/**'
      - 'infrastructure/base/honeypot/**'
      - 'infrastructure/base/iocaine/**'
      - 'infrastructure/base/traefik/**'
      - 'tests/**'
      - 'scripts/security/**'
      - '.github/workflows/security-posture.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 pytest
      # No cluster credentials, VPN, traffic generation or fault injection in CI.
      # Live-system assertions are explicitly skipped without --live.
      - run: python -m pytest tests/ -m security_posture
      - run: python tests/security-posture/test-bt-agent-preflight.py
      - run: python -m pytest tests/ -m telemetry   # dashboard panel structure (offline)

  ingress-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 pytest
      - name: install kustomize
        run: |
          KVER=v5.8.1
          curl -sSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KVER}/kustomize_${KVER}_linux_amd64.tar.gz"
          tar xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/ && kustomize version
      # Layer 3 (ingress accessibility) — offline corpus contracts only; --live is operator-run.
      - run: python -m pytest tests/ -m ingress_accessibility
