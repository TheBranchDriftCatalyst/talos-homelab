# Root Taskfile - Orchestrates domain-specific taskfiles
version: '3'

# Include domain-specific taskfiles
includes:
  talos: Taskfile.talos.yaml
  k8s: Taskfile.k8s.yaml
  dev: Taskfile.dev.yaml
  infra: Taskfile.infra.yaml
  security: Taskfile.security.yaml
  test: Taskfile.test.yaml
  certs: Taskfile.certs.yaml

vars:
  TALOS_NODE: '{{.TALOS_NODE | default "192.168.1.54"}}'
  TALOSCONFIG: './configs/talosconfig'
  KUBECONFIG: './.output/kubeconfig'

tasks:
  # ============================================
  # Default Task
  # ============================================

  default:
    desc: Show available task domains and common commands
    cmds:
      - echo "╔════════════════════════════════════════════╗"
      - echo "║  Talos Homelab Task Runner                 ║"
      - echo "╚════════════════════════════════════════════╝"
      - echo ""
      - echo "📦 First time setup:"
      - echo "  task deps:install              - Verify the dev toolchain (flake + direnv)"
      - echo ""
      - echo "📋 Task domains:"
      - echo "  • talos:*     - Talos Linux operations (config, bootstrap, health, services)"
      - echo "  • k8s:*       - Kubernetes operations (kubeconfig, pods, dashboard, audit)"
      - echo "  • dev:*       - Development tools (linting, formatting, hooks, Tilt)"
      - echo "  • infra:*     - Infrastructure deployment (monitoring, observability, apps)"
      - echo "  • certs:*     - Certificate ops (trust-cert, list, check-expiry, renew, issuers)"
      - echo ""
      - echo "🚀 Common commands:"
      - echo "  task health                    - Check cluster health"
      - echo "  task kubeconfig-merge          - Merge kubeconfig to ~/.kube/config"
      - echo "  task get-pods                  - Get all pods"
      - echo "  task lint                      - Run all linters"
      - echo "  task dev:tilt-up               - Start Tilt development environment"
      - echo "  task infra:flux-reconcile      - Force Flux to reconcile the cluster"
      - echo ""
      - echo "📚 List all tasks:"
      - echo "  task --list                    - Show all available tasks"
      - echo "  task --list-all                - Show all tasks with descriptions"
      - echo ""
      - echo "💡 Get help for a specific task:"
      - echo "  task <domain>:<task> --help"

  # ============================================
  # Common Shortcuts (Most Frequently Used)
  # ============================================

  health:
    desc: Check Talos cluster health
    cmds:
      - task: talos:health

  dashboard:
    desc: Open Talos dashboard
    cmds:
      - task: talos:dashboard

  kubeconfig:
    desc: Download kubeconfig from Talos
    cmds:
      - task: k8s:kubeconfig

  kubeconfig-merge:
    desc: Merge kubeconfig to ~/.kube/config (enables kubectl/kubectx)
    cmds:
      - task: k8s:kubeconfig-merge

  trust-cert:
    desc: Trust the homelab CA locally (idempotent) — fixes *.talos00 HTTPS warnings
    cmds:
      - task: certs:trust-cert

  get-pods:
    desc: Get all pods in all namespaces
    cmds:
      - task: k8s:get-pods

  get-nodes:
    desc: Get Kubernetes nodes
    cmds:
      - task: k8s:get-nodes

  provision:
    desc: Complete provisioning workflow for a fresh node
    cmds:
      - task: talos:provision

  scripts:
    desc: List all available scripts organized by namespace/stack
    cmds:
      - ./scripts/list-scripts.sh {{.CLI_ARGS}}

  scripts:run:
    desc: Interactive script runner (requires fzf)
    cmds:
      - ./scripts/list-scripts.sh --run

  tdarr:
    desc: Show Tdarr worker cache dashboard
    cmds:
      - ./applications/tdarr/scripts/tdarr-dashboard.sh {{.CLI_ARGS}}

  # ============================================
  # Dependencies & Setup
  # ============================================

  deps:install:
    desc: Verify the dev toolchain (nix flake + direnv)
    cmds:
      - |
        echo "🚀 This repo's toolchain is declared in flake.nix, not installed imperatively."
        echo
        missing=0
        for t in talosctl talhelper kubectl kustomize helm flux task tilt lefthook \
                 gitleaks yamllint yamlfmt shellcheck shfmt prettier markdownlint-cli2 \
                 jq gum uv bd k9s; do
          if command -v "$t" >/dev/null 2>&1; then
            printf '  ✓ %s\n' "$t"
          else
            printf '  ✗ %s  (NOT on PATH)\n' "$t"; missing=$((missing+1))
          fi
        done
        echo
        if [ "$missing" -gt 0 ]; then
          echo "❌ $missing tool(s) missing — you are probably outside the dev shell."
          echo "   Run: direnv allow     (or, without direnv: nix develop)"
          exit 1
        fi
        echo "✅ Full toolchain present."
        echo
        echo "🎯 Next steps:"
        echo "  1. Provision cluster - task provision"
        echo "  2. Merge kubeconfig  - task kubeconfig-merge"
        echo "  3. Deploy            - commit to git, Flux reconciles (task infra:flux-reconcile to force)"
        echo "  4. Start development - task dev:tilt-up"

  setup:
    desc: Alias for deps:install (toolchain check)
    cmds:
      - task: deps:install

  lint:
    desc: Run all linters
    cmds:
      - task: dev:lint

  format:
    desc: Format all code
    cmds:
      - task: dev:format

  validate:
    desc: Validate all infrastructure manifests
    cmds:
      - task: dev:validate

  ci:
    desc: Run full CI pipeline locally (lint + format + validate)
    cmds:
      - task: dev:ci

  audit:
    desc: Generate comprehensive cluster audit report
    cmds:
      - task: k8s:audit

  dashboard-arr:
    desc: Show ARR stack dashboard with real-time status
    cmds:
      - task: infra:dashboard-arr-stack

  flux-suspend:
    desc: Suspend Flux reconciliation (enables manual control)
    cmds:
      - task: k8s:flux-suspend

  flux-resume:
    desc: Resume Flux reconciliation (re-enables GitOps)
    cmds:
      - task: k8s:flux-resume

  flux-status:
    desc: Show Flux reconciliation status
    cmds:
      - task: k8s:flux-status

  trust-ca:
    desc: Add homelab-ca root certificate to macOS keychain
    cmds:
      - task: dev:trust-ca

  setup-1password:
    desc: Bootstrap 1Password Connect (one-command recovery; see docs/05-runbooks/cluster-bootstrap.md)
    cmds:
      - task: infra:setup-1password

  # ============================================
  # Cleanup Tasks
  # ============================================

  clean:
    desc: Remove generated/output files only
    cmds:
      - rm -rf .output
      - echo "✅ Cleaned up generated files"

  clean-all:
    desc: Remove ALL configs including Talos configs (CAREFUL!)
    cmds:
      - rm -rf .output configs
      - echo "✅ All configs and output removed"
    prompt: This will remove ALL Talos configuration files. Continue?
