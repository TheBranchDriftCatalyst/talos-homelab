# ══════════════════════════════════════════════════════════════════════════════
# SUPERSEDED BY TALHELPER (TALOS-ow7w). HISTORICAL RECORD — DO NOT APPLY BY HAND.
#
# The live declaration is configs/patches/maxpods-200.yaml, wired to the
# nodes that get it by configs/talconfig.yaml. That file is git-tracked, so the
# "tracked copy of a gitignored config" rationale below no longer applies —
# configs/nodes/ is gone (archived to .scratch/__configs/) and configs/patches/ is
# in git.
#
# Applying this with `talosctl patch mc` now creates drift: the next
# `task talos:apply-config NODE=<host>` reverts anything talconfig.yaml does not
# declare. Change the file under configs/patches/ instead, then:
#
#   task talos:verify-dry-run             what applying would do (read-only)
#   task talos:apply-config NODE=<host>   apply it (destructive)
#
# Kept because the comments below record WHY each value is what it is, which the
# generated configs do not carry.
# ══════════════════════════════════════════════════════════════════════════════
# Raise the kubelet maxPods ceiling from the Kubernetes default of 110.
#
# WHY — this was actively breaking backups, not a theoretical limit. On
# 2026-08-21 talos02-gpu sat at 109/110 pods while using only 37% of its 61Gi of
# memory. A node at maxPods REJECTS new pods outright:
#
#   Pod was rejected: Node didn't have enough resource: pods,
#   requested: 1, used: 110, capacity: 110
#
# Velero's per-volume backup helper pods were among the rejected, so 22 of 67
# PodVolumeBackups were Canceled, the parent backup blocked for ~4h and then
# failed with "timed out waiting for all PodVolumeBackups to complete", and the
# daily backups came out PartiallyFailed three days running (08-19/20/21, clean
# on 08-18). The visible alert was VeleroScheduleNotRunning, which points at the
# wrong layer entirely — the schedules were firing on time; the node simply had
# nowhere to put the helper pods. See TALOS-d5b5.
#
# WHY 200 — the pod CIDR is the hard ceiling, not the hardware. Cilium runs
# ipam:kubernetes, so each node's pod IPs come from the /24 assigned in its node
# spec (10.244.0.0/24, 10.244.1.0/24, ...) = 254 usable addresses. 200 leaves 54
# addresses (21%) of headroom, which matters because terminating pods hold their
# IP until the sandbox is torn down, so the instantaneous IP count runs ahead of
# the live pod count. Do NOT raise this above ~240 without re-subnetting: the
# kubelet would happily admit pods that Cilium then cannot assign an IP to, and
# the failure mode moves from a clean "rejected" to pods stuck ContainerCreating.
#
# WHY UNIFORM ACROSS ALL NODES — the two 61Gi nodes (talos02-gpu, talos06) are
# the ones that actually hit the ceiling, because kube-scheduler balances by
# RESOURCE REQUESTS rather than pod count and so packs the largest nodes first.
# But a uniform value keeps every node's capacity predictable and costs nothing
# on the smaller ones: talos03 has only 14Gi and is memory-bound at ~74%, so it
# will hit memory pressure long before 200 pods and the higher ceiling is simply
# never reached there. Uniformity also means a rescheduled workload behaves the
# same wherever it lands.
#
# THIS IS ONLY HALF THE FIX. Raising the ceiling stops the immediate rejection,
# but nothing rebalances the existing skew (109 vs 40 pods). The descheduler in
# infrastructure/base/descheduler/ handles that half. Ceiling without rebalancing
# just delays the next occurrence; rebalancing without the ceiling leaves a node
# permanently at its limit.
#
# NOT A REBOOT: kubelet config is applied with talosctl patch mc in the default
# auto mode, which restarts kubelet only. Running containers are not disturbed.
#
# Apply via the bootstrap helper script (preferred, idempotent across all nodes):
#   ./scripts/bootstrap-talos-patches.sh
#
# Or manually for a single node:
#   talosctl --talosconfig configs/talosconfig -e 192.168.1.54 \
#     patch mc --nodes <node-ip> --patch @docs/05-runbooks/talos-kubelet-maxpods-patch.yaml
#
# Verify after applying:
#   kubectl get nodes -o custom-columns=NAME:.metadata.name,MAXPODS:.status.capacity.pods
machine:
  kubelet:
    extraConfig:
      maxPods: 200
