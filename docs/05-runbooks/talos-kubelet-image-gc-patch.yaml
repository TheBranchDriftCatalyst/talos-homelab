# Enable AGE-BASED container image garbage collection.
#
# WHY — Talos ships kubelet with age-based image GC switched off:
#     imageGCHighThresholdPercent: 85
#     imageGCLowThresholdPercent:  80
#     imageMinimumGCAge:           2m0s
#     imageMaximumGCAge:           0s      <-- DISABLED
# (verified: kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq .kubeletconfig)
#
# With imageMaximumGCAge unset, image GC is purely a DISK-PRESSURE REFLEX. Nothing
# prunes by age, so images accumulate without bound until a node crosses 85%, at which
# point kubelet dumps down to 80% in one uncontrolled sweep. Measured 2026-08-24:
#
#     talos06      763 / 929 Gi   82%   2,504 images, 306 of them unreferenced
#                                       (~261 GB) sitting untouched since APRIL
#     talos02-gpu  663 / 1905 Gi  35%
#     every node growing ~2 GB/day since 2026-08-09 with nothing pruning
#
# talos06 was three percentage points from that uncontrolled sweep and ten from the
# evictionHard nodefs.available=10% line we set earlier the same day.
#
# The two media nodes are worst because they have the most image churn, which is exactly
# why this LOOKED like unpruned GPU/transcode cache. It is not — it is container images.
# Same symptom, different cause, and the transcode-cache theory would have sent the fix
# to the wrong place entirely.
#
# WHY 336h (14 days). Long enough that anything in normal rotation — including weekly
# CronJobs and workloads that idle between runs — is never collected, short enough that
# April's images do not survive another four months. Tune down if reclaim is too slow;
# do not tune below about 7d or you start re-pulling images for ordinary weekly work.
#
# SAFE FOR LIVE WORKLOADS. imageMaximumGCAge counts from LAST USE, and an image pinned by
# a running container is never a GC candidate regardless of age. What it WILL evict is
# images for workloads scaled to zero that are expected to come back — those re-pull on
# scale-up, which costs a pull, not data.
#
# NOT A REBOOT. Kubelet config applies via talosctl patch mc in the default auto mode,
# which restarts kubelet only; running containers are undisturbed. Same mechanism as the
# maxPods and memory-reserve patches beside this file.
#
# Apply per node:
#   talosctl --talosconfig configs/talosconfig -e 192.168.1.54 \
#     patch mc --nodes <node-ip> --patch @docs/05-runbooks/talos-kubelet-image-gc-patch.yaml
#
# Verify:
#   kubectl get --raw /api/v1/nodes/<node>/proxy/configz | jq .kubeletconfig.imageMaximumGCAge
#
# Ticket: TALOS-2ome (root cause) / TALOS-cd73 (the ~260 GB/node reclaim it enables).
machine:
  kubelet:
    extraConfig:
      imageMaximumGCAge: 336h
