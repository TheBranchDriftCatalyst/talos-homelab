# Markdownlint-cli2 Configuration
# Linting rules for Markdown files
# Docs: https://github.com/DavidAnson/markdownlint-cli2

# globs are deliberately NOT set here. markdownlint-cli2 does NOT let explicit CLI file
# arguments override a config `globs` list — setting it made `markdownlint-cli2 README.md`
# lint the entire tree, which would turn lefthook's staged-file hook into a full-repo scan
# on every commit. The standalone glob lives in the Taskfile dev:lint:markdown task instead, so the
# two invocation paths stay independent:
#   lefthook          -> npx markdownlint-cli2 {staged_files}   (explicit files)
#   task dev:lint:markdown -> markdownlint-cli2 '**/*.md'        (glob in the task)
# Previously neither carried a glob, so every argument-less run reported
# "Linting: 0 file(s) / Summary: 0 error(s)" and exited 0 — a green lint that had never
# checked a single Markdown file.

# ---------------------------------------------------------------------------------------
# THIS IS THE ONLY markdownlint config. `.markdownlint.json` was deleted 2026-09-19.
#
# Previously both existed, and markdownlint-cli2 gave the sibling .json precedence — so the
# `config:` block here was parsed and then DISCARDED. Editing it did nothing, which cost real
# time to discover: a fix put here appeared to have no effect, and the bare invocation and the
# one that passed the .json explicitly reported DIFFERENT counts for the same tree, which is
# what finally gave it away.
#
# The rules below are the ones that were genuinely in force, moved here verbatim. They are
# deliberately NOT the stricter set this block used to carry: enabling that moved the repo from
# 0 errors to several hundred, dominated by MD044/proper-names (capitalising Kubernetes, GitHub
# and friends across the tree). Tightening is worth doing and is tracked separately — as an
# explicit reformat with its own review, never as a side effect of consolidating two files.
# ---------------------------------------------------------------------------------------

# Glob patterns for files to ignore
ignores:
  # Agent worktrees: 661 vendored .md files that are not ours to lint.
  - '.claude'
  - '**/.claude'
  # nix-direnv's flake-input cache holds a FULL copy of this repo's source
  # (.direnv/flake-inputs/<hash>-source/**), so without this every tracked .md
  # is linted twice. markdownlint-cli2 does not read .gitignore, so being
  # gitignored is not enough — it has to be listed here.
  - '.direnv'
  - '**/.direnv'
  - 'node_modules'
  - '**/node_modules'
  - '.git'
  - '.output'
  - '.venv'
  - '**/.venv'
  - '**/.*venv'
  # Scratch//archive space: moved out of the repo deliberately, not ours to lint.
  - '.scratch'
  - '**/.scratch'
  # docsgen integration FIXTURES. These are supposed to be malformed — unterminated
  # frontmatter, a missing H1, two H1s — because specs assert docsgen reports exactly those
  # defects. Linting them turns a fixture's planted defect into a repo defect, and would
  # block every commit once this hook is made to block.
  - 'dev/docs-generator/integration/testdata'
  - '**/integration/testdata'
  # Preserved review artifacts from `task docs:test:integration:keep`. Gitignored, and they
  # contain copies of the fixtures above.
  - '**/.artifacts'

# Configuration for markdownlint
config:
  # hard tabs: exempt fenced code — bluetooth-enablement.md quotes net/bluetooth/Kconfig
    # verbatim, and kernel source is tab-indented, so de-tabbing would falsify the evidence
  MD010:
    code_blocks: false

  # line length: unbounded — prose here wraps by meaning, not column
  MD013: false

  # blanks around headings: off
  MD022: false

  # duplicate headings: allowed when nested differently or non-sibling
  MD024:
    allow_different_nesting: true
    siblings_only: true

  # trailing punctuation in headings: '?' is allowed, the rest are not
  MD026:
    punctuation: ".,;:!"

  # blanks around fences: off
  MD031: false

  # blanks around lists: off
  MD032: false

  # inline HTML: allowed — used for <details> and alignment
  MD033: false

  # bare URLs: allowed
  MD034: false

  # emphasis-as-heading: allowed
  MD036: false

  # fenced code language: not required
  MD040: false

  # link fragments: off — many anchors are generated
  MD051: false

  # blanks around tables: off
  MD058: false

  # off
  MD060: false
