# Signatures that ARE errors but are NOT bugs.
#
# Every entry here is a DELIBERATE decision to stop asking about something.
# "It was noisy" is not a reason. "The remote end is an attacker and a refused
# connection is the product working" is a reason.
#
# Same discipline as dev/helm-values-lint/allow.yaml: each entry carries its
# evidence in `why`, so a later reader can judge whether it still holds rather
# than inheriting a silent blind spot.
#
# Fields:
#   service  optional. Omit to match the pattern in any service.
#   pattern  Python regex, matched against the NORMALISED signature (digits are
#            already <n>, long hex is <h>, ANSI escapes are stripped).
#   why      required. The selftest FAILS an entry with no `why`.
#
# NOT the place for severity mistakes. A line whose body says INFO/TRACE/WARN is
# classified `misclassified` before this file is consulted, because the fix for
# those is the ingest pipeline, not the app, and an entry here would go dead the
# moment the pipeline is fixed.
#
# DELIBERATELY EMPTY at creation (2026-10-15). The operator's standing decision
# for this campaign is "fix the app where possible" -- including the honeypots,
# where cowrie's 251/h AttributeError turned out to be a genuine Python crash
# (TALOS-3qe4) rather than attacker noise. Entries get added only when a
# specific signature has been investigated and consciously accepted.

