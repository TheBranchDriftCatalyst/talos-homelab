# Documentation linting and (later) generation.
#
# The tool is a Go module at dev/docs-generator/ producing a `docsgen` binary. `task docs:build`
# compiles it into dev/docs-generator/bin, which flake.nix's shellHook puts on PATH — so inside
# the dev shell you can type `docsgen lint` directly from anywhere in the repo, and these tasks
# are just the discoverable front door.
#
# The tool is deliberately self-contained and portable: dev/docs-generator/ can be copied into
# another repo and works after editing config.yaml alone. That is why the build sets GOWORK=off
# (a parent go.work in the surrounding workspace otherwise drags sibling modules in) and why
# nothing in the Go knows this repo by name.
#
# `lint` and the report tasks never touch the repository. `generate` writes the whole-file
# artifacts; `check` verifies them and writes nothing, which is the form a CI gate needs.
version: "3"

vars:
  SRC: dev/docs-generator
  BIN: dev/docs-generator/bin/docsgen

tasks:
  default:
    desc: "Lint the documentation tree (all rules)"
    cmds:
      - task: lint

  build:
    desc: "Compile the docsgen binary into dev/docs-generator/bin"
    sources:
      - "{{.SRC}}/*.go"
      - "{{.SRC}}/go.mod"
      - "{{.SRC}}/go.sum"
    generates:
      - "{{.BIN}}"
    cmds:
      - cmd: cd {{.SRC}} && GOWORK=off go build -o bin/docsgen .
      - cmd: echo "built {{.BIN}}"

  generate:
    desc: "Write the generated documentation artifacts"
    deps: [build]
    cmds:
      - "{{.BIN}} generate"

  check:
    desc: "Fail if a generated artifact is out of date (writes nothing)"
    deps: [build]
    cmds:
      - "{{.BIN}} check"

  lint:
    desc: "Run every enabled documentation rule"
    deps: [build]
    cmds:
      - "{{.BIN}} lint"

  links:
    desc: "Broken internal links only"
    deps: [build]
    cmds:
      - "{{.BIN}} links"

  components:
    desc: "Component inventory — slug, README presence, nested-kustomization count"
    deps: [build]
    cmds:
      - "{{.BIN}} components"

  frontmatter:
    desc: "Docs with no frontmatter — the migration worklist"
    deps: [build]
    cmds:
      - "{{.BIN}} frontmatter"

  stale:
    desc: "Docs whose covered code has moved ahead of them"
    deps: [build]
    cmds:
      - "{{.BIN}} stale"

  rule:
    desc: "Run a single rule, e.g. task docs:rule -- component-shape"
    deps: [build]
    cmds:
      - "{{.BIN}} lint -rule {{.CLI_ARGS}}"

  # Two test layers with a real boundary.
  #
  # unit  — in-package (package main), reaches unexported functions. Fast, no I/O.
  # integ — black-box: builds the real binary and drives it against a SYNTHESIZED fixture
  #         repo, so it asserts known answers instead of "whatever this cluster has today".
  #         A suite keyed to the live component set fails the next time someone adds a
  #         Kustomization, which trains everyone to ignore it.
  #
  # The ginkgo CLI comes from the module itself rather than from nixpkgs, so CLI and library
  # versions match by construction — a skew between them is a documented ginkgo footgun.
  test:
    desc: "Run both docsgen test layers"
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: "Unit layer — pure functions, in-package"
    cmds:
      - cd {{.SRC}} && GOWORK=off go run github.com/onsi/ginkgo/v2/ginkgo --label-filter=unit ./...

  test:integration:
    desc: "Integration layer — builds the binary, drives it against a fixture repo"
    cmds:
      - cd {{.SRC}} && GOWORK=off go run github.com/onsi/ginkgo/v2/ginkgo --label-filter=integration ./...

  # Review mode. Same specs, same assertions — the only difference is that the materialised
  # fixture, every command's argv/exit/stdout/stderr, and any golden diffs are left on disk
  # instead of being deleted with the temp dir. A suite whose output nobody can read is a suite
  # nobody trusts enough to act on when it goes red.
  #
  # Output lands in dev/docs-generator/integration/.artifacts/<sample>/ — a STABLE path, so it
  # can be bookmarked and diffed against the previous run. It is wiped at the start of each run
  # (stale files silently contaminating the next run is worse than not preserving at all) and
  # gitignored, because a generated tree in git is the exact drift this effort exists to remove.
  test:integration:keep:
    desc: "Integration layer, preserving artifacts on disk for review"
    env:
      DOCSGEN_PRESERVE_ARTIFACTS: "1"
    cmds:
      - cd {{.SRC}} && GOWORK=off go run github.com/onsi/ginkgo/v2/ginkgo --label-filter=integration ./...
      - cmd: echo "artifacts preserved in {{.SRC}}/integration/.artifacts/"

  test:go:
    desc: "Both layers via plain `go test` (no ginkgo CLI needed)"
    cmds:
      - cd {{.SRC}} && GOWORK=off go test ./...

  clean:
    desc: "Remove the built binary"
    cmds:
      - rm -rf {{.SRC}}/bin
