# Taskfile for Talos Linux operations
version: '3'

vars:
  TALOS_NODE: '{{.TALOS_NODE | default "192.168.1.54"}}'
  TALOSCONFIG: './configs/talosconfig'
  CLUSTER_NAME: 'catalyst-cluster'
  CLUSTER_ENDPOINT: 'https://{{.TALOS_NODE}}:6443'
  # Machine configs are GENERATED from configs/talconfig.yaml by talhelper (TALOS-ow7w):
  #     task talos:gen-config        regenerate configs/clusterconfig/
  #     task talos:verify            regenerate and diff against every live node
  #     task talos:verify-dry-run    ask each node what applying would actually do
  #
  # CONTROLPLANE_CONFIG / WORKER_CONFIG / WORKER_TALOS01_CONFIG / WORKER_TALOS02_CONFIG used
  # to live here. They pointed at configs/nodes/, which the talhelper cutover archived to
  # .scratch/__configs/nodes/. They were briefly repointed at that archive so any task still
  # reading them would fail on an obviously-archived path rather than silently trust a
  # months-old hand-maintained config. gen-config and apply-config were the only consumers and
  # both now read the generated per-node files, so the vars are gone — nothing can reach the
  # archive at all, which is a stronger version of the same guarantee.
  #
  # ⚠️ configs/talosconfig below is the LIVE admin credential and was deliberately left at the
  # same path by the cutover. Do not point anything at clusterconfig/talosconfig instead.

tasks:
  # ============================================
  # Configuration Generation
  # ============================================

  gen-config:
    desc: Generate every node's machine config from configs/talconfig.yaml
    summary: |
      Regenerates configs/clusterconfig/catalyst-cluster-<node>.yaml for all five nodes.
      Local only — writes files, touches no node.

      REPLACED `talosctl gen config ... --output-dir ./configs` (TALOS-ow7w). That was wrong
      in two ways once talhelper took over:

        - It minted a FRESH secrets bundle with no relation to configs/talsecret.yaml, so the
          configs it produced carried a certificate authority no node in this cluster trusts.

        - It wrote talosconfig into ./configs/ — the exact path where the live admin
          credential lives, and the path every task in this repo passes to talosctl.

      Today that combination merely errors, because `gen config` refuses to overwrite an
      existing file and configs/talosconfig is present. On a fresh clone it would not: that
      file is gitignored, so there would be nothing to refuse, and the command would quietly
      write a talosconfig for a cluster that does not exist. Every subsequent task would then
      fail TLS against the real cluster for reasons pointing nowhere near this task.

      Control-plane metrics exposure — the reason for the old --config-patch-control-plane
      flag (TALOS-hzl0) — is now declared in configs/patches/controlplane-baseline.yaml and
      applied by talhelper to every control plane, so it survives a rebuild the same way.
    cmds:
      - cd configs && talhelper genconfig
      - 'echo "✅ Generated configs/clusterconfig/ — gitignored, they carry certs and tokens"'
      - 'echo "   Next → task talos:verify-dry-run   (what applying these would actually do)"'

  # ============================================
  # Node Provisioning
  # ============================================

  apply-config:
    desc: "Apply the generated config to ONE node (required: NODE=talos03. INSECURE=true for maintenance mode)"
    summary: |
      Applies configs/clusterconfig/catalyst-cluster-<NODE>.yaml to that one node.
      DESTRUCTIVE — most machine-config changes reboot the node.

      Takes a NODE HOSTNAME, not an IP, and no longer defaults to anything:
          task talos:apply-config NODE=talos03

      Note there is no `--` before NODE=. go-task only binds variables in the bare form;
      `task talos:apply-config -- NODE=talos03` puts the whole string into CLI_ARGS and
      leaves NODE empty. Several older descs in this file still show the `--` form.

      It used to read a single hardcoded controlplane.yaml and target whatever TALOS_NODE
      happened to be, which silently assumed every node shared one config. They do not — each
      of the five has its own install disk, factory schematic and patch set, so applying one
      node's config to another would rewrite its extensions and its install target.

      Regenerates before applying, so you can never ship a stale generated file, and asks
      talhelper for the command so the node/file pairing comes from talconfig.yaml rather than
      from a hand-written mapping that could rot.

      RUN `task talos:verify-dry-run` FIRST. It asks the node what this apply would actually
      do — including whether it reboots — and that check has caught changes whose blast radius
      was not visible in the manifest.

      INSECURE=true is for a node in maintenance mode only (freshly booted, no config, no
      certs yet). On a configured node it will fail; that is correct, not a bug to work around.
    prompt: This applies a machine config to {{.NODE}} and will most likely REBOOT it. Continue?
    cmds:
      - |
        set -euo pipefail
        NODE="{{.NODE}}"
        if [ -z "$NODE" ]; then
          echo "✗ NODE is required — this task no longer guesses which node you mean." >&2
          echo "" >&2
          echo "  task talos:apply-config NODE=<hostname>       (no '--' — it would not bind)" >&2
          echo "" >&2
          echo "  Nodes declared in configs/talconfig.yaml:" >&2
          grep -E '^[[:space:]]+- hostname:' configs/talconfig.yaml | awk '{print "    " $3}' >&2
          exit 1
        fi
        cd configs
        # Regenerate first: applying a clusterconfig/ file that predates the current
        # talconfig.yaml would push config the repo no longer describes.
        talhelper genconfig
        # Fails loudly on an unknown hostname rather than applying to the wrong machine.
        CMD=$(talhelper gencommand apply -n "$NODE" {{if eq .INSECURE "true"}}--extra-flags=--insecure{{end}})
        echo "→ $CMD"
        eval "$CMD"
    vars:
      NODE: '{{.NODE | default ""}}'
      INSECURE: '{{.INSECURE | default "false"}}'

  bootstrap:
    desc: Bootstrap etcd on the control plane node
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} bootstrap
      - echo "✅ Cluster bootstrapped! Waiting for Kubernetes..."
      - sleep 30

  patches:
    desc: "SUPERSEDED — kubelet patches are declared in talconfig.yaml; prints where they went"
    summary: |
      Kept so the muscle memory lands on an explanation instead of "no such file".

      This applied iSCSI/local-path extraMounts, maxPods, memory reserves and image GC to
      every node with `talosctl patch mc`. All of it is now declared in
      configs/talconfig.yaml (patches/all-kubelet-baseline.yaml, patches/maxpods-200.yaml,
      patches/talos03-maxpods.yaml) and applied by talhelper. Running both mechanisms is what
      produced the drift this cluster migrated to talhelper to stop.

      It had also been aborting on a malformed patch path for some time, so it was not
      actually applying anything. See scripts/bootstrap-talos-patches.sh for the details.

      Use task talos:verify-dry-run, task talos:verify, or task talos:apply-config NODE=<host>.
    cmds:
      - ./scripts/bootstrap-talos-patches.sh

  patches-check:
    desc: "SUPERSEDED — use task talos:verify-dry-run instead"
    summary: |
      The read-only half of the superseded patch bootstrap. `task talos:verify-dry-run` is the
      real answer to the question this used to answer: it asks each node what applying the
      generated config would actually do, against the machine rather than against a plan.
    cmds:
      - ./scripts/bootstrap-talos-patches.sh --check

  provision:
    desc: "Plan a from-scratch cluster rebuild (read-only — prints the command sequence, applies nothing)"
    summary: |
      Runs preflight, regenerates the machine configs, and prints the exact ordered talhelper
      command sequence a five-node rebuild needs. IT APPLIES NOTHING.

      It used to apply a config and bootstrap etcd directly, back when the cluster was one
      node and one controlplane.yaml. It is not either of those things any more. See the
      header of scripts/provision.sh for why a faithful automated port was not attempted.

      Refuses outright if any node in talconfig.yaml already answers the Talos API — for a
      live cluster you want task talos:verify or task talos:verify-dry-run instead.
    cmds:
      - ./scripts/provision.sh

  # ============================================
  # Cluster Management
  # ============================================

  health:
    desc: Check Talos cluster health
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} health --server=false

  version:
    desc: Get Talos version
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} version

  dashboard:
    desc: Open Talos dashboard
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} dashboard

  # ============================================
  # Services
  # ============================================

  services:
    desc: List all Talos services
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} services

  service-logs:
    desc: Get logs for a specific service (use -- SERVICE=kubelet)
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} logs {{.SERVICE}}
    vars:
      SERVICE: '{{.SERVICE | default "kubelet"}}'

  logs-follow:
    desc: Follow logs for a service (use -- SERVICE=kubelet)
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} logs --follow {{.SERVICE}}
    vars:
      SERVICE: '{{.SERVICE | default "kubelet"}}'

  # ============================================
  # Troubleshooting
  # ============================================

  dmesg:
    desc: View kernel logs
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} dmesg

  shell:
    desc: Get interactive shell (limited in Talos)
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} shell

  containers:
    desc: List running containers
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} containers

  # ============================================
  # Node Operations
  # ============================================

  reboot:
    desc: Reboot the node
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} reboot
    prompt: This will reboot the node. Continue?

  shutdown:
    desc: Shutdown a single node (defaults to control plane via TALOS_NODE)
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} shutdown
    prompt: This will shutdown the node. Continue?

  shutdown-cluster:
    desc: Gracefully shut down the entire cluster (workers in parallel, control plane last)
    cmds:
      - ./scripts/shutdown-cluster.sh {{.CLI_ARGS}}

  upgrade-cluster:
    desc: Upgrade all Talos nodes to a target version (walks through intermediate minors). Pass version via CLI_ARGS, e.g. `task talos:upgrade-cluster -- v1.13.0`
    cmds:
      - ./scripts/upgrade-talos.py {{.CLI_ARGS}}

  upgrade-cluster-legacy:
    desc: Legacy bash upgrade script (kept for fallback). Prefer talos:upgrade-cluster.
    cmds:
      - ./scripts/upgrade-talos-version.sh {{.CLI_ARGS}}

  reset:
    desc: Reset the node (DESTRUCTIVE - wipes all data)
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} reset --graceful=false --reboot
    prompt: This will WIPE ALL DATA on the node. Are you sure?

  upgrade:
    desc: Upgrade Talos (use -- VERSION=v1.11.1)
    cmds:
      - >-
        talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}}
        upgrade --image ghcr.io/siderolabs/installer:{{.VERSION}}
    vars:
      VERSION: '{{.VERSION | default "v1.11.1"}}'

  upgrade-k8s:
    desc: Upgrade Kubernetes components (kubelet + control plane) cluster-wide, no node reboots. Pass version via CLI_ARGS, e.g. `task talos:upgrade-k8s -- 1.34.10`
    summary: |
      Runs `talosctl upgrade-k8s` against the control plane node. This rolls the
      kubelet image and kube-apiserver/controller-manager/scheduler static pods
      on every node to the target version by patching machine configs in place.
      ⚠️ AFTERWARDS, BUMP `kubernetesVersion:` IN configs/talconfig.yaml BY HAND. Nothing
      does it for you — this task is a bare talosctl call with no wrapper script. Leave it
      and the repo declares the old version while the cluster runs the new one, so
      `task talos:verify` reports permanent drift and the next `task talos:apply-config`
      DOWNGRADES that node's kubelet back.

      (The Talos-version equivalent is handled: scripts/upgrade-talos.py bumps
      `talosVersion:` itself after a successful upgrade. There is no such hook here.)
      NOTE: k8s v1.34.0 had a regression (kubernetes/kubernetes#133847) that
      dropped all kubelet_volume_stats_* metrics from the kubelet /metrics
      endpoint (fixed in v1.34.2) — stay on >= v1.34.2 so PVC usage dashboards work.
    cmds:
      - >-
        talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}}
        upgrade-k8s --to {{.CLI_ARGS}}

  # ============================================
  # Config Management
  # ============================================

  config-merge:
    desc: Merge talosconfig to default location (~/.talos/config)
    cmds:
      - talosctl config merge {{.TALOSCONFIG}}
      - echo "✅ Config merged to ~/.talos/config"

  config-info:
    desc: Show current Talos config info
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} config info

  # ============================================
  # Network Troubleshooting
  # ============================================

  ping:
    desc: Ping the Talos node
    cmds:
      - ping -c 4 {{.TALOS_NODE}}

  check-api:
    desc: Check if Talos API is responding
    cmds:
      - curl -k https://{{.TALOS_NODE}}:50000/version 2>&1 | head -10

  # ============================================
  # Etcd Operations
  # ============================================

  etcd-members:
    desc: List etcd members
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} etcd members

  etcd-status:
    desc: Get etcd status
    cmds:
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} etcd status

  # ============================================
  # Config drift detection (TALOS-frvi)
  # ============================================

  verify:
    desc: "Compare every node's LIVE machine config against what talconfig would generate"
    summary: |
      Detects configuration drift — the class of problem that motivated TALOS-0bo8.

      Every machine-config change in this cluster was historically applied by hand with
      `talosctl patch mc`, so the nodes and the repo could disagree with nothing to notice.
      They did: two GPU workers had every kubelet mount declared twice, controller-manager
      bind-address existed on one control plane out of three, and the udev rules granting
      Plex its GPU existed only on the nodes.

      This regenerates from talos/talconfig.yaml and diffs against the live nodes.

      SKIPS NOTHING. Values whose key looks secret-bearing are compared by SHA-256 prefix, so
      a change is still detected without the value reaching your terminal. An earlier version
      had a skip list and it hid a real regression — certSANs being silently stripped from
      the kube-apiserver certificate.

      Reads all documents, not just the first. talhelper emits a multi-document config and
      the reboot-causing change lives in the second one.

      Output is differences, not a pass/fail: some are EXPECTED (drift being corrected) and
      some are talhelper's own behaviour. See docs/05-runbooks/talhelper-cutover.md for the
      taxonomy of what is normal.
    cmds:
      - |
        if ! command -v talhelper >/dev/null 2>&1; then
          echo "talhelper not installed — brew install talhelper"; exit 1
        fi
      - cd configs && talhelper genconfig
      - TALOSCONFIG={{.TALOSCONFIG}} python3 configs/verify-diff.py

  verify-dry-run:
    desc: "Ask each node what applying the generated config would actually do (read-only)"
    summary: |
      Runs `talosctl apply-config --dry-run` against every node and prints the mode line plus
      the real diff hunks.

      THIS IS THE AUTHORITATIVE CHECK. It compares against the actual machine rather than
      against any model of it, and it is how both certSANs regressions and the fleet-wide
      reboot were found — none of which the offline differ could see.

      Applies nothing. Safe to run any time.
    cmds:
      - |
        for N in "talos00 192.168.1.54" "talos01 192.168.1.177" "talos02-gpu 192.168.1.144" \
                 "talos03 192.168.1.30" "talos06 192.168.1.19"; do
          set -- $N
          echo "── $1 ($2) ──"
          TALOSCONFIG={{.TALOSCONFIG}} talosctl -n $2 apply-config --dry-run \
            --file configs/clusterconfig/catalyst-cluster-$1.yaml 2>&1 | head -60
          echo
        done

