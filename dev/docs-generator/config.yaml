# docsgen configuration — the ONLY file that should need editing when porting this tool.
#
# Everything here is repo-specific. The Go beside it knows nothing about Talos, Flux or beads by
# name; it knows there is *a* way to enumerate components and *a* ticket shape, and reads both
# from here. Copy dev/docs-generator/ into another repo, rewrite this file, and it works.

# ---------------------------------------------------------------------------------------------
# What to scan
# ---------------------------------------------------------------------------------------------
# The walker is `git ls-files`, so gitignored paths are already excluded — .direnv, .scratch,
# .output and the ~10 full repo copies under .claude/worktrees/ never appear. These patterns are
# for TRACKED files that should still be skipped.
exclude:
  # Archived docs are episodic history: correct as of their date, deliberately frozen, and full
  # of links to each other and to since-moved paths. Linting them would produce ~67 permanent
  # findings that nobody will ever action, which is how a linter gets switched off.
  - docs/_archive/**
  - .claude/**
  # The integration samples are FIXTURES: they ship deliberate dead links, banned frontmatter
  # keys and malformed manifests because that is what the specs assert on. Linting them would
  # attribute those planted defects to this repo and bury the real findings underneath them.
  - dev/docs-generator/integration/testdata/**

ticket_pattern: '\bTALOS-[0-9a-z]{2,6}(?:\.\d+)*\b'

# ---------------------------------------------------------------------------------------------
# How components are enumerated
# ---------------------------------------------------------------------------------------------
# Flux Kustomizations, not the directory tree. The tree alone is ambiguous: some directories are
# GROUPING dirs whose children are each their own component (security/crowdsec, security/falco —
# this is the CORRECT pattern), while others are one Kustomization wrapping many nested ones.
# Only Flux names the real deployable boundary. The `component-shape` rule reports the second
# case rather than the code silently working around it.
#
# slug_from: filename — the filename is the stable handle. metadata.name drifts from it in this
# repo (external-secrets.yaml declares external-secrets-operator, kube-system.yaml declares
# kube-system-utils), and a slug that changes when someone renames a field is not a slug.
components:
  kind: flux
  path: clusters/catalyst-cluster
  glob: "*.yaml"
  slug_from: filename

# ---------------------------------------------------------------------------------------------
# Frontmatter vocabulary
# ---------------------------------------------------------------------------------------------
# Closed enums on purpose. An open vocabulary in a repo this size becomes forty singletons that
# nobody can query and no generator can group by.
doc_types:
  - nav # index/README whose job is summarising children
  - guide # first-time walkthrough; reader is calm and learning
  - runbook # ordered procedure with a stop condition; reader is mid-incident
  - architecture # how a thing is built and why; read before changing it
  - decision # a choice was made and is binding until superseded
  - reference # lookup table you scan rather than read
  - record # dated artifact of what was true then; frozen by definition
  - meta # docs about this repo's own process

statuses:
  - current # describes reality; trust it
  - draft # proposed; not reality yet, so exempt from subject-drift staleness
  - stale # known-wrong, not yet fixed
  - superseded # replaced; requires superseded_by

freshness:
  - tracks-code # stale when the code it covers moves ahead of it
  - tracks-cluster # subject is live cluster state, which git cannot see
  - frozen # dated artifact; structurally cannot go stale

# Per-type rot model. `record` and `decision` are frozen, which makes dated artifacts incapable
# of producing a false staleness hit — that is correct, not a loophole.
freshness_default:
  nav: tracks-code
  guide: tracks-code
  runbook: tracks-code
  architecture: tracks-code
  meta: tracks-code
  reference: tracks-cluster
  record: frozen
  decision: frozen

# Keys that must never appear, each with the reason. `title` is not a style preference: verified
# against this repo's pinned markdownlint 0.41.1, a title key both silently disables MD041 AND
# turns every existing H1 into an MD025 duplicate-heading error. Every doc here has an H1.
banned_keys:
  title: "disables MD041 and makes the H1 an MD025 duplicate — verified against markdownlint 0.41.1"
  created: "git knows; three docs already carry a lying **Last Updated** footer"
  updated: "git knows"
  last_reviewed: "git knows; a hand-maintained review date is the rot this tool removes"
  owner: "dual-gitops.md credits an Infrastructure Team that does not exist"
  maintained_by: "same — fiction consumed by nothing"
  description: "duplicates the H1 and TL;DR; use bluf, which has no body twin"
  related: "duplicates the ## Related Issues footer 47 docs already carry"

key_order:
  - type
  - status
  - covers
  - freshness
  - tickets
  - bluf # Bottom Line Up Front: the one-sentence answer, before any context
  - superseded_by
  - pinned

# A doc whose covered paths bottom out at one of these is cross-cutting and belongs in docs/.
# Note what is NOT here: infrastructure/base/security. Four sibling components sharing that
# parent is a legitimate colocation target, not a grouping root.
grouping_roots:
  - ""
  - "."
  - infrastructure
  - infrastructure/base
  - applications
  - bootstrap
  - clusters

# Structural expectations per type — this is what stops `type:` becoming a decorative label.
# Derived from CLAUDE.md's Documentation Pattern (TL;DR -> Quick Reference -> Deep Dive).
type_requires:
  runbook: ["## TL;DR"]
  architecture: ["## TL;DR"]
  guide: ["## TL;DR"]

required_footer: "## Related Issues"

# Ticket EXISTENCE checking. ticket_pattern above validates spelling only, so `TALOS-kll8` -- a
# one-character typo of a real ticket -- matches it perfectly and refers to nothing. With a
# backend configured, every `tickets:` entry matching the pattern is checked against the real
# tracker. Closed tickets are valid: citing completed work is correct history, not drift.
#
# Leave backend empty in a repo with no tracker; the rule then does nothing rather than failing.
# If the backend IS configured but unreachable, the rule reports itself as SKIPPED instead of
# passing quietly -- a check that silently stops running is the failure mode this tool exists to
# remove.
tickets:
  backend: beads

# ---------------------------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------------------------
# Severity is data, not code. Everything starts at warn because ~67 docs predate the taxonomy —
# day-one findings are the migration worklist, not a regression. Promote to error per rule as
# each is burned down. A linter that lands red on an existing codebase gets switched off.
rules:
  broken-links: { enabled: true, severity: error } # unambiguous and already 154 strong
  frontmatter-schema: { enabled: true, severity: error } # only fires once frontmatter exists
  covers-resolves: { enabled: true, severity: error }
  component-path: { enabled: true, severity: warn } # 1 known failure: catalyst-llm
  component-shape: { enabled: true, severity: warn } # the directory-shape smell, measured
  colocation: { enabled: true, severity: warn }
  tickets-in-body: { enabled: true, severity: warn }
  tickets-exist: { enabled: true, severity: warn } # warn until the backlog is verified clean
  taxonomy-structure: { enabled: true, severity: warn }

# ---------------------------------------------------------------------------------------------
# Generated artifacts
# ---------------------------------------------------------------------------------------------
# The generated document set. Everything here was a Go string constant until it was not, and the
# reason is the whole point of the file: `type: reference`, `covers: cluster`, `TALOS-kll3` and a
# `## Related Issues` footer are correct for THIS repo and are an out-of-enum type, another
# project's tickets and the wrong footer for any other. docsgen was generating a document
# docsgen itself rejects, and only got away with it because nothing linted the result.
#
# There is deliberately no default for `type`, `status` or `freshness`. A default is the same
# constant wearing a config key. Omit one and the pre-write gate refuses to write at all, naming
# the key — which is the behaviour that makes emitting a rejected document impossible rather
# than merely unlikely.
docs_root: docs

artifacts:

  # KNOWLEDGE PROJECTION. Claims live as comments beside the code they constrain; this renders
  # an INDEX of them into the component README, so they are discoverable without the prose
  # having to move. Destination is derived from `root` matched against each claim's `scope`,
  # not declared per-claim — a hand-maintained list of destinations rots exactly like the
  # hand-maintained list of links this generator replaced.
  crowdsec-knowledge:
    renderer: knowledge
    root: infrastructure/base/security/crowdsec
    path: README.md
    region: knowledge
  honeypots-knowledge:
    renderer: knowledge
    root: infrastructure/base/security/honeypots
    path: README.md
    region: knowledge
  component-inventory:
    # Relative to docs_root, so moving the documentation tree moves every artifact with it.
    path: 07-reference/component-inventory.md
    # Rendered in key_order above by a deterministic writer, NOT by yaml.Marshal: that reorders
    # keys (which this repo's own frontmatter-schema rule then reports) and may emit
    # `covers: [cluster]` as a flow sequence, which prettier explodes — at which point the
    # generated file stops being a prettier fixed point and `docsgen check` reports drift it
    # caused itself. No key below is special to the Go.
    front:
      type: reference
      status: current
      covers: [cluster]
      # Overrides the per-type default (reference -> tracks-cluster) because this artifact is
      # derived from git-tracked manifests rather than from live cluster state: it goes stale
      # when clusters/catalyst-cluster moves, which git can see.
      freshness: tracks-code
      tickets: [TALOS-kll3, TALOS-f0sd]
      bluf: Every Flux Kustomization in clusters/catalyst-cluster, with the manifest that declares it, whether it has a colocated README, and how many nested kustomizations it wraps.
    # The footer's ticket LIST comes from front.tickets — which is what makes tickets-in-body
    # self-satisfying — and these are the annotations beside each id. A note for a ticket that
    # is not in front.tickets is a config error, because dead config looks exactly like config
    # that stopped working.
    ticket_notes:
      TALOS-f0sd: "docs as a projection: frontmatter, linting, generation"
      TALOS-kll3: the generator and its whole-file artifacts

  # A SECTION inventory: the same renderer over a subset, landing beside the manifests it
  # describes rather than in docs/. `infrastructure/base/security` is deliberately absent from
  # grouping_roots above — four sibling components sharing that parent is a legitimate
  # colocation target — so this file is exactly where the `colocation` rule wants it.
  #
  # It exists because the alternative is a hand-written members list in the section README, and
  # that list is wrong the moment a fifth component lands in the folder. Nothing would report it.
  security-inventory:
    # The renderer is the component inventory; only the SUBSET differs. Without this key a
    # second inventory would mean a Go edit, which is the defect config.yaml exists to remove.
    renderer: component-inventory
    # Outside docs_root on purpose — and the only supported way out, because `path` may not
    # escape its root.
    root: infrastructure/base/security
    path: components.md
    scope:
      path_prefix: infrastructure/base/security
    front:
      type: reference
      status: current
      # `path:` rather than the four slugs: the scope is the directory, and listing the slugs
      # would be the hand-maintained membership list this file exists to delete. The longest
      # common ancestor of a `path:` cover is the directory itself, which is where this doc
      # lives — so `colocation` is satisfied by construction rather than by a `pinned:` excuse.
      covers: [path:infrastructure/base/security]
      # Derived from git-tracked manifests, not from live cluster state, so `tracks-code`
      # overrides the reference default.
      freshness: tracks-code
      tickets: [TALOS-f0sd.5]
      bluf: The Flux Kustomizations whose manifests live under infrastructure/base/security, with whether each has a colocated README and how many nested kustomizations it wraps.
    ticket_notes:
      TALOS-f0sd.5: artifact scoping, which is what makes a per-section inventory possible

  # ---------------------------------------------------------------------------------------------
  # Navigation tables — MARKER-REGION artifacts
  # ---------------------------------------------------------------------------------------------
  # Everything below writes ONE SPAN inside a hand-written document, delimited by
  #
  #   <!-- docs:gen:<region> -->   …   <!-- /docs:gen:<region> -->
  #
  # and copies every other byte through untouched. That is not a convenience: INDEX.md and the
  # section READMEs carry editorial prose — a grounding-pass note, "Key Concepts", a list of known
  # contradictions between docs — that no generator can reproduce and nobody can reconstruct. A
  # whole-file artifact pointed at one of these would delete it on the first run.
  #
  # A marker-owned file whose markers are missing, unbalanced or nested is a HARD ERROR naming the
  # file. docsgen never appends and never falls back to whole-file ownership; see region.go.
  #
  # These entries carry no `front:` and no `ticket_notes:` — a region writes no frontmatter and no
  # footer, and the validator refuses both rather than accept config that renders nowhere.
  #
  # WHY THIS EXISTS: 58 rows across these nine files pointed at documents that were DELETED with
  # `docs/_archive/`. Not moved — deleted, with nothing to repoint them at. A row derived from the
  # tree cannot reach that state, and the `bluf:` in each target's own frontmatter is what carries
  # the curated one-liner through a regeneration.

  # docs/README.md — the section table, and nothing else in the file.
  nav-docs-root:
    renderer: nav
    path: README.md
    region: nav-sections
    nav:
      entries: sections
      dir: docs
      description_key: bluf

  # docs/INDEX.md owns TWO regions, because it indexes two different things: the sections, and
  # the loose documents at the top of the tree. Two enumerations, two tables, two regions — which
  # is exactly the case validateArtifactOwnership allows and the same-region case it refuses.
  nav-index-sections:
    renderer: nav
    path: INDEX.md
    region: nav-sections
    nav:
      entries: sections
      dir: docs
      description_key: bluf

  nav-index-root-docs:
    renderer: nav
    path: INDEX.md
    region: nav-root-docs
    nav:
      # `siblings` skips every README.md: a section's README is its own nav and is indexed by the
      # sections table above, where it stands for the whole section.
      entries: siblings
      dir: docs
      description_key: bluf

  # The section READMEs. Each omits `nav.dir` on purpose — it defaults to the directory the
  # artifact itself lives in, so a section indexes itself and there is no path in config that can
  # disagree with where the file actually is.
  nav-getting-started:
    renderer: nav
    path: 01-getting-started/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }

  nav-architecture:
    renderer: nav
    path: 02-architecture/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }

  nav-operations:
    renderer: nav
    path: 03-operations/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }

  nav-project-management:
    renderer: nav
    path: 06-project-management/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }

  nav-reference:
    renderer: nav
    path: 07-reference/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }

  nav-monitoring:
    renderer: nav
    path: 08-monitoring/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }

  nav-patterns:
    renderer: nav
    path: patterns/README.md
    region: nav
    nav: { entries: siblings, description_key: bluf }
