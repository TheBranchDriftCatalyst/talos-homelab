# A Kustomization with no spec.path. There is no directory for a doc to live beside, so it is
# not a component; the loader warns and skips it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: no-path
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: orchard
