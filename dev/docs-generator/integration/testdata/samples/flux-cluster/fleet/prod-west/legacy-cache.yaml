# spec.path points at a directory that is NOT in this repo. Flux reports this as a failed
# reconcile while the last applied revision keeps running, so the cluster looks healthy and
# nothing surfaces it. The `component-path` rule is the thing that surfaces it.
#
# The finding is attributed to THIS manifest, so the declaration lives here. One grammar for
# every file type is what keeps a non-doc finding from having to be declared in a side table.
# EXPECT: component-path
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: legacy-cache
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/legacy-cache
  prune: true
  sourceRef:
    kind: GitRepository
    name: orchard
