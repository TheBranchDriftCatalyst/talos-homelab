# The far end of the only multi-level chain in this sample:
#   gateway-controller <- orchard-api <- orchard-web
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orchard-web
  namespace: flux-system
spec:
  interval: 10m
  path: ./workloads/orchard-web
  prune: true
  dependsOn:
    - name: orchard-api
  sourceRef:
    kind: GitRepository
    name: orchard
