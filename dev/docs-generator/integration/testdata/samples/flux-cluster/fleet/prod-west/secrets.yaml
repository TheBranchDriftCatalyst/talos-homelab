# TWO Kustomizations in ONE file. This is the shipped bug this sample exists to pin: under
# filename-slugging both collapsed to the slug `secrets`, Ctx.BySlug kept whichever decoded
# last, and `covers: secrets` then resolved to an arbitrary one of two different paths — which
# silently produced an arbitrary colocation verdict with nothing reporting it.
#
# Both rows MUST appear, with DISTINCT slugs taken from metadata.name.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/secrets-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: orchard
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-store
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/secrets-store
  prune: true
  dependsOn:
    - name: secrets-operator
  sourceRef:
    kind: GitRepository
    name: orchard
