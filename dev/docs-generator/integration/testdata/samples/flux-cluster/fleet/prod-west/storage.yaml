# One slug wrapping four nested kustomizations plus its own. That is the directory-shape smell:
# all five units deploy, but only the wrapper has a name, so "component = directory = doc home"
# is untrue for it. `component-shape` reports it (threshold is 3).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-stack # deliberately NOT the filename: slug stays `storage`
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/storage
  prune: true
  sourceRef:
    kind: GitRepository
    name: orchard
