# docsgen configuration for the `flux-cluster` integration sample.
#
# This file exists to PROVE THE PORTABILITY CLAIM in the tool's own package docs: "copy
# dev/docs-generator/ into another repo, edit the YAML, and it works — no Go changes."
#
# So every value here is deliberately DIFFERENT from talos-homelab's real config.yaml. The
# cluster lives in fleet/prod-west rather than clusters/catalyst-cluster, components live under
# platform/ and workloads/ rather than infrastructure/base/, docs live in handbook/ rather than
# docs/, tickets are ORCH-nnn rather than TALOS-xxxx, the footer is `## Tracking` rather than
# `## Related Issues`, and the doc-type vocabulary shares only the words any repo would use.
#
# Anything this sample CANNOT express without editing Go is a portability defect, and is
# recorded in integration/README.md rather than worked around here.

exclude:
  # The attic is frozen history: correct as of its date, full of links to since-moved paths.
  # handbook/_attic/retired-plan.md is a deliberate minefield — banned keys, dead links, a
  # bogus type. It must produce ZERO findings, which is how this sample pins `exclude`.
  - handbook/_attic/**
  - .orchard/**

# NOTE: nothing in the Go reads this. See integration/README.md, "dead config keys".
ticket_pattern: '\bORCH-\d{3}\b'

components:
  kind: flux
  path: fleet/prod-west
  glob: "*.yaml"
  slug_from: filename

# A deliberately different vocabulary: overview (not nav), design (not architecture),
# adr (not decision), table (not reference), journal (not record). `guide` and `runbook` are
# kept because they are words any repo uses, and because `runbook` is the one type whose
# structural check is hardcoded in Go and would otherwise get no coverage at all.
doc_types:
  - overview
  - guide
  - runbook
  - design
  - adr
  - table
  - journal

statuses:
  - current
  - draft
  - stale
  - superseded # the value `superseded` is hardcoded in rules.go; it cannot be renamed

freshness:
  - follows-code
  - follows-cluster
  - frozen # the value `frozen` is hardcoded in main.go; it cannot be renamed

freshness_default:
  overview: follows-code
  guide: follows-code
  runbook: follows-code
  design: follows-code
  adr: frozen
  table: follows-cluster
  journal: frozen

banned_keys:
  title: "disables MD041 and makes the H1 an MD025 duplicate"
  author: "git knows who wrote it, and the answer here is always wrong within a quarter"
  sla: "an availability target belongs in the service catalogue, not in prose"

key_order:
  - type
  - status
  - covers
  - freshness
  - tickets
  - summary
  - superseded_by
  - pinned

grouping_roots:
  - ""
  - "."
  - platform
  - workloads
  - fleet

type_requires:
  guide: ["## Start here"]
  runbook: ["## Stop condition"]
  design: ["## Context"]

required_footer: "## Tracking"

rules:
  broken-links: { enabled: true, severity: error }
  frontmatter-schema: { enabled: true, severity: error }
  covers-resolves: { enabled: true, severity: error }
  component-path: { enabled: true, severity: warn }
  component-shape: { enabled: true, severity: warn }
  colocation: { enabled: true, severity: warn }
  tickets-in-body: { enabled: true, severity: warn }
  taxonomy-structure: { enabled: true, severity: warn }

# The documentation root. This sample's prose lives in handbook/, and nothing in this repo has a
# docs/ directory at all — which is the point. Both the generated artifact's destination and the
# `colocation` rule's cross-cutting verdict read this key, because they used to be the same
# hardcoded `docs/` and a repo cannot opt out of a string constant.
docs_root: handbook

# Every value below is this repo's vocabulary, not talos-homelab's: `table` rather than
# `reference`, `follows-cluster` rather than `tracks-cluster`, `summary` rather than `bluf`,
# ORCH tickets rather than TALOS ones, and a `## Tracking` footer. If any of them reappears in
# the generated file as the OTHER repo's spelling, the generator is emitting constants again.
artifacts:
  # Knowledge projection into a README that already exists: region only.
  gateway-knowledge:
    renderer: knowledge
    root: platform/gateway
    path: README.md
    region: knowledge
  # Inline-doc projection into the same existing README, a SECOND region in one file.
  gateway-inline:
    renderer: folder-readme
    root: platform/gateway
    path: README.md
    region: inline-docs
  component-inventory:
    path: reference/component-inventory.md
    front:
      type: table
      status: current
      covers: [cluster]
      freshness: follows-cluster
      tickets: [ORCH-204, ORCH-201]
      summary: Every Flux Kustomization in fleet/prod-west, with the manifest that declares it, whether it has a colocated README, and how many nested kustomizations it wraps.
    ticket_notes:
      ORCH-201: the component inventory artifact
      ORCH-204: documentation taxonomy and linting

  # A SCOPED artifact: the SAME renderer over a SUBSET of the components.
  #
  # `scope:` is what turns a whole-repo inventory into a members table for one section. Omitting
  # it — as component-inventory above does — covers every component, which is why that artifact's
  # bytes did not move when scoping landed.
  #
  # This one keeps the default root (docs_root, `handbook/`) because `platform` is a
  # grouping_root here, so the colocation rule sends a doc covering it to the documentation
  # root. The plain-dirs sample exercises the other half — an artifact with a `root:` of its own,
  # OUTSIDE the documentation tree.
  platform-inventory:
    # Without `renderer:` this key would have to BE a renderer name, and a second inventory
    # would cost a Go edit — the defect this config file exists to remove.
    renderer: component-inventory
    path: reference/platform-inventory.md
    scope:
      path_prefix: platform
    front:
      type: table
      status: current
      covers: [path:platform]
      freshness: follows-cluster
      tickets: [ORCH-201]
      summary: The Kustomizations under platform/, which is the half of this cluster the platform team owns.
    ticket_notes:
      ORCH-201: the component inventory artifact

  # A MARKER-REGION artifact: it writes only the span between `<!-- docs:gen:nav -->` and its
  # closing marker inside handbook/reference/README.md, and copies every other byte of that file
  # through untouched. `nav.dir` is omitted on purpose — it defaults to the directory the
  # artifact itself lives in.
  #
  # `description_key: summary` is this sample's spelling, not talos-homelab's `bluf`. That is the
  # evidence the key is config: a hardcoded one would make every description here fall back to
  # the H1 while looking like it worked.
  reference-nav:
    renderer: nav
    path: reference/README.md
    region: nav
    nav:
      entries: siblings
      description_key: summary
