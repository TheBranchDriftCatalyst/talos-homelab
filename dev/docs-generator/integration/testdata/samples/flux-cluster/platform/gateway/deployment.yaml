# claim(enforced) gateway-replica-floor: the gateway runs at least two replicas so a node
# drain never drops ingress entirely
#   j: docsgen lint -rule component-shape
#   f: replicas drops below 2, or the anti-affinity rule stops being required
#   scope: path:platform/gateway/deployment.yaml
#
# claim(verified@2020-01-01) gateway-port-is-8080: the container listens on 8080, not 80
#   j: grep containerPort platform/gateway/deployment.yaml
#   f: containerPort changes, or a second port is added
#   scope: path:platform/gateway/deployment.yaml
#
# claim(asserted) gateway-no-tls-here: TLS terminates upstream, so this deployment is plain HTTP
#   f: n/a
#
# claim(superseded) gateway-uses-nodeport: the gateway was exposed with a NodePort
#   successor: gateway-uses-loadbalancer
#   scope: path:platform/gateway/deployment.yaml
#
# doc() gateway-role: What the gateway does
#   section: Architecture
#   order: 10
#   Terminates nothing and routes everything. It is the only component in this sample with
#   more than one replica, which is what the replica-floor claim above is about.
#
# diagram() gateway-flow: Request path
#   section: Architecture
#   order: 20
#   flowchart LR
#     client --> gw[gateway]
#     gw --> api[orchard-api]
#     gw --> web[orchard-web]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: registry.example/orchard/gateway:1.0.0
