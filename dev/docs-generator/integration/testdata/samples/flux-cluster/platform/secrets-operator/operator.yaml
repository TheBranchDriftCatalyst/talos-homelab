apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-operator
  template:
    metadata:
      labels:
        app: secrets-operator
    spec:
      containers:
        - name: secrets-operator
          image: registry.example/orchard/secrets-operator:1.0.0
