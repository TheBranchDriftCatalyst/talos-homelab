apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-store
  template:
    metadata:
      labels:
        app: secrets-store
    spec:
      containers:
        - name: secrets-store
          image: registry.example/orchard/secrets-store:1.0.0
