# One component slug wrapping five nested kustomizations: the directory-shape smell, measured.
# `component-shape` attributes its finding to the component DIRECTORY rather than to any file,
# so this declaration names the subject explicitly.
# EXPECT: component-shape on platform/storage
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - components/csi-driver
  - components/snapshotter
  - components/resizer
  - components/backup
