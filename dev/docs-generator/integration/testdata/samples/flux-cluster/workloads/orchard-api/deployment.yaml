apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchard-api
  template:
    metadata:
      labels:
        app: orchard-api
    spec:
      containers:
        - name: orchard-api
          image: registry.example/orchard/orchard-api:1.0.0
