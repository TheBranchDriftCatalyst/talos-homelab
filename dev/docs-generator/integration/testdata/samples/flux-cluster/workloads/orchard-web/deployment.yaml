apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchard-web
  template:
    metadata:
      labels:
        app: orchard-web
    spec:
      containers:
        - name: orchard-web
          image: registry.example/orchard/orchard-web:1.0.0
