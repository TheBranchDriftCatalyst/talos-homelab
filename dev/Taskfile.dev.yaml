# Taskfile for development tools (linting, formatting, hooks)
version: '3'

tasks:
  # ============================================
  # Development Environment Setup
  # ============================================

  setup:
    desc: Show how to get the dev toolchain (nix flake + direnv)
    cmds:
      - |
        echo "The toolchain is declared in flake.nix and loaded by direnv."
        echo
        if [ -d .direnv ]; then
          echo "  ✓ .direnv/ present — the dev shell has been built here before"
        else
          echo "  ✗ .direnv/ missing — run: direnv allow"
        fi
        if command -v direnv >/dev/null 2>&1; then
          echo "  ✓ direnv on PATH"
        else
          echo "  ✗ direnv NOT installed — see https://direnv.net (or run: nix develop)"
        fi
        echo
        echo "First time here:   direnv allow"
        echo "No direnv?         nix develop"
        echo "Secrets:           .env.tpl holds op:// refs; values come from 1Password"
        echo "Git hooks:         installed automatically on direnv entry"

  # ============================================
  # Git Hooks
  # ============================================

  # VERIFY-FIRST, NEVER A BARE INSTALL. `lefthook install` rewrites every hook
  # from lefthook's own template, which SILENTLY DELETED 151 lines across 5
  # tracked hooks here -- the beads integration block, and the exit propagation
  # that is the only reason lefthook can block anything. (TALOS-chgk)
  #
  # The hooks are git-tracked and already active via core.hooksPath, so there is
  # nothing routine to install; the useful operation is checking they are still
  # intact. If they are genuinely absent, restore them from git.
  hooks:install:
    desc: Verify git hooks are intact (does NOT run `lefthook install` -- see comment)
    cmds:
      - task: hooks:verify

  hooks:verify:
    desc: Check the git hooks still carry the beads block + exit propagation
    cmds:
      - ./dev/verify-git-hooks.sh

  hooks:verify:selftest:
    desc: Prove the hook verifier can actually fail (mutation cases)
    cmds:
      - ./dev/verify-git-hooks-selftest.sh

  # Kept as an explicit dead end rather than omitted: someone WILL look for an
  # install task, and a refusal that names the restore command is more useful
  # than silence that sends them to `lefthook install` directly.
  hooks:install:unsafe:
    desc: "Refuses to run -- rewriting hooks destroys the beads block (TALOS-chgk)"
    cmds:
      - |
        echo "Refusing. Rewriting hooks from lefthook templates destroys the" >&2
        echo "beads integration block and the exit propagation in 5 tracked" >&2
        echo "hooks (TALOS-chgk)." >&2
        echo "" >&2
        echo "If the hooks are missing, restore them instead:" >&2
        echo "    git checkout -- .beads/hooks" >&2
        exit 1

  # `lefthook uninstall` deletes hook files. They are git-tracked here so it is
  # recoverable, but it is never the right first move. (TALOS-chgk)
  hooks:uninstall:
    desc: "Uninstall git hooks (deletes tracked files; restore with git checkout)"
    cmds:
      - lefthook uninstall
      # Block scalar: a bare `- echo "...: ..."` is parsed as a MAPPING by YAML,
      # because the quotes do not wrap the whole scalar and `: ` inside it looks
      # like a key separator.
      - |
        echo "Hooks removed. Restore with: git checkout -- .beads/hooks"

  hooks:run:
    desc: Manually run git hooks (use -- HOOK=pre-commit)
    cmds:
      # --no-auto-install: `lefthook run` INSTALLS hooks implicitly, which is the
      # same destructive rewrite as `lefthook install`. (TALOS-chgk)
      - lefthook run --no-auto-install {{.HOOK}}
    vars:
      HOOK: '{{.HOOK | default "pre-commit"}}'

  # ============================================
  # Linting
  # ============================================

  lint:
    desc: Run all linters
    cmds:
      - echo "Running all linters..."
      - task: lint:yaml
      - task: lint:shell
      - task: lint:markdown
      - task: lint:format
      - task: lint:secrets
      - task: lint:theme-drift
      - echo "✅ All linters passed"

  lint:theme-drift:
    desc: Fail if the vendored theme assets have drifted from catalyst-themepark
    # The themepark CSS and the nav script are BUILT ARTIFACTS, published here
    # from the sister repo so kustomize's configMapGenerator can read them
    # in-tree. They were once hand-copied, three copies existed, and all three
    # had diverged -- with the DEPLOYED one a whole rewrite ahead of the file
    # labelled "source". This check is what makes that unrepeatable.
    #
    # Skipped, not failed, when the sister repo is not checked out: this repo
    # must stay lintable on its own.
    cmds:
      - |
        set -eu
        homelab="$(pwd)"
        tp="${CATALYST_THEMEPARK_DIR:-../catalyst-themepark}"
        if [ ! -f "$tp/build.sh" ]; then
          echo "⏭  catalyst-themepark not checked out at $tp — skipping theme drift check"
          exit 0
        fi
        cd "$tp"
        HOMELAB_DIR="$homelab" bash build.sh --check

  # ============================================
  # Helm value-path linting (TALOS-o1sb)
  # ============================================
  # NOT in `lint` and NOT in `ci`, on purpose. `task lint` is already red
  # repo-wide (gotcha #8), so anything added to it is born ignored. This is its
  # own task with its own exit code, so it is enforceable the moment someone
  # wants it enforced -- see dev/helm-values-lint/README.md "Making this a gate"
  # for the sequence (fix or allowlist the 26 current findings, then add
  # `task dev:helm-values:check` to lefthook pre-push or CI).

  helm-values:
    desc: "Flag HelmRelease spec.values keys the chart does not define (offline)"
    cmds:
      - task: helm-values:check

  helm-values:check:
    desc: "Offline: lint every HelmRelease's spec.values against the cached chart schemas"
    cmds:
      - python3 dev/helm-values-lint/helm_values_lint.py check {{.CLI_ARGS}}

  helm-values:refresh:
    # The ONLY networked task here. It `helm pull`s every chart a HelmRelease
    # references and writes a small schema fingerprint per chart+version into
    # dev/helm-values-lint/cache/, which is committed. Run it after any chart
    # version bump; `check` then stays offline and CI-safe.
    desc: "NETWORK: re-pull every referenced chart and rebuild the schema cache"
    cmds:
      - python3 dev/helm-values-lint/helm_values_lint.py refresh {{.CLI_ARGS}}

  helm-values:selftest:
    # Gotcha #11: a check that reports success is not a check that ran. This
    # proves the checker fires -- against a synthetic fixture AND against the
    # real argocd rbac defect read out of git history at d26be8a4^.
    desc: "Prove the checker fires (fixture + the historical argocd rbac defect)"
    cmds:
      - python3 dev/helm-values-lint/helm_values_lint.py selftest

  lint:yaml:
    desc: Lint YAML files with yamllint
    cmds:
      - yamllint -c dev/yamllint.yaml --strict .

  lint:shell:
    desc: Lint shell scripts with shellcheck
    cmds:
      - find scripts -name "*.sh" -exec shellcheck --rcfile=dev/shellcheckrc -x {} +

  # markdownlint-cli2 and prettier come from the flake dev shell now; the glob
  # stays in the COMMAND rather than the config file (see the note at the top
  # of .markdownlint-cli2.yaml).
  lint:markdown:
    desc: Lint markdown with markdownlint-cli2
    cmds:
      - markdownlint-cli2 '**/*.md'

  lint:format:
    desc: Check formatting with prettier
    cmds:
      - prettier --check .

  lint:secrets:
    # THE deliberate full-history deep scan. The pre-push hook deliberately
    # does NOT do this -- it scans only origin/main..HEAD (0.04s vs 5.4s here).
    # Run this after a history rewrite, or periodically, to re-check all
    # ~2174 commits. Suppression comes from .gitleaksignore (the single
    # suppression file; there is intentionally no baseline).
    desc: Full-history secret scan with gitleaks (deep; hook only scans pushed commits)
    cmds:
      - gitleaks detect --verbose --redact

  lint:secrets:report:
    desc: Scan for secrets and generate report
    cmds:
      - mkdir -p .output
      - gitleaks detect --verbose --redact --report-path .output/gitleaks-report.json
      - echo "✅ Report saved to .output/gitleaks-report.json"

  # ============================================
  # Formatting
  # ============================================

  format:
    desc: Format all code
    cmds:
      - echo "Formatting code..."
      - task: format-shell
      - task: format:markdown
      - task: format:prettier
      - echo "✅ Formatting complete"

  format-shell:
    desc: Format shell scripts with shfmt
    cmds:
      - find scripts -name "*.sh" -exec shfmt -w -i 2 -ci -sr {} +

  format:markdown:
    desc: Auto-fix markdown with markdownlint-cli2
    cmds:
      - markdownlint-cli2 --fix '**/*.md'

  format:prettier:
    desc: Format with prettier
    cmds:
      - prettier --write .

  # ============================================
  # Validation
  # ============================================

  validate:
    desc: Validate all infrastructure manifests
    cmds:
      - echo "Validating Kubernetes manifests..."
      - task: validate:kustomize
      - task: validate:k8s
      - echo "✅ All validations passed"

  validate:kustomize:
    desc: Validate all kustomizations build successfully
    cmds:
      - |
        find infrastructure applications -name "kustomization.yaml" -type f 2>/dev/null | while read kfile; do
          dir=$(dirname "$kfile")
          echo "  Validating: $dir"
          kustomize build "$dir" > /dev/null || exit 1
        done

  validate:k8s:
    desc: Validate Kubernetes manifests with kubectl dry-run
    cmds:
      - |
        find infrastructure applications -name "*.yaml" -type f 2>/dev/null | while read file; do
          kubectl apply --dry-run=client -f "$file" 2>&1 | \
            grep -v "Warning: would violate PodSecurity" || true
        done

  # ============================================
  # Tilt (observe-only dashboard against the live cluster)
  # ============================================

  tilt-up:
    desc: Start Tilt (assumes cluster is running)
    cmds:
      - tilt up

  tilt-down:
    desc: Stop Tilt
    cmds:
      - tilt down

  tilt-ci:
    desc: Run Tilt in CI mode (validate without UI)
    cmds:
      - tilt ci

  tilt-logs:
    desc: View Tilt logs for a resource (RESOURCE=<name>)
    cmds:
      - tilt logs {{.RESOURCE}}
    vars:
      RESOURCE: '{{.RESOURCE | default ""}}'

  install-tilt:
    desc: Install Tilt (macOS via Homebrew)
    cmds:
      - |
        if ! command -v tilt &> /dev/null; then
          echo "📦 Installing Tilt..."
          brew install tilt-dev/tap/tilt
          echo "✅ Tilt installed"
        else
          echo "✅ Tilt already installed: $(tilt version)"
        fi

  eso-debug:
    desc: Debug External Secrets Operator and 1Password integration
    cmds:
      - ./scripts/external-secrets/onepassword-debug.sh

  # ============================================
  # TLS / Certificates
  # ============================================

  trust-ca:
    desc: Add homelab-ca root certificate to macOS keychain (eliminates browser warnings)
    cmds:
      - ./scripts/trust-homelab-ca.sh

  trust-ca:check:
    desc: Check if homelab-ca is already trusted in the system keychain
    cmds:
      - ./scripts/trust-homelab-ca.sh --check

  # ============================================
  # CI/CD Simulation
  # ============================================

  ci:
    desc: Run full CI pipeline locally (lint + format + validate)
    cmds:
      - echo "🚀 Running CI pipeline..."
      - task: lint
      - task: validate
      - echo "✅ CI pipeline passed!"

  # ============================================
  # Worktree Hygiene
  # ============================================
  # Claude Code agent/workflow worktrees live at .claude/worktrees/ — full repo
  # checkouts nested INSIDE the repo. They auto-clean only when left pristine, so
  # any repo-wide sed/find that touches them makes them permanently dirty and they
  # accumulate (21 stale worktrees / 358 MB before the first sweep).

  worktree:list:
    desc: Show agent/workflow worktrees with disk usage
    cmds:
      - |
        n=$(ls -1 .claude/worktrees 2>/dev/null | wc -l | tr -d ' ')
        echo "worktrees: ${n:-0}   disk: $(du -sh .claude/worktrees 2>/dev/null | cut -f1 || echo 0)"
        echo "note: 'git worktree list' shows n+1 rows — the extra is the main checkout."
        git worktree list

  worktree:audit:
    desc: Check whether each worktree's work is already merged into main (read-only)
    cmds:
      - ./scripts/worktree-audit.sh

  worktree:clean:
    desc: "DESTRUCTIVE: remove merged worktrees + delete their branches (audits first)"
    cmds:
      - ./scripts/worktree-audit.sh
      - ./scripts/worktree-cleanup.sh

  worktree:guard:
    desc: Find repo-wide tool configs that do NOT exclude .claude/ (the sed-leak class)
    cmds:
      - |
        echo "Configs that must exclude .claude/ AND .direnv/ (both are full repo copies):"
        for f in .prettierignore .markdownlint-cli2.yaml .gitignore dev/yamllint.yaml; do
          [ -f "$f" ] || continue
          miss=""
          grep -q '\.claude' "$f" || miss="$miss .claude"
          grep -q '\.direnv' "$f" || miss="$miss .direnv"
          if [ -z "$miss" ]; then echo "  ✓ $f"; else echo "  ✗ $f  <-- MISSING exclusion:$miss"; fi
        done
        echo
        echo "Habit for ad-hoc sweeps — always scope them:"
        echo "  grep -r ... --exclude-dir=.claude --exclude-dir=node_modules"
        echo "  find . -path ./.claude -prune -o -name '*.yaml' -print"
