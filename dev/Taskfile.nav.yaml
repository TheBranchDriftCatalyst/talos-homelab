# The Catalyst nav operator: build, test, and the phase-6 parity gate.
#
# The module is at infrastructure/base/catalyst-nav/operator — Go source living beside the
# manifests it ships with, the same arrangement as applications/crossplane-demo/plausible/
# exporter. GOWORK=off everywhere for the reason dev/Taskfile.docs.yaml gives: a parent go.work
# in the surrounding workspace otherwise drags sibling modules in.
#
# `parity` IS THE GATE PHASE 6 DEPENDS ON. Nothing in this repo's CI runs Go (verified: no
# workflow, no lefthook hook), so these tasks are the front door and running them is manual —
# which is exactly why `parity` prints a verdict rather than only an exit code.
#
# `xrd-schema` IS THE GATE PHASE 5 DEPENDS ON — the CatalystWebSecureIngress XRD's `nav` block.
# Separate from `parity` on purpose: parity asks "does the Go port still reproduce
# build_nav.py byte for byte", xrd-schema asks "does the declared nav membership actually get
# refused when it is wrong". Neither answers the other's question.
version: "3"

vars:
  # OPERATOR/OPERATOR_BIN, not SRC/BIN. dev/Taskfile.docs.yaml defines BOTH of those names for
  # the docsgen module, and with the two files included from the same root Taskfile the names
  # COLLIDE ACROSS THEM — in both directions, and silently:
  #   * `task nav:test:envtest` expanded to `cd dev/docs-generator && go test ./... -count=1`.
  #     It ran the docsgen suite and reported it as the operator's envtest run.
  #   * `task docs:lint` expanded to `infrastructure/.../catalyst-nav-operator lint`, i.e. the
  #     nav operator binary was handed the docs linter's arguments and printed its usage.
  # Single-line `cmd:` entries resolved the local SRC correctly while multi-line ones did not,
  # so half the breakage was invisible unless you read the echoed command. Renamed rather than
  # papered over: a var name unique across every included Taskfile is the only form that cannot
  # be shadowed. Do not reintroduce a bare SRC or BIN here.
  OPERATOR: infrastructure/base/catalyst-nav/operator
  OPERATOR_BIN: infrastructure/base/catalyst-nav/operator/bin/catalyst-nav-operator
  CORPUS: infrastructure/base/catalyst-nav/operator/testdata/cluster-ingressroutes.json
  # The FROZEN ORACLE. build_nav.py's own output for every parity fixture, recorded while the
  # script still existed and committed. There is no BUILD_NAV var any more because there is no
  # build_nav.py — see the `parity` task.
  ORACLE: infrastructure/base/catalyst-nav/operator/testdata/golden/build_nav_oracle.json

tasks:
  default:
    desc: "Run the nav operator's test suites"
    cmds:
      - task: test

  build:
    desc: "Compile the catalyst-nav-operator binary"
    sources:
      - "{{.OPERATOR}}/**/*.go"
      - "{{.OPERATOR}}/go.mod"
      - "{{.OPERATOR}}/go.sum"
    generates:
      - "{{.OPERATOR_BIN}}"
    cmds:
      - cmd: cd {{.OPERATOR}} && GOWORK=off go build -o bin/catalyst-nav-operator ./cmd/catalyst-nav-operator
      - cmd: echo "built {{.OPERATOR_BIN}}"

  test:
    desc: "Unit + parity suites (no cluster, no control plane needed)"
    cmds:
      # The envtest package skips cleanly without control-plane binaries; use test:envtest
      # to run it deliberately.
      - cmd: cd {{.OPERATOR}} && GOWORK=off go test ./...

  test:envtest:
    desc: "Full suite including envtest (downloads a control plane on first run)"
    cmds:
      - cmd: |
          cd {{.OPERATOR}} && \
          KUBEBUILDER_ASSETS="$(GOWORK=off go run sigs.k8s.io/controller-runtime/tools/setup-envtest use -p path)" \
          GOWORK=off go test ./... -count=1

  xrd-schema:
    desc: "PHASE 5 GATE: the CatalystWebSecureIngress nav schema — admission + taxonomy drift"
    cmds:
      # Two halves, and both are needed. The Go suite installs the CRD the XRD generates into
      # a throwaway apiserver and proves each constraint by REJECTION — the only way to tell a
      # CEL rule that works from one that evaluates true always, and the only way to learn
      # whether the rules fit inside the apiserver's CEL cost budget at all. The pytest suite
      # needs no control plane and compares the three copies of the taxonomy (taxonomy.yaml,
      # the XRD enum, the composition's title map) plus the four copies of the shared
      # middleware trio.
      - cmd: |
          cd {{.OPERATOR}} && \
          KUBEBUILDER_ASSETS="$(GOWORK=off go run sigs.k8s.io/controller-runtime/tools/setup-envtest use -p path)" \
          GOWORK=off go test ./internal/xrdschema/ -count=1
      - cmd: python3 -m pytest infrastructure/base/catalyst-websecure-ingress/tests/ -q

  vet:
    desc: "go vet the operator module"
    cmds:
      - cmd: cd {{.OPERATOR}} && GOWORK=off go vet ./...

  corpus:
    desc: "Regenerate the parity corpus from the repo's committed IngressRoutes"
    cmds:
      - cmd: bash {{.OPERATOR}}/testdata/extract-corpus.sh --from-repo

  corpus:cluster:
    desc: "Capture the AUTHORITATIVE parity corpus from the live cluster (read-only)"
    cmds:
      # Routes minted by a HelmRelease or by the catalyst-websecure-ingress Composition
      # exist only in the cluster, so the live set is larger than the repo corpus. Phase 6
      # must sign off against THIS one.
      - cmd: bash {{.OPERATOR}}/testdata/extract-corpus.sh --from-cluster

  parity:
    desc: "THE PARITY GATE: diff the operator's manifest against build_nav.py's frozen output"
    deps: [build]
    # WHAT CHANGED AND WHY THE GATE IS STILL A GATE.
    #
    # This task used to RUN build_nav.py as its oracle. The script is deleted — the operator is
    # the sole producer of the nav manifest now, which is the whole point of the migration this
    # gate was guarding — so the oracle is its recorded OUTPUT instead: every fixture was run
    # through the real script first and the bytes committed to {{.ORACLE}}.
    #
    # THE OBJECTION TO GOLDEN FILES, AND WHY IT DOES NOT APPLY. A golden file is worthless when
    # it can be regenerated from the thing it is meant to check, because the first disagreement
    # gets re-blessed instead of investigated. The generator that produced this one was deleted
    # in the same commit as build_nav.py, so nothing in this repo can rewrite these bytes. A
    # diff here means the GO PORT changed, and the fix is to revert the port — never to
    # refresh the golden.
    #
    # The Go suite (`task nav:test`) checks the same oracle over all 85 recorded fixtures and
    # additionally asserts that the comparison can fail. This task is the human-readable
    # verdict over the cluster corpus for the two scopes that actually ship.
    cmds:
      - cmd: |
          set -eu
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          status=0
          for scope in themed all; do
            # Pull the recorded build_nav.py stdout for (corpus, NAV_SCOPE=$scope). The key is
            # the sha256 of the exact input the script was given, so a corpus regenerated by
            # `task nav:corpus` will MISS and report it rather than silently comparing against
            # the output for a different cluster.
            NAV_SCOPE=$scope python3 -c '
          import hashlib, json, sys
          corpus, oracle, scope = sys.argv[1], sys.argv[2], sys.argv[3]
          raw = open(corpus, "rb").read()
          h = hashlib.sha256()
          h.update(raw); h.update(b"\0"); h.update(scope.encode()); h.update(b"\0")
          key = h.hexdigest()
          cases = json.load(open(oracle))["cases"]
          if key not in cases:
              sys.exit("no frozen build_nav.py output for this corpus at NAV_SCOPE=%s.\n"
                       "The corpus changed (task nav:corpus / nav:corpus:cluster) and the "
                       "oracle cannot be regenerated: build_nav.py is deleted. Compare against "
                       "the committed corpus, or drop this scope from the gate." % scope)
          sys.stdout.write(cases[key]["stdout"])
          ' {{.CORPUS}} {{.ORACLE}} "$scope" > "$tmp/py.json"
            NAV_SCOPE=$scope ./{{.OPERATOR_BIN}} render < {{.CORPUS}} > "$tmp/go.json" 2>/dev/null
            hosts=$(grep -o '"href"' "$tmp/py.json" | wc -l | tr -d ' ')
            if cmp -s "$tmp/py.json" "$tmp/go.json"; then
              echo "NAV_SCOPE=$scope  IDENTICAL to build_nav.py  ($(wc -c < "$tmp/py.json" | tr -d ' ') bytes, $hosts hosts)"
            else
              echo "NAV_SCOPE=$scope  *** DIFFERS FROM build_nav.py ***"
              diff <(python3 -m json.tool "$tmp/py.json") <(python3 -m json.tool "$tmp/go.json") || true
              status=1
            fi
          done
          exit $status

  validate:
    desc: "kustomize build + client-side dry-run of the catalyst-nav component"
    cmds:
      # The NavGroup objects in taxonomy.yaml will report "no matches for kind" until the
      # CRDs are installed in whatever cluster kubectl points at — phase 1 was never
      # deployed, so that is expected here and is not a manifest error. The CRDs themselves
      # are schema-validated by test:envtest, which installs them for real.
      - cmd: kustomize build infrastructure/base/catalyst-nav/
      - cmd: kustomize build infrastructure/base/catalyst-nav/ | kubectl apply --dry-run=client -f - || true

  generate:
    desc: "Re-run controller-gen for the DeepCopy methods"
    cmds:
      # The CRD YAML is NOT generated — see api/v1alpha1/navgroup_types.go for why the
      # hand-written, reviewed schemas are the source of truth. Only `object` runs here.
      - cmd: |
          cd {{.OPERATOR}} && GOWORK=off go run sigs.k8s.io/controller-tools/cmd/controller-gen \
            object:headerFile=hack/boilerplate.go.txt paths=./api/...
