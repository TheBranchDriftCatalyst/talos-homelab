---
# Serves the self-signed utarr CRX + updates.xml for Chrome policy install.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: utarr-dist
  namespace: flux-system
spec:
  interval: 30m
  path: ./infrastructure/base/utarr-dist
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: storage
  wait: true
  timeout: 5m
