# Falco runtime security — cluster-wide syscall detection (TALOS-slbn, epic TALOS-2odn).
# No postBuild.substituteFrom (needs no cluster-settings vars).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: falco
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/falco
  prune: true
  wait: false
