---
# fchat-bouncer — always-on bouncer, chat UI and ad scheduler for F-List's
# F-Chat protocol. F-Chat is a bespoke WebSocket protocol, so no existing
# bouncer speaks it and closing a client means leaving every channel.
#
# ⚠️ TEMPORARY HOME — same exception bt-radar documents next door.
#
# fchat-bouncer is an APPLICATION whose image we build, so under this cluster's
# dual-GitOps split it belongs to ArgoCD from its own repo, not to Flux from
# here. The ArgoCD Application already exists at
# infrastructure/base/argocd/applications/fchat-bouncer.yaml and is live — but
# it sits at Unknown because its repoURL
# (github.com/TheBranchDriftCatalyst/fchat-bouncer) has not been created yet, so
# there is nothing for it to sync and no CI to publish an image.
#
# This Kustomization is the bridge: it deploys the same manifests from here,
# against a locally built image pushed to the in-cluster Zot registry, so the app
# runs and can be iterated on while the repo and CI are still pending.
#
# ⚠️ RETIRING — this bridge has done its job and is on its way out.
#
# The precondition it names below is met: the repo exists (on Forgejo, not
# GitHub), CI publishes to Zot, and the ArgoCD Application is Synced/Healthy
# and already owns 8 of the 9 objects this Kustomization has in its inventory.
#
# It is SUSPENDED, and the suspension is load-bearing. The copy of the
# manifests under applications/fchat-bouncer/ has gone stale: it still names
# ghcr.io/thebranchdriftcatalyst/fchat-bouncer (a repository that does not
# exist), pulls with ghcr-secret, and carries no FCHAT_S3_* configuration at
# all. Unsuspending it would fight ArgoCD, roll the Deployment to an image
# that cannot be pulled, and strip the image library's object-store settings.
#
# prune: false — SET DELIBERATELY, AND IT MUST LAND BEFORE THIS FILE IS
# DELETED. The inventory includes the CNPG `Cluster fchat-postgres` and the
# Namespace, so removing this Kustomization while pruning was enabled would
# garbage-collect the database and its PVCs on the way out. ArgoCD would
# rebuild the Deployment and find no data behind it. With pruning off, the
# finalizer releases the objects instead of deleting them, and ArgoCD — which
# already reconciles every one of them — simply keeps going.
#
# MIGRATION, remaining steps once this commit is reconciled:
#   1. delete this file, applications/fchat-bouncer/, and the entry in
#      clusters/catalyst-cluster/flux-system/kustomization.yaml
#   2. strip the fields this bridge merged onto the live ExternalSecret
#      fchat-bouncer/fchat-bouncer-secrets — `spec.dataFrom` and
#      `spec.target.template` — and delete the Password generator
#      `fchat-session-secret`. THIS IS NOT OPTIONAL: both controllers applied
#      their half of that object and neither removed the other's, so the
#      template ({{ .password }}, mergePolicy: Replace) is what actually
#      reaches the Secret. ArgoCD's 1Password remoteRef sits there inert
#      underneath it. Deleting this Kustomization does not clean those fields
#      up, and leaving them means the session key keeps being regenerated on
#      every refresh — which is what has been rotating it hourly, invalidating
#      sessions and orphaning the encrypted F-List credential on each restart.
#   3. in the fchat-bouncer repo nothing needs to change; k8s/talos00 is
#      already the authority and its ExternalSecret is already remoteRef-only.
#
# dependsOn: traefik for the IngressRoute CRD and the authentik/catalyst-nav
# middlewares, external-secrets for the 1Password-backed pull secret, databases
# for the CNPG operator that owns the Cluster CRD, and themepark for
# catalyst-nav.
#
# wait:false — CNPG takes a while to bootstrap three instances and nothing
# downstream depends on this being up. A chat app must never hold up a
# reconciliation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fchat-bouncer
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/fchat-bouncer/base
  prune: false
  wait: false
  dependsOn:
    - name: traefik
    - name: external-secrets
    - name: databases
    - name: themepark
