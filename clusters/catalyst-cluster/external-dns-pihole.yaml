---
# Second external-dns instance → writes talos00.lan A-records into Pi-hole.
# Disjoint from the Cloudflare instance (different provider, domain, RBAC names).
# Phase 3 of LAN-DNS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-pihole
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/external-dns-pihole
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
    - name: pihole
