---
# Cluster mailer subsystem — self-hosted Stalwart SMTP relay → Gmail smarthost.
# Apps (Authentik, Alertmanager, ...) send to smtp.mail.svc:25; Stalwart relays
# outbound via smtp.gmail.com as [email protected]. Epic: TALOS-w5b.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/mail
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
    - name: traefik  # webadmin UI IngressRoute
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
