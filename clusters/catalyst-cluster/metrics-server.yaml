---
# Kustomization for metrics-server (resource-metrics API: kubectl top + HPA + homepage k8s widget)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/metrics-server
  prune: true
  wait: true
  timeout: 5m
