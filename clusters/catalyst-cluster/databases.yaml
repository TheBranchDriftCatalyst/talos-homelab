---
# Database Operators - Centralized database provisioning layer
# Provides CRDs: Cluster (PostgreSQL), MongoDBCommunity, Tenant (MinIO)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/databases
  prune: true
  wait: true
  # (dbgate's CNPG connections now come from an envFrom Secret written by the single-writer
  # dbgate-connection-sync CronJob — the Deployment env is fully git-managed again, so no
  # spec.ignore is needed. See docs/patterns/cross-namespace-secret-reflection.md.)
  dependsOn:
    - name: namespaces
    - name: storage
    - name: bootstrap-crds
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudnative-pg
      namespace: databases
