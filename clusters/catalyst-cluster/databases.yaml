---
# Database Operators - Centralized database provisioning layer
# Provides CRDs: Cluster (PostgreSQL), MongoDBCommunity, Tenant (MinIO)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/databases
  prune: true
  wait: true
  # dbgate's CNPG connection env is owned by the Kyverno `dbgate-cnpg-connections`
  # mutateExisting policy (event-driven per CNPG cluster), NOT by git. Tell Flux to ignore
  # drift on that container's env so it doesn't revert Kyverno's injected connections.
  # Requires Flux >= 2.9 (Kustomization.spec.ignore). See TALOS-5ccm and
  # docs/patterns/cross-namespace-secret-reflection.md.
  ignore:
    - target:
        kind: Deployment
        name: dbgate
        namespace: databases
      paths:
        - /spec/template/spec/containers/0/env
  dependsOn:
    - name: namespaces
    - name: storage
    - name: bootstrap-crds
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudnative-pg
      namespace: databases
