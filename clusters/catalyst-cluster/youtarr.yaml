---
# Youtarr — YouTube channel/playlist subscriptions, downloaded into the Plex
# media library with native Plex playlist mirroring (TALOS-ksu6).
# Replaces tubesync, whose huey SQLite queues cannot run WAL over NFS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: youtarr
  namespace: flux-system
spec:
  interval: 10m
  path: ./applications/youtarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Needs the MariaDB CRDs + operator from the databases Kustomization.
  dependsOn:
    - name: databases
  wait: true
  timeout: 10m
