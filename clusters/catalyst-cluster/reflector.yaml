---
# Kustomization for emberstack/reflector (cross-namespace secret mirroring)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reflector
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/reflector
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: namespaces
