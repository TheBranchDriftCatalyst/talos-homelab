---
# Kyverno policy engine (install). Policies live in kyverno-policies (depends on this).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/kyverno
  prune: true
  wait: true
  timeout: 10m
