---
# Layer 3: XBucket instances (TALOS-hk7i) — split because the XBucket kind
# only exists once layer 2's XRD is processed (atomic dry-run would deadlock).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-buckets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/base/aws/buckets
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: aws
