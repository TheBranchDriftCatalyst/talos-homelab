# T-Pot honeypots as native k8s Deployments in the `tpot` namespace (TALOS-qish). Pivoted off the
# KubeVirt VM approach (fought Talos networking at every layer). WAN-exposed via a Cilium LoadBalancer,
# CNP-caged, logs -> Loki. No postBuild.substituteFrom (no cluster-settings vars; envsubst trap).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tpot
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./infrastructure/base/security/tpot
  prune: true
  wait: false
  dependsOn:
    - name: cilium
