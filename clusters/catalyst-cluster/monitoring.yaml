---
# Consolidated Monitoring Stack
# Includes: Mimir, Loki, Tempo, Alloy, Grafana, exporters
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  path: ./infrastructure/base/monitoring/v2-otel
  # Injects ${CLICKSTACK_MONGO_URI} into the clickstack HelmRelease so the
  # generated Mongo credential never lands in git. The secret is created by the
  # monitoring-v2-operators layer (a dependsOn of this one), which must run first
  # because postBuild substitution happens BEFORE apply.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: clickstack-mongodb-password
        optional: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Depends on operators (for CRDs), storage, and MinIO (for S3)
  dependsOn:
    - name: monitoring-v2-operators
    - name: storage
    - name: minio
    - name: bootstrap-crds
  suspend: false
