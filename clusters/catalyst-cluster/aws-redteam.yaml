---
# aws-redteam — on-demand external pentest vantage (off by default).
# dependsOn aws (XInstance XRD/composition) + aws-providers (EC2 CRDs). wait:false
# because provider/XR conditions aren't kstatus-Ready. Only the reaper reconciles
# until an operator uncomments a claim in the folder's kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-redteam
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/base/aws-redteam
  prune: true
  wait: false
  sourceRef: {kind: GitRepository, name: flux-system}
  dependsOn:
    - name: aws-providers
    - name: aws
