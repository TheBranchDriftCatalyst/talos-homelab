---
# cert-manager Issuers - ClusterIssuers and CAs
# Depends on cert-manager being fully deployed (CRDs available)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/cert-manager-issuers
  prune: true
  # wait: false - Don't block downstream kustomizations on Certificate health.
  # Certificates can fail/expire independently (e.g. upstream DNS-01 issues) and
  # should not cascade failures into unrelated stacks like monitoring.
  wait: false
  dependsOn:
    - name: cert-manager
    - name: external-secrets
    - name: traefik  # traefik namespace must exist (certs are created there)
  postBuild:
    substituteFrom:
      # Supplies TALOS00_DNSNAMES for the talos00 wildcard certificate. Written
      # by the san-discovery CronJob from the cluster's own IngressRoutes, so
      # the 93 explicit hostnames Apple requires are never hand-maintained.
      #
      # optional: the Certificate carries a `:=` default, so a missing ConfigMap
      # (first bootstrap, or before the job's first run) renders a valid
      # wildcard-only certificate instead of failing this Kustomization — which
      # would otherwise take every certificate in the cluster down with it.
      - kind: ConfigMap
        name: talos00-cert-sans
        optional: true
