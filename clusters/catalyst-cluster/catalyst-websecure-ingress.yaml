---
# The CatalystWebSecureIngress XRD + Composition. Composes in-cluster Traefik IngressRoutes
# + a NetworkPolicy via provider-kubernetes, so — like catalyst-cnpg-appdb — it depends on
# provider-kubernetes (owned by the crossplane-demo Kustomization) and is kept separate from
# the AWS providers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: catalyst-websecure-ingress, namespace: flux-system}
spec:
  interval: 30m
  path: ./infrastructure/base/catalyst-websecure-ingress
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  dependsOn: [{name: crossplane-demo}]
  timeout: 5m
