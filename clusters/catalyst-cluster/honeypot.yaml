---
# Cowrie SSH/telnet honeypot — INTERNET-FACING sensor (TALOS-u3l).
#
# EXPOSURE INTENT CHANGED 2026-08-24. This Kustomization used to declare the
# honeypot "deliberately NOT internet-exposed". That is superseded: the operator
# has decided to expose it, and the manifests are now staged for that. The
# CiliumNetworkPolicy accepts `fromEntities: [world]` on 2222/2223, so the
# honeypot will capture real traffic the moment the path exists.
#
# ⚠️ NOTHING IN THIS REPO CREATES THAT PATH, BY DESIGN. There is still no
# external-dns record, no IngressRoute/IngressRouteTCP, no LoadBalancer, no
# NodePort and no Cloudflare tunnel. The single remaining step is a port-forward
# on the router, performed by hand:
#
#     WAN:22  ->  192.168.1.19:2222   (talos06, hostPort)
#
# Until that is configured this deployment is reachable from the LAN only and is
# functionally identical to its previous internal-only state. Telnet (2223) is
# deliberately NOT recommended for forwarding — see the runbook.
#
# Runbook, including the blast-radius assessment that must be re-read before
# widening anything here:
#     docs/05-runbooks/cowrie-public-exposure.md
#
# Placement is a SOFT anti-affinity away from talos03 (the memory-constrained
# node), not a pin — it currently lands on talos06. hostPort 2222/2223 already
# implies one cowrie per node. If it reschedules, the port-forward target IP
# changes and capture stops silently; the runbook covers detecting that.
#
# Feeds CrowdSec (Cowrie acquisition -> decisions -> the Traefik bouncer) and
# ships logs via the logship sidecar -> Alloy -> Loki (TALOS-l05 / TALOS-e9h).
#
# dependsOn cilium: the base ships a default-deny CiliumNetworkPolicy, so the
# Cilium CRDs must exist first. wait:false — nothing here is a HelmRelease to
# health-check. Part of epic TALOS-hg7.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: honeypot
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/honeypot
  prune: true
  wait: false
  dependsOn:
    - name: cilium
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
