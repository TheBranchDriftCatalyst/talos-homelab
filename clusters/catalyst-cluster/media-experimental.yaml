---
# Experimental books / comics / audiobooks stack (bake-off).
# Isolated namespace; local-path appdata; shared Synology NFS libraries.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-experimental
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/media-experimental/base
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: namespaces
    - name: storage
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
