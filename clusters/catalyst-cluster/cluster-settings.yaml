---
# Cluster-wide settings ConfigMap
# Used by Flux postBuild substitution for variable replacement
# Update these values and Flux will propagate to all resources
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # Synology Configuration
  SYNOLOGY_IP: '192.168.1.36' # e.g., 192.168.1.50
  SYNOLOGY_VOLUME: '/volume1' # Base volume path

  # Kubernetes Nodes
  TALOS_NODE_IP: '192.168.1.54'
  TALOS02_GPU_NODE_IP: '192.168.1.144'

  # Node the media-experimental stack's local-path config volumes live on, and
  # therefore the node its 11 Deployments are pinned to. Both halves of that pin
  # read this one key (applications/media-experimental/base/_instance/deployment.yaml
  # and .../base/backup/cronjob-restore.yaml), so relocating the stack after a node
  # reset is a single edit here — see applications/media-experimental/base/backup/README.md.
  MEDIA_EXPERIMENTAL_NODE: 'talos03'

  # TODO: need to pull in all of
  # the nodes here titghte this up single sourceo f truth

  # Domain suffix for ingress
  CLUSTER_DOMAIN: 'talos00'
  DOMAIN: 'talos00' # Alias for traefik compatibility

  # AWS Configuration (Hybrid LLM Cluster)
  AWS_REGION: 'us-west-2'
  AWS_GPU_INSTANCE_TYPE: 'g4dn.xlarge'
