---
# Pi-hole — LAN-local DNS resolver (authoritative for talos00.lan) + ad-blocking.
# Gets a dedicated LAN IP (192.168.1.240) via Cilium LB IPAM. Fed by the
# external-dns-pihole instance. Phase 2 of LAN-DNS.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pihole
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/pihole
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
    - name: cilium
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
