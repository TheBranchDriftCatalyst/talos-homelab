---
# Layer 2: creds gate + ProviderConfig + XBucket XRD/Composition (TALOS-hk7i).
# retryInterval carries it over the window where provider CRDs are still
# registering. wait:false — the creds ExternalSecret legitimately sits
# Ready=False until the human gate (1Password aws-crossplane item).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/base/aws
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: aws-providers
    - name: external-secrets
