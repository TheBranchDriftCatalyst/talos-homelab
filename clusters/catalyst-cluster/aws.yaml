---
# AWS-via-Crossplane Kustomization (TALOS-hk7i). Depends on operators
# (crossplane core) and external-secrets (creds path). wait:false — the
# XBucket instances legitimately sit Pending until the human creds gate
# (1Password item aws-crossplane) is satisfied; don't dam anything on that.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/base/aws
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: operators
    - name: external-secrets
