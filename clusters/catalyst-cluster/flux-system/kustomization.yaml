apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Patches for the Flux controllers themselves (kustomize-controller +
# helm-controller). MUST live in this outer kustomization because the
# inner clusters/catalyst-cluster/flux-system/flux-system/kustomization.yaml
# is NEVER processed by Flux — this outer kustomization references the
# gotk-* files DIRECTLY (as `flux-system/gotk-components.yaml`) instead of
# pointing at the directory. So patches in the inner kustomization are
# dead code (silently ignored).
#
# This is a bootstrap-time gotcha: `flux bootstrap` writes the inner
# kustomization with the conventional patches: pattern, but our cluster
# was set up to reference the gotk-* files directly from the outer, so
# the inner is bypassed. Moved here so they actually apply.
#
# Discovery: 2026-05-30. The May 22 throttle fix (--concurrent=2, etc.)
# never took effect — controllers ran defaults (--concurrent=4, qps=50,
# burst=100) the entire time. Explains why meltdowns kept happening.
patches:
  # Delete Flux network policies - they break connectivity with Cilium CNI
  # because Cilium doesn't recognize the Kubernetes API as an "endpoint"
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-egress
        namespace: flux-system
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-scraping
        namespace: flux-system
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-webhooks
        namespace: flux-system

  # NOTE 2026-05-30: removed Flux controller throttle (--concurrent=1,
  # --kube-api-qps=10, --kube-api-burst=20). It was applied on 2026-05-29
  # under the hypothesis that the meltdown cascade was caused by ~30
  # Kustomizations reconciling simultaneously and bursting apiserver, which
  # tripped Cilium's liveness probe and killed the agent.
  #
  # The real root cause (TALOS-yyt, 2026-05-30) was 19k stale CiliumIdentity
  # CRDs saturating etcd on each cilium-agent restart — the Flux burst was
  # at most a symptom-amplifier, not the cause. With identity bloat fixed
  # and the label filter preventing recurrence, the cluster no longer needs
  # the throttle. Reverting to chart defaults (--concurrent=4,
  # --kube-api-qps=50, --kube-api-burst=100) lets Flux move at full speed.
  #
  # The cilium-identity-alerts PrometheusRule will catch any regression
  # that brings the meltdown class back, so we have observability not just
  # throttling as our safety net.

resources:
  # Flux components (added by flux bootstrap)
  - flux-system/gotk-components.yaml
  - flux-system/gotk-sync.yaml

  # Cluster-wide settings ConfigMap (used by Flux postBuild substitution)
  - ../cluster-settings.yaml

  # Flux Kustomizations (each has postBuild for variable substitution)
  # Core infrastructure (order matters via dependsOn)
  - ../namespaces.yaml
  - ../bootstrap-crds.yaml  # Upfront CRDs (Prometheus, Traefik, ArgoCD, NFD, Intel, Grafana)
  - ../cilium.yaml  # CNI (activated 2026-05-30 after identity-bloat root cause fixed)
  - ../kubevirt.yaml  # KubeVirt operator (gaming kustomization depends on this)
  - ../storage.yaml
  - ../reflector.yaml # emberstack/reflector — cross-ns secret mirroring (CNPG->dbgate) (TALOS-7jxm)
  - ../kyverno.yaml # Kyverno policy engine (TALOS-7jxm)
  - ../kyverno-policies.yaml # ClusterPolicies incl. CNPG->dbgate secret reflection (TALOS-7jxm)
  - ../cert-manager.yaml
  - ../cert-manager-issuers.yaml
  - ../minio.yaml
  - ../traefik.yaml
  - ../analytics.yaml # central Plausible-injection middleware chain (opt-in per ingress) (TALOS-4gg)
  - ../crowdsec.yaml # CrowdSec IPS: bouncer + AppSec/WAF + Console (staged global bind) (TALOS-pbn)
  - ../external-secrets.yaml # Contains both external-secrets-operator and external-secrets
  - ../cloudflare-ddns.yaml
  - ../external-dns.yaml  # Cloudflare external-dns for *.knowledgedump.space
  # ../registry.yaml REMOVED (TALOS-6vf): Nexus decommissioned, replaced by Zot.
  # Deleting this Flux Kustomization (prune:true) garbage-collects all Nexus
  # resources — deployment, services, IngressRoutes, and the 100Gi PVC.
  - ../zot.yaml  # Zot OCI registry (Nexus replacement, TALOS-6vf)
  - ../forgejo.yaml  # Forgejo multi-format package registry + git forge (TALOS-6nf)
  - ../infra-control.yaml
  - ../intel-gpu.yaml  # NFD + Intel GPU device plugin
  - ../vpn-gateway.yaml  # VPN sidecar pattern (SecureChrome, SecureXNG)
  # Monitoring stack (consolidated: Mimir, Loki, Tempo, Alloy, Grafana, exporters)
  - ../monitoring-v2-operators.yaml
  - ../monitoring.yaml
  - ../version-checker.yaml  # image-version exporter for App Ops (TALOS-rcx6)
  - ../control-plane-scrape.yaml  # scrape exposed etcd/scheduler/KCM/apiserver metrics (TALOS-hzl0)
  - ../argocd.yaml
  - ../flux-notifications.yaml
  - ../kube-system.yaml
  - ../authentik.yaml
  - ../mail.yaml  # Stalwart SMTP relay → Gmail smarthost (mailer subsystem, TALOS-w5b)
  - ../whoami.yaml
  - ../honeypot.yaml  # Cowrie SSH/telnet honeypot, internal-only sensor (TALOS-u3l / epic TALOS-hg7)
  - ../iocaine.yaml  # iocaine LLM tarpit + trap.knowledgedump.space maze (TALOS-mko / epic TALOS-hg7)
  - ../databases.yaml
  - ../operators.yaml # self-service operator catalog: RabbitMQ/KEDA/Dragonfly/Crossplane/ClickHouse/OpenSearch/Argo (TALOS-ja5)
  - ../backup.yaml
  # Applications
  - ../arr-stack.yaml
  - ../home-automation.yaml
  - ../scratch.yaml
  - ../crossplane-demo.yaml # operator-catalog demo: one CR of each + Go flex + Celery/KEDA (TALOS-ja5)
  - ../crossplane-demo-object.yaml # crossplane Object (split: needs provider-kubernetes CRDs first) (TALOS-ja5)
  # MIGRATED: catalyst-llm moved to workspace/catalyst-llm repo for ArgoCD
  # - ../catalyst-llm.yaml
  # MIGRATED: dagster platform + code locations moved to catalyst-data repo for ArgoCD
  # - ../dagster.yaml
  # - ../congress-data.yaml
  # - ../media-ingest.yaml
  - ../gaming.yaml
  - ../metube.yaml
  - ../tubesync.yaml
  - ../tdarr.yaml
  - ../media-experimental.yaml
  - ../zipline.yaml  # file/image sharing, media-private; CNPG-backed (TALOS-0w6d)
  - ../pihole.yaml
