---
# Kustomization for Zipline (self-hosted image/file sharing). Moved out of the
# media-private namespace into its own `zipline` namespace (media-private is reserved
# for talos-private-repo workloads) with a FRESH database — the old DB is not carried
# over (TALOS-0w6d). Public at zipline.knowledgedump.space (Cloudflare) with native
# Authentik OIDC on the dashboard + public image URLs; replaces zipline.amberdark.net.
#
# dependsOn:
#   - storage           → fatboy-nfs-appdata StorageClass (uploads PVC)
#   - databases         → CloudNativePG operator + the CatalystCNPGAppDB composite
#   - external-secrets  → ClusterSecretStore `onepassword` (CORE_SECRET + OIDC secrets)
#   - authentik         → the zipline OAuth2 provider/app blueprint + authentik-zipline-oidc
#
# This Kustomization now OWNS the `zipline` Namespace object (namespace.yaml), so
# prune:true reaps the whole app. The old media-private zipline resources (incl. the
# old CNPG cluster + PVCs) are pruned on cutover — intentional, fresh start.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zipline
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/zipline
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: storage
    - name: databases
    - name: external-secrets
    - name: authentik
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
