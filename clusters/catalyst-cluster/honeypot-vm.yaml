# Ephemeral KubeVirt detonation VM — Phase 2c (TALOS-82um, epic TALOS-2odn). Internal-only, Halted by
# default. No postBuild.substituteFrom (no cluster-settings vars; avoids the envsubst trap).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: honeypot-vm
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./infrastructure/base/honeypot-vm
  prune: true
  wait: false
  dependsOn:
    - name: cilium
    - name: kubevirt
