---
# soju (IRC bouncer) + gamja (web client), so IRC is always-on and scrollback
# survives closing a tab.
#
# dependsOn `databases` for the CNPG operator (a HelmRelease there, which owns
# the Cluster CRD), traefik for the IngressRoute CRD plus the redirect and
# authentik middlewares, and themepark for catalyst-nav.
#
# wait:false — Postgres takes a while to bootstrap three instances and nothing
# downstream depends on IRC being up. A slow chat client must never hold up a
# reconciliation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: irc
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications/irc/base
  prune: true
  wait: false
  dependsOn:
    - name: databases
    - name: traefik
    - name: themepark
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
