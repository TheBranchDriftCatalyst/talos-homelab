---
# Kyverno ClusterPolicies — separated from the install so the kyverno.io CRDs + controllers
# exist (dependsOn kyverno, wait:true) before any ClusterPolicy is applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/kyverno-policies
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: kyverno
