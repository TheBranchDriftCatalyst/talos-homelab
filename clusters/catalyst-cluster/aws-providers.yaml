---
# Layer 1: crossplane provider/function packages (TALOS-hk7i)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-providers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/base/aws-providers
  prune: true
  wait: false # Provider/Function conditions aren't kstatus Ready — don't hang
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: operators
