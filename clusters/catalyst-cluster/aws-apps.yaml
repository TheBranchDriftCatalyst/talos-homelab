---
# Layer 3b: XFargateApp instances (TALOS-hk7i)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: aws-apps, namespace: flux-system}
spec:
  interval: 10m
  retryInterval: 2m
  path: ./infrastructure/base/aws/apps
  prune: true
  wait: false
  sourceRef: {kind: GitRepository, name: flux-system}
  dependsOn: [{name: aws}]
