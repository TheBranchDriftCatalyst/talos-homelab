---
# Talos control-plane metrics scraping (etcd/scheduler/controller-manager/
# apiserver ServiceMonitors + Alloy RBAC).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: control-plane-scrape
  namespace: flux-system
spec:
  interval: 30m
  timeout: 5m
  path: ./infrastructure/base/monitoring/control-plane-scrape
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: monitoring
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
