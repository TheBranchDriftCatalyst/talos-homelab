---
# Flux Kustomization for iocaine — the LLM/scraper tarpit serving a garbage maze
# at trap.knowledgedump.space. dependsOn traefik so the IngressRoute CRDs and
# the redirect-https middleware exist before these objects land. wait:false —
# don't block reconciliation on Deployment health (a config-iteration crashloop
# would otherwise deadlock Flux; the pod reconciles independently).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iocaine
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/iocaine
  prune: true
  wait: false
  dependsOn:
    - name: traefik
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
