# Taskfile for Kubernetes operations
version: '3'

vars:
  TALOS_NODE: '{{.TALOS_NODE | default "192.168.1.54"}}'
  TALOSCONFIG: './configs/talosconfig'
  KUBECONFIG: './.output/kubeconfig'

tasks:
  # ============================================
  # Kubeconfig Management
  # ============================================

  kubeconfig:
    desc: Download kubeconfig from Talos
    cmds:
      - mkdir -p .output
      - talosctl --talosconfig {{.TALOSCONFIG}} --nodes {{.TALOS_NODE}} kubeconfig .output
      - echo "✅ Kubeconfig saved to {{.KUBECONFIG}}"

  kubeconfig-merge:
    desc: Merge kubeconfig to ~/.kube/config (idempotent, enables kubectx/kubectl)
    cmds:
      - ./scripts/developer/kubeconfig-merge.sh

  kubeconfig-unmerge:
    desc: Remove catalyst-cluster context from ~/.kube/config
    cmds:
      - ./scripts/developer/kubeconfig-unmerge.sh

  kubeconfig-export:
    desc: Export KUBECONFIG environment variable for current shell
    cmds:
      - echo "Run this command to use the local kubeconfig:"
      - echo "  export KUBECONFIG={{.KUBECONFIG}}"

  # ============================================
  # teak-talos-dev (isolated work tenant)
  # ============================================

  teak-kubeconfig:
    desc: Mint the namespace-scoped kubeconfig for the work laptop (.output/teak-talos-dev.kubeconfig)
    cmds:
      - ./scripts/developer/teak-kubeconfig.sh

  teak-rotate-token:
    desc: Rotate the teak-operator token and re-mint its kubeconfig
    cmds:
      - ./scripts/developer/teak-kubeconfig.sh --rotate

  teak-verify:
    desc: Prove the teak-talos-dev tenant is scoped and isolated (RBAC + quota + connections)
    cmds:
      - |
        KC=.output/teak-talos-dev.kubeconfig
        [ -f "$KC" ] || { echo "run 'task k8s:teak-kubeconfig' first"; exit 1; }
        echo "--- must be YES (the tenant's own namespace) ---"
        KUBECONFIG=$KC kubectl auth can-i create clusters.postgresql.cnpg.io -n teak-talos-dev
        KUBECONFIG=$KC kubectl auth can-i create rabbitmqclusters.rabbitmq.com -n teak-talos-dev
        KUBECONFIG=$KC kubectl auth can-i create dragonflies.dragonflydb.io -n teak-talos-dev
        echo "--- must be NO (isolation) ---"
        KUBECONFIG=$KC kubectl auth can-i list pods -n kube-system
        KUBECONFIG=$KC kubectl auth can-i list secrets -A
        KUBECONFIG=$KC kubectl auth can-i create networkpolicies -n teak-talos-dev
        KUBECONFIG=$KC kubectl auth can-i create nodes
        echo "--- quota ---"
        kubectl -n teak-talos-dev get resourcequota teak-talos-dev
        echo "--- dbgate auto-registered connections ---"
        kubectl -n teak-talos-dev get secret dbgate-cnpg-connections \
          -o jsonpath='{.data.CONNECTIONS}' 2>/dev/null | base64 -d || echo "(not generated yet)"
        echo

  # ============================================
  # Cluster Resources
  # ============================================

  get-nodes:
    desc: Get Kubernetes nodes
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} get nodes -o wide

  get-pods:
    desc: Get all pods in all namespaces
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} get pods -A

  get-all:
    desc: Get all resources in all namespaces
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} get all -A

  # ============================================
  # Kubernetes Dashboard
  # ============================================

  dashboard-token:
    desc: Get Kubernetes Dashboard access token
    cmds:
      - ./scripts/kube-dashboard-token.sh

  dashboard-proxy:
    desc: Start kubectl proxy for Dashboard access
    cmds:
      - echo "Starting proxy... Dashboard will be available at:"
      - echo "http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/"
      - echo ""
      - echo "Run 'task k8s:dashboard-token' in another terminal to get the login token"
      - kubectl --kubeconfig {{.KUBECONFIG}} proxy

  # ============================================
  # Cluster Audit
  # ============================================

  audit:
    desc: Generate comprehensive cluster audit report
    cmds:
      - ./scripts/cluster-audit.sh

  # ============================================
  # Namespace Operations
  # ============================================

  namespaces:
    desc: List all namespaces
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} get namespaces

  # ============================================
  # Troubleshooting
  # ============================================

  events:
    desc: Get events in all namespaces (use -- NAMESPACE=default for specific)
    cmds:
      - |
        if [ -n "{{.NAMESPACE}}" ]; then
          kubectl --kubeconfig {{.KUBECONFIG}} get events -n {{.NAMESPACE}} --sort-by='.lastTimestamp'
        else
          kubectl --kubeconfig {{.KUBECONFIG}} get events --all-namespaces --sort-by='.lastTimestamp'
        fi
    vars:
      NAMESPACE: '{{.NAMESPACE | default ""}}'

  describe-pod:
    desc: Describe a pod (use -- POD=name NAMESPACE=default)
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} describe pod {{.POD}} -n {{.NAMESPACE}}
    vars:
      POD: '{{.POD}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'

  logs:
    desc: Get logs from a pod (use -- POD=name NAMESPACE=default)
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} logs {{.POD}} -n {{.NAMESPACE}}
    vars:
      POD: '{{.POD}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'

  logs-follow:
    desc: Follow logs from a pod (use -- POD=name NAMESPACE=default)
    cmds:
      - kubectl --kubeconfig {{.KUBECONFIG}} logs -f {{.POD}} -n {{.NAMESPACE}}
    vars:
      POD: '{{.POD}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'

  # ============================================
  # Flux GitOps Control
  # ============================================

  flux-suspend:
    desc: Suspend all Flux reconciliation (enables manual control)
    cmds:
      - echo "⏸️  Suspending Flux reconciliation..."
      - flux suspend kustomization --all -n flux-system
      - flux suspend source git --all -n flux-system
      - echo ""
      - echo "✅ Flux reconciliation suspended. Manual control enabled."
      - echo "   Run 'task k8s:flux-resume' to re-enable GitOps sync."

  flux-resume:
    desc: Resume all Flux reconciliation (re-enables GitOps)
    cmds:
      - echo "▶️  Resuming Flux reconciliation..."
      - flux resume source git --all -n flux-system
      - flux resume kustomization --all -n flux-system
      - echo ""
      - echo "✅ Flux reconciliation resumed. GitOps sync re-enabled."

  flux-status:
    desc: Show Flux reconciliation status
    cmds:
      - echo "📊 Flux Sources:"
      - flux get sources git -A
      - echo ""
      - echo "📊 Flux Kustomizations:"
      - flux get kustomizations -A
      - echo ""
      - echo "📊 Flux HelmReleases:"
      - flux get helmreleases -A
