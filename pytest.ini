[pytest]
# DR + integration suites are co-located with the component they cover
# (infrastructure/base/<c>/tests/, applications/<app>/tests/), so the collection scope spans the
# central tests/ root plus infrastructure/base and applications. python_files keeps collection to
# test_*.py, so only the ported suites are picked up (never the .py app helpers).
testpaths = tests infrastructure/base applications
python_files = test_*.py
addopts = -ra
markers =
    security_posture: Security Posture suite — each fixed finding stays fixed
    ingress_accessibility: Ingress Accessibility suite — what is reachable, from where, with what auth
    disaster_recovery: Disaster Recovery suite — recovery machinery + fault injection
    integration: Integration suite — end-to-end wiring of a subsystem against the live cluster
    live: requires --live (running cluster/LAN)
    telemetry: Telemetry/Observability suite — audit Grafana dashboards panel-by-panel
    destructive: destructive DR chaos — only runs with --destructive (or per-suite <SUITE>_DR_DESTRUCTIVE=1)
