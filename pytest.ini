[pytest]
# DR suites are co-located with the component they cover (infrastructure/base/<c>/tests/), so the
# collection scope spans both the central tests/ root and infrastructure/base. python_files keeps
# collection to test_*.py, so only the ported suites are picked up (never the .py app helpers).
testpaths = tests infrastructure/base
python_files = test_*.py
addopts = -ra
markers =
    security_posture: Security Posture suite — each fixed finding stays fixed
    ingress_accessibility: Ingress Accessibility suite — what is reachable, from where, with what auth
    disaster_recovery: Disaster Recovery suite — recovery machinery + fault injection
    live: requires --live (running cluster/LAN)
    destructive: destructive DR chaos — only runs with --destructive (or per-suite <SUITE>_DR_DESTRUCTIVE=1)
