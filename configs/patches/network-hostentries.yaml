# /etc/hosts entries pointing the *.talos00 service names at the control plane's LAN IP.
#
# This is how a NODE resolves registry.talos00 — which is what makes `image:
# registry.talos00/...` work at all. Without it, containerd cannot resolve the mirror and
# every locally-built image fails to pull with a DNS error that looks nothing like a config
# problem.
#
# ⚠️ HAND-MAINTAINED AND ALREADY DRIFTED. talos06 carries a seventh alias, tdarr.talos00,
# that no other node has — added when tdarr was pinned there and never propagated. That is
# reproduced in talos06-hostentries.yaml rather than silently normalised, because removing it
# is a behaviour change and belongs in its own visible commit.
#
# These duplicate what /etc/hosts on the operator's laptop also needs. A real DNS entry would
# remove both copies; see the catalyst-dns-sync work.
machine:
  network:
    extraHostEntries:
      - ip: 192.168.1.54
        aliases:
          - registry.talos00
          - nexus.talos00
          - argocd.talos00
          - grafana.talos00
          - prometheus.talos00
          - catalyst.talos00
