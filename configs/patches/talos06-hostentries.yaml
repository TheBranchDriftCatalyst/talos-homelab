# talos06 ONLY. Same as network-hostentries.yaml PLUS tdarr.talos00.
#
# ⚠️ THE COMMENT HERE WAS WRONG AND THE CORRECTION MATTERS.
#
# Talos list-merge APPENDS; it does not replace. This patch therefore does NOT override
# network-hostentries.yaml — it would ADD to it. The reason talos06 ends up correct is that
# network-hostentries.yaml is deliberately NOT in talos06's patch list at all.
#
# So: do NOT add network-hostentries.yaml to talos06 "for consistency". If you do, talos06
# gets 13 aliases across two entries instead of 7 across one. The earlier version of this
# comment claimed the opposite and would have led someone straight into that.
#
# The extra alias is drift, not design: it was added when tdarr was pinned to this node and
# never propagated to the others. Reproduced faithfully so the migration diff is clean.
# Normalising it is a separate, visible change.
machine:
  network:
    extraHostEntries:
      - ip: 192.168.1.54
        aliases:
          - registry.talos00
          - nexus.talos00
          - argocd.talos00
          - grafana.talos00
          - prometheus.talos00
          - catalyst.talos00
          - tdarr.talos00
