# maxPods 200, up from the kubelet default of 110. Applied to every node EXCEPT talos03.
#
# This is a per-node patch rather than a global one because talhelper applies the global
# `patches:` list AFTER each node's own, so a node-level override of a globally-declared
# value silently loses. talos03 needs 60, so 200 cannot live in the shared baseline.
machine:
  kubelet:
    extraConfig:
      maxPods: 200
