# talos06 carries a large image cache. Reclaim unused images at 80% disk usage
# and aim for 70%, rather than waiting for the kubelet defaults of 85% / 80%.
# Running-container images remain protected; PVC contents are not image GC targets.
# The shared 14-day maximum unused age remains an independent fallback.
machine:
  kubelet:
    extraConfig:
      imageGCHighThresholdPercent: 80
      imageGCLowThresholdPercent: 70
