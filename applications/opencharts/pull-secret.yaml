---
# Pull secret for Zot (registry.talos00). A Secret is namespaced and nothing
# mirrors this one, so every namespace that pulls a locally-built image needs
# its own copy -- same ESO pattern as catalyst-nav, bt-radar, crossplane-demo.
# Omitting it is invisible until deploy time: manifests validate, kustomize
# builds, Flux reports applied, and the pod then sits in ImagePullBackOff with
# "no basic auth credentials".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
  namespace: trading
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.talos00": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: {key: nexus-admin, property: username}
    - secretKey: password
      remoteRef: {key: nexus-admin, property: password}
