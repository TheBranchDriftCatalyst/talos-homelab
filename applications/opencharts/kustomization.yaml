---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading

resources:
  - namespace.yaml
  - pull-secret.yaml
  # Build-time settings. NOT mounted on the Deployment on purpose -- Vite
  # inlines them at build time, so mounting them would be a silent no-op.
  # image/build.sh renders this into .env.production. See the file header.
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
