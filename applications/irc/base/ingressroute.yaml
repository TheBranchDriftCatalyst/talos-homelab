---
# One hostname, three routes. gamja and soju share an origin on purpose: the
# client is served from / and talks to the bouncer at /socket, so the WebSocket
# is same-origin (no CORS) and carries the same cookies as the page.
#
# Route ORDER matters here — the /socket and /uploads rules carry a higher
# priority so the catch-all serving gamja cannot swallow them.
#
# NOTE ON AUTH: /socket and /uploads are deliberately NOT behind Authentik
# forward-auth. soju authenticates the IRC connection itself (SASL/PASS against
# its own accounts), and a WebSocket upgrade intercepted by forward-auth cannot
# fall back to a login page — it just fails. The web UI is gated; the protocol
# endpoint is authenticated by the protocol. Once soju's OAuth2 auth is wired to
# Authentik, both ends become one login.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: irc
  namespace: irc
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "IRC"
    gethomepage.dev/description: "soju bouncer + gamja web client"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "irc.png"
    gethomepage.dev/siteMonitor: "http://gamja.irc.svc.cluster.local:80"
spec:
  entryPoints:
    - websecure
  routes:
    # soju's IRCv3 WebSocket.
    - match: Host(`irc.${CLUSTER_DOMAIN}`) && PathPrefix(`/socket`)
      kind: Rule
      priority: 100
      services:
        - name: soju
          port: 8080
    # soju's file uploads.
    - match: Host(`irc.${CLUSTER_DOMAIN}`) && PathPrefix(`/uploads`)
      kind: Rule
      priority: 100
      services:
        - name: soju
          port: 8080
    # The web client, gated by SSO, and carrying the Catalyst nav bar.
    - match: Host(`irc.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        # NO authentik middleware, and that is currently forced rather than
        # chosen. The forward-auth middleware hands the request to the embedded
        # outpost, and the outpost answers 404 — not a login redirect — for any
        # external_host it does not know. A provider for irc.talos00 now EXISTS
        # (infrastructure/base/authentik/irc-blueprint.yaml, applied fine), but
        # the outpost's provider list is REPLACE-not-merge and authoritative in
        # talos-private-blueprint.yaml, and THAT blueprint currently fails
        # validation outright:
        #
        #   Entry invalid: {'client_id': ['OAuth2/OpenID Provider with this
        #   Client ID already exists.']}
        #
        # because it declares provider `zipline-oidc` with client_id `zipline`
        # while zipline-blueprint.yaml already owns a provider `zipline` with
        # the same client_id. One collision fails the whole blueprint, so the
        # outpost union is frozen and nothing new can join it — irc included.
        # Attaching the middleware here would serve a 404, which is precisely
        # the bug this replaced.
        #
        # This is NOT unauthenticated access to IRC: soju authenticates every
        # connection itself (SASL/PASS against its own accounts), so the web UI
        # is only a client shell until you log in. Re-add the middleware once
        # the zipline client_id collision is resolved and irc appears in the
        # outpost.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: gamja
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: irc-http
  namespace: irc
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`irc.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: gamja
          port: 80
