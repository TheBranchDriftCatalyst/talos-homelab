---
# One hostname, three routes. gamja and soju share an origin on purpose: the
# client is served from / and talks to the bouncer at /socket, so the WebSocket
# is same-origin (no CORS) and carries the same cookies as the page.
#
# Route ORDER matters here — the /socket and /uploads rules carry a higher
# priority so the catch-all serving gamja cannot swallow them.
#
# NOTE ON AUTH: /socket and /uploads are deliberately NOT behind Authentik
# forward-auth. soju authenticates the IRC connection itself (SASL/PASS against
# its own accounts), and a WebSocket upgrade intercepted by forward-auth cannot
# fall back to a login page — it just fails. The web UI is gated; the protocol
# endpoint is authenticated by the protocol. Once soju's OAuth2 auth is wired to
# Authentik, both ends become one login.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: irc
  namespace: irc
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "IRC"
    gethomepage.dev/description: "The Lounge — IRC client + bouncer"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "irc.png"
    gethomepage.dev/siteMonitor: "http://thelounge.irc.svc.cluster.local:9000"
spec:
  entryPoints:
    - websecure
  routes:
    # One service now. The Lounge serves the UI and its own websocket on the
    # same port, so the separate /socket and /uploads routes that soju needed
    # are gone — and with them the reason any route had to skip forward-auth.
    - match: Host(`irc.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        # authentik FIRST, catalyst-nav SECOND: Traefik runs middlewares forward
        # on the request and reverse on the response, so auth happens inbound
        # and nav injection outbound.
        - name: authentik
          namespace: authentik
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: thelounge
          port: 9000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: irc-http
  namespace: irc
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`irc.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: thelounge
          port: 9000
