---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: irc
resources:
  - namespace.yaml
  - thelounge.yaml
  - ingressroute.yaml

# configMapGenerator, NOT a plain ConfigMap: config.js is mounted by subPath and
# a subPath mount is FROZEN at pod start. With a stable name the pod template
# never changes either, so Flux has nothing to roll and the old config runs
# forever. The content hash is what actually triggers a rollout on edit.
configMapGenerator:
  - name: thelounge-config
    files:
      - config.js=config/config.js
