# Advertised name; must match how clients reach it or IRCv3 gets confused.
hostname irc.talos00
# Quoted: soju's config parser is whitespace-separated, so an unquoted
# two-word title parses as two parameters and refuses to start.
title "Catalyst IRC"

# http+insecure serves BOTH the IRCv3 WebSocket (/socket) and uploads
# (/uploads) over plain HTTP, so ordinary HTTP routing reaches it and Traefik
# terminates TLS at the edge. "insecure" names the LISTENER, not the
# connection. Choosing this over ircs:// is why this app needs no TCP routing.
listen http+insecure://:8080

# Admin socket. Without this, sojuctl refuses every command with "no listen
# unix+admin directive found in config" — and since the image is distroless
# (no shell) there is no other way in, so user management is impossible.
# soju has NO self-registration: accounts are created here with
#   kubectl -n irc exec deploy/soju -- sojuctl user create -username X -password Y
# The socket lives on an emptyDir because the root filesystem is read-only.
listen unix+admin:///run/soju/admin

db postgres "host=soju-postgres-rw.irc.svc.cluster.local user=soju dbname=soju sslmode=disable"

# `db` (not `fs`/`memory`) is what gives full-text search over scrollback.
message-store db

file-upload fs /uploads

# Internal auth for now: soju keeps its own accounts, created with sojuctl.
# soju also supports `auth oauth2 <url>` with RFC 8414 discovery and RFC 7662
# introspection, both of which Authentik speaks — that is the path to a true
# single login, and is deliberately a SEPARATE change so this one is proven
# working first.
auth internal
