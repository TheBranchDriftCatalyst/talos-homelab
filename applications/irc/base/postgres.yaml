---
# Postgres for soju: user accounts, network config, and the message store.
#
# soju can use sqlite, but postgres buys two things that matter here: its `db`
# message store gains FULL-TEXT SEARCH over scrollback, and history survives
# independently of any single pod's disk.
#
# local-path + 3 instances, per the standing rule that CNPG never runs on NFS —
# Postgres on NFS is a torn-write and locking hazard, and a single instance on
# local-path has no redundancy at all. Both halves of that rule matter.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: soju-postgres
  namespace: irc
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-standard-bookworm
  storage:
    size: 5Gi
    storageClass: local-path
  # Velero must skip CNPG pods/PVCs — a filesystem snapshot of a live Postgres
  # data directory is a torn copy that looks like a backup and will not restore.
  # Restoring this is a CNPG recovery, never a Velero restore.
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: 'true'
  postgresql:
    parameters:
      max_connections: '100'
  bootstrap:
    initdb:
      database: soju
      owner: soju
      # Pin the collation before any data exists. initdb runs exactly once, and
      # the default C collation silently changes how text ORDER BY behaves —
      # which for chat scrollback means search and ordering quietly differ from
      # what anyone expects.
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
