---
# audiobookshelf deltas vs ../_instance/deployment.yaml (SMP; container merge
# key is the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: audiobookshelf
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobookshelf
      annotations:
        backup.velero.io/backup-volumes: "config,metadata"
    spec:
      containers:
        - name: app-template
          image: ghcr.io/advplyr/audiobookshelf:latest
          env:
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            - name: audiobooks
              mountPath: /audiobooks
          livenessProbe:
            initialDelaySeconds: 40
          readinessProbe:
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
