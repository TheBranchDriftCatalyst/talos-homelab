---
# Second appdata PVC (audiobookshelf keeps /metadata separate from /config).
# local-path (SQLite-safe); node-pinned via deployment nodeAffinity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
