apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# audiobookshelf = ../_instance skeleton + deltas only (see patch-*.yaml).
# Carries a second appdata PVC (metadata) on top of the template's config PVC.

resources:
  - ../_instance
  - pvc-metadata.yaml
  - ingressroute-http.yaml  # web→https redirect (native OIDC route is on websecure)

labels:
  # App identity — stamped into metadata + selectors + pod template.
  - pairs:
      app: audiobookshelf
    includeSelectors: true
  - pairs:
      app.kubernetes.io/component: audiobook-server
      category: audiobook-server

patches:
  - path: patch-deployment.yaml
    target: {kind: Deployment}
  - path: patch-ingressroute.yaml
    target: {kind: IngressRoute, name: app-template}  # scope: NOT the -http redirect route
  # Rename template placeholders + set ports.
  - target: {kind: Deployment, name: app-template}
    patch: |-
      - {op: replace, path: /metadata/name, value: audiobookshelf}
      - {op: replace, path: /spec/template/spec/containers/0/name, value: audiobookshelf}
      - {op: replace, path: /spec/template/spec/containers/0/ports/0/containerPort, value: 80}
  - target: {kind: Service, name: app-template}
    patch: |-
      - {op: replace, path: /metadata/name, value: audiobookshelf}
      - {op: replace, path: /spec/ports/0/port, value: 80}
  - target: {kind: IngressRoute, name: app-template}
    patch: |-
      - {op: replace, path: /metadata/name, value: audiobookshelf}
  - target: {kind: PersistentVolumeClaim, name: app-template-config}
    patch: |-
      - {op: replace, path: /metadata/name, value: audiobookshelf-config}
