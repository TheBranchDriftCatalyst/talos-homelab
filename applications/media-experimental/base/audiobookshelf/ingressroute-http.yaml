---
# audiobookshelf — web→https redirect (native OIDC lives on websecure, see
# patch-ingressroute). No authentik middleware.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`audiobookshelf.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: audiobookshelf
          port: 80
