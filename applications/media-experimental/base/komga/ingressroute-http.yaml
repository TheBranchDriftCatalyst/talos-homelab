---
# komga — web→https redirect (native OIDC lives on websecure, see
# patch-ingressroute). No authentik middleware.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: komga-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`komga.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: komga
          port: 25600
