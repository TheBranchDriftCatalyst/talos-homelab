---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga
  labels:
    app: komga
    app.kubernetes.io/name: komga
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: komga
  template:
    metadata:
      labels:
        app: komga
        app.kubernetes.io/name: komga
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      # local-path appdata → pin to talos03 (matches arr-stack convention)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [talos03]
      securityContext:
        fsGroup: 1000
        supplementalGroups: [100, 1000]  # 100 = Synology 'users' for NFS write
      containers:
        - name: komga
          image: gotson/komga:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 25600
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: comics
              mountPath: /comics
            - name: books
              mountPath: /books
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: komga-config
        - name: comics
          persistentVolumeClaim:
            claimName: comics
        - name: books
          persistentVolumeClaim:
            claimName: books
