---
# komga — HTTPS on komga.talos00 for NATIVE OIDC (TALOS-xgrl.18).
# NO authentik forward-auth middleware: Komga does its own Spring Security OIDC so
# Tachiyomi/Mihon/Paperback + OPDS keep working; access is gated at the IdP
# (talos-media / cluster-admin PolicyBindings). Switched web→websecure so the OAuth
# redirect_uri https://komga.talos00/login/oauth2/code/authentik is served over TLS.
# TLS: default TLSStore serves the *.talos00 wildcard via SNI. See ingressroute-http
# for the web→https redirect.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Komga"
    gethomepage.dev/description: "Comic / Manga Server"
    gethomepage.dev/group: "Books & Comics"
    gethomepage.dev/weight: "11"
    gethomepage.dev/icon: "komga.png"
    gethomepage.dev/siteMonitor: "http://komga.media-experimental.svc.cluster.local:25600"
    gethomepage.dev/widget.type: "komga"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_KOMGA_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_KOMGA_PASSWORD}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`komga.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: komga
          port: 25600
