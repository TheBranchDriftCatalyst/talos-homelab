---
# Appdata on local-path (SQLite-safe). Node-pinned via deployment nodeAffinity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: komga-config
  labels:
    app: komga
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
