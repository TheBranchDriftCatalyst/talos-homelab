---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: komga
  labels:
    app: komga
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Komga"
    gethomepage.dev/description: "Comic / Manga Server"
    gethomepage.dev/group: "Books & Comics"
    gethomepage.dev/weight: "11"
    gethomepage.dev/icon: "komga.png"
    gethomepage.dev/href: "http://komga.${CLUSTER_DOMAIN}"
    gethomepage.dev/siteMonitor: "http://komga.media-experimental.svc.cluster.local:25600"
    gethomepage.dev/widget.type: "komga"
    gethomepage.dev/widget.url: "http://komga.media-experimental.svc.cluster.local:25600"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_KOMGA_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_KOMGA_PASSWORD}}"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`komga.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: komga
          port: 25600
