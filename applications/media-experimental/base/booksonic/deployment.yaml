---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booksonic
  labels:
    app: booksonic
    app.kubernetes.io/name: booksonic
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: booksonic
  template:
    metadata:
      labels:
        app: booksonic
        app.kubernetes.io/name: booksonic
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      # local-path appdata → pin to talos03 (matches arr-stack convention)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [talos03]
      securityContext:
        fsGroup: 1000
        supplementalGroups: [100, 1000]  # 100 = Synology 'users' for NFS write
      containers:
        - name: booksonic
          image: lscr.io/linuxserver/booksonic-air:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: audiobooks
              mountPath: /audiobooks
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: booksonic-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
