---
# booksonic — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: booksonic-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`booksonic.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: booksonic
          port: 4040
