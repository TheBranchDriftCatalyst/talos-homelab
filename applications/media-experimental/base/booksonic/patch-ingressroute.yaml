---
# booksonic gethomepage identity + final Host/service route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Booksonic"
    gethomepage.dev/description: "Audiobook Streaming (Subsonic)"
    gethomepage.dev/group: "Audiobooks"
    gethomepage.dev/weight: "12"
    gethomepage.dev/icon: "booksonic.png"
    gethomepage.dev/href: "http://booksonic.${CLUSTER_DOMAIN}"
    gethomepage.dev/siteMonitor: "http://booksonic.media-experimental.svc.cluster.local:4040"
spec:
  routes:
    - match: Host(`booksonic.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: booksonic
          port: 4040
