---
# booksonic deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: booksonic
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booksonic
    spec:
      containers:
        - name: app-template
          # :latest lost its amd64 manifest (deprecated image); pin last good multiarch build
          image: lscr.io/linuxserver/booksonic-air:2201.1.0
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: audiobooks
              mountPath: /audiobooks
          livenessProbe:
            initialDelaySeconds: 40
          readinessProbe:
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: booksonic-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
