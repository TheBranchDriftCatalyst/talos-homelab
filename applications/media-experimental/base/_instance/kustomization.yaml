apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared single-app skeleton for the media-experimental stack (epic TALOS-vo0i,
# TALOS-937u). NEVER built directly — each ../<app>/ includes this and carries
# ONLY the real deltas:
#   - labels transformer stamps `app: <name>` (metadata + selectors + template)
#   - patch-deployment.yaml  = image / env / mounts+volumes / probe timings /
#                              resources / app.kubernetes.io/name
#   - patch-ingressroute.yaml = gethomepage annotations + Host/service route
#   - inline JSON patches rename `app-template*` placeholders and set ports
# Apps needing extra resources (audiobookshelf metadata PVC, storyteller
# ExternalSecret) add them alongside in their own dir.

resources:
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - pvc.yaml
