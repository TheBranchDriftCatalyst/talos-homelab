---
# Skeleton Deployment — placeholder name/image/port are ALWAYS overridden by
# the including app dir. Defaults below are the stack's modal values; apps
# that differ patch just the delta (SMP merges maps, e.g. probe timings).
# env/volumeMounts/volumes are deliberately absent: every app differs (and
# SMP env merge would reorder), so each patch-deployment.yaml carries them
# in full (TZ first, matching the original manifests).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app: app-template
    app.kubernetes.io/name: app-template
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-template
  template:
    metadata:
      labels:
        app: app-template
        app.kubernetes.io/name: app-template
        # Stamped explicitly on the POD, not just the Deployment. The kustomization's
        # `labels:` block adds app.kubernetes.io/part-of to resource metadata but NOT to
        # pod templates — that is what its own "does not touch selectors" comment means.
        # The topologySpreadConstraint below selects on this label, and a labelSelector
        # matching zero pods is a SILENT no-op: the constraint is accepted, reports
        # nothing, and simply never spreads anything.
        app.kubernetes.io/part-of: media-experimental
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      # UNPINNED 2026-08-24. This used to hard-code a hostname via
      # ${MEDIA_EXPERIMENTAL_NODE:=talos03}, which was the SECOND half of a two-part
      # pin — the local-path config PVCs carried a nodeAffinity of their own, so the
      # pods could not leave that node regardless of what this said.
      #
      # Both halves are gone. The affinity is removed here, and the node-bound PVCs
      # were deleted so the stack reprovisions wherever the scheduler puts it. The
      # config data was explicitly disposable — nothing in this namespace was in use —
      # and a verified backup exists on the NFS config-backup PVC regardless: that
      # restore path was exercised end to end earlier the same day, 12/12 archives
      # sha256-verified with correct uid:gid ownership.
      #
      # WHY IT WAS PINNED, kept because the failure mode is still real: sonarr once had
      # its PVC removed and the pod stayed welded to the node anyway while every check
      # reported green. A hostname in a Deployment outlives the volume that justified
      # it. If these workloads ever need node-local storage again, restore the variable
      # AND update backup/cronjob-restore.yaml, which reads the same variable so the
      # restore Job provisions on the node the pods are being sent to. Change them
      # together or not at all.
      #
      # talos03 is the 15 GiB node that wedged on memory exhaustion today; this stack
      # was 11 of the workloads holding it there. (TALOS-3hl8.4)
      # SPREAD, not a pin. Removing the old hostname affinity was necessary but not
      # sufficient: with no constraint at all, kube-scheduler put all twelve straight
      # back onto talos03. That is not random — talos03 has the MOST CPU in the fleet
      # (15600m) and the LEAST memory (12.5Gi allocatable), and the default
      # BalancedAllocation scoring favours a node whose CPU and memory utilisation are
      # out of balance. Memory-only pods are exactly what "corrects" that imbalance, so
      # the emptiest-looking node by CPU keeps winning for the workloads least able to
      # afford it. It is the same shape as the wedge: the scheduler reasons about
      # requests and cores, not about the 0.61 GiB of real memory that node had left.
      #
      # maxSkew 2 rather than 1: twelve pods over five nodes cannot divide evenly, and
      # skew 1 would leave pods Pending whenever a node is briefly unavailable.
      # ScheduleAnyway keeps it a preference — the stack must never fail to start
      # because the spread cannot be satisfied.
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: media-experimental
      securityContext:
        fsGroup: 1000
        supplementalGroups: [100, 1000]  # 100 = Synology 'users' for NFS write
      containers:
        - name: app-template
          image: overridden-per-app
          # ⚠️ ALWAYS, not IfNotPresent. This skeleton is inherited by every app in
          # media-experimental and NINE of them override the image with a floating :latest
          # tag (audiobookshelf, bindery, chaptarr, kavita, komga, libation, librarr,
          # mylar3, storyteller). With IfNotPresent a node serves whatever it cached —
          # possibly months ago — and never re-pulls, so THE RUNNING VERSION BECOMES
          # NODE-DEPENDENT. Every one of these apps keeps a SQLite library database on its
          # config PVC and migrates it forward on startup; landing on a node with an older
          # cached image means reading a database written by a newer one.
          #
          # That is not hypothetical — it took down Home Assistant for 15 days (88c4ee1c,
          # UnsupportedStorageVersionError) and corrupted immich's migration state, both on
          # the same day, both surfaced by a rolling reboot. Same bug fixed for the
          # arr-stack in fcc6c601. (TALOS-6gnx)
          #
          # Note the two pinned apps here (booksonic, livrarr) also inherit Always. For a
          # pinned tag that costs one registry round trip per pod start and changes nothing.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 65535  # overridden per app (JSON patch)
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
