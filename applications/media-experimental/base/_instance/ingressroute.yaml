---
# Skeleton IngressRoute — carries only the annotations shared by every app.
# Each app's patch-ingressroute.yaml merges its gethomepage identity
# annotations and REPLACES spec.routes (CRD lists don't SMP-merge) with the
# final Host + service name/port.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  labels:
    app: app-template
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app-template.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: app-template
          port: 65535
