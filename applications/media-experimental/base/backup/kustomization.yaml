apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Config backup/restore for the 12 local-path volumes that pin this stack to a
# single node (TALOS-uml1). Nothing here runs on its own -- all three CronJobs
# ship suspended and are triggered with `kubectl create job --from=cronjob/...`.
# See ./README.md for the node-reset runbook.

resources:
  - pvc.yaml
  - rbac.yaml
  - scripts-configmap.yaml
  - cronjob-backup.yaml
  - cronjob-restore.yaml
  - cronjob-restore-verify.yaml
