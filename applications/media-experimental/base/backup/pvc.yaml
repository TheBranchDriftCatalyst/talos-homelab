---
# Destination for the config archives (TALOS-uml1).
#
# WHY fatboy-nfs-appdata AND NOT MinIO:
#   1. It is off-cluster. The archives live on the Synology at
#      192.168.1.36:/volume1/appdata, so a talos03 reset -- or a cluster-wide
#      outage -- cannot touch them. That is the entire point of this PVC.
#   2. MinIO would land on the SAME NAS anyway: the tenant's own data0 PVC is
#      itself `fatboy-nfs-appdata`. Going via S3 buys no extra durability, only
#      an extra hop (tenant pod on talos06) and an extra failure mode.
#   3. No credentials. MinIO access would mean an ESO-generated scoped user, and
#      those regenerate on any spec change (SignatureDoesNotMatch drift). A
#      restore job is the worst possible place to discover that.
#   4. tar + sha256sum is all the tooling either job needs -- no mc, no secrets.
#   NFS is unsafe for LIVE SQLite, which is why the configs stay on local-path.
#   It is entirely safe for whole-file sequential tar.gz writes, which is all
#   this volume ever sees.
#
# Retain reclaim policy (from the StorageClass) means deleting this PVC does not
# delete the archives.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-backup
  labels:
    app.kubernetes.io/component: config-backup
spec:
  accessModes:
    - ReadWriteMany   # backup, restore and verify pods may land on different nodes
  storageClassName: fatboy-nfs-appdata
  resources:
    requests:
      storage: 10Gi   # ~67 MB per run uncompressed; holds the 5 retained runs many times over
