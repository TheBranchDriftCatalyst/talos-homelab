---
# The backup/restore jobs scale each Deployment to 0 for the duration of its own
# archive, so they need scale rights -- and nothing else. Namespace-scoped Role,
# no ClusterRole: this must never be able to touch another namespace's workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-backup
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]   # to wait for termination before tarring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-backup
subjects:
  - kind: ServiceAccount
    name: config-backup
    namespace: media-experimental
