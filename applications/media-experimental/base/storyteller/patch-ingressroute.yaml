---
# storyteller — HTTPS + Authentik forward-auth SSO on storyteller.talos00 (TALOS-xgrl.14).
# High-priority /api route has NO auth middleware so the Storyteller mobile app
# (position sync / library REST API) keeps working via its own account token; the
# default route is gated by the `authentik` forward-auth middleware. Storyteller has
# its own account login (no External-auth env) → inherent double-login on the web UI,
# acceptable. TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Storyteller"
    gethomepage.dev/description: "Synced Narration (ebook+audio)"
    gethomepage.dev/group: "Audiobooks"
    gethomepage.dev/weight: "13"
    gethomepage.dev/icon: "book.png"
    gethomepage.dev/siteMonitor: "http://storyteller.media-experimental.svc.cluster.local:8001"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`storyteller.${CLUSTER_DOMAIN}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: storyteller
          port: 8001
    - match: Host(`storyteller.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: storyteller
          port: 8001
