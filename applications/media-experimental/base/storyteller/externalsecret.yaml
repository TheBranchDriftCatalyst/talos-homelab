---
# Storyteller session/JWT signing key from 1Password item `storyteller`
# (TALOS-necc, epic TALOS-031k). De-hardcodes STORYTELLER_SECRET_KEY, which was
# committed in plaintext on the PUBLIC repo. Rotated to a fresh value — existing
# sessions invalidate on rotation, which is fine for this app.
#
# Target Secret NAME (`storyteller-secret`) and key (`STORYTELLER_SECRET_KEY`) are
# preserved so deployment.yaml's secretKeyRef keeps resolving unchanged.
# Namespace is inherited from the media-experimental base kustomization.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: storyteller-secret
  labels:
    app: storyteller
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: storyteller-secret
    creationPolicy: Owner
  data:
    - secretKey: STORYTELLER_SECRET_KEY
      remoteRef: {key: storyteller, property: secret-key}
