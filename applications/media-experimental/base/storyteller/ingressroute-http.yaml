---
# storyteller — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: storyteller-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`storyteller.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: storyteller
          port: 8001
