# EXPERIMENTAL: image tag + port unverified; adjust if it fails to start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storyteller
  labels:
    app: storyteller
    app.kubernetes.io/name: storyteller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storyteller
  template:
    metadata:
      labels:
        app: storyteller
        app.kubernetes.io/name: storyteller
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      # local-path appdata → pin to talos03 (matches arr-stack convention)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [talos03]
      securityContext:
        fsGroup: 1000
        supplementalGroups: [100, 1000]  # 100 = Synology 'users' for NFS write
      containers:
        - name: storyteller
          image: registry.gitlab.com/storyteller-platform/storyteller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # SQLite in /data (local-path, SQLite-safe) — Storyteller has no Postgres support.
            - name: STORYTELLER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: storyteller-secret
                  key: STORYTELLER_SECRET_KEY
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /data
            - name: books
              mountPath: /books
            - name: audiobooks
              mountPath: /audiobooks
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: storyteller-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
