---
# librarr deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: librarr
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librarr
    spec:
      containers:
        - name: app-template
          image: ghcr.io/jeremiahm37/librarr:latest
          env:
            - name: TZ
              value: America/New_York
            # AUTH_* is librarr's OWN login (upstream README: "Login username
            # (enables session auth)") -- NOT the qBittorrent client credentials
            # below. Password and API key come from 1Password item `librarr` via
            # externalsecret.yaml; they shipped as admin/changeme and
            # "changeme-generate-me" on a PUBLIC repo for 43 days.
            #
            # API_KEY is load-bearing: patch-ingressroute.yaml serves
            # PathPrefix(/api) at priority 100 with NO forward-auth middleware, so
            # this key is that route's only protection.
            - name: AUTH_USERNAME
              value: "admin"
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librarr-credentials
                  key: AUTH_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: librarr-credentials
                  key: API_KEY
            - name: QB_URL
              value: "http://qbittorrent.media.svc.cluster.local:8080"
            # QB_USER/QB_PASS are SEPARATE from AUTH_* (upstream README). They were
            # never set, so librarr fell back to its defaults admin/changeme and
            # login-looped against qBittorrent every ~30-60s -- 150+ ban events in a
            # single afternoon, and because qBit sees Traefik's pod IP for browser
            # traffic that noise helped ban real users out of the WebUI.
            - name: QB_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: username
            - name: QB_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: password
          volumeMounts:
            - name: config
              mountPath: /data
            - name: books
              mountPath: /books/ebooks
            - name: audiobooks
              mountPath: /books/audiobooks
            - name: comics
              mountPath: /books/manga
            - name: downloads-complete
              mountPath: /downloads
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: librarr-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
        - name: comics
          persistentVolumeClaim:
            claimName: comics
        - name: downloads-complete
          persistentVolumeClaim:
            claimName: downloads-complete
