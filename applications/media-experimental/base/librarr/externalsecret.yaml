---
# librarr's own credentials from 1Password item `librarr` (vault catalyst-eso).
#
# De-hardcodes the upstream placeholders that shipped in patch-deployment.yaml for
# 43 days on a PUBLIC repo:
#     AUTH_USERNAME = admin
#     AUTH_PASSWORD = changeme
#     API_KEY       = changeme-generate-me
#
# AUTH_* is librarr's OWN login (upstream README: "Login username (enables session
# auth)") — NOT its qBittorrent client credentials, which are QB_USER/QB_PASS and
# come from the reflected `qbittorrent-webui` Secret instead. Conflating those two
# is what had librarr login-looping against qBittorrent as admin/changeme.
#
# API_KEY matters more than it looks: patch-ingressroute.yaml deliberately serves
# Host(librarr.*) && PathPrefix(/api) at priority 100 with NO forward-auth
# middleware, "so API-key clients (*arr / download clients) keep working". That
# route's only protection IS this key, so a published placeholder meant /api was
# effectively open to anyone on the LAN who read the repo. (LAN-only: librarr has
# no public host — unlike the qBittorrent TALOS-lxz5.2 incident, where the same
# priority-100 /api carve-out served the API to the internet.)
#
# Namespace is inherited from the media-experimental base kustomization.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librarr-credentials
  labels:
    app: librarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: librarr-credentials
    creationPolicy: Owner
  data:
    - secretKey: AUTH_PASSWORD
      remoteRef: {key: librarr, property: auth-password}
    - secretKey: API_KEY
      remoteRef: {key: librarr, property: api-key}
