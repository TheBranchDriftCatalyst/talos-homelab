---
# librarr — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: librarr-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`librarr.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: librarr
          port: 5050
