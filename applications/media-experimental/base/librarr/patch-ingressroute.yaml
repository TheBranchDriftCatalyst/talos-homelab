---
# librarr — HTTPS + Authentik forward-auth SSO on librarr.talos00 (TALOS-xgrl.14).
# High-priority /api route has NO auth middleware so API-key clients (*arr / download
# clients) keep working; the default route is gated by the `authentik` forward-auth
# middleware. Librarr keeps its own login (no External-auth env) → inherent double-login
# on the web UI, acceptable. TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Librarr"
    gethomepage.dev/description: "Books *arr (13 search sources)"
    gethomepage.dev/group: "Book Automation (Exp)"
    gethomepage.dev/weight: "22"
    gethomepage.dev/icon: "book.png"
    gethomepage.dev/href: "https://librarr.${CLUSTER_DOMAIN}"
    gethomepage.dev/siteMonitor: "http://librarr.media-experimental.svc.cluster.local:5050"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`librarr.${CLUSTER_DOMAIN}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: librarr
          port: 5050
    - match: Host(`librarr.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: librarr
          port: 5050
  tls: {}
