---
# bindery deltas vs ../_instance/deployment.yaml (SMP; container merge key is
# the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: bindery
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bindery
    spec:
      securityContext:
        runAsUser: 1000   # bindery asserts BINDERY_PUID must match the running UID
        runAsGroup: 1000
      containers:
        - name: app-template
          image: ghcr.io/vavallee/bindery:latest
          env:
            - name: TZ
              value: America/New_York
            - name: BINDERY_PUID
              value: "1000"
            - name: BINDERY_PGID
              value: "1000"
            - name: BINDERY_PORT   # explicit: avoid any ambiguity with the listen address
              value: "8787"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: audiobooks
              mountPath: /audiobooks
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            initialDelaySeconds: 60
          readinessProbe:
            initialDelaySeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bindery-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads-complete
