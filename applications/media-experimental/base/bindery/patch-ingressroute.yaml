---
# bindery — HTTPS + Authentik forward-auth SSO on bindery.talos00 (TALOS-xgrl.14).
# High-priority /api route has NO auth middleware so API-key clients (*arr / download
# clients) keep working; the default route is gated by the `authentik` forward-auth
# middleware. Bindery keeps its own login (no External-auth env) → inherent double-login
# on the web UI, acceptable. TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Bindery"
    gethomepage.dev/description: "Books *arr (Usenet/torrent)"
    gethomepage.dev/group: "Book Automation (Exp)"
    gethomepage.dev/weight: "21"
    gethomepage.dev/icon: "book.png"
    gethomepage.dev/siteMonitor: "http://bindery.media-experimental.svc.cluster.local:8787"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bindery.${CLUSTER_DOMAIN}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: bindery
          port: 8787
    - match: Host(`bindery.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: bindery
          port: 8787
  tls: {}
