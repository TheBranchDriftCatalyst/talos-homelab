---
# bindery — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bindery-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`bindery.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: bindery
          port: 8787
