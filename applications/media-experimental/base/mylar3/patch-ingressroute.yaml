---
# mylar3 gethomepage identity + final Host/service route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Mylar3"
    gethomepage.dev/description: "Comic Book Manager (*arr for comics)"
    gethomepage.dev/group: "Book Automation (Exp)"
    gethomepage.dev/weight: "24"
    gethomepage.dev/icon: "mylar.png"
    gethomepage.dev/href: "http://mylar3.${CLUSTER_DOMAIN}"
    gethomepage.dev/siteMonitor: "http://mylar3.media-experimental.svc.cluster.local:8090"
spec:
  routes:
    - match: Host(`mylar3.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: mylar3
          port: 8090
