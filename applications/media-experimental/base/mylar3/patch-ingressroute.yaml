---
# mylar3 — HTTPS + Authentik forward-auth SSO on mylar3.talos00 (TALOS-xgrl.14).
# High-priority /api route has NO auth middleware so API-key clients (Torznab/newznab
# indexers, *arr integrations) keep working; the default route is gated by the
# `authentik` forward-auth middleware. Mylar3 ships with its HTTP login DISABLED by
# default → in that state Authentik SSO is the only gate (no double-login).
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Mylar3"
    gethomepage.dev/description: "Comic Book Manager (*arr for comics)"
    gethomepage.dev/group: "Book Automation (Exp)"
    gethomepage.dev/weight: "24"
    gethomepage.dev/icon: "mylar.png"
    gethomepage.dev/siteMonitor: "http://mylar3.media-experimental.svc.cluster.local:8090"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mylar3.${CLUSTER_DOMAIN}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: mylar3
          port: 8090
    - match: Host(`mylar3.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: mylar3
          port: 8090
