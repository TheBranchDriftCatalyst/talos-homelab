---
# mylar3 deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: mylar3
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mylar3
    spec:
      containers:
        - name: app-template
          image: lscr.io/linuxserver/mylar3:latest
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: comics
              mountPath: /comics
            - name: downloads-complete
              mountPath: /downloads
          resources:
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: mylar3-config
        - name: comics
          persistentVolumeClaim:
            claimName: comics
        - name: downloads-complete
          persistentVolumeClaim:
            claimName: downloads-complete
