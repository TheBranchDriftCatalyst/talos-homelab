---
# mylar3 — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mylar3-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`mylar3.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: mylar3
          port: 8090
