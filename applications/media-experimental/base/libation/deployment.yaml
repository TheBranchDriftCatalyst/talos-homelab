---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libation
  labels:
    app: libation
    app.kubernetes.io/name: libation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: libation
  template:
    metadata:
      labels:
        app: libation
        app.kubernetes.io/name: libation
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      # local-path appdata → pin to talos03 (matches arr-stack convention)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [talos03]
      securityContext:
        fsGroup: 1000
        supplementalGroups: [100, 1000]  # 100 = Synology 'users' for NFS write
      containers:
        - name: libation
          # silelmot/libation-container: Libation GUI served over noVNC on :6080
          # (bcnelson/libation_docker GHCR package is not publicly pullable → 403)
          image: silelmot/libation-container:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 6080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /root/Libation/Config
            - name: audiobooks
              mountPath: /root/Libation/Books  # Libation exports Audible downloads here
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: libation-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
