---
# libation deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: libation
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libation
    spec:
      containers:
        - name: app-template
          # silelmot/libation-container: Libation GUI served over noVNC on :6080
          # (bcnelson/libation_docker GHCR package is not publicly pullable → 403)
          image: silelmot/libation-container:latest
          env:
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: config
              mountPath: /root/Libation/Config
            - name: audiobooks
              mountPath: /root/Libation/Books  # Libation exports Audible downloads here
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: libation-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
