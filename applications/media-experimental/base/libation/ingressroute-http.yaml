---
# libation — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: libation-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`libation.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: libation
          port: 6080
