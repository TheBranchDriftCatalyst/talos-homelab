apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media-experimental

resources:
  - storage.yaml
  # Config backup/restore for the local-path config volumes (TALOS-uml1) —
  # suspended CronJobs, triggered by hand. See backup/README.md.
  - backup/
  # Ebook / comic readers
  - kavita/
  - komga/
  - bookorbit/  # Postgres-backed (CNPG + pgvector) — the one app here that is NOT node-pinned
  # Audiobook servers
  - audiobookshelf/
  - booksonic/
  - storyteller/  # SQLite-based (no Postgres); needs STORYTELLER_SECRET_KEY (secret.yaml)
  # Book *arr managers (Readarr-replacement bake-off)
  - chaptarr/
  - bindery/
  - librarr/
  - livrarr/
  - mylar3/  # dedicated comic-book download manager (ComicVine/Torznab)
  # Audible tools
  - libation/

# Common labels across the whole experimental stack.
# (labels: does not touch selectors, so it's safe on Deployments.)
labels:
  - pairs:
      app.kubernetes.io/part-of: media-experimental
      experimental: "true"

# Reduce stale ReplicaSets (matches arr-stack convention)
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 3
  # Disable k8s service-link env injection (<SVC>_PORT=tcp://… collides with app
  # config vars like BINDERY_PORT and pollutes .NET ASPNETCORE_* — breaks bindery/chaptarr).
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
