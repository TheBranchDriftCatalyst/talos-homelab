---
# kavita deltas vs ../_instance/deployment.yaml (SMP; container merge key is
# the placeholder name — renamed afterwards in kustomization.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: kavita
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kavita
    spec:
      containers:
        - name: app-template
          image: jvmilazz0/kavita:latest
          env:
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: config
              mountPath: /kavita/config
            - name: books
              mountPath: /books
            - name: comics
              mountPath: /comics
          livenessProbe:
            initialDelaySeconds: 30
          readinessProbe:
            initialDelaySeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: comics
          persistentVolumeClaim:
            claimName: comics
