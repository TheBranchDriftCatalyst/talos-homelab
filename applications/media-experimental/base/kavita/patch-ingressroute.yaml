---
# kavita gethomepage identity + final Host/service route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Kavita"
    gethomepage.dev/description: "Ebook / Comic / Manga Reader"
    gethomepage.dev/group: "Books & Comics"
    gethomepage.dev/weight: "10"
    gethomepage.dev/icon: "kavita.png"
    gethomepage.dev/href: "http://kavita.${CLUSTER_DOMAIN}"
    gethomepage.dev/siteMonitor: "http://kavita.media-experimental.svc.cluster.local:5000"
    gethomepage.dev/widget.type: "kavita"
    gethomepage.dev/widget.url: "http://kavita.media-experimental.svc.cluster.local:5000"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_KAVITA_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_KAVITA_PASSWORD}}"
spec:
  routes:
    - match: Host(`kavita.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: kavita
          port: 5000
