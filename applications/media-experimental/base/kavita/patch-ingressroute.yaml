---
# kavita — HTTPS on kavita.talos00 for NATIVE OIDC (TALOS-xgrl.18).
# NO authentik forward-auth middleware: Kavita does its own OIDC so Paperback/OPDS
# keep working; access is gated at the IdP (talos-media / cluster-admin
# PolicyBindings). Switched web→websecure so the OAuth redirect_uri
# https://kavita.talos00/signin-oidc is served over TLS.
# TLS: default TLSStore serves the *.talos00 wildcard via SNI. See ingressroute-http
# for the web→https redirect.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Kavita"
    gethomepage.dev/description: "Ebook / Comic / Manga Reader"
    gethomepage.dev/group: "Books & Comics"
    gethomepage.dev/weight: "10"
    gethomepage.dev/icon: "kavita.png"
    gethomepage.dev/siteMonitor: "http://kavita.media-experimental.svc.cluster.local:5000"
    gethomepage.dev/widget.type: "kavita"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_KAVITA_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_KAVITA_PASSWORD}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kavita.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: kavita
          port: 5000
