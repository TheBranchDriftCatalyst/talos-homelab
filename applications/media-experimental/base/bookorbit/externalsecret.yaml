---
# BookOrbit's two required app secrets — GENERATED IN-CLUSTER (no 1Password).
#
#   JWT_SECRET            signs session/refresh tokens. Must be >=16 chars and must
#                         not be the literal "change-me-in-production" — BookOrbit's
#                         env validation rejects both (server/src/config/env.validation.ts).
#   SETUP_BOOTSTRAP_TOKEN gates the first-run setup wizard. BookOrbit REFUSES TO
#                         START with NODE_ENV=production and this blank, so it is
#                         not optional even though nothing uses it after setup.
#
# Both values are OURS to choose, so an ESO Password generator mints the entropy
# and a template derives the two independent values from it — same generate-once
# pattern as tautulli/minio-scoped-users.
#
# ONE GENERATOR, TWO VALUES. The two secrets are derived by hashing the single
# generated password under two different prefixes. They are independent in the
# sense that neither reveals the other, and this avoids a second generator whose
# only distinguishing feature would be its name. Each renders as 64 lowercase hex
# chars = 256 bits, comfortably over BookOrbit's 16-char floor.
#
# ROTATION IS NOT FREE — DO NOT CASUALLY DELETE THIS SECRET. Rotating JWT_SECRET
# invalidates every active session AND every issued refresh token, so all web
# users and every paired Kobo/KOReader device must log in again. That is why
# refreshInterval is "0".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: bookorbit-secrets
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  length: 48
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-secrets
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  # Generate-once: "0" disables refresh so these are minted exactly once and never
  # rotated behind our back. This is not cosmetic — ESO generator-backed secrets
  # REGENERATE on reconcile, and a surprise JWT_SECRET rotation logs out every
  # paired e-reader. Explicit so the Kyverno externalsecret-defaults policy's 1h
  # default is never stamped on. (That policy also skips the secretStoreRef default
  # for generator-sourced ExternalSecrets — this deliberately has NO secretStoreRef.)
  refreshInterval: "0"
  target:
    name: bookorbit-secrets
    creationPolicy: Owner
    # Keep the Secret even if this ExternalSecret is ever pruned — the sessions and
    # device pairings signed by that JWT_SECRET stay valid.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: bookorbit
      data:
        JWT_SECRET: '{{ printf "bookorbit-jwt:%s" .password | sha256sum }}'
        SETUP_BOOTSTRAP_TOKEN: '{{ printf "bookorbit-bootstrap:%s" .password | sha256sum }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-secrets
---
# BOOK_REQUEST_ENCRYPTION_KEY — encrypts the download-client credentials stored
# by the Requests feature (Prowlarr / SABnzbd), which arrived in BookOrbit 3.0.0.
# Without it the Requests settings page refuses to save a client credential:
#   "BOOK_REQUEST_ENCRYPTION_KEY is not set, so a client credential cannot be saved"
# It is NOT a startup blocker — env.validation defaults it to '' and the app runs.
#
# DELIBERATELY A SEPARATE GENERATOR + ExternalSecret, not a third key templated
# onto bookorbit-secrets above. That one is generate-once by design, and an ESO
# generator-backed secret REGENERATES on a spec change -- refreshInterval "0"
# only stops the timer, it does not stop a reconcile triggered by editing the
# spec. Adding a key there would therefore mint a NEW password, rotating
# JWT_SECRET with it and logging out every web session AND every paired
# Kobo/KOReader device. A new object leaves that spec byte-identical.
#
# STABILITY IS LOAD-BEARING. The app reports
#   "stored credentials cannot be read ... BOOK_REQUEST_ENCRYPTION_KEY may have
#    changed"
# when the value moves, so every saved download-client credential is decryptable
# only by this exact value. refreshInterval "0" + deletionPolicy Retain, same as
# its sibling. Do not delete this Secret to "re-roll" it.
#
# sha256sum renders 64 lowercase hex chars = 32 bytes, exactly the shape the
# app's own hint asks for (`openssl rand -hex 32`).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: bookorbit-request-key
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  length: 48
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-request-key
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  refreshInterval: "0"
  target:
    name: bookorbit-request-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: bookorbit
      data:
        BOOK_REQUEST_ENCRYPTION_KEY: '{{ printf "bookorbit-requestkey:%s" .password | sha256sum }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-request-key
