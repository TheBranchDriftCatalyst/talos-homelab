---
# Declarative extension management for the `bookorbit` database (epic TALOS-3hl8).
#
# The database itself is created by the cluster's bootstrap initdb (postgres.yaml)
# so that CNPG generates the bookorbit-postgres-app secret with a `uri` key
# pointing at it. This CR ADOPTS that database and exists for one job: to keep the
# four required extensions declared true.
#
# WHY A Database CR AND NOT postInitApplicationSQL / A psql Job:
#   * postInitApplicationSQL runs exactly once, at bootstrap, and is never
#     reconciled again. An extension dropped by hand, or a database restored from
#     a backup taken before an extension was added, stays broken silently.
#   * A psql Job is imperative glue for something the operator already models.
#   * SUPERUSER. pgvector's vector.control carries no `trusted = true`, so
#     `CREATE EXTENSION vector` REQUIRES superuser — the `bookorbit` app role
#     cannot do it, and CNPG does not hand out superuser (enableSuperuserAccess
#     defaults false). The operator reconciles this CR over its own superuser
#     connection, which is the only clean way to get the extension created.
#
# BookOrbit ALSO runs `CREATE EXTENSION IF NOT EXISTS` for all four at every
# startup (server/src/scripts/postgres-extensions.ts). That is not redundant with
# this and it is not a substitute for it: once the extensions exist, those
# statements are privilege-free no-ops that succeed as the app role. If they did
# not already exist, that startup code would fail on `vector` for the superuser
# reason above. This CR is what makes the app's own startup succeed.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  cluster:
    name: bookorbit-postgres
  name: bookorbit
  owner: bookorbit
  ensure: present
  # Deleting this CR must never drop the database — it holds the app's entire
  # state. Dropping is a deliberate, manual act.
  databaseReclaimPolicy: retain
  extensions:
    # All four are present in the ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
    # operand image (see the verification note in postgres.yaml) — nothing here
    # needs an ImageVolume extension image.
    - {name: uuid-ossp, ensure: present}
    - {name: pg_trgm, ensure: present}
    - {name: unaccent, ensure: present}
    - {name: vector, ensure: present} # pgvector — book_metadata.embedding vector(256) + HNSW index
