---
# Daily base backup for bookorbit-postgres → cnpg-backups (epic TALOS-3hl8).
# 03:10 — offset from the other clusters' slots so the nightly window staggers.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bookorbit-postgres-daily
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. This Postgres is
    # being converted to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are
    # removed from this repo in the following commit and the composite adopts the live
    # objects. Without this annotation, removing them would prune the Cluster and CNPG
    # would delete its PVCs — i.e. destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  schedule: "0 10 3 * * *" # 03:10 daily (6-field: sec min hour dom mon dow)
  immediate: true
  backupOwnerReference: self
  # barman-cloud CNPG-I plugin (see objectstore.yaml) — in-tree method removed in CNPG 1.30
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bookorbit-postgres
