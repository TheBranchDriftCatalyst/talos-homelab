---
# bookorbit — web→https redirect. The app itself is served on websecure
# (see ingressroute.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bookorbit-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`bookorbit.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: bookorbit
          port: 3000
