---
# Barman Cloud plugin ObjectStore for bookorbit-postgres (epic TALOS-3hl8).
# Same bucket/creds as every other cluster in the fleet; own prefix.
#
# The `cnpg-minio-backup` Secret this references is minted ONCE in ns minio
# (infrastructure/base/minio/cnpg-backup/externalsecret.yaml) and fanned into each
# CNPG namespace by reflector — CNPG cannot read a Secret across namespaces.
# `media-experimental` had to be ADDED to that reflector allow/auto list; if this
# ObjectStore reports missing credentials, check that the namespace is still on
# both annotation lists there.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bookorbit-postgres
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. This Postgres is
    # being converted to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are
    # removed from this repo in the following commit and the composite adopts the live
    # objects. Without this annotation, removing them would prune the Cluster and CNPG
    # would delete its PVCs — i.e. destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: media-experimental
spec:
  retentionPolicy: "30d" # prune backups + WALs older than 30 days
  configuration:
    destinationPath: s3://cnpg-backups/bookorbit-postgres
    endpointURL: http://minio-hl.minio.svc:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
