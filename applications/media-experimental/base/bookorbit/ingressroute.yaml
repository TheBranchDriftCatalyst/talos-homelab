---
# bookorbit — HTTPS on bookorbit.talos00.
#
# websecure rather than web, for the same reason komga/kavita/audiobookshelf are:
# BookOrbit's OIDC callback is a FRONT-END route (/oauth2-callback) that the
# browser is redirected to, and its Kobo / KOReader sync clients talk to this host
# directly. Serving it over TLS now means turning OIDC on later is a pure
# admin-UI change with no route churn. TLS: the default TLSStore serves the
# *.talos00 wildcard via SNI.
#
# NO authentik forward-auth middleware, deliberately. BookOrbit has first-party
# sync clients (Kobo, KOReader) and OPDS, none of which can satisfy a browser
# cookie challenge — a forward-auth proxy would break every one of them, exactly
# as it would for komga. Access control is the app's own, with Authentik OIDC as
# the intended identity source (see OIDC.md).
#
# Kyverno DERIVES three annotations and the tls stanza — do not hand-write them:
#   gethomepage.dev/siteMonitor  <- http://bookorbit.media-experimental.svc.cluster.local:3000
#   gethomepage.dev/href         <- https://bookorbit.talos00
#   gethomepage.dev/widget.url   <- mirrors siteMonitor (only when widget.type is set)
#   tls: {}                      <- ingressroute-tls-default, for websecure routes
# No widget.type is set: homepage has no bookorbit widget, and setting one would
# only produce a dead widget.url.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bookorbit
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "BookOrbit"
    gethomepage.dev/description: "Ebook / Audiobook / Comic Library + Reader"
    gethomepage.dev/group: "Books & Comics"
    gethomepage.dev/weight: "13"
    gethomepage.dev/icon: "bookorbit.png"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bookorbit.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: bookorbit
          port: 3000
