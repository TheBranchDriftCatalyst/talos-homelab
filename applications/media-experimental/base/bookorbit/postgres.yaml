---
# CloudNativePG Postgres for BookOrbit (epic TALOS-3hl8 — de-pinning media-experimental).
#
# WHY THIS EXISTS AT ALL: every other app in media-experimental keeps its state in
# a SQLite file on a `local-path` PVC, which pins the pod to talos03 forever. That
# pin is what blocks resetting talos03 to promote it to a control plane. BookOrbit
# is the FIRST app in this namespace that never needs that trade — it speaks
# external PostgreSQL natively, so its state lives here and nothing about it is
# node-bound. There is deliberately no local-path PVC and no nodeAffinity anywhere
# in this app's manifests.
#
# ============================================================================
# IMAGE PIN — THE `-system-` SUFFIX IS LOAD-BEARING. DO NOT DROP IT.
# ============================================================================
# BookOrbit requires FOUR Postgres extensions, verified in its source:
#   uuid-ossp, pg_trgm, unaccent  — ordinary contrib
#   vector (pgvector)             — NOT contrib
# The pgvector requirement is real and not an artifact of upstream's compose file
# choosing a pgvector base image. Evidence in the app repo:
#   server/src/db/migrations/0000_baseline.sql:386   "embedding" vector(256)
#   server/src/db/migrations/0000_baseline.sql:1131  CREATE INDEX ... USING hnsw
#                                                    ("embedding" vector_cosine_ops)
#   server/src/scripts/postgres-extensions.ts        CREATE EXTENSION ... "vector"
# That runs in the BASELINE migration, before the app will serve anything, so
# without pgvector BookOrbit does not start degraded — it does not start.
#
# THE OBVIOUS ROUTE IS A TRAP. CNPG 1.30 exposes spec.postgresql.extensions
# (ImageVolume-mounted extension images, e.g. ghcr.io/cloudnative-pg/pgvector).
# It CANNOT WORK ON THIS CLUSTER TODAY: the Kubernetes `ImageVolume` feature gate
# is not enabled (kube-apiserver has no --feature-gates flag; kubelet /configz
# lists only LocalStorageCapacityIsolationFSQuotaMonitoring). Verified empirically
# 2026-08-22 with a probe Pod — the API server SILENTLY STRIPPED both the image
# volume and its volumeMount from the persisted spec. No error, no event. A CNPG
# cluster configured that way would reconcile "successfully" and still have no
# vector.so. Enabling the gate means a Talos machine-config change plus rolling
# reboots of all five nodes, which is not a thing an app deploy gets to do.
#
# IT IS ALSO UNNECESSARY. pgvector is ALREADY BUNDLED in the stock operand image.
# First verified on the live arr-postgres cluster (which runs 18.4-system-trixie),
# then re-verified directly against the `-standard-trixie` tag pinned below — the
# same vector.so, byte-identical at 202664 bytes with the same Aug 2 build stamp:
#   pg_available_extensions -> vector 0.8.6 (also pg_trgm 1.6, unaccent 1.1,
#                              uuid-ossp 1.1)
#   /usr/lib/postgresql/18/lib/vector.so                (202664 bytes)
#   /usr/share/postgresql/18/extension/vector.control
# So all four extensions this app needs are present with zero extra machinery.
#
# WHICH FLAVOUR, AND WHY NOT THE OTHER THREE. The tag suffix is not cosmetic —
# the four PG18 flavours differ in ways that matter here (probed directly rather
# than inferred; `-standard-` and `-minimal-` checked against the live registry):
#   -standard-trixie  Debian 13. HAS pgvector. No bundled barman binaries. <- pinned
#   -minimal-trixie   Debian 13. NO pgvector. Would fail the baseline migration.
#   -system-trixie    = standard + bundled Barman Cloud binaries. DEPRECATED
#                     upstream; slated for removal once in-core Barman Cloud is
#                     phased out. This cluster already runs the barman-cloud CNPG-I
#                     plugin (plugin-barman-cloud in ns databases), so the bundled
#                     binaries are dead weight and the deprecation is pure downside.
#   18.4 (unsuffixed) NOT a safe default: it is a legacy system-flavour tag still
#                     on Debian 11 bullseye. (openscad/manyfold-postgres is sitting
#                     on it — someone else's cluster, but worth knowing.)
#
# The pin is EXPLICIT rather than inherited because an unpinned cluster follows the
# operator default, and `-minimal-` has no pgvector at all — that lands as a failed
# baseline migration, not a graceful degradation. PG 18 also matters independently:
# BookOrbit documents "PostgreSQL 16 or newer" and upstream tests on 18.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-postgres
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. This Postgres is
    # being converted to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are
    # removed from this repo in the following commit and the composite adopts the live
    # objects. Without this annotation, removing them would prune the Cluster and CNPG
    # would delete its PVCs — i.e. destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: bookorbit-postgres
    app.kubernetes.io/part-of: media-experimental
spec:
  # velero.io/exclude-from-backup is stamped by the global Kyverno policy
  # (TALOS-7jxm) — CNPG owns its own backups, Velero stays off its pods/PVCs.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  imagePullPolicy: IfNotPresent
  # INSTANCES: 1. This is a single-user experimental bake-off app, matching the
  # linkwarden/zipline rationale rather than arr-postgres's 3. One instance on NFS
  # is still fully node-independent — the PVC follows the pod to any node, which is
  # the property this whole exercise exists to preserve.
  instances: 3 # 3 copies on 3 nodes — required for local-path, see storage note
  storage:
    size: 10Gi
    # fatboy-nfs-appdata, NOT local-path. Two reasons, both load-bearing:
    #   1. NODE-INDEPENDENCE. local-path PVs carry a nodeAffinity to the node that
    #      provisioned them. That is precisely the pin this app must not have.
    #   2. RECLAIM POLICY. This class is Retain; local-path is the cluster DEFAULT
    #      class and its policy is Delete.
    # local-path = node NVMe. Every Postgres commit is a WAL fsync; on NFS that is a
    # network round trip to the Synology. Durability comes from streaming replication
    # plus barman backups, not the filesystem — CNPG's own guidance. (TALOS-npt4)
    #
    # instances: 3 above is LOAD-BEARING, not a nicety. local-path is
    # WaitForFirstConsumer, so each PV pins to the node that first mounts it. A single
    # instance on local-path is stranded by a node loss with no copy anywhere else.
    # Three instances + CNPG's default anti-affinity = three copies on three nodes, and
    # a lost node becomes a promotion. NEVER drop this back to 1 while on local-path;
    # if it genuinely must run single-instance, move it back to NFS first.
    storageClass: local-path
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      # COLLATION IS PINNED, AND IT MATTERS MORE HERE THAN FOR MOST APPS.
      # CNPG's initdb defaults to the C locale — the whole existing fleet is C
      # (verified on arr-postgres: every database reports datcollate=C). Under C,
      # text sorts by byte value, so ORDER BY on a book list gives
      #     Almond, Banana, apple, cherry
      # rather than Almond, apple, Banana, cherry. Verified on this very cluster
      # before it was pinned. For a library whose primary interactions ARE sorted
      # title / author / series lists, and whose search runs through pg_trgm and
      # unaccent, that is a user-visible defect rather than a nicety.
      #
      # THIS IS A ONE-SHOT SETTING. bootstrap.initdb runs exactly once; editing it
      # on an existing cluster silently does nothing. Caught here while the
      # database held zero rows (users=0, books=0, libraries=0), so the fix was a
      # two-minute recreate. After a library is scanned in, the same fix costs a
      # dump/restore cycle.
      #
      # en_US.utf8 verified present in the operand image (511 locales; ICU is also
      # available with 871 collations if a locale-independent provider is ever
      # wanted).
      localeCollate: en_US.utf8
      localeCType: en_US.utf8
      # No `secret:` → CNPG generates bookorbit-postgres-app (username/password/
      # dbname/host/port/uri). The Deployment reads the whole connection string
      # from its `uri` key, so no password is ever rendered into git and no
      # 1Password item is needed for the DB.
      #
      # Extensions are NOT created here. postInitApplicationSQL runs once at
      # bootstrap and is never reconciled again; the Database CR in database.yaml
      # declares them instead and keeps declaring them true.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # Object-store backups → MinIO (objectstore.yaml). NOT disposable: this database
  # holds users, per-user reading progress synced from Kobo/KOReader devices, and
  # the OIDC provider configuration. Losing it loses reading state that exists
  # nowhere else — the ebook files on NFS do not carry it.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bookorbit-postgres
