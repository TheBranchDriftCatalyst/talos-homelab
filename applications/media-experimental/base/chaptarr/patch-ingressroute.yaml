---
# chaptarr — HTTPS + Authentik forward-auth SSO on chaptarr.talos00 (TALOS-xgrl.14).
# High-priority /api route has NO auth middleware so API-key clients (*arr / download
# clients) keep working; the default route is gated by the `authentik` forward-auth
# middleware. Chaptarr is a Servarr (Readarr) fork with its own login — a future
# CHAPTARR__AUTH__METHOD=External + AUTH__REQUIRED=DisabledForLocalAddresses env in
# patch-deployment could suppress it for single SSO; until then an inherent double-login
# on the web UI is acceptable. TLS: default TLSStore serves the *.talos00 wildcard.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-template
  annotations:
    gethomepage.dev/name: "Chaptarr"
    gethomepage.dev/description: "Books *arr (Readarr fork)"
    gethomepage.dev/group: "Book Automation (Exp)"
    gethomepage.dev/weight: "20"
    gethomepage.dev/icon: "readarr.png"
    gethomepage.dev/siteMonitor: "http://chaptarr.media-experimental.svc.cluster.local:8789"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`chaptarr.${CLUSTER_DOMAIN}`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: chaptarr
          port: 8789
    - match: Host(`chaptarr.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: chaptarr
          port: 8789
  tls: {}
