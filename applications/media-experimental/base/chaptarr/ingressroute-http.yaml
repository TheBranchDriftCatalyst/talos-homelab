---
# chaptarr — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chaptarr-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`chaptarr.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: chaptarr
          port: 8789
