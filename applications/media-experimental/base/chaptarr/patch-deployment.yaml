---
# chaptarr deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
# Probe path /ping (Servarr-style health endpoint).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: chaptarr
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaptarr
    spec:
      containers:
        - name: app-template
          image: robertlordhood/chaptarr:latest
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # SSO = single sign-on via the Authentik forward-auth middleware on the IngressRoute.
            # chaptarr auth is set to External (delegate to the proxy → no in-app login) in
            # config.xml on the /config PVC: <AuthenticationMethod>External</AuthenticationMethod> +
            # <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>. This Servarr
            # fork reads auth from config.xml ONLY — CHAPTARR__AUTH__METHOD env is NOT honored
            # (verified: ConfigFileProvider.GetValue reads the XML with no env fallback), so it is
            # NOT set here. The setting persists in the PVC (covered by the media-experimental backup
            # CronJob). /api stays unauthed at the proxy for API-key clients. TALOS-iymy.
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: audiobooks
              mountPath: /audiobooks
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            httpGet:
              path: /ping
          readinessProbe:
            httpGet:
              path: /ping
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: chaptarr-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads-complete
