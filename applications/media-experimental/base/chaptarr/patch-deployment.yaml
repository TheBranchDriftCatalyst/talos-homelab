---
# chaptarr deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
# Probe path /ping (Servarr-style health endpoint).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: chaptarr
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaptarr
    spec:
      containers:
        - name: app-template
          image: robertlordhood/chaptarr:latest
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: audiobooks
              mountPath: /audiobooks
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            httpGet:
              path: /ping
          readinessProbe:
            httpGet:
              path: /ping
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: chaptarr-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobooks
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads-complete
