apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# chaptarr = ../_instance skeleton + deltas only (see patch-*.yaml).

resources:
  - ../_instance

labels:
  # App identity — stamped into metadata + selectors + pod template.
  - pairs:
      app: chaptarr
    includeSelectors: true
  - pairs:
      app.kubernetes.io/component: book-manager
      category: book-manager

patches:
  - path: patch-deployment.yaml
    target: {kind: Deployment}
  - path: patch-ingressroute.yaml
    target: {kind: IngressRoute}
  # Rename template placeholders + set ports.
  - target: {kind: Deployment, name: app-template}
    patch: |-
      - {op: replace, path: /metadata/name, value: chaptarr}
      - {op: replace, path: /spec/template/spec/containers/0/name, value: chaptarr}
      - {op: replace, path: /spec/template/spec/containers/0/ports/0/containerPort, value: 8789}
  - target: {kind: Service, name: app-template}
    patch: |-
      - {op: replace, path: /metadata/name, value: chaptarr}
      - {op: replace, path: /spec/ports/0/port, value: 8789}
  - target: {kind: IngressRoute, name: app-template}
    patch: |-
      - {op: replace, path: /metadata/name, value: chaptarr}
  - target: {kind: PersistentVolumeClaim, name: app-template-config}
    patch: |-
      - {op: replace, path: /metadata/name, value: chaptarr-config}
