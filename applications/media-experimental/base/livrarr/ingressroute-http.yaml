---
# livrarr — web→https redirect (SSO lives on websecure, see patch-ingressroute).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: livrarr-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`livrarr.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: livrarr
          port: 8789
