---
# livrarr deltas vs ../_instance/deployment.yaml (SMP; container merge key
# is the placeholder name — renamed afterwards in kustomization.yaml).
# Alpha app: longer probe windows (failureThreshold 6 / period 15).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: livrarr
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livrarr
    spec:
      containers:
        - name: app-template
          image: ghcr.io/kkodecs/livrarr:0.1.0-alpha6
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: downloads-complete
              mountPath: /downloads
          livenessProbe:
            failureThreshold: 6
          readinessProbe:
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: livrarr-config
        - name: books
          persistentVolumeClaim:
            claimName: books
        - name: downloads-complete
          persistentVolumeClaim:
            claimName: downloads-complete
