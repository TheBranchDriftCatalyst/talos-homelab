---
# Barman Cloud ObjectStore for guacamole-postgres.
#
# WHY THIS EXISTS: guacamole-postgres had NO BACKUP OF ANY KIND. It carried
# `velero.io/exclude-from-backup: "true"` — which is the correct fleet-wide policy,
# because CNPG owns Postgres backups and Velero snapshotting a live PGDATA is worse
# than useless — but it had no CNPG backup stanza to take over that duty. So the
# exclusion was doing its job and nothing was doing the backup. It was the only
# cluster of fifteen in that state, found while auditing before the NFS migration
# (TALOS-npt4).
#
# That gap is also why this cluster could NOT be migrated with the others: the
# migration deletes and rebuilds each PVC, and a database whose only copy is the
# thing being moved has no safety net if a rebuild goes wrong. Backup first, migrate
# second.
#
# Same shape as every other cluster's (zipline, crowdsec, authentik, ...): same
# bucket, same credentials secret, per-cluster prefix.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: guacamole-postgres
  namespace: gaming
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled # converting to CatalystCNPGAppDB, composite adopts it
spec:
  retentionPolicy: "30d" # prune backups + WALs older than 30 days, fleet default
  configuration:
    destinationPath: s3://cnpg-backups/guacamole-postgres
    endpointURL: http://minio-hl.minio.svc:9000
    s3Credentials:
      accessKeyId:
        # Reflected into the gaming namespace from minio/cnpg-minio-backup. The
        # gaming namespace had to be ADDED to that secret's reflector allowlist
        # (infrastructure/base/minio/cnpg-backup/externalsecret.yaml) — it was not
        # there, because no cluster in gaming had ever taken a backup.
        name: cnpg-minio-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: guacamole-postgres-daily
  namespace: gaming
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled # converting to CatalystCNPGAppDB, composite adopts it
spec:
  # 04:15 daily. The fleet is deliberately staggered so backups do not all hammer
  # MinIO at once: forgejo 02:00, dagster 02:00, crowdsec 02:30, linkwarden 02:45,
  # homeassistant 03:00, bookorbit 03:10, plausible 03:15, zipline 03:30,
  # boomtime/books 03:45-04:00, manyfold 04:00. 04:15 is the next free slot.
  # 6-field cron: sec min hour dom mon dow.
  schedule: "0 15 4 * * *"
  immediate: true # take one immediately — this cluster has never had a backup
  backupOwnerReference: self
  method: plugin # in-tree barman was removed in CNPG 1.30
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: guacamole-postgres
