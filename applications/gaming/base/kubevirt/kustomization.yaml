apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gaming

resources:
  - windows-vm.yaml
  - windows-service.yaml
  - virtio-drivers-dv.yaml
  - windows-setup-scripts.yaml
  - novnc.yaml
  - guacamole.yaml # remote-desktop gateway (SSO-protected + hashed cred, TALOS-xgrl.6)
  - guacamole-appdb.yaml # Postgres via CatalystCNPGAppDB composite (TALOS-npt4)
  - guacamole-network-policy.yaml # east-west :8080 lockdown to Traefik only (TALOS-lxz5.3.2)
