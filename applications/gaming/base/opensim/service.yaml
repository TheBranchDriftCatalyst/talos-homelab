---
# Internal ClusterIP for pod-to-pod communication
apiVersion: v1
kind: Service
metadata:
  name: opensim
  labels:
    app: opensim
spec:
  type: ClusterIP
  selector:
    app: opensim
  ports:
    - name: region-tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: region-udp
      port: 9000
      targetPort: 9000
      protocol: UDP
---
# NodePort for external OSGrid connectivity
apiVersion: v1
kind: Service
metadata:
  name: opensim-external
  labels:
    app: opensim
  annotations:
    # WAN forward owned here (migrated from unifi-port-forward PortForwardRule opensim-tcp).
    # ext 9000 -> service port 9000 (region-tcp); operator resolves node + nodePort 30900.
    # TCP only: the UDP half (region-udp 9000) stays a PortForwardRule CRD since the
    # annotation has no protocol flag (tcp default).
    unifi-port-forward.fiskhe.st/mapping: "9000:9000"
spec:
  type: NodePort
  selector:
    app: opensim
  ports:
    - name: region-tcp
      port: 9000
      targetPort: 9000
      protocol: TCP
      nodePort: 30900
    - name: region-udp
      port: 9000
      targetPort: 9000
      protocol: UDP
      nodePort: 30901
