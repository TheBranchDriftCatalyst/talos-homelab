---
# Tautulli — HTTPS + Authentik forward-auth SSO on tautulli.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps the api-key API (/api/v2) reachable for
# the homepage widget; default route gated by `authentik`. NOTE: Tautulli keeps its
# OWN web login by default. Optional one-time step to avoid a double login: Settings →
# Web Interface → disable "Enable HTTP authentication" (safe once forward-auth gates
# the host). Left ON by default here — flagged in the runbook.
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tautulli
  labels:
    app: tautulli
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Tautulli"
    gethomepage.dev/description: "Plex Analytics"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "30"
    gethomepage.dev/icon: "tautulli.png"
    gethomepage.dev/siteMonitor: "http://tautulli.media.svc.cluster.local:8181"
    gethomepage.dev/widget.type: "tautulli"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tautulli.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      # lan-only, added 2026-09-26. An EXTERNAL true-cold pentest (AWS EC2) hit this
      # /api 200 from off-net, while sonarr/radarr/prowlarr /api all returned 401 --
      # Tautulli enforces no app-key, so this priority-100 carve-out was the one arr
      # /api route actually leaking a 200 to the internet (TALOS-a8vo.7). Same frigate
      # lan-only one-liner the ticket prescribes for all 6 arr /api routes; tautulli
      # is prioritised because it is the confirmed leak.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: tautulli
          port: 8181
    - match: Host(`tautulli.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
        - name: catalyst-tautulli
          namespace: traefik
      services:
        - name: tautulli
          port: 8181
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tautulli-http
  labels:
    app: tautulli
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`tautulli.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: tautulli
          port: 8181
