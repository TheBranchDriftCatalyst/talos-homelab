---
# Tautulli API key — GENERATED IN-CLUSTER (no 1Password).
#
# The value is OURS to choose, so an ESO Password generator mints the entropy
# once (refreshInterval "0" = generate-once, same pattern as
# minio/scoped-users) and the template renders it as 32 lowercase hex chars —
# the exact shape Tautulli itself generates (uuid4().hex). The seed-api-key
# init-container asserts it into config.ini on every pod start, and
# emberstack/reflector mirrors the Secret into ns `homepage` for the
# dashboard widget (same pattern as arr-stack-secrets).
#
# Rotation = delete Secret `tautulli-api-key` (ESO regenerates) + restart the
# tautulli pod (init-container re-seeds config.ini).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tautulli-api-key
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: arr-stack
spec:
  length: 32
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli-api-key
  labels:
    app.kubernetes.io/name: tautulli
    app.kubernetes.io/part-of: arr-stack
spec:
  # Generate-once: "0" disables refresh so the key is minted exactly once and
  # never rotated behind our back. Explicit so the Kyverno
  # externalsecret-defaults policy's 1h default is never stamped on.
  # (The policy also skips the secretStoreRef default for generator-sourced
  # ExternalSecrets — this deliberately has NO secretStoreRef.)
  refreshInterval: "0"
  target:
    name: tautulli-api-key
    creationPolicy: Owner
    # Keep the Secret (= the working key) even if this ExternalSecret is ever
    # pruned; the seeded config.ini on the PVC stays valid.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: tautulli
        annotations:
          # Mirror into ns `homepage` for the tautulli dashboard widget
          # (HOMEPAGE_VAR_TAUTULLI_KEY). Same emberstack/reflector pattern as
          # arr-stack-secrets.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "homepage"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homepage"
      data:
        # 32 lowercase hex chars (Tautulli-native format): hash the generated
        # entropy and keep the first 32 hex digits = 128 bits.
        apikey: "{{ .password | sha256sum | trunc 32 }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tautulli-api-key
