---
# SABnzbd — HTTPS + Authentik forward-auth SSO on sabnzbd.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps the api-key API reachable for the *arr
# download-client integrations and the homepage widget; default route gated by
# `authentik`. SABnzbd has NO web login by default (API is api-key gated) → forward-auth
# is the only login. host_whitelist already includes sabnzbd.talos00 (see deployment).
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sabnzbd
  labels:
    app: sabnzbd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "SABnzbd"
    gethomepage.dev/description: "Usenet Downloader"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "41"
    gethomepage.dev/icon: "sabnzbd.png"
    gethomepage.dev/siteMonitor: "http://sabnzbd.media.svc.cluster.local:8080"
    gethomepage.dev/widget.type: "sabnzbd"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sabnzbd.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: sabnzbd
          port: 8080
    - match: Host(`sabnzbd.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: sabnzbd
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sabnzbd-http
  labels:
    app: sabnzbd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sabnzbd.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: sabnzbd
          port: 8080
