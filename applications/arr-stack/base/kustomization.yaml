apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

resources:
  - shared/ # Shared ConfigMaps for DB migration scripts
  - postgres/ # Shared CNPG cluster backing the *arr apps (TALOS-93cz)
  - prowlarr/
  - sonarr/
  - radarr/
  - sabnzbd/
  - qbittorrent/
  - seerr/
  - plex/
  - jellyfin/
  # tdarr/ moved to dedicated applications/tdarr namespace
  - tautulli/
  - posterr/
  - kometa/
  - posterizarr/
  # homepage/ MIGRATED to applications/homepage (multi-instance, ns homepage,
  # TALOS-qt7u). Flux prune:true garbage-collects the old media-ns resources,
  # freeing the homepage.talos00 Host for the new master instance.
  - maintainerr/
  - pulsarr/
  - common-env.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: arr-stack

# Apply revisionHistoryLimit: 3 to all Deployments
# This reduces stale pods from old ReplicaSets (default is 10)
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 3
