---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackarr
  labels:
    app: stackarr
    app.kubernetes.io/name: stackarr
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stackarr
  template:
    metadata:
      labels:
        app: stackarr
        app.kubernetes.io/name: stackarr
      annotations:
        backup.velero.io/backup-volumes: "config"
    spec:
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 100   # Synology 'users' group
          - 1000  # abc user group
      containers:
        - name: stackarr
          image: polyphonic/stackarr:alpha
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "7777"
            - name: STACKARR_WEB_PORT
              value: "7777"
            - name: TZ
              value: America/New_York
            - name: STACKARR_REPO_ROOT
              value: /app
            # --- Postgres backend (matching arr-stack pattern) ----------------
            # Stackarr uses Postgres when DATABASE_URL is set (no explicit mode needed).
            # Use the shared arr-postgres CNPG cluster (same as prowlarr/radarr/sonarr).
            # Credentials auto-generated by CNPG in arr-postgres-app secret.
            - name: STACKARR_POSTGRES_HOST
              value: arr-postgres-rw
            - name: STACKARR_POSTGRES_PORT
              value: "5432"
            - name: STACKARR_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app
                  key: username
            - name: STACKARR_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app
                  key: password
            - name: STACKARR_POSTGRES_MAIN_DATABASE
              value: stackarr-main
            - name: STACKARR_POSTGRES_LOG_DATABASE
              value: stackarr-log
            # Build DATABASE_URL from components (format: postgresql://user:pass@host:port/dbname)
            - name: STACKARR_DATABASE_URL
              value: postgresql://$(STACKARR_POSTGRES_USER):$(STACKARR_POSTGRES_PASSWORD)@$(STACKARR_POSTGRES_HOST):$(STACKARR_POSTGRES_PORT)/$(STACKARR_POSTGRES_MAIN_DATABASE)
            - name: STACKARR_LOG_DATABASE_URL
              value: postgresql://$(STACKARR_POSTGRES_USER):$(STACKARR_POSTGRES_PASSWORD)@$(STACKARR_POSTGRES_HOST):$(STACKARR_POSTGRES_PORT)/$(STACKARR_POSTGRES_LOG_DATABASE)
            # Config directory for app state
            - name: STACKARR_DATABASE_DIR
              value: /config
          ports:
            - name: http
              containerPort: 7777
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: stackarr-config
