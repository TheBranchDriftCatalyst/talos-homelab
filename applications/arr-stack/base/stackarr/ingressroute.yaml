---
# Stackarr — HTTPS + Authentik forward-auth SSO on stackarr.talos00
# Agentic control plane for homelab management
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stackarr
  labels:
    app: stackarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Stackarr"
    gethomepage.dev/description: "Homelab Control Plane"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "5"
    gethomepage.dev/icon: "stackarr.png"
    gethomepage.dev/siteMonitor: "http://stackarr.media.svc.cluster.local:7777"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`stackarr.talos00`)
      kind: Rule
      middlewares:
        # Migrated to talos00-outpost (TALOS-22nn): LAN login stays on auth.talos00.
        # Paired with the priority-2000 callback in authentik-lan-outpost/app-callbacks.yaml.
        - name: authentik-lan
          namespace: authentik
        # Consolidated catalyst navbar. Last in the chain so auth runs first and the
        # body injector only ever rewrites an already-authorised response.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: stackarr
          port: 7777
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stackarr-http
  labels:
    app: stackarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`stackarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: stackarr
          port: 7777
