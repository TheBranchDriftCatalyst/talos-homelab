---
# Maintainerr — HTTPS + Authentik forward-auth SSO on maintainerr.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps its REST API reachable; default route gated
# by `authentik`. Maintainerr has NO built-in authentication → forward-auth is the ONLY
# login, so there is no double-login concern. TLS via default TLSStore (*.talos00 SNI).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maintainerr
  labels:
    app: maintainerr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Maintainerr"
    gethomepage.dev/description: "Media Cleanup Automation"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "51"
    gethomepage.dev/icon: "maintainerr.png"
    gethomepage.dev/href: "https://maintainerr.talos00"
    gethomepage.dev/siteMonitor: "http://maintainerr.media.svc.cluster.local:6246"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`maintainerr.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: maintainerr
          port: 6246
    - match: Host(`maintainerr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: maintainerr
          port: 6246
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maintainerr-http
  labels:
    app: maintainerr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`maintainerr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: maintainerr
          port: 6246
