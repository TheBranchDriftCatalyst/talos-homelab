---
# Pulsarr — HTTPS + Authentik forward-auth SSO on pulsarr.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps webhook / API callbacks from Sonarr/Radarr
# reachable; default route gated by `authentik`. Pulsarr has NO built-in web login →
# forward-auth is the ONLY login, no double-login concern.
# NOTE: internal webhook callers use the in-cluster Service URL (baseUrl =
# http://pulsarr.media.svc.cluster.local:3003), which never traverses forward-auth.
# TLS via default TLSStore (*.talos00 SNI).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pulsarr
  labels:
    app: pulsarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Pulsarr"
    gethomepage.dev/description: "Media Sync"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "52"
    gethomepage.dev/icon: "pulsarr.png"
    gethomepage.dev/siteMonitor: "http://pulsarr.media.svc.cluster.local:3003"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pulsarr.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: pulsarr
          port: 3003
    - match: Host(`pulsarr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: pulsarr
          port: 3003
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pulsarr-http
  labels:
    app: pulsarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pulsarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: pulsarr
          port: 3003
