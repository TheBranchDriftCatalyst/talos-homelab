---
# Posterizarr — HTTPS + Authentik forward-auth SSO on posterizarr.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps its web-trigger / API reachable; default
# route gated by `authentik`. Posterizarr's web UI has NO built-in login → forward-auth
# is the ONLY login, no double-login concern. TLS via default TLSStore (*.talos00 SNI).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: posterizarr
  labels:
    app: posterizarr
    app.kubernetes.io/name: posterizarr
    app.kubernetes.io/part-of: arr-stack
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Posterizarr"
    gethomepage.dev/description: "Poster Overlay Generator"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "53"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/plex.png"
    gethomepage.dev/siteMonitor: "http://posterizarr.media.svc.cluster.local:8000"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`posterizarr.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: posterizarr
          port: 8000
    - match: Host(`posterizarr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: posterizarr
          port: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: posterizarr-http
  labels:
    app: posterizarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`posterizarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: posterizarr
          port: 8000
