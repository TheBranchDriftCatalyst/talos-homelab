---
# Arr-Stack secrets from 1Password
# Pulls API keys and encryption keys for Sonarr, Radarr, Prowlarr
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arr-stack-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: arr-stack-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Merge (not the default Replace): template.data is empty, so without
      # Merge the rendered Secret would lose all provider-fetched keys. With
      # Merge the fetched data passes through and we only add metadata.
      mergePolicy: Merge
      metadata:
        annotations:
          # Mirror into ns `homepage` for the homepage dashboard widgets
          # (sonarr/radarr/prowlarr/sabnzbd/jellyfin/overseerr API keys).
          # Same emberstack/reflector pattern as the CNPG -app secrets.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "homepage"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homepage"
  data:
    # API Keys - used for external integrations and Prowlarr sync
    - secretKey: sonarr-api-key
      remoteRef:
        key: arr-stack
        property: sonarr.apiKey
    - secretKey: radarr-api-key
      remoteRef:
        key: arr-stack
        property: radarr.apiKey
    - secretKey: prowlarr-api-key
      remoteRef:
        key: arr-stack
        property: prowlarr.apiKey
    # Encryption Keys - ASP.NET DataProtection keys for decrypting stored credentials
    - secretKey: sonarr-encryption-key
      remoteRef:
        key: arr-stack
        property: sonarr.encryptionKey
    - secretKey: radarr-encryption-key
      remoteRef:
        key: arr-stack
        property: radarr.encryptionKey
    - secretKey: prowlarr-encryption-key
      remoteRef:
        key: arr-stack
        property: prowlarr.encryptionKey
    # SABnzbd - Usenet download client
    - secretKey: sabnzbd-api-key
      remoteRef:
        key: arr-stack
        property: sabnzbd.apiKey
    - secretKey: sabnzbd-password
      remoteRef:
        key: arr-stack
        property: sabnzbd.password
    # Additional services for homepage widgets
    - secretKey: jellyfin-api-key
      remoteRef:
        key: arr-stack
        property: jellyfin.apiKey
    - secretKey: overseerr-api-key
      remoteRef:
        key: arr-stack
        property: overseerr.apiKey
