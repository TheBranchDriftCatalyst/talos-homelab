---
# Posterr — HTTPS + Authentik forward-auth SSO on posterr.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) reserved for any API/health calls; default route
# gated by `authentik`. Posterr is a read-only dashboard with NO built-in login →
# forward-auth is the ONLY login, no double-login concern. TLS via default TLSStore
# (*.talos00 SNI).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: posterr
  labels:
    app: posterr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`posterr.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: posterr
          port: 3000
    - match: Host(`posterr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: posterr
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: posterr-http
  labels:
    app: posterr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`posterr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: posterr
          port: 3000
