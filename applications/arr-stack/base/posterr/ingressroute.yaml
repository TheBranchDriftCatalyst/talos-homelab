---
# Posterr — HTTPS + Authentik forward-auth SSO on posterr.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) reserved for any API/health calls; default route
# gated by `authentik`. Posterr is a read-only dashboard with NO built-in login →
# forward-auth is the ONLY login, no double-login concern. TLS via default TLSStore
# (*.talos00 SNI).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: posterr
  labels:
    app: posterr
  annotations:
    # Posterr is closer to signage than a browsing surface, so the bar is of
    # little use ON it -- but a LINK TO it is, and build_nav.py cannot offer the
    # link without the middleware, so it gets both. On a wall display there is no
    # pointer, and the bar only reveals on hover, so it stays invisible there.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Posterr"
    gethomepage.dev/description: "Rotating poster wall for the media libraries"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "60"
    gethomepage.dev/icon: "posterr.png"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`posterr.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: posterr
          port: 3000
    - match: Host(`posterr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
        # Consolidated catalyst navbar. Last in the chain so auth runs first and the
        # body injector only ever rewrites an already-authorised response.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: posterr
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: posterr-http
  labels:
    app: posterr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`posterr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: posterr
          port: 3000
