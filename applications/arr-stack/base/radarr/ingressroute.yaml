---
# Radarr — HTTPS + Authentik forward-auth SSO on radarr.talos00 (TALOS-xgrl.14).
# High-priority /api + /feed route (no auth mw) keeps API-key / RSS clients working;
# default route is gated by `authentik`. In-app login suppressed via
# RADARR__AUTH__METHOD=External + AUTH__REQUIRED=DisabledForLocalAddresses.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  labels:
    app: radarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Radarr"
    gethomepage.dev/description: "Movie Management"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "11"
    gethomepage.dev/icon: "radarr.png"
    gethomepage.dev/siteMonitor: "http://radarr.media.svc.cluster.local:7878"
    gethomepage.dev/widget.type: "radarr"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    gethomepage.dev/widget.enableQueue: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.talos00`) && (PathPrefix(`/api`) || PathPrefix(`/feed`))
      kind: Rule
      priority: 100
      # lan-only, added 2026-09-26 (TALOS-a8vo.7 defense-in-depth). This
      # priority-100 /api carve-out has no forward-auth so *arr clients keep
      # working. An external pentest found this route enforces app-key only
      # (401 off-net) -- not leaking like tautulli's did, but the ticket wants
      # lan-only on all six as a second layer. off-net is blocked; the pod-CIDR
      # east-west residue on lan-only is the separate a8vo P1.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: radarr
          port: 7878
    - match: Host(`radarr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
        - name: catalyst-radarr
          namespace: traefik
      services:
        - name: radarr
          port: 7878
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-http
  labels:
    app: radarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`radarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: radarr
          port: 7878
