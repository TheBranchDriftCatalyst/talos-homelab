---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app: radarr
    app.kubernetes.io/name: radarr
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
        app.kubernetes.io/name: radarr
      annotations:
        # Velero backup: config only. db-local dropped with the SQLite volume
        # (TALOS-l4uo) -- the database lives in arr-postgres now, and CNPG owns
        # its own backups (barman WAL + ScheduledBackup), not Velero.
        backup.velero.io/backup-volumes: "config"
    spec:
      # NO nodeAffinity. This block pinned radarr to talos03 for the local-path
      # SQLite PV, which is gone (TALOS-l4uo). It was a SECOND, independent pin
      # on top of the PV's own nodeAffinity -- dropping the volume alone would
      # have left radarr stuck on talos03 and made the un-node-binding silently
      # fail. Prowlarr never had one, so this is a radarr/sonarr-specific step.
      # Every remaining volume is NFS (fatboy-nfs-appdata, synology-nfs) and
      # none of those PVs carry nodeAffinity.
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 100   # Synology 'users' group
          - 1000  # abc user group
      # NO migrate-db initContainer -- retired with the Postgres cutover
      # (TALOS-l4uo). shared/db-migration-configmap.yaml stays; sonarr, plex and
      # jellyfin still use it.
      #
      # migrate-arr.sh did two things: copy the SQLite DB from NFS to a
      # local-path PV once, and symlink /config/radarr.db at that copy. Postgres
      # is authoritative now, so the copy is pointless -- and leaving the
      # container in place would have it recreate a symlink pointing at a path
      # that is no longer mounted. The three /config/radarr.db* symlinks it had
      # created were renamed to *.sqlite-era so nothing dangles where the app
      # would look for a database; radarr.db.nfs-backup is left alone.
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: arr-common-env
          # Trust the Authentik forward-auth reverse proxy → NO in-app login
          # (no double login); api-key still required for /api. (TALOS-xgrl.14)
          env:
            - name: RADARR__AUTH__METHOD
              value: External
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            # --- Postgres backend (TALOS-l4uo) -------------------------------
            # Radarr binds the config section `Radarr:Postgres` from the
            # environment (NzbDrone.Core.Datastore.PostgresOptions), so setting
            # these is enough -- config.xml is NOT edited and holds no DB
            # settings, so the api-key other apps authenticate with is
            # unchanged. Setting RADARR__POSTGRES__HOST is the single switch
            # that flips ConnectionStringFactory from SQLite to Postgres.
            #
            # These are now the ONLY source of truth for radarr's data. The
            # SQLite PVC and its PV have been deleted after the user validated
            # the migration, so removing this block no longer rolls back -- it
            # would start radarr on a fresh empty database. Recovery is the cold
            # copy at /config/pg-migration-backup/ on the NFS config volume, or
            # a CNPG restore of arr-postgres.
            - name: RADARR__POSTGRES__HOST
              value: arr-postgres-rw # CNPG read-write service, same namespace
            - name: RADARR__POSTGRES__PORT
              value: '5432'
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app # generated by CNPG, never in git
                  key: username
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app
                  key: password
            # Servarr's own defaults, set explicitly so the wiring is visible.
            - name: RADARR__POSTGRES__MAINDB
              value: radarr-main
            - name: RADARR__POSTGRES__LOGDB
              value: radarr-log
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          volumeMounts:
            # config (NFS) is the only non-media volume left. Dropping the
            # local-path SQLite PVC is what actually un-node-binds radarr: that
            # PV carried nodeAffinity to talos03, so while it was mounted the
            # pod could not schedule anywhere else. This is the point of the
            # whole exercise (EPIC 0 -> EPIC 1), and talos03 is one of the nodes
            # slated for the control-plane reset.
            - name: config
              mountPath: /config
            # Synology media
            - name: synology-movies
              mountPath: /data/synology/movies
            # Downloads (Synology)
            - name: downloads-complete
              mountPath: /data/downloads/complete
            - name: downloads-incomplete
              mountPath: /data/downloads/incomplete
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        # Synology Movies library
        - name: synology-movies
          persistentVolumeClaim:
            claimName: synology-movies
        # Downloads (Synology NFS -- not node-local, despite the PVC names)
        - name: downloads-complete
          persistentVolumeClaim:
            claimName: synology-downloads-complete
        - name: downloads-incomplete
          persistentVolumeClaim:
            claimName: synology-downloads-incomplete
