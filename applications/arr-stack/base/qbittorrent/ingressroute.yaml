---
# qBittorrent — HTTPS + Authentik forward-auth SSO on qbittorrent.talos00 (TALOS-xgrl.14).
# ALL routes are now gated by the `authentik` forward-auth middleware.
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
#
# SECURITY (TALOS-lxz5.2 / 5.2.2): a priority-100 `/api` route used to bypass forward-auth
# entirely. Combined with the WebUI\AuthSubnetWhitelist covering the WHOLE pod CIDR
# (10.244.0.0/16 — which includes Traefik's own pod IP), any request Traefik forwarded to
# /api was treated as pre-authenticated, so `GET /api/v2/torrents/info` returned 200 from
# the internet with NO auth. Fixes: (1) the /api carve-out is REMOVED — every external
# request must pass Authentik; (2) the subnet whitelist is narrowed to localhost only (see
# deployment.yaml seed-webui-auth) so a compromised in-cluster pod can no longer pre-auth
# either. The in-pod port-sync sidecar still bypasses login via 127.0.0.1.
#
# Functionality implications:
#  - External API clients (e.g. nzb360) can no longer hit /api/v2 unauthenticated through
#    Traefik; route them through Authentik or the in-cluster service with WebUI credentials.
#  - *arr download clients (sonarr/radarr/prowlarr) reach qBit via the in-cluster service
#    with the WebUI username/password (secret `qbittorrent-webui`), NOT the subnet bypass —
#    verify each app's download-client has credentials configured (they did per the arr
#    postgres MIGRATION-RUNBOOK: DownloadClients present + testall passing).
#  - The WebUI in a browser may now show qBit's own login after Authentik (the pod-subnet
#    no-double-login bypass is gone). Credentials are in secret `qbittorrent-webui`.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
  annotations:
    description: "qBittorrent WebUI - VPN protected torrent client"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/description: "Torrent Client (VPN Protected)"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "40"
    gethomepage.dev/icon: "qbittorrent.png"
    gethomepage.dev/siteMonitor: "http://qbittorrent.media.svc.cluster.local:8080"
    gethomepage.dev/widget.type: "qbittorrent"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_QBITTORRENT_USER}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_QBITTORRENT_PASS}}"
spec:
  entryPoints:
    - websecure
  routes:
    # Single route: EVERYTHING (incl. /api/v2) goes through Authentik forward-auth.
    # The old priority-100 /api bypass was removed (TALOS-lxz5.2 / 5.2.2).
    - match: Host(`qbittorrent.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: qbittorrent
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent-http
  namespace: media
  labels:
    app: qbittorrent
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`qbittorrent.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: qbittorrent
          port: 8080
