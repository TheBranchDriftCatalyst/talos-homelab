---
# qBittorrent — HTTPS + Authentik forward-auth SSO on qbittorrent.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps the WebUI API (/api/v2) reachable for
# nzb360 / the port-sync sidecar; default route gated by `authentik`. In-app WebUI login
# is bypassed for the traefik pod subnet via WebUI\AuthSubnetWhitelist (seeded into
# qBittorrent.conf by the seed-webui-auth init-container) → single SSO, no double login.
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
  annotations:
    description: "qBittorrent WebUI - VPN protected torrent client"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/description: "Torrent Client (VPN Protected)"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "40"
    gethomepage.dev/icon: "qbittorrent.png"
    gethomepage.dev/siteMonitor: "http://qbittorrent.media.svc.cluster.local:8080"
    gethomepage.dev/widget.type: "qbittorrent"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_QBITTORRENT_USER}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_QBITTORRENT_PASS}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qbittorrent.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: qbittorrent
          port: 8080
    - match: Host(`qbittorrent.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: qbittorrent
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent-http
  namespace: media
  labels:
    app: qbittorrent
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`qbittorrent.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: qbittorrent
          port: 8080
