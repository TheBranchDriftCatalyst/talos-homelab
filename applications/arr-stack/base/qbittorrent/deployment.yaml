---
# qBittorrent - BitTorrent client with VPN sidecar
# All traffic routed through gluetun (ProtonVPN WireGuard)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app: qbittorrent
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for PVC mounts
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        vpn-gateway.io/rotation: enabled
      annotations:
        # Note: Scraped via ServiceMonitor (not pod annotations) to avoid duplicates
        # Velero backup: only config, exclude downloads
        backup.velero.io/backup-volumes: "config"
    spec:
      # NFS storage - can schedule on any node
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 100   # Synology 'users' group
          - 1000  # abc user group
      # Clean up stale IPv6 routing rules before gluetun starts
      # This prevents "ip rule 101: from all to all table 51820: file exists" errors
      initContainers:
        - name: cleanup-routes
          image: busybox:1.36
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          command:
            - /bin/sh
            - -c
            - |
              echo "Cleaning up stale IPv6 routing rules..."
              # Remove any stale ip rules for table 51820 (wireguard)
              ip -6 rule del table 51820 2>/dev/null || true
              ip -6 rule del table 51820 2>/dev/null || true
              ip -6 rule del table 51820 2>/dev/null || true
              echo "Cleanup complete"
        # Seed the WebUI credentials from the ESO-generated Secret
        # `qbittorrent-webui` (see webui-credentials.yaml) BEFORE qBittorrent
        # starts. qBittorrent rewrites qBittorrent.conf on every shutdown (and
        # once dropped the password entirely — 2026-05-31), so this RE-ASSERTS
        # the GitOps-owned username + PBKDF2 hash on EVERY pod start. It ALSO
        # asserts the WebUI subnet-whitelist keys so requests from the traefik
        # pod subnet (10.244.0.0/16) BYPASS qBittorrent's own login — Authentik
        # forward-auth is the single sign-on, no second qBt login. (TALOS-xgrl.14)
        # Idempotent: only the four WebUI keys we own are touched, everything
        # else in the conf is preserved byte-for-byte; a missing conf (true
        # first run) gets a minimal [Preferences] section.
        - name: seed-webui-auth
          image: python:3.11-alpine
          # Run as the qbittorrent user (PUID/PGID 1000, arr-common-env) so
          # the conf keeps abc ownership and NFS root-squash can never bite.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: QBIT_WEBUI_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: username
            - name: QBIT_WEBUI_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
          command: ["python3", "-c"]
          args:
            - |
              import base64, hashlib, os

              CONF_DIR = "/config/qBittorrent"
              CONF = CONF_DIR + "/qBittorrent.conf"
              USER_KEY = "WebUI\\Username"
              PASS_KEY = "WebUI\\Password_PBKDF2"
              # Bypass qBt's own login for the traefik pod subnet so the
              # Authentik forward-auth session is the ONLY login (no double
              # login). Traefik reaches qBt from a pod IP in 10.244.0.0/16.
              WL_EN_KEY = "WebUI\\AuthSubnetWhitelistEnabled"
              WL_KEY = "WebUI\\AuthSubnetWhitelist"

              user = os.environ["QBIT_WEBUI_USER"]
              password = os.environ["QBIT_WEBUI_PASS"]

              # qBittorrent's exact KDF (src/base/utils/password.cpp):
              # PBKDF2-HMAC-SHA512, 100000 iterations, 16-byte random salt,
              # 64-byte derived key, stored as "@ByteArray(b64salt:b64dk)".
              # Salt is random per seeding run — same password, new line each
              # start; qBittorrent only ever reads it, so that is harmless.
              salt = os.urandom(16)
              dk = hashlib.pbkdf2_hmac(
                  "sha512", password.encode("utf-8"), salt, 100000, dklen=64)
              value = "@ByteArray({}:{})".format(
                  base64.b64encode(salt).decode("ascii"),
                  base64.b64encode(dk).decode("ascii"))

              os.makedirs(CONF_DIR, exist_ok=True)
              lines = []
              if os.path.isfile(CONF):
                  with open(CONF, "r", encoding="utf-8", errors="replace") as f:
                      lines = f.read().splitlines()

              # Drop every existing occurrence of the keys we own (any
              # section, any mid-state); keep all other lines untouched.
              def ours(line):
                  s = line.lstrip()
                  return (s.startswith(USER_KEY + "=")
                          or s.startswith(PASS_KEY + "=")
                          or s.startswith(WL_EN_KEY + "=")
                          or s.startswith(WL_KEY + "="))
              lines = [l for l in lines if not ours(l)]

              new = [
                  USER_KEY + "=" + user,
                  PASS_KEY + '="' + value + '"',
                  WL_EN_KEY + "=true",
                  WL_KEY + "=10.244.0.0/16",
              ]
              out, inserted = [], False
              for l in lines:
                  out.append(l)
                  if not inserted and l.strip() == "[Preferences]":
                      out.extend(new)
                      inserted = True
              if not inserted:
                  # True first run, or a conf with no [Preferences] yet.
                  if out and out[-1].strip():
                      out.append("")
                  out.append("[Preferences]")
                  out.extend(new)

              # Atomic swap so a kill mid-write never leaves a torn conf.
              tmp = CONF + ".seed.tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")
              os.replace(tmp, CONF)
              print("Asserted WebUI auth for user %r in %s" % (user, CONF))
      containers:
        # Gluetun VPN sidecar - routes all qBittorrent traffic through VPN
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3  # pinned 2026-05-09 — :latest had breaking DNS validation change
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: protonvpn-credentials
                  key: se-nl-1  # Netherlands server - good for torrenting
            - name: WIREGUARD_ADDRESSES
              value: "10.2.0.2/32"
            - name: SERVER_COUNTRIES
              value: "Netherlands"  # Good for torrenting
            - name: HTTPPROXY
              value: "off"
            - name: SHADOWSOCKS
              value: "off"
            # Allow cluster traffic + CDNs for Docker Mods to bypass VPN
            # 151.101.0.0/16 = Fastly (Alpine CDN)
            # 140.82.112.0/20 = GitHub (ghcr.io)
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.244.0.0/16,10.96.0.0/12,151.101.0.0/16,140.82.112.0/20"
            # qBittorrent WebUI + metrics exporter + gluetun control
            - name: FIREWALL_INPUT_PORTS
              value: "8000,8080,9091"
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: "0.0.0.0:8000"
            - name: HTTP_CONTROL_SERVER_AUTH
              value: "false"
            - name: HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE
              value: '{"auth":"none"}'
            - name: LOG_LEVEL
              value: "info"
            - name: DOT
              value: "off"  # Fixes IPv6 rule error in Kubernetes
            - name: DOT_IPV6
              value: "off"  # Disable IPv6 DNS to avoid routing issues
            # Healthcheck settings - more resilient to rotation
            - name: HEALTH_VPN_DURATION_INITIAL
              value: "30s"  # Wait 30s before first healthcheck (default 6s)
            - name: HEALTH_VPN_DURATION_ADDITION
              value: "15s"  # Add 15s after each failure (default 5s)
            - name: HEALTH_SUCCESS_WAIT_DURATION
              value: "10s"  # Wait between success checks
            - name: HEALTH_TARGET_ADDRESS
              value: "1.1.1.1:443"  # Use IP instead of DNS hostname
            # Port forwarding for seeding (ProtonVPN supports this)
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "protonvpn"
          ports:
            - name: control
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/vpn/status
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: gluetun-data
              mountPath: /tmp/gluetun
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
          # Add readiness probe to prevent empty endpoints
          readinessProbe:
            httpGet:
              path: /v1/vpn/status
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

        # qBittorrent container - uses gluetun network
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: arr-common-env
          env:
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            # Downloads directories - same as other arr apps
            - name: downloads-complete
              mountPath: /downloads/complete
            - name: downloads-incomplete
              mountPath: /downloads/incomplete
          # startupProbe gives themepark Docker mod a 30-min grace period to
          # apply styles to thousands of HTML files on container start.
          # Once it passes, livenessProbe/readinessProbe take over with their
          # normal aggressive timing.  See TALOS-0dk.
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 60  # 30s × 60 = 30 min total budget for themepark
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

        # Port sync + metrics sidecar
        # Syncs VPN forwarded port to qBittorrent and exports Prometheus metrics
        - name: port-sync
          image: python:3.11-alpine
          env:
            # WebUI creds from the ESO-generated Secret (webui-credentials.yaml)
            # — the same values seed-webui-auth seeds into qBittorrent.conf.
            # Replaces the hardcoded admin/admin that 403'd after the WebUI
            # password was lost, leaving the forwarded VPN port unapplied.
            - name: QBIT_USER
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: username
            - name: QBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui
                  key: password
          command: ["python3", "-c"]
          args:
            - |
              import http.server
              import socketserver
              import urllib.request
              import urllib.parse
              import json
              import time
              import threading
              import os

              METRICS_PORT = 9091
              QBIT_URL = "http://localhost:8080"
              GLUETUN_API = "http://localhost:8000"
              QBIT_USER = os.environ["QBIT_USER"]
              QBIT_PASS = os.environ["QBIT_PASS"]
              PORT_FILE = "/tmp/gluetun/forwarded_port"

              # Exposed for the metrics endpoint.
              state = {"forwarded": 0, "qbit": 0, "up": 0}

              def log(m):
                  print(m, flush=True)

              def get_cookie():
                  try:
                      d = urllib.parse.urlencode({"username": QBIT_USER, "password": QBIT_PASS}).encode()
                      r = urllib.request.urlopen(urllib.request.Request(f"{QBIT_URL}/api/v2/auth/login", data=d), timeout=5)
                      for c in (r.headers.get_all("Set-Cookie") or []):
                          if "SID=" in c:
                              return c.split(";")[0]
                  except Exception as e:
                      log(f"login failed: {e}")
                  return None

              def forwarded_port():
                  # gluetun writes the file on connect; fall back to its control API.
                  try:
                      v = open(PORT_FILE).read().strip()
                      if v:
                          return int(v)
                  except Exception:
                      pass
                  try:
                      r = urllib.request.urlopen(f"{GLUETUN_API}/v1/openvpn/portforwarded", timeout=5)
                      return int(json.loads(r.read()).get("port", 0))
                  except Exception:
                      return 0

              def qbit_get_port(cookie):
                  req = urllib.request.Request(f"{QBIT_URL}/api/v2/app/preferences")
                  req.add_header("Cookie", cookie)
                  return json.loads(urllib.request.urlopen(req, timeout=5).read()).get("listen_port")

              def qbit_set_port(cookie, port):
                  prefs = json.dumps({"listen_port": int(port), "random_port": False})
                  req = urllib.request.Request(f"{QBIT_URL}/api/v2/app/setPreferences",
                                               data=urllib.parse.urlencode({"json": prefs}).encode())
                  req.add_header("Cookie", cookie)
                  urllib.request.urlopen(req, timeout=5)

              def reconcile():
                  # Self-healing: compare qBittorrent's ACTUAL listen_port to gluetun's forwarded port
                  # every cycle and correct ANY drift -- a qbit restart, a random_port flip, or a new
                  # forwarded port after a VPN reconnect. The old sidecar only reacted when the file
                  # changed and tracked last_synced_port, so a qbit restart onto a random port was never
                  # corrected. This reads the real port instead.
                  want = forwarded_port()
                  state["forwarded"] = want
                  if not want:
                      return
                  cookie = get_cookie()
                  if not cookie:
                      return
                  have = qbit_get_port(cookie)
                  state["qbit"] = have or 0
                  if have != want:
                      qbit_set_port(cookie, want)
                      state["qbit"] = want
                      log(f"corrected qbittorrent listen_port {have} -> {want}")

              class MetricsHandler(http.server.BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      pass

                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_response(404); self.end_headers(); return
                      ip = country = region = city = "unknown"
                      try:
                          with urllib.request.urlopen(f"{GLUETUN_API}/v1/vpn/status", timeout=5) as r:
                              state["up"] = 1 if json.loads(r.read()).get("status") == "running" else 0
                          with urllib.request.urlopen(f"{GLUETUN_API}/v1/publicip/ip", timeout=5) as r:
                              d = json.loads(r.read())
                              ip, country, region, city = d.get("public_ip","unknown"), d.get("country","unknown"), d.get("region","unknown"), d.get("city","unknown")
                      except Exception:
                          state["up"] = 0
                      m = (f'gluetun_up{{public_ip="{ip}",country="{country}",region="{region}",city="{city}"}} {state["up"]}\n'
                           f'gluetun_forwarded_port {state["forwarded"]}\n'
                           f'qbittorrent_listen_port {state["qbit"]}\n'
                           f'qbittorrent_port_in_sync {1 if state["qbit"] == state["forwarded"] and state["forwarded"] else 0}\n')
                      self.send_response(200); self.send_header("Content-Type","text/plain"); self.end_headers()
                      self.wfile.write(m.encode())

              # Metrics server in a daemon thread. The reconcile loop is the MAIN thread on purpose:
              # if it ever dies, the container exits and Kubernetes restarts it -- self-healing at the
              # pod level, instead of a dead daemon thread leaving a "ready" container that syncs nothing.
              threading.Thread(
                  target=lambda: socketserver.TCPServer(("", METRICS_PORT), MetricsHandler).serve_forever(),
                  daemon=True,
              ).start()
              log(f"port-sync + metrics up on {METRICS_PORT}")

              time.sleep(60)  # let qBittorrent finish starting
              while True:
                  try:
                      reconcile()
                  except Exception as e:
                      log(f"reconcile error: {e}")
                  time.sleep(30)
          volumeMounts:
            - name: gluetun-data
              mountPath: /tmp/gluetun
              readOnly: true
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-nfs
        - name: downloads-complete
          persistentVolumeClaim:
            claimName: synology-downloads-complete
        - name: downloads-incomplete
          persistentVolumeClaim:
            claimName: synology-downloads-incomplete
        - name: gluetun-data
          emptyDir: {}
