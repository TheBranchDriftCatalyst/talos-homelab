---
# qBittorrent WebUI credentials — GENERATED IN-CLUSTER (no 1Password).
#
# History: the WebUI password was lost 2026-05-31 (qBittorrent.conf kept
# WebUI\Username=panda but WebUI\Password_PBKDF2 vanished), so qbit fell back
# to logging a temporary password on every boot and the port-sync sidecar's
# hardcoded admin/admin got 403s — the forwarded VPN port was never applied.
#
# Fix: the value is OURS to choose, so an ESO Password generator mints it once
# (refreshInterval "0" = generate-once, same pattern as minio/scoped-users),
# the seed-webui-auth init-container asserts it into qBittorrent.conf on EVERY
# pod start, and emberstack/reflector mirrors the Secret into ns `homepage`
# for the dashboard widget (same pattern as arr-stack-secrets).
#
# Rotation = delete Secret `qbittorrent-webui` (ESO regenerates via the
# generator) + restart the qbittorrent pod (init-container re-seeds the conf).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: qbittorrent-webui
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
spec:
  # Alphanumeric-only: safe in INI, env vars, and the port-sync sidecar's
  # urlencoded login form. 32 alnum chars ≈ 190 bits — plenty.
  length: 32
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-webui
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: arr-stack
spec:
  # Generate-once: "0" disables refresh so the password is minted exactly once
  # and never rotated behind our back. Explicit so the Kyverno
  # externalsecret-defaults policy's 1h default is never stamped on.
  # (The policy also skips the secretStoreRef default for generator-sourced
  # ExternalSecrets — this deliberately has NO secretStoreRef.)
  refreshInterval: "0"
  target:
    name: qbittorrent-webui
    creationPolicy: Owner
    # Keep the Secret (= the working password) even if this ExternalSecret is
    # ever pruned; the seeded conf on the PVC stays valid.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: qbittorrent
        annotations:
          # Mirror into ns `homepage` for the qbittorrent dashboard widget
          # (HOMEPAGE_VAR_QBITTORRENT_USER/PASS). Same emberstack/reflector
          # pattern as arr-stack-secrets.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "homepage"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "homepage"
      data:
        username: panda
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: qbittorrent-webui
