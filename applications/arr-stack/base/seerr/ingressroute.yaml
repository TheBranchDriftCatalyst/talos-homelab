---
# Seerr — HTTPS + Authentik forward-auth SSO on seerr.talos00 (TALOS-xgrl.14).
# High-priority /api route (no auth mw) keeps the api-key API + webhooks reachable
# (the *arr apps and notification agents call /api/v1); default route gated by
# `authentik`. NOTE: Seerr keeps its OWN Plex-based login for per-user request
# identity — it CANNOT be cleanly bypassed. Users therefore see the SSO gate, then
# Seerr's Plex sign-in. This is expected (documented in the runbook).
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr
  labels:
    app: seerr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Seerr"
    gethomepage.dev/description: "Media Requests"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "21"
    gethomepage.dev/icon: "overseerr.png"
    gethomepage.dev/siteMonitor: "http://seerr.media.svc.cluster.local:5055"
    # widget.type stays "overseerr" — seerr's API is compatible and
    # homepage doesn't ship a dedicated seerr widget yet.
    gethomepage.dev/widget.type: "overseerr"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_OVERSEERR_KEY}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`seerr.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      # lan-only, added 2026-09-26 (TALOS-a8vo.7 defense-in-depth). This
      # priority-100 /api carve-out has no forward-auth so *arr clients keep
      # working. An external pentest found this route enforces app-key only
      # (401 off-net) -- not leaking like tautulli's did, but the ticket wants
      # lan-only on all six as a second layer. off-net is blocked; the pod-CIDR
      # east-west residue on lan-only is the separate a8vo P1.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: seerr
          port: 5055
    - match: Host(`seerr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
        - name: catalyst-overseerr
          namespace: traefik
      services:
        - name: seerr
          port: 5055
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-http
  labels:
    app: seerr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`seerr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: seerr
          port: 5055
