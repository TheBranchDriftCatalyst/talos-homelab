---
# Readarr — HTTPS + Authentik forward-auth SSO on readarr.talos00 (TALOS-xgrl.14).
# High-priority /api + /feed route (no auth mw) keeps API-key / RSS clients working;
# default route gated by `authentik`. In-app login suppressed via
# READARR__AUTH__METHOD=External + AUTH__REQUIRED=DisabledForLocalAddresses.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: readarr
  labels:
    app: readarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Readarr"
    gethomepage.dev/description: "Book & Audiobook Management"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "12"
    gethomepage.dev/icon: "readarr.png"
    gethomepage.dev/siteMonitor: "http://readarr.media.svc.cluster.local:8787"
    gethomepage.dev/widget.type: "readarr"
    gethomepage.dev/widget.url: "http://readarr.media.svc.cluster.local:8787"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_READARR_KEY}}"
    gethomepage.dev/widget.enableQueue: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`readarr.talos00`) && (PathPrefix(`/api`) || PathPrefix(`/feed`))
      kind: Rule
      priority: 100
      services:
        - name: readarr
          port: 8787
    - match: Host(`readarr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: readarr
          port: 8787
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: readarr-http
  labels:
    app: readarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`readarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: readarr
          port: 8787
