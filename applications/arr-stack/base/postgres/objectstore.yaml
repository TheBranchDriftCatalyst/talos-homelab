---
# Barman Cloud plugin ObjectStore for arr-postgres (TALOS-93cz).
# Same bucket/creds as every other cluster in the fleet; own prefix.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: arr-postgres
  labels:
    app.kubernetes.io/part-of: arr-stack
spec:
  retentionPolicy: "30d" # prune backups + WALs older than 30 days
  configuration:
    destinationPath: s3://cnpg-backups/arr-postgres
    endpointURL: http://minio-hl.minio.svc:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
