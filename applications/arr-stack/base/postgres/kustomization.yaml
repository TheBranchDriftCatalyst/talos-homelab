apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cnpg-minio-backup secret arrives via reflector from minio/cnpg-backup (TALOS-xgrl.2)
resources:
  - cluster.yaml
  - databases.yaml
  - objectstore.yaml # barman-cloud plugin backup config
  - scheduledbackup.yaml # daily base backup

labels:
  - pairs:
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: arr-stack
