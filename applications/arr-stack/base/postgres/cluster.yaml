---
# Shared CloudNativePG cluster for the *arr apps (TALOS-93cz, epic TALOS-k62s).
#
# WHY THIS EXISTS
# Prowlarr/Radarr/Sonarr each ran SQLite on a `local-path` PV pinned by
# nodeAffinity to a single node (talos02-gpu). That pin is what blocks promoting
# workers to control planes — the DB cannot follow the pod. Moving the *arr
# databases into CNPG on node-independent NFS un-node-binds all three apps.
#
# ONE SHARED CLUSTER, NOT ONE PER APP — deliberate deviation from the fleet's
# usual `<app>-postgres` per-app pattern:
#   * The three apps are one functional unit. Prowlarr pushes indexer definitions
#     INTO Radarr/Sonarr; a Prowlarr outage already degrades the other two, so a
#     shared fate is closer to the truth than three independent clusters imply.
#   * 3 pods instead of 9. Per-app at instances:3 would add nine Postgres pods and
#     nine NFS PVCs to a five-node homelab for one media stack.
#   * One WAL stream, one ObjectStore, one ScheduledBackup, one PITR timeline.
#
# THE COST, STATED PLAINLY: shared blast radius. A PITR rewind for Radarr rewinds
# Prowlarr and Sonarr with it, because CNPG restores a whole cluster, not a
# database. For single-database recovery use a logical `pg_dump -d <db>` instead;
# barman/PITR is the disaster tier, not the oops tier.
#
# INSTANCES: 3. Single-instance on `local-path` is what created this mess; on NFS
# a single instance would still be a single point of failure for all three apps.
# Streaming replication across nodes is the whole point of the migration.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: arr-postgres
  labels:
    app.kubernetes.io/name: arr-postgres
    app.kubernetes.io/part-of: arr-stack
spec:
  # velero.io/exclude-from-backup is stamped by the global Kyverno policy
  # (TALOS-7jxm) — CNPG owns its own backups, Velero stays off its pods/PVCs.
  instances: 3
  imagePullPolicy: IfNotPresent
  storage:
    size: 20Gi # SQLite sources today: prowlarr 8 MB + radarr 267 MB + sonarr 549 MB.
               # Postgres inflates 2-4x and all three land here — 20Gi is sized for
               # the finished migration, not just prowlarr.
    # fatboy-nfs-appdata, and RECLAIM POLICY is a reason, not just node-independence.
    # The class carries reclaimPolicy: Retain, and all three of this cluster's PVs
    # were verified Retain after provisioning. `local-path` is the cluster DEFAULT
    # class and its policy is Delete — the SQLite PVs this migration replaces are
    # Retain only because each was hand-written that way after the 2026-05-09 UPS
    # incident. A new PV there would inherit Delete, i.e. LESS protection than what
    # it replaced, quietly. NVMe block later (TALOS-1ujn) — check its policy then.
    storageClass: fatboy-nfs-appdata
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  bootstrap:
    initdb:
      # `arrstack` is a placeholder database whose only job is to exist so CNPG
      # generates the arr-postgres-app secret and the `arrstack` role. The real
      # tenants (prowlarr-main, prowlarr-log, and later radarr-*/sonarr-*) are
      # declared as Database CRs in databases.yaml — every app added the same way,
      # none of them privileged as "the" bootstrap database.
      database: arrstack
      owner: arrstack
      # No `secret:` → CNPG generates arr-postgres-app with a random password.
  # ONE shared `arrstack` role owns every tenant database. Servarr requires the
  # same user for an app's -main and -log pair, and per-app roles would buy
  # isolation the three apps do not have anyway (same namespace, same NFS appdata,
  # same operator). One CNPG-generated secret, no per-app credential plumbing.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  # Object-store backups → MinIO. Config lives in the ObjectStore CR
  # (objectstore.yaml) — the in-tree barmanObjectStore was removed in CNPG 1.30.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: arr-postgres
