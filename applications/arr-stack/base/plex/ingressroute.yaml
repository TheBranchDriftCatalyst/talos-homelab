---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  labels:
    app: plex
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Plex"
    gethomepage.dev/description: "Media Server"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "1"
    gethomepage.dev/icon: "plex.png"
    gethomepage.dev/siteMonitor: "http://plex.media.svc.cluster.local:32400"
    gethomepage.dev/widget.type: "plex"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PLEX_KEY}}"
spec:
  entryPoints:
    - web
  routes:
    # Catalyst theme assets, served from this app's OWN origin so the stylesheet
    # rides the same certificate the app already loads over. Cross-origin would
    # require every client to trust the homelab CA, and a client that does not
    # refuses the subresource SILENTLY. NO auth: a subresource carries no session
    # and cannot follow a 302 to SSO. Serves static CSS only. TALOS-1xcd.
    - match: Host(`plex.${CLUSTER_DOMAIN}`) && PathPrefix(`/catalyst/`)
      kind: Rule
      priority: 110
      services:
        - name: themepark
          namespace: themepark
          port: 80
    - match: Host(`plex.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: catalyst-accept-encoding
          namespace: traefik
        - name: catalyst-plex
          namespace: traefik
      services:
        - name: plex
          port: 32400
