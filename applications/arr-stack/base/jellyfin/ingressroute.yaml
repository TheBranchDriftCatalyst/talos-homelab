---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  labels:
    app: jellyfin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Jellyfin"
    gethomepage.dev/description: "Media Server (Open Source)"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "2"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/siteMonitor: "http://jellyfin.media.svc.cluster.local:8096"
    gethomepage.dev/widget.type: "jellyfin"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
    gethomepage.dev/widget.enableBlocks: "true"
spec:
  entryPoints:
    - web
  routes:
    # Catalyst theme assets, served from this app's OWN origin so the stylesheet
    # rides the same certificate the app already loads over. Cross-origin would
    # require every client to trust the homelab CA, and a client that does not
    # refuses the subresource SILENTLY. NO auth: a subresource carries no session
    # and cannot follow a 302 to SSO. Serves static CSS only. TALOS-1xcd.
    - match: Host(`jellyfin.${CLUSTER_DOMAIN}`) && PathPrefix(`/catalyst/`)
      kind: Rule
      priority: 110
      services:
        - name: themepark
          namespace: themepark
          port: 80
    - match: Host(`jellyfin.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: catalyst-accept-encoding
          namespace: traefik
        - name: catalyst-jellyfin
          namespace: traefik
      services:
        - name: jellyfin
          port: 8096
