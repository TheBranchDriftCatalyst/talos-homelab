---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
        app.kubernetes.io/name: sonarr
      annotations:
        # Velero backup: config only. db-local dropped with the SQLite volume
        # (TALOS-eaa4) -- the database lives in arr-postgres now, and CNPG owns
        # its own backups (barman WAL + ScheduledBackup), not Velero.
        backup.velero.io/backup-volumes: "config"
    spec:
      # NO nodeAffinity. This block pinned sonarr to talos03, commented "for
      # local downloads storage" -- which was false. downloads-complete and
      # -incomplete are synology-nfs from 192.168.1.36 with no nodeAffinity on
      # either PV, and the comment's real claim, co-location with the download
      # client so import can hardlink, is disproved by the cluster itself:
      # sabnzbd (sonarr's only enabled client) runs on a different node against
      # those same two claims, and always has. The genuine pin was the
      # local-path SQLite PV, dropped in TALOS-eaa4; this was a SECOND,
      # independent one on top of it, so removing the volume alone would have
      # left sonarr welded to talos03 and made the un-node-binding silently
      # fail. Every remaining volume is NFS and none of those PVs carry
      # nodeAffinity.
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 100   # Synology 'users' group
          - 1000  # abc user group
      # NO migrate-db initContainer -- retired with the Postgres cutover
      # (TALOS-eaa4). shared/db-migration-configmap.yaml stays; plex and
      # jellyfin still use it.
      #
      # migrate-arr.sh did two things: copy the SQLite DB from NFS to a
      # local-path PV once, and symlink /config/sonarr.db at that copy. Postgres
      # is authoritative now, so the copy is pointless -- and leaving the
      # container in place would have it recreate a symlink pointing at a path
      # that is no longer mounted. The /config/sonarr.db* symlinks it created
      # were renamed to *.sqlite-era so nothing dangles where the app would look
      # for a database; sonarr.db.nfs-backup is left alone.
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: arr-common-env
          # Trust the Authentik forward-auth reverse proxy → NO in-app login
          # (no double login). External auth + DisabledForLocalAddresses also
          # lets internal callers (homepage widget, /api clients via the
          # api-bypass route) through without a Sonarr session. The api-key is
          # still required for /api regardless. (TALOS-xgrl.14)
          env:
            - name: SONARR__AUTH__METHOD
              value: External
            - name: SONARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            # --- Postgres backend (TALOS-eaa4) -------------------------------
            # Sonarr binds the config section `Sonarr:Postgres` from the
            # environment (NzbDrone.Core.Datastore.PostgresOptions), so setting
            # these is enough -- config.xml is NOT edited and holds no DB
            # settings, so the api-key other apps authenticate with is
            # unchanged. Setting SONARR__POSTGRES__HOST is the single switch
            # that flips ConnectionStringFactory from SQLite to Postgres.
            #
            # These are now the ONLY source of truth for sonarr's data. The
            # SQLite PVC and its PV have been deleted after the user validated
            # the migration, so removing this block no longer rolls back -- it
            # would start sonarr on a fresh empty database. Recovery is the cold
            # copy at /config/pg-migration-backup/ on the NFS config volume, or
            # a CNPG restore of arr-postgres.
            - name: SONARR__POSTGRES__HOST
              value: arr-postgres-rw # CNPG read-write service, same namespace
            - name: SONARR__POSTGRES__PORT
              value: '5432'
            - name: SONARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app # generated by CNPG, never in git
                  key: username
            - name: SONARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app
                  key: password
            # Servarr's own defaults, set explicitly so the wiring is visible.
            - name: SONARR__POSTGRES__MAINDB
              value: sonarr-main
            - name: SONARR__POSTGRES__LOGDB
              value: sonarr-log
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          volumeMounts:
            # config (NFS) is the only non-media volume left. Dropping the
            # local-path SQLite PVC is what actually un-node-binds sonarr: that
            # PV carried nodeAffinity to talos03, so while it was mounted the
            # pod could not schedule anywhere else. This is the point of the
            # whole exercise (EPIC 0 -> EPIC 1), and talos03 is one of the two
            # nodes slated for the control-plane reset.
            - name: config
              mountPath: /config
            # Synology media
            - name: synology-tv
              mountPath: /data/synology/tv
            # Downloads (Synology)
            - name: downloads-complete
              mountPath: /data/downloads/complete
            - name: downloads-incomplete
              mountPath: /data/downloads/incomplete
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        # Synology TV library
        - name: synology-tv
          persistentVolumeClaim:
            claimName: synology-tv
        # Downloads (Synology NFS -- not node-local, despite the PVC names)
        - name: downloads-complete
          persistentVolumeClaim:
            claimName: synology-downloads-complete
        - name: downloads-incomplete
          persistentVolumeClaim:
            claimName: synology-downloads-incomplete
