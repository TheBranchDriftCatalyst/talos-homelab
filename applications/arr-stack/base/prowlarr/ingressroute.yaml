---
# Prowlarr — HTTPS + Authentik forward-auth SSO on prowlarr.talos00 (TALOS-xgrl.14).
# High-priority /api + /feed route (no auth mw) keeps indexer sync / API-key clients
# working (the *arr apps sync indexers via Prowlarr's /api); default route gated by
# `authentik`. In-app login suppressed via
# PROWLARR__AUTH__METHOD=External + AUTH__REQUIRED=DisabledForLocalAddresses.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  labels:
    app: prowlarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Prowlarr"
    gethomepage.dev/description: "Indexer Manager"
    gethomepage.dev/group: "Media"
    gethomepage.dev/weight: "20"
    gethomepage.dev/icon: "prowlarr.png"
    gethomepage.dev/siteMonitor: "http://prowlarr.media.svc.cluster.local:9696"
    gethomepage.dev/widget.type: "prowlarr"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prowlarr.talos00`) && (PathPrefix(`/api`) || PathPrefix(`/feed`))
      kind: Rule
      priority: 100
      # lan-only, added 2026-09-26 (TALOS-a8vo.7 defense-in-depth). This
      # priority-100 /api carve-out has no forward-auth so *arr clients keep
      # working. An external pentest found this route enforces app-key only
      # (401 off-net) -- not leaking like tautulli's did, but the ticket wants
      # lan-only on all six as a second layer. off-net is blocked; the pod-CIDR
      # east-west residue on lan-only is the separate a8vo P1.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: prowlarr
          port: 9696
    - match: Host(`prowlarr.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
        - name: catalyst-prowlarr
          namespace: traefik
      services:
        - name: prowlarr
          port: 9696
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr-http
  labels:
    app: prowlarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`prowlarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: prowlarr
          port: 9696
