---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    app: prowlarr
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
        app.kubernetes.io/name: prowlarr
      annotations:
        # Velero backup: only back up config and db-local
        backup.velero.io/backup-volumes: "config,db-local"
    spec:
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 100   # Synology 'users' group
          - 1000  # abc user group
      # NO migrate-db initContainer -- removed with the Postgres cutover
      # (TALOS-93cz). shared/db-migration-configmap.yaml stays; sonarr, radarr,
      # plex and jellyfin still use it.
      #
      # It did two things: copy the SQLite DB from NFS to the local-path PV
      # once, and symlink /config/prowlarr.db at that copy. Postgres is
      # authoritative now, so the copy is pointless -- but the SYMLINK is the
      # reason this container cannot simply be left in place.
      #
      # Repointing DB_LOCAL_PATH at /db-local-old instead of deleting the
      # container would have made migrate-arr.sh rewrite that symlink to
      # /db-local-old/prowlarr.db -- a path that IS mounted -- handing the app
      # back a live read/write route to the stale database at exactly the path
      # it looks for one. That is the divergence the remount exists to prevent,
      # so the container goes and nothing recreates the symlink.
      #
      # The three orphaned /config/prowlarr.db* symlinks were renamed to
      # *.sqlite-era so nothing dangles where the app would look. Reverting this
      # commit restores them: migrate-arr.sh finds no symlink, finds
      # /db-local/prowlarr.db present, and recreates all three.
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: arr-common-env
          # Trust the Authentik forward-auth reverse proxy → NO in-app login
          # (no double login); api-key still required for /api. (TALOS-xgrl.14)
          env:
            - name: PROWLARR__AUTH__METHOD
              value: External
            - name: PROWLARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            # --- Postgres backend (TALOS-93cz) -------------------------------
            # Prowlarr binds the config section `Prowlarr:Postgres` from the
            # environment (NzbDrone.Core.Datastore.PostgresOptions), so setting
            # these is enough -- config.xml is NOT edited and holds no DB
            # settings. Setting PROWLARR__POSTGRES__HOST is the single switch
            # that flips ConnectionStringFactory from SQLite to Postgres.
            #
            # ROLLBACK: delete this env block and the app is back on the SQLite
            # file at /db-local/prowlarr.db, which this migration never wrote
            # to. The db-local PVC and the migrate-db initContainer below stay
            # in place precisely to keep that path open.
            - name: PROWLARR__POSTGRES__HOST
              value: arr-postgres-rw # CNPG read-write service, same namespace
            - name: PROWLARR__POSTGRES__PORT
              value: '5432'
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app # generated by CNPG, never in git
                  key: username
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app
                  key: password
            # Servarr's own defaults, set explicitly so the wiring is visible.
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr-main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr-log
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            # The pre-Postgres SQLite PV, kept BOUND and mounted on purpose so
            # nothing can garbage-collect it and rollback stays one revert away
            # (TALOS-6ck8 removes it once radarr and sonarr are proven too).
            # Deliberately NOT at /db-local: moving the path makes it
            # structurally impossible for Prowlarr to reach the stale database,
            # and readOnly means it cannot be written even if something did.
            # The volume keeps the name db-local so the Velero
            # backup-volumes annotation above still matches it.
            - name: db-local
              mountPath: /db-local-old
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: db-local
          persistentVolumeClaim:
            claimName: prowlarr-db-local
