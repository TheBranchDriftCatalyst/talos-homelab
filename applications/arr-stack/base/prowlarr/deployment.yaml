---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  labels:
    app: prowlarr
    app.kubernetes.io/name: prowlarr
    app.kubernetes.io/part-of: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
        app.kubernetes.io/name: prowlarr
      annotations:
        # Velero backup: config only. db-local dropped with the SQLite volume
        # (TALOS-93cz) -- the database lives in arr-postgres now, and CNPG owns
        # its own backups (barman WAL + ScheduledBackup), not Velero.
        backup.velero.io/backup-volumes: "config"
    spec:
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 100   # Synology 'users' group
          - 1000  # abc user group
      # NO migrate-db initContainer, and no db-local volume -- both retired with
      # the Postgres cutover (TALOS-93cz). shared/db-migration-configmap.yaml
      # stays; sonarr, radarr, plex and jellyfin still use it.
      #
      # migrate-arr.sh did two things: copy the SQLite DB from NFS to a
      # local-path PV once, and symlink /config/prowlarr.db at that copy.
      # Nothing else consumed that symlink -- it exists purely so the app finds
      # its database at the path it expects, and the app now reads Postgres. The
      # backup CronJob pattern that reads *.db is not wired up for prowlarr, and
      # the Velero annotation above no longer references the volume.
      #
      # The three /config/prowlarr.db* symlinks it had created were renamed to
      # *.sqlite-era, so nothing dangles where the app would look for a database.
      # prowlarr.db.nfs-backup and the .replaced-* files are left alone.
      #
      # ROLLBACK IS NO LONGER AN ENV FLIP. The prowlarr-db-local PVC and its PV
      # are deleted; recovery is restoring one of the cold SQLite copies kept at
      # /config/pg-migration-backup/ on the NFS config volume, or a CNPG
      # point-in-time restore of arr-postgres.
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: arr-common-env
          # Trust the Authentik forward-auth reverse proxy → NO in-app login
          # (no double login); api-key still required for /api. (TALOS-xgrl.14)
          env:
            - name: PROWLARR__AUTH__METHOD
              value: External
            - name: PROWLARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            # --- Postgres backend (TALOS-93cz) -------------------------------
            # Prowlarr binds the config section `Prowlarr:Postgres` from the
            # environment (NzbDrone.Core.Datastore.PostgresOptions), so setting
            # these is enough -- config.xml is NOT edited and holds no DB
            # settings. Setting PROWLARR__POSTGRES__HOST is the single switch
            # that flips ConnectionStringFactory from SQLite to Postgres.
            #
            # These are now the ONLY source of truth for prowlarr's data. The
            # SQLite PVC has been deleted, so removing this block no longer
            # rolls back -- it would start prowlarr on a fresh empty database.
            # Recovery is a cold copy from /config/pg-migration-backup/ or a
            # CNPG restore of arr-postgres.
            - name: PROWLARR__POSTGRES__HOST
              value: arr-postgres-rw # CNPG read-write service, same namespace
            - name: PROWLARR__POSTGRES__PORT
              value: '5432'
            - name: PROWLARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app # generated by CNPG, never in git
                  key: username
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr-postgres-app
                  key: password
            # Servarr's own defaults, set explicitly so the wiring is visible.
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr-main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr-log
          ports:
            - name: http
              containerPort: 9696
              protocol: TCP
          volumeMounts:
            # config (NFS) is the only volume left. Dropping the local-path
            # SQLite PVC is what actually un-node-binds prowlarr: that PV
            # carried nodeAffinity to talos02-gpu, so while it was mounted the
            # pod could not schedule anywhere else. This is the point of the
            # whole exercise (EPIC 0 -> EPIC 1).
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
