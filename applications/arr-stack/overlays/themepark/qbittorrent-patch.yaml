---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  template:
    spec:
      containers:
        - name: qbittorrent
          # qbittorrent was never themeable by DOCKER_MODS: it shares gluetun's
          # network namespace, and the killswitch blocks the mod's ghcr.io fetch
          # at startup, wedging the app before it can become ready.
          #
          # That is now moot — the theme is injected at Traefik
          # (catalyst-qbittorrent@traefik), so nothing is fetched from inside the
          # container at all and qbittorrent is themed like everything else.
          envFrom:
            - configMapRef:
                name: arr-common-env
