---
apiVersion: v1
kind: Namespace
metadata:
  name: haven
  labels:
    app.kubernetes.io/part-of: haven
    # enforce BASELINE, not restricted, on purpose. Haven's entrypoint starts as
    # root to chown the data volume and then `exec su-exec node "$@"` to drop to
    # uid 1000 — see the securityContext note in haven.yaml. `restricted`
    # requires runAsNonRoot, which would reject the pod outright.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    goldilocks.fairwinds.com/enabled: 'true'
    goldilocks.fairwinds.com/vpa-update-mode: 'off'
