---
# Uploaded files volume. Fresh in the `zipline` namespace — this is a clean-start
# migration off media-private (the database is NOT carried over, so the old file->URL
# metadata is gone and preserving the old NFS files would only orphan them). NFS
# appdata is ReadWriteOnce + reclaimPolicy=Retain, so the old media-private volume's
# data is retained on the Synology if it is ever needed manually.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zipline-uploads
  labels:
    app: zipline
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fatboy-nfs-appdata
  resources:
    requests:
      storage: 10Gi
