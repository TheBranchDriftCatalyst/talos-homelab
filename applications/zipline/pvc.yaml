---
# The uploaded FILES — the only stateful data that MUST survive the migration.
# Spec matches the existing live PVC (name/size/storageClass/accessMode) so Flux
# ADOPTS the already-Bound volume rather than provisioning a new one — no data is
# recreated or wiped. fatboy-nfs-appdata has reclaimPolicy=Retain, so the backing
# NFS data is safe even if the claim were ever pruned.
#
# NOTE: there is NO `zipline-postgres` PVC here anymore — CloudNativePG manages
# its own PGDATA volume (see postgres.yaml). The old co-pod DB PVC is disposable
# and gets deleted at cutover (fresh DB; zipline re-migrates its schema).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zipline-uploads
  labels:
    app: zipline
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fatboy-nfs-appdata
  resources:
    requests:
      storage: 10Gi
