---
# CloudNativePG database for Zipline (TALOS-0w6d, epic TALOS-031k).
# Replaces the co-pod `postgres:15-alpine` container (plaintext creds on the
# PUBLIC repo) with a CNPG-managed cluster — the repo standard (forgejo /
# home-assistant / crowdsec). CNPG creates:
#   - a 'zipline' database owned by user 'zipline'
#   - Secret 'zipline-postgres-app' (username/password/dbname/host/port/uri)
#   - Service 'zipline-postgres-rw' (read-write endpoint)
# Zipline reads its whole connection string from that secret's `uri` key (see
# deployment.yaml DATABASE_URL) — no plaintext password lives in git, and NO
# 1Password item is needed for the DB (CNPG-native, like the HA migration).
#
# DATA IS DISPOSABLE: the old co-pod `zipline-postgres` PVC is NOT migrated.
# Zipline (diced/zipline) runs its own Prisma schema migrations against an EMPTY
# database on first boot, so a fresh CNPG DB self-initializes. The uploaded FILES
# live on the SEPARATE `zipline-uploads` PVC (see pvc.yaml) and are preserved.
#
# INSTANCES: single (1). The fleet runs 3 for HA, but zipline is a minor
# file-sharing app with a disposable, self-rebuilding DB — one instance is
# sufficient and saves the NFS footprint. Bump to 3 later if it earns HA.
#
# No `imageName:` pin — inherits the operator default (currently PG 17.0),
# exactly like the forgejo/home-assistant clusters, keeping the whole fleet on
# one PG major without hardcoding a floating tag.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zipline-postgres
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. This Postgres is
    # being converted to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are
    # removed from this repo in the following commit and the composite adopts the live
    # objects. Without this annotation, removing them would prune the Cluster and CNPG
    # would delete its PVCs — i.e. destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: zipline-postgres
    app.kubernetes.io/part-of: media-private
spec:
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  instances: 3 # 3 copies on 3 nodes — required for local-path, see storage note
  imagePullPolicy: IfNotPresent
  storage:
    size: 2Gi
    # local-path = node NVMe. Every Postgres commit is a WAL fsync; on NFS that is a
    # network round trip to the Synology. Durability comes from streaming replication
    # plus barman backups, not the filesystem — CNPG's own guidance. (TALOS-npt4)
    #
    # instances: 3 above is LOAD-BEARING, not a nicety. local-path is
    # WaitForFirstConsumer, so each PV pins to the node that first mounts it. A single
    # instance on local-path is stranded by a node loss with no copy anywhere else.
    # Three instances + CNPG's default anti-affinity = three copies on three nodes, and
    # a lost node becomes a promotion. NEVER drop this back to 1 while on local-path;
    # if it genuinely must run single-instance, move it back to NFS first.
    storageClass: local-path
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  # Object-store backups → MinIO (TALOS-xgrl). The DB schema self-rebuilds, but
  # upload METADATA (URLs, ownership, expiry) does not — losing it orphans the
  # files on zipline-uploads. WAL archiving + daily base backups
  # (scheduledbackup.yaml) make single-instance PVC loss a restore.
  # Backup config lives in the ObjectStore CR (objectstore.yaml) — the in-tree
  # barmanObjectStore stanza is removed in CNPG 1.30; this cluster uses the
  # barman-cloud CNPG-I plugin instead.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: zipline-postgres
  bootstrap:
    initdb:
      database: zipline
      owner: zipline
      # No `secret:` → CNPG generates zipline-postgres-app with a random password.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
