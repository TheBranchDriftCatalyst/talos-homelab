---
# Zipline routing. Two surfaces:
#   - LAN:    zip.talos00           (HTTP, lan-only)
#   - Public: zipline.knowledgedump.space (HTTPS via Cloudflare, external-dns)
#
# NO Traefik forward-auth here on purpose: the dashboard/upload API is gated by
# Zipline's NATIVE OIDC (Authentik) while uploaded file/image URLs are served
# PUBLICLY by Zipline — a forward-auth middleware would block those public image
# URLs. The public route carries defense-in-depth middlewares (security headers,
# rate-limit, request-body-limit) for the unauthenticated upload/serve surface.
# Replaces the old zipline.amberdark.net exposure (TALOS-0w6d).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-lan
  labels:
    app: zipline
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`zip.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: zipline
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-public
  labels:
    app: zipline
  annotations:
    external-dns.alpha.kubernetes.io/hostname: zipline.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`zipline.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: request-body-limit
          namespace: traefik
      services:
        - name: zipline
          port: 3000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-public-http
  labels:
    app: zipline
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`zipline.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: zipline
          port: 3000
