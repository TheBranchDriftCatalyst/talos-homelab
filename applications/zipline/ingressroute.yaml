---
# Zipline routing. Two surfaces:
#   - LAN:    zip.talos00           (HTTP, lan-only)
#   - Public: zipline.knowledgedump.space (HTTPS via Cloudflare, external-dns)
#
# NO Traefik forward-auth here on purpose: the dashboard/upload API is gated by
# Zipline's NATIVE OIDC (Authentik) while uploaded file/image URLs are served
# PUBLICLY by Zipline — a forward-auth middleware would block those public image
# URLs. The public route carries defense-in-depth middlewares (security headers,
# rate-limit, request-body-limit) for the unauthenticated upload/serve surface.
# Replaces the old zipline.amberdark.net exposure (TALOS-0w6d).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-lan
  labels:
    app: zipline
  annotations:
    # LAN surface only. The PUBLIC route below gets neither of these: it has no
    # asset route (a knowledgedump.space host cannot fetch /catalyst/) and it
    # serves unauthenticated file URLs. rewriteBody only touches GET text/html,
    # so the injected bar never reaches a served image either way.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Zipline"
    gethomepage.dev/description: "File and screenshot host (LAN surface)"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/weight: "45"
    gethomepage.dev/icon: "zipline.png"
spec:
  # websecure (TLS). The themepark nav-sweep had left zip.talos00 on the `web`
  # entrypoint ONLY, so the nav served over plaintext but browsers (HTTPS) got a
  # 404 (TALOS-wyxh). The web→HTTPS redirect is a SEPARATE object below (Kyverno
  # ingressroute-no-combined-entrypoints). No `tls:` stanza — Kyverno
  # ingressroute-tls-default injects it (*.talos00 wildcard via SNI).
  entryPoints:
    - websecure
  routes:
    - match: Host(`zip.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
        # Consolidated catalyst navbar. Last in the chain so auth runs first and the
        # body injector only ever rewrites an already-authorised response.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: zipline
          port: 3000
---
# HTTP→HTTPS redirect for zip.talos00 (LAN surface).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-lan-http
  labels:
    app: zipline
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`zip.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: redirect-https
          namespace: traefik
      services:
        - name: zipline
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-public
  labels:
    app: zipline
  annotations:
    external-dns.alpha.kubernetes.io/hostname: zipline.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`zipline.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: request-body-limit
          namespace: traefik
      services:
        - name: zipline
          port: 3000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zipline-public-http
  labels:
    app: zipline
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`zipline.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: zipline
          port: 3000
