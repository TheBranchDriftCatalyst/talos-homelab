---
# Zipline's Postgres, as a CatalystCNPGAppDB (TALOS-npt4).
#
# Replaces a hand-written CNPG Cluster, its barman ObjectStore and its ScheduledBackup —
# three files, 63 lines of YAML — with one 21-line spec. The composite renders all three
# plus the ExternalSecret that pulls the MinIO backup credentials into media-private,
# which previously arrived via a central emberstack/reflector allowlist that has to be
# edited by hand for every namespace running a database and fails late and quietly when
# it is not: the Cluster comes up green and only the first backup errors with
# `secrets "cnpg-minio-backup" not found`.
#
# The composite ADOPTED the live objects rather than recreating them — the previous commit
# set kustomize.toolkit.fluxcd.io/prune: disabled on all three and that was confirmed live
# before the manifests were removed. Same Cluster, same PVCs, same 17 tables.
#
# THIS DATABASE IS NOT DISPOSABLE, whatever the old manifest said. The claim there was that
# Prisma rebuilds the schema against an empty database on first boot, which is true — and
# irrelevant. What lives here is the upload METADATA for every file on the separate
# zipline-uploads PVC: URLs, ownership, expiry, quotas, sessions. Dropping it does not reset
# Zipline to a clean install, it orphans every stored file with no way to map it back to a
# URL or an owner. Hence backups, and hence the prune protection above.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: zipline-postgres
  namespace: media-private
spec:
  database: zipline
  owner: zipline
  # THREE, and the storage class below is why. local-path is WaitForFirstConsumer, so each
  # PV pins to the node that first mounts it; a single instance there is stranded by a node
  # loss with no copy anywhere else. Three instances plus CNPG's default anti-affinity means
  # three copies on three nodes and a lost node becomes a promotion. Never drop this to 1
  # while on local-path.
  instances: 3
  storageSize: 2Gi
  # Node NVMe, not NFS. Every Postgres commit is a WAL fsync, and on NFS that is a network
  # round trip to the Synology; durability comes from streaming replication plus barman
  # backups, not from the filesystem. Migrated off fatboy-nfs-appdata 2026-08-23.
  storageClass: local-path
  # PINNED AT THE VALUE THE OPERATOR HAD ALREADY DEFAULTED ONTO THIS CLUSTER. The old
  # manifest set no imageName and said so deliberately, but CNPG's defaulting webhook wrote
  # ghcr.io/cloudnative-pg/postgresql:17.0 into the live spec anyway, so this pin is a
  # no-op today — no rolling restart, same operand already running. What it changes is the
  # future: unpinned, a CNPG operator upgrade silently rolls this cluster onto a new
  # operand, potentially a new PG major, on a database holding real upload metadata.
  # Pinned, that becomes an explicit edit. Bump it with the fleet, not by accident.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  # 03:30 daily, unchanged. The fleet is deliberately staggered across 02:00-04:15 so
  # fourteen databases do not all hit MinIO in the same minute — forgejo 02:00,
  # crowdsec 02:30, linkwarden 02:45, homeassistant 03:00, bookorbit 03:10,
  # plausible 03:15, THIS 03:30, boomtime 03:45, manyfold 04:00, guacamole 04:15.
  # Six-field cron: sec min hour dom mon dow.
  backupSchedule: "0 30 3 * * *"
  # Stated rather than inherited from the XRD defaults. These are one-shot initdb settings —
  # they were what this database was actually created with in August 2026 (verified against
  # pg_database: datcollate=C, datctype=C, encoding=UTF8), and initdb never runs again, so
  # editing them later does nothing. Writing them down keeps a future reader from assuming
  # a default they would have to dump and restore to change.
  encoding: UTF8
  localeCollate: C
  localeCType: C
  resources:
    requestsCpu: 50m
    requestsMemory: 256Mi
