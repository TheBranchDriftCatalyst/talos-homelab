---
# Zipline's Postgres, as a CatalystCNPGAppDB (TALOS-npt4). Fresh cluster in the
# `zipline` namespace — this is a clean-start migration off media-private and the
# old database is intentionally NOT carried over (Prisma re-migrates the schema on
# first boot). The composite renders the CNPG Cluster, its barman ObjectStore, the
# daily ScheduledBackup and the MinIO backup-credential ExternalSecret from one spec.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: zipline-postgres
  namespace: zipline
spec:
  database: zipline
  owner: zipline
  # THREE instances: local-path is WaitForFirstConsumer, so each PV pins to the node
  # that first mounts it; a single instance is stranded by a node loss. Three copies
  # on three nodes (CNPG default anti-affinity) makes a lost node a promotion. Never
  # drop this to 1 while on local-path.
  instances: 3
  storageSize: 2Gi
  # Node NVMe, not NFS — every Postgres commit is a WAL fsync; durability comes from
  # streaming replication + barman backups, not the filesystem.
  storageClass: local-path
  # Pin the operand so a CNPG operator upgrade can't silently roll the PG major.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  # 03:30 daily (six-field cron: sec min hour dom mon dow), staggered with the fleet.
  backupSchedule: "0 30 3 * * *"
  # One-shot initdb settings, stated explicitly.
  encoding: UTF8
  localeCollate: C
  localeCType: C
  resources:
    requestsCpu: 50m
    requestsMemory: 256Mi
