---
# Zipline secrets from 1Password item `zipline` (TALOS-0w6d, epic TALOS-031k).
# De-hardcodes the two plaintext values that were on the PUBLIC repo:
#   - CORE_SECRET       (token-signing key)  -> 1Password field `core-secret`
#   - Postgres password (co-pod DB creds)    -> 1Password field `postgres-password`
#
# CO-POD SYNC: the postgres sidecar (localhost:5432) and the zipline app live in
# the SAME pod. Both the DB's POSTGRES_PASSWORD and the app's DATABASE_URL must
# carry the identical password or the app can't authenticate. We source BOTH from
# the ONE `postgres-password` field and template the full DATABASE_URL here, so a
# single 1Password rotation moves both sides in lockstep on the next ESO refresh.
#
# RUNTIME CAVEAT (see deploy notes): postgres:15-alpine only applies
# POSTGRES_PASSWORD when it initializes an EMPTY data dir. The zipline-postgres
# PVC is already populated, so rotating the value here does NOT re-set the role
# password on an existing DB — the operator must `ALTER USER zipline PASSWORD` (or
# wipe the PVC) once after cutover. On a fresh deploy both sides converge cleanly.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zipline-secrets
  labels:
    app: zipline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zipline-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        CORE_SECRET: '{{ .coreSecret }}'
        # Consumed by the postgres sidecar (POSTGRES_PASSWORD) AND embedded in the
        # app's DATABASE_URL below — same value on both ends keeps them in sync.
        POSTGRES_PASSWORD: '{{ .pgPassword }}'
        DATABASE_URL: 'postgresql://zipline:{{ .pgPassword }}@localhost:5432/zipline'
  data:
    - secretKey: coreSecret
      remoteRef: {key: zipline, property: core-secret}
    - secretKey: pgPassword
      remoteRef: {key: zipline, property: postgres-password}
