---
# Zipline app secret from 1Password item `zipline` (TALOS-0w6d, epic TALOS-031k).
#
# After the CNPG migration there is exactly ONE app-level secret left to source
# from 1Password: CORE_SECRET (the token-signing key). The Postgres password is
# NO LONGER here — CNPG generates the `zipline-postgres-app` secret itself with a
# random password, and the Deployment reads the full DATABASE_URL from that
# secret's `uri` key. So there is no DB credential in git and no 1Password field
# for the DB (CNPG-native, matching the home-assistant migration).
#
# 1Password: vault `catalyst-eso`, item `zipline`, field `core-secret`
# (item already exists). ClusterSecretStore `onepassword` is the fleet standard.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-secrets
  labels:
    app: zipline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zipline-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        CORE_SECRET: '{{ .coreSecret }}'
  data:
    - secretKey: coreSecret
      remoteRef: {key: zipline, property: core-secret}
