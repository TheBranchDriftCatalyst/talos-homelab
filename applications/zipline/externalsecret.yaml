---
# Core app secret from 1Password item `zipline` (vault catalyst-eso), field core-secret.
# The Postgres password is NOT here — CNPG generates zipline-postgres-app and the
# Deployment reads DATABASE_URL from that secret's `uri` key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-secrets
  labels:
    app: zipline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zipline-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        CORE_SECRET: '{{ .coreSecret }}'
  data:
    - secretKey: coreSecret
      remoteRef: {key: zipline, property: core-secret}
---
# OIDC client secret, SEPARATE so a missing 1Password field can't take down CORE_SECRET
# (and zipline's boot) with it — the Deployment reads OAUTH_OIDC_CLIENT_SECRET from this
# secret as optional. SAME 1Password field (zipline.oidc-client-secret) the
# authentik-zipline-oidc ExternalSecret reads, so both ends of the handshake match.
# PROVISION: create 1Password item `zipline` field `oidc-client-secret`
# (e.g. `openssl rand -hex 32`) before OIDC login will work.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zipline-oidc
  labels:
    app: zipline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zipline-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        OIDC_CLIENT_SECRET: '{{ .oidcClientSecret }}'
  data:
    - secretKey: oidcClientSecret
      remoteRef: {key: zipline, property: oidc-client-secret}
