---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in the existing media-private namespace (owned outside this
# kustomization — see the Flux Kustomization note). No namespace.yaml here: the
# namespace already exists live and we don't want two controllers fighting over
# the Namespace object.
namespace: media-private

resources:
  - externalsecret.yaml
  # CatalystCNPGAppDB — renders the CNPG Cluster, its barman ObjectStore, the daily
  # ScheduledBackup and the MinIO backup-credential ExternalSecret from one spec. The
  # credentials no longer depend on this namespace being listed in the reflector allowlist.
  - appdb.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
