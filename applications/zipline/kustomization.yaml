---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dedicated `zipline` namespace (moved off media-private — that ns is reserved for
# talos-private-repo workloads, TALOS-0w6d). This kustomization OWNS the namespace.
namespace: zipline

resources:
  - namespace.yaml
  - externalsecret.yaml
  # CatalystCNPGAppDB — renders the CNPG Cluster, barman ObjectStore, daily
  # ScheduledBackup and the MinIO backup-credential ExternalSecret from one spec.
  - appdb.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
