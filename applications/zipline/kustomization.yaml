---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in the existing media-private namespace (owned outside this
# kustomization — see the Flux Kustomization note). No namespace.yaml here: the
# namespace already exists live and we don't want two controllers fighting over
# the Namespace object.
namespace: media-private

resources:
  - externalsecret.yaml
  - postgres.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
