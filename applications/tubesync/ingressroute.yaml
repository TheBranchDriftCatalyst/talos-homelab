---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tubesync
  labels:
    app: tubesync
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "TubeSync"
    gethomepage.dev/description: "Channel/playlist sync to media library"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "tubesync.png"
    gethomepage.dev/href: "http://tubesync.talos00"
    gethomepage.dev/siteMonitor: "http://tubesync.downloads.svc.cluster.local:4848"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`tubesync.talos00`)
      kind: Rule
      services:
        - name: tubesync
          port: 4848
