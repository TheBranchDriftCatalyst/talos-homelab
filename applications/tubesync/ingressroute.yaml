---
# TubeSync — HTTPS + Authentik forward-auth SSO on tubesync.talos00 (TALOS-xgrl.14).
# Single gated route: TubeSync ships with its optional basic-auth DISABLED by default →
# in that state Authentik SSO is the only gate (no double-login). If TubeSync HTTP auth
# is later enabled it becomes an inherent double-login, acceptable. TLS: default TLSStore
# serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tubesync
  labels:
    app: tubesync
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "TubeSync"
    gethomepage.dev/description: "Channel/playlist sync to media library"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "tubesync.png"
    gethomepage.dev/href: "https://tubesync.talos00"
    gethomepage.dev/siteMonitor: "http://tubesync.downloads.svc.cluster.local:4848"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tubesync.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: tubesync
          port: 4848
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tubesync-http
  labels:
    app: tubesync
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`tubesync.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: tubesync
          port: 4848
