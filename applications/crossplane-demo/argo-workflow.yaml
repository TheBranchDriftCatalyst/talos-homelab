---
# Argo Workflows demo — a reusable hello-world WorkflowTemplate (WorkflowTemplate CRD).
# The flex util submits a Workflow that references this template and polls it to Succeeded.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: demo-hello
  namespace: crossplane-demo
spec:
  entrypoint: main
  serviceAccountName: demo-argo
  templates:
    - name: main
      container:
        image: busybox:1.36
        command: [sh, -c]
        args: ["echo 'hello from argo workflows — provisioned via CRD'"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
---
# ServiceAccount + RBAC the workflow pods run as (Argo executor needs to patch its own pod).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-argo
  namespace: crossplane-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-argo-workflow
  namespace: crossplane-demo
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [workflowtasksets, workflowtaskresults, workflowartifactgctasks]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-argo-workflow
  namespace: crossplane-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-argo-workflow
subjects:
  - kind: ServiceAccount
    name: demo-argo
    namespace: crossplane-demo
