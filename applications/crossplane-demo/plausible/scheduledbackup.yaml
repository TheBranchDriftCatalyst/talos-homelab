---
# Daily base backup for plausible-db → cnpg-backups (TALOS-xgrl).
# Continuous WAL archiving is handled by the Cluster's barmanObjectStore; this
# ScheduledBackup drives the periodic base backups WAL replays sit on top of.
# 30-day retention is enforced by the Cluster's backup.retentionPolicy.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: plausible-db-daily
  namespace: crossplane-demo
spec:
  # 03:15 daily — staggered fleet-wide (forgejo 02:00 ... homeassistant 03:00,
  # zipline 03:30, boomtime 03:45). 6-field cron: sec min hour dom mon dow.
  schedule: "0 15 3 * * *"
  immediate: true # take one right away so backups exist before the first tick
  backupOwnerReference: self
  cluster:
    name: plausible-db
