---
# SECRET_KEY_BASE (and optional TOTP_VAULT_KEY) for Plausible CE, pulled from
# 1Password via the cluster's `onepassword` ClusterSecretStore (TALOS-4gg).
# No secret material is committed to git — the operator syncs it at runtime.
#
# ONE-TIME MANUAL STEP — create the 1Password item before this syncs:
#   Item name: `plausible`  (in the vault backing the `onepassword` store)
#   Fields:
#     secret-key-base : openssl rand -base64 48   (Plausible needs 64+ bytes)
#     totp-vault-key  : openssl rand -base64 32    (exactly 32 bytes; enables 2FA)
#
# The Postgres and ClickHouse passwords are NOT here — Postgres uses the
# CNPG-generated `plausible-db-app` secret, and ClickHouse uses the passwordless
# `default` user (demo). See postgres.yaml / clickhouse.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-secrets
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible
    app.kubernetes.io/part-of: plausible
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: plausible-secrets
    creationPolicy: Owner
    template:
      data:
        secret-key-base: "{{ .secretKeyBase }}"
        totp-vault-key: "{{ .totpVaultKey }}"
  data:
    - secretKey: secretKeyBase
      remoteRef:
        key: plausible
        property: secret-key-base
    - secretKey: totpVaultKey
      remoteRef:
        key: plausible
        property: totp-vault-key
