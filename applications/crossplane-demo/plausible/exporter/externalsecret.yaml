---
# Plausible Stats API read key for the exporter (TALOS-4gg), pulled from
# 1Password via the cluster's `onepassword` ClusterSecretStore. No secret
# material is committed to git — the operator syncs it at runtime.
#
# ONE-TIME MANUAL STEP — before this syncs you must mint the key in Plausible:
#   1. Log in to the Plausible UI (http://plausible.talos00) as the site owner.
#   2. Account name (top-right) -> Settings -> API Keys -> "New API Key".
#      Choose scope "Stats API" and copy the key (shown only once).
#   3. Store it in 1Password (vault backing the `onepassword` store):
#        Item name: `plausible`   (same item the app's secret-key-base uses)
#        Field:     `stats-api-key`  -> paste the key
#   The key is read-only and rate-limited to 600 req/h by default.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-api-keys
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible-stats-exporter
    app.kubernetes.io/part-of: plausible
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: plausible-api-keys
    creationPolicy: Owner
    template:
      data:
        stats-read-key: "{{ .statsApiKey }}"
  data:
    - secretKey: statsApiKey
      remoteRef:
        key: plausible
        property: stats-api-key
