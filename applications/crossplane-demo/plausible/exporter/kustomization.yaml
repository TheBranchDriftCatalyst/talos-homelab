---
# Plausible Stats-API Prometheus exporter (TALOS-4gg).
#
# Add to the PARENT applications/crossplane-demo/plausible/kustomization.yaml:
#   - exporter/   # Plausible Stats-API Prometheus exporter (metrics)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crossplane-demo
#
# The `analytics-sites` ConfigMap is NOT defined here — it is the canonical
# registry owned by the provisioning layer (sites-registry.yaml). The exporter
# only consumes it by name (mounted in deployment.yaml).
resources:
  - externalsecret.yaml # plausible-api-keys (stats-read-key from 1Password)
  - deployment.yaml # exporter Deployment + Service (Alloy-scraped via pod annotations)
