---
# Analytics site registry — the SINGLE SOURCE OF TRUTH for which sites exist in
# Plausible CE (TALOS-4gg). Plausible CE ships WITHOUT the Sites Provisioning API,
# so we provision sites declaratively: this ConfigMap lists them and the
# `plausible-site-reconciler` CronJob (site-reconciler.yaml) idempotently ensures
# each domain exists as a Plausible site owned by the cluster owner.
#
# Schema — `sites.json` is a JSON array of objects:
#   {
#     "domain": "example.com",   # REQUIRED — the Plausible data-domain / site key
#     "inject": true,            # OPTIONAL — this repo fronts it with Traefik and a
#                                #   per-site inject middleware exists in
#                                #   infrastructure/base/analytics/sites-middlewares.yaml
#     "ga": "G-XXXXXXXXXX"       # OPTIONAL — GA4 Measurement ID for future
#                                #   dual-tag (Google Analytics) drop-in. Leave OFF
#                                #   until a real GA4 property exists; a commented GA
#                                #   inject template lives in sites-middlewares.yaml.
#   }
# `inject`/`ga` are consumed by humans wiring middlewares, NOT by the reconciler —
# the reconciler only reads `domain`. Adding/removing a site here is the ONLY step
# needed to create it in Plausible (delete is intentionally NOT automated — the
# reconciler never drops sites, to protect stats).
#
# NOTE: seeded WITHOUT any real `ga` values on purpose. Example of the GA shape
# (do NOT enable with a fake ID):
#   {"domain":"boomtime.knowledgedump.space","inject":true,"ga":"G-XXXXXXXXXX"}
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-sites
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible
    app.kubernetes.io/part-of: plausible
    app.kubernetes.io/component: site-registry
  annotations:
    # Content is literal JSON (no ${VAR} interpolation intended) — keep Flux
    # envsubst away from it so a stray `${...}` can never mangle the registry.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  sites.json: |
    [
      {"domain":"knowledgedump.space"},
      {"domain":"boomtime.knowledgedump.space","inject":true}
    ]
