---
# Postgres for Plausible CE — provisioned by CloudNativePG (TALOS-4gg).
# Minimal single instance on local-path. CNPG auto-creates:
#   * Service  `plausible-db-rw`  (read-write, port 5432)
#   * Secret   `plausible-db-app` (owner-user creds; generated random password)
#       keys: username, password, dbname, host, port, uri, jdbc-uri, ...
# Plausible consumes the generated `uri` key directly as DATABASE_URL
# (the CNPG plausible-db-app secret uri (host plausible-db-rw:5432, db plausible_db)) — no
# hardcoded password in git; the operator owns the credential.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plausible-db
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible-db
    app.kubernetes.io/part-of: plausible
    app.kubernetes.io/component: database
spec:
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  # Scaled 3 -> 1 (2026-08-21). Measured, not guessed: cnpg_pg_stat_database_blks_read
  # is 0.00/s here — the working set is entirely in shared buffers, so the two extra
  # replicas were paying 3x WAL and 3x pods for a read path that never touches disk.
  # plausible: a DEMO stack in crossplane-demo; 3 instances for a demo is pure
  # pod cost.
  # SAFE AT 1 ONLY BECAUSE STORAGE STAYS ON NFS (fatboy-nfs-appdata), which is
  # node-independent: a node loss reschedules the pod and it re-attaches. NEVER set
  # instances:1 on local-path — that PV pins to a node and a node loss strands the DB.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  bootstrap:
    initdb:
      database: plausible_db
      owner: plausible
      # No `secret:` given → CNPG generates `plausible-db-app` with a random
      # password and a ready-to-use `uri` connection string.

  storage:
    size: 2Gi
    storageClass: fatboy-nfs-appdata # interim node-independent storage; NVMe block later (TALOS-1ujn)

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # PodMonitor left off — this is a demo namespace, keep it minimal.
  monitoring:
    enablePodMonitor: false

  # Object-store backups → MinIO (TALOS-xgrl). Config lives in the ObjectStore
  # CR (objectstore.yaml) — migrated off the in-tree barmanObjectStore (removed
  # in CNPG 1.30) to the barman-cloud CNPG-I plugin. Same bucket/prefix/creds;
  # base backups: scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: plausible-db

  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"
