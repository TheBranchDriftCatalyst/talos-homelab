---
# Postgres for Plausible CE — provisioned by CloudNativePG (TALOS-4gg).
# Minimal single instance on local-path. CNPG auto-creates:
#   * Service  `plausible-db-rw`  (read-write, port 5432)
#   * Secret   `plausible-db-app` (owner-user creds; generated random password)
#       keys: username, password, dbname, host, port, uri, jdbc-uri, ...
# Plausible consumes the generated `uri` key directly as DATABASE_URL
# (the CNPG plausible-db-app secret uri (host plausible-db-rw:5432, db plausible_db)) — no
# hardcoded password in git; the operator owns the credential.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plausible-db
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible-db
    app.kubernetes.io/part-of: plausible
    app.kubernetes.io/component: database
spec:
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  bootstrap:
    initdb:
      database: plausible_db
      owner: plausible
      # No `secret:` given → CNPG generates `plausible-db-app` with a random
      # password and a ready-to-use `uri` connection string.

  storage:
    size: 2Gi
    storageClass: fatboy-nfs-appdata # interim node-independent storage; NVMe block later (TALOS-1ujn)

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # PodMonitor left off — this is a demo namespace, keep it minimal.
  monitoring:
    enablePodMonitor: false

  # Object-store backups → MinIO (TALOS-xgrl). Same stanza as forgejo/authentik;
  # WAL archiving + daily base backups (scheduledbackup.yaml) into the shared
  # cnpg-backups bucket. Creds via the reflected cnpg-minio-backup Secret.
  backup:
    retentionPolicy: "30d" # prune backups + WALs older than 30 days
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/plausible-db
      endpointURL: http://minio-hl.minio.svc:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"
