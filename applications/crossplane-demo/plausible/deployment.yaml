---
# Plausible Community Edition app (TALOS-4gg).
# Image: ghcr.io/plausible/community-edition:v2.1.4 (current stable v2.x).
# On start it runs DB migrations before serving, matching the upstream compose
# command: createdb + migrate (both idempotent, safe on every restart) + run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible
    app.kubernetes.io/part-of: plausible
    app.kubernetes.io/component: app
spec:
  replicas: 1
  # Postgres + ClickHouse are stateful singletons; avoid two app pods racing the
  # migration on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plausible
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plausible
        app.kubernetes.io/part-of: plausible
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: plausible
          image: ghcr.io/plausible/community-edition:v2.1.4
          command:
            - sh
            - -c
            - /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BASE_URL
              value: http://plausible.talos00
            - name: HTTP_PORT
              value: "8000"
            # Allow the first-user signup, then set this true and re-sync to lock
            # registration back down.
            - name: DISABLE_REGISTRATION
              value: "false"
            # CNPG-generated app secret exposes a ready-made connection `uri`:
            #   the CNPG plausible-db-app secret uri (host plausible-db-rw:5432, db plausible_db)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plausible-db-app
                  key: uri
            # Altinity operator Service `clickhouse-plausible`, HTTP interface 8123,
            # default user (no password). Plausible creates plausible_events_db.
            - name: CLICKHOUSE_DATABASE_URL
              value: http://default@clickhouse-plausible:8123/plausible_events_db
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: plausible-secrets
                  key: secret-key-base
            # Optional: encrypts stored TOTP secrets (2FA). App still boots if the
            # 1Password field is absent.
            - name: TOTP_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: plausible-secrets
                  key: totp-vault-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: plausible
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible
    app.kubernetes.io/part-of: plausible
spec:
  selector:
    app.kubernetes.io/name: plausible
  ports:
    - name: http
      port: 8000
      targetPort: http
