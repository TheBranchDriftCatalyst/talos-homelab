---
# Plausible's Postgres, as a CatalystCNPGAppDB.
#
# Replaces the hand-written Cluster (postgres.yaml), its ObjectStore
# (objectstore.yaml) and its ScheduledBackup (scheduledbackup.yaml) — three files whose
# only per-app content was the name, the database, the size and the backup time. The
# composite renders all three plus the ExternalSecret that brings the MinIO backup
# credentials into this namespace.
#
# Values reproduce the live Cluster exactly: same 16.4 operand image, same 2Gi on
# local-path, same three instances, same database/owner/collation, same resources — and
# in particular the four tuning parameters below, which are the only ones in the fleet
# that were ever hand-set. Everything else in `postgresql.parameters` on the live cluster
# is CNPG's own injected defaults and is deliberately not repeated here.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: plausible-db
  namespace: crossplane-demo
spec:
  database: plausible_db
  owner: plausible
  # Three copies on three nodes. local-path is WaitForFirstConsumer, so each PV pins to
  # the node that first mounts it and a single instance is stranded by a node loss.
  instances: 3
  storageSize: 2Gi
  storageClass: local-path
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  # 03:15 daily — the slot this cluster already had in the deliberately staggered fleet
  # (forgejo 02:00 ... homeassistant 03:00, zipline 03:30, boomtime 03:45). Not a new time.
  backupSchedule: "0 15 3 * * *"
  encoding: UTF8
  localeCollate: C
  localeCType: C
  # The ONLY user-set postgresql.conf parameters in the fleet. Sized for a 512Mi limit;
  # dropping them would silently hand the database CNPG's defaults and change its memory
  # behaviour.
  parameters:
    shared_buffers: "128MB"
    effective_cache_size: "256MB"
    work_mem: "8MB"
    maintenance_work_mem: "64MB"
  resources:
    requestsCpu: 100m
    requestsMemory: 256Mi
    limitsMemory: 512Mi
