---
# ClickHouse for Plausible CE — provisioned by the Altinity operator (TALOS-4gg).
# Minimal 1 shard / 1 replica on local-path. The operator creates a ClusterIP
# Service `clickhouse-plausible` (ports 8123 http / 9000 native). Plausible talks
# over the HTTP interface (8123) as the `default` user (no password, LAN-open —
# demo only, mirrors the sibling crossplane-demo/clickhouse.yaml).
#
# Plausible connects with:
#   CLICKHOUSE_DATABASE_URL=http://default@clickhouse-plausible:8123/plausible_events_db
# Plausible's `db createdb` step creates the `plausible_events_db` database itself.
#
# spec.configuration.files drops verbatim config.d/*.xml tuning taken from the
# official plausible/community-edition v2.1.4 clickhouse/ directory, plus a
# Plausible-recommended tuning file (async inserts + tolerate broken parts on
# unclean restart). The upstream ipv4-only.xml is intentionally NOT included —
# the Altinity operator manages listen_host itself.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: plausible
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: clickhouse-plausible
    app.kubernetes.io/part-of: plausible
    app.kubernetes.io/component: events-db
spec:
  configuration:
    clusters:
      - name: plausible
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      default/networks/ip:
        - "::/0"
      default/access_management: "1"
    files:
      # Verbatim from plausible/community-edition v2.1.4 — reduces log verbosity
      # and removes noisy system logs (metric_log, trace_log, part_log, ...).
      config.d/logs.xml: |
        <clickhouse>
            <logger>
                <level>warning</level>
                <console>true</console>
            </logger>

            <query_log replace="1">
                <database>system</database>
                <table>query_log</table>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                <engine>
                    ENGINE = MergeTree
                    PARTITION BY event_date
                    ORDER BY (event_time)
                    TTL event_date + interval 30 day
                    SETTINGS ttl_only_drop_parts=1
                </engine>
            </query_log>

            <!-- Stops unnecessary logging -->
            <metric_log remove="remove" />
            <asynchronous_metric_log remove="remove" />
            <query_thread_log remove="remove" />
            <text_log remove="remove" />
            <trace_log remove="remove" />
            <session_log remove="remove" />
            <part_log remove="remove" />
        </clickhouse>
      # Verbatim from plausible/community-edition v2.1.4 — low-RAM profile
      # (<16GB host). Caps mark cache and single-threads the default profile.
      config.d/low-resources.xml: |
        <clickhouse>
            <mark_cache_size>524288000</mark_cache_size>
            <profile>
                <default>
                    <max_threads>1</max_threads>
                    <max_block_size>8192</max_block_size>
                    <max_download_threads>1</max_download_threads>
                    <input_format_parallel_parsing>0</input_format_parallel_parsing>
                    <output_format_parallel_formatting>0</output_format_parallel_formatting>
                </default>
            </profile>
        </clickhouse>
      # Plausible-recommended tuning: async inserts smooth the high-frequency
      # pageview-event write path, and max_suspicious_broken_parts lets ClickHouse
      # recover after an unclean pod restart instead of refusing to start.
      config.d/plausible-tuning.xml: |
        <clickhouse>
            <merge_tree>
                <max_suspicious_broken_parts>100</max_suspicious_broken_parts>
            </merge_tree>
            <profile>
                <default>
                    <async_insert>1</async_insert>
                    <wait_for_async_insert>0</wait_for_async_insert>
                </default>
            </profile>
        </clickhouse>
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume
      podTemplate: clickhouse
  templates:
    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 2Gi
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              # Match the ClickHouse version plausible/community-edition v2.1.4
              # ships (clickhouse-server 24.3.x).
              image: clickhouse/clickhouse-server:24.3.3.102-alpine
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
