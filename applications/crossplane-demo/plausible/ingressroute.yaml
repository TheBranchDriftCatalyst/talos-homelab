---
# Internal LAN-only ingress for Plausible (TALOS-4gg).
# Reach the dashboard at http://plausible.talos00 (requires the *.talos00
# /etc/hosts entry). The `lan-only` middleware (ns traefik) restricts access to
# the LAN, mirroring applications/zipline/ingressroute.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plausible
  namespace: crossplane-demo
  labels:
    app.kubernetes.io/name: plausible
    app.kubernetes.io/part-of: plausible
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`plausible.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: plausible
          port: 8000
