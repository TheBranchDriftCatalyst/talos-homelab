---
# provider-kubernetes install + RBAC (TALOS-ja5). MOVED here from the operators/crossplane dir:
# these reference pkg.crossplane.io CRDs that only exist AFTER the Crossplane HelmRelease
# reconciles, so they must live in a Kustomization that dependsOn `operators` (this demo does),
# not alongside the HelmRelease (which made the operators Kustomization fail dry-run).
#
# DeploymentRuntimeConfig pins the provider controller SA name to "provider-kubernetes" so the
# ClusterRoleBinding below can reference it deterministically (no hashed name, no manual step).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.2.1
  runtimeConfigRef:
    name: provider-kubernetes
---
# provider-kubernetes uses ProviderConfig InjectedIdentity (its own pod SA). To manage arbitrary
# in-cluster objects (the demo Object → a ConfigMap) it needs these verbs bound to its SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-admin
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, namespaces, pods, persistentvolumeclaims]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-admin
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
---
# Activation allowlist for provider-kubernetes (TALOS-hk7i).
#
# provider-kubernetes advertises the SafeStart capability, so it ships its
# resources as ManagedResourceDefinitions in state Inactive and something must
# activate them or no CRD is ever created. The chart's catch-all MRAP used to do
# that implicitly for everything; it has been removed in favour of explicit
# allowlists (see infrastructure/base/aws-providers/activation-policy.yaml for
# the full rationale — briefly: activating "*" registers ~250 CRDs per upjet AWS
# provider at ~3MiB of apiserver memory each, which took the apiserver down on
# 2026-08-15).
#
# This policy lives next to the Provider that ships the MRDs rather than in the
# AWS file, so the two stay independently reviewable. MRAPs are additive, so
# several narrow policies compose exactly as intended.
#
# objects.kubernetes.crossplane.io is load-bearing, NOT demo scaffolding: the
# CatalystCNPGAppDB Composition composes a kubernetes.crossplane.io/v1alpha2
# Object, so deactivating this breaks every database that composite manages.
#
# The namespaced twin (kubernetes.m.crossplane.io) and ObservedObjectCollection
# are deliberately omitted — nothing in this repo references them.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: provider-kubernetes-activations
spec:
  activate:
    - objects.kubernetes.crossplane.io
