---
# Dragonfly (Redis-compatible) — provisioned by the dragonfly-operator (Dragonfly CRD).
# Minimal single-node, ephemeral (no snapshot PVC). The flex util SET/GETs a key here,
# and the Celery worker writes its completion marker here.
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: demo
  namespace: crossplane-demo
spec:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
