---
# Dragonfly (Redis-compatible) — provisioned by the dragonfly-operator (Dragonfly CRD).
# Minimal single-node, ephemeral (no snapshot PVC). The flex util SET/GETs a key here,
# and the Celery worker writes its completion marker here.
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: demo
  namespace: crossplane-demo
spec:
  replicas: 1
  # Dragonfly sizes itself to the HOST thread count (16 here) and would demand ~4Gi
  # (256Mi/thread) → OOM-exits under a small limit. Pin it to 2 proactor threads + an
  # explicit maxmemory so it fits the demo footprint. (TALOS-ja5)
  args:
    - "--proactor_threads=2"
    - "--maxmemory=384mb"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
