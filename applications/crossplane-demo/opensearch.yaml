---
# OpenSearch — provisioned by the opensearch-operator (OpenSearchCluster CRD). Minimal
# single all-in-one node. The operator generates TLS + an admin Secret `demo-admin-password`
# (the flex util connects as admin over https with InsecureSkipVerify). Service `demo` :9200.
#
# ⚠ TALOS: OpenSearch needs vm.max_map_count=262144. setVMMaxMapCount:true asks the operator to
# run a privileged init to set it (works because the crossplane-demo ns is PSA privileged). If
# Talos blocks that sysctl init, set it node-wide via Talos machineconfig .machine.sysctls
# (TALOS-ja5 child). The CR may stay Pending until resolved.
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: demo
  namespace: crossplane-demo
spec:
  general:
    serviceName: demo
    version: "2.15.0"
    setVMMaxMapCount: true
  dashboards:
    enable: false
  security:
    tls:
      transport:
        generate: true
      http:
        generate: true
  nodePools:
    - component: nodes
      replicas: 1
      roles: [cluster_manager, data, ingest]
      diskSize: "2Gi"
      persistence:
        pvc:
          storageClass: local-path
          accessModes: [ReadWriteOnce]
      resources:
        requests: {cpu: 200m, memory: 1Gi}
        limits: {memory: 2Gi}
      jvm: "-Xms512m -Xmx512m"
