---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crossplane-demo
resources:
  - deployment.yaml
  - scaledobject.yaml
configMapGenerator:
  - name: demo-celery-app
    files:
      - app.py
generatorOptions:
  disableNameSuffixHash: true # deployment references the ConfigMap by stable name
