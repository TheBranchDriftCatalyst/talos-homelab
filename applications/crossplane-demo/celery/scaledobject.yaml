---
# KEDA ScaledObject (ScaledObject CRD) autoscaling the Celery worker. A cron trigger is used
# for a reliable zero-dependency demo (scale to 2 on a schedule; minReplica 1 keeps beat alive).
# The RabbitMQ queue-length scaler is the "real" pattern — noted below for reactivation.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demo-celery
  namespace: crossplane-demo
  annotations:
    # demo paused (Plausible-only), TALOS-4gg — flux-resume-safe: matches live.
    # KEDA holds the target at 0 and stops autoscaling while this is set.
    autoscaling.keda.sh/paused-replicas: "0"
spec:
  scaleTargetRef:
    name: demo-celery-worker
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 60
  pollingInterval: 30
  triggers:
    - type: cron
      metadata:
        timezone: UTC
        start: "0 * * * *" # scale up at the top of every hour…
        end: "10 * * * *" # …for 10 minutes
        desiredReplicas: "2"
    # Real celery-on-queue autoscaling (needs a Secret with the full amqp URL; add a
    # TriggerAuthentication + rabbitmq trigger to scale on queue depth incl. scale-to-zero):
    # - type: rabbitmq
    #   metadata: {protocol: amqp, queueName: celery, mode: QueueLength, value: "5"}
    #   authenticationRef: {name: demo-rabbit-auth}
