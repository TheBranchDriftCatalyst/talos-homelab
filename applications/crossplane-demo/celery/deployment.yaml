---
# Celery worker + beat (single process for the demo). Broker creds come from the RabbitMQ
# operator's default-user Secret; result backend is the Dragonfly Service. pip-installs at
# startup (fine for a demo; a real deploy would bake an image). KEDA scales this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-celery-worker
  namespace: crossplane-demo
  labels:
    app: demo-celery-worker
spec:
  # demo paused (Plausible-only), TALOS-4gg — flux-resume-safe: matches live (0).
  # KEDA (scaledobject.yaml) manages this at runtime; the ScaledObject is paused at 0,
  # so this rests at 0 too. On unpause KEDA restores it per cron (minReplicaCount 1).
  replicas: 0
  selector:
    matchLabels:
      app: demo-celery-worker
  template:
    metadata:
      labels:
        app: demo-celery-worker
    spec:
      containers:
        - name: worker
          image: python:3.12-slim
          workingDir: /app
          command:
            - sh
            - -c
            - |
              set -e
              export CELERY_BROKER_URL="amqp://${RABBIT_USER}:${RABBIT_PASS}@${RABBIT_HOST}:5672//"
              pip install --quiet --no-cache-dir "celery[redis]==5.4.0" "redis==5.0.8"
              exec celery -A app worker --beat --loglevel=info
          env:
            - name: RABBIT_USER
              valueFrom: {secretKeyRef: {name: demo-rabbit-default-user, key: username}}
            - name: RABBIT_PASS
              valueFrom: {secretKeyRef: {name: demo-rabbit-default-user, key: password}}
            - name: RABBIT_HOST
              value: demo-rabbit.crossplane-demo.svc.cluster.local
            - name: CELERY_RESULT_BACKEND
              value: redis://demo.crossplane-demo.svc.cluster.local:6379/0
            - name: CELERY_MARKER_KEY
              value: "celery:flex:done"
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: app
          configMap:
            name: demo-celery-app
