---
# ServiceAccount + RBAC for the flex pod: it submits an Argo Workflow and reads the
# crossplane-provisioned ConfigMap, so it needs those verbs in the demo namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-flex
  namespace: crossplane-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-flex
  namespace: crossplane-demo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch, create]
  - apiGroups: [""]
    resources: [configmaps, secrets, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-flex
  namespace: crossplane-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-flex
subjects:
  - kind: ServiceAccount
    name: demo-flex
    namespace: crossplane-demo
