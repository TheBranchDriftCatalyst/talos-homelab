---
# MinIO creds for the demo flex service (TALOS-tmqq). De-hardcoded off the old
# public minio/**** literal; sourced from the 1Password `minio` item
# (root-user / root-password) via ESO, same as every other S3 consumer.
# NOTE: flex is paused (replicas: 0, TALOS-4gg) so this cuts over lazily — the
# Secret is provisioned now and picked up whenever the deployment is scaled up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-minio-credentials
  namespace: crossplane-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: demo-minio-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        MINIO_ACCESS_KEY: '{{ .rootUser }}'
        MINIO_SECRET_KEY: '{{ .rootPassword }}'
  data:
    - secretKey: rootUser
      remoteRef: {key: minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: minio, property: root-password}
