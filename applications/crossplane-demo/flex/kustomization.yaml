---
# Only the K8s manifests are part of the kustomize build; the Go sources + Dockerfile in this
# dir are built into the registry.talos00/crossplane-demo-flex image out of band.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crossplane-demo
resources:
  - rbac.yaml
  - deployment.yaml
