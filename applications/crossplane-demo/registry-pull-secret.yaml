---
# Pull secret for the Nexus/Zot registry (registry.talos00). Same pattern every other
# namespace uses (e.g. media-private) — ESO templates a dockerconfigjson from the 1Password
# `nexus-admin` item. The flex Deployment references it via imagePullSecrets. TALOS-ja5.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
  namespace: crossplane-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.talos00": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: {key: nexus-admin, property: username}
    - secretKey: password
      remoteRef: {key: nexus-admin, property: password}
