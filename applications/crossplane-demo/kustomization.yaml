---
# crossplane-demo (TALOS-ja5): provisions ONE minimal CR of each operator + the Go flex
# service + Celery/KEDA. No global `namespace:` — the Crossplane ProviderConfig/Object are
# cluster-scoped; every namespaced CR carries its own `namespace: crossplane-demo`.
# The tests/ dir is dev tooling (Jest), NOT part of this build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - registry-pull-secret.yaml # ESO dockerconfigjson for registry.talos00 (flex image pull)
  - dragonfly.yaml # Dragonfly (Redis)
  - rabbitmq.yaml # RabbitmqCluster + Queue
  - clickhouse.yaml # ClickHouseInstallation
  - opensearch.yaml # OpenSearchCluster
  - crossplane-provider.yaml # provider-kubernetes install + RBAC (Object/ProviderConfig split to object/)
  - argo-workflow.yaml # WorkflowTemplate + workflow SA/RBAC
  - celery/ # Celery worker + KEDA ScaledObject
  - flex/ # the Go flex service + RBAC
  - plausible/ # Plausible Analytics (CNPG Postgres + Altinity ClickHouse + app) — TALOS-4gg
# object/ (crossplane ProviderConfig + Object) is a SEPARATE Flux Kustomization
# (clusters/catalyst-cluster/crossplane-demo-object.yaml) that dependsOn crossplane-demo so
# provider-kubernetes installs the kubernetes.crossplane.io CRDs first.
