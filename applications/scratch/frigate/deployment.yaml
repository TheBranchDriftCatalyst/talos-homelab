---
# Frigate NVR - AI-powered security camera system.
#
# PARKED 2026-10-16 — not linked into applications/scratch/kustomization.yaml,
# so nothing here is deployed. Manifests are kept deliberately: frigate is
# wanted eventually, and this file is now in the state it should come back in.
#
# Detection runs on CPU, not the GPU (detectors: cpu, num_threads: 4). The old
# header claimed "Intel Arc via OpenVINO for person detection" — that was never
# true and is what TALOS-3hl8.1 was filed about.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  labels:
    app: frigate
    app.kubernetes.io/name: frigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
        app.kubernetes.io/name: frigate
      annotations:
        # config only — `media` is 100Gi of surveillance recordings, not worth backing up.
        backup.velero.io/backup-volumes: config
    spec:
      # Widened from `kubernetes.io/hostname: talos02-gpu` (TALOS-3hl8.1).
      # Pinning to one host was the documented blocker on that ticket and kept
      # scrypted pinned alongside it (TALOS-3hl8.6). Both nodes carrying this
      # label — talos02-gpu and talos06 — expose /dev/dri, so either can run it.
      #
      # NOTE the widening does NOT buy working hwaccel, contrary to the
      # justification originally given on TALOS-3hl8.1: both labelled nodes are
      # the same Arrow Lake generation, so VAAPI fails identically on both. See
      # the hwaccel comment in configmap.yaml.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu-arc: "true"

      securityContext:
        fsGroup: 44  # video group
        supplementalGroups:
          - 44   # video (for /dev/dri access)
          - 100  # users
          - 109  # render group

      initContainers:
        # Copy config from ConfigMap to writable volume
        - name: init-config
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              cp /config-ro/config.yml /config/config.yml
              echo "Config copied to /config"
          volumeMounts:
            - name: config-ro
              mountPath: /config-ro
            - name: config
              mountPath: /config

      containers:
        - name: frigate
          # Standard image with OpenVINO support
          image: ghcr.io/blakeblackshear/frigate:0.14.1
          imagePullPolicy: IfNotPresent

          securityContext:
            privileged: true  # Required for GPU access

          env:
            - name: TZ
              value: 'America/Los_Angeles'

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: rtsp
              containerPort: 8554
              protocol: TCP
            - name: webrtc
              containerPort: 8555
              protocol: TCP

          volumeMounts:
            # Config (writable)
            - name: config
              mountPath: /config
            # Media storage
            - name: media
              mountPath: /media/frigate
            # Shared memory for detection
            - name: shm
              mountPath: /dev/shm
            # Intel GPU access
            - name: dri
              mountPath: /dev/dri
            # Cache for preview frames
            - name: cache
              mountPath: /tmp/cache

          # Measured 24h to 2026-08-24: p50 not far off peak, peak 431Mi
          # against a 2Gi request — 1.6Gi of scheduler capacity reserved for
          # memory frigate has never used. BURST-NOLIM: frigate decodes and
          # records video, so it genuinely spikes and a memory limit would
          # turn a busy period into an OOMKill mid-recording. Request is the
          # honest steady-state number; deliberately NO memory limit.
          resources:
            requests:
              cpu: 250m
              memory: 640Mi

          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

      volumes:
        # Config from ConfigMap (read-only source)
        - name: config-ro
          configMap:
            name: frigate-config
        # Writable config directory
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        # Media storage
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        # Shared memory (required for detection)
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # Intel GPU access
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        # Cache for preview frames (prevents FileNotFoundError)
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
