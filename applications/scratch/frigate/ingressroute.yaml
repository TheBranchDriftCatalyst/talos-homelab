---
# Frigate Web UI - Local access
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate
  labels:
    app: frigate
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Frigate"
    gethomepage.dev/description: "NVR with realtime object detection"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/icon: "frigate.png"
    gethomepage.dev/href: "http://frigate.talos00"
    gethomepage.dev/siteMonitor: "http://frigate.scratch.svc.cluster.local:5000"
    gethomepage.dev/widget.type: "frigate"
    gethomepage.dev/widget.url: "http://frigate.scratch.svc.cluster.local:5000"
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`frigate.talos00`)
      services:
        - name: frigate
          port: 5000
