---
# Frigate Web UI — HTTPS + Authentik forward-auth SSO (TALOS-xgrl.14).
# The high-priority /api route has NO auth middleware so the Home Assistant Frigate
# integration (and other API clients) keep working; the default route is gated by the
# `authentik` forward-auth middleware on the talos-home (or cluster-admin) group. Frigate
# itself trusts the X-authentik-username proxy header (proxy.header_map in configmap.yaml)
# → single SSO, no double login. TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate
  labels:
    app: frigate
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Frigate"
    gethomepage.dev/description: "NVR with realtime object detection"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/icon: "frigate.png"
    gethomepage.dev/siteMonitor: "http://frigate.scratch.svc.cluster.local:5000"
    gethomepage.dev/widget.type: "frigate"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`frigate.talos00`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: frigate
          port: 5000
    - match: Host(`frigate.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: frigate
          port: 5000
  tls: {}
---
# HTTP→HTTPS redirect for frigate.talos00.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate-http
  labels:
    app: frigate
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`frigate.talos00`)
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: frigate
          port: 5000
