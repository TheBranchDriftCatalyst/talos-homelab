---
# Scrypted Web UI — HTTPS + Authentik forward-auth SSO on scrypted.talos00 (TALOS-xgrl.18).
# Scrypted is an NVR (sits with Frigate in the talos-home group). The whole web UI on
# :11080 is gated by the `authentik` forward-auth middleware (talos-home OR cluster-admin);
# TLS: default TLSStore serves the *.talos00 wildcard (traefik/talos00-wildcard-tls) via SNI.
#
# CAVEAT (operator): Scrypted has a mobile app + external integrations.
#   - HomeKit runs on a SEPARATE port (not this Service/route) → UNAFFECTED by this SSO.
#   - RTSP (8554/8555) and the HTTPS UI (10443) are separate Service ports, NOT fronted here.
#   - The @scrypted/cloud login and ANY API served on :11080 now sit BEHIND Authentik SSO.
#     If the Scrypted mobile app / a plugin connects via the web port (:11080) and breaks
#     with a login redirect, add a high-priority un-gated escape-hatch route for the API
#     path (e.g. an extra route:  match Host(`scrypted.talos00`) && PathPrefix(`/endpoint`)
#     with priority: 100 and NO middlewares — mirror the sonarr /api pattern in
#     applications/arr-stack/base/sonarr/ingressroute.yaml). Left OUT by default — gate
#     first, poke a hole only if a real client needs it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scrypted
  labels:
    app: scrypted
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Scrypted"
    gethomepage.dev/description: "NVR / smart-home camera hub"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/icon: "scrypted.png"
    gethomepage.dev/siteMonitor: "http://scrypted.scratch.svc.cluster.local:11080"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`scrypted.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: scrypted
          port: 11080
  tls: {}
---
# HTTP→HTTPS redirect for scrypted.talos00.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scrypted-http
  labels:
    app: scrypted
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`scrypted.talos00`)
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: scrypted
          port: 11080
