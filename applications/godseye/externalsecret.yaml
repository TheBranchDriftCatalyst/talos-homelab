---
# Provider API keys for God's Eye View, from 1Password item `godseye`
# (vault catalyst-eso).
#
# WHY THESE MUST COME FROM HERE AND NOT THE APP'S OWN SETUP UI:
# GEV normally wants you to paste keys into its in-app "Provider Settings"
# panel, which writes them to a .env beside the source. That panel REFUSES
# PROXIED REQUESTS ON PURPOSE (upstream README, "Running behind a reverse
# proxy"), and every request here arrives through Traefik -- so the panel is
# permanently unavailable on godseye.talos00 and the environment is the only
# way keys ever reach this app. Expect the panel to be dead; that is upstream's
# design, not a broken deploy.
#
# EVERY KEY IS OPTIONAL and the app boots without any of them -- the globe just
# falls back to lower-fidelity imagery and the keyed layers stay empty. They are
# templated with `| default ""` so one missing 1Password field cannot take the
# whole Secret (and therefore the app's boot) down with it.
#
# PROVISION: create 1Password item `godseye` in vault catalyst-eso and add
# whichever of these fields you want. Nothing below is required to start:
#   cesium-ion-token      -- free tier, personal/non-commercial. The single
#                            highest-value key: photorealistic 3D terrain.
#   google-maps-api-key   -- Photorealistic 3D Tiles + geocoding (browser key)
#   google-maps-server-api-key -- server-side geocoding
#   opensky-client-id / opensky-client-secret -- live flight (ADS-B) tracking
#   aisstream-api-key     -- live ship/vessel positions
#   mapillary-client-token-- street-level imagery
#   ll2-api-token         -- launch library (rocket launches)
#   openai-api-key        -- voice mode / analyst answers
#   gemini-api-key        -- alternative LLM backend
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: godseye-providers
  namespace: godseye
  labels:
    app: godseye
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: godseye-providers
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        CESIUM_ION_TOKEN: '{{ .cesiumIonToken | default "" }}'
        GOOGLE_MAPS_API_KEY: '{{ .googleMapsApiKey | default "" }}'
        GOOGLE_MAPS_SERVER_API_KEY: '{{ .googleMapsServerApiKey | default "" }}'
        OPENSKY_CLIENT_ID: '{{ .openskyClientId | default "" }}'
        OPENSKY_CLIENT_SECRET: '{{ .openskyClientSecret | default "" }}'
        AISSTREAM_API_KEY: '{{ .aisstreamApiKey | default "" }}'
        MAPILLARY_CLIENT_TOKEN: '{{ .mapillaryClientToken | default "" }}'
        LL2_API_TOKEN: '{{ .ll2ApiToken | default "" }}'
        OPENAI_API_KEY: '{{ .openaiApiKey | default "" }}'
        GEMINI_API_KEY: '{{ .geminiApiKey | default "" }}'
  # Every entry is marked optional so a field that does not exist in the
  # 1Password item yet resolves to empty rather than failing the whole secret.
  data:
    - {secretKey: cesiumIonToken, remoteRef: {key: godseye, property: cesium-ion-token, conversionStrategy: Default, decodingStrategy: None, metadataPolicy: None}}
    - {secretKey: googleMapsApiKey, remoteRef: {key: godseye, property: google-maps-api-key}}
    - {secretKey: googleMapsServerApiKey, remoteRef: {key: godseye, property: google-maps-server-api-key}}
    - {secretKey: openskyClientId, remoteRef: {key: godseye, property: opensky-client-id}}
    - {secretKey: openskyClientSecret, remoteRef: {key: godseye, property: opensky-client-secret}}
    - {secretKey: aisstreamApiKey, remoteRef: {key: godseye, property: aisstream-api-key}}
    - {secretKey: mapillaryClientToken, remoteRef: {key: godseye, property: mapillary-client-token}}
    - {secretKey: ll2ApiToken, remoteRef: {key: godseye, property: ll2-api-token}}
    - {secretKey: openaiApiKey, remoteRef: {key: godseye, property: openai-api-key}}
    - {secretKey: geminiApiKey, remoteRef: {key: godseye, property: gemini-api-key}}
