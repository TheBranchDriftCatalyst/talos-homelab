---
# Youtarr initial admin credentials (TALOS-l5c3).
#
# Self-contained ESO Password generator — same pattern as argocd-oidc-client-secret.
# AUTH_PRESET_USERNAME/PASSWORD seed the admin account headlessly so the setup-token
# wizard never has to be completed by hand.
#
# refreshInterval "0" = generate once and stay stable. Do NOT edit this spec
# casually: an ESO generator re-evaluates on ANY spec change, which would rotate
# the admin password out from under the running app.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: youtarr-admin
  namespace: downloads
spec:
  length: 32
  digits: 8
  symbols: 0 # alphanumeric — avoids shell/encoding edge cases in env vars
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-admin
  namespace: downloads
spec:
  refreshInterval: "0" # generate once
  target:
    name: youtarr-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTH_PRESET_USERNAME: "admin"
        AUTH_PRESET_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: youtarr-admin
---
# BasicAuth credential for the utarr Chrome extension (see
# docs/superpowers/specs/2026-10-30-utarr-chrome-extension-design.md).
#
# Sourced from 1Password (vault catalyst-eso, item "youtarr-api-basicauth",
# field "password") rather than an ESO generator, so the operator controls
# the password's lifecycle instead of it being generated-once-and-forgotten.
#
# The template still emits BOTH halves of that one password:
#   users    - htpasswd line, consumed by the Traefik basicAuth middleware
#   password - plaintext, typed into the extension's settings by the operator
#
# Built with sprig's bcrypt, not htpasswd: this cluster's ESO (v2.6.0) exposes
# an htpasswd func with an incompatible arity ("want 3 got 2"), so the line is
# assembled by hand instead.
#
# EXPECTED: the "users" hash changes on every refresh cycle even when the
# 1Password password has NOT changed. sprig's bcrypt salts randomly each time
# it runs, so re-templating produces a different (but equally valid) hash of
# the same plaintext. This is routine churn, not a rotation and not an
# incident -- do not use this Secret's resourceVersion/lastModified as a
# rotation signal.
#
# refreshInterval 24h (not cloudflare-ddns's 1h): this is an operator-set
# password that only changes when someone deliberately edits the 1Password
# item, not an externally-revocable token, so a long interval costs nothing.
# After deliberately rotating the password in 1Password, force an immediate
# resync instead of waiting out the interval:
#   kubectl annotate externalsecret/youtarr-api-basicauth -n downloads \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-api-basicauth
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: youtarr-api-basicauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        users: "{{ printf \"utarr:%s\" (bcrypt .password) }}"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: youtarr-api-basicauth
        property: password
---
# Traefik-only single-key view of the credential above (TALOS, task-3 verify fix).
#
# Traefik's basicAuth middleware hard-requires the referenced Secret to
# contain EXACTLY ONE key: a 2-key secret fails to load ("found 2 elements
# for secret ..., must be single element exactly") and Traefik drops the
# youtarr-api router entirely -- no error surfaces outside the controller
# logs, and traffic silently falls through to the Authentik-gated host
# route (returns 302 instead of 401). youtarr-api-basicauth above
# deliberately carries BOTH `users` and `password` (one credential, two
# consumers: Traefik and the human/extension), so Traefik needs its own
# single-key copy rather than reusing that Secret directly.
#
# Same 1Password source and bcrypt template as youtarr-api-basicauth; only
# `password` is dropped from the template output. The `users` hash still
# churns every refresh (sprig's bcrypt salts randomly) -- routine, not a
# rotation signal, same as the sibling Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-api-basicauth-htpasswd
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: youtarr-api-basicauth-htpasswd
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        users: "{{ printf \"utarr:%s\" (bcrypt .password) }}"
  data:
    - secretKey: password
      remoteRef:
        key: youtarr-api-basicauth
        property: password
