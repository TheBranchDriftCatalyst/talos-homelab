---
# Youtarr initial admin credentials (TALOS-l5c3).
#
# Self-contained ESO Password generator — same pattern as argocd-oidc-client-secret.
# AUTH_PRESET_USERNAME/PASSWORD seed the admin account headlessly so the setup-token
# wizard never has to be completed by hand.
#
# refreshInterval "0" = generate once and stay stable. Do NOT edit this spec
# casually: an ESO generator re-evaluates on ANY spec change, which would rotate
# the admin password out from under the running app.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: youtarr-admin
  namespace: downloads
spec:
  length: 32
  digits: 8
  symbols: 0 # alphanumeric — avoids shell/encoding edge cases in env vars
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-admin
  namespace: downloads
spec:
  refreshInterval: "0" # generate once
  target:
    name: youtarr-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTH_PRESET_USERNAME: "admin"
        AUTH_PRESET_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: youtarr-admin
---
# BasicAuth credential for the utarr Chrome extension (see
# docs/superpowers/specs/2026-10-30-utarr-chrome-extension-design.md).
#
# Sourced from 1Password (vault catalyst-eso, item "youtarr-api-basicauth",
# field "password") rather than an ESO generator, so the operator controls
# the password's lifecycle instead of it being generated-once-and-forgotten.
#
# This Secret holds ONLY the plaintext `password` -- a human reads it
# (kubectl get secret ... -o jsonpath='{.data.password}' | base64 -d) and
# types it into the utarr Chrome extension's settings. It is NOT read by
# Traefik and NOT consumed by anything else: Traefik's htpasswd line lives
# in the sibling ExternalSecret youtarr-api-basicauth-htpasswd below, which
# derives from this same 1Password item. Do not add a `users` key back here
# -- see that sibling's comment for why a combined secret breaks Traefik.
#
# refreshInterval 24h (not cloudflare-ddns's 1h): this is an operator-set
# password that only changes when someone deliberately edits the 1Password
# item, not an externally-revocable token, so a long interval costs nothing.
#
# ROTATION: after deliberately changing the password in 1Password, force an
# immediate resync of BOTH ExternalSecrets, not just this one -- they are on
# independent 24h timers, and this plaintext and the sibling's htpasswd hash
# must always derive from the same 1Password read. Syncing only one leaves a
# window where the extension's plaintext and Traefik's hash are for
# DIFFERENT passwords: auth fails (closed, not open) until the other
# ExternalSecret's timer catches up.
#   kubectl annotate externalsecret/youtarr-api-basicauth -n downloads \
#     force-sync=$(date +%s) --overwrite
#   kubectl annotate externalsecret/youtarr-api-basicauth-htpasswd -n downloads \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-api-basicauth
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: youtarr-api-basicauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: youtarr-api-basicauth
        property: password
---
# Traefik-only htpasswd view of the credential above (TALOS, task-3 verify fix).
#
# Traefik's basicAuth middleware hard-requires the referenced Secret to
# contain EXACTLY ONE key: a 2-key secret fails to load ("found 2 elements
# for secret ..., must be single element exactly") and Traefik drops the
# youtarr-api router entirely -- no error surfaces outside the controller
# logs, and traffic silently falls through to the Authentik-gated host
# route (returns 302 instead of 401). That is why `users` does NOT live in
# youtarr-api-basicauth above alongside `password` -- this Secret exists
# solely so Traefik has a single-key Secret to read. This is the ONLY
# consumer of this Secret; the human/extension reads `password` from the
# sibling above instead.
#
# Same 1Password source and bcrypt template as youtarr-api-basicauth; only
# `password` is dropped from the template output. The `users` hash still
# churns every refresh (sprig's bcrypt salts randomly) -- routine, not a
# rotation signal, same as the sibling Secret.
#
# ROTATION: see the force-resync note on youtarr-api-basicauth above -- this
# ExternalSecret must be force-synced in the SAME breath as that one, or
# this hash and that plaintext will briefly disagree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: youtarr-api-basicauth-htpasswd
  namespace: downloads
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: youtarr-api-basicauth-htpasswd
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        users: "{{ printf \"utarr:%s\" (bcrypt .password) }}"
  data:
    - secretKey: password
      remoteRef:
        key: youtarr-api-basicauth
        property: password
