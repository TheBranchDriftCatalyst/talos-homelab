---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtarr
  namespace: downloads
  labels:
    app: youtarr
    app.kubernetes.io/name: youtarr
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO config PVC + single MariaDB writer
  selector:
    matchLabels:
      app: youtarr
  template:
    metadata:
      labels:
        app: youtarr
        app.kubernetes.io/name: youtarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Youtarr's own charset migration cannot complete on MariaDB 11.4.
        #
        # Its migrations create tables as utf8mb3 and then run
        #   ALTER TABLE `Jobs` MODIFY `id` CHAR(36) ... COLLATE utf8mb4_bin
        # but Jobs.id is referenced by JobVideos_ibfk_1, so MariaDB rejects the
        # column change with ER_FK_COLUMN_CANNOT_CHANGE_CHILD (1833) and the app
        # boots in permanent "degraded mode" with schemaValid=false.
        # Setting FOREIGN_KEY_CHECKS=0 does NOT lift this - the constraint has to
        # be dropped and recreated around the change.
        #
        # This runs BEFORE Youtarr each boot and is idempotent: it no-ops when the
        # column is already utf8mb4_bin, and when the table does not exist yet (very
        # first boot, before Youtarr creates the schema). On that first boot Youtarr
        # still lands in degraded mode, its startupProbe fails, the pod restarts, and
        # this container then repairs the schema - so the deployment self-heals
        # without manual SQL.
        - name: schema-charset-fix
          image: mariadb:11.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: {name: youtarr-mariadb-conn, key: DB_HOST}
            - name: ROOT_PW
              valueFrom:
                secretKeyRef: {name: youtarr-mariadb-root, key: password}
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                mariadb -h "$DB_HOST" -uroot -p"$ROOT_PW" -e 'SELECT 1' >/dev/null 2>&1 && break
                echo "waiting for mariadb ($i)"; sleep 3
              done
              q() { mariadb -h "$DB_HOST" -uroot -p"$ROOT_PW" -N -B -e "$1"; }
              SEL="SELECT COLLATION_NAME FROM information_schema.COLUMNS"
              SEL="$SEL WHERE TABLE_SCHEMA='youtarr'"
              SEL="$SEL AND TABLE_NAME='Jobs' AND COLUMN_NAME='id'"
              COL=$(q "$SEL" || true)
              if [ -z "$COL" ]; then
                echo "Jobs table absent - first boot, nothing to repair"; exit 0
              fi
              if [ "$COL" = "utf8mb4_bin" ]; then
                echo "schema already utf8mb4_bin - no-op"; exit 0
              fi
              echo "repairing charset: Jobs.id is $COL, converting to utf8mb4_bin"
              q "ALTER DATABASE youtarr CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              q "ALTER TABLE youtarr.JobVideos DROP FOREIGN KEY JobVideos_ibfk_1"
              for t in Jobs Videos JobVideos channels channelvideos Sessions; do
                q "ALTER TABLE youtarr.$t CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci" || true
              done
              BIN="CHAR(36) CHARACTER SET utf8mb4 COLLATE utf8mb4_bin NOT NULL"
              q "ALTER TABLE youtarr.Jobs MODIFY \`id\` $BIN"
              q "ALTER TABLE youtarr.JobVideos MODIFY \`job_id\` $BIN"
              FK="ADD CONSTRAINT JobVideos_ibfk_1 FOREIGN KEY (job_id)"
              FK="$FK REFERENCES youtarr.Jobs(id) ON UPDATE CASCADE"
              q "ALTER TABLE youtarr.JobVideos $FK"
              echo "charset repair complete"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: youtarr
          # Pinned, not :latest. Multi-arch (amd64/arm64).
          image: dialmaster/youtarr:v1.90.2
          ports:
            - name: http
              containerPort: 3011
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            # DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME — keys are named
            # by the MariaDB CR's connection.secretTemplate to match Youtarr's env
            # contract exactly, so no remapping is needed.
            - secretRef:
                name: youtarr-mariadb-conn
            # AUTH_PRESET_USERNAME / AUTH_PRESET_PASSWORD
            - secretRef:
                name: youtarr-admin
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: LOG_LEVEL
              value: info
            # Express sits behind Traefik; without this, redirects and rate
            # limiting see the proxy IP instead of the client.
            - name: TRUST_PROXY
              value: "true"
            # Youtarr's built-in auth stays ON for now. When the Authentik
            # forward-auth middleware is added (TALOS-8pbo) set AUTH_ENABLED=false
            # so there is no double login.
            - name: AUTH_ENABLED
              value: "true"
            # DATA_PATH makes the container write to the SAME absolute path Plex
            # reads from. Keeping them identical avoids any path translation in
            # the generated .m3u files and in Plex item matching.
            - name: DATA_PATH
              value: /data/synology/youtube
            - name: YOUTUBE_OUTPUT_DIR
              value: /data/synology/youtube
          volumeMounts:
            - name: media
              mountPath: /data/synology/youtube
            - name: config
              mountPath: /app/config
              subPath: config
            - name: config
              mountPath: /app/jobs
              subPath: jobs
            - name: config
              mountPath: /app/server/images
              subPath: images
          # startupProbe guards the liveness probe: Youtarr runs schema
          # migrations against MariaDB on boot, and a slow start would otherwise
          # trip liveness and restart it forever.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          # PROVISIONAL — yt-dlp downloads and remux spike; revisit with 7d data.
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: youtarr-media
        - name: config
          persistentVolumeClaim:
            claimName: youtarr-config
