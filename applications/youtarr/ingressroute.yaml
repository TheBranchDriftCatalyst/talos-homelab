---
# Youtarr — HTTPS + Authentik forward-auth SSO on youtarr.talos00
# (TALOS-l5c3, gated in TALOS-8pbo).
#
# AUTH: Youtarr's OWN Express login is DISABLED (AUTH_ENABLED=false in
# deployment.yaml), so authentik-lan is the only gate and there is no double
# login. The youtarr-admin ESO secret is still mounted but AUTH_PRESET_* is
# inert while AUTH_ENABLED=false — see the note in deployment.yaml.
#
# Provider/application: infrastructure/base/authentik/media-experimental-blueprint.yaml
# (forward_single, talos-media group). Unioned into BOTH outposts
# (talos00-outpost-blueprint.yaml + talos-private-blueprint.yaml) and paired with
# the priority-2000 callback route in authentik-lan-outpost/app-callbacks.yaml —
# the middleware ref and that callback route are a PAIR; one without the other
# makes the login loop or 400.
#
# web and websecure are SEPARATE IngressRoutes on purpose: combining entrypoints
# on one route lets the injected default TLS config make the router TLS-only,
# silently 404ing plain HTTP.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: youtarr
  namespace: downloads
  labels:
    app: youtarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Youtarr"
    gethomepage.dev/description: "YouTube channel/playlist sync to Plex"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "youtube.png"
    gethomepage.dev/siteMonitor: "http://youtarr.downloads.svc.cluster.local:3011"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`youtarr.talos00`)
      kind: Rule
      middlewares:
        # LAN forward-auth via the dedicated talos00 outpost: login stays on
        # auth.talos00. FIRST in the chain so auth runs before anything else.
        - name: authentik-lan
          namespace: authentik
        # Consolidated catalyst navbar. LAST in the chain so auth runs first and
        # the body injector only ever rewrites an already-authorised response.
        # If the Youtarr SPA renders oddly, remove this first — body injection is
        # a known silent-failure source against single-page apps.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: youtarr
          port: 3011
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: youtarr-http
  namespace: downloads
  labels:
    app: youtarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`youtarr.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: youtarr
          port: 3011
---
# BasicAuth for the single API path the utarr extension calls.
# Credential comes from the youtarr-api-basicauth ExternalSecret (key `users`).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: youtarr-api-basicauth
  namespace: downloads
spec:
  basicAuth:
    secret: youtarr-api-basicauth
---
# utarr extension API route.
#
# Path() not PathPrefix() — exactly ONE endpoint is exempted from Authentik.
# Youtarr runs AUTH_ENABLED=false, so it does NOT check the API key itself:
# upstream warns that in that mode it "accepts every request without checking
# the API key". This BasicAuth middleware is therefore the ONLY thing standing
# in front of the endpoint. Widening this match, or dropping the middleware,
# makes it openly callable by anything that can reach the ingress.
#
# priority is EXPLICIT. Traefik otherwise orders by rule length, which is too
# implicit for a security boundary: if the Authentik route won, the extension
# would silently 302 instead of working.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: youtarr-api
  namespace: downloads
  labels:
    app: youtarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`youtarr.talos00`) && Path(`/api/videos/download`)
      kind: Rule
      priority: 3000
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: youtarr-api-basicauth
      services:
        - name: youtarr
          port: 3011
