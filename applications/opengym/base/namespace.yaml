---
apiVersion: v1
kind: Namespace
metadata:
  name: opengym
  labels:
    app.kubernetes.io/part-of: opengym
    # Both containers run non-root (api as uid 1000, nginx as uid 101) and drop
    # ALL capabilities, so unlike haven this one actually satisfies `restricted`.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
