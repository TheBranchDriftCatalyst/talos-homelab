---
# Pull secret for the in-cluster Zot registry.
#
# WHY THIS EXISTS ALONGSIDE ghcr-secret: the GHCR path in base/ is the intended
# long-term route (CI builds, image-updater bumps the tag). But it needs a
# GitHub repo and a CI run before an image exists at all, so the FIRST bring-up
# pushes a locally built image to registry.talos00 instead — the same pattern
# bt-agent and plausible-stats-exporter use. This secret is what lets the
# cluster pull it.
#
# Deleting this and dropping the image override in kustomization.yaml is all it
# takes to move to GHCR later; nothing else in the manifests cares.
#
# REQUIRES the existing 1Password item `nexus-admin` with `username` and
# `password` fields. It already exists — several namespaces use it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
  namespace: fchat-bouncer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.talos00":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: nexus-admin, property: username }
    - secretKey: password
      remoteRef: { key: nexus-admin, property: password }
