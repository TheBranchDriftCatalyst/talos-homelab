---
# First-bring-up image source. See registry-pull-secret.yaml for why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fchat-bouncer
spec:
  template:
    spec:
      imagePullSecrets:
        # Both listed deliberately: the kubelet tries each until one works, so
        # this overlay pulls from Zot today and needs no edit on the day the
        # image moves to GHCR.
        - name: nexus-pull-dockercfg
        - name: ghcr-secret
