---
apiVersion: v1
kind: Namespace
metadata:
  name: fchat-bouncer
  labels:
    app.kubernetes.io/name: fchat-bouncer
    app.kubernetes.io/part-of: catalyst
    # baseline, not restricted: the catalyst-images:python base runs as root and
    # CNPG's instance pods want their own securityContext. audit/warn stay at
    # restricted so the gap is visible rather than forgotten.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    goldilocks.fairwinds.com/enabled: 'true'
    goldilocks.fairwinds.com/vpa-update-mode: 'off'
    # NOT labelled ghcr-pull-secret: the cluster-wide ClusterExternalSecret is
    # opt-OUT (see infrastructure/base/external-secrets/ghcr-pull-secret/), so
    # `ghcr-secret` lands here automatically. Adding a label here would be
    # cargo cult.
