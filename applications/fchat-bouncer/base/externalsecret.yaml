---
# F-List credentials + the session signing key, from 1Password via ESO.
#
# REQUIRES a 1Password item named `f-list` in the vault the `onepassword`
# ClusterSecretStore is pointed at, with THREE fields:
#
#   account         the F-List account name (the account, not a character name)
#   password        that account's password
#   session-secret   >=32 random bytes, e.g. `openssl rand -hex 32`
#
# WHY session-secret LIVES ON THE SAME ITEM, and not in an ESO `Password`
# generator: a generator secret regenerates on any change to the ExternalSecret
# spec — refreshInterval:0 does not prevent it, because reconciliation, not the
# interval, is the trigger. For a cookie signing key that means every user is
# silently logged out the next time anyone edits this file. A 1Password field is
# stable until a human changes it, which is the property we actually want. The
# cost is one more field to provision, documented in DEPLOY.md.
#
# The secretKey names ARE the container's env var names: the Deployment loads
# this Secret with envFrom, so `FCHAT_SESSION_SECRET` here becomes
# FCHAT_SESSION_SECRET in the process, which pydantic-settings reads as
# `session_secret` (env_prefix FCHAT_).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fchat-bouncer-secrets
  namespace: fchat-bouncer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: fchat-bouncer-secrets
    creationPolicy: Owner
    # Retain: deleting this ExternalSecret must not take the live session key
    # with it and log everyone out.
    deletionPolicy: Retain
  data:
    - secretKey: FCHAT_FLIST_ACCOUNT
      remoteRef: { key: f-list, property: account }
    - secretKey: FCHAT_FLIST_PASSWORD
      remoteRef: { key: f-list, property: password }
    - secretKey: FCHAT_SESSION_SECRET
      remoteRef: { key: f-list, property: session-secret }
