---
# Session-cookie signing key, GENERATED rather than fetched.
#
# WHY GENERATED: nothing else needs to know this value. It signs the session
# cookie and is read by exactly one process, so there is no reason for a human
# to choose it, store it, or ever see it — and requiring a 1Password item for it
# would mean the app could not deploy until somebody went and made one.
#
# WHY IT IS STILL REQUIRED BY THE POD: config.py falls back to the literal
# string "dev-only-not-a-secret" when FCHAT_SESSION_SECRET is unset. That
# default exists so `task dev` works out of the box; in the cluster it would let
# anyone forge a session cookie. So the pod must fail to start rather than run
# on it — see the envFrom comment in deployment.yaml.
#
# refreshInterval "0" = generate once. ESO regenerates a generator-backed secret
# on spec changes regardless, and the consequence here is mild and obvious:
# every existing session becomes invalid and everyone signs in again. That is
# acceptable for a cookie key in a way it would not be for, say, an object-store
# credential other services hold copies of.
#
# NOTE: there are deliberately NO F-List credentials here. You sign in to F-List
# through the app, which exchanges the password for a short-lived ticket and
# never persists it. Adding them here would only be for holding characters
# online unattended across restarts, and that is a separate decision.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fchat-session-secret
  namespace: fchat-bouncer
spec:
  length: 64
  digits: 16
  # Alphanumeric: the value travels through env vars and container tooling, and
  # symbols there invite quoting bugs for no added entropy at this length.
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fchat-bouncer-secrets
  namespace: fchat-bouncer
spec:
  refreshInterval: "0"
  target:
    name: fchat-bouncer-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        FCHAT_SESSION_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: fchat-session-secret
