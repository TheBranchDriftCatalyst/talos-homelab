---
# MeTube — HTTPS + Authentik forward-auth SSO on metube.talos00 (TALOS-xgrl.14).
# Single gated route: MeTube has NO login of its own → Authentik SSO is the ONLY gate,
# so no double-login. The forward-auth middleware authenticates the initial handshake
# and passes MeTube's socket.io/WebSocket progress stream through afterwards.
# TLS: default TLSStore serves the *.talos00 wildcard via SNI.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metube
  labels:
    app: metube
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "MeTube"
    gethomepage.dev/description: "yt-dlp web downloader"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "metube.png"
    gethomepage.dev/siteMonitor: "http://metube.downloads.svc.cluster.local:8081"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`metube.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: metube
          port: 8081
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metube-http
  labels:
    app: metube
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`metube.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: metube
          port: 8081
