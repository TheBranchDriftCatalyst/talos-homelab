---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  labels:
    app: metube
    app.kubernetes.io/name: metube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metube
  template:
    metadata:
      labels:
        app: metube
        app.kubernetes.io/name: metube
    spec:
      containers:
        - name: metube
          image: ghcr.io/alexta69/metube:latest
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
          # Measured 24h to 2026-08-24: p50 62Mi, peak 194Mi (3.1x) — the
          # spikes are yt-dlp muxing. BURSTABLE with the limit at 2x peak;
          # a limit near p50 would kill mid-download.
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: metube-downloads
