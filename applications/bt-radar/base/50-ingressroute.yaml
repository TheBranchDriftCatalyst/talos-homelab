---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bt-radar
  namespace: bt-radar
  annotations:
    gethomepage.dev/name: "BT Radar"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/icon: "mdi-radar"
    gethomepage.dev/description: "Bluetooth presence radar"
spec:
  entryPoints: [web]
  routes:
    - match: Host(`bt-radar.talos00`)
      kind: Rule
      services:
        - name: bt-collector
          port: 8080
