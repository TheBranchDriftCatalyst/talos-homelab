---
# The BLE sensor. One per node with a radio.
#
# Bluetooth host support is not installed yet. USB discovery alone does not imply a
# usable HCI adapter. Wait explicitly in Init:0/1 until the host exposes hciN instead
# of repeatedly launching the scanner's failing preflight. The pod remains unready;
# this gate does not claim scanning works or substitute simulated observations.
# Host enablement remains tracked in TALOS-1mog; see docs/05-runbooks/bluetooth-enablement.md.
#
# wifi-agent is also deliberately scaled to zero; see 30-wifi-agent.yaml.
#
# replicas are governed by the DaemonSet + nodeSelector: only nodes with a radio. talos00
# is a VM with no Bluetooth hardware and is excluded by the label selector below.
# A DaemonSet ignores PreferNoSchedule (it is soft), so talos01/talos03 are fine.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bt-agent
  namespace: bt-radar
spec:
  selector:
    matchLabels: { app: bt-agent }
  template:
    metadata:
      labels:
        app: bt-agent
        app.kubernetes.io/name: bt-agent
        app.kubernetes.io/part-of: bt-radar
    spec:
      automountServiceAccountToken: false
      # Only nodes that physically have a Bluetooth radio — discovered automatically.
      #
      # NFD labels this from the USB device class: e0 is "wireless controller", which is
      # where Bluetooth radios live. Enabled in infrastructure/base/intel-gpu/nfd-helmrelease.yaml;
      # the chart does not do it by default, which is why the cluster had no usb-* labels
      # at all despite every bare-metal node carrying a radio.
      #
      # NO MANUAL LABELLING. Plug a BLE dongle into any node and it is selected within one
      # NFD interval; pull it out and the label goes away and the pod is descheduled.
      # talos00 is a VM with no radio and is excluded automatically, with nothing to remember.
      nodeSelector:
        feature.node.kubernetes.io/usb-e0.present: "true"
      # A DaemonSet must be able to land on control planes too — three of the four
      # radio-bearing nodes are control planes in this cluster.
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: catalyst.io/memory-constrained, operator: Exists, effect: PreferNoSchedule }
      # Raw HCI socket access needs the host's network namespace and NET_ADMIN/NET_RAW.
      # This is the ONLY privileged component, and it holds no credentials — it cannot
      # reach the database and only ever POSTs to the collector.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: nexus-pull-dockercfg
      initContainers:
        - name: wait-for-bluetooth
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              trap 'exit 143' TERM INT
              sysfs="${SYSFS_ROOT:-/host/sys}"
              while :; do
                for adapter in "$sysfs"/class/bluetooth/hci[0-9]*; do
                  if [ -d "$adapter" ]; then
                    echo "Bluetooth adapter ${adapter##*/} is present; starting scanner preflight."
                    exit 0
                  fi
                done
                if [ -d "$sysfs/class/bluetooth" ]; then
                  echo "Waiting for Bluetooth: subsystem present but no HCI adapter; check radio driver and firmware."
                else
                  echo "Waiting for Bluetooth: host subsystem absent; Talos Bluetooth kernel support is required."
                fi
                sleep "${POLL_SECONDS:-60}" &
                wait "$!"
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { cpu: 10m, memory: 16Mi }
          volumeMounts:
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
      containers:
        - name: bt-agent
          image: registry.talos00/talos00-registry/bt-agent:latest
          imagePullPolicy: Always
          args:
            - -collector=http://bt-collector.bt-radar.svc:8080
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 96Mi }
