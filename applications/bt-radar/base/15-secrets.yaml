---
# Registry pull secret. Same ESO-from-1Password pattern every other namespace uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
  namespace: bt-radar
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.talos00":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: nexus-admin, property: username }
    - secretKey: password
      remoteRef: { key: nexus-admin, property: password }
---
# UniFi controller credentials for wifi-agent.
#
# REQUIRES a 1Password item named `unifi-readonly` with `username` and `password` fields.
# Create a DEDICATED READ-ONLY LOCAL ADMIN in UniFi for this — not the owner account, and
# not a Ubiquiti SSO account. Local admins survive cloud outages and carry no account-wide
# privilege. wifi-agent only ever issues GETs against stat/sta and stat/device.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-credentials
  namespace: bt-radar
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: UNIFI_USER
      remoteRef: { key: unifi-readonly, property: username }
    - secretKey: UNIFI_PASS
      remoteRef: { key: unifi-readonly, property: password }
