apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DRY multi-instance gethomepage stack (epic TALOS-qt7u).
#
#   base/shared     — singletons rendered ONCE: SA + ClusterRole + CRB,
#                     homepage-* ExternalSecrets, homepage-shared ConfigMap
#   base/instance   — one instance's workload (Deployment/Service/
#                     IngressRoute/settings CM); never built directly
#   overlays/<name> — base/instance + nameSuffix + instanceName/host patches
#
# master  -> homepage.talos00           (instanceName: master, static services)
# <board> -> <board>.homepage.talos00   (instanceName: <board>)
#
# Instance filtering: each board only shows services whose IngressRoutes carry
# gethomepage.dev/instance.<instanceName> annotations (stamped by the Kyverno
# policy built in a parallel effort).

namespace: homepage

resources:
  - base/shared
  - overlays/master
  - overlays/arrs
  - overlays/data
  - overlays/llm
  - overlays/infra
  - overlays/obs
  - overlays/home
  - overlays/apps

labels:
  - pairs:
      app.kubernetes.io/part-of: homepage
