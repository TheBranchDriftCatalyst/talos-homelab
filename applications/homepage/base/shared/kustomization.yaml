apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster/namespace singletons for the multi-instance homepage stack.
# Included EXACTLY ONCE by the top-level applications/homepage/kustomization.yaml
# aggregator — never referenced from the per-instance overlays, so the SA,
# RBAC, ExternalSecrets, and shared ConfigMap render a single time no matter
# how many instance overlays exist.

resources:
  - serviceaccount.yaml
  - externalsecrets.yaml
  - configmap-shared.yaml
