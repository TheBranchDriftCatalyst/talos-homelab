---
# Homepage Widgets Configuration
# Documentation: https://gethomepage.dev/configs/info-widgets/

# Kubernetes cluster information
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: "Talos Cluster"
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true

# Search bar - use private search
- search:
    provider: ["duckduckgo", "google", "bing"]
    focus: false
    showSearchSuggestions: true
    target: _blank

# Greeting with date/time
- greeting:
    text_size: 2xl
    text: "Catalyst Homelab"

- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hour12: true

# OpenMeteo weather
- openmeteo:
    label: San Francisco
    latitude: 37.7749
    longitude: -122.4194
    timezone: America/Los_Angeles
    units: imperial
    cache: 5
