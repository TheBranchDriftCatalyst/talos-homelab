---
# --- Authentik API token (1Password: authentik-api-token) ------------------
# Create the API token in Authentik Admin > Directory > Tokens & App Passwords
# Store in 1Password item "authentik-api-token" with field "password"
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-authentik-credentials
  labels:
    app: homepage
    app.kubernetes.io/name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-authentik-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        AUTHENTIK_API_KEY: '{{ .authentik_token }}'
  data:
    - secretKey: authentik_token
      remoteRef:
        key: authentik-api-token
        property: password
# Re-enabled 2026-08-10 (TALOS-qt7u): 1P item homeassistant-token exists (created empty +
# tagged `todo`). ESO syncs it cleanly even while empty (no SecretSyncedError — the item
# exists). The consuming homepage env var is `optional: true`, so an empty value just leaves
# the widget unpopulated. Fill the value in the 1P item and ESO propagates it on the next
# refresh (1h) — no code change needed.
#
# RETIRED (TALOS-ekmt/TALOS-19v2, epic TALOS-vo0i): the qBittorrent
# (homepage-qbittorrent-credentials) and Tautulli (homepage-tautulli-credentials)
# ExternalSecrets that pulled from 1P are GONE. Those values are ours to choose, so they are
# now GENERATED in-cluster by ESO Password generators in ns media
# (applications/arr-stack/base/qbittorrent/webui-credentials.yaml and
# applications/arr-stack/base/tautulli/externalsecret.yaml) and mirrored into this namespace
# by emberstack/reflector as Secrets `qbittorrent-webui` / `tautulli-api-key`, which the
# instance Deployments reference directly. The empty 1P items `qbittorrent-webui` and
# `tautulli-api-key` are moot — delete them at leisure. The old target Secrets were created
# with deletionPolicy Retain, so `kubectl delete secret -n homepage
# homepage-qbittorrent-credentials homepage-tautulli-credentials` once this lands.
---
# --- Home Assistant long-lived token (1Password: homeassistant-token) ------
# Generate in Home Assistant: Settings > User > Long-Lived Access Tokens
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-homeassistant-credentials
  labels:
    app: homepage
    app.kubernetes.io/name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-homeassistant-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        HOMEASSISTANT_TOKEN: '{{ .ha_token }}'
  data:
    - secretKey: ha_token
      remoteRef:
        key: homeassistant-token
        property: password
