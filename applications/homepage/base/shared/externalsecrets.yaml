---
# All homepage-* ExternalSecrets, shared by every homepage instance.
# Migrated verbatim from applications/arr-stack/base/homepage/*-externalsecret.yaml
# into the `homepage` namespace (namespace stamped by the top-level aggregator).
# Every instance Deployment references the resulting Secrets with
# `optional: true`, so a missing secret degrades a widget, not the pod.

# --- Grafana admin credentials (1Password: default-service-admin) ----------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-grafana-credentials
  labels:
    app: homepage
    app.kubernetes.io/name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-grafana-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        GRAFANA_USER: admin
        GRAFANA_PASS: '{{ .password }}'
  data:
    - secretKey: password
      remoteRef:
        key: default-service-admin
        property: password
---
# --- ArgoCD API key (1Password: argocd-api-key) ----------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-argocd-credentials
  labels:
    app: homepage
    app.kubernetes.io/name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-argocd-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ARGOCD_API_KEY
      remoteRef:
        key: argocd-api-key
        property: password
---
