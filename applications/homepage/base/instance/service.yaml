---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels:
    app: homepage
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    # Overlays add app.kubernetes.io/instance: <domain> (includeSelectors)
    # so each Service only targets its own instance's pods.
    app: homepage
