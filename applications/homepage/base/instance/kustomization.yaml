apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One homepage INSTANCE (Deployment + Service + IngressRoute + settings CM).
# Never built directly — each overlays/<domain>/ includes this with a unique
# nameSuffix + an `app.kubernetes.io/instance` selector label so 8 instances
# coexist in the `homepage` namespace. Shared singletons (SA/RBAC,
# ExternalSecrets, homepage-shared CM) live in ../shared and are referenced
# by NAME only from here.

resources:
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

# configMapGenerator, NOT a plain ConfigMap resource. Both keys are mounted by
# subPath in deployment.yaml, and a subPath mount is FROZEN at pod start — it
# never picks up a ConfigMap edit. With a stable name the pod template does not
# change either, so Flux has nothing to roll and every instance keeps serving
# the old settings indefinitely. The generated content hash changes the pod
# template on every edit, which is the only thing that actually triggers a
# rollout. Overlays override settings.yaml with `behavior: merge`, which
# replaces that key while keeping kubernetes.yaml from here.
configMapGenerator:
  - name: homepage-settings
    files:
      - settings.yaml=files/settings.yaml
      - kubernetes.yaml=files/kubernetes.yaml
