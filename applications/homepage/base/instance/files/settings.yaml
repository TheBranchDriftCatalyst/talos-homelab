---
# Homepage Settings Configuration
# Documentation: https://gethomepage.dev/configs/settings/
# NOTE: instanceName is intentionally ABSENT here — each overlay's
# patch-settings.yaml provides the full settings including instanceName.
#
# CATALYST CONTROL ROOM appearance block (keep mirrored in all 8 overlay
# patches). headerStyle "clean" on purpose: the group-header treatment
# (glow tick + tracked caps + hairline) is drawn by the shared custom.css
# in base/shared/configmap-shared.yaml, and "boxed" would fight it.
title: Talos Homelab Dashboard
description: Kubernetes Media & Infrastructure Stack
favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png
theme: dark
color: slate
cardBlur: sm
headerStyle: clean
iconStyle: theme
statusStyle: dot
showStats: true
useEqualHeights: true
hideVersion: true
disableUpdateCheck: true
target: _blank
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  showSearchSuggestions: true
  provider: duckduckgo
language: en
