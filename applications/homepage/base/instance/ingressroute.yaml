---
# Placeholder Host + service name — every overlay REPLACES spec.routes via
# patch-host.yaml (Host <domain>.homepage.${CLUSTER_DOMAIN} + the
# nameSuffix-ed Service name; kustomize cannot rewrite service refs inside
# Traefik CRDs, so the patch carries the final name).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  labels:
    app: homepage
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`homepage.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
