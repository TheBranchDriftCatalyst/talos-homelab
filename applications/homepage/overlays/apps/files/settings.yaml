---
# Homepage Settings — apps board (accent: blue)
# Documentation: https://gethomepage.dev/configs/settings/
instanceName: apps
title: Catalyst // Apps
description: Experiments, games & utilities
favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

# SPARSE board (boomtime/catalyst/gaming/... routes not yet enabled):
# narrow 2-column group; the shared custom.css additionally centers and
# enlarges this board so it reads curated, not empty. Forward stub for
# the expected gethomepage.dev/group value.
layout:
  Apps:
    style: row
    columns: 2

theme: dark
color: slate
cardBlur: sm
headerStyle: clean
iconStyle: theme
statusStyle: dot
showStats: true
useEqualHeights: true
hideVersion: true
disableUpdateCheck: true
target: _blank
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  showSearchSuggestions: true
  provider: duckduckgo
language: en
