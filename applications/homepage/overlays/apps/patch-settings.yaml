---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.apps` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (blue) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — apps board (accent: blue)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: apps
    title: Catalyst // Apps
    description: Experiments, games & utilities
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # SPARSE board (boomtime/catalyst/gaming/... routes not yet enabled):
    # narrow 2-column group; the shared custom.css additionally centers and
    # enlarges this board so it reads curated, not empty. Forward stub for
    # the expected gethomepage.dev/group value.
    layout:
      Apps:
        style: row
        columns: 2

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
