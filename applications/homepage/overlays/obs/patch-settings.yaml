---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.obs` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (orange) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — obs board (accent: orange)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: obs
    title: Catalyst // Observability
    description: Metrics, logs, traces & alerts
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # SPARSE board (currently Grafana + Alloy from ns monitoring): narrow
    # 2-column group; the shared custom.css additionally centers and
    # enlarges this board so it reads curated, not empty.
    layout:
      Monitoring:
        style: row
        columns: 2

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
