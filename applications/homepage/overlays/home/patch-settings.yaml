---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.home` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (coral) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — home board (accent: coral)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: home
    title: Catalyst // Home
    description: Automation for the physical world
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # SPARSE board (currently Home Assistant from ns home-automation):
    # narrow 2-column group; the shared custom.css additionally centers and
    # enlarges this board so it reads curated, not empty.
    layout:
      Home & Tools:
        style: row
        columns: 2

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
