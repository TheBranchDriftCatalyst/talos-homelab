---
# Homepage Settings — home board (accent: coral)
# Documentation: https://gethomepage.dev/configs/settings/
instanceName: home
title: Catalyst // Home
description: Automation for the physical world
favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

# SPARSE board (currently Home Assistant from ns home-automation):
# narrow 2-column group; the shared custom.css additionally centers and
# enlarges this board so it reads curated, not empty.
layout:
  Home & Tools:
    style: row
    columns: 2

theme: dark
color: slate
cardBlur: sm
headerStyle: clean
iconStyle: theme
statusStyle: dot
showStats: true
useEqualHeights: true
hideVersion: true
disableUpdateCheck: true
target: _blank
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  showSearchSuggestions: true
  provider: duckduckgo
language: en
