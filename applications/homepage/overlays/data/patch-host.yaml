---
# Replaces spec.routes wholesale: per-instance Host + the FINAL (nameSuffix-ed)
# Service name — kustomize's nameReference fixup doesn't know Traefik CRDs,
# so the service ref must be written post-suffix by hand.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
spec:
  routes:
    - match: Host(`data.homepage.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: homepage-data
          port: 3000
