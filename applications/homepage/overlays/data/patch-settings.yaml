---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.data` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (amber) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — data board (accent: amber)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: data
    title: Catalyst // Data Platform
    description: Databases, pipelines & storage
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # SPARSE board (catalyst-data has no enabled routes yet): narrow
    # 2-column groups; the shared custom.css additionally centers and
    # enlarges this board so it reads curated, not empty. Layout entries
    # for groups that do not exist yet are ignored by homepage — these are
    # forward stubs for the expected gethomepage.dev/group values.
    layout:
      Data:
        style: row
        columns: 2
      Databases:
        style: row
        columns: 2
      Storage:
        style: row
        columns: 2

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
