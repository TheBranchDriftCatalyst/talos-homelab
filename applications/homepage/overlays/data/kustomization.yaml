apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# homepage instance: data (data.homepage.talos00)
# base/instance + unique nameSuffix => 8 coexisting Deployments/Services/
# IngressRoutes/settings-CMs in ns homepage. includeSelectors stamps
# app.kubernetes.io/instance onto Deployment selector/template and Service
# selector so each Service only routes to its own pods.

resources:
  - ../../base/instance
nameSuffix: -data

labels:
  - pairs:
      app.kubernetes.io/instance: data
    includeSelectors: true

patches:
  # NOTE: patches target the PRE-suffix names (kustomize applies patches
  # before the nameSuffix transformer in the same kustomization).
  - path: patch-deployment.yaml
  - path: patch-host.yaml

# behavior: merge replaces ONLY settings.yaml, keeping kubernetes.yaml from
# base/instance. Generated (not a patch on a plain ConfigMap) so the content
# hash lands in the pod template — a subPath mount is frozen at pod start, so
# without that hash an edit here would never reach the running pod.
configMapGenerator:
  - name: homepage-settings
    behavior: merge
    files:
      - settings.yaml=files/settings.yaml
