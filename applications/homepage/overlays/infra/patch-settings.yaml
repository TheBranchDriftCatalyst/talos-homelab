---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.infra` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (emerald) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — infra board (accent: emerald)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: infra
    title: Catalyst // Platform Ops
    description: GitOps, ingress, registry & cluster core
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # Medium-density board (~10 services from argocd/forgejo/registry/
    # infra-control/kube-system/...): balanced 3-column rows.
    layout:
      Infrastructure:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
      Home & Tools:
        style: row
        columns: 3

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
