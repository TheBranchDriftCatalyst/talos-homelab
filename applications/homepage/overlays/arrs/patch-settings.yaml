---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.arrs` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (pink) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — arrs board (accent: pink)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: arrs
    title: Catalyst // Media Grid
    description: Acquisition, automation & streaming
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # Dense board (~26 services from media/media-experimental/tdarr):
    # wide 4-column rows. Group names match gethomepage.dev/group.
    layout:
      Media:
        style: row
        columns: 4
      Audiobooks:
        style: row
        columns: 4
      Books & Comics:
        style: row
        columns: 4
      Book Automation (Exp):
        style: row
        columns: 4

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
