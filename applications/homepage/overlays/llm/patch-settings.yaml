---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). instanceName is this board's identity:
# only services whose IngressRoutes carry the
# `gethomepage.dev/instance.llm` annotation appear on this board.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (violet) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — llm board (accent: violet)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: llm
    title: Catalyst // AI Lab
    description: Inference, agents & model ops
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # SPARSE board (catalyst-llm routes are still being wired up): narrow
    # 2-column groups; the shared custom.css additionally centers and
    # enlarges this board so it reads curated, not empty.
    layout:
      AI & LLM:
        style: row
        columns: 2

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
