---
# master-only: allow-list the apex host AND swap the services.yaml mount from
# the shared empty placeholder to the static-services ConfigMap.
# - volumes merge by `name`   => adds the services-static volume
# - volumeMounts merge by `mountPath` => repoints /app/config/services.yaml
#   at the new volume (widgets/bookmarks/docker still come from homepage-shared)
# nameSuffix renames homepage-services -> homepage-services-master and
# kustomize's nameReference fixup rewrites the volume's configMap ref.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  template:
    spec:
      containers:
        - name: homepage
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: 'homepage.talos00'
          volumeMounts:
            - name: services-static
              mountPath: /app/config/services.yaml
              subPath: services.yaml
      volumes:
        - name: services-static
          configMap:
            name: homepage-services
