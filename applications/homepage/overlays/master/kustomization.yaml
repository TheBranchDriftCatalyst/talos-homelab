apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# homepage instance: master (homepage.talos00)
# base/instance + unique nameSuffix => 8 coexisting Deployments/Services/
# IngressRoutes/settings-CMs in ns homepage. includeSelectors stamps
# app.kubernetes.io/instance onto Deployment selector/template and Service
# selector so each Service only routes to its own pods.

resources:
  - ../../base/instance
  # master-only: static services that cannot be auto-discovered
  - configmap-services.yaml
nameSuffix: -master

labels:
  - pairs:
      app.kubernetes.io/instance: master
    includeSelectors: true

patches:
  # NOTE: patches target the PRE-suffix names (kustomize applies patches
  # before the nameSuffix transformer in the same kustomization).
  - path: patch-settings.yaml
  - path: patch-deployment.yaml
  - path: patch-host.yaml
