---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). The master board keeps the original
# arr-stack homepage settings (incl. layout for its static groups), plus
# instanceName: master so it only shows services annotated
# `gethomepage.dev/instance.master`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — master board
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: master
    title: Talos Homelab Dashboard
    description: Kubernetes Media & Infrastructure Stack
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # Layout configuration (groups from the static services.yaml below and
    # from auto-discovered master-annotated services)
    layout:
      Media:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
      Home & Tools:
        style: row
        columns: 4
      AI & LLM:
        style: row
        columns: 3
      VPN & Privacy:
        style: row
        columns: 3

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: boxed
    iconStyle: theme
    showStats: true
    statusStyle: dot
    hideVersion: false
    disableUpdateCheck: false
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
