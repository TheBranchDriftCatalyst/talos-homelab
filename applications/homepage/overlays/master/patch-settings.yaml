---
# Replaces the ENTIRE settings.yaml key of homepage-settings (kustomize
# cannot merge inside a string value). The master board sees EVERY enabled
# service (Kyverno stamps gethomepage.dev/instance.master on all of them)
# plus the static groups from configmap-services.yaml, so it runs the
# densest layout of the fleet.
# Appearance block mirrors base/instance/configmap-settings.yaml — keep in
# sync. Accent (cyan) comes from the shared custom.css keyed off the host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-settings
data:
  settings.yaml: |
    ---
    # Homepage Settings — master board (accent: cyan)
    # Documentation: https://gethomepage.dev/configs/settings/
    instanceName: master
    title: Catalyst // Master Control
    description: Every service across the grid
    favicon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png

    # Dense board: wide rows. Group names must match the
    # gethomepage.dev/group annotations + the static services.yaml groups.
    layout:
      Media:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 3
      AI & LLM:
        style: row
        columns: 3
      VPN & Privacy:
        style: row
        columns: 3
      Home & Tools:
        style: row
        columns: 4
      Audiobooks:
        style: row
        columns: 4
      Books & Comics:
        style: row
        columns: 4
      Book Automation (Exp):
        style: row
        columns: 4

    theme: dark
    color: slate
    cardBlur: sm
    headerStyle: clean
    iconStyle: theme
    statusStyle: dot
    showStats: true
    useEqualHeights: true
    hideVersion: true
    disableUpdateCheck: true
    target: _blank
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      provider: duckduckgo
    language: en
