---
# Home Assistant's recorder Postgres, as a CatalystCNPGAppDB.
#
# Replaces the hand-written Cluster (postgres.yaml), its ObjectStore (objectstore.yaml)
# and its ScheduledBackup (scheduledbackup.yaml). The composite renders all three plus the
# ExternalSecret that brings this namespace's MinIO backup credentials in, so the central
# reflector allowlist stops being something you have to remember to edit.
#
# CREDENTIALS are unchanged: with no bootstrap.initdb.secret, CNPG still generates
# `homeassistant-postgres-app` itself with a random password, and deployment.yaml /
# configmap.yaml still read RECORDER_DB_URL from that secret's `uri` key. No plaintext
# password in git, and no 1Password item needed. (TALOS-mf91, epic TALOS-031k)
#
# Values reproduce the live Cluster exactly: three instances on 2Gi of local-path, the
# homeassistant database and owner, C collation, 50m/256Mi requests and the same 03:00
# backup slot. The live Cluster carries no user-set postgresql.conf parameters — its 23
# are all CNPG's own defaults — so none are set here.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: homeassistant-postgres
spec:
  database: homeassistant
  owner: homeassistant
  # Three copies on three nodes. local-path is WaitForFirstConsumer, so each PV pins to
  # the node that first mounts it and a single instance is stranded by a node loss.
  instances: 3
  storageSize: 2Gi
  storageClass: local-path
  # Pinned to the image the live cluster is already running. postgres.yaml never named an
  # image, so CNPG's defaulting webhook wrote 17.0 into the spec; naming it here means a
  # future change to the operator's default cannot quietly restart this database. Home
  # Assistant losing its recorder means physical devices stop responding.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  # 03:00 daily — the slot this cluster already had in the deliberately staggered fleet
  # (forgejo 02:00, authentik 02:15, crowdsec 02:30, linkwarden 02:45). Not a new time.
  backupSchedule: "0 0 3 * * *"
  encoding: UTF8
  localeCollate: C
  localeCType: C
  resources:
    requestsCpu: 50m
    requestsMemory: 256Mi
