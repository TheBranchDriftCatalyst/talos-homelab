---
# CloudNativePG Postgres for the Home Assistant recorder (TALOS-hx77.1 / TALOS-hx77).
# Replaces the raw postgres:15-alpine Deployment on NFS with a CNPG-managed cluster
# (repo standard: forgejo/plausible/crowdsec). HA recorder history is DISPOSABLE — it
# rebuilds on connect — so there is NO data migration: HA reconnects to a fresh DB on
# restart. The app reaches it via the CNPG homeassistant-postgres-rw service.
#
# CREDENTIALS (TALOS-mf91, epic TALOS-031k): the old pinned `homeassistant-postgres-app`
# Secret (password `homeassistant`, exposed on the PUBLIC repo) is GONE. With no
# bootstrap.initdb.secret, CNPG GENERATES the `homeassistant-postgres-app` secret itself
# with a random password — that generated secret is the rotation, and it needs NO 1Password
# item. HA reads the connection string from that secret's `uri` key (see deployment.yaml
# RECORDER_DB_URL + configmap.yaml !env_var), so no plaintext password lives in git.
# CNPG stamps `cnpg.io/cluster` on the generated secret automatically, so the Kyverno
# reflect-cnpg-app-secrets + dbgate-cnpg-connections policies pick HA up like every other
# CNPG cluster (the manual label/annotations the old pinned secret needed are unnecessary).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homeassistant-postgres
  labels:
    app.kubernetes.io/name: homeassistant-postgres
    app.kubernetes.io/part-of: home-automation
spec:
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imagePullPolicy: IfNotPresent
  storage:
    size: 2Gi
    storageClass: fatboy-nfs-appdata # interim node-independent storage; NVMe block later (TALOS-1ujn)
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  # Object-store backups → MinIO (TALOS-xgrl). Recorder history is technically
  # rebuildable, but WAL archiving + daily base backups (scheduledbackup.yaml)
  # make node/PVC loss a restore instead of a history wipe. Same stanza as
  # forgejo/linkwarden; creds via the reflected cnpg-minio-backup Secret.
  backup:
    retentionPolicy: "30d" # prune backups + WALs older than 30 days
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/homeassistant-postgres
      endpointURL: http://minio-hl.minio.svc:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
      # No `secret:` → CNPG generates homeassistant-postgres-app with a random password.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
