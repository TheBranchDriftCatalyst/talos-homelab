---
# Pinned app credentials for the HA recorder DB (TALOS-hx77.1). Pre-created so CNPG adopts
# it via bootstrap.initdb.secret instead of generating a random password — this lets the
# recorder db_url stay STATIC and declarative in configmap.yaml (no runtime templating, no
# init-container config munging). HA recorder data is disposable, so this throwaway
# credential living in git is acceptable; harden to ESO later if HA gains real use.
apiVersion: v1
kind: Secret
metadata:
  name: homeassistant-postgres-app
  labels:
    app.kubernetes.io/name: homeassistant-postgres
    app.kubernetes.io/part-of: home-automation
  annotations:
    # USER-PROVIDED secret (pinned password) → CNPG doesn't label it cnpg.io/cluster, so the
    # reflect-cnpg-app-secrets Kyverno policy skips it. Annotate directly so reflector still
    # mirrors it into `databases` for dbgate. (TALOS-7jxm)
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "databases"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "databases"
type: kubernetes.io/basic-auth
stringData:
  username: homeassistant
  password: homeassistant
---
# CloudNativePG Postgres for the Home Assistant recorder (TALOS-hx77.1 / TALOS-hx77).
# Replaces the raw postgres:15-alpine Deployment on NFS with a CNPG-managed cluster
# (repo standard: forgejo/plausible/crowdsec). HA recorder history is DISPOSABLE — it
# rebuilds on connect — so there is NO data migration: HA reconnects to a fresh DB on
# restart. The app reaches it via the CNPG homeassistant-postgres-rw service; creds are
# pinned by the secret above so configmap.yaml can hold a static db_url.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homeassistant-postgres
  labels:
    app.kubernetes.io/name: homeassistant-postgres
    app.kubernetes.io/part-of: home-automation
spec:
  # (reflection handled by annotating the pre-created -app secret above, since inheritedMetadata
  # doesn't apply to a user-provided bootstrap secret. TALOS-7jxm)
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imagePullPolicy: IfNotPresent
  storage:
    size: 2Gi
    storageClass: fatboy-nfs-appdata # interim node-independent storage; NVMe block later (TALOS-1ujn)
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
      secret:
        name: homeassistant-postgres-app # pinned creds (above); CNPG won't randomize
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
