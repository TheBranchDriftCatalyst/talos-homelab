---
# Home Assistant - Smart Home Automation Platform
# TODO: Add Bluetooth USB passthrough (TALOS-xxxx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  labels:
    app: homeassistant
    app.kubernetes.io/name: homeassistant
    app.kubernetes.io/part-of: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        app.kubernetes.io/name: homeassistant
      annotations:
        # Velero backup
        backup.velero.io/backup-volumes: "config"
    spec:
      # Host network for mDNS discovery and integrations
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Init container to set up base configuration if not exists
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # First-run seed only: copy the base config if none exists yet. The full
              # configuration (incl. the recorder db_url pointing at CNPG) is declarative
              # in the homeassistant-config ConfigMap — nothing is rewritten at runtime.
              if [ ! -f /config/configuration.yaml ]; then
                cp /config-base/configuration.yaml /config/configuration.yaml
              fi
              # !include targets must exist for HA to boot
              touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
              mkdir -p /config/themes
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-base
              mountPath: /config-base

      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: "America/Los_Angeles"
            # Recorder DB connection string from the CNPG-generated
            # homeassistant-postgres-app secret (`uri` key). configuration.yaml
            # references this via `db_url: !env_var RECORDER_DB_URL` — keeps the
            # postgres password out of git. (TALOS-mf91 / epic TALOS-031k)
            - name: RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: homeassistant-postgres-app
                  key: uri

          ports:
            - name: http
              containerPort: 8123
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /config
            # TODO: Uncomment for Bluetooth dongle support (TALOS-xxxx)
            # - name: usb
            #   mountPath: /dev/bus/usb
            # - name: dbus
            #   mountPath: /run/dbus
            #   readOnly: true

          # Liveness probe — previously very generous (180s init, 60s period,
          # failureThreshold 10) to work around SQLite-on-NFS SIGBUS crashes.
          # Root cause fixed: recorder now uses PostgreSQL (see postgres.yaml).
          # Keeping moderately generous timings for HA startup + NFS config reads.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 4

          resources:
            requests:
              cpu: 100m
              memory: 512Mi

        # Matter Server sidecar for Matter/Thread device support
        - name: matter-server
          image: ghcr.io/home-assistant-libs/python-matter-server:stable
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true  # Required for Matter commissioning
          env:
            - name: TZ
              value: "America/Los_Angeles"
          ports:
            - name: matter-ws
              containerPort: 5580
              protocol: TCP
          volumeMounts:
            - name: matter-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config-nfs
        - name: config-base
          configMap:
            name: homeassistant-config
        - name: matter-data
          persistentVolumeClaim:
            claimName: matter-server-data-nfs
        # TODO: Uncomment for Bluetooth dongle support (TALOS-xxxx)
        # - name: usb
        #   hostPath:
        #     path: /dev/bus/usb
        #     type: Directory
        # - name: dbus
        #   hostPath:
        #     path: /run/dbus
        #     type: Directory
