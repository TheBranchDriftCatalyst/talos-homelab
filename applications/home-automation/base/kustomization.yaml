apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-automation

# The talos00-wildcard-tls TLS secret is reflected into this namespace by
# emberstack/reflector from the traefik-namespace Certificate:
#   infrastructure/base/cert-manager-issuers/talos00-wildcard-certificate.yaml
# (the former duplicate Certificate here was removed).

resources:
  - homeassistant/
  - linkwarden/
  - omnitools/
  # litellm and openclaw moved to catalyst-llm namespace

labels:
  - pairs:
      app.kubernetes.io/part-of: home-automation

# Apply revisionHistoryLimit: 3 to all Deployments
patches:
  - target:
      kind: Deployment
    patch: |
      - op: add
        path: /spec/revisionHistoryLimit
        value: 3
