---
# ExternalSecret to fetch Linkwarden credentials from 1Password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: linkwarden-secrets
  labels:
    app: linkwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: linkwarden-secrets
    creationPolicy: Owner
    template:
      data:
        nextauth-secret: "{{ .nextauthSecret }}"
        meili-master-key: "{{ .meiliMasterKey }}"
        # DB creds REMOVED (TALOS-3eui): postgres-password + database-url are gone —
        # the DB now comes from the CNPG-generated linkwarden-postgres-app secret
        # (`uri` key), so no Postgres password lives in 1Password or git anymore.
        # This ExternalSecret is retained ONLY for the non-DB app secrets below.
        # Authentik SSO credentials
        authentik-client-id: "{{ .authentikClientId }}"
        authentik-client-secret: "{{ .authentikClientSecret }}"
  data:
    - secretKey: nextauthSecret
      remoteRef:
        key: linkwarden
        property: nextauth-secret
    - secretKey: meiliMasterKey
      remoteRef:
        key: linkwarden
        property: meili-master-key
    - secretKey: authentikClientId
      remoteRef:
        key: linkwarden
        property: authentik-client-id
    - secretKey: authentikClientSecret
      remoteRef:
        key: linkwarden
        property: authentik-client-secret
