---
# CloudNativePG Postgres for Linkwarden (TALOS-3eui, epic TALOS-031k).
# Replaces the in-pod `postgres:16-alpine` co-pod container (plaintext creds in a
# 1Password-templated DATABASE_URL, DB on NFS) with a CNPG-managed cluster — the
# repo standard (forgejo / home-assistant / zipline / crowdsec / plausible). CNPG
# creates:
#   - a 'linkwarden' database owned by role 'linkwarden'
#   - Secret 'linkwarden-postgres-app' (username/password/dbname/host/port/uri)
#   - Service 'linkwarden-postgres-rw' (read-write endpoint)
# Linkwarden (Prisma) reads its whole connection string from that secret's `uri`
# key (see deployment.yaml DATABASE_URL) — no plaintext password lives in git and
# NO 1Password item is needed for the DB (CNPG-native, like the HA/zipline work).
# CNPG stamps `cnpg.io/cluster` on the generated secret, so the global Kyverno
# reflect-cnpg-app-secrets + dbgate-cnpg-connections policies pick Linkwarden up
# like every other CNPG cluster.
#
# DATA IS NOT DISPOSABLE: unlike HA (recorder history) and zipline (self-rebuilding
# Prisma DB), Linkwarden's Postgres holds the user's BOOKMARKS / collections / tags.
# This DB MUST be migrated via pg_dump/pg_restore BEFORE cutover — see the
# DATA-MIGRATION RUNBOOK in this directory's README / the TALOS-3eui bead. The old
# co-pod `linkwarden-postgres` PVC is retired only AFTER the bookmarks are verified
# present in the new cluster.
#
# NAMING: cluster name `linkwarden-postgres` matches the fleet convention
# (forgejo-postgres, zipline-postgres, homeassistant-postgres). It does NOT collide
# with the retiring bare PVC also named `linkwarden-postgres`: CNPG names its own
# PVCs `linkwarden-postgres-1` (`-N` per instance), a distinct object. The two
# coexist during the migration window; the bare PVC is deleted after verification.
#
# INSTANCES: single (1). The fleet runs 3 for HA-critical DBs, but Linkwarden is a
# minor single-user bookmark manager (~10 MB DB) — one instance is sufficient and
# saves the NFS footprint. Bump to 3 later if it earns HA. (matches zipline)
#
# PG MAJOR: no `imageName:` pin — inherits the operator default (currently
# ghcr.io/cloudnative-pg/postgresql:17.0), exactly like the rest of the fleet,
# keeping every cluster on one PG major without a hardcoded floating tag. The
# SOURCE co-pod is PG 16.11; the target is PG 17. This is a MAJOR-version jump, but
# it is done as a logical pg_dump (custom format) → pg_restore, which restores
# forward across majors cleanly — NOT a binary/pg_upgrade in place. See runbook.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkwarden-postgres
  labels:
    app.kubernetes.io/name: linkwarden-postgres
    app.kubernetes.io/part-of: home-automation
spec:
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  instances: 1
  imagePullPolicy: IfNotPresent
  storage:
    size: 5Gi # ≥ the retiring 5Gi co-pod PVC; live DB is only ~10 MB so ample headroom
    storageClass: fatboy-nfs-appdata # interim node-independent storage; NVMe block later (TALOS-1ujn)
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  bootstrap:
    initdb:
      database: linkwarden
      owner: linkwarden
      # No `secret:` → CNPG generates linkwarden-postgres-app with a random password.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  # Object-store backups (TALOS-xgrl.4): bookmarks are NOT disposable → PITR.
  # Config lives in the ObjectStore CR (objectstore.yaml) — migrated off the
  # in-tree barmanObjectStore (removed in CNPG 1.30) to the barman-cloud CNPG-I
  # plugin. Same bucket/prefix/creds; base backups: scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: linkwarden-postgres
