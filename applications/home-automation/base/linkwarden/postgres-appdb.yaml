---
# Linkwarden's Postgres, as a CatalystCNPGAppDB.
#
# Replaces the hand-written Cluster (postgres.yaml), its ObjectStore (objectstore.yaml)
# and its ScheduledBackup (scheduledbackup.yaml). The composite renders all three plus the
# ExternalSecret that brings this namespace's MinIO backup credentials in.
#
# DATA IS NOT DISPOSABLE here. Unlike the Home Assistant recorder next door, this holds the
# user's bookmarks, collections and tags — the reason the type refuses to make backups
# optional. It was migrated in from a co-pod postgres:16-alpine on NFS by pg_dump/
# pg_restore (MIGRATION-RUNBOOK.md, TALOS-3eui); the composite adopts that same cluster,
# it does not create a new one.
#
# CREDENTIALS are unchanged: with no bootstrap.initdb.secret, CNPG still generates
# `linkwarden-postgres-app` with a random password, and deployment.yaml still reads the
# whole DATABASE_URL from its `uri` key. No plaintext password in git, no 1Password item.
#
# Values reproduce the live Cluster exactly: three instances on 5Gi of local-path, the
# linkwarden database and owner, C collation, 50m/256Mi requests and the same 02:45 backup
# slot. The live Cluster carries no user-set postgresql.conf parameters — its 23 are all
# CNPG's own defaults — so none are set here.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: linkwarden-postgres
spec:
  database: linkwarden
  owner: linkwarden
  # Three copies on three nodes. local-path is WaitForFirstConsumer, so each PV pins to
  # the node that first mounts it and a single instance is stranded by a node loss. The
  # old comment here still said "single (1)" long after it had been raised to 3.
  instances: 3
  # 5Gi, matching the retired co-pod PVC. The live database is only ~10 MB.
  storageSize: 5Gi
  storageClass: local-path
  # Pinned to the image the live cluster is already running. postgres.yaml deliberately
  # named no image so it would follow the operator default, and CNPG's defaulting webhook
  # duly wrote 17.0 into the spec. Naming it here means a later change to that default
  # cannot restart the database holding the bookmarks without someone deciding to.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  # 02:45 daily — the slot this cluster already had in the deliberately staggered fleet
  # (forgejo 02:00, authentik 02:15, crowdsec 02:30, homeassistant 03:00). Not a new time.
  backupSchedule: "0 45 2 * * *"
  encoding: UTF8
  localeCollate: C
  localeCType: C
  resources:
    requestsCpu: 50m
    requestsMemory: 256Mi
