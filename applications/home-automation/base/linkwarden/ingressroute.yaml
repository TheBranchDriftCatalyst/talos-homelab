---
# Local access (HTTPS) — linkwarden.talos00. Split into a websecure (TLS) router
# carrying the catalyst navbar and a web router that 301s to HTTPS (TALOS-wyxh).
# The themepark nav-sweep had left this on the `web` entrypoint ONLY, so the nav
# served over plaintext but browsers (HTTPS) got a 404. Two SEPARATE IngressRoute
# objects (Kyverno ingressroute-no-combined-entrypoints). No `tls:` stanza —
# Kyverno ingressroute-tls-default injects it (*.talos00 wildcard via SNI).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden-local
  labels:
    app: linkwarden
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Linkwarden"
    gethomepage.dev/description: "Bookmark & link archive"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/icon: "linkwarden.png"
    gethomepage.dev/siteMonitor: "http://linkwarden.home-automation.svc.cluster.local:3000"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`linkwarden.talos00`)
      # Consolidated catalyst navbar. Last in the chain so auth runs first and the
      # body injector only ever rewrites an already-authorised response.
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: linkwarden
          namespace: home-automation
          port: 3000
---
# HTTP→HTTPS redirect for linkwarden.talos00 (LAN surface).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden-local-http
  labels:
    app: linkwarden
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`linkwarden.talos00`)
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: redirect-https
          namespace: traefik
      services:
        - name: linkwarden
          namespace: home-automation
          port: 3000
---
# External access (HTTPS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden
  labels:
    app: linkwarden
  annotations:
    external-dns.alpha.kubernetes.io/hostname: linkwarden.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`linkwarden.knowledgedump.space`)
      middlewares:
        # LLM-scraper UAs get PROXY'd to the iocaine tarpit; real users pass. (TALOS-mko)
        - name: bot-wrangler
          namespace: traefik
      services:
        - name: linkwarden
          namespace: home-automation
          port: 3000
---
# HTTP to HTTPS redirect for external domain
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden-http-redirect
  labels:
    app: linkwarden
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`linkwarden.knowledgedump.space`)
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: linkwarden
          namespace: home-automation
          port: 3000
