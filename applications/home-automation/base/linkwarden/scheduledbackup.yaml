---
# Daily base backup for linkwarden-postgres → cnpg-backups (TALOS-xgrl.4).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: linkwarden-postgres-daily
  namespace: home-automation
spec:
  schedule: "0 45 2 * * *" # 02:45 daily (6-field: sec min hour dom mon dow)
  immediate: true
  backupOwnerReference: self
  # barman-cloud CNPG-I plugin (see objectstore.yaml) — in-tree method removed in CNPG 1.30
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: linkwarden-postgres
