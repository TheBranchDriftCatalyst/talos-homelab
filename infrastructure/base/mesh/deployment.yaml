---
# Headscale control plane (TALOS-iymy). Single Go binary; RWO PVC => Recreate,
# one replica. Non-root (fsGroup owns the PVC + socket dir). Config change =>
# `kubectl -n mesh rollout restart deploy/headscale` (subPath mounts don't hot-reload).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: mesh
  labels:
    app.kubernetes.io/name: headscale
    app.kubernetes.io/component: mesh-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:0.29.4
          command: ["headscale"]
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
            - {name: grpc, containerPort: 50443}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/headscale/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: config, mountPath: /etc/headscale/acl.hujson, subPath: acl.hujson, readOnly: true}
            - {name: data, mountPath: /var/lib/headscale}
            - {name: run, mountPath: /var/run/headscale}
      volumes:
        - {name: config, configMap: {name: headscale-config}}
        - {name: data, persistentVolumeClaim: {claimName: headscale-data}}
        - {name: run, emptyDir: {}}
