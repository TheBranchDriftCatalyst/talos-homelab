---
# Public HTTPS control-plane endpoint: headscale.knowledgedump.space.
# The off-net GPU box (AWS us-east-2) dials this to join the mesh, so it MUST be
# WAN-reachable. DNS-only (cloudflare-proxied=false): headscale's map endpoint is a
# long-poll; Cloudflare's proxy would cap/interrupt it (same rationale as the
# registry). Traefik terminates TLS with the *.knowledgedump.space wildcard cert
# (covers this single-label host). Only this control endpoint is public — the GPU
# services themselves stay mesh-only, never exposed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale-public
  namespace: mesh
  annotations:
    external-dns.alpha.kubernetes.io/hostname: headscale.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headscale.knowledgedump.space`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale-public-http
  namespace: mesh
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headscale.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: headscale
          port: 8080
---
# Internal route for in-cluster/LAN CLI + status: headscale.talos00 (HTTP).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale-internal
  namespace: mesh
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headscale.talos00`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
