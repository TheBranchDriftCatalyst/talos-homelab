---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: mesh
  labels:
    app.kubernetes.io/name: headscale
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headscale
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
    - {name: grpc, port: 50443, targetPort: grpc}
