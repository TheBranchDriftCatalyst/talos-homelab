---
# Headscale state: sqlite db + noise/derp private keys. Tiny + must persist
# (losing it re-keys the control plane and every node must re-join). local-path,
# RWO, single replica (Recreate).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: headscale-data
  namespace: mesh
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
