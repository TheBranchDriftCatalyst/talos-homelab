# Ad-hoc CANARY for the Velero DR test — NOT deployed by Flux (applied/deleted by the test only).
#
# A throwaway namespace + PVC + a tiny busybox pod that mounts it. The destructive DR round-trip
# (write known data → velero backup → DELETE the whole namespace → velero restore → verify sha256)
# runs against THIS canary, so it can never touch a real app's data. The namespace name is unique
# to the test and gets torn down in afterAll regardless of pass/fail.
#
# The pod carries `backup.velero.io/backup-volumes: data` so Velero's opt-in Kopia fs-backup picks
# up the PVC exactly the way the production `daily-all` schedule discovers volumes (annotation-
# driven) — the DR test therefore exercises the ACTUAL backup path, not a weaker stand-in. The
# Backup CR the test creates also sets defaultVolumesToFsBackup:true as a belt-and-suspenders.
---
apiVersion: v1
kind: Namespace
metadata:
  name: velero-dr-canary
  labels:
    app.kubernetes.io/component: dr-canary
    velero-dr.talos00/throwaway: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canary-data
  namespace: velero-dr-canary
  labels:
    app: velero-canary
spec:
  accessModes: ["ReadWriteOnce"]
  # local-path is the cluster default; local-path-provisioner has no CSI snapshots, so this
  # PVC can ONLY be protected by Kopia fs-backup — exactly what we want to validate.
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero-canary
  namespace: velero-dr-canary
  labels:
    app: velero-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velero-canary
  strategy:
    type: Recreate # single RWO PVC — never two pods contending for the mount
  template:
    metadata:
      labels:
        app: velero-canary
      annotations:
        # opt-in fs-backup: mirrors the production annotation-driven `daily-all` schedule
        backup.velero.io/backup-volumes: data
    spec:
      terminationGracePeriodSeconds: 3
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "sleep 100000"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: canary-data
