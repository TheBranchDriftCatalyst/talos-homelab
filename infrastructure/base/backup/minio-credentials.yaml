---
# MinIO S3 credentials for backup operations (TALOS-tmqq).
# Consumed by: authentik-postgres-backup CronJob (ACCESS_KEY_ID / ACCESS_SECRET_KEY).
#
# De-hardcoded: was a plain Secret with the former public MinIO root literal. Now
# sourced from the 1Password `minio` item (root-user / root-password) via ESO,
# the SAME two fields every other S3 consumer reads. Rotating those two fields
# in 1Password rotates this secret on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-backup-credentials
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: minio-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        ACCESS_KEY_ID: '{{ .rootUser }}'
        ACCESS_SECRET_KEY: '{{ .rootPassword }}'
  data:
    - secretKey: rootUser
      remoteRef: {key: minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: minio, property: root-password}
