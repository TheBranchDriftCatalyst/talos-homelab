---
# Velero S3 credentials (TALOS-tmqq). Velero's AWS plugin reads an INI-format
# `cloud` key (referenced by the BackupStorageLocation `credential`). We template
# that whole INI blob from the 1Password `minio` item (root-user / root-password)
# so no root credential literal lives in git. velero.yaml sets
# credentials.existingSecret=velero-s3-credentials, so the chart mounts THIS
# ESO-owned Secret instead of generating one from inline secretContents.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .rootUser }}
          aws_secret_access_key={{ .rootPassword }}
  data:
    - secretKey: rootUser
      remoteRef: {key: minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: minio, property: root-password}
