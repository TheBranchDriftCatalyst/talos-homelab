---
# Pull secret for Zot (registry.talos00) in ns `minio`.
#
# WHY THIS EXISTS, and why it had to land BEFORE anything else.
#
# MEASURED 2026-11-15: MinIO retired free community container distribution in
# favour of paid AIStor (around 2026-09-28). The consequences are permanent,
# not a transient registry glitch:
#   docker.io/minio/minio                      -> repo removed / gated
#   quay.io/minio/minio:RELEASE.2024-11-07...  -> 401 UNAUTHORIZED
#   https://dl.min.io/.../minio (raw binary)   -> 410 GONE
#
# The Tenant's running image is therefore UNOBTAINABLE. `talosctl image ls`
# found it cached on exactly ONE node, and 23 CNPG ObjectStores archive WAL to
# this MinIO — so losing that node is a fleet-wide database outage, not a
# storage inconvenience. See TALOS-d9pm.
#
# Every remedy (mirror into Zot, repoint the Tenant, migrate) needs an image
# pulled from registry.talos00, and Zot has NO anonymousPolicy — its
# defaultPolicy ["read"] applies to authenticated identities only, so anonymous
# manifest GETs return 401. Talos carries no node-level registry credentials
# either; the cluster-baseline patch is mirror-only. So a namespaced pull
# secret is the ONLY path, and its absence is what blocks everything.
#
# This is the THIRD time the gate documented in
# infrastructure/base/catalyst-nav/operator/pull-secret.yaml has bitten: a
# Secret is namespaced, nothing mirrors this one, and the omission is invisible
# until a pod sits in ImagePullBackOff with "no basic auth credentials".
#
# Additive and inert on its own: creating it changes nothing running. It makes
# the fix possible rather than performing it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.talos00": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: {key: nexus-admin, property: username}
    - secretKey: password
      remoteRef: {key: nexus-admin, property: password}
