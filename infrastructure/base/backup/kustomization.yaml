apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backup

resources:
  - namespace.yaml
  - minio-credentials.yaml
  # velero-s3-credentials (root) retired → scoped velero-s3-scoped from minio/scoped-users (TALOS-xgrl.12)
  - velero.yaml
  - loki-backup-exclude.yaml
  # authentik-postgres-backup.yaml retired 2026-08-12 — authentik postgres is
  # CNPG now; barmanObjectStore WAL + ScheduledBackup own its backups. CNPG
  # pods/PVCs are velero-excluded via inheritedMetadata (see each Cluster).
  - etcd-backup.yaml
  - prometheusrule.yaml
  - velero-prometheusrule.yaml
