---
# GrafanaDashboard for CatalystCNPGAppDB — OWNED by the composition, not the central
# grafana-dashboards tree. Adoption + drying-up candidates for this composition:
# composites, managed CNPG clusters, look-alike CNPG clusters (composition label absent),
# and lines of YAML dried up. Fed by the KSM CustomResourceState metrics
# (catalyst_composite_info / catalyst_managed_resource_info / catalyst_composite_replaced_loc).
# Lands in the shared 'compositions' Grafana folder via folderRef. (TALOS-l2sm.11)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: compositions-catalyst-cnpg-appdb
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: compositions
spec:
  folderRef: compositions
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-compositions-catalyst-cnpg-appdb
    key: dashboard.json
