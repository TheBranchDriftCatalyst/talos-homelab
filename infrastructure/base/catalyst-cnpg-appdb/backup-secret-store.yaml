---
# A ClusterSecretStore that reads the generated MinIO backup credentials at their source,
# so every CatalystCNPGAppDB can materialise them in its own namespace without anyone
# editing a central list.
#
# THE PROBLEM THIS REPLACES. minio/cnpg-minio-backup was fanned out by emberstack/reflector
# via an explicit allowlist annotation naming every namespace that runs a database. That
# list is a "remember to also edit this" step, and forgetting it fails LATE and quietly:
# the CatalystCNPGAppDB reconciles green, the Cluster comes up healthy, and only the first
# backup fails —
#   while getting secret cnpg-minio-backup: secrets "cnpg-minio-backup" not found
# which is exactly what the throwaway POC in cnpg-poc did.
#
# WHY NOT JUST GENERATE A PASSWORD PER NAMESPACE. Because the secret is not fetched from
# 1Password, it is GENERATED by an ESO Password generator and then asserted onto a real
# MinIO user by the hourly cnpg-backup-minio-provision CronJob. A per-namespace generator
# would mint a DIFFERENT password in every namespace and none of them would match the MinIO
# user, so every backup would fail with SignatureDoesNotMatch. There is exactly one correct
# value and it lives in minio/cnpg-minio-backup; this store reads THAT.
#
# It also removes a live foot-gun. Editing the reflector allowlist re-syncs the
# ExternalSecret, which RE-RUNS the Password generator and mints a new value fleet-wide —
# the file carrying that list warns about it explicitly. Adding a namespace should not be
# able to rotate every database's backup credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-backup-source
spec:
  provider:
    kubernetes:
      remoteNamespace: minio
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: minio
      auth:
        serviceAccount:
          name: cnpg-backup-reader
          namespace: minio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup-reader
  namespace: minio
---
# Deliberately narrow: this identity can read ONE secret in ONE namespace. resourceNames
# matters — the minio namespace also holds the MinIO root credentials, and a blanket
# secrets-read here would hand every AppDB namespace the keys to the whole object store.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-backup-reader
  namespace: minio
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cnpg-minio-backup]
    verbs: [get]
  - apiGroups: ["authorization.k8s.io"]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-backup-reader
  namespace: minio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-backup-reader
subjects:
  - kind: ServiceAccount
    name: cnpg-backup-reader
    namespace: minio
