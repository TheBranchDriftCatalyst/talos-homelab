---
# GPUProfile — the DECLARATIVE SPEC for the ephemeral GPU (TALOS-t3ic).
#
# This is the git-owned half of the split. Everything describing WHAT the machine and its
# cache are lives here and is reviewed like any manifest; gpu-broker reads it and stamps
# out the XGPUCache / XGPUInstance XRs when demand appears.
#
# Why the XRs themselves are NOT in git: TALOS-455u documents three zombie modes —
# instance self-terminates -> Crossplane resurrects it; XR deleted -> Flux reapplies it;
# running:false patched -> Flux reverts it. Flux never asserting XR *existence* kills all
# three. Same principle as keeping replicas out of git when an HPA owns them: the spec is
# declarative, the count is not.
#
# A ConfigMap rather than a CRD for v1 — no operator needs to validate it yet, and this
# keeps the broker dependency-free. Promote to a real CRD if it grows fields that need
# schema validation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-profile
  namespace: gpu-inference
  labels:
    app.kubernetes.io/part-of: gpu-inference
data:
  # ---- machine (rendered into XGPUInstance) --------------------------------
  instanceName: "ollama-gpu"
  # g5.xlarge = A10G 24GB, fits 7-8B comfortably. g6e.xlarge = L40S 48GB for 32B quant.
  instanceType: "g5.xlarge"
  # SPACE-separated s3 prefixes under modelsBucket (the XRD takes a string, not a list —
  # patch-and-transform cannot fmt-join arrays).
  models: "llama-3.1-8b"
  modelsBucket: "catalyst-tbdc-models"
  servePort: "8000"
  region: "us-west-2"
  # MUST match the subnet's AZ, per the XRD.
  availabilityZone: "us-west-2a"
  vpcId: "vpc-REPLACE-ME"        # EPIC A5 — blocked on the creds gate (TALOS-3g8f)
  subnetId: "subnet-REPLACE-ME"  # EPIC A5

  # ---- cache (rendered into XGPUCache) -------------------------------------
  # Sized for the models under test, NOT the whole library. The library lives in S3.
  cacheVolumeGb: "200"

  # ---- lifecycle -----------------------------------------------------------
  # Tier 1: no traffic for this long -> delete the INSTANCE, keep the cache warm.
  # Must exceed the cold start (2-5 min) by a wide margin or we thrash expensively.
  # Mirrors HTTPScaledObject.scaledownPeriod — keep the two in step.
  instanceIdleTimeout: "30m"
  # Tier 2: no instance for this long -> delete the CACHE too (WARM -> COLD).
  # Next wake then re-syncs weights from S3 (+10-40s).
  cacheTtl: "72h"
  # Hard ceiling regardless of traffic — the backstop against a stuck broker billing
  # forever. The reaper enforces this even if idle detection fails entirely.
  maxInstanceLifetime: "12h"
