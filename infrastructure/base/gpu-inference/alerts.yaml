---
# Cost + liveness alerts for the ephemeral GPU (TALOS-7p3v).
#
# WHY THESE MATTER MORE THAN USUAL: neither GPU XR is committed to git, so there is no
# git diff that tells you a GPU is running. `kubectl get xgpuinstance` and these alerts
# are the only signal that money is being spent.
#
# GROUNDING NOTE: alerts here are built on metrics that EXIST TODAY (kube-state-metrics +
# KEDA operator metrics, both confirmed scraped). Alerting directly on XGPUInstance
# existence would need either kube-state-metrics CustomResourceStateMetrics config or the
# broker exporting its own metric -- neither exists yet, so gateway replicas is used as
# the proxy for "a GPU should be running". Tighten this once the broker exports
# gpu_broker_instance_exists.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-inference-alerts
  namespace: gpu-inference
  labels:
    app.kubernetes.io/part-of: gpu-inference
    prometheus: kube-prometheus
spec:
  groups:
    - name: gpu-inference.cost
      rules:
        # The headline cost alarm, re-keyed off the relay (2026-10-01). It used to watch
        # ollama-gateway's replica count, but that Deployment is deleted and the metric
        # would simply never fire again -- a silently dead alert, which is worse than none.
        #
        # This is a BETTER signal than the one it replaces. gpu-relay only reports
        # Available when its readiness probe GETs /health successfully THROUGH the tunnel,
        # so "available" means vLLM is genuinely answering -- i.e. a GPU is up and
        # billing. The old alert fired on what KEDA INTENDED, this one on what is true.
        #
        # Rates are per-rig and current as of 2026-10-01: ~$2.24/hr for the 1x L40S,
        # ~$5.17/hr spot for the 4x. 4h is therefore ~$9-21, not the ~$0.64 the previous
        # text claimed from a stale $0.16/hr figure.
        - alert: GPUBoxServingTooLong
          expr: |
            kube_deployment_status_replicas_available{namespace="gpu-inference",deployment="gpu-relay"} > 0
          for: 4h
          labels:
            severity: warning
          annotations:
            summary: "A GPU rig has been serving for 4h (~$9-21 depending on shape)"
            description: >-
              gpu-relay has been Available for 4 hours, and it is only Available when vLLM
              answers /health through the tunnel -- so an AWS GPU box is up and billing.
              Either use is genuinely sustained, or a teardown was forgotten.
              Check: kubectl get xgpuinstance -o wide; and remember git-off is the real
              teardown -- the 6h reaper CHURNS a box rather than removing it while the
              claim is uncommented in aws/apps/kustomization.yaml.

        # If the reaper stops running, the cost backstop is gone and nobody would know.
        - alert: GPUReaperNotRunning
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="gpu-inference",cronjob="gpu-instance-reaper"} > 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "GPU instance reaper has not succeeded in over an hour"
            description: >-
              The tier-1 reaper is the only thing standing between a wedged gpu-broker and
              an unbounded AWS bill. If it is not running, treat a live GPU as unattended:
              verify with kubectl get xgpuinstance and delete manually if present.

        - alert: GPUReaperFailing
          expr: kube_job_failed{namespace="gpu-inference"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A gpu-inference reaper Job is failing"
            description: "kubectl logs -n gpu-inference job/{{ $labels.job_name }}"

    # ── GROUP REMOVED (2026-10-01): gpu-inference.availability ──────────────
    # Its only rule was GPUGatewayStuckNotReady, watching
    # kube_deployment_status_replicas_unavailable for ollama-gateway — a Deployment that
    # no longer exists, so the alert was already silently dead and would never have
    # fired again.
    #
    # It is NOT re-keyed onto gpu-relay, deliberately. The relay is NotReady whenever no
    # rig is running, which is the intended resting state, so the same expression would
    # fire continuously and get muted — strictly worse than having no alert.
    #
    # Making it real needs a signal for "a rig is SUPPOSED to be up", which is not a
    # metric today: XGPUInstance is a custom resource, and kube-state-metrics only
    # exposes CRs when its custom-resource-state config is set up. Add that, then the
    # alert becomes expressible as
    #     gpu-relay NotReady AND an XGPUInstance exists, for > 12m
    # which is the question actually worth paging on. Tracked with the demand-plane work
    # (TALOS-x1sb and onward).
    #
    # The GROUP is dropped rather than left with an empty rules: list — a group with
    # rules: null fails the PrometheusRule schema ("must be of type array"), which Flux
    # catches only on SERVER-side dry-run, not by client-side validation.
