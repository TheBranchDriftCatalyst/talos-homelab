---
# TIER 1 REAPER — kills a running GPU instance. THE COST BACKSTOP.
#
# Deliberately INDEPENDENT of any demand plane. Because no GPU XR is committed to git,
# an instance left running has nothing watching it: a rig bills $2.24-10.49/hr depending
# on the shape the fleet placed, so "never bill forever" has to hold on its own.
#
# ONE trigger: the instance is older than maxInstanceLifetime -> reap, regardless of
# traffic. There used to be a second — "the gateway is at 0 replicas, so there is no
# demand" — but ollama-gateway was DELETED (see kustomization.yaml), and its read sat
# under `set -eu`, so every run exited non-zero: the Job failed, backoffLimit was
# exhausted, GPUReaperFailing fired, and GPUReaperNotRunning followed at severity
# critical an hour later. Arming a rig turned on two pages AND left the backstop dead.
# A demand-based trigger is unimplementable until a demand plane exists (TALOS-rzjx /
# TALOS-5mfc); restating it here only kept a dead branch alive.
#
# Deleting the XGPUInstance leaves the XGPUCache alone: WARM tier, ~$16/mo, ~2min wake.
# The cache is tier 2's problem (reaper-cache-cronjob.yaml).
#
# Runs every 10 min. Note this is coarser than instanceIdleTimeout by design — the broker
# owns responsive scale-down, this owns "never bill forever".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-instance-reaper
  namespace: gpu-inference
  labels:
    app.kubernetes.io/part-of: gpu-inference
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: gpu-broker
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: alpine/k8s:1.34.9
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # Guard on the RESOURCE, not the CRD object. broker-rbac.yaml's
                  # ClusterRole grants only apiGroups ["aws.catalyst.io"] — there is no
                  # apiextensions.k8s.io rule at all — so `kubectl get crd` is FORBIDDEN,
                  # exits non-zero, and `! ...` reads that as "CRD absent". This reaper
                  # therefore exited 0 claiming "nothing to reap" UNCONDITIONALLY, forever,
                  # while a GPU billed. Worse than the gateway bug: it failed silently AND
                  # successfully, so neither GPUReaperFailing nor GPUReaperNotRunning ever
                  # fired. Both alerts stayed green over a dead backstop. Same fix and same
                  # reasoning as aws/apps/gpu-testrig-reaper.yaml.
                  kubectl get xgpuinstance >/dev/null 2>&1 \
                    || { echo "no XGPUInstance CRD / no access - nothing to reap"; exit 0; }

                  MAX=$(kubectl get cm gpu-profile -n gpu-inference \
                        -o jsonpath='{.data.maxInstanceLifetime}')
                  echo "maxInstanceLifetime=${MAX}"

                  NAMES=$(kubectl get xgpuinstances \
                          -l app.kubernetes.io/part-of=gpu-inference \
                          -o jsonpath='{.items[*].metadata.name}')
                  if [ -z "${NAMES}" ]; then
                    echo "no XGPUInstance present - nothing to reap"
                    exit 0
                  fi

                  for N in ${NAMES}; do
                    AGE_TS=$(kubectl get xgpuinstance "${N}" \
                             -o jsonpath='{.metadata.creationTimestamp}')
                    AGE_S=$(( $(date -u +%s) - $(date -u -d "${AGE_TS}" +%s) ))
                    MAX_S=$(echo "${MAX}" | sed 's/h/*3600/;s/m/*60/;s/s//' | awk '{print}' | bc)

                    if [ "${AGE_S}" -gt "${MAX_S}" ]; then
                      echo "REAP ${N}: age ${AGE_S}s exceeds maxInstanceLifetime ${MAX_S}s"
                      kubectl delete xgpuinstance "${N}"
                    else
                      echo "KEEP ${N}: age ${AGE_S}s of ${MAX_S}s"
                    fi
                  done
