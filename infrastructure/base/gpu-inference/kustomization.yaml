---
# Ephemeral GPU inference — the demand plane (TALOS-t3ic / EPIC C + D).
#
# INERT BY DESIGN until the AWS chain opens (EPIC A, blocked on TALOS-3g8f):
#   * ollama-gateway   replicas 0
#   * gpu-broker       replicas 0 and image not yet built
#   * both reapers     exit 0 cleanly while the XR CRDs are absent
# So applying this creates NO AWS spend. Scaling gpu-broker to 1 is the single switch
# that arms real billing -- do not flip it before the reapers are verified.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gpu-inference

resources:
  - namespace.yaml
  - gpuprofile.yaml            # lifecycle TTLs only (TALOS-tt48)
  - gpu-service.yaml           # gpu-backend, now SELECTS the gpu-relay Pod
  # ── OFF ── LEVEL 2 reachability hop (TALOS-x1sb). THIS LINE IS THE ON-SWITCH.
  # The Pod holding the SSM tunnel, so the Mac stops being the transport. Arming it
  # needs gpu-inference/gpu-relay-creds to exist, which means first uncommenting
  # gpu-relay-user.yaml in ../aws/apps/kustomization.yaml and letting Crossplane mint
  # the key. Without that secret the Pod sits in CreateContainerConfigError.
  # Harmless to arm with no rig running: the tunnel loop just reports no instance and
  # the Pod stays Running-but-NotReady.
  # - relay-deployment.yaml
  - gateway-deployment.yaml    # readiness gated on the GPU backend
  - gateway-service.yaml
  - httpscaledobject.yaml      # KEDA buffer + scale-from-zero
  - ingressroute.yaml          # ollama.talos00 -> gpu-backend (interceptor deferred)
  - broker-rbac.yaml
  - broker-deployment.yaml
  - reaper-instance-cronjob.yaml  # tier 1: HOT -> WARM (cost backstop)
  - reaper-cache-cronjob.yaml     # tier 2: WARM -> COLD
  - alerts.yaml

# Generated, NOT a static ConfigMap: this is mounted with subPath, and a subPath mount is
# FROZEN at pod start -- kubelet never propagates ConfigMap updates into one. With a stable
# name the pod would run stale config forever, silently (proven on honeypot-lb, e0b9a475).
# The hash suffix makes an edit change the CM name -> the podTemplate -> rolls the pod.
configMapGenerator:
  - name: ollama-gateway-nginx
    files:
      - cfg/nginx.conf
