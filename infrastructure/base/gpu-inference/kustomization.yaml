---
# Ephemeral GPU inference — the demand plane (TALOS-t3ic / EPIC C + D).
#
# NO AWS SPEND FROM APPLYING THIS. The on-switch for a GPU is an uncommented claim line
# in ../aws/apps/kustomization.yaml, and nothing here can turn one on.
#
# The old inertness guarantees named ollama-gateway and gpu-broker; both are now DELETED
# (see below), so neither is load-bearing. What remains inert is relay-deployment.yaml,
# which with no rig running just reports "no instance" and sits Running-but-NotReady.
#
# The reapers DO act the moment a rig exists — that is their job. Until 2026-10-02 they
# did not: both guarded on `kubectl get crd`, which the gpu-broker ServiceAccount has no
# RBAC for, so the denial was misread as "the CRD is absent" and they exited 0 claiming
# "nothing to reap" while a GPU billed. They guard on the RESOURCE now.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gpu-inference

resources:
  - namespace.yaml
  - gpuprofile.yaml            # lifecycle TTLs only (TALOS-tt48)
  - api-key-push.yaml
  - gpu-service.yaml           # gpu-backend, now SELECTS the gpu-relay Pod
  # ── DELETED (2026-10-01) ── gateway-deployment.yaml, gateway-service.yaml,
  # httpscaledobject.yaml.
  #
  # The nginx ollama-gateway existed only so KEDA had a Deployment to scale 0<->1 as
  # the demand signal. It was never used, and having it in the path was actively worse
  # than nothing: ollama.talos00 HUNG for ~8s and returned nothing, because the
  # interceptor dutifully held each request waiting for a Deployment pinned at 0
  # replicas that could never report Ready. Routing straight to gpu-backend 503s
  # immediately instead, which is the honest answer.
  #
  # Its HTTPScaledObject also targeted http.keda.sh/v1alpha1, an API deleted upstream
  # on 2026-09-30 (TALOS-rzjx), so it could not have survived the next add-on upgrade.
  #
  # KEDA ITSELF IS UNTOUCHED — both the core operator and the keda-add-ons-http
  # controller stay installed (../operators/keda/). Only the proxy they were managing
  # is gone. Three unrelated workloads depend on KEDA core
  # (openscad/manyfold-performance-worker, boomtime/boomtime-jobs,
  # crossplane-demo/demo-celery), and leaving the HTTP add-on in place means the
  # scale-to-zero reimplementation needs no reinstall — just new objects.
  #
  # Scale-to-zero returns as a REIMPLEMENTATION, not a revival: TALOS-rzjx
  # (http.keda.sh/v1beta1 InterceptorRoute, whose timeouts.readiness and
  # coldStart.fallback actually fit a multi-minute boot) or TALOS-5mfc (/scale on the
  # XR, which may remove the need for an interceptor entirely).
  # ── OFF ── LEVEL 2 reachability hop (TALOS-x1sb). THIS LINE IS THE ON-SWITCH.
  # The Pod holding the SSM tunnel, so the Mac stops being the transport. Arming it
  # needs gpu-inference/gpu-relay-creds to exist, which means first uncommenting
  # gpu-relay-user.yaml in ../aws/apps/kustomization.yaml and letting Crossplane mint
  # the key. Without that secret the Pod sits in CreateContainerConfigError.
  # Harmless to arm with no rig running: the tunnel loop just reports no instance and
  # the Pod stays Running-but-NotReady.
  - relay-deployment.yaml
  # ── OFF ── THE IMAGE RIG'S DEMAND PLANE (TALOS-p412). These three lines are its
  # on-switch, same idiom as relay-deployment.yaml above. Arming them with no image rig
  # running is harmless: both tunnel loops report no instance and the Pod stays
  # Running-but-NotReady, so gpu-image-backend has no endpoints and the routes 503.
  # Needs gpu-relay-creds, i.e. gpu-relay-user.yaml armed in ../aws/apps first.
  - image-relay-deployment.yaml
  - image-service.yaml
  - image-ingressroute.yaml
  - ingressroute.yaml          # ollama.talos00 -> gpu-backend (interceptor deferred)
  # KEEP: both reapers run as serviceAccountName gpu-broker, so this is the cost
  # backstop's identity, not leftover scaffolding. The name is historical.
  - broker-rbac.yaml
  # ── DELETED (2026-10-02) ── broker-deployment.yaml. It sat at replicas 0 with the image
  # ghcr.io/thebranchdriftcatalyst/gpu-broker:PLACEHOLDER-NOT-BUILT-YET, and BOTH halves of
  # its documented contract referenced removed APIs: XGPUCache (kind deleted, see
  # gpuprofile.yaml) and status.publicIp (field removed, xgpuinstance-xrd.yaml). Its own
  # header and this file both advertised "scaling this to 1 arms real billing" — a footgun
  # pointing at an image that does not exist. At 0 replicas, deleting it changed nothing at
  # runtime. Scale-to-zero returns as a reimplementation (TALOS-rzjx / TALOS-5mfc), not as
  # this object.
  - reaper-instance-cronjob.yaml  # tier 1: HOT -> WARM (cost backstop)
  - reaper-cache-cronjob.yaml     # tier 2: WARM -> COLD
  - alerts.yaml

# ── DELETED (2026-10-02) ── the ollama-gateway-nginx configMapGenerator and cfg/nginx.conf.
# The gateway it configured was deleted on 2026-10-01; the generator outlived it and kept
# rendering ConfigMap/ollama-gateway-nginx-<hash> that nothing mounted. Verified before
# removing: the generator declaration was the ONLY reference to that name anywhere in the
# repo, and no volume referenced it.
