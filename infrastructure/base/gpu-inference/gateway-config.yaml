---
# nginx config for ollama-gateway.
#
# Two jobs:
#  1. /healthz  -> gateway liveness. Answers from nginx itself, always 200 while the pod
#                  is alive. Must NOT touch the backend, or a cold GPU would get the pod
#                  restarted in a loop.
#  2. /ready    -> READINESS, proxied to the GPU backend. This is the load-bearing one:
#                  it returns non-200 whenever the EC2 box is absent or not yet serving,
#                  which keeps the pod NotReady, which keeps the KEDA interceptor holding
#                  buffered requests instead of releasing them into a dead backend.
#  3. everything else -> proxied to the backend with LONG timeouts and streaming enabled.
#
# TIMEOUTS are 600s, identical to the interceptor and Traefik. Token generation on a large
# model legitimately runs for minutes; the shortest hop in the chain decides the real
# ceiling, so all three are set to the same number on purpose.
#
# SSE/streaming: proxy_buffering off + HTTP/1.1 + no Connection header rewrite, so
# token-by-token streaming reaches the client as it is produced. WebSocket upgrade is
# deliberately NOT configured — v1 is HTTP + SSE only (Ollama's own API is SSE).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-gateway-nginx
  namespace: gpu-inference
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      upstream gpu {
        server gpu-backend.gpu-inference.svc.cluster.local:8000;
      }

      server {
        listen 8080;

        # Liveness — never touches the backend.
        location = /healthz {
          add_header Content-Type text/plain;
          return 200 'ok';
        }

        # Readiness — deliberately DOES touch the backend.
        location = /ready {
          proxy_pass http://gpu/health;
          proxy_connect_timeout 2s;
          proxy_read_timeout 5s;
          # An absent backend must surface as NotReady, not as a 502 masquerading as up.
          proxy_intercept_errors on;
          error_page 502 503 504 = @notready;
        }
        location @notready {
          add_header Content-Type text/plain;
          return 503 'gpu backend not serving';
        }

        location / {
          proxy_pass http://gpu;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          # LONG + CONSISTENT (600s everywhere in the chain).
          proxy_connect_timeout 10s;
          proxy_send_timeout    600s;
          proxy_read_timeout    600s;

          # Streaming (SSE): deliver tokens as produced.
          proxy_buffering off;
          proxy_cache off;
          chunked_transfer_encoding on;
        }
      }
    }
