---
# 1Password -> Kubernetes -> SSM Parameter Store, declaratively (TALOS-a8vo.9).
#
#   1Password vault catalyst-eso, item "catalyst-operator", field "gpu-api-key"
#                                                   source of truth (ADR-0015).
#   The URI spelling of that reference is deliberately not written in this file:
#   .gitleaks.toml permits it only in .env.tpl and .envrc, and the ExternalSecret
#   below already names the item and property, so the rule costs nothing here.
#     -> ExternalSecret  ->  Secret gpu-inference/gpu-api-key
#       -> PushSecret    ->  SSM SecureString /catalyst/gpu/api-key  (us-east-2)
#         -> the EC2 instance profile reads it at boot and passes vLLM --api-key
#
# Rotation is therefore: change the field in 1Password. ESO refreshes the Secret, PushSecret
# updates the parameter, and the next rig boot picks it up. Nothing here holds a copy.
#
# BUT ROTATION IS NOT IMMEDIATE, and for a COMPROMISED key that matters. Both hops run on
# refreshInterval (1h), so a rotated value can sit unpropagated for up to an hour while the
# old one is still live in SSM and still accepted by a running rig. Measured exactly that
# on 2026-10-02: the field was rotated, yet the Secret and the parameter both still held the
# previous value. To force it:
#   kubectl annotate externalsecret -n gpu-inference gpu-api-key force-sync=$(date +%s) --overwrite
#   kubectl annotate pushsecret    -n gpu-inference gpu-api-key-to-ssm force-sync=$(date +%s) --overwrite
# in that order - the push can only carry what the ExternalSecret has already fetched.
# A rig that is already running keeps the OLD key until it is relaunched, because vLLM
# takes --api-key once at start. Rotating under compromise therefore means: rotate, force
# both syncs, THEN tear the rig down and relaunch it.
#
# Verify by hash, never by printing the value. sha256 of the empty string begins
# e3b0c44298fc - if a comparison shows that, the read failed and returned nothing rather
# than the secret disagreeing, which is a different problem entirely.
#
# The same Secret is what any IN-CLUSTER consumer would mount, so the k8s hop is not purely
# a staging area for the push.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameterstore
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-2
      auth:
        secretRef:
          # Minted by Crossplane — see aws/apps/gpu-api-key-push.yaml. upjet writes the
          # pair as username/password, not as AWS's own key names.
          accessKeyIDSecretRef:
            name: eso-ssm-push-creds
            namespace: external-secrets
            key: username
          secretAccessKeySecretRef:
            name: eso-ssm-push-creds
            namespace: external-secrets
            key: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gpu-api-key
  namespace: gpu-inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: gpu-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: catalyst-operator
        property: gpu-api-key
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gpu-api-key-to-ssm
  namespace: gpu-inference
spec:
  refreshInterval: 1h
  # IfNotExists would leave a rotated key stale in AWS while 1Password moved on, so the
  # push must be allowed to overwrite.
  updatePolicy: Replace
  # The parameter outlives any single rig and is read at boot by boxes this controller
  # knows nothing about. Deleting it when this manifest goes away would strand them.
  deletionPolicy: None
  secretStoreRefs:
    - name: aws-parameterstore
      kind: ClusterSecretStore
  selector:
    secret:
      name: gpu-api-key
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: /catalyst/gpu/api-key
      # WITHOUT THIS ESO CREATES A PLAIN `String` PARAMETER - verified: the first
      # successful push produced Type=String, leaving a bearer token unencrypted at rest
      # and readable by anything with ssm:GetParameter and no kms:Decrypt at all.
      # SecureString with the account default key is what makes the box's kms:Decrypt
      # grant meaningful; without it that grant is decoration.
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          # secretType only. `keyID` is NOT a field here - ESO rejects it with
          # `unknown field "keyID"` - and it is unnecessary: a SecureString with no KeyId
          # uses the account default alias/aws/ssm, which is exactly what the box's
          # kms:Decrypt grant is conditioned on (kms:ViaService ssm.*.amazonaws.com).
          secretType: SecureString
