---
# gpu-backend — the in-cluster handle on the AWS GPU box (TALOS-x1sb / LEVEL 2).
#
# WAS SELECTORLESS, with gpu-broker writing the tunnel's address into a hand-authored
# EndpointSlice. That could never have worked, for three independent reasons:
#   * EndpointSlice validation REJECTS loopback ("may not be in the loopback range
#     127.0.0.0/8, ::1/128"), and an SSM port-forward terminates on 127.0.0.1
#   * addressType: FQDN is not an escape hatch — no core component implements it and
#     kube-proxy programs no rules for it
#   * the instance's own IP is unreachable anyway: the XGPUInstance SG is egress-only
# ...and there was never a Pod or process anywhere in the cluster holding that tunnel.
#
# So it now selects the gpu-relay Pod by label, like any ordinary Service, and the
# EndpointSlice is DELETED rather than left as an empty stub — a stub invites the next
# person to try writing an address into it again.
#
# Empty endpoints is still the NORMAL resting state. With no rig running, gpu-relay's
# readiness probe fails (it GETs /health THROUGH the tunnel, so Ready genuinely means
# "vLLM is serving"), this Service has no endpoints, and ollama.talos00 returns 503.
# That is correct behaviour, not a fault.
apiVersion: v1
kind: Service
metadata:
  name: gpu-backend
  namespace: gpu-inference
  labels:
    app.kubernetes.io/name: gpu-backend
    app.kubernetes.io/part-of: gpu-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gpu-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
