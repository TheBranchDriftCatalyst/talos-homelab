---
# TIER 2 REAPER — drops the warm EBS model cache. WARM -> COLD.
#
# The cache deliberately outlives the instance so a wake does not re-download weights
# (~$16/mo for 200GB gp3, ~2 min wake). But a cache nobody has used in days is pure waste,
# so past cacheTtl it goes and the next wake pays the S3 re-sync instead (+10-40s).
#
# Cost tiers, for context:
#   HOT   instance running          ~$0.16/hr spot
#   WARM  cache only                ~$16/mo      <- this reaper's input
#   COLD  S3 library only           ~$4-13/mo    <- this reaper's output
#
# "Last used" comes from the gpu-inference/last-detach annotation that gpu-broker stamps
# when it deletes an instance. Falling back to creationTimestamp when the annotation is
# missing is deliberate: a cache created but never attached (failed provision) should still
# age out rather than linger forever.
#
# NEVER reap a cache while an instance exists — that would rip the volume out from under a
# serving box.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-cache-reaper
  namespace: gpu-inference
  labels:
    app.kubernetes.io/part-of: gpu-inference
spec:
  schedule: "17 * * * *"   # hourly, offset so it never collides with the tier-1 reaper
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: gpu-broker
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: alpine/k8s:1.34.9
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # Guard on the RESOURCE, not the CRD object: broker-rbac.yaml grants no
                  # apiextensions.k8s.io rule, so `kubectl get crd` is FORBIDDEN and every
                  # such test here silently answers "absent". XGPUCache is itself a deleted
                  # kind (see gpuprofile.yaml), so this still exits 0 — but now because the
                  # resource really is gone, not because an RBAC denial was misread.
                  kubectl get xgpucache >/dev/null 2>&1 \
                    || { echo "no XGPUCache CRD / no access - nothing to reap"; exit 0; }

                  TTL=$(kubectl get cm gpu-profile -n gpu-inference \
                        -o jsonpath='{.data.cacheTtl}')
                  TTL_S=$(echo "${TTL}" | sed 's/h/*3600/;s/m/*60/;s/s//' | bc)
                  echo "cacheTtl=${TTL} (${TTL_S}s)"

                  # Guard: never reap while a GPU instance is live. This one was the
                  # dangerous half of the same RBAC bug — a FORBIDDEN `kubectl get crd` made
                  # the condition FALSE, so the whole safety check was skipped rather than
                  # enforced. It was unreachable only because the guard above exited first,
                  # which made "fix the first guard" (the obvious change) enough on its own
                  # to turn a harmless no-op into a reaper that deletes caches out from
                  # under a running GPU. Both are on the resource now, so neither depends
                  # on the other being broken.
                  if kubectl get xgpuinstance >/dev/null 2>&1; then
                    LIVE=$(kubectl get xgpuinstances \
                           -l app.kubernetes.io/part-of=gpu-inference \
                           -o jsonpath='{.items[*].metadata.name}')
                    if [ -n "${LIVE}" ]; then
                      echo "instance(s) live (${LIVE}) - refusing to reap cache"
                      exit 0
                    fi
                  fi

                  NAMES=$(kubectl get xgpucaches \
                          -l app.kubernetes.io/part-of=gpu-inference \
                          -o jsonpath='{.items[*].metadata.name}')
                  if [ -z "${NAMES}" ]; then
                    echo "no XGPUCache present - already COLD"
                    exit 0
                  fi

                  NOW=$(date -u +%s)
                  for N in ${NAMES}; do
                    LAST=$(kubectl get xgpucache "${N}" \
                           -o jsonpath='{.metadata.annotations.gpu-inference/last-detach}')
                    if [ -z "${LAST}" ]; then
                      LAST=$(kubectl get xgpucache "${N}" \
                             -o jsonpath='{.metadata.creationTimestamp}')
                      echo "${N}: no last-detach annotation, falling back to creationTimestamp"
                    fi
                    IDLE_S=$(( NOW - $(date -u -d "${LAST}" +%s) ))
                    if [ "${IDLE_S}" -gt "${TTL_S}" ]; then
                      echo "REAP ${N}: unused ${IDLE_S}s > cacheTtl ${TTL_S}s (WARM -> COLD)"
                      kubectl delete xgpucache "${N}"
                    else
                      echo "KEEP ${N}: unused ${IDLE_S}s of ${TTL_S}s"
                    fi
                  done
