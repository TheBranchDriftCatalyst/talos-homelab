---
# ollama.talos00 -> the KEDA HTTP interceptor (NOT straight to the gateway).
#
# Routing through the interceptor is what makes scale-from-zero work: with the gateway at
# 0 replicas there is no pod to route to, so a direct route would 503. The interceptor is
# always up (min 1), holds the request, triggers the scale-up, and forwards once the
# gateway reports Ready.
#
# TRAEFIK TIMEOUTS: Traefik's default respondingTimeout would cut a held request long
# before a 2-5 min cold start finishes. The 600s budget has to be set on the ENTRYPOINT
# (a static/global setting), not here — an IngressRoute cannot raise it. See README.md;
# until that entrypoint change lands, cold starts will be cut short by Traefik regardless
# of what the interceptor is willing to wait.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ollama
  namespace: gpu-inference
  labels:
    app.kubernetes.io/name: ollama-gateway
    app.kubernetes.io/part-of: gpu-inference
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`ollama.talos00`)
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        # inference-lan-only, NOT traefik/lan-only. The shared one allows
        # 10.0.0.0/8, which on this cluster CONTAINS the pod CIDR (10.244/16)
        # and the service CIDR (10.96/12) - so it admitted every Pod in the
        # cluster to a GPU that bills by the hour. See inference-allowlist.yaml
        # for why an IP allowlist and not authentik. (TALOS-a8vo.9)
        - name: inference-lan-only
          namespace: gpu-inference
      services:
        # LEVEL 2 (TALOS-x1sb): straight to gpu-backend, which selects the gpu-relay
        # Pod holding the SSM tunnel. KEDA is deliberately NOT in this path yet —
        # Level 2's win (the Mac is no longer the transport) does not depend on
        # scale-to-zero, and routing through an interceptor before there is anything
        # to intercept only adds a hop that can fail. Restore the interceptor when
        # TALOS-rzjx (InterceptorRoute) and TALOS-5drv.5 land.
        - name: gpu-backend
          namespace: gpu-inference
          port: 8000
        # - name: keda-add-ons-http-interceptor-proxy
        #   namespace: keda
        #   port: 8080
