---
# Layer 2 of the AWS chain (TALOS-hk7i): creds gate + ProviderConfig + the
# XBucket XRD/Composition. Needs the CRDs from aws-providers (layer 1);
# bucket instances live in ./buckets/ (layer 3) because the XBucket kind
# doesn't exist until the XRD here is processed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - provider-scoped-user.yaml # TALOS-lq5y: scoped IAM user to replace root keys (Phase 1: create only, no cutover)
  - inventory-ro-user.yaml # TALOS-iymy: read-only IAM user for the aws-inventory-exporter (creds -> monitoring/aws-inventory-ro-creds)
  - xbucket-xrd.yaml
  - xbucket-composition.yaml
  - xfargateapp-xrd.yaml
  - xfargateapp-composition.yaml
  - xinstance-xrd.yaml # POC-DEMO
  - xinstance-composition.yaml # POC-DEMO
  - xgpuinstance-xrd.yaml # POC-DEMO (TALOS-455u)
  - xgpuinstance-composition.yaml # POC-DEMO (TALOS-455u)
  # XOutpost (TALOS-jegu): public 80+443 and a STABLE EIP. A separate XRD rather
  # than XInstance v1alpha2 because p-and-t cannot render an Eip conditionally, so
  # bolting it on would bill every aws-redteam throwaway for an address it never
  # asked for -- and a second inert ingress rule would duplicate the first, which
  # AWS rejects outright. See xoutpost-xrd.yaml's header.
  - xoutpost-xrd.yaml
  - xoutpost-composition.yaml
