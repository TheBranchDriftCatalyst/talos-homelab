---
# AWS via Crossplane (TALOS-hk7i) — real-cloud resources as git objects.
# Layering: provider/function packages → creds (1Password→ESO, HUMAN-gated:
# see externalsecret.yaml banner) → ProviderConfig → XBucket XRD/Composition
# → bucket instances in ./buckets/. First reconcile passes are expectedly
# noisy while the provider registers its CRDs; Flux retry converges.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - provider.yaml
  - externalsecret.yaml
  - xbucket-xrd.yaml
  - xbucket-composition.yaml
  - buckets/offsite-backups.yaml
