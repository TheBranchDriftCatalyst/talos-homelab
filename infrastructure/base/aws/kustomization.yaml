---
# Layer 2 of the AWS chain (TALOS-hk7i): creds gate + ProviderConfig + the
# XBucket XRD/Composition. Needs the CRDs from aws-providers (layer 1);
# bucket instances live in ./buckets/ (layer 3) because the XBucket kind
# doesn't exist until the XRD here is processed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - xbucket-xrd.yaml
  - xbucket-composition.yaml
  - xfargateapp-xrd.yaml
  - xfargateapp-composition.yaml
