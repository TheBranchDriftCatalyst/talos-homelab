---
# XFargateApp — run a container on AWS with NO cluster and NO servers
# (TALOS-hk7i). One CR yields: ECS cluster + Fargate service + task def +
# execution role + log group + security group. v1alpha1 is public-IP direct
# (no ALB — that's the v1alpha2 refinement). cpu/memory/port are STRINGS by
# design (they format into the containerDefinitions JSON).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata: {name: xfargateapps.aws.catalyst.io}
spec:
  group: aws.catalyst.io
  names: {kind: XFargateApp, plural: xfargateapps}
  defaultCompositionRef: {name: xfargateapp-aws}
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [appName, image, vpcId, subnetIds]
              properties:
                appName: {type: string}
                image: {type: string, description: "Full image ref (public registries: ghcr.io/... works without ECR)"}
                port: {type: string, default: "8080"}
                cpu: {type: string, default: "256", description: "Fargate CPU units (256=0.25 vCPU)"}
                memory: {type: string, default: "512", description: "MiB — must be a valid Fargate cpu/mem pair"}
                desiredCount: {type: integer, default: 1}
                region: {type: string, default: us-west-2}
                vpcId: {type: string, description: "HUMAN: default VPC id from the console (vpc-...)"}
                subnetIds: {type: array, items: {type: string}, description: "HUMAN: 2+ public subnet ids (subnet-...)"}
                assignPublicIp: {type: boolean, default: true}
            status:
              type: object
              properties:
                securityGroupId: {type: string}
