---
# AWS credentials for Crossplane — 1Password is the single source of truth.
#
# ██ HUMAN GATE (TALOS-3g8f) ██ Create the 1Password item:
#   item:   aws-credentials   (SATISFIED -- the item exists with both fields)
#   fields: access_key_id, secret_access_key
#   NOTE: this gate used to name the item `aws-crossplane`; the item was actually
#   created as `aws-credentials`, and the mismatch went unnoticed for 33+ days
#   because nothing alerts on a ProviderConfig with no credentials -- only
#   ExternalSecretNeverSynced fired, and only on the secret.
#   (IAM user with S3 permissions; scope the policy to s3:* on the buckets
#   this cluster manages — see the XBucket claims in ./buckets/)
#
# Until the item exists this ExternalSecret sits Ready=False and the
# ExternalSecretNotReady alert fires — that alert IS the reminder that this
# chain is pending. Everything downstream (ProviderConfig, XBuckets) waits
# harmlessly on the missing Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: aws-credentials
    creationPolicy: Owner
    template:
      data:
        # AWS shared-credentials-file format — what the upjet provider expects
        creds: |
          [default]
          aws_access_key_id = {{ .access_key_id }}
          aws_secret_access_key = {{ .secret_access_key }}
  data:
    # Item is `aws-credentials`. The gate above originally asked for
    # `aws-crossplane`, which was never created -- so this ExternalSecret never
    # synced once ("could not get secret data from provider", syncedResourceVersion
    # absent) and the ProviderConfig has had no credentials since it was applied.
    # Every AWS managed resource has therefore sat SYNCED=False for 33+ days: the
    # offsite-backups bucket guard, the cloudwatchlogs group, and the EC2/EBS GPU
    # resources. Verified in the vault: aws-credentials carries exactly
    # access_key_id and secret_access_key, both populated.
    - secretKey: access_key_id
      remoteRef:
        key: aws-credentials
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: aws-credentials
        property: secret_access_key
---
# Name `default` so every AWS managed resource picks it up without an explicit
# providerConfigRef.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-credentials
      key: creds
