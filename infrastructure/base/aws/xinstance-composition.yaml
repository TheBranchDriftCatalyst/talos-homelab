---
# Composition for XInstance (POC-DEMO). openPort=0 renders an inert rule
# (port 0 ingress on tcp matches nothing useful) — v1alpha2 does it properly
# with conditional rendering (go-templating function).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xinstance-aws
  labels: {catalyst.io/stage: poc-demo}
spec:
  compositeTypeRef: {apiVersion: aws.catalyst.io/v1alpha1, kind: XInstance}
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef: {name: function-patch-and-transform}
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: sg
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroup
              spec:
                forProvider:
                  region: us-west-2
                  description: xinstance (managed by crossplane, poc-demo)
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.vpcId, toFieldPath: spec.forProvider.vpcId}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceName, toFieldPath: spec.forProvider.name}
          - name: sg-ingress
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: us-west-2
                  type: ingress
                  protocol: tcp
                  fromPort: 0
                  toPort: 0
                  cidrBlocks: ["0.0.0.0/0"]
                  securityGroupIdSelector: {matchControllerRef: true}
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.openPort, toFieldPath: spec.forProvider.fromPort}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.openPort, toFieldPath: spec.forProvider.toPort}
          - name: sg-egress
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: us-west-2
                  type: egress
                  protocol: "-1"
                  fromPort: 0
                  toPort: 0
                  cidrBlocks: ["0.0.0.0/0"]
                  securityGroupIdSelector: {matchControllerRef: true}
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
          - name: instance
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: Instance
              spec:
                forProvider:
                  region: us-west-2
                  vpcSecurityGroupIdSelector: {matchControllerRef: true}
                  # IMDSv2 REQUIRED, hop limit 1 (TALOS-outpost). Static in the base:
                  # metadataOptions is a real field on instances.ec2 v1beta1/v1beta2
                  # (confirmed against the live CRD schema -- note `kubectl explain`
                  # wrongly reports it absent), and there is no XRD field for it
                  # because there is no reason any claim would want it weaker.
                  #
                  # WHY THIS MATTERS HERE: an XInstance can be PUBLIC (outpost-demo
                  # opens :80 to 0.0.0.0/0, and the composition hardcodes that CIDR).
                  # Under IMDSv1 a single SSRF in anything running on the box yields
                  # the instance profile's credentials with one unauthenticated GET.
                  #
                  # hopLimit 1 is deliberate and is the stronger setting: the HOST can
                  # reach IMDS (which is all the SSM agent and boot-time `aws ssm
                  # get-parameter` need), but a CONTAINER is one hop further and is
                  # blocked. XGPUInstance uses 2 only because vLLM authenticates to S3
                  # from INSIDE its container on every boot. If an outpost workload
                  # ever needs AWS creds at runtime rather than at boot, raise this to
                  # 2 deliberately -- do not discover it by accident.
                  # A LIST, not a map -- same shape as rootBlockDevice below.
                  # metadataOptions is `type: array` on v1beta1 (what this
                  # composition writes) and `type: object` on v1beta2. Writing the
                  # map form fails the composition outright with
                  # ".spec.forProvider.metadataOptions: expected list, got &{map[...]}"
                  # -- so check the version you are TARGETING, not just the storage
                  # version `kubectl explain` shows you.
                  metadataOptions:
                    - httpEndpoint: enabled
                      httpTokens: required
                      httpPutResponseHopLimit: 1
                  rootBlockDevice:
                    - volumeSize: 30
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.ami, toFieldPath: spec.forProvider.ami}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceType, toFieldPath: spec.forProvider.instanceType}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.subnetId, toFieldPath: spec.forProvider.subnetId}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.userData, toFieldPath: spec.forProvider.userData}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.rootVolumeGb, toFieldPath: "spec.forProvider.rootBlockDevice[0].volumeSize"}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceName, toFieldPath: "spec.forProvider.tags[Name]"}
              # SSM interactive mode. FromCompositeFieldPath is Optional by default,
              # so when spec.instanceProfileName is unset this patch is a no-op and
              # the instance launches with no profile (unchanged). Set the field to
              # attach an existing IAM instance profile by NAME (iamInstanceProfile).
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceProfileName, toFieldPath: spec.forProvider.iamInstanceProfile, policy: {fromFieldPath: Optional}}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.publicIp, toFieldPath: status.publicIp}
