---
# XGPUInstance — POC-DEMO (TALOS-455u, TALOS-iymy). Spot GPU box whose model is
# chosen by ONE field: `hfModel`, a HuggingFace repo id.
#
# Two-tier weights, with the S3 location DERIVED from that same id:
#   HF  = the upstream source of truth (`hfModel`, e.g. Qwen/Qwen3.8-27B-FP8)
#   S3  = the durable cache at s3://<modelsBucket>/<hfModel>/ — written by the
#         first box that ever boots this model (seed-on-miss), read by every
#         box after at same-region speed (free transfer, ~1-2GB/s)
#   EBS = small EPHEMERAL hot-cache (gp3) at /cache; lives exactly as long as
#         this CR (delete the file → GPU + cache + bill gone; S3 untouched)
#
# One composition serves every machine shape: tensorParallelSize / quantization /
# maxModelLen / gpuMemoryUtilization / enableImageGen are per-claim, so a 1x L40S
# and a 4x L40S are the SAME pattern with different numbers. See aws/apps/ for the
# concrete rigs and aws/apps/gpu-profiles.yaml for the sizing table.
#
# v1alpha1 honesty: always-spot (market options hardcoded — on-demand is a
# v1alpha2 param). The numeric knobs are `type: string` because the composition
# builds userData with a patch-and-transform `CombineFromComposite` (strategy:
# string), which formats every variable through %s — strings avoid coercion
# surprises. Same reason servePort has always been a string here.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xgpuinstances.aws.catalyst.io
  labels: {catalyst.io/stage: poc-demo}
spec:
  group: aws.catalyst.io
  names: {kind: XGPUInstance, plural: xgpuinstances}
  defaultCompositionRef: {name: xgpuinstance-aws}
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [instanceName, hfModel, vpcId]
              properties:
                instanceName: {type: string}
                instanceType: {type: string, default: g5.xlarge, description: "g5.xlarge=1xA10G 24GB, g6e.2xlarge=1xL40S 48GB, g6.12xlarge=4xL4 96GB, g6e.12xlarge=4xL40S 192GB. NOTE: G/VT spot quota is per-REGION vCPU (48 = exactly one 4-GPU box) — see aws/apps/gpu-profiles.yaml"}

                # ── the model ────────────────────────────────────────────────
                # THE single source of model truth. Drives both the vLLM --model
                # path and the S3 cache prefix (s3://<modelsBucket>/<hfModel>/),
                # so adding a model is one line and needs no manual S3 seeding:
                # the first boot pulls from HF and writes S3 + a _SEED_COMPLETE
                # marker; every later boot syncs from S3 instead.
                hfModel: {type: string, description: "HuggingFace repo id, e.g. 'Qwen/Qwen3.8-27B-FP8'. Also the S3 cache prefix under modelsBucket."}
                modelsBucket: {type: string, default: catalyst-tbdc-models, description: "S3 cache bucket. MUST be same-region as spec.region or the sync is slow and billed (us-east-2 => catalyst-tbdc-models-use2)."}
                servedModelName: {type: string, default: catalyst-gpu, description: "SPACE-SEPARATED list of vLLM --served-model-name aliases; the endpoint answers to all of them and reports the first. Decoupled from hfModel so the operator config survives a model swap, and so a remote box can also answer to the local Ollama tag. Only alias names that are honestly the same model."}

                # ── vLLM serving knobs (per machine shape) ───────────────────
                tensorParallelSize: {type: string, default: "1", description: "vLLM --tensor-parallel-size. MUST equal the instance's GPU count (1 for g5/g6e .xlarge-.8xlarge, 4 for .12xlarge)."}
                quantization: {type: string, default: "auto", description: "vLLM --quantization. Sentinel 'auto' OMITS the flag so vLLM autodetects from the checkpoint's config.json (correct for FP8/AWQ/GPTQ repos that self-describe). Set explicitly only to force a kernel, e.g. gptq_marlin / awq_marlin."}
                maxModelLen: {type: string, default: "32768", description: "vLLM --max-model-len. Budget against VRAM left after weights: KV cache per token scales with the model's GQA shape."}
                gpuMemoryUtilization: {type: string, default: "0.90", description: "vLLM --gpu-memory-utilization. Drop to ~0.78 only when ComfyUI shares the same GPUs (enableImageGen)."}
                # Pinned, NOT :latest — on a multi-dollar-per-hour box a floating
                # tag is a reproducibility hazard, and newer architectures (e.g.
                # Qwen3.8's hybrid Gated-DeltaNet attention) need a known-good
                # version. Bump deliberately, in a PR.
                vllmImage: {type: string, default: "vllm/vllm-openai:v0.30.0", description: "Pinned vLLM server image. v0.30.0 (2026-09-22) postdates Qwen3.8."}

                # ── image generation ────────────────────────────────────────
                # ComfyUI + comfyui-shim share the GPUs with vLLM. Default OFF:
                # it only fits where there is spare VRAM after the LLM, and the
                # bundle image must exist in GHCR first (see composition note).
                enableImageGen: {type: string, default: "false", description: "'true' to also run ComfyUI + comfyui-shim (:8012). Needs spare VRAM AND the runpod-mac-bundle image pushed to GHCR."}

                # ── spot vs on-demand ───────────────────────────────────────
                # ⚠️ OMITTING THIS MEANS ON-DEMAND, which can be 2-4x the spot price.
                # It has no default BY NECESSITY: there is no "on-demand" marketType
                # value in the EC2 API — on-demand is expressed by the ABSENCE of
                # instanceMarketOptions. patch-and-transform can only skip a patch when
                # its SOURCE field is absent (the Optional policy), so absence here is
                # the only way to render absence there. STATE IT EXPLICITLY on every
                # claim; both current claims do.
                #
                # When to pick which: spot is only worth its interruption risk when it
                # is actually cheaper, and spot price is CAPPED AT on-demand. Measured
                # 2026-09-30, g6e.2xlarge spot in us-west-2b/2c was $2.2421 against an
                # on-demand list of $2.24208 — a 0.0% discount for full interruption
                # risk, while the AZs that did show a real discount (2a $1.42, 2d $1.94)
                # both refused with InsufficientInstanceCapacity. Run
                # scripts/check-spot-avail.sh and compare before choosing.
                capacityType: {type: string, enum: [spot], description: "Set to 'spot' for a spot instance. OMIT ENTIRELY for on-demand (there is no on-demand marketType; absence is the signal). Omitting costs MORE — see the comment above."}

                # ── machine / placement ─────────────────────────────────────
                # NO cacheVolumeGb / cacheSnapshotId (TALOS-rkg0): /cache is the instance's
                # LOCAL NVME INSTANCE STORE, which is free, faster than gp3, sized by the
                # shape (g6e.2xlarge 450GB, g6e.12xlarge 3800GB), and — the reason for the
                # change — NOT AZ-scoped. An EBS cache forced this XRD to pin one AZ, and
                # that pin made the rig unlaunchable while AWS was telling us to stop
                # specifying an AZ. S3 is the durable layer via seed-on-miss.
                # AMI is region-specific and upjet does NOT accept resolve:ssm aliases, so it must be a
                # concrete ami-... id per region. Optional: unset => composition default (us-west-2 DL GPU AMI).
                ami: {type: string, description: "Concrete AMI id (region-specific DL Base GPU AMI). Omit to use the composition default."}
                servePort: {type: string, default: "8000"}
                region: {type: string, default: us-west-2}
                # NO availabilityZone (TALOS-rkg0): nothing in this composition is
                # AZ-scoped any more, so there is nothing to pin. OMIT subnetId and AWS
                # places the instance in whichever AZ actually has capacity — which is
                # exactly what its InsufficientInstanceCapacity guidance asks for. Set
                # subnetId only to force a specific subnet (and thereby a specific AZ).
                vpcId: {type: string, description: "VPC for the egress-only security group. Keep it the VPC whose default subnets AWS will choose from when subnetId is omitted."}
                subnetId: {type: string, description: "OPTIONAL. Omit to let AWS pick the AZ with capacity (recommended). Set to pin a subnet/AZ."}
                # Interactive mode (SSM). NO default: unset => the composition patch
                # is skipped (Optional) and the box launches with no profile/SSM.
                # The XGPUInstance SG is EGRESS-ONLY (no inbound), so without this
                # the box is UNREACHABLE once booted — set it to get a shell and to
                # port-forward vLLM :servePort via `aws ssm start-session`.
                # NOTE: the seed-on-miss path WRITES to S3, so the profile needs
                # s3:PutObject on modelsBucket — `catalyst-gpu-seeder` has it and
                # SSM both; plain `catalyst-ssm` has SSM only (read-only models).
                instanceProfileName: {type: string, description: "IAM instance profile NAME to attach (SSM shell + port-forward). Use catalyst-gpu-seeder so seed-on-miss can write S3. Omit for none."}
            status:
              type: object
              properties:
                publicIp: {type: string}
