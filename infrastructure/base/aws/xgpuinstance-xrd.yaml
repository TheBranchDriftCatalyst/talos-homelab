---
# XGPUInstance — POC-DEMO (TALOS-455u). Spot GPU box for model testing with
# the two-tier weights architecture:
#   S3  = the ~1TB model LIBRARY (XBucket catalyst-tbdc-models) — cheap, durable
#   EBS = small EPHEMERAL hot-cache (gp3), seeded per-boot with ONLY the models
#         named in spec.models; lives exactly as long as this CR (delete the
#         file → GPU + cache + bill gone; library untouched)
# v1alpha1 honesty: always-spot (market options hardcoded — on-demand is a
# v1alpha2 param); `models` is a SPACE-SEPARATED string (patch-and-transform
# can't fmt-join arrays; go-templating function fixes this in v1alpha2).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xgpuinstances.aws.catalyst.io
  labels: {catalyst.io/stage: poc-demo}
spec:
  group: aws.catalyst.io
  names: {kind: XGPUInstance, plural: xgpuinstances}
  defaultCompositionRef: {name: xgpuinstance-aws}
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [instanceName, models, vpcId, subnetId, availabilityZone]
              properties:
                instanceName: {type: string}
                instanceType: {type: string, default: g5.xlarge, description: "g5.xlarge=A10G 24GB (7-8B), g6e.xlarge=L40S 48GB (32B quant), g5.12xlarge=4xA10G (70B quant)"}
                models: {type: string, description: "SPACE-separated s3 prefixes under the models bucket, e.g. 'llama-3.1-8b qwen-32b-awq'"}
                modelsBucket: {type: string, default: catalyst-tbdc-models}
                cacheVolumeGb: {type: integer, default: 200, description: "gp3 hot-cache — size for the models under test, NOT the library"}
                servePort: {type: string, default: "8000"}
                region: {type: string, default: us-west-2}
                availabilityZone: {type: string, description: "MUST match the subnet's AZ (e.g. us-west-2a)"}
                vpcId: {type: string}
                subnetId: {type: string}
            status:
              type: object
              properties:
                publicIp: {type: string}
