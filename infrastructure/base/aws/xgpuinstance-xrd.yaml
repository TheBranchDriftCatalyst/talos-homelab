---
# XGPUInstance — POC-DEMO (TALOS-455u, TALOS-iymy). GPU box whose model is chosen by
# ONE field: `hfModel`, a HuggingFace repo id.
#
# Weights, after TALOS-5drv.3:
#   HF  = the upstream source of truth (`hfModel`, e.g. Qwen/Qwen3.8-27B-FP8), read
#         ONCE ever, by the first box that boots a model nobody has staged yet
#   S3  = the durable cache at s3://<modelsBucket>/<hfModel>/, and now also the thing
#         vLLM LOADS FROM: Run:ai Model Streamer reads native safetensors straight out
#         of S3 into VRAM (`--load-format runai_streamer`), so the steady-state path is
#         S3 -> VRAM with no local copy at all
#   /cache = the instance's LOCAL NVMe, now only scratch for the cold HF seed
#
# One composition serves every machine shape. quantization / maxModelLen /
# gpuMemoryUtilization / enableImageGen are per-claim; tensorParallelSize is NOT a
# field any more — it is derived at boot (see below). See aws/apps/ for the concrete
# rigs and aws/apps/gpu-profiles.yaml for the sizing table.
#
# The numeric knobs are `type: string` because the composition builds userData with a
# patch-and-transform `CombineFromComposite` (strategy: string), which formats every
# variable through %s — strings avoid coercion surprises. Same reason servePort has
# always been a string here.
#
# ── WHY THERE IS NO v1alpha2 YET ────────────────────────────────────────────────────
# The epic (TALOS-5drv) is named "XGPUInstance v1alpha2" and this change does remove
# two fields, so a version bump is tempting. Deliberately not done yet:
#   * there are no live claims — both rigs are git-off — so in-place schema evolution
#     costs nothing and a served second version would be dead weight
#   * the one-rig admission guard (TALOS-5drv.4) matches `aws.catalyst.io/v1alpha1/
#     XGPUInstance` by name; bumping here would silently stop it matching
#   * v1alpha2 should land ONCE, when the epic's remaining pieces (scale-to-zero) are
#     in — not twice, half-finished
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xgpuinstances.aws.catalyst.io
  labels: {catalyst.io/stage: poc-demo}
spec:
  group: aws.catalyst.io
  names: {kind: XGPUInstance, plural: xgpuinstances}
  defaultCompositionRef: {name: xgpuinstance-aws}
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [instanceName, instanceTypes, hfModel, vpcId]
              properties:
                instanceName: {type: string}

                # ── the capacity POOL, not a machine (TALOS-i91u) ─────────────
                # WAS a single `instanceType` with a g5.xlarge default. One instance
                # type is ONE CAPACITY POOL, and that is why the 2026-09-30/10-01
                # bring-up failed over and over: g6e.2xlarge refused on spot in
                # us-west-2a and 2d, then on-demand region-wide in us-west-2, then
                # region-wide in us-east-2, before us-east-2c finally opened. Spot
                # placement score was 1/9 for every single-GPU g6e size in four
                # regions. Unpinning the AZ (TALOS-rkg0) was necessary but not
                # sufficient — with placement free, AWS still had only one shape to
                # look for.
                #
                # Now the claim names SEVERAL acceptable shapes and the composition
                # asks for ONE instance from whichever pool can actually serve it
                # (EC2 Fleet launch-template overrides).
                #
                # ⚠️ TWO THINGS THE LIST ORDER DOES *NOT* MEAN:
                #   1. It is NOT a preference order. The fleet's allocation strategy
                #      chooses: lowestPrice for on-demand, price-capacity-optimized
                #      for spot. Order in this list is ignored.
                #   2. It is NOT a fallback chain where only the first has to fit.
                #      EVERY shape listed must be able to RUN THE MODEL, because any
                #      of them may be the one you get. Check each against the model's
                #      minVramGib in aws/apps/gpu-profiles.yaml before adding it.
                #
                # ⚠️ AND THE BILL IS SET BY THE MOST EXPENSIVE MEMBER. lowestPrice
                # reaches for a dearer shape only when the cheap ones have no
                # capacity — which is the trade you want — but state the ceiling in
                # the claim header so nobody is surprised. us-east-2 on-demand,
                # measured 2026-10-01: g6e.2xlarge $2.242, g6e.4xlarge $3.004,
                # g6.12xlarge $4.602, g6e.12xlarge $10.493.
                #
                # Max 6 entries: patch-and-transform cannot loop, so the composition
                # carries six Optional patches, one per slot.
                instanceTypes:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: {type: string}
                  description: >-
                    Acceptable machine shapes, e.g. [g6e.2xlarge, g6e.4xlarge, g6.12xlarge]. AWS picks whichever
                    pool has capacity. EVERY entry must fit the model (see gpu-profiles.yaml minVramGib) and the
                    most expensive entry sets the worst-case bill. NOTE: G/VT quota is per-REGION vCPU, so a
                    48-vCPU .12xlarge in the pool can consume the whole regional allowance on its own.

                # ── the model ────────────────────────────────────────────────
                # THE single source of model truth. Drives both the vLLM --model URI
                # and the S3 cache prefix (s3://<modelsBucket>/<hfModel>/), so adding
                # a model is one line and needs no manual S3 seeding: the first boot
                # pulls from HF, writes S3 + a _SEED_COMPLETE marker, and every boot
                # after — including that one — serves by STREAMING from S3.
                hfModel:
                  type: string
                  description: >-
                    HuggingFace repo id, e.g. 'Qwen/Qwen3.8-27B-FP8'. Also the S3 cache prefix under
                    modelsBucket, and therefore the s3:// URI vLLM loads from.
                modelsBucket:
                  type: string
                  default: catalyst-tbdc-models
                  description: >-
                    S3 cache bucket. MUST be same-region as spec.region — weights are STREAMED from here on
                    every boot now, so cross-region would be slow and billed on every start
                    (us-east-2 => catalyst-tbdc-models-use2).
                servedModelName:
                  type: string
                  default: catalyst-gpu
                  description: >-
                    SPACE-SEPARATED list of vLLM --served-model-name aliases; the endpoint answers to all of
                    them and reports the first. Decoupled from hfModel so the operator config survives a model
                    swap, and so a remote box can also answer to the local Ollama tag. Only alias names that
                    are honestly the same model. EFFECTIVELY REQUIRED now: vLLM resolves served_model_name
                    BEFORE it rewrites an s3:// --model, so without this the reported model id is the raw S3 URI.

                # ── vLLM serving knobs (per machine shape) ───────────────────
                # NO tensorParallelSize (TALOS-5drv.2). It is DERIVED at boot from
                # `nvidia-smi -L`, because TP is a property of the machine, not of
                # user intent — and a pool spanning 1-GPU and 4-GPU shapes has no
                # single correct value, so asserting it per claim is what blocked
                # instanceTypes above. Not kept as an optional override either:
                # against a heterogeneous pool an override is wrong by construction
                # (pin 1 on a 4-GPU box and you pay for three idle GPUs; pin 4 on a
                # 1-GPU box and vLLM will not start), and the one honest use for it
                # — leaving GPUs free for ComfyUI — is not how enableImageGen works
                # (ComfyUI gets --gpus all and shares VRAM, not separate devices).
                quantization:
                  type: string
                  default: "auto"
                  description: >-
                    vLLM --quantization. Sentinel 'auto' OMITS the flag so vLLM autodetects from the
                    checkpoint's config.json (correct for FP8/AWQ/GPTQ repos that self-describe). Set
                    explicitly only to force a kernel, e.g. gptq_marlin / awq_marlin.
                maxModelLen:
                  type: string
                  default: "32768"
                  description: >-
                    vLLM --max-model-len. Budget against VRAM left after weights: KV cache per token scales
                    with the model's GQA shape.
                gpuMemoryUtilization:
                  type: string
                  default: "0.90"
                  description: >-
                    vLLM --gpu-memory-utilization. Drop to ~0.78 only when ComfyUI shares the same GPUs
                    (enableImageGen).
                # Run:ai Model Streamer read concurrency (TALOS-5drv.3). Sets
                # RUNAI_STREAMER_CONCURRENCY, which is exactly what the documented
                # `--model-loader-extra-config '{"concurrency":N}'` sets underneath
                # (the loader validates the key and then does os.environ.update).
                # 16 is the value vLLM's own doc uses as its example.
                maxNumSeqs:
                  type: string
                  default: "128"
                  description: >-
                    vLLM --max-num-seqs. MUST be set, and 256 (vLLM default) is wrong on a
                    1-GPU shape: Qwen3.8-27B is a HYBRID architecture whose Gated DeltaNet
                    layers need one Mamba cache block per decode sequence, and a 44.7GiB L40S
                    holding 30.9GB of weights has room for only 165. vLLM then refuses to
                    start at all - "max_num_seqs (256) exceeds available Mamba cache blocks
                    (165)" - and with --restart=always it CRASH-LOOPS silently, which looks
                    exactly like a slow boot. Cost 17 minutes of a billing GPU to diagnose.
                    Shape-dependent: it does NOT appear on the 4x shapes, which have the VRAM
                    for more blocks, so it only bites the cheapest rig - the one most used.
                    Raise it only alongside more VRAM or a lower gpuMemoryUtilization.
                apiKeyParameter:
                  type: string
                  default: "/catalyst/gpu/api-key"
                  description: >-
                    SSM Parameter Store path holding the bearer token vLLM enforces via
                    --api-key. Read at boot with the instance profile; the box cannot reach
                    1Password, which is the source of truth, so ESO pushes it here
                    (gpu-inference/api-key-push.yaml). Set to the empty string to serve with
                    NO authentication - only sane if nothing but the relay can reach the box,
                    and the relay is reachable from any Pod via the gpu-backend ClusterIP, so
                    in practice do not.
                    NEVER pass the key itself through a claim: it would land in git, and in
                    userData, which is readable by anything holding
                    ec2:DescribeInstanceAttribute and from IMDS on the box.
                streamerConcurrency:
                  type: string
                  default: "16"
                  description: >-
                    Run:ai Model Streamer parallel S3 reads (RUNAI_STREAMER_CONCURRENCY). Raise to push more
                    same-region S3 bandwidth into VRAM; lower if the box is host-memory-tight during load.
                # Pinned, NOT :latest — on a multi-dollar-per-hour box a floating
                # tag is a reproducibility hazard, and newer architectures (e.g.
                # Qwen3.8's hybrid Gated-DeltaNet attention) need a known-good
                # version. Bump deliberately, in a PR. v0.30.0 also already ships
                # runai-model-streamer[s3] in the image, so the streaming path needs
                # no pip install at boot — do not pin BELOW it.
                vllmImage:
                  type: string
                  default: "vllm/vllm-openai:v0.30.0"
                  description: >-
                    Pinned vLLM server image. v0.30.0 (2026-09-22) postdates Qwen3.8 and bundles
                    runai-model-streamer[s3,gcs,azure] (installed in the Dockerfile's vllm-runtime-base
                    stage), so --load-format runai_streamer works with no extra install.

                # ── image generation ────────────────────────────────────────
                # ComfyUI + comfyui-shim share the GPUs with vLLM. Default OFF:
                # it only fits where there is spare VRAM after the LLM, and the
                # bundle image must exist in GHCR first (see composition note).
                enableImageGen:
                  type: string
                  default: "false"
                  description: >-
                    'true' to also run ComfyUI + comfyui-shim (:8012). Needs spare VRAM AND the
                    runpod-mac-bundle image pushed to GHCR.

                # ── spot vs on-demand ───────────────────────────────────────
                # ⚠️ OMITTING THIS MEANS ON-DEMAND, which can be 2-4x the spot price.
                # STATE IT EXPLICITLY ON EVERY CLAIM; both current claims do.
                #
                # The CONTRACT is unchanged: absence means on-demand. The MECHANISM
                # changed with TALOS-i91u, so the old reason no longer applies and is
                # recorded here rather than deleted. It used to read: "it has no
                # default BY NECESSITY — there is no 'on-demand' marketType value in
                # the EC2 API, on-demand is expressed by the ABSENCE of
                # instanceMarketOptions, and patch-and-transform can only skip a
                # patch when its SOURCE field is absent, so absence here is the only
                # way to render absence there." That is true of a bare Instance. An
                # EC2 Fleet instead takes an explicit targetCapacitySpecification.
                # defaultTargetCapacityType whose valid values ARE `on-demand` and
                # `spot`, so the composition now defaults that to `on-demand` in the
                # base and an Optional patch flips it to `spot`. Absence is still how
                # you ask for on-demand, but it is no longer the ONLY way to say it —
                # which makes the rendered intent explicit instead of implied.
                #
                # When to pick which: spot is only worth its interruption risk when it
                # is actually cheaper, and spot price is CAPPED AT on-demand. Measured
                # 2026-09-30, g6e.2xlarge spot in us-west-2b/2c was $2.2421 against an
                # on-demand list of $2.24208 — a 0.0% discount for full interruption
                # risk, while the AZs that did show a real discount (2a $1.42, 2d $1.94)
                # both refused with InsufficientInstanceCapacity. Run
                # scripts/check-spot-avail.sh and compare before choosing. A diversified
                # pool improves spot's odds a lot, so re-measure before assuming the
                # 2026-09-30 answer still holds.
                capacityType:
                  type: string
                  enum: [spot]
                  description: >-
                    Set to 'spot' for a spot fleet. OMIT ENTIRELY for on-demand. Omitting costs MORE —
                    see the comment above.

                # ── machine / placement ─────────────────────────────────────
                # NO cacheVolumeGb / cacheSnapshotId (TALOS-rkg0): /cache is the instance's
                # LOCAL NVME INSTANCE STORE, which is free, faster than gp3, sized by the
                # shape (g6e.2xlarge 450GB, g6e.12xlarge 3800GB), and — the reason for the
                # change — NOT AZ-scoped. An EBS cache forced this XRD to pin one AZ, and
                # that pin made the rig unlaunchable while AWS was telling us to stop
                # specifying an AZ. Since TALOS-5drv.3 it is not even on the serving path:
                # vLLM streams from S3 and /cache is scratch for the cold HF seed only.
                #
                # AMI is region-specific and must be a CONCRETE ami-... id — two
                # independent reasons now:
                #   * upjet does not accept resolve:ssm: aliases (it passes the literal
                #     to DescribeImages -> InvalidAMIID.Malformed)
                #   * AWS itself forbids it here: "EC2 Fleets of type maintain and
                #     request ... do not support using a launch template that has a
                #     Systems Manager parameter specified in place of an AMI ID"
                #     (AWSEC2/latest/UserGuide/create-launch-template.html, Limitations).
                #     This fleet is type `maintain`.
                # Optional: unset => composition default (us-west-2 DL GPU AMI).
                ami:
                  type: string
                  description: >-
                    Concrete AMI id (region-specific DL Base GPU AMI). Omit to use the composition default.
                    Must be a real ami-... id, never a resolve:ssm: alias.
                servePort: {type: string, default: "8000"}
                region:
                  type: string
                  default: us-west-2
                  description: >-
                    AWS region. Also exported to the vLLM container as AWS_REGION, because the Run:ai
                    streamer infers NO region from the s3:// URI.
                # NO availabilityZone and NO subnetId. There was an Optional subnetId
                # "to force a specific subnet/AZ"; it is gone, because forcing one AZ
                # is now precisely the anti-pattern this XRD exists to avoid — it
                # would collapse a multi-pool fleet back to the single pool whose
                # exhaustion caused TALOS-i91u. Nothing here is AZ-scoped, so AWS
                # places the instance in whichever AZ of this VPC has capacity, which
                # is exactly what its InsufficientInstanceCapacity guidance asks for.
                # If a specific subnet ever genuinely becomes necessary it belongs on
                # the fleet's per-override subnetId, not as a claim-level pin.
                vpcId:
                  type: string
                  description: >-
                    VPC for the egress-only security group. Keep it the VPC whose DEFAULT subnets AWS will
                    choose from — no subnet is named anywhere, so the default subnets are where the box lands.
                # Interactive mode (SSM). NO default: unset => the composition patch
                # is skipped (Optional) and the box launches with no profile/SSM.
                # The XGPUInstance SG is EGRESS-ONLY (no inbound), so without this
                # the box is UNREACHABLE once booted — set it to get a shell and to
                # port-forward vLLM :servePort via `aws ssm start-session`.
                # NOTE: this profile now does MORE than SSM + the seed write. vLLM
                # ITSELF authenticates to S3 through it on EVERY boot (the Run:ai
                # streamer uses the AWS SDK default credential chain, i.e. IMDS), so
                # it needs s3:GetObject + s3:ListBucket as well as the s3:PutObject
                # the cold seed uses. `catalyst-gpu-seeder` has all of them; plain
                # `catalyst-ssm` has SSM only, and a box using it CANNOT LOAD WEIGHTS
                # AT ALL now — it is no longer merely "read-only models".
                instanceProfileName:
                  type: string
                  description: >-
                    IAM instance profile NAME to attach. Use catalyst-gpu-seeder: vLLM streams weights from S3
                    via IMDS credentials, so S3 READ is now mandatory, not just the seed's write. Omit for
                    none — and then nothing can load weights.
            status:
              type: object
              properties:
                # NO publicIp. A Fleet of type `maintain` does not report its
                # instances (fleetInstanceSet is "available only when type is set to
                # instant"), so the old ToCompositeFieldPath would have had nothing to
                # read and the field would be a permanent lie. It was not
                # load-bearing: the SG is egress-only so a public IP reaches nothing,
                # scripts/gpu-tunnel.sh resolves the box by its Name tag over SSM, and
                # the one consumer — the dormant gpu-broker's "status.publicIp ->
                # rewrite the EndpointSlice" note — is a scaffold with no image, and
                # already stale against this XRD (it also stamps an XGPUCache that no
                # longer exists).
                #
                # What replaces it is better: these three answer "did AWS actually
                # find me a machine?", which is the question that cost a day.
                fleetId:
                  type: string
                  description: >-
                    EC2 Fleet id (fleet-...). `aws ec2 describe-fleet-instances --fleet-id` lists what it
                    launched, and `describe-fleet-history` says what it tried.
                fleetState:
                  type: string
                  description: >-
                    Fleet state, e.g. active / failed. `active` with fulfilledCapacity 0 means it is still
                    hunting for capacity across the pool.
                fulfilledCapacity:
                  type: number
                  description: "Instances actually running. 0 = no pool had capacity yet; 1 = the rig is up."
