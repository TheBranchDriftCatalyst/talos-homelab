---
# Cost backstop for the poc-demo GPU test rig (gpu-test-rig.yaml). Deletes any
# XGPUInstance labelled catalyst.io/stage=poc-demo older than 6h.
#
# WHY a separate reaper: the gpu-inference tier-1 reaper (gpu-instance-reaper)
# only targets part-of=gpu-inference and also reaps on "gateway at 0 replicas",
# which would instakill a manual test box. The test rig is deliberately outside
# that path, so it had NO backstop until now.
#
# SAME Flux tension as redteam-reaper: while the rig's on-switch is UNCOMMENTED in
# git, deleting the XR here just makes Flux recreate it next reconcile — so this
# only truly reaps once the switch is re-commented. While ON it caps a single
# box's age (churns at 6h). Git-off is the real teardown; this is belt, not braces.
# g6e.xlarge spot is ~$1.86/hr, so do not rely on this — turn it OFF when done.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-testrig-reaper
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-testrig-reaper
rules:
  - apiGroups: ["aws.catalyst.io"]
    resources: ["xgpuinstances"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-testrig-reaper
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gpu-testrig-reaper}
subjects:
  - {kind: ServiceAccount, name: gpu-testrig-reaper, namespace: crossplane-system}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-testrig-reaper
  namespace: crossplane-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: gpu-testrig-reaper
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: reaper
              image: alpine/k8s:1.34.9
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Guard on the RESOURCE (SA has xgpuinstances list), NOT the CRD object — the SA has no
                  # customresourcedefinitions RBAC, so `kubectl get crd` always failed silently and the
                  # reaper NEVER reaped (this is why the 9h g6e box was never backstopped). CRD absent => errors => exit 0.
                  kubectl get xgpuinstance >/dev/null 2>&1 || { echo "no XGPUInstance CRD / no access; nothing to reap"; exit 0; }
                  NOW=$(date +%s); MAX=21600  # 6h — generous window for an active test session; git-off is the real teardown
                  R=$(mktemp)  # tally reaped names across the pipe subshell (count survives in the file)
                  kubectl get xgpuinstance -l catalyst.io/stage=poc-demo \
                    -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.creationTimestamp}{"\n"}{end}' | while read -r name ts; do
                    [ -z "$name" ] && continue
                    age=$(( NOW - $(date -d "$ts" +%s) ))
                    if [ "$age" -gt "$MAX" ]; then echo "reaping $name (age ${age}s > ${MAX}s)"; kubectl delete xgpuinstance "$name" && echo 1 >> "$R"; fi
                  done
                  N=$(wc -l < "$R" 2>/dev/null | tr -d " "); rm -f "$R"; N=${N:-0}
                  echo "reaper done (reaped ${N})"
                  # reaper activity -> pushgateway (dashboard-aws-inventory reaper row); || true so a metrics blip never fails the reaper
                  printf 'reaper_last_run_timestamp_seconds %s\nreaper_last_reaped_count %s\n' "$(date +%s)" "${N}" | curl -s --max-time 10 --data-binary @- http://prometheus-pushgateway.monitoring:9091/metrics/job/gpu-testrig-reaper || true
