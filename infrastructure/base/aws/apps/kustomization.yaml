---
# XFargateApp instances (layer 3, sibling of buckets/) — kind exists only
# after layer 2's XRD. Instances carry REPLACE-ME placeholders until the
# human console-walk in each file's header is done.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hello-whoami.yaml
  # ALWAYS-ON: the shared SSM instance profile (catalyst-ssm). Not an on-switch —
  # it is a free IAM primitive any box references via spec.instanceProfileName to
  # get Session Manager interactive access. See ssm-instance-profile.yaml header.
  - ssm-instance-profile.yaml
  # ALWAYS-ON: cost backstop for the poc-demo GPU test rig (age>2h). See file header.
  - gpu-testrig-reaper.yaml
  # ── ON (2026-09-27) ── gpu-test-rig: g5.xlarge (A10G 24GB) spot serving
  # qwen3-14b-awq via vLLM, catalyst-ssm SSM. On g5 because g6e/L40S spot was dry
  # (1/10) — g5 spot is wide open (9/10). Swap the file back to g6e.xlarge +
  # qwen3-32b-awq when L40S capacity returns or the quota (TALOS-nxt4) lands.
  # Re-comment to tear down (Flux prunes). Reaper is the 2h cost backstop.
  - gpu-test-rig.yaml
  # OFF (2026-09-25). The rest are commented out deliberately -- per this file's own
  # "file = on-switch" idiom, that is the off position. Uncomment to spin up.
  #
  # These never ran: the AWS ProviderConfig had no credentials for 33+ days
  # (its ExternalSecret named a 1Password item that did not exist, fixed in
  # bef5dddd), so the whole stack sat SYNCED=False. The missing credential was
  # acting as an undeclared brake -- restoring it immediately began creating real
  # AWS resources that nobody had actually decided to run.
  #
  # Caught before either g5.xlarge launched (vllm-8b is ON-DEMAND, ~$1/hr), but a
  # 200GB gp3 volume was created first and is removed by pruning these.
  #
  # NOT READY TO ENABLE AS-IS: both claims still carry vpcId: vpc-REPLACE-ME and
  # subnetId: subnet-REPLACE-ME, so they could not have come up correctly anyway.
  # Fill those in before flipping the switch.
  # - vllm-8b.yaml # POC-DEMO: on-demand GPU box — BLOCKED: on-demand G/VT quota is 0 (spot-only); would be rejected
  # - talos-worker-poc.yaml # POC-DEMO: KubeSpan hybrid worker — needs machineconfig secret plumbing first (see file header)
