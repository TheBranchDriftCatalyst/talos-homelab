---
# AWS XR instances (layer 3, sibling of buckets/) — these kinds exist only
# after layer 2's XRDs. Each FILE'S LINE HERE IS ITS ON-SWITCH: uncommented =
# provisioning real AWS resources, commented = the off position.
#
# NOT a resource: gpu-profiles.yaml is a plain sizing/placement table read by
# scripts/check-spot-avail.sh, deliberately left out of the list below so Flux
# ignores it. It lives here so the table and the claims cannot drift apart.
#
# ── RENAMED 2026-10-02 ───────────────────────────────────────────────────────────────
#   gpu-node-27b-fp8  ->  inference-node
#   gpu-node-235b     ->  inference-node-235b
# The old names described the MODEL that happened to be loaded; the new ones describe
# the JOB the box does, which is what survives a model swap. Anything dated before
# 2026-10-02 — the ON->OFF launch logs below, instance tags in AWS, git history,
# aws-inventory-exporter's index-lag docstring — refers to these boxes by their old
# names. Same rigs.
#
# Renaming was safe only because nothing was running: spec.instanceName pins the
# derived `<name>-fleet` managed resource, so a rename under a live box would try to
# create inference-node-fleet while gpu-node-27b-fp8-fleet still owned the instance,
# and `terminateInstances` defaults to FALSE. Both regions were swept clean first.
#
# INVARIANT, newly load-bearing: `inference-node` is a strict PREFIX of
# `inference-node-235b`. Every consumer today matches EXACTLY (EC2 tag:Name filters,
# the crossplane-name tag join, launch-template names) and must stay that way — a
# `Values=inference-node*` filter would silently match BOTH rigs and conflate a
# $2.24/hr box with a $5.17/hr one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hello-whoami.yaml
  # ALWAYS-ON: the shared SSM instance profile (catalyst-ssm). Not an on-switch —
  # it is a free IAM primitive any box references via spec.instanceProfileName to
  # get Session Manager interactive access. See ssm-instance-profile.yaml header.
  - ssm-instance-profile.yaml
  # ALWAYS-ON: the cheap seeder's IAM identity (SSM + scoped S3 + EBS snapshot). Every
  # XGPUInstance uses this now, because the seed-on-miss weights path WRITES to the
  # model bucket. See gpu-seeder-profile.yaml header (TALOS-iymy).
  - gpu-seeder-profile.yaml
  # ── OFF ── LEVEL 2 (TALOS-x1sb): the scoped IAM identity the in-cluster SSM relay
  # Pod uses. Free IAM, no spend — but it is NOT always-on, because it mints a static
  # access key with ssm:StartSession, and there is no reason for that key to exist
  # until the relay does. Uncomment together with gpu-inference/relay-deployment.yaml.
  - gpu-relay-user.yaml
  - ec2fleet-service-linked-role.yaml
  - gpu-api-key-push.yaml
  - ecr-pullthrough-cache.yaml
  # ALWAYS-ON: cost backstop for poc-demo GPU boxes (age > 6h — the window is
  # MAX=21600 in the file, not the 2h this comment used to claim). While a claim is
  # ON in git the reaper's delete is undone by Flux on the next reconcile, so it caps
  # a single box's AGE (churn) rather than tearing it down. See file header.
  - gpu-testrig-reaper.yaml
  # ── OFF (2026-10-01) ── LITTLE BOI (TALOS-iymy): g6e.2xlarge (1× L40S 44.7GiB)
  # on-demand in us-east-2 serving Qwen3.8-27B-FP8 via vLLM. ~$2.24/hr, ~$54/day.
  #
  # OFF IS THE DEFAULT AND THE DEFAULT IS DELIBERATE. Launch it for a test, then
  # re-comment this line and commit. Do not leave it up: there is no scale-to-zero
  # yet (TALOS-5drv.5 is deferred on purpose), so the only cost controls are this
  # line and the 6h reaper — and the reaper CHURNS a running box rather than tearing
  # it down, because Flux puts the XR straight back while this line is uncommented.
  #
  # ON→OFF (2026-10-01): launched i-07c9140f294b30ed9 in us-east-2c after spot and
  # on-demand both refused across every us-west-2 zone. Verified the local-NVMe
  # cache (TALOS-rkg0): instance store came up as nvme1n1 alongside the EBS root at
  # nvme0n1 and mounted at /cache with 419G, which is exactly why the device is
  # identified by its NVMe MODEL string and not by device order. vLLM v0.30.0 image
  # pulled. Torn down before serving - but the 2026-10-02 audit showed its HF download
  # AND its S3 sync had both FINISHED; only the _SEED_COMPLETE marker was missing, so
  # nothing was lost and the next boot took the warm path.
  # ON→OFF (2026-10-02): FIRST SUCCESSFUL END-TO-END RUN (TALOS-x1sb). The fleet walked
  # the whole pool - g6e.2xlarge and g6e.4xlarge both returned Insufficient capacity for
  # ON-DEMAND and were blacklisted 15min - and placed i-009d3f4bb019620e2, a g6.12xlarge
  # (4x L4) in us-east-2b. A bare Instance would have hard-failed on the first shape.
  # The box derived --tensor-parallel-size 4 from nvidia-smi on its own, streamed 30.9GB
  # out of same-region S3 in ~30s via runai_streamer, autodetected quantization=fp8, and
  # answered a completion through the in-cluster relay from the Mac in 1.2s. ~$1.50.
  # - inference-node.yaml
  # ── OFF / HELD (TALOS-iymy) ── BIG BOI: spot g6e.12xlarge (4× L40S) in us-east-2
  # serving Qwen3-235B-A22B-GPTQ-Int4 (vLLM TP4) + ComfyUI. ~$5.2/hr spot — do NOT
  # leave it running unattended ($124/day). Uncomment ONLY on an explicit go, AND
  # after (a) the one-time S3 key copy in its header, and (b) check-spot-avail.sh
  # shows us-east-2 g6e.12xlarge still has capacity.
  # ON→OFF (2026-09-28): launched i-03e0480dd97da94b1, verified 9/9 LLM acceptance
  # tests (Qwen3-235B via vLLM TP4), then torn down (git-off) to stop the ~$5.11/hr.
  # - inference-node-235b.yaml
  # ── OFF ── IMAGE-GEN RIG (TALOS-p412): 1x L40S on-demand in us-east-2 running ComfyUI
  # + comfyui-shim with four selectable SOTA pipelines. ~$2.24/hr on the 2xlarge.
  #
  # APPENDED BELOW THE LLM CLAIMS ON PURPOSE. The operator's Tiltfile takes armed[0] in
  # THIS FILE'S ORDER for its LLM endpoint, so inserting an image rig above them would
  # change which rig chat resolves to. Role filtering makes that safe today, but the
  # ordering is load-bearing enough to write down.
  #
  # Arming it needs, in order: (a) the GHCR package catalyst-comfyui-aws PUBLIC, (b)
  # gpu-inference/image-relay-deployment.yaml armed so an endpoint exists. First boot
  # pays a ~103 GB HuggingFace pull, then seeds S3 so later boots stream in ~90-150s.
  # - gpu-image-l40s.yaml
  #
  # ── RETIRED (2026-09-30) ── gpu-test-rig.yaml (TALOS-455u, the 2026-09-26 g5.xlarge
  # + Qwen3-14B-AWQ POC) is DELETED. It was superseded by inference-node-235b (then
  # named gpu-node-235b) the next day,
  # and the shared composition was then rewritten for the 4-GPU shape, leaving the
  # rig's spec unlaunchable (TP4 on one GPU). inference-node above is its successor.
  #
  # OFF (2026-09-25). The rest are commented out deliberately -- per this file's own
  # "file = on-switch" idiom, that is the off position. Uncomment to spin up.
  #
  # These never ran: the AWS ProviderConfig had no credentials for 33+ days
  # (its ExternalSecret named a 1Password item that did not exist, fixed in
  # bef5dddd), so the whole stack sat SYNCED=False. The missing credential was
  # acting as an undeclared brake -- restoring it immediately began creating real
  # AWS resources that nobody had actually decided to run.
  #
  # Caught before either g5.xlarge launched (vllm-8b is ON-DEMAND, ~$1/hr), but a
  # 200GB gp3 volume was created first and is removed by pruning these.
  #
  # NOT READY TO ENABLE AS-IS: both claims still carry vpcId: vpc-REPLACE-ME and
  # subnetId: subnet-REPLACE-ME, so they could not have come up correctly anyway.
  # Fill those in before flipping the switch. They also predate the `models` ->
  # `hfModel` change, so their specs need updating to the current XRD.
  # - vllm-8b.yaml # POC-DEMO: on-demand GPU box — on-demand G/VT quota is now 48 (was 0)
  # - talos-worker-poc.yaml # POC-DEMO: KubeSpan hybrid worker — needs machineconfig secret plumbing first (see file header)
