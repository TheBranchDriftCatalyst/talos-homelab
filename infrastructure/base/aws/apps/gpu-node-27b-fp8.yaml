---
# ██ LITTLE BOI / TALOS-iymy ██ The everyday rig: spot g6e.2xlarge (1× L40S = 48GB
# VRAM) in us-west-2 serving Qwen3.8-27B-FP8 via vLLM. ~$1.42/hr spot (us-west-2a,
# measured 2026-09-30) — about a quarter of the 4× box (gpu-node-235b.yaml), which is
# why this one is the default ON.
#
# COST: ~$2.24/hr ON-DEMAND (us-west-2 list, $2.24208) => ~$54/day if left up. This
# is NOT a pocket-change box. `scripts/check-spot-avail.sh` before assuming anything.
#
# WHY ON-DEMAND AND NOT SPOT — spot was tried first and is the worse deal here:
#   * Spot price is CAPPED AT on-demand, and on 2026-09-30 g6e.2xlarge spot in
#     us-west-2b/2c sat at $2.2421 vs $2.24208 on-demand: a 0.0% discount for full
#     interruption risk.
#   * The only AZs with a real discount (2a $1.42, 2d $1.94) both refused with
#     InsufficientInstanceCapacity, and the set of "AZs that have capacity" rotated
#     between attempts minutes apart (2b/2c/2d, then 2a/2b/2c). L40S spot placement
#     score is 1/9 — chasing it is whack-a-mole.
#   * On-demand also removes interruption risk, which matters for a box meant to
#     stay up unattended.
# If spot capacity recovers and shows a real discount, add `capacityType: spot`.
#
# REGION — moved to us-east-2 on 2026-09-30. us-west-2 was preferred (it leaves
# us-east-2's 48 vCPU free, which is EXACTLY what big boi's g6e.12xlarge needs), but
# us-west-2 has no g6e.2xlarge capacity at all: after placement was unpinned, AWS
# chose freely across every zone and still returned "Insufficient capacity" with no
# zone named. us-east-2 is an independent capacity pool.
#
# The cost of being here: little boi's 8 vCPU leaves 40 of us-east-2's 48, so big boi
# CANNOT launch concurrently until the pending quota bump to 64 clears. Big boi is
# git-off, so that is latent, not blocking. Move back to us-west-2 (and back to the
# catalyst-tbdc-models bucket + drop the ami override) when L40S capacity returns
# there, or when the quota bump lands.
#
# PLACEMENT IS UNPINNED (TALOS-rkg0). No AZ and no subnet are named, so AWS picks
# the zone that actually has capacity. This is not a convenience — g6e.2xlarge refused
# with InsufficientInstanceCapacity in 2a, then 2d, then 2a again, on spot AND
# on-demand, with the set of zones holding capacity rotating between attempts minutes
# apart. AWS's own guidance is to stop naming a zone, which only became possible once
# /cache moved off zone-scoped EBS onto the instance's local NVMe.
#
# THE FILE'S LINE IN kustomization.yaml IS THE ON-SWITCH.
#
# Why FP8 and not bf16: Qwen3.8-27B in bf16 is 55.6GB and does NOT fit 48GB. The
# official FP8 checkpoint is 30.9GB, and L40S (Ada) does FP8 natively — so this is
# the latest-generation flagship Qwen on ONE GPU, where bf16 needs four.
#
# Weights come from `hfModel` with no manual S3 seeding: the first boot pulls from
# HuggingFace and writes s3://catalyst-tbdc-models/Qwen/Qwen3.8-27B-FP8/ plus a
# _SEED_COMPLETE marker; every boot after syncs from S3 same-region instead.
#
# Reach it via SSM port-forward (`scripts/gpu-tunnel.sh`) — the SG is egress-only,
# so that is the ONLY way in. Mesh-join is a Phase-3 follow-on.
apiVersion: aws.catalyst.io/v1alpha1
kind: XGPUInstance
metadata:
  name: gpu-node-27b-fp8
  # poc-demo opts into gpu-testrig-reaper (age > 6h). While this file is ON in git,
  # the reaper deleting the XR just makes Flux recreate it — so 6h is a CHURN
  # (new instance, re-sync from S3), not a teardown. Cheap here; git-off is the
  # real teardown. scripts/gpu-tunnel.sh re-resolves the instance id so a churn
  # does not strand the local tunnel.
  labels: {catalyst.io/stage: poc-demo}
spec:
  instanceName: gpu-node-27b-fp8
  instanceType: g6e.2xlarge         # 1× L40S 48GB, 8 vCPU — fits us-west-2's 32-vCPU G/VT spot quota
  hfModel: Qwen/Qwen3.8-27B-FP8     # 30.9GB across 64 layer shards + mtp + outside
  modelsBucket: catalyst-tbdc-models-use2  # us-east-2 bucket => same-region sync (free, fast)
  # Two aliases, space-separated (vLLM serves both; reports the first).
  #   qwen3.8-27b      — the honest name for what this box runs
  #   qwen3.8:27b-mlx  — the tag the Mac's local Ollama uses for the SAME MODEL
  #                      GENERATION (Qwen3.8-27B; MLX on the Mac, FP8 here).
  # The alias is what keeps ~/.catalyst/llm-config.yaml a single shared file:
  # models.default_chat stays qwen3.8:27b-mlx, so the launchd :9091 service keeps
  # resolving it against local Ollama while the Tilt :9092 service resolves the
  # very same string against this box over the tunnel. Without it, pointing :9092
  # here would break :9091's chat, because get_default_chat_model() reads that one
  # yaml for both processes.
  servedModelName: "qwen3.8-27b qwen3.8:27b-mlx"
  # capacityType is DELIBERATELY OMITTED => ON-DEMAND. See the header for why spot
  # lost here. Absence is how on-demand is expressed (no on-demand marketType exists).
  tensorParallelSize: "1"           # ONE GPU on this shape
  quantization: "auto"              # FP8 checkpoint self-describes; omitting the flag is correct
  maxModelLen: "32768"
  gpuMemoryUtilization: "0.90"      # 43.2GB of 48 − 30.9GB weights ≈ 12GB KV cache
  enableImageGen: "false"           # no spare VRAM here, and the GHCR bundle image does not exist yet
  # No cache volume: /cache is this shape's 450GB local NVMe instance store.
  servePort: "8000"
  region: us-east-2
  # The composition's default AMI is us-west-2-specific and AMI ids are regional,
  # so moving region REQUIRES setting this. Same id big boi uses.
  ami: ami-07173ded18b6f3a7b        # us-east-2 DL Base GPU AMI (AL2023 x86_64 NVIDIA)
  # vpcId is only for the egress-only SG. No subnet is set, so AWS places this in
  # whichever zone has capacity, choosing among this VPC's default subnets.
  vpcId: vpc-0fa8197c81c9c151f      # us-east-2 default VPC
  # catalyst-gpu-seeder, NOT catalyst-ssm: the cold path WRITES the weights to S3,
  # which needs s3:PutObject. This profile carries that plus AmazonSSMManagedInstanceCore.
  instanceProfileName: catalyst-gpu-seeder
