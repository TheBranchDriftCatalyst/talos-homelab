---
# ██ POC-DEMO ██ outpost-demo (TALOS-outpost) — the first "outpost": a small
# always-on AWS box with a PUBLIC endpoint, serving traefik/whoami over plain
# HTTP at http://outpost.amberdark.net.
#
# WHAT THIS PROVES, end to end: Crossplane -> EC2 -> userData -> docker ->
# public IP -> external-dns (the -amberdark instance) -> Cloudflare -> browser.
# It is the smallest thing that demonstrates the whole chain, and `git revert`
# deletes it.
#
# ── ALWAYS-ON, AND THEREFORE *NOT* LIKE THE GPU RIGS ───────────────────────────
# The gpu-inference precedent is EPHEMERAL: HOT->WARM->COLD reaper CronJobs, and
# the XR deliberately NOT committed so Flux cannot resurrect a box that
# self-terminated. This box inverts all three on purpose:
#   * the XR IS committed, and Flux SHOULD reassert it — a dead outpost coming
#     back is the desired behaviour, not a zombie
#   * NO reaper. gpu-testrig-reaper.yaml only matches XGPUInstance anyway, but
#     more importantly a reaper on a COMMITTED XR is an outage generator: it
#     deletes, Flux recreates, you get a new public IP and ~2min of downtime
#     every cycle. Do not copy that pattern here.
#   * the cost backstop is a budget alarm + "box has been up N days" alert
#     (TALOS-outpost follow-up), not an age cap.
# The on-switch is still this file's line in kustomization.yaml.
#
# ── SECURITY, STATED PLAINLY ──────────────────────────────────────────────────
# openPort renders an ingress SecurityGroupRule whose cidrBlocks is HARDCODED to
# 0.0.0.0/0 in xinstance-composition.yaml — there is no CIDR field in the XRD.
# So port 80 here is open to the entire internet. That is intended for a public
# whoami and is NOT acceptable for anything with state or secrets.
# This box gets NO homelab credential: no 1Password reach, no kubeconfig, no
# cluster token. userData is committed to git and so must stay secret-free —
# anything it ever needs goes 1Password -> ESO PushSecret -> SSM Parameter Store
# and is read at boot with the instance profile (see gpu-inference/api-key-push.yaml).
# userData is readable from IMDS and via ec2:DescribeInstanceAttribute. Never a secret.
#
# ami: AL2023 **arm64** for t4g (resolved 2026-10-20, us-west-2):
#   aws ssm get-parameter --region us-west-2 \
#     --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
# Must be a CONCRETE ami-... id: upjet passes resolve:ssm: aliases through
# literally and DescribeImages rejects them (InvalidAMIID.Malformed).
# ⚠ Do NOT copy ami-075d448db8fb256af from the aws-redteam claims — that is
# x86_64 and will not boot a t4g.
apiVersion: aws.catalyst.io/v1alpha1
kind: XInstance
metadata:
  name: outpost-demo
  labels:
    catalyst.io/stage: poc-demo
    catalyst.io/cloud: aws
    catalyst.io/component: outpost
spec:
  instanceName: outpost-demo
  # t4g.micro = 1 GiB, ample for docker + whoami. ~$6.13/mo + $0.80 EBS +
  # $3.65 public IPv4 = ~$10.6/mo. NOTE this is NOT enough for k3s (+Cilium,
  # whose agent alone requests 1536Mi) — that would be a t4g.medium conversation.
  instanceType: t4g.micro
  ami: ami-0957e38de3db270cc # al2023 kernel-6.18 arm64, us-west-2
  rootVolumeGb: 10
  region: us-west-2
  vpcId: vpc-3536d651 # default VPC
  subnetId: subnet-36191741 # us-west-2a, default-for-az (public IP on launch)
  openPort: 80 # XInstance allows exactly ONE port, and it is 0.0.0.0/0
  instanceProfileName: catalyst-ssm # SSM shell for debug: no key pair, no inbound 22
  # No `set -eu`: the gpu-inference userData learned the hard way that it aborts
  # before the workload ever starts on any transient error. Log to a file so it
  # is inspectable over SSM (`aws ssm start-session`), since there is no SSH.
  userData: |
    #!/bin/bash
    exec > >(tee -a /var/log/outpost-init.log) 2>&1
    echo "=== outpost-demo init $(date -Is) ==="
    dnf install -y docker || echo "FATAL: docker install failed"
    systemctl enable --now docker || echo "FATAL: docker failed to start"
    docker run -d --restart=always --name whoami -p 80:80 traefik/whoami:v1.11 \
      || echo "FATAL: whoami failed to start"
    docker ps
    echo "=== outpost-demo init done $(date -Is) ==="
