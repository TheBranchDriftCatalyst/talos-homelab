---
# ██ POC-DEMO ██ XTalosWorker concept, expressed through XInstance: an EC2 box
# that boots Talos and JOINS THIS CLUSTER as a worker over KubeSpan (WireGuard
# mesh — talos.dev/kubespan). Same cluster, same Flux/secrets/Grafana; pin
# workloads with nodeSelector kubernetes.io/hostname=aws-worker-0.
# GATE 2 (beyond creds): userData needs a real worker machineconfig with
# kubespan enabled — generate via `talosctl gen config --with-kubespan` from
# cluster secrets; DO NOT commit it raw (contains join token) — the v1alpha2
# refinement pulls it from 1Password via ESO. Until then this stays commented
# out of kustomization.yaml. ami = Talos release AMI for us-west-2 (see
# factory.talos.dev / Talos AWS docs for the current v1.13.x AMI id).
apiVersion: aws.catalyst.io/v1alpha1
kind: XInstance
metadata:
  name: aws-worker-0
  labels: {catalyst.io/stage: poc-demo}
spec:
  instanceName: aws-worker-0
  instanceType: t3.large
  ami: ami-REPLACE-TALOS-1-13-x
  rootVolumeGb: 50
  region: us-west-2
  vpcId: vpc-REPLACE-ME
  subnetId: subnet-REPLACE-ME
  openPort: 0 # KubeSpan dials out; no inbound needed with discovery service
  userData: |
    # REPLACE with talosctl-generated worker.yaml (kubespan: enabled) via ESO
