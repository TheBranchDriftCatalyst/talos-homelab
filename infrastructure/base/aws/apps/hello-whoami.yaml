---
# Trivial first XFargateApp: traefik/whoami — echoes request info on :80.
# ~$9/mo while running; delete the file to deprovision everything.
#
# ██ HUMAN GATE (TALOS-3g8f + console walk) ██ Fill the two REPLACE values:
#   AWS console → VPC → Your VPCs → copy the DEFAULT VPC id (vpc-...)
#   AWS console → VPC → Subnets → copy TWO subnet ids from that VPC (subnet-...)
apiVersion: aws.catalyst.io/v1alpha1
kind: XFargateApp
metadata:
  name: hello-whoami
spec:
  appName: hello-whoami
  image: traefik/whoami:v1.11
  port: "80"
  cpu: "256"
  memory: "512"
  desiredCount: 1
  region: us-west-2
  vpcId: vpc-REPLACE-ME
  subnetIds:
    - subnet-REPLACE-ME-a
    - subnet-REPLACE-ME-b
