---
# ██ POC-DEMO ██ Spot GPU inference box: vLLM serving Llama-3.1-8B on a g5.xlarge
# (1x A10G 24GB, ~$0.30-0.40/hr spot). THE FILE IS THE ON-SWITCH — commit to
# provision, delete to stop paying. No public port: box is meant to tunnel out
# (add wireguard/tailscale to userData) and be fronted by in-cluster litellm.
# NOTE spot flag lands in v1alpha2 (needs instanceMarketOptions rendering) —
# this POC provisions on-demand; keep sessions short or add spot before real use.
apiVersion: aws.catalyst.io/v1alpha1
kind: XInstance
metadata:
  name: vllm-8b
  labels: {catalyst.io/stage: poc-demo}
spec:
  instanceName: vllm-8b
  instanceType: g5.xlarge
  ami: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  rootVolumeGb: 200
  region: us-west-2
  vpcId: vpc-REPLACE-ME
  subnetId: subnet-REPLACE-ME
  openPort: 0
  userData: |
    #!/bin/bash
    dnf install -y docker && systemctl enable --now docker
    # GPU drivers: use the AL2023 NVIDIA steps or swap ami for the DLAMI alias
    docker run -d --gpus all -p 8000:8000 vllm/vllm-openai:latest \
      --model meta-llama/Llama-3.1-8B-Instruct --max-model-len 8192
