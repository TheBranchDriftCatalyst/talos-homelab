---
# ██ POC-DEMO ██ The model-testing rig (TALOS-455u): spot g5.xlarge + 200GB
# ephemeral cache seeded from the catalyst-tbdc-models S3 library. THE FILE IS
# THE ON-SWITCH: commit → GPU + cache provision + models warm; delete → all of
# it evaporates, library untouched. Swap spec.models between sessions to test
# different sets — cache reseeds on next boot.
apiVersion: aws.catalyst.io/v1alpha1
kind: XGPUInstance
metadata:
  name: gpu-test-rig
  labels: {catalyst.io/stage: poc-demo}
spec:
  instanceName: gpu-test-rig
  instanceType: g5.xlarge           # 1x A10G 24GB (4 vCPU) — g6e/L40S spot was DRY (1/10); g5 spot is wide open (9/10). Swap back to g6e.xlarge for the 32B when L40S capacity returns.
  models: "qwen3-14b-awq"           # 14B AWQ (~10GB) fits A10G 24GB w/ 8k ctx. The 32B (qwen3-32b-awq) is also staged in S3 for the L40S/12xlarge later.
  modelsBucket: catalyst-tbdc-models
  cacheVolumeGb: 200
  servePort: "8000"
  region: us-west-2
  availabilityZone: us-west-2d      # us-west-2a had NO g6e.xlarge capacity (InsufficientInstanceCapacity); 2d has it and is cheapest spot ($1.67)
  vpcId: vpc-3536d651
  subnetId: subnet-a6ed938e         # default subnet for us-west-2d (public-IP-on-launch); EBS cache follows availabilityZone
  instanceProfileName: catalyst-ssm # SSM interactive access — SG is egress-only, this is the ONLY way in (jump pod → shell / vLLM port-forward)
