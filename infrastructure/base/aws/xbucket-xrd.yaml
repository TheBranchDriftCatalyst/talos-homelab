---
# XBucket — the house abstraction for a real AWS S3 bucket (TALOS-hk7i).
# One CR yields: Bucket + Versioning + SSE(AES256, bucket-key) + full
# PublicAccessBlock + lifecycle tiering (STANDARD_IA → GLACIER). Opinionated
# on purpose: encryption and public-block are NOT parameters — every bucket
# gets them. v1alpha2 candidates (TALOS-l8ot): expiration rule, per-bucket IAM.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xbuckets.aws.catalyst.io
spec:
  group: aws.catalyst.io
  names:
    kind: XBucket
    plural: xbuckets
  defaultCompositionRef:
    name: xbucket-aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [bucketName]
              properties:
                bucketName:
                  type: string
                  description: Globally-unique S3 bucket name (becomes the external-name).
                region:
                  type: string
                  default: us-west-2
                versioning:
                  type: boolean
                  default: true
                standardIaAfterDays:
                  type: integer
                  default: 30
                  description: Days before objects transition to STANDARD_IA.
                glacierAfterDays:
                  type: integer
                  default: 90
                  description: Days before objects transition to GLACIER (must be > standardIaAfterDays).
                tags:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                bucketArn:
                  type: string
