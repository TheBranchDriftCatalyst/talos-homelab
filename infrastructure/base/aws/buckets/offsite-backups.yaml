---
# First XBucket: offsite backup target (TALOS-6toq) — the 3-2-1 leg that
# doesn't live on the same MinIO box as everything else. Consumers land as
# follow-ups: Velero second BSL (TALOS-v6q2), CNPG barman offsite ObjectStores
# (TALOS-lajq). Sits Pending until the aws-crossplane 1Password item exists
# (TALOS-3g8f human gate).
apiVersion: aws.catalyst.io/v1alpha1
kind: XBucket
metadata:
  name: offsite-backups
spec:
  bucketName: catalyst-tbdc-offsite-backups
  region: us-west-2
  versioning: true
  standardIaAfterDays: 30
  glacierAfterDays: 90
  tags:
    purpose: offsite-backups
