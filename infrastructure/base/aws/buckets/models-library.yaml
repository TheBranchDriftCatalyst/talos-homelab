---
# The ~1TB model LIBRARY (TALOS-455u) — long-term S3 home for weights.
# IA at 30d (~\$13/TB/mo). glacierAfterDays pushed to 3650 = effectively never:
# plain GLACIER retrieval latency kills the test loop; GLACIER_IR (instant,
# ~\$4/TB/mo) becomes an XBucket storage-class param in v1alpha2 (TALOS-l8ot).
apiVersion: aws.catalyst.io/v1alpha1
kind: XBucket
metadata:
  name: models-library
  labels: {catalyst.io/stage: poc-demo}
spec:
  bucketName: catalyst-tbdc-models
  region: us-west-2
  versioning: false
  standardIaAfterDays: 30
  glacierAfterDays: 3650
  tags: {purpose: model-library}
