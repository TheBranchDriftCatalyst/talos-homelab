---
# Layer 3 (TALOS-hk7i): XBucket instances — split from the XRD because the
# XBucket kind only exists after crossplane processes the XRD; same-batch
# dry-run would deadlock the whole apply (flux validates atomically).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - offsite-backups.yaml
  - models-library.yaml # POC-DEMO: 1TB model coldstore feeding XGPUInstance caches
