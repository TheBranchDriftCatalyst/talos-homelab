---
# Composition for XGPUInstance (POC-DEMO, TALOS-455u). Members: SG (egress-only
# — the box TUNNELS OUT, no public inference port), spot GPU Instance, gp3
# cache Volume + Attachment. Cache mounts at /cache, seeded via s5cmd
# (same-region S3→EC2 = free transfer, ~1-2GB/s: 8B warm in ~10s).
# AMI: AWS Deep Learning Base GPU AMI via SSM alias (NVIDIA drivers included) —
# VERIFY the alias on unblock day, it's the most drift-prone line here.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xgpuinstance-aws
  labels: {catalyst.io/stage: poc-demo}
spec:
  compositeTypeRef: {apiVersion: aws.catalyst.io/v1alpha1, kind: XGPUInstance}
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef: {name: function-patch-and-transform}
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: sg
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroup
              spec:
                forProvider:
                  region: us-west-2
                  description: xgpuinstance egress-only (managed by crossplane, poc-demo)
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.vpcId, toFieldPath: spec.forProvider.vpcId}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceName, toFieldPath: spec.forProvider.name}
          - name: sg-egress
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                forProvider:
                  region: us-west-2
                  type: egress
                  protocol: "-1"
                  fromPort: 0
                  toPort: 0
                  cidrBlocks: ["0.0.0.0/0"]
                  securityGroupIdSelector: {matchControllerRef: true}
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
          - name: cache-volume
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: EBSVolume
              spec:
                forProvider:
                  region: us-west-2
                  type: gp3
                  size: 200
                  tags: {purpose: xgpu-model-cache}
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.availabilityZone, toFieldPath: spec.forProvider.availabilityZone}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.cacheVolumeGb, toFieldPath: spec.forProvider.size}
              # Pre-seeded warm cache (TALOS-iymy): restore /cache from a snapshot the small seeder built,
              # so the GPU box never downloads models. Optional — unset => blank gp3 volume.
              - {type: FromCompositeFieldPath, fromFieldPath: spec.cacheSnapshotId, toFieldPath: spec.forProvider.snapshotId, policy: {fromFieldPath: Optional}}
          - name: cache-attachment
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: VolumeAttachment
              spec:
                forProvider:
                  region: us-west-2
                  deviceName: /dev/sdf
                  instanceIdSelector: {matchControllerRef: true}
                  volumeIdSelector: {matchControllerRef: true}
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
          - name: instance
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: Instance
              spec:
                forProvider:
                  region: us-west-2
                  # upjet provider-aws does NOT support the resolve:ssm: alias (it passes the
                  # literal to DescribeImages -> InvalidAMIID.Malformed). Use the CONCRETE
                  # DL Base GPU AMI id (AL2023, x86_64, NVIDIA drivers). us-west-2, resolved
                  # 2026-09-26 from /aws/service/deeplearning/.../base-oss-nvidia-driver-gpu-amazon-linux-2023.
                  # Re-resolve if a launch fails on a deregistered AMI (TALOS-3hjh: make this a spec field).
                  ami: ami-0138b0ae7d33b5753
                  instanceType: g5.xlarge
                  vpcSecurityGroupIdSelector: {matchControllerRef: true}
                  instanceMarketOptions:
                    - marketType: spot
                  rootBlockDevice:
                    # DL Base GPU AMI root snapshot is 75GB, so this must be >=75; 100
                    # leaves room for the OS/drivers + the ~10GB vllm-openai image.
                    # (model weights live on the separate cacheVolumeGb gp3 at /cache.)
                    - volumeSize: 100
            patches:
              - {type: FromCompositeFieldPath, fromFieldPath: spec.region, toFieldPath: spec.forProvider.region}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceType, toFieldPath: spec.forProvider.instanceType}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.subnetId, toFieldPath: spec.forProvider.subnetId}
              # Region-specific AMI (TALOS-iymy). Optional patch overrides the us-west-2 default above with a
              # concrete per-region DL GPU AMI (e.g. us-east-2). upjet rejects resolve:ssm: so it must be an id.
              - {type: FromCompositeFieldPath, fromFieldPath: spec.ami, toFieldPath: spec.forProvider.ami, policy: {fromFieldPath: Optional}}
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceName, toFieldPath: "spec.forProvider.tags[Name]"}
              # SSM interactive mode. Optional patch — no-op when spec.instanceProfileName
              # is unset. This SG is egress-only, so attaching the profile is the ONLY
              # way to reach the box (shell + `aws ssm start-session ... AWS-StartPortForwardingSession` to vLLM).
              - {type: FromCompositeFieldPath, fromFieldPath: spec.instanceProfileName, toFieldPath: spec.forProvider.iamInstanceProfile, policy: {fromFieldPath: Optional}}
              - {type: ToCompositeFieldPath, fromFieldPath: status.atProvider.publicIp, toFieldPath: status.publicIp}
              - type: CombineFromComposite
                combine:
                  # %s order MUST match this list: models, modelsBucket, servePort, servePort, models
                  variables:
                    - {fromFieldPath: spec.models}
                    - {fromFieldPath: spec.modelsBucket}
                    - {fromFieldPath: spec.servePort}
                    - {fromFieldPath: spec.servePort}
                    - {fromFieldPath: spec.models}
                  strategy: string
                  string:
                    fmt: |
                      #!/bin/bash
                      # TALOS-iymy MVP serving (vllm-single): the big model on vLLM TP4 + ComfyUI sharing VRAM.
                      # NO `set -eu` (lesson: it aborted before vLLM ever started on any transient error).
                      # Logs to /var/log/gpu-init.log; inspect via SSM. Mesh-join is a Phase-3 follow-on — a
                      # first launch is reachable via `aws ssm start-session ... AWS-StartPortForwardingSession`.
                      exec > >(tee /var/log/gpu-init.log) 2>&1; set -x
                      # --- mount the model cache (gp3; Nitro renames /dev/sdf -> /dev/nvmeXn1; wait for attach) ---
                      for i in $(seq 1 40); do D=$(readlink -f /dev/sdf 2>/dev/null || true); [ -b "$D" ] && break; [ -b /dev/nvme1n1 ] && { D=/dev/nvme1n1; break; }; sleep 5; done
                      blkid "$D" >/dev/null 2>&1 || mkfs.xfs "$D"
                      mkdir -p /cache && mount "$D" /cache || true
                      # --- s5cmd (PINNED: the /latest/download/s5cmd_Linux-64bit.tar.gz asset 404s -> silent no-binary) ---
                      curl -fsSL https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Linux-64bit.tar.gz | tar xz -C /usr/local/bin s5cmd
                      # --- same-region S3 -> /cache (fast; the big GPU never touches HuggingFace) ---
                      for m in %s; do /usr/local/bin/s5cmd sync "s3://%s/$m/*" "/cache/$m/"; done
                      # --- LLM: vLLM GPTQ-Int4, TP4 across all 4 L40S, util 0.78 (leaves VRAM for ComfyUI), on :%s ---
                      docker run -d --restart=always --name vllm --gpus all --ipc=host -p %s:8000 \
                        -v /cache:/cache -e HF_HOME=/cache/hf vllm/vllm-openai:latest \
                        --model "/cache/%s" --served-model-name qwen3-235b \
                        --tensor-parallel-size 4 --quantization gptq_marlin \
                        --gpu-memory-utilization 0.78 --max-model-len 32768 --trust-remote-code
                      # --- Image gen: ComfyUI + comfyui-shim (OpenAI /v1/images on :8012), sharing VRAM.
                      #     `|| true`: runpod-mac-bundle is built+pushed separately; a launch before it exists
                      #     still brings up vLLM. Ollama/Whisper disabled — vLLM owns the LLM path. ---
                      docker run -d --restart=always --name comfy --gpus all -p 8012:8012 -p 8188:8188 \
                        -v /cache:/workspace -e ENABLE_OLLAMA=false -e ENABLE_WHISPER=false \
                        -e ENABLE_COMFYUI=true -e ENABLE_COMFYUI_SHIM=true \
                        ghcr.io/thebranchdriftcatalyst/runpod-mac-bundle:latest || true
                toFieldPath: spec.forProvider.userData
