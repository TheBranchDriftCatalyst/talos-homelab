---
# Default deny all traffic in the iocaine namespace. The tarpit must not be
# able to reach anything except what's explicitly allowed below.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all
  namespace: iocaine
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# Allow egress to kube-dns ONLY (required for pod startup / any DNS). Copied
# from the honeypot DNS-egress rule shape.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: iocaine
spec:
  endpointSelector:
    matchLabels:
      app: iocaine
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow ingress to :8080 ONLY from the Traefik pods (which proxy caught bots
# in). No other source may reach the tarpit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: iocaine
spec:
  endpointSelector:
    matchLabels:
      app: iocaine
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
