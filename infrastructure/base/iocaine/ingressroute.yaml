---
# Public HTTPS maze at trap.knowledgedump.space. This is the honeypot front
# door: anything hitting this host is served iocaine's infinite garbage maze.
# Modeled on the Zot public-HTTPS route.
#
# DNS-only routes to the origin. The bundled iocaine handler can itself return
# 421 for ordinary browser user agents; a recognized crawler such as GPTBot
# receives the maze. A 421 alone is not evidence of Cloudflare or ingress failure.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: iocaine-public
  namespace: iocaine
  annotations:
    external-dns.alpha.kubernetes.io/hostname: trap.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`trap.knowledgedump.space`)
      kind: Rule
      services:
        - name: iocaine
          port: 8080
---
# HTTP -> HTTPS redirect for the public host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: iocaine-public-http
  namespace: iocaine
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`trap.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: iocaine
          port: 8080
---
# Internal LAN maze at http://trap.talos00 — plain HTTP, no TLS, no Cloudflare,
# no wildcard-cert HTTP/2 coalescing. The reliable way to view the tarpit from
# the LAN (requires the *.talos00 /etc/hosts entry). Same iocaine backend.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: iocaine-internal
  namespace: iocaine
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "iocaine tarpit"
    gethomepage.dev/description: "LLM/AI-crawler sinkhole maze"
    gethomepage.dev/group: "Infrastructure"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`trap.talos00`)
      kind: Rule
      services:
        - name: iocaine
          port: 8080
