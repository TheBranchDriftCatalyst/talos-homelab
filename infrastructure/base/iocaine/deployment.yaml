---
# iocaine — "the deadliest poison known to AI". A Rust LLM/scraper tarpit that
# serves an infinite maze of Markov-generated garbage. A Traefik Middleware
# (defined elsewhere) proxies caught bots to http://iocaine.iocaine.svc:8080.
#
# Image: git.madhouse-project.org/iocaine/iocaine — the OFFICIAL image, built &
# published by upstream (Gergely Nagy / algernon) via their Forgejo CI to their
# own registry. `:3.5.0` is the latest stable release (main is a 4.0.0 dev
# snapshot; 3.x is the recommended stable branch). Tags `:3` and `:latest` also
# exist. Nix-built static musl binary, multi-arch (amd64/arm64), ~11MB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iocaine
  namespace: iocaine
  labels:
    app: iocaine
    app.kubernetes.io/name: iocaine
    app.kubernetes.io/component: tarpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iocaine
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: iocaine
        app.kubernetes.io/name: iocaine
        app.kubernetes.io/component: tarpit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iocaine
          image: git.madhouse-project.org/iocaine/iocaine:3.5.0
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT baked into the image is `iocaine --config-path
          # /etc/config.d`; we override so the image's default :42069 bind
          # config is NOT loaded and only our /etc/iocaine/config.d (:8080) is.
          # `start` matches upstream's systemd unit and the published K8s
          # install. --config-path may be a directory (loads *.kdl within).
          command: ["iocaine"]
          args:
            - "--config-path"
            - "/etc/iocaine/config.d"
            - "start"
          env:
            - name: RUST_LOG
              value: "iocaine=info"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit (avoid throttling); memory capped. iocaine is a
              # tiny Rust binary — generation is cheap.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            # Handler config — subPath so it lands as a single file inside the
            # config-path dir (matches the published K8s install pattern).
            - name: config
              mountPath: /etc/iocaine/config.d/config.kdl
              subPath: config.kdl
              readOnly: true
            # Markov corpus + wordlist, referenced by config.kdl `sources`.
            - name: corpus
              mountPath: /etc/iocaine/corpus
              readOnly: true
            # Writable dirs required under readOnlyRootFilesystem=true. The
            # image sets WorkingDir=/data and declares a /data volume; iocaine
            # also uses a runtime dir. emptyDir keeps them ephemeral.
            - name: data
              mountPath: /data
            - name: run
              mountPath: /run/iocaine
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: iocaine-config
        - name: corpus
          configMap:
            name: iocaine-corpus
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
