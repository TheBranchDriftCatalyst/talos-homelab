---
# ClusterIP fronting iocaine. Name/namespace/port are load-bearing: a Traefik
# Middleware elsewhere proxies caught bots to
# http://iocaine.iocaine.svc.cluster.local:8080 — do NOT rename.
apiVersion: v1
kind: Service
metadata:
  name: iocaine
  namespace: iocaine
  labels:
    app: iocaine
    app.kubernetes.io/name: iocaine
    app.kubernetes.io/component: tarpit
spec:
  type: ClusterIP
  selector:
    app: iocaine
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
