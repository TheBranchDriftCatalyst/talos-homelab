---
# Wednesday 03:07 UTC — restart CDI's TLS front-ends (cdi-apiserver,
# cdi-uploadproxy) by pod deletion.
#
# Why: cdi-operator rotates the serving-cert Secrets on a ~4 day cadence,
# but a long-running cdi-apiserver pod keeps serving the ORIGINAL cert
# from memory and never reloads. Found 2026-08-12: an 82-day-old
# cdi-apiserver was serving a cert that expired 08-09, which broke the
# datavolume-mutate webhook — every DataVolume create/update in the
# cluster failed with "x509: certificate has expired". A weekly pod
# bounce keeps the served cert inside its validity window.
#
# Pod DELETION, not `rollout restart`: cdi-operator manages these
# Deployments and reverts template annotations (same behavior as
# virt-operator with virt-api — see kubevirt cert-rotation gotcha).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wedge-buster-cdi-certs
  namespace: kube-system
  labels:
    app.kubernetes.io/name: wedge-buster
    app.kubernetes.io/component: maintenance
    wedge-buster.io/target: cdi-certs
spec:
  schedule: "7 3 * * 3"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wedge-buster
            wedge-buster.io/target: cdi-certs
        spec:
          serviceAccountName: wedge-buster
          restartPolicy: OnFailure
          containers:
            - name: restart
              image: bitnami/kubectl:latest
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "== $(date -u) bounce cdi TLS front-ends =="
                  kubectl -n cdi delete pod -l cdi.kubevirt.io=cdi-apiserver --wait=false
                  kubectl -n cdi delete pod -l cdi.kubevirt.io=cdi-uploadproxy --wait=false
                  kubectl -n cdi wait pod -l cdi.kubevirt.io=cdi-apiserver --for=condition=ready --timeout=5m
                  kubectl -n cdi wait pod -l cdi.kubevirt.io=cdi-uploadproxy --for=condition=ready --timeout=5m
                  echo "== $(date -u) done =="
# NOTE: the pod delete/list Role+RoleBinding for this job live in
# infrastructure/base/kubevirt/wedge-buster-rbac.yaml — this kustomization's
# `namespace: kube-system` transformer would stomp their `namespace: cdi`.
