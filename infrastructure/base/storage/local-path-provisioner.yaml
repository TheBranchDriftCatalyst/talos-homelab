---
# local-path-provisioner for app configs (SQLite databases)
# CRITICAL: Arr apps use SQLite which CANNOT use NFS due to locking issues
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: ['']
    resources: ['nodes', 'persistentvolumeclaims', 'configmaps']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['endpoints', 'persistentvolumes', 'pods']
    verbs: ['*']
  - apiGroups: ['']
    resources: ['events']
    verbs: ['create', 'patch']
  - apiGroups: ['storage.k8s.io']
    resources: ['storageclasses']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          # Measured 24h to 2026-08-24: p50 19Mi, peak 29Mi (1.5x).
          # BURSTABLE rather than req==lim: 1.5x is not flat enough to pin,
          # and losing this stops PV provisioning for every local-path PVC
          # in the cluster. 32Mi is the floor — below that the request costs
          # more in eviction ranking than it buys the scheduler.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
# Same provisioner, same node-local paths, but the volume SURVIVES its claim.
#
# WHY THIS EXISTS. `local-path` above reclaims Delete, so deleting a PVC destroys
# the data with no confirmation and no trace. That is correct for the overwhelming
# majority of local-path volumes here, which hold caches and rebuildable state --
# but it has already caused silent data loss twice: CrowdSec's LAPI lost every
# registered machine to a PVC recreate, and Zot (which holds the ONLY retrievable
# copy of two container images whose upstream no longer exists) sat on a Delete
# volume until 2026-11-16.
#
# Use this class for a local-path volume whose contents cannot be re-derived from
# git, from an upstream registry, or from a backup. If it CAN be re-derived, prefer
# `local-path` -- a Retain volume leaves a Released PV behind that someone has to
# clean up by hand, and that cost is only worth paying for irreplaceable data.
#
# NOT the default class: `local-path` keeps that annotation deliberately, so this
# one is only ever used by a PVC that names it.
#
# MIGRATION IS NOT IN-PLACE. `storageClassName` is immutable on a bound PVC, so an
# existing volume cannot be moved here by editing the manifest -- Kubernetes will
# reject the apply and the Kustomization will fail until it is reverted. Moving a
# live volume means: provision a new PVC on this class, copy the data, repoint the
# workload, delete the old PVC. For a volume that is already bound, patching the PV
# alone (`persistentVolumeReclaimPolicy: Retain`) gets the same protection for that
# one volume without downtime -- which is what zot-data has today.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
      "nodePathMap":[
        {
          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths":["/var/lib/rancher/local-path-provisioner"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: busybox:1.37.0 # pinned (TALOS-s8n) — unpinned :latest was the last floating tag here
        imagePullPolicy: IfNotPresent
