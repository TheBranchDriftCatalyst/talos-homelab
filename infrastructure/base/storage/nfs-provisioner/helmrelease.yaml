---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfs-subdir-external-provisioner
  namespace: kube-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: '>=4.0.0 <5.0.0'
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: kube-system
      interval: 12h

  # KEEP THIS LITERAL. Every other HelmRelease in the repo had its retries stripped in
  # TALOS-a38d.5, because the helmrelease-remediation-defaults Kyverno policy now injects
  # remediation.retries: 3 at admission. This release lives in kube-system, which is in Kyverno's
  # resourceFilters exclusion list, so the webhook NEVER sees it -- removing these lines here
  # would silently drop it to Flux's retries: 0 default, not to 3.
  install:
    crds: Create
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  # The chart doesn't expose arbitrary SC annotations — patch it in. Marks
  # fatboy-nfs-appdata as KubeVirt/CDI's default virtualization StorageClass
  # (RWX-capable NFS beats the degraded local-path k8s default for VM disks;
  # clears CDIDefaultStorageClassDegraded). SMP, not JSON add — see
  # helm-postrenderer gotcha (silent abort on missing parent path).
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: fatboy-nfs-appdata
                annotations:
                  storageclass.kubevirt.io/is-default-virt-class: "true"
            target:
              kind: StorageClass
              name: fatboy-nfs-appdata

  values:
    nfs:
      server: ${SYNOLOGY_IP}
      path: /volume1/appdata
      mountOptions:
        - vers=4.1
        - nolock
        - tcp
        - rsize=1048576
        - wsize=1048576
        - hard
        - timeo=600
        - retrans=2
        - noatime
        - nodiratime

    storageClass:
      name: fatboy-nfs-appdata
      defaultClass: false
      allowVolumeExpansion: true
      reclaimPolicy: Retain
      archiveOnDelete: true
      accessModes: ReadWriteMany
      pathPattern: '$${.PVC.namespace}/$${.PVC.name}'

    # Resources for homelab
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
