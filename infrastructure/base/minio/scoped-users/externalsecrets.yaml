---
# Scoped MinIO users for the object-store consumers that currently authenticate with
# ROOT credentials (TALOS-xgrl.12): mimir, tempo, loki, velero. Each gets a dedicated
# user + a policy limited to its own bucket, replacing full-instance root access.
#
# Same pattern as cnpg-backup (TALOS-xgrl.2): ESO generates each secret ONCE
# (refreshInterval: 0, no rotation) in the minio namespace; reflector fans it to the
# consumer's namespace; the provisioner CronJob asserts the MinIO user + bucket policy.
# Secrets are named `<consumer>-s3-scoped` (distinct from the live root-based
# `<consumer>-s3-credentials`) so users can be provisioned + verified BEFORE cutover.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: minio-scoped-password, namespace: minio}
spec: {length: 40, digits: 10, symbols: 0, symbolCharacters: "", noUpper: false, allowRepeat: true}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: mimir-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: mimir-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "monitoring"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring"
      data: {AWS_ACCESS_KEY_ID: "mimir", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
---
