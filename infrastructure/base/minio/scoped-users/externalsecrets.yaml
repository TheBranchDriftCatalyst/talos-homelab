---
# Scoped MinIO users for the object-store consumers that currently authenticate with
# ROOT credentials (TALOS-xgrl.12): mimir, tempo, loki, velero. Each gets a dedicated
# user + a policy limited to its own bucket, replacing full-instance root access.
#
# Same pattern as cnpg-backup (TALOS-xgrl.2): ESO generates each secret ONCE
# (refreshInterval: 0, no rotation) in the minio namespace; reflector fans it to the
# consumer's namespace; the provisioner CronJob asserts the MinIO user + bucket policy.
# Secrets are named `<consumer>-s3-scoped` (distinct from the live root-based
# `<consumer>-s3-credentials`) so users can be provisioned + verified BEFORE cutover.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: minio-scoped-password, namespace: minio}
spec: {length: 40, digits: 10, symbols: 0, symbolCharacters: "", noUpper: false, allowRepeat: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: mimir-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: mimir-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "monitoring"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring"
      data: {AWS_ACCESS_KEY_ID: "mimir", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: tempo-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: tempo-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "monitoring"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring"
      data: {AWS_ACCESS_KEY_ID: "tempo", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: loki-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: loki-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "monitoring"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring"
      data: {AWS_ACCESS_KEY_ID: "loki", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: velero-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: velero-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "backup"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "backup"
      data:
        # AWS_* for the provisioner to read; `cloud` (INI) for velero's AWS plugin.
        AWS_ACCESS_KEY_ID: "velero"
        AWS_SECRET_ACCESS_KEY: "{{ .password }}"
        cloud: |
          [default]
          aws_access_key_id=velero
          aws_secret_access_key={{ .password }}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
---
# boomtime durable social-card cache (gaka-fym5): a scoped MinIO user +
# bucket-limited policy for boomtime's og.png S3 passthrough. Same pattern as
# the consumers above; reflected into the `boomtime` namespace (not monitoring/
# backup) where the boomtime server reads it as BOOM_S3_ACCESS_KEY/SECRET_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: boomtime-cards-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: boomtime-cards-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "boomtime"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "boomtime"
      data: {AWS_ACCESS_KEY_ID: "boomtime-cards", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
---
# fchat-bouncer's saved-image library (its own bucket, its own user).
#
# The app keeps pictures somebody chose to save out of a retention-bounded
# scrollback, so the bytes have to outlive both the message and the remote
# host that served it. They go in object storage rather than Postgres
# deliberately: media in the database means every backup, restore and replica
# carries it, which is the opposite of what the backup work wants.
#
# Reflected into fchat-bouncer, the same way every other consumer here gets
# its credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: fchat-images-s3-scoped, namespace: minio}
spec:
  refreshInterval: "0"
  target:
    name: fchat-images-s3-scoped
    template:
      engineVersion: v2
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "fchat-bouncer"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "fchat-bouncer"
      data: {AWS_ACCESS_KEY_ID: "fchat-images", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
