          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring"
      data: {AWS_ACCESS_KEY_ID: "tempo", AWS_SECRET_ACCESS_KEY: "{{ .password }}"}
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: minio-scoped-password}}
