---
# Idempotent provisioner for the scoped object-store users (TALOS-xgrl.12):
# mimir, tempo, loki, velero — each a MinIO user with a policy limited to its own
# bucket. Reads the ESO-generated secrets (mounted via env from the minio namespace),
# talks only to MinIO (no kube RBAC needed). Re-runs are no-ops.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scoped-users-minio-provision
  namespace: minio
  labels: {app.kubernetes.io/name: scoped-users-provision}
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: scoped-users-provision}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: mc
              image: minio/mc:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: HOME, value: /tmp}
                - {name: MC_CONFIG_DIR, value: /tmp/.mc}
                - {name: ROOT_USER, valueFrom: {secretKeyRef: {name: minio-root-credentials, key: AWS_ACCESS_KEY_ID}}}
                - {name: ROOT_PASS, valueFrom: {secretKeyRef: {name: minio-root-credentials, key: AWS_SECRET_ACCESS_KEY}}}
                - {name: MIMIR_KEY, valueFrom: {secretKeyRef: {name: mimir-s3-scoped, key: AWS_ACCESS_KEY_ID}}}
                - {name: MIMIR_SEC, valueFrom: {secretKeyRef: {name: mimir-s3-scoped, key: AWS_SECRET_ACCESS_KEY}}}
                - {name: TEMPO_KEY, valueFrom: {secretKeyRef: {name: tempo-s3-scoped, key: AWS_ACCESS_KEY_ID}}}
                - {name: TEMPO_SEC, valueFrom: {secretKeyRef: {name: tempo-s3-scoped, key: AWS_SECRET_ACCESS_KEY}}}
                - {name: LOKI_KEY, valueFrom: {secretKeyRef: {name: loki-s3-scoped, key: AWS_ACCESS_KEY_ID}}}
                - {name: LOKI_SEC, valueFrom: {secretKeyRef: {name: loki-s3-scoped, key: AWS_SECRET_ACCESS_KEY}}}
                - {name: VELERO_KEY, valueFrom: {secretKeyRef: {name: velero-s3-scoped, key: AWS_ACCESS_KEY_ID}}}
                - {name: VELERO_SEC, valueFrom: {secretKeyRef: {name: velero-s3-scoped, key: AWS_SECRET_ACCESS_KEY}}}
                - {name: BOOMCARDS_KEY, valueFrom: {secretKeyRef: {name: boomtime-cards-s3-scoped, key: AWS_ACCESS_KEY_ID}}}
                - {name: BOOMCARDS_SEC, valueFrom: {secretKeyRef: {name: boomtime-cards-s3-scoped, key: AWS_SECRET_ACCESS_KEY}}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mc alias set m "http://minio-hl.minio.svc:9000" "$ROOT_USER" "$ROOT_PASS"
                  # $1=key $2=secret $3=bucket $4=policyname
                  provision() {
                    mc mb --ignore-existing "m/$3"
                    printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' "$3" "$3" >/tmp/p.json
                    mc admin policy create m "$4" /tmp/p.json 2>/dev/null || mc admin policy add m "$4" /tmp/p.json 2>/dev/null || true
                    mc admin user add m "$1" "$2" # UPSERT — resets password to current secret every run (2026-08-13 incident: ESO generator re-ran on the v1 API migration, rotated all scoped secrets; the old `|| true` swallowed the drift for hours)
                    mc admin policy attach m "$4" --user "$1" 2>/dev/null || mc admin policy set m "$4" user="$1" 2>/dev/null || true
                    echo "OK: user=$1 bucket=$3 policy=$4"
                  }
                  provision "$MIMIR_KEY"  "$MIMIR_SEC"  mimir  mimir-rw
                  provision "$TEMPO_KEY"  "$TEMPO_SEC"  tempo  tempo-rw
                  provision "$LOKI_KEY"   "$LOKI_SEC"   loki   loki-rw
                  provision "$VELERO_KEY" "$VELERO_SEC" velero velero-rw
                  provision "$BOOMCARDS_KEY" "$BOOMCARDS_SEC" boomtime-cards boomtime-cards-rw
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
