---
# Scoped MinIO credentials for CNPG object-store backups (TALOS-xgrl.2).
# A dedicated `cnpg-backup` user (NOT MinIO root) with write access limited to the
# cnpg-backups bucket — provisioned by the CronJob in provision.yaml.
#
# The secret is GENERATED ONCE (refreshInterval: 0 → ESO never rotates it), so the
# MinIO user's password stays stable. Reflector fans it into each CNPG namespace so
# the clusters' barmanObjectStore can read `cnpg-minio-backup` locally (no brittle
# cross-namespace secret reads).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: cnpg-backup-password
  namespace: minio
spec:
  length: 40
  digits: 10
  symbols: 0          # S3 secret keys: alphanumeric only (symbols break some SigV4 signers)
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-minio-backup
  namespace: minio
spec:
  refreshInterval: "0"   # generate once, never rotate (rotation would strand in-flight backups)
  target:
    name: cnpg-minio-backup
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          # Fan out to every namespace that runs a CNPG cluster with backups.
          # NOTE: editing this list re-syncs the ExternalSecret, which re-runs the
          # Password generator → new secret value. Self-heals: the hourly
          # cnpg-backup-minio-provision CronJob (provision.yaml, :17 past) re-asserts
          # the MinIO user's password from this secret. Backups attempted in the
          # gap fail once and retry at their next scheduled tick.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "authentik,forgejo,home-automation,crowdsec,crossplane-demo,media-private,boomtime,openscad,media,catalyst-data,media-experimental"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "authentik,forgejo,home-automation,crowdsec,crossplane-demo,media-private,boomtime,openscad,media,catalyst-data,media-experimental"
      data:
        ACCESS_KEY_ID: "cnpg-backup"
        ACCESS_SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: cnpg-backup-password
