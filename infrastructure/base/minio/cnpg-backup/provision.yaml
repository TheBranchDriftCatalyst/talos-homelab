---
# Idempotent provisioner: ensures the cnpg-backups bucket + a scoped `cnpg-backup`
# MinIO user with write access limited to that bucket (TALOS-xgrl.2). Runs on a
# schedule so it self-heals (re-asserts the user/policy) and re-runs are no-ops.
# No RBAC needed — it reads creds via env from mounted Secrets, talks only to MinIO.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-backup-minio-provision
  namespace: minio
  labels:
    app.kubernetes.io/name: cnpg-backup-provision
spec:
  schedule: "17 * * * *"        # hourly; drift-correction, not time-sensitive
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cnpg-backup-provision
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: mc
              image: minio/mc:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - name: HOME
                  value: /tmp
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: ROOT_USER
                  valueFrom: {secretKeyRef: {name: minio-root-credentials, key: AWS_ACCESS_KEY_ID}}
                - name: ROOT_PASS
                  valueFrom: {secretKeyRef: {name: minio-root-credentials, key: AWS_SECRET_ACCESS_KEY}}
                - name: BACKUP_KEY
                  valueFrom: {secretKeyRef: {name: cnpg-minio-backup, key: ACCESS_KEY_ID}}
                - name: BACKUP_SECRET
                  valueFrom: {secretKeyRef: {name: cnpg-minio-backup, key: ACCESS_SECRET_KEY}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mc alias set m "http://minio-hl.minio.svc:9000" "$ROOT_USER" "$ROOT_PASS"
                  mc mb --ignore-existing m/cnpg-backups
                  cat >/tmp/policy.json <<'EOF'
                  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::cnpg-backups","arn:aws:s3:::cnpg-backups/*"]}]}
                  EOF
                  # policy (create on new mc, add on old)
                  mc admin policy create m cnpg-backup-rw /tmp/policy.json 2>/dev/null \
                    || mc admin policy add m cnpg-backup-rw /tmp/policy.json 2>/dev/null || true
                  # user (idempotent — secret is stable; add is a no-op if it already matches)
                  mc admin user add m "$BACKUP_KEY" "$BACKUP_SECRET" # UPSERT — resets password to current secret every run (2026-08-13 incident: ESO generator re-ran on the v1 API migration, rotated all scoped secrets; the old `|| true` swallowed the drift for hours)
                  # attach (new mc) / set (old mc)
                  mc admin policy attach m cnpg-backup-rw --user "$BACKUP_KEY" 2>/dev/null \
                    || mc admin policy set m cnpg-backup-rw user="$BACKUP_KEY" 2>/dev/null || true
                  echo "OK: bucket=cnpg-backups user=$BACKUP_KEY policy=cnpg-backup-rw"
                  mc admin user info m "$BACKUP_KEY"
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
