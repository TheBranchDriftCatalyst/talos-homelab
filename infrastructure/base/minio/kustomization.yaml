---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pull-secret.yaml # Zot creds; the gate every MinIO remedy needs (TALOS-d9pm)
  - tenant.yaml
  - ingressroute.yaml
  - servicemonitor.yaml # scrape minio_* metrics (needs AUTH_TYPE=public) — TALOS-qtix
  - cnpg-backup/ # scoped cnpg-backup user + bucket provisioner for CNPG backups (TALOS-xgrl.2)
  - scoped-users/ # scoped users for mimir/loki/velero (TALOS-xgrl.12)
