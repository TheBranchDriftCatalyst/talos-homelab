---
# MinIO Console IngressRoute
# Note: Operator-managed Tenant creates minio-console service on port 9090
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console
  namespace: minio
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "MinIO"
    gethomepage.dev/description: "S3 Object Storage"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "minio.png"
    gethomepage.dev/siteMonitor: "http://minio.minio.svc.cluster.local/minio/health/live"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`minio.talos00`)
      kind: Rule
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: minio-console
          port: 9090
---
# MinIO API IngressRoute (for S3 API access)
# Note: Operator-managed Tenant creates minio service on port 80
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-api
  namespace: minio
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`s3.talos00`)
      kind: Rule
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: minio
          port: 80
