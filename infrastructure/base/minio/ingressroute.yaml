---
# MinIO Console IngressRoute
# Note: Operator-managed Tenant creates minio-console service on port 9090
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console
  namespace: minio
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "MinIO"
    gethomepage.dev/description: "S3 Object Storage"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "minio.png"
    gethomepage.dev/siteMonitor: "http://minio.minio.svc.cluster.local/minio/health/live"
spec:
  # websecure (TLS). The themepark nav-sweep had left this on the `web`
  # entrypoint ONLY, so the nav served over plaintext but browsers (HTTPS) got a
  # 404 (TALOS-wyxh). The web→HTTPS redirect is a SEPARATE object below (Kyverno
  # ingressroute-no-combined-entrypoints). No `tls:` stanza — Kyverno
  # ingressroute-tls-default injects it (*.talos00 wildcard via SNI).
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio.talos00`)
      kind: Rule
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        - name: lan-only
          namespace: traefik
        # Consolidated catalyst navbar (catalyst-inject-nav). Last in the chain so
        # auth runs first and the injector only ever rewrites an authorised body.
        # Console only -- the s3.talos00 API route below must NOT be injected.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: minio-console
          port: 9090
---
# HTTP→HTTPS redirect for minio.talos00 (console).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-http
  namespace: minio
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`minio.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: redirect-https
          namespace: traefik
      services:
        - name: minio-console
          port: 9090
---
# MinIO API IngressRoute (for S3 API access)
# Note: Operator-managed Tenant creates minio service on port 80
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-api
  namespace: minio
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`s3.talos00`)
      kind: Rule
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: minio
          port: 80
