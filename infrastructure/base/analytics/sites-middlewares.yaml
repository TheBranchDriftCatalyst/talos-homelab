---
# Per-site analytics injection middlewares (TALOS-4gg).
#
# The shared `analytics` chain in middlewares.yaml injects a FIXED
# data-domain=knowledgedump.space — fine for the apex, wrong for any other host,
# because every opted-in app would report as knowledgedump.space. So each distinct
# site that this Traefik fronts gets its OWN inject middleware (its own data-domain)
# and its OWN chain here. The apex/default stays the shared `analytics` chain.
#
# ADD A SITE:
#   1. add it to the registry (applications/crossplane-demo/plausible/sites-registry.yaml)
#      with "inject": true so the reconciler creates the Plausible site;
#   2. copy the boomtime pair below, swapping <slug> + data-domain;
#   3. point that app's IngressRoute at the new `analytics-<slug>` chain
#      (middlewares: [{name: analytics-<slug>, namespace: traefik}]).
# The script path/extensions are IDENTICAL to the shared `analytics-inject-knowledgedump`
# (change extensions in ONE place only if you change them everywhere).
#
# ---------------------------------------------------------------------------
# WHY SOME SITES INJECT TWO SCRIPTS FROM ONE REWRITE
# ---------------------------------------------------------------------------
# boomtime and amber also carry the HyperDX RUM loader, and it is emitted from
# the SAME single `rewrites` entry as the Plausible tag rather than from a
# second middleware in the chain.
#
# That is not a style choice. CHAINING TWO rewriteBody MIDDLEWARES IS A
# DOCUMENTED SILENT FAILURE MODE in this cluster: the second one can simply
# never fire, and nothing reports it -- the page just quietly lacks a script.
# One rewrite emitting both tags cannot fail that way.
#
# It does mean analytics and RUM are coupled for these two sites: turning the
# chain off turns both off. Accepted, because these are exactly the two sites
# that want both. An app that wants RUM WITHOUT Plausible uses its own
# middleware in infrastructure/base/monitoring/v2-otel/hyperdx-rum/ instead
# (grafana does).
#
# NOTE the commented GA drop-in at the bottom of this file still describes
# listing two injects in one chain. That advice predates the chaining gotcha --
# if GA is ever activated, fold its tag into the same single rewrite too.

---
# boomtime.knowledgedump.space — Plausible inject (data-domain per THIS host).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-inject-boomtime
  namespace: traefik
spec:
  plugin:
    rewriteBody:
      lastModified: true
      rewrites:
        # TWO tags, ONE rewrite -- see the header note on chaining. Plausible
        # first (page analytics), then the HyperDX RUM loader (traces, console,
        # session replay).
        #
        # data-mask-text="false" so the replay is watchable; data-mask-inputs is
        # left at its default ON, which is what keeps anything typed into a form
        # out of ClickHouse.
        - regex: "</head>"
          replacement: '<script defer data-domain="boomtime.knowledgedump.space" src="https://analytics.knowledgedump.space/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script><script src="/hyperdx-rum/rum.js" data-service="boomtime" data-mask-text="false" defer></script></head>'

---
# boomtime opt-in chain. Same shape as the shared `analytics` chain, but with the
# boomtime-specific inject. Reference THIS from boomtime's IngressRoute in this repo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-boomtime
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: strip-accept-encoding
      - name: analytics-csp
      - name: analytics-inject-boomtime

---
# amberdark.net — Plausible inject (data-domain per THIS host).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-inject-amber
  namespace: traefik
spec:
  plugin:
    rewriteBody:
      lastModified: true
      rewrites:
        # TWO tags, ONE rewrite -- see the header note on chaining.
        #
        # data-mask-text="false" so the replay is watchable. data-mask-inputs
        # stays ON and MUST stay on: amberdark.net serves /login, and that mask
        # is the only thing keeping typed credentials out of ClickHouse.
        - regex: "</head>"
          replacement: '<script defer data-domain="amberdark.net" src="https://analytics.knowledgedump.space/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script><script src="/hyperdx-rum/rum.js" data-service="amberdark" data-mask-text="false" defer></script></head>'

---
# amber opt-in chain. Same shape as the shared `analytics` chain, but with the
# amber-specific inject. Reference THIS from amber's IngressRoute in this repo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-amber
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: strip-accept-encoding
      - name: analytics-csp
      - name: analytics-inject-amber

# ============================================================================
# FUTURE DROP-IN — Google Analytics (GA4) dual-tagging. NOT ACTIVE.
# ----------------------------------------------------------------------------
# When a real GA4 property exists for a site, add its Measurement ID to that
# site's registry entry ("ga": "G-XXXXXXXXXX") and un-comment a GA inject
# middleware like the template below (one per slug, real ID substituted), then
# make the site's chain list BOTH the Plausible inject AND the GA inject, e.g.:
#
#   spec:
#     chain:
#       middlewares:
#         - name: strip-accept-encoding
#         - name: analytics-csp                 # already pre-authorizes GA hosts
#         - name: analytics-inject-boomtime     # Plausible tag
#         - name: analytics-inject-ga-boomtime  # GA4 tag (below)
#
# CSP is already handled: analytics-csp additively allows googletagmanager.com and
# google-analytics.com (script/connect/img). Do NOT ship this with a placeholder ID
# — a fake G-XXXXXXXXXX would send hits to a non-existent property.
#
# apiVersion: traefik.io/v1alpha1
# kind: Middleware
# metadata:
#   name: analytics-inject-ga-boomtime
#   namespace: traefik
# spec:
#   plugin:
#     rewritebody:
#       lastModified: true
#       rewrites:
#         - regex: "</head>"
#           replacement: '<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag(''js'',new Date());gtag(''config'',''G-XXXXXXXXXX'');</script></head>'
