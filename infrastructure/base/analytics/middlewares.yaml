---
# Central analytics-injection middleware chain (TALOS-4gg).
# Opt an app in by adding ONE middleware ref to its IngressRoute:
#     middlewares:
#       - name: analytics
#         namespace: traefik
# Nothing here touches an app until it opts in. The Plausible host + snippet live ONLY in the
# `analytics-inject-knowledgedump` middleware below — change them once, every opted-in app updates.
# Works only for apps fronted by THIS Traefik; externally/statically-hosted sites embed the snippet
# at source (pointing at the same analytics.knowledgedump.space).

---
# 1) Force uncompressed upstream responses. The rewritebody plugin (v0.3.1) cannot rewrite a
#    gzip/br body — it would see compressed bytes and the </head> match would never fire. Asking
#    the backend for `identity` keeps the HTML plaintext so injection works.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-accept-encoding
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      Accept-Encoding: "identity"

---
# 2) Additive CSP fix. If (and only if) an app already sends a Content-Security-Policy, append the
#    analytics origin to its script-src (load script.js) and connect-src (POST /api/event). This is
#    ADDITIVE via regex — it does NOT replace the app's policy, so no existing restriction is weakened.
#    Apps with NO CSP need nothing (the injected script isn't blocked). Apps whose CSP uses only
#    default-src (no explicit script-src/connect-src) won't match — handle those per-app.
#    Also pre-authorizes Google Analytics (googletagmanager.com / google-analytics.com) so the
#    future GA dual-tag drop-in (see sites-middlewares.yaml) works without a second CSP edit —
#    still purely additive. GA fires an <img> beacon, so google-analytics.com is added to img-src too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-csp
  namespace: traefik
spec:
  plugin:
    rewriteHeaders:
      rewrites:
        - header: "Content-Security-Policy"
          regex: "script-src ([^;]*)"
          replacement: "script-src $1 https://analytics.knowledgedump.space https://www.googletagmanager.com https://www.google-analytics.com"
        - header: "Content-Security-Policy"
          regex: "connect-src ([^;]*)"
          replacement: "connect-src $1 https://analytics.knowledgedump.space https://www.googletagmanager.com https://www.google-analytics.com"
        - header: "Content-Security-Policy"
          regex: "img-src ([^;]*)"
          replacement: "img-src $1 https://www.google-analytics.com"

---
# 3) THE REGISTRY: inject the Plausible tracker before </head>. This is the single source of truth
#    for the analytics host + script extensions + tracked data-domain. The inline `window.plausible`
#    queue stub is intentionally OMITTED here (it would need CSP 'unsafe-inline'/a hash and is only
#    useful when the PAGE itself fires custom plausible() events — injected apps don't). Add more
#    sites by copying this middleware with a different data-domain and its own chain.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics-inject-knowledgedump
  namespace: traefik
spec:
  plugin:
    rewritebody:
      lastModified: true
      rewrites:
        - regex: "</head>"
          replacement: '<script defer data-domain="knowledgedump.space" src="https://analytics.knowledgedump.space/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script></head>'

---
# 4) The opt-in handle. Reference THIS from an app's IngressRoute. Order matters: strip encoding on
#    the way in, then (on the response) relax CSP + inject the script.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: analytics
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: strip-accept-encoding
      - name: analytics-csp
      - name: analytics-inject-knowledgedump
