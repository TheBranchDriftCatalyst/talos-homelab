# Honeypot namespace — the T-Pot honeypot images run here as native k8s Deployments (pivoted away from
# the KubeVirt VM approach, which fought Talos networking at every layer). Isolated from the defensive
# security services (crowdsec/falco) by living in its own namespace: this is the attacked surface.
# PSA baseline — honeypot images need some latitude (caps, non-standard users); per-pod securityContext
# locks each down. Cilium NetworkPolicy provides the real egress cage.
apiVersion: v1
kind: Namespace
metadata:
  name: tpot
  labels:
    # privileged PSA: the WAN-facing honeypots use hostPort (to inherit the WAN:22 -> :2222 forward and
    # preserve attacker source IPs). Per-pod securityContext + the default-deny CNP do the real locking.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
