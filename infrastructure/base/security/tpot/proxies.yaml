# WAN front for the SENSOR's SSH honeypot. socat pinned to talos02-gpu (the router's WAN:22 -> :2222
# forward target) -> tpot-sensor-ssh:22. socat -d -d logs peer IPs -> stdout -> CrowdSec (shared-front
# capture that feeds AbuseIPDB + blocklist + bouncer). HOTSWAP: scale to 0 to take the honeypot offline.
# (Hive Kibana mgmt is fronted by Authentik/Traefik, not here; enrollment SSH is via kubectl port-forward.)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpot-wan-proxy
  namespace: honeypot-vm
  labels:
    app: tpot-wan-proxy
    app.kubernetes.io/component: honeypot
spec:
  replicas: 1
  selector:
    matchLabels: { app: tpot-wan-proxy }
  template:
    metadata:
      labels:
        app: tpot-wan-proxy
        app.kubernetes.io/component: honeypot
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: talos02-gpu
      containers:
        - name: socat
          image: alpine/socat:1.8.0.0
          args:
            - "-d"
            - "-d"
            - "TCP-LISTEN:2222,fork,reuseaddr"
            - "TCP:tpot-sensor-ssh.honeypot-vm.svc.cluster.local:22"
          ports:
            - { name: ssh, containerPort: 2222, hostPort: 2222, protocol: TCP }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tpot-wan-proxy-policy
  namespace: honeypot-vm
spec:
  endpointSelector:
    matchLabels: { app: tpot-wan-proxy }
  ingress:
    - fromEntities: ["world"]
      toPorts:
        - ports: [{ port: "2222", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels: { kubevirt.io/domain: tpot-sensor }
      toPorts:
        - ports: [{ port: "22", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
