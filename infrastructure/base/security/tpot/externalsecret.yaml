# Two ESO-rendered cloud-inits for the distributed T-Pot: the Hive (ELK/Kibana, -t h, needs the web
# password) and the Sensor (honeypots, -t s, no web UI). Both clone tpotce + run the unattended installer
# and reboot. The sensor->hive enrollment (cert handshake via deploy.sh) is a one-time manual step after
# both are up. USER: 1Password item `tpot-web` (vault catalyst-eso) field `password` (already created).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tpot-hive-cloudinit
  namespace: honeypot-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tpot-hive-cloudinit
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        userdata: |
          #cloud-config
          hostname: tpot-hive
          password: "{{ .password }}"
          chpasswd: {expire: false}
          ssh_pwauth: true
          # Pin DNS in bootcmd (init stage) so it precedes the package phase. Public DNS + force TCP
          # (use-vc), which survives the masquerade NAT better than UDP. chattr +i so DHCP/networkd
          # can't clobber it. This is the fix for the guest-can't-resolve blocker.
          bootcmd:
            # systemd-resolved reclaims /etc/resolv.conf on every boot (overriding the pin) -> guest DNS
            # reverts to the broken masquerade/kube-dns path. Disable it, then pin public DNS immutable.
            - systemctl disable --now systemd-resolved 2>/dev/null || true
            - chattr -i /etc/resolv.conf 2>/dev/null || true
            - rm -f /etc/resolv.conf
            - printf 'nameserver 1.1.1.1\nnameserver 1.0.0.1\noptions use-vc timeout:3 attempts:3\n' > /etc/resolv.conf
            - chattr +i /etc/resolv.conf 2>/dev/null || true
          package_update: true
          packages:
            - git
          runcmd:
            - echo 'debian ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/99-debian && chmod 440 /etc/sudoers.d/99-debian
            - for i in $(seq 1 60); do getent hosts github.com >/dev/null 2>&1 && break; echo "waiting for DNS ($i)"; sleep 5; done
            - git clone --depth 1 https://github.com/telekom-security/tpotce /home/debian/tpotce
            - chown -R debian:debian /home/debian/tpotce
            - su - debian -c 'cd ~/tpotce && ./install.sh -s -t h -u tpotadmin -p "{{ .password }}"' > /var/log/tpot-install.log 2>&1
            - reboot
  data:
    - secretKey: password
      remoteRef: { key: tpot-web, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tpot-sensor-cloudinit
  namespace: honeypot-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tpot-sensor-cloudinit
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Sensor has no web UI (-t s takes no -u/-p). It ships to the Hive after the one-time deploy.sh
        # enrollment (run on the Hive). We set the OS password from the same secret so mgmt SSH (:64295)
        # works for the enrollment handshake.
        userdata: |
          #cloud-config
          hostname: web-prod-01
          password: "{{ .password }}"
          chpasswd: {expire: false}
          ssh_pwauth: true
          # Pin DNS in bootcmd (before the package phase). Public DNS + force TCP (use-vc) — survives the
          # masquerade NAT better than UDP. chattr +i so DHCP/networkd can't clobber it.
          bootcmd:
            # systemd-resolved reclaims /etc/resolv.conf on every boot (overriding the pin) -> guest DNS
            # reverts to the broken masquerade/kube-dns path. Disable it, then pin public DNS immutable.
            - systemctl disable --now systemd-resolved 2>/dev/null || true
            - chattr -i /etc/resolv.conf 2>/dev/null || true
            - rm -f /etc/resolv.conf
            - printf 'nameserver 1.1.1.1\nnameserver 1.0.0.1\noptions use-vc timeout:3 attempts:3\n' > /etc/resolv.conf
            - chattr +i /etc/resolv.conf 2>/dev/null || true
          package_update: true
          packages:
            - git
          runcmd:
            - echo 'debian ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/99-debian && chmod 440 /etc/sudoers.d/99-debian
            - for i in $(seq 1 60); do getent hosts github.com >/dev/null 2>&1 && break; echo "waiting for DNS ($i)"; sleep 5; done
            - git clone --depth 1 https://github.com/telekom-security/tpotce /home/debian/tpotce
            - chown -R debian:debian /home/debian/tpotce
            - su - debian -c 'cd ~/tpotce && ./install.sh -s -t s' > /var/log/tpot-install.log 2>&1
            - reboot
  data:
    - secretKey: password
      remoteRef: { key: tpot-web, property: password }
