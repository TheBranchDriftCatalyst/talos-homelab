# T-Pot install cloud-init, rendered by ESO with the web password injected from 1Password.
# USER: create 1Password item `tpot-web` (vault catalyst-eso) with field `password`.
# The whole cloud-config is templated so the password never lands in git; KubeVirt reads the
# `userdata` key via the VM's cloudInitNoCloud.userDataSecretRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tpot-cloudinit
  namespace: honeypot-vm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tpot-cloudinit
    creationPolicy: Owner
    template:
      engine: v2
      data:
        userdata: |
          #cloud-config
          hostname: web-prod-01
          package_update: true
          packages:
            - git
          # T-Pot 24.04 unattended install (standalone/hive = -t h). install.sh -s needs passwordless
          # sudo for the invoking user; it self-sudos. Reboot is mandatory for T-Pot to come up, and
          # runStrategy:Always brings the VM back with docker-compose autostarting the stack.
          runcmd:
            - echo 'debian ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/99-debian && chmod 440 /etc/sudoers.d/99-debian
            - git clone --depth 1 https://github.com/telekom-security/tpotce /home/debian/tpotce
            - chown -R debian:debian /home/debian/tpotce
            - su - debian -c 'cd ~/tpotce && ./install.sh -s -t h -u tpotadmin -p "{{ .password }}"' > /var/log/tpot-install.log 2>&1
            - reboot
  data:
    - secretKey: password
      remoteRef: { key: tpot-web, property: password }
