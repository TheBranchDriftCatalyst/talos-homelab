# T-Pot SENSOR — the attack surface: 20+ honeypots, no ELK. Ships events to the Hive on :64294. This is
# the WAN-facing box (the socat front -> its SSH honeypot :22), so it lives on talos02-gpu — the only
# kubevirt-schedulable worker that is neither control-plane nor a datastore node (minimal escape blast
# radius). 4Gi/2c on a 64Gi local-path disk. Deployed Halted for a clean CDI import, then flipped.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: tpot-sensor
  namespace: honeypot-vm
  labels:
    app: tpot-sensor
spec:
  runStrategy: Always # disks imported; boot into install (public-DNS fix)
  dataVolumeTemplates:
    - metadata:
        name: tpot-sensor-disk
        annotations:
          volume.kubernetes.io/selected-node: talos02-gpu
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        storage:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 64Gi
        source:
          http:
            url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
  template:
    metadata:
      labels:
        app: tpot-sensor
        kubevirt.io/domain: tpot-sensor
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos02-gpu # safe node (no datastores, not control-plane) — the WAN box
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: root
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - { name: ssh, port: 22, protocol: TCP } # SSH honeypot (WAN via tpot-wan-proxy)
                - { name: mgmtssh, port: 64295, protocol: TCP } # mgmt SSH — the Hive deploy.sh enrollment target
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: tpot-sensor-disk
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: tpot-sensor-cloudinit
