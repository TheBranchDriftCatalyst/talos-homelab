---
# Security Ops — unified honeypot dashboard (Cowrie + Beelzebub behind the haproxy VIP).
#
# Merges the former cowrie-ops + beelzebub-ops dashboards. Three sections:
#   1. Overview (haproxy front): real attacker IPs + the 80/20 cowrie/beelzebub split. Since haproxy
#      fronts both honeypots, the REAL attacker source IP is only in its tcplog
#      ({namespace="honeypot", container="haproxy"}, "<src_ip>:<port> [date] <fe> <backend>/<server>");
#      cowrie/beelzebub see only the proxy pod IP. Attacker-IP panels parse it with `| regexp`.
#   2. Cowrie (80% tier) — medium-interaction session content (commands/logins/creds), from the logship
#      sidecar JSON stream {namespace="honeypot", container="logship", pod=~"cowrie-.*"} | json.
#   3. Beelzebub (20% tier) — LLM high-interaction session content,
#      {namespace="honeypot", container="beelzebub"} | json event_* (nested event.Msg/.Command/.User).
#      NOTE: beelzebub only ever sees the haproxy POD IP as event_SourceIp — haproxy does not
#      send-proxy-v2 to it (haproxy.yaml:37), unlike cowrie. Never filter beelzebub on source IP.
#   + Falco runtime tripwire ({rule=~"Honeypot Container Breach.*"}) — empty = healthy.
#
# Datasource: Loki (uid loki-v2).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: honeypot-ops
  namespace: honeypot
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: security
spec:
  # This dashboard lives in the `honeypot` namespace alongside the component it
  # visualises, but the Grafana instance runs in `monitoring`. The operator only
  # imports a cross-namespace GrafanaDashboard when this is explicitly true --
  # without it the dashboard silently never appears while everything reconciles green.
  allowCrossNamespaceImport: true
  # Same folder as before (Ops/Security) -- but addressed by UID, not by CR name.
  # `folderRef` is resolved by the operator as "a GrafanaFolder in the SAME namespace"
  # (per the CRD field doc), and the ops-security GrafanaFolder lives in `monitoring`.
  # From this namespace a folderRef would therefore never resolve and the dashboard
  # would silently land in General. `folderUID` is a plain Grafana UID with no namespace
  # scoping; the ops-security folder declares `uid: ops-security`, so this targets the
  # identical folder. Matches the existing cross-namespace dashboards (boomtime,
  # stash-tagger), which all use folderUID + allowCrossNamespaceImport.
  folderUID: ops-security
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-honeypot-ops
    key: honeypot-ops.json
