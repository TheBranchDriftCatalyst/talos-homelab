---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: honeypot

resources:
  - tripwire-canary-rbac.yaml # exec permission for the canary (CronJob lives in falco/)
  - tripwire-alert.yaml # alerts when it stops
  - namespace.yaml
  - cilium-network-policy.yaml # merged cage for both honeypots
  - vip.yaml
  - haproxy.yaml # 80/20 weighted, sticky TCP front (Deployment only; cfg is generated below)
  - novelty-bouncer-externalsecret.yaml # bouncer key for the haproxy-novelty-bouncer sidecar (TALOS-hdw8)
  # --- cowrie (medium-interaction SSH/telnet) ---
  - deployment.yaml
  - service.yaml
  - pvc.yaml # var/lib/cowrie: malware samples + tty recordings (binary; no log pipeline carries them)
  - backup-cronjob.yaml # off-node durability for those artifacts (read-only mount)
  # --- beelzebub (LLM high-interaction SSH) ---
  - beelzebub-externalsecret.yaml # LLM key from 1Password (ESO)
  - beelzebub-deployment.yaml
  - beelzebub-service.yaml
  - beelzebub-podmonitor.yaml # Prometheus metrics :2112
  # --- observability ---
  - dashboards/honeypot-ops.yaml # Grafana dashboard CR (Grafana is in `monitoring` -> allowCrossNamespaceImport)

# ALL honeypot configs are generated, never static ConfigMaps. These are mounted with subPath,
# and a subPath mount is FROZEN at pod start -- kubelet never propagates ConfigMap updates into
# one. With a static (stable-named) ConfigMap the pod therefore keeps running stale config
# forever, silently: on 2026-09-16 the haproxy ConfigMap read weight 80/20 while the 40h-old pod
# still ran the older 50/50 weights (the ratio is 80/20 today). configMapGenerator hash-suffixes the name, so editing a file below changes the
# ConfigMap name, which changes the podTemplate, which rolls the pod. Do NOT convert these back
# to static ConfigMaps without also adding a checksum annotation to each podTemplate.
configMapGenerator:
  - name: honeypot-haproxy-cfg
    files:
      - cfg/haproxy.cfg
      - cfg/replay.map # empty seed; the bouncer fills the live map over the admin socket
  - name: honeypot-novelty-bouncer
    files:
      - haproxy-novelty-bouncer/bouncer.py
  - name: cowrie-config
    files:
      - cfg/cowrie.cfg
      # Without this cowrie falls back to _USERDB_DEFAULTS, which rejects root:root and
      # root:123456 while accepting root:<anything else> -- a one-connection pre-auth tell.
      - userdb.txt
  - name: beelzebub-core
    files:
      - cfg/beelzebub.yaml
  - name: beelzebub-services-tmpl
    files:
      - cfg/ssh-2222.yaml
  # Cowrie honeyfs: real contents for pickle nodes that ship as ZERO-BYTE files, which cowrie
  # otherwise serves as b"". Keys are basenames, so every filename here must stay unique.
  - name: cowrie-honeyfs
    files:
      - honeyfs/proc/cpuinfo
      - honeyfs/proc/version
      - honeyfs/proc/uptime
      - honeyfs/proc/loadavg
      - honeyfs/etc/hostname
      - honeyfs/usr/lib/os-release
  # Cowrie fingerprint-hardening txtcmds (TALOS-a8kx): realistic lscpu/nproc so botnet recon sees a
  # plausible modern box. Hash-suffixed so editing rolls the pod.
  - name: cowrie-fs-hardening
    files:
      - fs-hardening/lscpu
      - fs-hardening/nproc
  # The ONE exception to the hash-suffix rule above: this ConfigMap is not mounted by any
  # pod, it is read by the Grafana operator via the CR's configMapRef.name, which is the
  # stable string `dashboard-honeypot-ops`. A hash suffix would dangle that ref. Scoped as a
  # per-generator `options` so the hash-suffixing of every generator above is preserved.
  # configMapRef resolves in the CR's own namespace; the `namespace: honeypot` transformer
  # puts both this ConfigMap and the CR there.
  - name: dashboard-honeypot-ops
    options:
      disableNameSuffixHash: true
    files:
      - dashboards/honeypot-ops.json
