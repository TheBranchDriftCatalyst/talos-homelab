# Minimal cowrie.cfg: only override values that differ from the image's
# shipped cowrie.cfg.dist. Leave path-related defaults alone — they are
# relative to the container WORKDIR (/cowrie/cowrie-git) and resolving
# them against an absolute `/cowrie/var/...` prefix (as the old config
# did) makes plugin init silently fail, causing twistd to report
# "Unknown command: cowrie" and CrashLoopBackOff.
#
# See the shipped template for full path defaults:
#   /cowrie/cowrie-git/etc/cowrie.cfg.dist
[honeypot]
# Hostname the honeypot will pretend to be
hostname = srv01

# Timezone
timezone = UTC

# Interaction timeout (seconds)
interact_timeout = 180

# Allow `exec` commands (otherwise SSH clients get "not implemented")
exec_enabled = true

# Credential DB. Without this cowrie uses _USERDB_DEFAULTS, which rejects root:root and
# root:123456 but accepts root:<anything else> -- a one-connection pre-auth fingerprint.
# See userdb.txt for the full reasoning.
auth_class = UserDB

# DEFAULT layout, restored deliberately (TALOS-ybtm). These used to point at the
# mount root because mounting a volume over var/lib/cowrie hides the image's
# pre-created tty/ and downloads/ subdirs, and cowrie does not recreate them --
# opening a per-session ttylog then throws FileNotFoundError inside
# openShell/execCommand and NO cowrie.command.input is ever logged.
#
# That workaround fixed logging and silently broke the backup: backup-cronjob.yaml
# archives downloads/ and tty/, found neither, and exited 0 "successfully" for its
# entire life, capturing zero malware samples off-node.
#
# The deployment's init-var-lib initContainer now creates both subdirs on the PVC,
# which is the alternative this comment used to name. If the interactive shell ever
# stops logging commands again, check that initContainer FIRST.
# Real contents for files the stock pickle carries as ZERO-BYTE nodes. fs.py returns b"" for
# those ("better to return nothing than suspiciously fail"), which for /proc/cpuinfo is itself
# impossible on Linux -- and the fingerprinting script we see ~590x/week reads exactly these.
# init_honeyfs() attaches these at startup via A_REALFILE, which file_contents() checks BEFORE
# the zero-size short-circuit. See honeyfs/README.md for what can and cannot be filled this way.
contents_path = /cowrie/honeyfs

ttylog_path = var/lib/cowrie/tty
download_path = var/lib/cowrie/downloads

# OS IDENTITY. These MUST agree with the [ssh] version banner below, and they did not:
# cowrie's compiled-in fallbacks (src/cowrie/commands/uname.py) are kernel_version
# "3.2.0-4-amd64" and kernel_build_string "#1 SMP Debian 3.2.68-1+deb7u1" -- Debian 7 on a 2015
# kernel -- while the banner announced Ubuntu 22.04 with OpenSSH 8.9. `uname -s -v -n -r -m` is
# the single most-run command on this honeypot (12,475 hits in 7 days), so the contradiction was
# handed to every bot that asked, for free.
#
# Values below are a real Ubuntu 22.04 (jammy) pairing -- the kernel release and the build
# string have to be a REAL pair, not independently plausible strings.
[shell]
kernel_version = 5.15.0-125-generic
kernel_build_string = #135-Ubuntu SMP Fri Oct 4 13:27:36 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux
# What `ssh -V` reports. A third inconsistent version string here is its own tell, so this
# tracks the banner exactly, down to the OpenSSL version jammy actually ships.
ssh_version = OpenSSH_8.9p1 Ubuntu-3ubuntu0.1, OpenSSL 3.0.2 15 Mar 2022

[ssh]
enabled = true
listen_endpoints = haproxy:tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.1

# Telnet is disabled by default in the upstream config; enable it
# on the alternate port the deployment exposes.
[telnet]
enabled = true
listen_endpoints = haproxy:tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
# Relative to WORKDIR → /cowrie/cowrie-git/var/log/cowrie/cowrie.json
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log
