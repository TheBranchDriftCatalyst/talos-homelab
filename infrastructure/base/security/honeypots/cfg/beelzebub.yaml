# Beelzebub config: core (logging + Prometheus for Mimir).
# The SSH service TEMPLATE (ssh-2222.yaml) carries an LLM key placeholder
# (__LLM_API_KEY__) that the deployment's initContainer replaces from the
# beelzebub-llm-key Secret at startup — so the key is never in git.
core:
  logging:
    debug: false
    logDisableTimestamp: false
    logsPath: /dev/stdout          # -> Alloy tail -> Loki (like cowrie logship)
  tracings:
    rabbit-mq:
      enabled: false
  prometheus:
    path: "/metrics"
    port: ":2112"                  # scraped into Mimir (PodMonitor, added later)
