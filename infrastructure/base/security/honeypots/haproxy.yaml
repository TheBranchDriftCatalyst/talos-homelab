# Weighted + STICKY TCP front for the honeypot VIP. k8s Services can't weight endpoints, so this haproxy
# does the split (80/20 cowrie:beelzebub) AND keeps each attacker on one honeypot:
#   - `balance roundrobin` + per-server `weight` assigns each NEW source IP at the configured ratio (cowrie:
#     beelzebub) — weighted round-robin distributes accurately even for small/bursty IP sets, unlike
#     `balance source` whose IP-hash was lumpy and starved beelzebub.
#   - `stick-table type ip` + `stick on src` remembers that assignment, so every later connection from the
#     same attacker IP sticks to the same honeypot (consistent persona across reconnects, expire 24h).
# Net: the weighted ratio across unique attackers, sticky per attacker. The VIP LoadBalancer (externalTrafficPolicy:Local)
# hands haproxy the REAL source IP, so `stick on src` keys on the attacker (not the proxy); haproxy's tcplog
# (source IP per connection, to stdout) is what CrowdSec tails for bans. Pinned to talos02-gpu with the
# honeypots so the Local VIP always has a node-local backend.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-lb
  namespace: honeypot
  labels: { app: honeypot-lb }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: honeypot-lb }
  template:
    metadata:
      labels: { app: honeypot-lb }
    spec:
      automountServiceAccountToken: false
      # The WAN-facing proxy and the key-holding bouncer were the only honeypot pods running
      # with an unconfined syscall surface -- cowrie, beelzebub and iocaine all set this.
      # Pod-level so both containers inherit it. (TALOS-cscw)
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: talos02-gpu # co-located with the honeypots + the Local VIP announce node
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          ports:
            - { name: ssh, containerPort: 2222, protocol: TCP }
            - { name: telnet, containerPort: 2223, protocol: TCP }
            - { name: health, containerPort: 8404, protocol: TCP }
          # Until now nothing noticed if haproxy wedged -- and it is the ONLY path from the
          # WAN to both honeypots, so a silent hang blackholes the whole trap (TALOS-cscw).
          # Probes hit the dedicated :8404 monitor-uri, never :2222, so they cannot feed the
          # cowrie traceback storm.
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - { name: cfg, mountPath: /usr/local/etc/haproxy/haproxy.cfg, subPath: haproxy.cfg, readOnly: true }
            - { name: cfg, mountPath: /usr/local/etc/haproxy/replay.map, subPath: replay.map, readOnly: true }
            - { name: runtime, mountPath: /var/run/haproxy }
          securityContext:
            runAsNonRoot: true
            runAsUser: 99 # haproxy user in the official image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
        # Maintains replay.map IN MEMORY over the admin socket from CrowdSec
        # `silentdrop` decisions (TALOS-hdw8). Same uid as haproxy so it can use the
        # 660 socket. No ServiceAccount token, no k8s API, read-only rootfs -- its only
        # inputs are the LAPI over TLS and its own bouncer key.
        - name: novelty-bouncer
          image: python:3.12.12-alpine3.22
          command: [python, -B, /app/bouncer.py]
          env:
            - name: LAPI_URL
              value: https://crowdsec-service.crowdsec.svc.cluster.local:8080
            - name: API_KEY_FILE
              value: /keys/lapi-key
            - name: HAPROXY_SOCKET
              value: /var/run/haproxy/admin.sock
          volumeMounts:
            - { name: novelty-bouncer, mountPath: /app, readOnly: true }
            - { name: bouncer-key, mountPath: /keys, readOnly: true }
            - { name: lapi-ca, mountPath: /tls, readOnly: true }
            - { name: runtime, mountPath: /var/run/haproxy }
          securityContext:
            runAsNonRoot: true
            runAsUser: 99
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
      volumes:
        - name: cfg
          configMap: { name: honeypot-haproxy-cfg }
        - name: novelty-bouncer
          configMap: { name: honeypot-novelty-bouncer }
        - name: bouncer-key
          secret: { secretName: crowdsec-novelty-bouncer-key }
        # CA for VERIFYING the LAPI cert (TALOS-pnyo). Published into every namespace by
        # trust-manager, and since TALOS-k5vm the crowdsec PKI is signed by it -- so this is
        # a plain ConfigMap mount that inherits CA rotation, with nothing copied across
        # namespaces and no private key anywhere near the honeypot.
        - name: lapi-ca
          configMap: { name: homelab-ca-bundle }
        # Shared so the bouncer can reach haproxy's admin socket. emptyDir: the map is
        # rebuilt from the LAPI within one poll of any restart.
        - name: runtime
          emptyDir: {}
