# Weighted + STICKY TCP front for the honeypot VIP. k8s Services can't weight endpoints, so this haproxy
# does the split (80/20 cowrie:beelzebub) AND keeps each attacker on one honeypot:
#   - `balance roundrobin` + per-server `weight` assigns each NEW source IP at the configured ratio (cowrie:
#     beelzebub) — weighted round-robin distributes accurately even for small/bursty IP sets, unlike
#     `balance source` whose IP-hash was lumpy and starved beelzebub.
#   - `stick-table type ip` + `stick on src` remembers that assignment, so every later connection from the
#     same attacker IP sticks to the same honeypot (consistent persona across reconnects, expire 24h).
# Net: the weighted ratio across unique attackers, sticky per attacker. The VIP LoadBalancer (externalTrafficPolicy:Local)
# hands haproxy the REAL source IP, so `stick on src` keys on the attacker (not the proxy); haproxy's tcplog
# (source IP per connection, to stdout) is what CrowdSec tails for bans. Pinned to talos02-gpu with the
# honeypots so the Local VIP always has a node-local backend.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-lb
  namespace: honeypot
  labels: { app: honeypot-lb }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: honeypot-lb }
  template:
    metadata:
      labels: { app: honeypot-lb }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: talos02-gpu # co-located with the honeypots + the Local VIP announce node
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          ports:
            - { name: ssh, containerPort: 2222, protocol: TCP }
            - { name: telnet, containerPort: 2223, protocol: TCP }
          volumeMounts:
            - { name: cfg, mountPath: /usr/local/etc/haproxy/haproxy.cfg, subPath: haproxy.cfg, readOnly: true }
          securityContext:
            runAsNonRoot: true
            runAsUser: 99 # haproxy user in the official image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: cfg
          configMap: { name: honeypot-haproxy-cfg }
