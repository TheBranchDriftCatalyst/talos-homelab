---
# CONTINUOUS PROOF THAT THE HONEYPOT TRIPWIRE STILL WORKS.
#
# The Honeypot Container Breach rules went silently blind THREE TIMES on 2026-09-18. Each
# time the config looked correct, Falco kept emitting events, every pod stayed Ready, and the
# only thing that caught it was a human executing a process by hand and noticing nothing
# fired. Each fix then verified the field it had just changed and missed the next break.
#
# This makes that manual test continuous. A rule that is never exercised is not a control, it
# is a belief -- and this one was wrong for most of a day.
#
# It also exercises the whole delivery path end to end: falco -> falcosidekick -> Discord.
# The counter this alerts on is incremented by falcosidekick, so if ANY hop between the kernel
# probe and the sidekick metric breaks, the canary stops incrementing and the alert fires.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-tripwire-canary
  namespace: honeypot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-tripwire-canary
  namespace: honeypot
rules:
  # Deliberately minimal: exec into the honeypot's own pods and nothing else.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-tripwire-canary
  namespace: honeypot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: falco-tripwire-canary
subjects:
  - kind: ServiceAccount
    name: falco-tripwire-canary
    namespace: honeypot
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: falco-tripwire-canary
  namespace: honeypot
  labels:
    app.kubernetes.io/component: tripwire-canary
spec:
  # Every 6h, not daily: the alert window has to be longer than the firing interval, and a
  # 6h cadence keeps detection of a blind tripwire inside one working day rather than two.
  schedule: "41 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: tripwire-canary
        spec:
          serviceAccountName: falco-tripwire-canary
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: canary
              image: alpine/k8s:1.34.9
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              command:
                - sh
                - -c
                - |
                  set -eu
                  POD=$(kubectl -n honeypot get pods -l app=cowrie \
                          --field-selector status.phase=Running \
                          -o jsonpath='{.items[0].metadata.name}')
                  [ -n "$POD" ] || { echo "no running cowrie pod"; exit 1; }
                  # getent is chosen deliberately. It exists in the cowrie image, is harmless,
                  # and is NOT in honeypot_expected_procs -- python/python3/python3.13 all ARE
                  # whitelisted, so the obvious candidate would silently prove nothing.
                  echo "firing tripwire canary in $POD"
                  kubectl -n honeypot exec "$POD" -c cowrie -- getent passwd root >/dev/null
                  echo "canary exec completed; the breach rule must now increment"
