---
# Dedicated CrowdSec bouncer credential for haproxy-novelty-bouncer (TALOS-hdw8).
#
# Deliberately NOT the shared `crowdsec/bouncer-api-key` the Traefik plugins use. With
# its own key it registers under its own name, so `cscli bouncers list` shows a distinct
# row with its own last-pull time -- you can tell whether honeypot enforcement is alive
# instead of guessing from a sea of identical `traefik@10.244.x.x` entries. Revoking or
# rotating this one also does not touch Traefik.
#
# The LAPI side of the same key is mounted by the registrar CronJob in ns crowdsec
# (crowdsec/novelty-bouncer-registrar.yaml), which performs the idempotent
# `cscli bouncers add`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-novelty-bouncer-key
  namespace: honeypot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-novelty-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: lapi-key
      remoteRef: {key: crowdsec, property: novelty-bouncer-api-key}
