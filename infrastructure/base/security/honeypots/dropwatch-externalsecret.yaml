---
# The SAME CrowdSec bouncer key the Traefik plugin uses, mounted into the honeypot
# namespace for the `dropwatch` sidecar (TALOS-hdw8). Read-only LAPI credentials: it
# lists decisions and nothing else. Same 1Password property as the traefik/crowdsec
# copies, so rotating the key rotates all consumers together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: honeypot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: lapi-key
      remoteRef: {key: crowdsec, property: bouncer-api-key}
