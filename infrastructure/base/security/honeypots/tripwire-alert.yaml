---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: honeypot-tripwire
  namespace: honeypot
  labels:
    app.kubernetes.io/name: honeypot
spec:
  groups:
    - name: honeypot.tripwire
      rules:
        - alert: HoneypotTripwireNotFiring
          # `or vector(0)` is load-bearing, not defensive noise. If the tripwire breaks badly
          # enough that the series disappears entirely -- which is what happened when Falco
          # lost container metadata and the rule could not match at all -- then increase()
          # returns NO SAMPLES and a bare comparison quietly evaluates to nothing. The alert
          # would stay silent in precisely the failure it exists to catch.
          #
          # This is not hypothetical: CiliumIdentityCleanupOccurred in this cluster is
          # unfirable for a related reason, and its condition is currently true and unalerted.
          expr: |
            (sum(increase(falcosecurity_falcosidekick_falco_events_total{rule=~"Honeypot Container Breach.*"}[8h])) or vector(0)) == 0
          # The canary fires every 6h, so 8h of silence means at least one run produced
          # nothing. 30m of `for:` avoids flapping around a scrape boundary while staying far
          # below the emit interval -- a `for:` longer than the firing cadence is what makes
          # an alert mathematically unfirable.
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Honeypot breach tripwire has not fired in 8h — it is probably blind"
            description: >-
              The falco-tripwire-canary CronJob execs a non-whitelisted binary inside the live
              cowrie container every 6h, which MUST produce a Honeypot Container Breach event.
              No such event has been counted in 8h, so either the canary is not running or the
              rule cannot match. This exact control was silently blind three times on
              2026-09-18: once with k8s.ns.name null, once with container.name resolving to a
              hex container ID instead of "cowrie", and once with the cri collector disabled.
              CHECK IN THIS ORDER — falco pod on the node cowrie runs on (nodeSelector pins it,
              so one node is all that matters): are k8s.ns.name AND container.name both
              resolving to real values? A 12-hex container ID in container.name is the broken
              state and is NOT null, so a null-check will pass over it.

        # ---- cowrie parser blow-up (TALOS-0s46) -------------------------------------------
        # cowrie#40597: the Earley shell parser grows superlinearly on nested $(...). Upstream
        # measured a 3 KB command taking >1 minute to parse and one instance reaching ~118.9 GB
        # before crashing. Fixed by PR #40611 (merged 2026-09-15) -- which is in NO RELEASE:
        # the newest published image is sha-6f06998 from 2026-09-14, one day earlier, and that
        # is the digest we run.
        #
        # We are NOT building a bespoke image for this. The 512Mi limit already bounds a
        # blow-up to an OOMKill of one pod rather than a node-level memory event, upstream
        # ships every 2-3 weeks, and a private image would add a build pipeline plus permanent
        # upstream-tracking burden for a bug that has not yet fired. So: detect it instead, and
        # bump the digest when the fix ships.
        #
        # This matters because the ~590-hits/week fingerprinting harness IS the pathological
        # input class -- a ~3 KB command built almost entirely of nested $(...).
        - alert: CowrieOOMKilled
          # job="kube-state-metrics" is mandatory, not decoration: KSM is scraped twice on this
          # cluster and the second job overwrites `namespace` with "monitoring", so an unpinned
          # selector silently reports the wrong namespace on any lookback.
          expr: |
            (sum(increase(kube_pod_container_status_restarts_total{
                   job="kube-state-metrics", namespace="honeypot", container="cowrie"}[1h])) or vector(0)) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "cowrie restarted — check for a parser blow-up OOMKill (TALOS-0s46)"
            description: >-
              The cowrie container restarted. Baseline is ZERO: cowrie is not crash-prone and a
              restart here is either a deliberate roll or a fault. If it is an OOMKill, the
              first suspect is cowrie#40597 — a fingerprinting command built from nested $(...)
              exhausting the 512Mi limit during parse.
              CHECK: kubectl get pod -n honeypot -l app=cowrie -o jsonpath=
              '{.items[*].status.containerStatuses[*].lastState.terminated.reason}'
              — OOMKilled confirms it. Then find the command: the parse happens BEFORE
              cowrie.command.input is logged, so the triggering input may never appear in Loki;
              correlate on the session that was open at the restart timestamp instead.
              If confirmed, bump the cowrie image to a build containing 861b840.
        - alert: CowrieMemoryNearLimit
          # Early warning: a parse blow-up climbs fast, but sustained growth toward the ceiling
          # is also how we would notice a slow leak before it becomes a restart.
          expr: |
            max(container_memory_working_set_bytes{namespace="honeypot", container="cowrie"})
              / max(kube_pod_container_resource_limits{
                    job="kube-state-metrics", namespace="honeypot", container="cowrie", resource="memory"}) > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cowrie memory >85% of its 512Mi limit for 15m"
            description: >-
              Steady state is ~300Mi (~59%). Sustained time above 85% means either a slow leak
              or repeated expensive parses. See TALOS-0s46; this is the warning that precedes
              CowrieOOMKilled rather than a duplicate of it.
