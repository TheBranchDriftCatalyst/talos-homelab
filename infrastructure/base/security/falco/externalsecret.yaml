---
# Discord webhook for falcosidekick CRITICAL alerts (TALOS-vy8s).
#
# Same 1Password item CrowdSec posts bans to, so both security channels rotate together.
# The falcosidekick chart maps every UPPERCASE key in `existingSecret` onto a config env
# var, hence the key name: DISCORD_WEBHOOKURL -> config.discord.webhookurl.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-discord
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: falco-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOKURL
      remoteRef: {key: flux-discord-webhook, property: webhook_url}
---
# falcosidekick-ui local basic-auth credential (replaces the chart default admin:admin).
#
# WHY THIS EXISTS: Authentik forward-auth (ingress.yaml) only gates the Traefik hop. The
# falcosidekick-ui app ALSO has its own basic auth, and upstream ships it as `admin:admin`
# (falcosidekick-ui README: "If no user is set and the authentication is not disabled, the
# default user is admin:admin"). So anything that reached the pod/Service in-cluster logged
# straight in and bypassed SSO entirely. This ES mints the real credential from 1Password so
# that bypass needs a 40-char secret nobody has.
#
# FORMAT: the app wants ONE env var in `<login>:<password>` form, so the two 1Password fields
# are joined by the ESO template (same shape as monitoring/grafana-instances/
# admin-credentials-externalsecret.yaml). The password is deliberately ALPHANUMERIC-ONLY --
# the app splits this string on ":", so a ":" in the password would truncate it.
#
# KEY NAME: FALCOSIDEKICK_UI_USER is the env var the UI container reads. The chart wires this
# Secret in as `webui.existingSecret`, which becomes a SECOND envFrom secretRef AFTER the
# chart's own -ui Secret, so this value wins. helmrelease.yaml also sets `webui.user: ""` so
# the chart omits the key from its own Secret entirely and admin:admin is not even at rest.
#
# FAIL-CLOSED: the chart's envFrom secretRef is NOT optional, so if this ES has not synced the
# UI pod stays in CreateContainerConfigError rather than starting up on the admin:admin default.
#
# deletionPolicy Retain: losing the 1Password item must not silently drop the credential and
# hand the pod back its admin:admin fallback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-webui-auth
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: falco-webui-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        FALCOSIDEKICK_UI_USER: '{{ .username }}:{{ .password }}'
  data:
    - secretKey: username
      remoteRef: {key: falco, property: webui-username}
    - secretKey: password
      remoteRef: {key: falco, property: webui-password}
