---
# Discord webhook for falcosidekick CRITICAL alerts (TALOS-vy8s).
#
# Same 1Password item CrowdSec posts bans to, so both security channels rotate together.
# The falcosidekick chart maps every UPPERCASE key in `existingSecret` onto a config env
# var, hence the key name: DISCORD_WEBHOOKURL -> config.discord.webhookurl.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-discord
  namespace: falco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: falco-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOKURL
      remoteRef: {key: flux-discord-webhook, property: webhook_url}
