---
# Alerting on falcosidekick's own delivery failures.
#
# WHY THIS EXISTS. On 2026-10-19 the UI's redis was OOMKilled, its RediSearch index went
# with it, and falcosidekick-ui returned 500 on every POST from that moment on -- it only
# creates the index at process startup and never retries. It ran broken for 24 days before
# anyone noticed, producing ~170,000 error lines a day while doing so.
#
# Nothing caught it, for a specific and repeatable reason: the UI's /healthz returns
# {"status":"ok"} without touching redis, so the pod stayed 1/1 Running throughout and
# every liveness signal in the cluster said healthy. The only honest signal is the sender's
# own view -- falcosidekick counting its deliveries as failed.
#
# JOB LABEL PINNED ON PURPOSE. falcosidekick was being scraped twice (the chart's
# prometheus.io/scrape annotation plus this directory's PodMonitor), which doubled every
# series. The annotation is now disabled in helmrelease.yaml, and pinning the job here
# means these rules keep meaning the same thing even if annotation-based discovery is ever
# re-enabled by a chart upgrade.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: falcosidekick-delivery
  namespace: falco
  labels:
    app.kubernetes.io/name: falcosidekick
spec:
  groups:
    - name: falcosidekick.delivery
      rules:
        # The one that would have caught the 24-day outage on day one.
        #
        # ANY sustained error rate to ANY output, rather than a threshold on volume: a
        # broken output fails every single POST, so the rate is either ~zero or
        # ~everything. "Greater than zero for ten minutes" therefore has no tuning to get
        # wrong, and ten minutes rides out a rollout or a brief restart.
        - alert: FalcosidekickOutputFailing
          expr: |
            sum by (destination) (
              rate(falcosecurity_falcosidekick_outputs_total{job="falco/falcosidekick",status="error"}[10m])
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "falcosidekick cannot deliver to {{ $labels.destination }}"
            description: >-
              Every alert routed to this output is being lost and logged as an error.
              Check the RECEIVER first, not falcosidekick -- this fires on the sender's
              view, so the fault is almost always at the other end.
              READ THE LOG LINE CAREFULLY: falcosidekick logs an HTTP 500 as "exceeding
              post rate limit (500)". That string is an upstream mislabel (outputs/client.go
              formats ErrTooManyRequest in the 500 branch) and does NOT mean rate limiting.
              The number in brackets is the real status; a genuine rate limit is 429.
              Chasing the words rather than the code is what turned one outage into a
              fortnight of looking for throttling that was never happening.

        # A rule for the UI's redis restarting lived here and has been removed with the UI
        # (helmrelease.yaml, webui.enabled: false). It watched a specific pod name, so
        # with that pod gone the expression matches no series and can never fire — an
        # alert that cannot fire is worse than no alert, because it reads as coverage.
        # Restore it alongside the UI if the UI ever comes back.

        # The sender itself going quiet. Distinct from the above: those fire when delivery
        # fails, this fires when nothing is reporting at all.
        - alert: FalcosidekickMetricsMissing
          expr: absent(up{job="falco/falcosidekick"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "falcosidekick is not being scraped"
            description: >-
              Without this scrape the delivery alerts above cannot fire, so a silent
              falcosidekick hides a broken output. Check the PodMonitor in
              infrastructure/base/security/falco/podmonitor.yaml and that the pods still
              carry app.kubernetes.io/name=falcosidekick.
