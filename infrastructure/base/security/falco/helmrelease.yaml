apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 30m
  chart:
    spec:
      chart: falco
      version: "9.1.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: falco
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Talos is immutable — no kernel-module builds. Modern eBPF (CO-RE) ships in the Falco
    # binary, needs kernel >= 5.8 (Talos is fine), no init container, no driver-loader.
    driver:
      kind: modern_ebpf
    tty: true
    # LEAST PRIVILEGE (TALOS-cscw). The chart defaults to privileged: true, which modern_ebpf
    # does not need -- the chart's own values file documents exactly this capability set as
    # the alternative. Replacing full privilege with four capabilities is the single largest
    # privilege reduction available in this tree.
    #
    # What each one is for: BPF loads the CO-RE probe, PERFMON reads the perf ring buffer,
    # SYS_RESOURCE raises the locked-memory limit the probe needs, SYS_PTRACE reads
    # /proc/<pid> for process lineage in rule output.
    #
    # IF DETECTION STOPS AFTER A CHANGE HERE, THIS IS THE FIRST THING TO REVERT -- a missing
    # capability makes the probe fail to load, and Falco keeps running while detecting
    # nothing. Verify with falcosecurity_falcosidekick_falco_events_total per hostname, not
    # with pod readiness.
    containerSecurityContext:
      privileged: false
      capabilities:
        drop: [ALL]
        add: [BPF, PERFMON, SYS_RESOURCE, SYS_PTRACE]
    # Only containerd exists on Talos. The chart mounts a hostPath socket per ENABLED engine
    # regardless of whether it exists, so the defaults gave this pod six runtime sockets --
    # docker, podman, crio and k3s among them -- none of which can be present here. Falco's
    # own startup log confirms it only ever enabled /run/host-containerd/containerd.sock.
    # Disabling the dead ones removes four host mounts from the most privileged pod we run.
    # NOTE the path is collectors.containerEngine.engines -- NOT collectors.container.*,
    # which is silently ignored.
    #
    # THE cri ENGINE IS LOAD-BEARING. Disabling it killed container metadata cluster-wide:
    # k8s.ns.name went null on 299/299 sampled events and container.name became "host". Every
    # honeypot-breach rule filters on k8s.ns.name = "honeypot" AND container.name in
    # (cowrie, beelzebub), so none of them could fire -- Falco kept emitting events and looked
    # perfectly healthy while the tripwires were blind.
    #
    # HOW TO VERIFY, and it must be all three: event COUNTS cannot detect this at all; sample
    # output_fields and confirm BOTH k8s.ns.name AND container.name resolve; and do it PER
    # NODE, because the failure was per-node. container.name resolving to a 12-hex container
    # ID is the broken state -- it is not null, so a null-check passes straight over it.
    #
    # containerd and cri are different protocols against the same daemon: the native
    # containerd API does not carry the Kubernetes pod metadata that the CRI API does.
    #
    # /run/host-containerd/containerd.sock DOES NOT EXIST ON TALOS. Verified from inside the
    # pod: kubelet materialises that hostPath as an EMPTY DIRECTORY, so listing it is a decoy
    # that silently resolves to nothing. Only /run/containerd/containerd.sock is a real socket
    # (srw-rw---- root:root; falco runs as uid 0, so no DAC_OVERRIDE is needed to read it).
    #
    # docker/podman stay disabled: genuinely absent here, and each enabled engine mounts its
    # hostPath socket whether or not the path is real.
    collectors:
      containerEngine:
        engines:
          docker: {enabled: false}
          podman: {enabled: false}
          # NATIVE containerd IS DISABLED ON PURPOSE. Enabling it alongside cri on the SAME
          # socket makes the two engines race for the container cache, and the winner differs
          # PER NODE and across restarts. On talos02-gpu the native engine won and resolved
          # container.name to the 12-hex container ID on 133/133 events, while every other
          # node resolved real names -- and all three honeypot pods are pinned to
          # talos02-gpu by nodeSelector, so the breach rules were dead exactly where they
          # matter. A restart could silently flip any node either way.
          #
          # This is the SECOND time these rules were blind today. The first fix restored
          # k8s.ns.name and verified only that field; container.name stayed broken and the
          # rules still could not match. Verify BOTH fields, per node, and prefer the node
          # the honeypot actually runs on.
          containerd: {enabled: false}
          cri:
            enabled: true
            sockets:
              - /run/containerd/containerd.sock
    falco:
      rules_files:
        - /etc/falco/falco_rules.yaml
        - /etc/falco/rules.d
      json_output: true
      priority: notice
    # falcosidekick fans alerts out; route to Loki so they're queryable in Grafana alongside the
    # honeypot logs. (enabling it auto-wires Falco's HTTP+JSON output to sidekick.)
    falcosidekick:
      enabled: true
      webui:
        enabled: true
        # --- Local basic auth: NOT admin:admin (security audit) ---
        # The UI has its OWN basic auth underneath the Authentik forward-auth at the ingress,
        # and upstream defaults it to admin:admin. Authentik only guards the Traefik hop, so
        # that default was a full in-cluster SSO bypass for anything able to reach the
        # Service. Two settings close it, plus webui-network-policy.yaml.
        #
        # user: "" -- the chart writes FALCOSIDEKICK_UI_USER into its own -ui Secret only
        # `{{- if .Values.webui.user }}`, so emptying it keeps admin:admin from ever being
        # written to the cluster at all.
        user: ""
        # KEPT DELIBERATELY even though disableauth is true below and the app now ignores
        # this credential. It costs nothing (the secret is synced regardless) and it is the
        # guardrail for re-enabling auth: the app falls back to admin:admin whenever
        # FALCOSIDEKICK_UI_USER is ABSENT, so flipping disableauth back to false with this
        # removed would silently restore the default credential. With it present, that flip
        # lands on the 1Password value instead. Do not "clean this up" as unused.
        existingSecret: falco-webui-auth
        # ONE-CLICK SSO (operator decision). The app's own basic-auth prompt is off, so
        # reaching https://falco.talos00 means exactly one login -- Authentik -- instead of
        # an SSO round trip followed by a second credential box. Same posture the crowdsec
        # web-ui already uses.
        #
        # THIS MAKES webui-network-policy.yaml THE ONLY IN-CLUSTER CONTROL. It was verified
        # live before flipping: the policy is applied, its podSelector matches both UI pods,
        # and the pods are Ready (so kubelet probes traverse it). If that policy is ever
        # deleted or its selector drifts, the UI becomes open to anything in the cluster --
        # there is no second layer behind it any more.
        #
        # Event ingestion is unaffected either way: falcosidekick POSTs to the UI over
        # WEBUI_URL, and the UI's auth middleware skipped ALL POSTs even when auth was on.
        disableauth: true
        # X<unit> format, NOT raw seconds -- the chart documents `ttl: X<unit>` with unit in
        # s/m/d/w. An earlier 604800 here was not 7 days, it was an invalid value.
        ttl: "7d"
        # BUNDLED redis-stack, NOT Dragonfly. Dragonfly was tried (78612fd6) and REVERTED:
        # falcosidekick-ui writes every event through github.com/Issif/redisearch-go, whose
        # Index() emits FT.ADD -- the deprecated RediSearch v1 API. redis-stack keeps FT.ADD
        # as a back-compat alias that internally HSETs; Dragonfly implemented only the modern
        # subset (FT.CREATE/SEARCH/AGGREGATE/INFO/_LIST/DROPINDEX) and never FT.ADD. The UI
        # therefore returned 500 on every POST and stored nothing: DBSIZE 0, empty UI, while
        # the index itself existed because FT.CREATE succeeded. Still true on the UI's master
        # (v2.3.1, same library), so this is not fixable by upgrading or by config.
        #
        # My pre-switch check tested FT.CREATE/_LIST/SEARCH/DROPINDEX -- exactly the commands
        # Dragonfly HAS -- and never exercised the write path. Test the WRITE, not the schema.
        #
        # THE ORIGINAL GROWTH BUG IS STILL FIXED, without Dragonfly. That unbounded 1.43GB RDB
        # came from ttl: 604800, which is not a valid value (the chart wants X<unit>), so no
        # TTL was ever applied AND there was no maxmemory. Now: a real 7d TTL expires each
        # event key, an lru ceiling backstops it if TTL ever fails again, and the memory limit
        # sits ABOVE maxmemory so redis evicts rather than being OOM-killed.
        #
        # storageEnabled: false is deliberate -- events are ephemeral telemetry (Loki is the
        # authoritative sink), and it means no PVC to reload a huge RDB from on restart, which
        # is what turned the growth bug into a CrashLoop in the first place.
        redis:
          enabled: true
          storageEnabled: false
          customConfig:
            - maxmemory 512mb
            - maxmemory-policy allkeys-lru
            - save ""
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 768Mi}
      config:
        # The webhook URL is NEVER in git: this secret is the ESO-managed copy of the same
        # 1Password item CrowdSec posts its bans to. The chart reads every UPPERCASE key in
        # it as a config env var, so DISCORD_WEBHOOKURL wires the output.
        #
        # Path matters: this is config.existingSecret. An earlier attempt put it at
        # falcosidekick.existingSecret, one level too high, where the chart never reads it --
        # the deployment came up with no DISCORD env at all and the output silently did
        # nothing. The only `existingSecret` in the PARENT chart is for certs.
        existingSecret: falco-discord
        loki:
          hostport: "http://loki.monitoring.svc:3100"
          apiendpoint: "/loki/api/v1/push"
          tenant: ""
          minimumpriority: "notice"
        # CRITICAL alerts now reach a human (TALOS-vy8s). Until this existed, outputs were
        # Loki + the WebUI only -- so the honeypot-breach tripwires below, the entire reason
        # this deployment exists, fired into a log stream nobody is paged from.
        #
        # critical ONLY on purpose: at `notice` this channel would carry the ~3.7k/day
        # false-positive stream (see TALOS-cscw) and be muted within a day. Loki keeps the
        # full-fidelity record for investigation; Discord carries only "something escaped".
        discord:
          minimumpriority: "critical"
    # Honeypot-breach tripwires: Cowrie + Beelzebub EMULATE the shell, so any real process exec,
    # shell spawn, sensitive-file read, or unexpected outbound in those pods = a containment breach
    # (someone escaped the emulation into the real container). CRITICAL. Also the runtime-detection
    # net for the future KubeVirt VM detonation backend.
    customRules:
      # Two known-benign sources were producing ~150-270 CRITICAL events per 30 MINUTES and
      # 1,027 Discord posts, all from one upstream rule. Since CRITICAL now routes to Discord
      # (TALOS-vy8s) and the honeypot breach rule has just been PROVEN to fire, that volume is
      # the thing most likely to bury a real breach -- a channel this noisy gets muted, and
      # then the tripwire might as well not exist.
      #
      # Both exclusions are deliberately narrow, matched on exepath/pod rather than on
      # something broad like "ignore ns=monitoring":
      #   1. cilium-cni -- the CNI binary invoked by containerd on the HOST for every pod
      #      sandbox. It reports container_id=runtime with k8s_ns_name=<NA> because it is not
      #      running in a container at all, so no metadata fix can make it stop; it has to be
      #      excluded by identity.
      #   2. alertmanager-config-pusher -- OUR OWN CronJob. An alpine image that legitimately
      #      runs update-ca-certificates, c_rehash, envsubst and curl on every start, which is
      #      exactly what "binary not part of base image" is designed to detect. Genuinely
      #      benign, and it runs every 15 minutes.
      #
      # This narrows ONE upstream rule. It does not touch the honeypot breach rules.
      drop-and-execute-exceptions.yaml: |-
        - rule: Drop and execute new binary in container
          condition: >
            and not (proc.exepath = "/opt/cni/bin/cilium-cni" and container.id = "runtime")
            and not (k8s.ns.name = "monitoring" and k8s.pod.name startswith "alertmanager-config-pusher")
          # `override: {condition: append}`, NOT the bare `append: true` key -- falco --validate
          # reports that one as LOAD_DEPRECATED_ITEM. A deprecated key on a security rule is
          # precisely the thing that stops working on a chart bump and takes the exception with
          # it, restoring the flood silently.
          override:
            condition: append
      honeypot-breach.yaml: |-
        - macro: honeypot_ns
          condition: (k8s.ns.name = "honeypot")
        # Only the EMULATOR containers (cowrie, beelzebub) emulate the shell in-process, so a real exec
        # there = escaped emulation = breach. The honeypot ns also runs REAL infra whose normal procs are
        # expected and must NOT trip the tripwire: haproxy (the LB front), logship (cowrie log sidecar),
        # archive (the cowrie-archive backup CronJob: busybox date/sh/tar), render-config (beelzebub init).
        # Allowlist the emulators explicitly rather than blocklisting each infra container (whack-a-mole).
        - macro: honeypot_emulator
          condition: (honeypot_ns and container and container.name in (cowrie, beelzebub))
        - list: honeypot_expected_procs
          items: [twistd, python3, python, beelzebub, busybox, sh, tail, touch, sed, pause]
        - rule: Honeypot Container Breach - Unexpected Process
          desc: >
            A process was executed inside a honeypot emulator container. Cowrie (python/twistd) and
            Beelzebub (go binary) emulate the shell in-process, so a real exec here beyond the known
            entrypoint indicates an attacker broke OUT of the emulation into the actual container.
          # The `not container_start` clause is load-bearing, not cosmetic. Without it this
          # rule fires CRITICAL on every single pod restart: the container's own init is
          # spawned by runc and its name is not in the expected list, so a routine rollout
          # looked exactly like an escape. Measured on the live cluster -- proc.cmdline
          # "6 init", proc.pname "runc", user root -- 4 hits from one afternoon of cowrie
          # restarts. With CRITICAL now routed to Discord (TALOS-vy8s), that is the precise
          # way an alert channel gets muted and a real breach gets missed.
          #
          # Scoped to vpid=1 deliberately: `kubectl exec` into the emulator is ALSO parented
          # by runc, and that IS worth alerting on, so excluding parent=runc wholesale would
          # blind the rule to exactly the operator-or-attacker exec it should catch. Only the
          # container's own PID 1 at startup is exempted.
          condition: >
            spawned_process and honeypot_emulator
            and not proc.name in (honeypot_expected_procs)
            and not (proc.pname = runc and proc.vpid = 1)
          output: >
            HONEYPOT BREACH unexpected process (ns=%k8s.ns.name pod=%k8s.pod.name container=%container.name
            proc=%proc.cmdline parent=%proc.pname user=%user.name)
          priority: CRITICAL
          tags: [honeypot, container_escape, mitre_execution]
        - rule: Honeypot Container Breach - Sensitive File Read
          desc: A honeypot emulator container read a sensitive host/credential file — real fs access = breach.
          condition: open_read and honeypot_emulator and fd.name in (/etc/shadow, /etc/sudoers, /root/.ssh/id_rsa, /var/run/secrets/kubernetes.io/serviceaccount/token)
          output: >
            HONEYPOT BREACH sensitive read (ns=%k8s.ns.name pod=%k8s.pod.name file=%fd.name proc=%proc.cmdline)
          priority: CRITICAL
          tags: [honeypot, container_escape, mitre_credential_access]
