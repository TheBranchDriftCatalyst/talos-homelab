apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco
resources:
  - tripwire-canary.yaml # continuously proves the honeypot breach rule still fires
  - externalsecret.yaml # Discord webhook (TALOS-vy8s) + the WebUI basic-auth credential
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - podmonitor.yaml
  - prometheusrule.yaml # delivery failures: the UI ran broken 24 days with nothing watching
  # ingress.yaml and webui-network-policy.yaml are OUT, not deleted: both exist only to
  # reach falcosidekick-ui, which is retired in helmrelease.yaml. Left on disk so bringing
  # the UI back is re-adding two lines here rather than reconstructing them. An Ingress
  # pointing at a Service the chart no longer renders is a 503 with a DNS name attached,
  # and a NetworkPolicy selecting absent pods is a rule nobody can reason about.
  # - ingress.yaml
  # - webui-network-policy.yaml # UI reachable only via Traefik (SSO) + falcosidekick
  - core-network-policy.yaml # falcosidekick event intake + metrics (TALOS-cscw)
  - dashboards/falco-ops.yaml # Grafana dashboard CR (Grafana is in `monitoring` -> allowCrossNamespaceImport)

configMapGenerator:
  # Dashboard JSON. disableNameSuffixHash keeps the name stable at `dashboard-falco-ops`,
  # which is what the CR's configMapRef.name points at -- a hash suffix would dangle the ref.
  # The `namespace: falco` transformer above puts BOTH this ConfigMap and the CR in `falco`,
  # which is required because configMapRef resolves in the CR's own namespace.
  - name: dashboard-falco-ops
    options:
      disableNameSuffixHash: true
    files:
      - dashboards/falco-ops.json
