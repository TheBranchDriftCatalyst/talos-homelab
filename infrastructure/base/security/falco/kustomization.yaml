apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falco
resources:
  - externalsecret.yaml # Discord webhook (TALOS-vy8s) + the WebUI basic-auth credential
  - namespace.yaml
  - dragonfly.yaml # Redis-compatible store for the WebUI (house pattern, TALOS-wn69)
  - helmrepository.yaml
  - helmrelease.yaml
  - podmonitor.yaml
  - ingress.yaml
  - webui-network-policy.yaml # UI reachable only via Traefik (SSO) + falcosidekick
