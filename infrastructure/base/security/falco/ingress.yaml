---
# falcosidekick-ui at falco.talos00 — the Falco alert UI (events, stats, replay). LAN-only +
# Authentik SSO (forward_single), mirroring the crowdsec web-ui pattern. The `falco` Authentik
# proxy provider + application already exist in authentik/infra-admin-blueprint.yaml and are
# unioned into the embedded outpost by authentik/talos-private-blueprint.yaml; the ONE
# HostRegexp route in authentik/ingressroute.yaml carries /outpost.goauthentik.io/* here.
#
# The middlewares below gate the INGRESS hop only. The app's own login is no longer the chart
# default admin/admin — helmrelease.yaml sources it from 1Password (externalsecret.yaml), and
# webui-network-policy.yaml stops in-cluster callers from reaching the pod behind Traefik.
#
# NO /api carve-out here, deliberately. The arr-stack apps exclude /api so machine clients can
# use an API key, but this UI's /api/v1/* GETs are made by the SPA in the BROWSER and must stay
# behind SSO; the only machine client is falcosidekick, which POSTs in-cluster and never
# traverses this route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: falcosidekick-ui
  namespace: falco
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Falco"
    gethomepage.dev/description: "Runtime security alerts (falcosidekick UI)"
    gethomepage.dev/group: "Security"
    gethomepage.dev/icon: "falco.png"
    gethomepage.dev/href: "https://falco.talos00"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`falco.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: authentik
          namespace: authentik
      services:
        - name: falco-falcosidekick-ui
          port: 2802
  tls: {}
---
# HTTP→HTTPS redirect for falco.talos00.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: falcosidekick-ui-http
  namespace: falco
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`falco.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: falco-falcosidekick-ui
          port: 2802
