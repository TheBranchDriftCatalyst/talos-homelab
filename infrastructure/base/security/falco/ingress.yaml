---
# falcosidekick-ui at falco.talos00 — the Falco alert UI (events, stats, replay). LAN-only +
# Authentik SSO, mirroring the crowdsec web-ui pattern. Default UI login is admin/admin; the
# Authentik + lan-only middlewares are the real gate in front of it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: falcosidekick-ui
  namespace: falco
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Falco"
    gethomepage.dev/description: "Runtime security alerts (falcosidekick UI)"
    gethomepage.dev/group: "Security"
    gethomepage.dev/icon: "falco.png"
    gethomepage.dev/href: "https://falco.talos00"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`falco.talos00`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: authentik
          namespace: authentik
      services:
        - name: falco-falcosidekick-ui
          port: 2802
  tls: {}
---
# HTTP→HTTPS redirect for falco.talos00.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: falcosidekick-ui-http
  namespace: falco
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`falco.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: falco-falcosidekick-ui
          port: 2802
