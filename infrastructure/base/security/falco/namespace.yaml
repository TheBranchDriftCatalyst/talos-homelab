# Falco runtime security (TALOS-slbn) — cluster-wide syscall detection (we had NONE: no Falco, no
# Tetragon, Hubble is network-only). DaemonSet needs privileged + host access -> privileged PSA.
apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    # Kubernetes namespaces are FLAT — there is no nesting. This label IS the
    # grouping: `security/` is a directory, never a namespace, and policy selects
    # these four by `namespaceSelector` on this label rather than by name.
    app.kubernetes.io/part-of: security
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
