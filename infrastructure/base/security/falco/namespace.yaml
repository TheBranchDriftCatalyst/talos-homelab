# Falco runtime security (TALOS-slbn) — cluster-wide syscall detection (we had NONE: no Falco, no
# Tetragon, Hubble is network-only). DaemonSet needs privileged + host access -> privileged PSA.
apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
