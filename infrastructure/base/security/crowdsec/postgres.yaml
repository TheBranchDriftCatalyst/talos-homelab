---
# CrowdSec LAPI's datastore, as a CatalystCNPGAppDB.
#
# Replaces a hand-written Cluster plus a separate ObjectStore and ScheduledBackup (134 lines
# across three files). The composite renders all three, plus the ExternalSecret that brings
# the MinIO backup credentials into this namespace — previously a central reflector allowlist
# that fails late and quietly when someone forgets to edit it.
#
# WHY POSTGRES AT ALL (TALOS-pbn): this replaced a SQLite-on-local-path datastore whose
# failure mode was silent and total. local-path is node-local with a Delete reclaim policy, so
# any LAPI reschedule wiped EVERY registered machine. Agents, the traefik bouncer and the
# web-ui re-register from env or the machine-registrar CronJob, but the appsec component
# registers via a ONE-SHOT init container with no re-register path, so it CrashLoopBackOff'd
# forever on "ent: machine not found". Postgres makes LAPI stateless and node-independent.
# SQLite-on-NFS was rejected — NFS advisory-lock flakiness corrupts the file.
#
# CNPG still creates the same things it always did: a 'crowdsec' database owned by 'crowdsec',
# Secret 'crowdsec-postgres-app' that LAPI reads its DB creds from, and Service
# 'crowdsec-postgres-rw'. The reflect-cnpg-app-secrets ClusterPolicy stamps the reflector
# annotations onto that app secret cluster-wide, so the dbgate mirror stays automatic.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: crowdsec-postgres
  namespace: crowdsec
spec:
  database: crowdsec
  owner: crowdsec
  # Three replicas, and three is the floor while this is on local-path: local-path is
  # WaitForFirstConsumer, so each PV pins to the node that first mounted it and a single
  # instance would be stranded by a node loss. Three copies on three nodes makes a lost node
  # a promotion instead of an outage. (TALOS-npt4)
  instances: 3
  storageSize: 5Gi
  # The node's NVMe. Every Postgres commit is a WAL fsync, and on NFS that is a network round
  # trip to the Synology; durability here comes from streaming replication plus barman
  # backups, not from the filesystem underneath.
  storageClass: local-path
  # Pinned rather than inherited so an operator upgrade cannot walk this cluster onto a new
  # Postgres major on its own — that is a decision, not a default.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  # 02:30 daily, unchanged. The fleet is deliberately staggered (forgejo 02:00, authentik
  # 02:15, linkwarden 02:45, ... guacamole 04:15) so fourteen databases do not all hit MinIO
  # in the same minute. 6-field cron: sec min hour dom mon dow.
  backupSchedule: "0 30 2 * * *"
  resources:
    requestsCpu: 50m
    requestsMemory: 256Mi
