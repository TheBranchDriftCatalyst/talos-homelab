---
# Read-only LAPI bouncer credentials. No watcher credentials, database access,
# Kubernetes API permissions, or public route. Enforcement does not depend on this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-decision-exporter
  namespace: crowdsec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crowdsec-decision-exporter
  template:
    metadata:
      labels:
        app: crowdsec-decision-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.12.12-alpine3.22
          command: [python, -B, /app/exporter.py]
          env:
            - name: LAPI_URL
              value: https://crowdsec-service.crowdsec.svc.cluster.local:8080  # LAPI is TLS now (dw2p #3)
            # Its OWN bouncer credential, not the Traefik fleet's. Previously this read
            # BOUNCER_KEY_traefik, so revoking or rotating this read-only observer meant
            # rotating every enforcing bouncer at the same time.
            - name: API_KEY_FILE
              value: /keys/lapi-key
          ports:
            - name: metrics
              containerPort: 9108
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: lapi-ca, mountPath: /tls, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: crowdsec-decision-exporter
        # ca.crt is published by cert-manager into the SAME secret that serves the LAPI cert,
        # so verification needs no new Certificate, no new issuer and no cross-namespace copy.
        - name: lapi-ca
          secret:
            secretName: crowdsec-lapi-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: keys
          secret:
            secretName: crowdsec-decision-exporter-key
            defaultMode: 0440
            items:
              - key: lapi-key
                path: lapi-key
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: crowdsec-decisions
  namespace: crowdsec
spec:
  selector:
    matchLabels:
      app: crowdsec-decision-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-decision-exporter
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app: crowdsec-decision-exporter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9108}
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: lapi
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
