---
# CrowdSec bouncer Traefik middleware (TALOS-pbn). Lives in ns `traefik`; referenced globally as
# traefik-bouncer@kubernetescrd once the entrypoint bind is added to the Traefik helmrelease.
# Requires experimental.plugins.bouncer in the Traefik helmrelease + the crowdsec-bouncer-key secret
# mounted at /etc/traefik/crowdsec. Fail closed for external traffic; LAN bypass remains available for recovery.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bouncer
  namespace: traefik
spec:
  plugin:
    bouncer:
      enabled: "true"
      logLevel: INFO
      # --- LAPI (stream mode: decisions cached locally, LAPI is out-of-band) ---
      crowdsecMode: stream
      crowdsecLapiScheme: https  # LAPI is TLS (self-signed CA via cert-manager, TALOS-3pdz)
      crowdsecLapiTLSInsecureVerify: "true"  # self-signed CA, in-cluster hop
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key
      # Keep cached decisions through short interruptions; close after five failed refreshes.
      updateIntervalSeconds: "60"
      updateMaxFailure: "5" # fail closed after repeated failed decision refreshes
      streamStartupBlock: "true" # no unprotected startup before initial decisions arrive
      httpTimeoutSeconds: "10"
      defaultDecisionSeconds: "60"
      # 429, NOT 403 — this breaks a self-reinforcing ban loop (TALOS-crowdsec-selfban).
      #
      # The bouncer answers every request from a banned IP with this code. When it was
      # 403, that answer was itself evidence for the scenarios that issue bans, so a ban
      # manufactured the proof of its own necessity and renewed forever. That is the
      # documented 2026-08-20 incident: a few 403s out of an SSO flow tripped
      # LePresidente/http-generic-403-bf, the resulting 403-to-everything refilled the
      # same bucket, and the operator stayed locked out of Authentik for 32 hours. The
      # only escape was pinning a home IP in homelab/whitelist, which treats one address
      # rather than the loop.
      #
      # NINE installed scenarios count 403 as evidence, so the feedback was never limited
      # to the 403-bf scenario: LePresidente/http-generic-403-bf, crowdsecurity/http-probing
      # (400/403/404), http-admin-interface-probing, http-cve-probing,
      # http-technology-probing, http-wordpress-scan, and CVE-2024-0012 / CVE-2024-38475 /
      # CVE-2024-9474 (all 403/404).
      #
      # NO installed scenario matches 429 (verified by grepping every file under
      # /etc/crowdsec/scenarios), so a blocked request no longer feeds anything: the
      # leaky bucket drains and the ban expires on its own schedule. 429 is also the
      # honest semantic for "you are being rate-limited/remediated".
      #
      # BEFORE CHANGING THIS BACK: any status you pick must not appear in a scenario
      # filter, or the loop returns. Re-run:
      #   kubectl -n crowdsec exec <agent> -c crowdsec-agent -- \
      #     grep -rn "http_status" /etc/crowdsec/scenarios/
      remediationStatusCode: "429"
      # --- real client IP behind Cloudflare (trust CF proxies' X-Forwarded-For) ---
      # TALOS-lxz5.1 (5.1.4b): 10.0.0.0/8 REMOVED. Trusting the pod/service CIDR let
      # any pod forge X-Forwarded-For and spoof the client IP the bouncer evaluates.
      # Only Cloudflare's published ranges are trusted; real ingress transits CF.
      forwardedHeadersTrustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
      # --- plugin-side allowlist: these bypass ALL bouncer checks (LAN never locked out) ---
      # TALOS-lxz5.1 (5.1.4b): 10.0.0.0/8 REMOVED. It whitelisted the entire pod/service
      # CIDR, so any workload (or a spoofed source that resolved into that range) bypassed
      # CrowdSec entirely. Kept 192.168.0.0/16 so LAN admins retain recovery access and are
      # never locked out by a bad decision; tighten to specific admin hosts if desired.
      clientTrustedIPs:
        - "192.168.0.0/16"
      # --- AppSec / WAF (existing detection policy; fail closed on unavailability) ---
      crowdsecAppsecEnabled: "true"
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      # MUST be set explicitly. The plugin defaults crowdsecAppsecScheme to
      # crowdsecLapiScheme when it is empty (bouncer.go: `if config.CrowdsecAppsecScheme
      # == "" { config.CrowdsecAppsecScheme = config.CrowdsecLapiScheme }`), so moving
      # the LAPI to https (TALOS-3pdz) silently dragged AppSec to https too. AppSec's
      # inbound :7422 listener is plain HTTP — appsec.tlsClientAuth governs AppSec's
      # OUTBOUND leg to the LAPI, not this one — so every query failed at the transport
      # and, with UnreachableBlock below, 403'd every request through Traefik fleet-wide.
      crowdsecAppsecScheme: http
      crowdsecAppsecFailureBlock: "true" # AppSec internal 500 → block (present-but-erroring is suspicious)
      crowdsecAppsecUnreachableBlock: "true" # no uninspected external requests during an outage
      crowdsecAppsecBodyLimit: "10485760"
