# AbuseIPDB API key from 1Password (vault catalyst-eso, item "abuse-ip", field "password").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abuseipdb-key
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: abuseipdb-key
    creationPolicy: Owner
  data:
    - secretKey: ABUSEIPDB_API_KEY
      remoteRef: {key: abuse-ip, property: password}
