---
# CrowdSec IPS (TALOS-pbn). PSA privileged: the agent runs as a DaemonSet that host-mounts
# /var/log/pods to read Traefik's container logs (containerd CRI log format on Talos).
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    # Kubernetes namespaces are FLAT — there is no nesting. This label IS the
    # grouping: `security/` is a directory, never a namespace, and policy selects
    # these four by `namespaceSelector` on this label rather than by name.
    app.kubernetes.io/part-of: security
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
