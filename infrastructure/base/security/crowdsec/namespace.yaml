---
# CrowdSec IPS (TALOS-pbn). PSA privileged: the agent runs as a DaemonSet that host-mounts
# /var/log/pods to read Traefik's container logs (containerd CRI log format on Talos).
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
