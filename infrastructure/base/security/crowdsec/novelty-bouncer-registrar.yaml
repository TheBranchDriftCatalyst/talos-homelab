---
# Self-healing registrar for the `haproxy-novelty-bouncer` LAPI bouncer (TALOS-hdw8).
#
# WHY: the chart's Traefik bouncer re-registers from env on every boot, but this one is
# added imperatively (`cscli bouncers add`), so it has no automatic re-register path.
# The LAPI datastore is durable CNPG Postgres, so a registered bouncer normally survives
# restarts -- this CronJob (a) performs the FIRST registration idempotently and (b) is a
# safety net if that database is ever rebuilt or migrated. It only registers when the
# bouncer is absent, so a healthy LAPI is never disturbed.
#
# Same shape as machine-registrar.yaml; see its notes on the alpine/k8s image choice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-novelty-bouncer-registrar
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-novelty-bouncer-registrar
  namespace: crowdsec
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-novelty-bouncer-registrar
  namespace: crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-novelty-bouncer-registrar
subjects:
  - kind: ServiceAccount
    name: crowdsec-novelty-bouncer-registrar
    namespace: crowdsec
---
# The LAPI-side copy of the bouncer key. The honeypot-side copy of the SAME 1Password
# property is mounted by the sidecar (honeypots/novelty-bouncer-externalsecret.yaml), so
# both ends rotate together when the item is rotated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-novelty-bouncer-key
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-novelty-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: lapi-key
      remoteRef: {key: crowdsec, property: novelty-bouncer-api-key}
---
# The decision exporter's OWN bouncer credential. It used to authenticate with
# BOUNCER_KEY_traefik -- the same key the whole Traefik enforcement fleet uses -- so this
# read-only observer could not be revoked or rotated without simultaneously rotating every
# enforcing bouncer. Least privilege aside, that coupling is what makes a compromise of the
# observer expensive to contain.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-decision-exporter-key
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-decision-exporter-key
    creationPolicy: Owner
  data:
    - secretKey: lapi-key
      remoteRef: {key: crowdsec, property: decision-exporter-api-key}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crowdsec-bouncer-register
  namespace: crowdsec
  labels:
    app: haproxy-novelty-bouncer
spec:
  # Every 15m, raised from hourly. This CronJob is the designated healer for a real
  # recurring condition, not just a cold-start safety net: the parent bouncer row this
  # registers stops pulling once honeypot-lb's pod IP changes (its `name@<ip>` children
  # pull instead), so its last_pull freezes and bouncers_autodelete eventually reaps it.
  # Hourly meant a worst-case ~60m window with the novelty bouncer unregistered; 15m
  # bounds it to a quarter of that. The sidecar fails OPEN and keeps serving its last
  # known map, so the honeypot keeps collecting throughout -- it just stops silent-dropping.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: haproxy-novelty-bouncer
            app.kubernetes.io/component: bouncer-registrar
        spec:
          serviceAccountName: crowdsec-novelty-bouncer-registrar
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: register
              image: alpine/k8s:1.34.1
              env:
                - name: BOUNCER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: crowdsec-novelty-bouncer-key
                      key: lapi-key
                - name: EXPORTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: crowdsec-decision-exporter-key
                      key: lapi-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              command:
                - sh
                - -c
                - |
                  set -e
                  # Registers every bouncer that is added IMPERATIVELY (cscli bouncers add)
                  # rather than re-registering itself from env on boot the way the chart's
                  # Traefik bouncer does. Each gets its OWN key so any one can be revoked
                  # without disturbing the others.
                  #
                  # Idempotent: only registers when absent, so a healthy LAPI is never
                  # disturbed. -k pins the key to the 1Password value, which is what lets the
                  # client authenticate without a separate handoff.
                  #
                  # The grep is quoted deliberately. CrowdSec auto-creates child rows named
                  # "<name>@<pod-ip>" whenever the key is presented from a new IP, and an
                  # unquoted match would see one of those, conclude the parent exists and skip
                  # a registration that is genuinely missing.
                  register() {
                    name="$1"; key="$2"
                    if kubectl exec -n crowdsec deploy/crowdsec-lapi -- \
                         cscli bouncers list -o json 2>/dev/null | grep -q "\"${name}\""; then
                      echo "${name} registered — nothing to do"
                    else
                      echo "${name} MISSING — registering from secret"
                      # stdout is discarded because `cscli bouncers add` ECHOES THE KEY back
                      # ("Please keep this key since you will not be able to retrieve it!"),
                      # and this Job's stdout is scraped into Loki -- so a successful
                      # registration was publishing the bouncer credential into the log store.
                      # stderr is deliberately NOT discarded, and set -e still aborts on a
                      # non-zero exit, so a genuine failure is still loud. (Swallowing both is
                      # what hid the bogon-import bug for six days.)
                      kubectl exec -n crowdsec deploy/crowdsec-lapi -- \
                        cscli bouncers add "${name}" -k "${key}" >/dev/null
                      echo "${name} registered — it authenticates on its next poll"
                    fi
                  }
                  register haproxy-novelty-bouncer "$BOUNCER_KEY"
                  register decision-exporter "$EXPORTER_KEY"
