---
# CrowdSec enforcement, detection and pipeline health. Native shared LAPI gauges
# are deduplicated; the bounded read-only decision exporter supplies local IP/expiry
# rows. Loki supplies observation history. Scenario overflows include simulation.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: crowdsec-ops
  namespace: crowdsec
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: security
spec:
  # This dashboard lives in the `crowdsec` namespace alongside the component it
  # visualises, but the Grafana instance runs in `monitoring`. The operator only
  # imports a cross-namespace GrafanaDashboard when this is explicitly true --
  # without it the dashboard silently never appears while everything reconciles green.
  allowCrossNamespaceImport: true
  # Same folder as before (Ops/Security) -- but addressed by UID, not by CR name.
  # `folderRef` is resolved by the operator as "a GrafanaFolder in the SAME namespace"
  # (per the CRD field doc), and the ops-security GrafanaFolder lives in `monitoring`.
  # From this namespace a folderRef would therefore never resolve and the dashboard
  # would silently land in General. `folderUID` is a plain Grafana UID with no namespace
  # scoping; the ops-security folder declares `uid: ops-security`, so this targets the
  # identical folder. Matches the existing cross-namespace dashboards (boomtime,
  # stash-tagger), which all use folderUID + allowCrossNamespaceImport.
  folderUID: ops-security
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-crowdsec-ops
    key: crowdsec-ops.json
