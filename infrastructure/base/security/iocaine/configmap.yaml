---
# iocaine request-handler configuration.
#
# NOTE ON FORMAT: the task asked for `config.toml`, but iocaine 3.x's *native*
# configuration language is KDL, and the 3.x series removed the old TOML
# `[generator.markov]` / `[generator.links]` sections entirely ("the templates
# are directly responsible for generating these" — CHANGELOG). Every real 3.x
# deployment (including the shipped container's own /etc/config.d default, and
# published Kubernetes installs) uses `.kdl`. figment technically still parses
# TOML/YAML/JSON, but the handler/`sources` schema below only has a documented,
# verified KDL form. So this ConfigMap ships `config.kdl`. Keeping the literal
# `.toml` would have meant guessing an unverified TOML shape — rejected.
#
# The container ENTRYPOINT is `iocaine --config-path /etc/config.d`; the
# Deployment overrides command/args to `iocaine --config-path
# /etc/iocaine/config.d start` (mirrors the published K8s install at
# MYanello/homelab and the project's own systemd unit) and subPath-mounts this
# file to /etc/iocaine/config.d/config.kdl. Pointing at a fresh directory means
# the image's baked-in 00-default-bind.kdl (which binds :42069) is NOT loaded,
# so :8080 below is the only listener.
apiVersion: v1
kind: ConfigMap
metadata:
  name: iocaine-config
  namespace: iocaine
data:
  config.kdl: |
    // SPDX note: config shape verified against readycool/iocaine (GitHub mirror
    // of git.madhouse-project.org/iocaine/iocaine) iocaine-label/qmk/config.kdl
    // and the published K8s install MYanello/homelab (both iocaine 3.x).

    // The public HTTP listener the Traefik maze proxies caught bots into.
    // 0.0.0.0 so it's reachable from the Traefik pods across the pod network.
    http-server default {
        bind "0.0.0.0:8080"
        use handler-from=default
    }

    // The built-in request handler. `language=roto` with no `path=` selects
    // iocaine's bundled default maze/garbage generator — no custom script
    // needed. Out of the box this already serves an infinite maze of Markov
    // garbage using iocaine's *embedded* public-domain corpus.
    //
    // We override `sources` to point at our own small corpus ConfigMap
    // (mounted read-only at /etc/iocaine/corpus) so THIS install generates
    // unique garbage rather than the same text as every other iocaine.
    // `ai-robots-txt-path` is intentionally omitted — iocaine embeds the
    // ai.robots.txt robots.json and uses it by default.
    declare-handler default language=roto {
        sources {
            training-corpus "/etc/iocaine/corpus/corpus.txt"
            wordlists "/etc/iocaine/corpus/words.txt"
        }
    }
