---
apiVersion: v1
kind: Namespace
metadata:
  name: iocaine
  labels:
    # Kubernetes namespaces are FLAT — there is no nesting. This label IS the
    # grouping: `security/` is a directory, never a namespace, and policy selects
    # these four by `namespaceSelector` on this label rather than by name.
    app.kubernetes.io/part-of: security
    # Pod Security Standards. Unlike the honeypot (which needs `privileged` for
    # hostPort), iocaine is a plain hardened HTTP workload — it binds 8080 as an
    # unprivileged user, drops all caps, and runs read-only-root. `restricted`
    # is satisfied, so we enforce baseline and audit/warn at restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Goldilocks for resource recommendations (same as other namespaces).
    goldilocks.fairwinds.com/enabled: 'true'
    goldilocks.fairwinds.com/vpa-update-mode: 'off'
