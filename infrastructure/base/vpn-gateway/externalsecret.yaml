---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: protonvpn-credentials
  namespace: vpn-gateway
  labels:
    app.kubernetes.io/name: gluetun
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: protonvpn-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: gluetun
  # Extract all fields from 1Password item - add new VPN keys anytime
  # Fields: se-nl-1, se-de-1, se-be-1, se-in-1 (the `se-` prefix IS part of the
  # field name -- an earlier version of this comment omitted it and sent people
  # hunting a key-name mismatch that does not exist). Consumers reference them
  # directly: vpn-gateway/deployment.yaml, securexng.yaml, secure-webtop.yaml,
  # secure-chrome.yaml, and the vpn-rotator, which reads the whole Secret as a
  # mount and treats every `se-*` file as a rotatable server.
  dataFrom:
    - extract:
        key: protonvpn-wireguard
