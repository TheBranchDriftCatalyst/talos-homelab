# Ad-hoc CANARY for the VPN DR test — NOT deployed by Flux (applied/deleted by the test only).
#
# Mirrors the gluetun sidecar pattern (gluetun tunnel + a busybox "app" sharing the pod netns)
# so the destructive chaos (force-rotate, kill the tunnel) hits THIS throwaway pod instead of
# the real securexng / qbittorrent / gateway — zero blast radius on real VPN traffic.
#
# rotation=disabled so the fleet cronjob ignores it; the test rotates it directly via its own
# gluetun control API (:8000), exactly how the real rotator does.
apiVersion: v1
kind: Pod
metadata:
  name: vpn-canary
  namespace: vpn-gateway
  labels:
    app: vpn-canary
    vpn-gateway.io/rotation: disabled
    app.kubernetes.io/component: dr-canary
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  initContainers:
    # MIRRORS the real pods (deployment.yaml / securexng.yaml) EXACTLY — full IPv4+IPv6
    # table-51820 flush + rule-del loop — so the DR test validates the ACTUAL production
    # cleanup, not a weaker stand-in. This is the TALOS-4qwy stale-route guard (init side).
    - name: cleanup-routes
      image: busybox:1.36
      securityContext: {capabilities: {add: ["NET_ADMIN"]}}
      command:
        - /bin/sh
        - -c
        - |
          echo "Flushing stale wireguard routing table 51820..."
          ip route flush table 51820 2>/dev/null || true
          ip -6 route flush table 51820 2>/dev/null || true
          while ip rule del table 51820 2>/dev/null; do :; done
          while ip -6 rule del table 51820 2>/dev/null; do :; done
          echo "Cleanup complete"
  containers:
    - name: gluetun
      image: qmcgaw/gluetun:v3.41.3
      securityContext: {capabilities: {add: ["NET_ADMIN"]}}
      # preStop mirrors the real pods: flush stale rules on GRACEFUL exit (the other half of
      # the TALOS-4qwy guard). Note: does NOT fire on an ungraceful crash-restart — the
      # stale-rule-injection test below covers that uncovered path.
      lifecycle:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                ip route flush table 51820 2>/dev/null || true
                ip -6 route flush table 51820 2>/dev/null || true
                while ip rule del table 51820 2>/dev/null; do :; done
                while ip -6 rule del table 51820 2>/dev/null; do :; done
      env:
        - {name: VPN_SERVICE_PROVIDER, value: protonvpn}
        - {name: VPN_TYPE, value: wireguard}
        # Belgium (se-be-1): a key NOT used by the real pods (gateway/qbittorrent=se-nl-1,
        # securexng/secure-chrome=se-de-1) so ProtonVPN won't reject a duplicate connection.
        # The rotation test moves it to India (se-in-1), also unused by real pods.
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom: {secretKeyRef: {name: protonvpn-credentials, key: se-be-1}}
        - {name: WIREGUARD_ADDRESSES, value: "10.2.0.2/32"}
        - {name: SERVER_COUNTRIES, value: "Belgium"}
        - {name: HTTPPROXY, value: "off"}
        - {name: SHADOWSOCKS, value: "off"}
        - {name: FIREWALL_OUTBOUND_SUBNETS, value: "10.244.0.0/16,10.96.0.0/12"}
        - {name: FIREWALL_INPUT_PORTS, value: "8000"}
        - {name: HTTP_CONTROL_SERVER_ADDRESS, value: "0.0.0.0:8000"}
        - {name: HTTP_CONTROL_SERVER_AUTH, value: "false"}
        - {name: HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE, value: '{"auth":"none"}'}
        - {name: LOG_LEVEL, value: "info"}
        - {name: DOT, value: "off"}
        - {name: HEALTH_VPN_DURATION_INITIAL, value: "30s"}
        - {name: HEALTH_TARGET_ADDRESS, value: "1.1.1.1:443"}
      resources:
        requests: {cpu: 20m, memory: 48Mi}
        limits: {memory: 128Mi}
    # the "app": shares gluetun's netns, so its egress goes through the tunnel. Used to probe
    # the exit IP (busybox wget) and to prove rotation doesn't restart it.
    - name: probe
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 100000"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 32Mi}
