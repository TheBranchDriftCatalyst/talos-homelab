---
# SearXNG signing secret from 1Password item `searxng` (TALOS-3zz1, epic TALOS-031k).
# De-hardcodes the inline stringData that was committed on the PUBLIC repo. Rotated
# to a fresh value. The target Secret NAME (`securexng-secret`) and key (`secret`)
# match the original inline Secret so securexng.yaml's SEARXNG_SECRET secretKeyRef
# (optional: true) keeps resolving without any consumer change.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: securexng-secret
  namespace: vpn-gateway
  labels:
    app.kubernetes.io/name: securexng
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: securexng-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: securexng
  data:
    - secretKey: secret
      remoteRef: {key: searxng, property: secret}
