apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vpn-gateway

resources:
  - namespace.yaml
  - externalsecret.yaml
  - gluetun-exporter.yaml
  - deployment.yaml
  - service.yaml
  # ingressroute-tcp.yaml REMOVED (TALOS-a8vo P0-1): the gluetun SOCKS/HTTP-proxy
  # IngressRouteTCPs (HostSNI(*) on the socks/httpproxy entrypoints) were an open,
  # unauthenticated LAN->cluster pivot. gluetun stays reachable in-cluster via the
  # ClusterIP Service (service.yaml). See the traefik helmrelease + deployment.yaml.
  - securexng.yaml
  - securexng-externalsecret.yaml
  - secure-chrome.yaml
  - mtls-ca.yaml
  - rotation/  # VPN rotation CronJob

labels:
  - pairs:
      app.kubernetes.io/part-of: vpn-gateway
    includeSelectors: false
