---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpn-rotator-config
  namespace: vpn-gateway
  labels:
    app.kubernetes.io/name: vpn-rotator
    app.kubernetes.io/component: config
data:
  # Rotation mode: "parallel" (all at once) or "staggered" (one by one)
  rotation_mode: "parallel"

  # Delay between pods when using staggered mode (seconds)
  stagger_delay: "30"

  # Maximum jitter before starting rotation (seconds).
  # 60s, not 600s: jitter de-syncs a herd, and this rotator drives TWO pods. The old
  # 600s added up to 10 min of dead sleep per run (35m schedule -> 35-45m effective)
  # and was the single largest term in the Job's worst-case runtime.
  jitter_max: "60"

  # Blue-green rotation timeout (seconds) - how long to wait for new pod
  blue_green_wait_timeout: "120"

  # Set to "true" to test without making changes
  dry_run: "false"
