---
apiVersion: v1
kind: Namespace
metadata:
  name: unifi-port-forward
  labels:
    # The controller runs hostNetwork:true so it can reach the UniFi controller
    # API on the gateway LAN IP directly. hostNetwork requires privileged PSS.
    # This is the only namespace that needs it; keep the workload minimal here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
