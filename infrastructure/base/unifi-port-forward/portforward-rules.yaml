---
# Managed UDM port-forwards. On sync the operator ADOPTS a matching live forward by WAN-port
# (takes ownership, applies these values); it never touches forwards it doesn't manage.
#
# NO HARDCODED IPs for the NodePort-backed forwards: serviceRef resolves the destination
# (node IP + nodePort) from the Kubernetes Service. Verified against the live gaming/* NodePort
# Services 2026-09-12. hostPort-based forwards keep an explicit destinationIP (no NodePort
# Service to reference).
#
# RDP IS DELIBERATELY ABSENT — its WAN forward is removed (LAN + WireGuard only).
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: conan-game, namespace: unifi-port-forward}
spec: {externalPort: 7777, protocol: udp, serviceRef: {name: conan-exiles-game, namespace: gaming, port: game-client}, enabled: true, description: "Conan game (serviceRef, no hardcoded IP)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: conan-raw, namespace: unifi-port-forward}
spec: {externalPort: 7778, protocol: udp, serviceRef: {name: conan-exiles-game, namespace: gaming, port: raw-udp}, enabled: true, description: "Conan raw (serviceRef)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: conan-query, namespace: unifi-port-forward}
spec: {externalPort: 27015, protocol: udp, serviceRef: {name: conan-exiles-game, namespace: gaming, port: steam-query}, enabled: true, description: "Conan steam-query (serviceRef)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: conan-rcon, namespace: unifi-port-forward}
spec:
  externalPort: 25575
  protocol: tcp
  serviceRef: {name: conan-exiles-tcp, namespace: gaming, port: rcon}
  enabled: true
  # WARNING: RCON to Source:Any is an RCE surface if the password is weak. Consider VPN-only.
  description: "Conan RCON (serviceRef) — REVIEW: WAN-exposed RCE surface"
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: opensim-tcp, namespace: unifi-port-forward}
spec: {externalPort: 9000, protocol: tcp, serviceRef: {name: opensim-external, namespace: gaming, port: region-tcp}, enabled: true, description: "OpenSim region TCP (serviceRef)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: opensim-udp, namespace: unifi-port-forward}
spec: {externalPort: 9000, protocol: udp, serviceRef: {name: opensim-external, namespace: gaming, port: region-udp}, enabled: true, description: "OpenSim region UDP (serviceRef)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: cowrie-honeypot, namespace: unifi-port-forward}
spec: {externalPort: 22, destinationIP: "192.168.1.144", destinationPort: 2222, protocol: both, enabled: true, description: "Cowrie SSH honeypot (intentional WAN exposure)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: cluster-web, namespace: unifi-port-forward}
spec: {externalPort: "80,443,8443", destinationIP: "192.168.1.54", destinationPort: "80,443,8443", protocol: both, enabled: true, description: "Traefik web/websecure/websecurelan (CrowdSec-protected)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: cluster-plex, namespace: unifi-port-forward}
spec: {externalPort: 32400, destinationIP: "192.168.1.54", destinationPort: 32400, protocol: both, enabled: true, description: "Plex (direct hostPort, not behind Traefik)"}
---
apiVersion: unifi-port-forward.fiskhe.st/v1alpha1
kind: PortForwardRule
metadata: {name: cluster-amber-cam, namespace: unifi-port-forward}
spec: {externalPort: 4242, destinationIP: "192.168.1.54", destinationPort: 4242, protocol: both, enabled: true, description: "amber-cam-ingest camera feed"}
# DELIBERATELY OMITTED: conan-rdp (WAN 3389 removed -> LAN+WireGuard only); catalyst-cluster
# 6789+8883 (stale, nothing listens); PS5 (device off).
