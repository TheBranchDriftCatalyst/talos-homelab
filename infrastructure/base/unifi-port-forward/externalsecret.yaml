---
# UniFi controller credential for the port-forward operator (TALOS-8wum).
# USER PRE-REQ: 1Password item `unifi` with field `api-key`.
#   Generate it in the UniFi UI: Settings > Admins > (your admin) > Create API Key.
#   The admin must have WRITE access to the network. UniFi Network application 9.0.108+ required for
#   API keys; on older firmware, add `username`/`password` fields instead and wire
#   them in the deployment (both env vars are already declared optional there).
# The operator only READS/writes port-forward rules — scope the admin as tightly as
# the UI allows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-port-forward
  namespace: unifi-port-forward
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: unifi-port-forward
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef: {key: unifi, property: api-key}
