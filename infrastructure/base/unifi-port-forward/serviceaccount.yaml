---
# The controller's ServiceAccount. rbac.yaml binds portforwardrule-controller /
# portforwardrule-manager to THIS SA; the deployment references it by name. It was
# missing from the first cut, so the ReplicaSet could not create a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifi-port-forward
  namespace: unifi-port-forward
automountServiceAccountToken: true   # the controller uses the k8s API (watches CRs + Services)
