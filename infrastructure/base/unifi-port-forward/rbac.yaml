---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portforwardrule-controller
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  # Needed to resolve a node address for NodePort services. Without it, NodePort
  # services must carry the unifi-port-forward.fiskhe.st/dst-ip annotation.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules/status
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portforwardrule-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portforwardrule-controller
subjects:
  - kind: ServiceAccount
    name: unifi-port-forward
    namespace: unifi-port-forward
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portforwardrule-manager
  namespace: unifi-port-forward
rules:
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - unifi-port-forward.fiskhe.st
    resources:
      - portforwardrules/finalizers
    verbs:
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portforwardrule-manager
  namespace: unifi-port-forward
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portforwardrule-manager
subjects:
  - kind: ServiceAccount
    name: unifi-port-forward
    namespace: unifi-port-forward
