---
# Authentik Blueprint for Immich NATIVE OIDC SSO (TALOS-xgrl.14).
#
# Immich uses NATIVE OpenID Connect (NOT forward-auth): the Immich server does
# its own OIDC discovery + token exchange, so the mobile app + CLI/API keep
# working (forward-auth would break both — it only understands a browser cookie).
# Hence this is a confidential authentik_providers_oauth2.oauth2provider (like
# grafana/forgejo/litellm), NOT a proxyprovider, and it does NOT join the
# embedded outpost (the outpost is only for forward_single proxy providers).
#
# ISSUER HOST = auth.knowledgedump.space (the PUBLIC HTTPS authentik route),
# deliberately NOT auth.talos00 or auth.priv.talos00:
#   * The Immich MOBILE app uses AppAuth, which rejects a plain-HTTP issuer
#     (rules out http://auth.talos00) and distrusts the homelab-ca self-signed
#     cert unless it's installed on every phone (rules out
#     https://auth.priv.talos00).
#   * https://auth.knowledgedump.space is served by Traefik with a VALID public
#     cert, so both the Immich server pod (server-side discovery/token) and the
#     mobile AppAuth client trust it with zero CA plumbing.
#   * The Immich server pod resolves auth.knowledgedump.space IN-CLUSTER via the
#     CoreDNS rewrite -> traefik.traefik.svc (coredns-configmap.yaml, TALOS-6vf),
#     the browser/phone via Pi-hole (on-LAN) or Cloudflare (off-LAN) -> same
#     Traefik. issuer_mode: per_provider keeps the discovery issuer and id_token
#     `iss` consistent across all three. Native OIDC needs NO shared cookie domain
#     between IdP and app, so the IdP host differing from immich.priv.talos00 is
#     fine (unlike the forward-auth apps).
#
# The app itself stays LAN-only at https://immich.priv.talos00 (base/immich/
# ingressroute.yaml in the talos-private repo). Access is gated by the
# Application PolicyBindings below (talos-private OR cluster-admin) — a user who
# isn't in either group is denied at the authorize step, so autoRegister never
# creates an Immich account for them.
#
# client_secret from !Env IMMICH_OIDC_CLIENT_SECRET (authentik-immich-oidc
# Secret, 1Password immich.oidc-client-secret). The worker env is optional:true
# so a missing secret can never CrashLoop the worker and take down existing SSO.
# The SAME 1Password field is pasted into (or ESO-templated for) the Immich
# admin OAuth settings, so both ends of the handshake stay in lockstep.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-immich-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  immich-oidc.yaml: |
    version: 1
    metadata:
      name: Immich OIDC SSO
      labels:
        blueprints.goauthentik.io/description: "Immich native OIDC SSO: OAuth2 provider + application (talos-private group)"
    entries:

      # ---------------------------------------------------------------------
      # OAuth2Provider: immich
      #   Confidential client. client_secret pulled from the env var
      #   IMMICH_OIDC_CLIENT_SECRET (injected into the worker pod from the
      #   authentik-immich-oidc Secret, sourced from 1Password via ESO).
      #   Redirect URIs (Authentik integration doc): web /auth/login +
      #   /user-settings, plus the mobile custom scheme app.immich:///oauth-callback.
      #   All strict (chart is 2025.x — no per-URI `type`, same as grafana/forgejo).
      # ---------------------------------------------------------------------
      - model: authentik_providers_oauth2.oauth2provider
        id: immich-oauth2-provider
        identifiers:
          name: immich
        attrs:
          name: immich
          client_type: confidential
          client_id: immich
          # Default "" so the provider applies cleanly BEFORE the 1Password secret is
          # provisioned (env unset → !Env would be null → serializer rejects). Created with
          # an empty secret (harmless — nothing points at it yet); operator provisions the
          # 1Password immich.oidc-client-secret then restarts the worker to load the real value.
          client_secret: !Env [IMMICH_OIDC_CLIENT_SECRET, ""]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          redirect_uris:
            - matching_mode: strict
              url: https://immich.priv.talos00/auth/login
            - matching_mode: strict
              url: https://immich.priv.talos00/user-settings
            # Mobile app (iOS/Android) custom scheme — required for the Immich
            # mobile app OAuth flow. Registered verbatim as a strict match.
            - matching_mode: strict
              url: app.immich:///oauth-callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

      # ---------------------------------------------------------------------
      # Application: immich  (launcher tile + access gate)
      #   group: talos-private (media apps). Access = talos-private OR
      #   cluster-admin (two PolicyBindings, policy_engine_mode: any), matching
      #   the other media apps (stash/whisparr/...).
      # ---------------------------------------------------------------------
      - model: authentik_core.application
        id: immich-application
        identifiers:
          slug: immich
        attrs:
          name: Immich
          slug: immich
          provider: !KeyOf immich-oauth2-provider
          meta_launch_url: https://immich.priv.talos00
          meta_description: "Immich - self-hosted photo & video backup"
          meta_publisher: "Catalyst Homelab"
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/immich.png
          open_in_new_tab: false
          policy_engine_mode: any
          group: talos-private
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, immich]], group: !Find [authentik_core.group, [name, talos-private]], order: 0}
        attrs: {enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, immich]], group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}
        attrs: {enabled: true}
