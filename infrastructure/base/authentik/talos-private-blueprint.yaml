---
# Authentik Blueprint: talos SSO — per-app applications + group model (TALOS-h4j / TALOS-xgrl.13).
#
# Private media legacy hosts retired 2026-10-24; infrastructure/gaming apps (headlamp,
# guacamole, windows-vnc) moved from priv.talos00 to plain talos00 (standard internal domain).
#
# ACCESS GROUPS (who's allowed; cluster-admin is a SUPERSET):
#   cluster-admin (everything) · talos-admin (kubeview/headlamp/grafana/minio/zot)
#   · talos-gaming (guacamole/windows-vnc) · talos-private (media apps, .14)
#   · talos-apps (forgejo/litellm/linkwarden/boomtime).
#
# talos-homelab (monolith) owns these SHARED groups; other repos reference them by
# !Find. Each app here is its OWN Application (forward_single) → its own launcher tile,
# grouped by the `group:` label (= its section). Access = the app's group OR
# cluster-admin (two PolicyBindings, policy_engine_mode: any). forward_single apps route
# /outpost.goauthentik.io/* to authentik-server (see authentik/ingressroute.yaml).
#
# Mounted at /blueprints/custom/talos-private.yaml (restart server+worker to reload).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-talos-private-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  talos-private.yaml: |
    version: 1
    metadata:
      name: talos SSO per-app applications
      labels:
        blueprints.goauthentik.io/description: "Shared access groups + per-app forward_single applications grouped by section"
    entries:
      # ---------- Shared access groups ----------
      - {model: authentik_core.group, id: g-cluster-admin, identifiers: {name: cluster-admin}, attrs: {attributes: {description: "Super-group: reaches EVERY app."}}}
      - {model: authentik_core.group, id: g-talos-admin, identifiers: {name: talos-admin}, attrs: {attributes: {description: "Cluster admin / infra UIs."}}}
      - {model: authentik_core.group, id: g-talos-gaming, identifiers: {name: talos-gaming}, attrs: {attributes: {description: "Gaming / remote-desktop."}}}
      - {model: authentik_core.group, id: g-talos-private, identifiers: {name: talos-private}, attrs: {attributes: {description: "Private media/arr apps."}}}
      - {model: authentik_core.group, id: g-talos-apps, identifiers: {name: talos-apps}, attrs: {attributes: {description: "General self-hosted apps."}}}
      # talos-media declared in arr-stack-blueprint.yaml; talos-home in home-blueprint.yaml —
      # each new group is owned by a self-contained blueprint so this file (which !Finds their
      # providers in the outpost union) never dead-locks on them. Referenced here via !Find. TALOS-xgrl.18

      # ========== KubeView — talos-admin ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-kubeview
        identifiers: {name: kubeview}
        attrs:
          name: kubeview
          mode: forward_single
          external_host: https://kubeview.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-kubeview, identifiers: {slug: kubeview}, attrs: {name: KubeView, slug: kubeview, group: talos-admin, provider: !KeyOf p-kubeview, meta_launch_url: https://kubeview.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-kubeview-own, identifiers: {target: !KeyOf a-kubeview, group: !KeyOf g-talos-admin, order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-kubeview-ca, identifiers: {target: !KeyOf a-kubeview, group: !KeyOf g-cluster-admin, order: 1}, attrs: {enabled: true}}

      # ========== Headlamp — talos-admin ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-headlamp
        identifiers: {name: headlamp}
        attrs:
          name: headlamp
          mode: forward_single
          external_host: https://headlamp.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-headlamp, identifiers: {slug: headlamp}, attrs: {name: Headlamp, slug: headlamp, group: talos-admin, provider: !KeyOf p-headlamp, meta_launch_url: https://headlamp.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes-dashboard.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-headlamp-own, identifiers: {target: !KeyOf a-headlamp, group: !KeyOf g-talos-admin, order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-headlamp-ca, identifiers: {target: !KeyOf a-headlamp, group: !KeyOf g-cluster-admin, order: 1}, attrs: {enabled: true}}

      # ========== Guacamole — talos-gaming ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-guacamole
        identifiers: {name: guacamole}
        attrs:
          name: guacamole
          mode: forward_single
          external_host: https://guacamole.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-guacamole, identifiers: {slug: guacamole}, attrs: {name: Guacamole, slug: guacamole, group: talos-gaming, provider: !KeyOf p-guacamole, meta_launch_url: https://guacamole.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/apache-guacamole.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-guacamole-own, identifiers: {target: !KeyOf a-guacamole, group: !KeyOf g-talos-gaming, order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-guacamole-ca, identifiers: {target: !KeyOf a-guacamole, group: !KeyOf g-cluster-admin, order: 1}, attrs: {enabled: true}}

      # ========== Windows VNC — talos-gaming ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-windows-vnc
        identifiers: {name: windows-vnc}
        attrs:
          name: windows-vnc
          mode: forward_single
          external_host: https://windows-vnc.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-windows-vnc, identifiers: {slug: windows-vnc}, attrs: {name: Windows VNC, slug: windows-vnc, group: talos-gaming, provider: !KeyOf p-windows-vnc, meta_launch_url: https://windows-vnc.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/microsoft-windows.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-windows-vnc-own, identifiers: {target: !KeyOf a-windows-vnc, group: !KeyOf g-talos-gaming, order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-windows-vnc-ca, identifiers: {target: !KeyOf a-windows-vnc, group: !KeyOf g-cluster-admin, order: 1}, attrs: {enabled: true}}

      # Zipline's provider/application used to live here, from when zipline ran
      # in talos-private. It moved to this repo (zipline-blueprint.yaml) and the
      # entries left behind became actively harmful: they declared a SECOND
      # provider (zipline-oidc) with the SAME client_id as the live one, so
      # every apply failed with
      #   Entry invalid: {'client_id': ['OAuth2/OpenID Provider with this
      #   Client ID already exists.']}
      # and because ONE bad entry fails the WHOLE blueprint, the embedded
      # outpost union below silently stopped accepting new providers — any app
      # added to it since never joined the outpost and answered 404 behind
      # forward-auth. They also pointed at zipline.amberdark.net, which is dead.
      # zipline-blueprint.yaml owns zipline now.

      # ---------- Retire the old single forward_domain app + expression policy + kelsboi ----------
      - {model: authentik_core.application, identifiers: {slug: talos-private}, state: absent}
      - {model: authentik_providers_proxy.proxyprovider, identifiers: {name: talos-private}, state: absent}
      - {model: authentik_policies_expression.expressionpolicy, identifiers: {name: talos-per-host-group-gate}, state: absent}
      - {model: authentik_core.application, identifiers: {slug: kelsboi}, state: absent}
      - {model: authentik_providers_proxy.proxyprovider, identifiers: {name: kelsboi}, state: absent}

      # ---------- Embedded outpost: all per-app providers ----------
      - model: authentik_outposts.outpost
        id: embedded-outpost
        identifiers: {managed: goauthentik.io/outposts/embedded}
        attrs:
          # Stop Authentik auto-creating a Kubernetes Ingress (TALOS-qzbh.2.3).
          #
          # It generated `ak-outpost-authentik-embedded-outpost` across 59 hosts
          # with secretName: authentik-outpost-tls -- Authentik's DEFAULT name,
          # for a Secret that has never existed here. Traefik logged
          # "Error configuring TLS" ~1,570 times an HOUR, the single largest
          # error source left in the cluster after the severity fix.
          #
          # It is REDUNDANT, and strictly weaker than the route we already
          # declare in ingressroute.yaml (`authentik-outpost-priv`):
          #   - its host list is DERIVED from committed providers (59 hosts for
          #     59 providers), so a new forward-auth app is uncovered until its
          #     provider lands AND the union below picks it up -- which is
          #     exactly the TALOS-87bw outage, where a raced !Find silently
          #     dropped providers and new apps answered 404 behind forward-auth.
          #     Our HostRegexp covers present AND future hosts.
          #   - it has ZERO .priv.knowledgedump.space hosts; our regex matches
          #     that domain.
          #   - an Ingress cannot express `priority: 1000`, which is what makes
          #     our route beat each app's own Host() rule for this path.
          # And its TLS has never worked for a single request, so nothing can
          # have depended on it: HTTPS /outpost.goauthentik.io/ping returns 204
          # today via the IngressRoute, verified before this change.
          #
          # ONLY `ingress` is disabled. `service` must keep being created --
          # the outpost needs it.
          # `config` is ONE JSON field on the Outpost, not a set of attrs, so it
          # must be given WHOLE -- setting it with only the key we care about
          # would wipe `authentik_host`, which the outpost needs to reach
          # authentik, and break forward-auth for all 59 apps. These 22 keys were
          # GENERATED from the live config (not hand-typed) and differ from it in
          # exactly one key: kubernetes_disabled_components.
          #
          # Safe to pin: every field on the OutpostConfig dataclass has a default,
          # so a key added by a future Authentik version simply takes its default
          # rather than breaking. The one value that is environment-specific and
          # therefore needs updating by hand if it ever changes is authentik_host.
          config:
            authentik_host: https://auth.knowledgedump.space
            authentik_host_browser: ''
            authentik_host_insecure: false
            container_image: null
            docker_labels: null
            docker_map_ports: true
            docker_network: null
            kubernetes_disabled_components:
            - ingress
            kubernetes_httproute_annotations: {}
            kubernetes_httproute_parent_refs: []
            kubernetes_image_pull_secrets: []
            kubernetes_ingress_annotations: {}
            kubernetes_ingress_class_name: null
            kubernetes_ingress_path_type: null
            kubernetes_ingress_secret_name: authentik-outpost-tls
            kubernetes_json_patches: null
            kubernetes_namespace: authentik
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            log_level: info
            object_naming_template: ak-outpost-%(name)s
            refresh_interval: minutes=5
          providers:
            - !KeyOf p-kubeview
            - !KeyOf p-headlamp
            - !KeyOf p-guacamole
            - !KeyOf p-windows-vnc
            # media apps (talos-private repo, via authentik-media-blueprint). !Find since their
            # providers live in a different blueprint. This union is AUTHORITATIVE here — the
            # outpost providers list is REPLACE-not-merge, so it must live in one place. TALOS-xgrl.14
            # arr-stack apps (this repo, via authentik-arr-stack-blueprint). Same REPLACE-not-merge
            # reason — the outpost union is authoritative here. TALOS-xgrl.14
            - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr]]
            # IRC (gamja web client) — this repo, via authentik-irc-blueprint.
            # The outpost union is REPLACE-not-merge and authoritative HERE, so a
            # provider defined in another blueprint is invisible to the outpost
            # until it is listed on this line — and an unknown external_host makes
            # the outpost answer 404 instead of redirecting to login.
            - !Find [authentik_providers_proxy.proxyprovider, [name, irc]]
            # fchat-bouncer — this repo, via authentik-fchat-bouncer-blueprint.
            # Same REPLACE-not-merge reason as irc above: listed HERE or the
            # outpost 404s fchat.talos00 instead of redirecting to login.
            - !Find [authentik_providers_proxy.proxyprovider, [name, fchat-bouncer]]
            # logairr — this repo, via authentik-logairr-blueprint. Same
            # REPLACE-not-merge reason as irc above: listed HERE or the outpost
            # 404s logairr.talos00 instead of redirecting to login.
            - !Find [authentik_providers_proxy.proxyprovider, [name, logairr]]
            # haven / opengym — this repo, via authentik-haven-blueprint and
            # authentik-opengym-blueprint. Same REPLACE-not-merge reason as irc
            # above: listed HERE or the outpost 404s haven.talos00 and
            # opengym.talos00 instead of redirecting to login.
            - !Find [authentik_providers_proxy.proxyprovider, [name, haven]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, opengym]]
            # hyperdx — this repo, via authentik-hyperdx-blueprint. Same
            # REPLACE-not-merge reason as the others: listed HERE or the
            # outpost 404s hyperdx.talos00 instead of redirecting to login.
            - !Find [authentik_providers_proxy.proxyprovider, [name, hyperdx]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, radarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, prowlarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, readarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, qbittorrent]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, sabnzbd]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, seerr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, tautulli]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, maintainerr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, pulsarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, posterr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, posterizarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, stackarr]]
            # Wave 1 — infra-admin + home (TALOS-xgrl.14/.18)
            - !Find [authentik_providers_proxy.proxyprovider, [name, crowdsec]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, falco]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, traefik]] # TALOS-lxz5.1.5
            - !Find [authentik_providers_proxy.proxyprovider, [name, kube-ops-view]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, hubble]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, dbgate]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, plausible]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, omnitools]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, frigate]]
            # Wave 1 — media-experimental (TALOS-xgrl.14/.18)
            - !Find [authentik_providers_proxy.proxyprovider, [name, booksonic]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, storyteller]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, libation]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, mylar3]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, bindery]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, chaptarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, librarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, livrarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, tdarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, metube]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, tubesync]]
            # Wave 2 — sister-repo FA (catalyst-llm/data/ui/dungeon-library) TALOS-xgrl.18
            - !Find [authentik_providers_proxy.proxyprovider, [name, lobe-chat]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, searxng]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, catalyst-ui]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, dungeon-library]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, dagster]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, neo4j-browser]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, media-explorer]]
            # Homepage dashboards (TALOS-xgrl.18)
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-master]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-apps]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-arrs]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-data]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-home]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-infra]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-llm]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-obs]]
            # SSO-gap apps (TALOS-xgrl.18)
            - !Find [authentik_providers_proxy.proxyprovider, [name, scrypted]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, securexng]]
