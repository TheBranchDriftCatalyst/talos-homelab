---
# Authentik Blueprint: talos SSO group model + forward-auth (TALOS-h4j / TALOS-xgrl.13).
#
# Domain: priv.talos00 (LAN-only, homelab-ca cert, real cookie domain).
#
# GROUP MODEL (cluster-admin is a SUPERSET — its members reach every app):
#   - cluster-admin  : super-group; reaches EVERY app.
#   - talos-admin    : infra/admin UIs (kubeview, headlamp).
#   - talos-gaming   : gaming / remote-desktop (guacamole, windows-vnc).
#   - talos-private  : private media/arr apps (immich, stash, whisparr, ...).
#
# ENFORCEMENT: ONE forward_domain provider covers *.priv.talos00 (shared SSO cookie, single
# login, no per-app routing). A single EXPRESSION POLICY on the application maps the requested
# HOST → the required group (OR cluster-admin). This keeps the app URLs + Traefik config
# untouched while giving per-app group gating. Add a new app by editing HOST_GROUP below.
#
# Mounted at /blueprints/custom/talos-private.yaml; the worker auto-reconciles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-talos-private-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  talos-private.yaml: |
    version: 1
    metadata:
      name: talos SSO group model + forward-auth
      labels:
        blueprints.goauthentik.io/description: "cluster-admin/talos-admin/talos-gaming/talos-private groups + per-host group gating on *.priv.talos00"
    entries:
      # ---------- Groups ----------
      - model: authentik_core.group
        id: cluster-admin-group
        identifiers: {name: cluster-admin}
        attrs:
          attributes: {description: "Super-group: reaches EVERY talos-private service (superset of all groups)."}
      - model: authentik_core.group
        id: talos-admin-group
        identifiers: {name: talos-admin}
        attrs:
          attributes: {description: "Cluster admin UIs (kubeview, headlamp)."}
      - model: authentik_core.group
        id: talos-gaming-group
        identifiers: {name: talos-gaming}
        attrs:
          attributes: {description: "Gaming / remote-desktop (guacamole, windows-vnc, kubevirt VM UI)."}
      - model: authentik_core.group
        id: talos-private-group
        identifiers: {name: talos-private}
        attrs:
          attributes: {description: "Private media/arr apps (immich, stash, whisparr, zipline, hot-ones)."}

      # ---------- forward_domain provider for *.priv.talos00 ----------
      - model: authentik_providers_proxy.proxyprovider
        id: talos-private-provider
        identifiers: {name: talos-private}
        attrs:
          name: talos-private
          mode: forward_domain
          external_host: https://auth.priv.talos00
          cookie_domain: priv.talos00
          internal_host_ssl_validation: true
          intercept_header_auth: true
          basic_auth_enabled: false
          access_token_validity: hours=24
          refresh_token_validity: days=30
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - model: authentik_core.application
        id: talos-private-application
        identifiers: {slug: talos-private}
        attrs:
          name: talos-private
          slug: talos-private
          provider: !KeyOf talos-private-provider
          meta_launch_url: https://auth.priv.talos00
          policy_engine_mode: all

      # ---------- Per-host → group expression policy ----------
      - model: authentik_policies_expression.expressionpolicy
        id: talos-host-group-policy
        identifiers: {name: talos-per-host-group-gate}
        attrs:
          name: talos-per-host-group-gate
          expression: |
            # cluster-admin reaches everything.
            groups = [g.name for g in request.user.ak_groups.all()]
            if "cluster-admin" in groups:
                return True
            # Requested app host (the proxied service), from the forwarded request.
            host = ""
            try:
                host = (request.context.get("http_request").headers.get("X-Forwarded-Host") or "").lower()
            except Exception:
                host = ""
            # host prefix → required group
            HOST_GROUP = {
                "kubeview": "talos-admin",
                "headlamp": "talos-admin",
                "guacamole": "talos-gaming",
                "windows-vnc": "talos-gaming",
            }
            required = "talos-private"  # default: media/arr apps
            for prefix, grp in HOST_GROUP.items():
                if host.startswith(prefix + "."):
                    required = grp
                    break
            return required in groups
      - model: authentik_policies.policybinding
        id: talos-host-group-binding
        identifiers: {target: !KeyOf talos-private-application, policy: !KeyOf talos-host-group-policy, order: 0}
        attrs: {enabled: true, negate: false, timeout: 30}

      # ---------- Embedded outpost ----------
      - model: authentik_outposts.outpost
        id: embedded-outpost
        identifiers: {managed: goauthentik.io/outposts/embedded}
        attrs:
          providers:
            - !KeyOf talos-private-provider
