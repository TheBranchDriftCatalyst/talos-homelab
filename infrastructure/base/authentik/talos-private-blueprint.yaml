---
# Authentik Blueprint: talos-private forward-auth (clean-slate rebuild, TALOS-h4j).
#
# Domain: priv.knowledgedump.space (LAN-only via pihole; real LE cert + real parent
# domain so the forward_domain SSO cookie works — .talos00 single-label can't).
# The old kelsboi + amber objects are RETIRED (this replaces them entirely; the
# manual kelsboi objects in the Authentik DB are the operator's to delete via the UI).
#
# Full forward-auth chain, all IaC:
#   1. authentik_core.group                 talos-private   (access group; gates all private apps)
#   2. authentik_providers_proxy.proxyprovider talos-private (forward_domain, cookie=priv.knowledgedump.space)
#   3. authentik_core.application           talos-private   (bound to the provider)
#   4. authentik_policies.policybinding      app <- talos-private group (order 0, gates access)
#   5. authentik_outposts.outpost            embedded outpost = [talos-private]  (kelsboi dropped)
#
# Mounted at /blueprints/custom/talos-private.yaml (helmrelease volume); the worker auto-reconciles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-talos-private-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  talos-private.yaml: |
    version: 1
    metadata:
      name: talos-private forward-auth
      labels:
        blueprints.goauthentik.io/description: "talos-private group + forward_domain proxy gating all *.priv.knowledgedump.space services"
    entries:
      # 1. Shared access group. Add members via the UI (Directory > Groups).
      - model: authentik_core.group
        id: talos-private-group
        identifiers:
          name: talos-private
        attrs:
          attributes:
            description: "Members may access all talos-private services (kubeview, headlamp, guacamole, immich, stash, whisparr, zipline, hot-ones, whoami)."

      # 2. Proxy Provider — forward_domain, scoped to priv.knowledgedump.space so the
      #    ONE shared Traefik `authentik` middleware gates every *.priv.knowledgedump.space
      #    host with a single SSO cookie. external_host is the Authentik URL under the
      #    cookie domain (unauthenticated users are redirected there).
      - model: authentik_providers_proxy.proxyprovider
        id: talos-private-provider
        identifiers:
          name: talos-private
        attrs:
          name: talos-private
          mode: forward_domain
          external_host: https://auth.priv.knowledgedump.space
          cookie_domain: priv.knowledgedump.space
          internal_host_ssl_validation: true
          intercept_header_auth: true
          basic_auth_enabled: false
          access_token_validity: hours=24
          refresh_token_validity: days=30
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]

      # 3. Application bound to the proxy provider.
      - model: authentik_core.application
        id: talos-private-application
        identifiers:
          slug: talos-private
        attrs:
          name: talos-private
          slug: talos-private
          provider: !KeyOf talos-private-provider
          meta_launch_url: https://auth.priv.knowledgedump.space
          meta_description: "Private LAN services behind Authentik forward-auth (talos-private group)"
          meta_publisher: "Catalyst Homelab"
          open_in_new_tab: false
          policy_engine_mode: any

      # 4. Gate the application on the talos-private group — only members pass forward-auth.
      - model: authentik_policies.policybinding
        id: talos-private-group-binding
        identifiers:
          target: !KeyOf talos-private-application
          group: !KeyOf talos-private-group
          order: 0
        attrs:
          enabled: true
          negate: false
          timeout: 30

      # 5. Embedded outpost — enforce ONLY the talos-private provider (kelsboi retired).
      - model: authentik_outposts.outpost
        id: embedded-outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf talos-private-provider
