---
# Authentik Blueprint for Linkwarden OIDC SSO.
#
# WHY THIS EXISTS (the fix): Linkwarden (ns home-automation) is already wired for
# Authentik SSO — NEXT_PUBLIC_AUTHENTIK_ENABLED=true, AUTHENTIK_ISSUER=
# https://auth.knowledgedump.space/application/o/linkwarden/, and it sends a
# client_id/secret from the 1Password `linkwarden` item. But Authentik had NO
# provider/application matching that client_id, so every SSO login failed. This
# blueprint registers the missing OAuth2Provider + Application so both ends match.
#
# CHAIN: OAuth2Provider (linkwarden) + Application (slug=linkwarden). Modeled on
# boomtime-blueprint.yaml (same external knowledgedump.space domain, standard
# openid/profile/email scopes, NO custom scope mapping — Linkwarden only needs
# the standard OIDC claims).
#
# CREDENTIALS MUST MATCH what Linkwarden already sends (do NOT mint new ones):
#   client_id     = !Env LINKWARDEN_OIDC_CLIENT_ID     (1Password linkwarden.authentik-client-id)
#   client_secret = !Env LINKWARDEN_OIDC_CLIENT_SECRET (1Password linkwarden.authentik-client-secret)
# Unlike minio/boomtime (whose client_id is a friendly literal), Linkwarden's
# client_id is itself a 40-char secret, so it is ALSO injected via !Env rather
# than hardcoded in git. Both env vars are injected into the authentik-worker pod
# from the authentik-linkwarden-oidc Secret (ExternalSecret of the same name,
# reading the SAME 1Password fields Linkwarden's own linkwarden-secrets ES reads),
# so both ends of the handshake stay in lockstep across rebuilds.
#
# ISSUER: issuer_mode=per_provider => issuer =
#   https://auth.knowledgedump.space/application/o/linkwarden/
# exactly matching Linkwarden's AUTHENTIK_ISSUER.
#
# REDIRECT URI: Linkwarden uses NextAuth's Authentik provider (default provider
# id "authentik"). NextAuth's OIDC callback = ${NEXTAUTH_URL}/callback/<id>.
# NEXTAUTH_URL=https://linkwarden.knowledgedump.space/api/v1/auth, so the callback
# is https://linkwarden.knowledgedump.space/api/v1/auth/callback/authentik.
#
# SECRET SAFETY: the worker env refs are optional:true (same pattern as
# minio/boomtime) so a missing Secret can never CrashLoop the worker.
#
# Mounted into authentik-server AND authentik-worker as
# /blueprints/custom/linkwarden-oidc.yaml. The worker auto-discovers and
# reconciles blueprint files under /blueprints/custom/. See TALOS-zuia.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-linkwarden-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  linkwarden-oidc.yaml: |
    version: 1
    metadata:
      name: Linkwarden OIDC SSO
      labels:
        blueprints.goauthentik.io/description: "Linkwarden OIDC SSO: OAuth2 provider and application"
    entries:

      # ---------------------------------------------------------------------
      # 1. OAuth2Provider: linkwarden
      #    Confidential client. client_id AND client_secret both from !Env
      #    (injected into the worker pod from the authentik-linkwarden-oidc
      #    Secret, sourced from 1Password via ESO). Standard OIDC scopes only.
      # ---------------------------------------------------------------------
      - model: authentik_providers_oauth2.oauth2provider
        id: linkwarden-oauth2-provider
        identifiers:
          name: linkwarden
        attrs:
          name: linkwarden
          client_type: confidential
          client_id: !Env LINKWARDEN_OIDC_CLIENT_ID
          client_secret: !Env LINKWARDEN_OIDC_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          redirect_uris:
            - matching_mode: strict
              url: https://linkwarden.knowledgedump.space/api/v1/auth/callback/authentik
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

      # ---------------------------------------------------------------------
      # 2. Application: linkwarden
      #    slug MUST be `linkwarden` — the issuer path is
      #    /application/o/linkwarden/. Bound to the OAuth2 provider above.
      # ---------------------------------------------------------------------
      - model: authentik_core.application
        id: linkwarden-application
        identifiers:
          slug: linkwarden
        attrs:
          name: Linkwarden
          slug: linkwarden
          provider: !KeyOf linkwarden-oauth2-provider
          meta_launch_url: https://linkwarden.knowledgedump.space
          meta_description: "Linkwarden - self-hosted bookmark manager"
          meta_publisher: "Catalyst Homelab"
          open_in_new_tab: false
          policy_engine_mode: any
          group: talos-apps
      - model: authentik_policies.policybinding
      identifiers: {target: !Find [authentik_core.application, [slug, linkwarden]], group: !Find [authentik_core.group, [name, talos-apps]], order: 0}
      attrs: {enabled: true}
      - model: authentik_policies.policybinding
      identifiers: {target: !Find [authentik_core.application, [slug, linkwarden]], group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}
      attrs: {enabled: true}
