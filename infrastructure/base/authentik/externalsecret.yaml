---
# ExternalSecret for Authentik secrets from 1Password
# Required 1Password item: "authentik" with fields:
#   - secret-key: Random 50+ char string for Django secret key
#   - postgresql-password: Password for PostgreSQL
#   - redis-password: Password for Redis (optional, can be empty)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik
        property: secret-key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: authentik
        property: postgresql-password
---
# ExternalSecret for the LiteLLM OIDC client_secret consumed by the
# litellm-blueprint via the !Env LITELLM_OIDC_CLIENT_SECRET tag.
# Pulled from the SAME 1Password property that catalyst-llm/litellm-secrets
# uses (litellm.oidc-client-secret) so both ends of the OAuth handshake stay
# in lockstep across cluster rebuilds with no manual coordination.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-litellm-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-litellm-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: litellm
        property: oidc-client-secret
---
# ExternalSecret for the Boomtime OIDC client_secret consumed by the
# boomtime-blueprint via the !Env BOOMTIME_OIDC_CLIENT_SECRET tag. Pulled from
# the SAME 1Password property the boomtime app's own ExternalSecret uses
# (boomtime.oidc-client-secret, in the boomtime namespace / talos00-knowledgedump
# overlay) so both ends of the OAuth handshake stay in lockstep across cluster
# rebuilds with no manual coordination.
#
# PROVISION FIRST: create the 1Password item "boomtime" field
# "oidc-client-secret" (any strong random value, e.g. `openssl rand -hex 32`)
# BEFORE the blueprint reconciles — the provider needs it at creation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-boomtime-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-boomtime-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: boomtime
        property: oidc-client-secret
---
