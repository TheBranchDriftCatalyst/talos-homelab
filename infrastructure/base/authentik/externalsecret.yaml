---
# ExternalSecret for the Linkwarden OIDC client CREDENTIALS consumed by the
# linkwarden-blueprint via !Env LINKWARDEN_OIDC_CLIENT_ID / _CLIENT_SECRET.
# Pulled from the SAME 1Password item + fields that Linkwarden's own
# linkwarden-secrets ExternalSecret reads (item: linkwarden, fields:
# authentik-client-id + authentik-client-secret) so both ends of the OAuth
# handshake stay in lockstep across cluster rebuilds with no manual coordination.
#
# NOTE (vs. the other OIDC ExternalSecrets above): Linkwarden's client_id is
# itself a 40-char secret (not a friendly literal), so this ES exposes BOTH
# client-id AND client-secret keys — the worker injects each as its own env var.
# See TALOS-zuia.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-linkwarden-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-linkwarden-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: linkwarden
        property: authentik-client-id
    - secretKey: client-secret
      remoteRef:
        key: linkwarden
        property: authentik-client-secret
