# ExternalSecret for the Linkwarden OIDC client CREDENTIALS consumed by the
# linkwarden-blueprint via !Env LINKWARDEN_OIDC_CLIENT_ID / _CLIENT_SECRET.
# Pulled from the SAME 1Password item + fields that Linkwarden's own
# linkwarden-secrets ExternalSecret reads (item: linkwarden, fields:
# authentik-client-id + authentik-client-secret) so both ends of the OAuth
# handshake stay in lockstep across cluster rebuilds with no manual coordination.
#
# NOTE (vs. the other OIDC ExternalSecrets above): Linkwarden's client_id is
# itself a 40-char secret (not a friendly literal), so this ES exposes BOTH
# client-id AND client-secret keys — the worker injects each as its own env var.
# See TALOS-zuia.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-linkwarden-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-linkwarden-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: linkwarden
        property: authentik-client-id
    - secretKey: client-secret
      remoteRef:
        key: linkwarden
        property: authentik-client-secret
---
# ExternalSecret for the Immich OIDC client_secret consumed by the
# immich-blueprint via !Env IMMICH_OIDC_CLIENT_SECRET (TALOS-xgrl.14). Pulled
# from the SAME 1Password property the Immich admin OAuth settings use
# (immich.oidc-client-secret) so both ends of the OAuth handshake stay in
# lockstep across cluster rebuilds with no manual coordination.
#
# Immich uses NATIVE OIDC (server-side discovery/token exchange), so — unlike
# the forward_single media apps — it genuinely needs this confidential secret.
#
# PROVISION FIRST (operator, one-time): create 1Password item "immich" field
# "oidc-client-secret" (openssl rand -hex 32) before the blueprint reconciles —
# the provider needs it at creation. Then paste the SAME value into Immich's
# admin OAuth "Client Secret" field (Administration -> Settings -> OAuth), or
# wire the optional ESO-templated Immich config file (see the talos-private repo
# base/immich/OIDC.md).
# Self-contained ESO Password generator — NO 1Password dependency, so this ES always
# syncs (SecretSynced) and never blocks the authentik ks health check (the 1Password
# variant sat SecretSyncedError until an operator provisioned the field, wedging the
# ks). Value is stable (refreshInterval: 0 = generate once). TALOS-xgrl.14.
# OPERATOR reads the generated value for Immich's admin OAuth "Client Secret":
#   kubectl -n authentik get secret authentik-immich-oidc -o jsonpath='{.data.client-secret}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: immich-oidc-client-secret
  namespace: authentik
spec:
  length: 48
  digits: 12
  symbols: 0            # OIDC client secret: alphanumeric (avoids any URL/encoding edge cases)
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-immich-oidc
  namespace: authentik
spec:
  refreshInterval: "0"   # generate once — stable value (must match Immich's admin OAuth config)
  target:
    name: authentik-immich-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: immich-oidc-client-secret
---
# =====================================================================
# Native-OIDC media apps (audiobookshelf / komga / kavita) — TALOS-xgrl.18.
#
# Each app: a SELF-CONTAINED ESO Password generator (NO 1Password) → Secret
# authentik-<app>-oidc (key client-secret) in ns authentik for the worker !Env
# <APP>_OIDC_CLIENT_SECRET. Reflector fans the SAME generated value into ns
# media-experimental (secret authentik-<app>-oidc) so the app config uses an
# identical secret with no manual coordination.
#
# WHY REFLECTOR (not a second ExternalSecret in media-experimental): the Password
# generator is namespaced and produces a FRESH value on every evaluation, so a
# second ES + generator in media-experimental would mint a DIFFERENT secret and
# break the handshake. Reflector copies the exact bytes (immutable lockstep) —
# same pattern as minio/cnpg-backup/externalsecret.yaml.
#
# refreshInterval "0" = generate once, stable. deletionPolicy Retain. Komga reads
# the reflected secret via secretKeyRef (declarative). Audiobookshelf + Kavita are
# admin-UI configured: OPERATOR reads the value and pastes it:
#   kubectl -n authentik get secret authentik-<app>-oidc -o jsonpath='{.data.client-secret}' | base64 -d
# =====================================================================
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: audiobookshelf-oidc-client-secret
  namespace: authentik
spec:
  length: 48
  digits: 12
  symbols: 0            # OIDC client secret: alphanumeric (avoids URL/encoding edge cases)
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-audiobookshelf-oidc
  namespace: authentik
spec:
  refreshInterval: "0"   # generate once — stable value (must match Audiobookshelf's admin OAuth config)
  target:
    name: authentik-audiobookshelf-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          # Fan the SAME generated secret into media-experimental for the app end.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "media-experimental"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "media-experimental"
      data:
        client-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: audiobookshelf-oidc-client-secret
