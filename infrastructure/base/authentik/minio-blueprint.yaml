---
# Authentik Blueprint for MinIO Console OIDC SSO.
#
# Chain: Group (minio-admins) + ScopeMapping (minio -> `policy` claim) +
# OAuth2Provider (minio) + Application (minio). Same pattern as the litellm
# blueprint (which also ships a custom ScopeMapping), plus the zot/forgejo
# provider shape.
#
# POLICY CLAIM (the whole point of the custom scope):
#   MinIO maps an OIDC token claim -> a MinIO policy. We set
#   MINIO_IDENTITY_OPENID_CLAIM_NAME=policy on the tenant, so MinIO reads the
#   `policy` claim. This ScopeMapping emits {"policy": "consoleAdmin"} for
#   superusers and members of the admin groups (Catalyst Admins / authentik
#   Admins / minio-admins), and {"policy": "readonly"} for everyone else.
#   `consoleAdmin`/`readonly` are MinIO built-in policies.
#
#   IMPORTANT: Authentik only runs a ScopeMapping when its scope is REQUESTED by
#   the client. So the tenant MUST request this scope:
#     MINIO_IDENTITY_OPENID_SCOPES=openid,profile,email,minio
#   (the custom scope_name below is `minio`). Without `minio` in that list the
#   `policy` claim is never emitted and MinIO denies all SSO logins.
#
# OIDC DISCOVERY / issuer:
#   issuer_mode: per_provider => issuer = http://auth.talos00/application/o/minio/
#   MinIO's MINIO_IDENTITY_OPENID_CONFIG_URL points at
#   http://auth.talos00/application/o/minio/.well-known/openid-configuration.
#   MinIO Console is internal-only (http://minio.talos00), so — exactly like the
#   grafana-blueprint — every OAuth URL uses the http://auth.talos00 host so the
#   browser redirect and the pod-side token exchange hit the SAME host and the
#   id_token `iss` stays consistent. The MinIO server pod reaches auth.talos00
#   in-cluster via the CoreDNS rewrite -> Traefik hairpin (same as forgejo/zot).
#
# REDIRECT URI:
#   MinIO Console's OAuth callback path is `<console-url>/oauth_callback`. The
#   console is http://minio.talos00 (Traefik IngressRoute -> minio-console:9090),
#   so the redirect URI is http://minio.talos00/oauth_callback.
#
# SECRET: client_secret from !Env MINIO_OIDC_CLIENT_SECRET, injected into the
# authentik worker from the authentik-minio-oidc Secret (1Password
# minio.oidc-client-secret) — the SAME 1Password field the MinIO-side secret
# reads, so both ends of the handshake stay in lockstep. optional:true on the
# worker env so a missing secret can never CrashLoop the worker (same safety
# pattern as grafana/zot/forgejo). See TALOS-475t.
#
# Mounted into authentik-server AND authentik-worker as
# /blueprints/custom/minio-oidc.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-minio-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  minio-oidc.yaml: |
    version: 1
    metadata:
      name: MinIO Console OIDC SSO
      labels:
        blueprints.goauthentik.io/description: "MinIO Console OIDC SSO: group, policy scope mapping, OAuth2 provider, and application"
    entries:

      # ---------------------------------------------------------------------
      # 1. Group: minio-admins
      #    Empty by default. Members (plus superusers / Catalyst Admins /
      #    authentik Admins) get the MinIO `consoleAdmin` policy.
      # ---------------------------------------------------------------------
      - model: authentik_core.group
        id: minio-admins-group
        identifiers:
          name: minio-admins
        attrs:
          is_superuser: false

      # ---------------------------------------------------------------------
      # 2. ScopeMapping: minio (emits the `policy` claim MinIO consumes)
      #    Must be requested via MINIO_IDENTITY_OPENID_SCOPES=...,minio.
      # ---------------------------------------------------------------------
      - model: authentik_providers_oauth2.scopemapping
        id: minio-policy-scope-mapping
        identifiers:
          scope_name: minio
        attrs:
          name: "MinIO Policy"
          scope_name: minio
          description: "Returns the MinIO policy for the user (consoleAdmin or readonly)"
          expression: |
            # Superusers always get consoleAdmin
            if request.user.is_superuser:
                return {"policy": "consoleAdmin"}
            # Otherwise check membership in any of the recognised admin groups
            admin_groups = ["Catalyst Admins", "authentik Admins", "minio-admins"]
            user_groups = [g.name for g in request.user.ak_groups.all()]
            if any(g in user_groups for g in admin_groups):
                return {"policy": "consoleAdmin"}
            # Everyone else gets read-only access (tighten/remove to deny)
            return {"policy": "readonly"}

      # ---------------------------------------------------------------------
      # 3. OAuth2Provider: minio
      #    Confidential client. client_secret from !Env MINIO_OIDC_CLIENT_SECRET
      #    (worker pod env from authentik-minio-oidc Secret, 1Password via ESO).
      # ---------------------------------------------------------------------
      - model: authentik_providers_oauth2.oauth2provider
        id: minio-oauth2-provider
        identifiers:
          name: minio
        attrs:
          name: minio
          client_type: confidential
          client_id: minio
          client_secret: !Env MINIO_OIDC_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          redirect_uris:
            - matching_mode: strict
              url: http://minio.talos00/oauth_callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !KeyOf minio-policy-scope-mapping

      # ---------------------------------------------------------------------
      # 4. Application: minio
      #    Bound to the OAuth2 provider above.
      # ---------------------------------------------------------------------
      - model: authentik_core.application
        id: minio-application
        identifiers:
          slug: minio
        attrs:
          name: MinIO
          slug: minio
          provider: !KeyOf minio-oauth2-provider
          meta_launch_url: http://minio.talos00
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/minio.png
          meta_description: "MinIO Console - S3 object storage (Mimir/Tempo/Loki/Dagster backend)"
          meta_publisher: "Catalyst Homelab"
          open_in_new_tab: false
          policy_engine_mode: any
          group: talos-admin
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, minio]], group: !Find [authentik_core.group, [name, talos-admin]], order: 0}
        attrs: {enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, minio]], group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}
        attrs: {enabled: true}
