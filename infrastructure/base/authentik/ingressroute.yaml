---
# Authentik portal — local LAN access (HTTP)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-local
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.talos00`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
---
# Authentik portal — public HTTPS (Cloudflare)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.knowledgedump.space`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-http
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: authentik-server
          port: 80
---
# talos-private SSO endpoint — auth.priv.talos00 (HTTPS, LAN-only).
# This is the external_host of the talos-private forward_domain proxy provider:
# serving Authentik here scopes the SSO session cookie to .priv.talos00 (a valid
# registrable domain — talos00 is the public suffix), giving single-sign-on across
# every *.priv.talos00 service. pihole's *.talos00 wildcard resolves it internally;
# TLS served via TLSStore SNI from the *.priv.talos00 homelab-ca wildcard.
# FUTURE: a parallel auth.priv.knowledgedump.space route (LE + Cloudflare) when public.
# (TALOS-h4j / TALOS-xgrl.13)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-priv
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.priv.talos00`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-priv-http
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.priv.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: authentik-server
          port: 80
---
# forward_single outpost routing (TALOS-xgrl.13): each *.priv.talos00 forward-auth app's
# /outpost.goauthentik.io/* path must reach the embedded outpost (authentik-server), not
# the app. This one route covers all of them (more specific than the apps' Host() routes,
# so it wins for that path). NO auth middleware — the outpost serves it directly.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-outpost-priv
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        (Host(`kubeview.priv.talos00`) || Host(`headlamp.priv.talos00`) || Host(`guacamole.priv.talos00`) || Host(`windows-vnc.priv.talos00`) || Host(`zipline.priv.talos00`) || Host(`stash.priv.talos00`) || Host(`whisparr.priv.talos00`) || Host(`hot-ones.priv.talos00`) || Host(`whoami.priv.talos00`)) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 20
      services:
        - name: authentik-server
          port: 80
  tls: {}
