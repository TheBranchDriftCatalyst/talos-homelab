---
# Authentik portal — local LAN access (HTTP)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-local
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.talos00`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
---
# Authentik portal — public HTTPS (Cloudflare)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.knowledgedump.space`)
      kind: Rule
      middlewares:
        # Per-client rate limit on the public login surface (TALOS-lxz5.4.2 /
        # finding 009). Defense-in-depth in front of CrowdSec/AppSec; generous
        # enough never to throttle a real login flow.
        - name: rate-limit
          namespace: traefik
      services:
        - name: authentik-server
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-http
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`auth.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: authentik-server
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-priv
  namespace: authentik
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.priv.talos00`)
    kind: Rule
    services:
    - name: authentik-server
      port: 80
    middlewares:
    - name: private-domain-redirect
      namespace: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-priv-http
  namespace: authentik
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`auth.priv.talos00`)
    kind: Rule
    middlewares:
    - name: private-domain-redirect
      namespace: traefik
    services:
    - name: authentik-server
      port: 80
---
# forward_single outpost routing (TALOS-xgrl.13): every *.talos00 forward-auth app's
# /outpost.goauthentik.io/* path must reach the embedded outpost (authentik-server), not the
# app. ONE regexp route covers ALL forward-auth apps (present and future) — no per-app edit here
# when a new service is added. The regexp matches BOTH bare <app>.talos00 (arr-stack, TALOS-xgrl.14)
# AND <x>.priv.talos00 (the `.` in the char class covers the extra label). priority 1000 beats the
# apps' Host() routes for this path only. NO auth middleware — the outpost serves it directly.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-outpost-priv
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: (HostRegexp(`^[a-z0-9.-]+\.talos00$`) || HostRegexp(`^[a-z0-9-]+\.priv\.knowledgedump\.space$`)) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 1000
      services:
        - name: authentik-server
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-priv-domain
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.priv.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.priv.knowledgedump.space`)
    kind: Rule
    services:
    - name: authentik-server
      port: 80
    middlewares:
    - name: private-portal
      namespace: authentik
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-priv-http-domain
  namespace: authentik
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`auth.priv.knowledgedump.space`)
    kind: Rule
    middlewares:
    - name: private-portal
      namespace: authentik
    services:
    - name: authentik-server
      port: 80
---
# One IdP hostname keeps portal and outpost logins on the same browser session.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-portal
  namespace: authentik
spec:
  redirectRegex:
    regex: '^https?://auth\.priv\.knowledgedump\.space(.*)$'
    replacement: 'https://auth.amberdark.net${1}'
    permanent: false
