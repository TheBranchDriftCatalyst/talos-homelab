---
# Authentik Blueprint: openGym (gym / body-weight tracker).
#
# WHY THIS EXISTS: the embedded outpost 404s any external_host it does not know,
# so a route carrying the `authentik` middleware with no provider behind it
# serves 404 from a perfectly valid IngressRoute — see irc-blueprint.yaml for
# the incident this pattern came from.
#
# Access = `talos-apps` OR `cluster-admin` (two PolicyBindings,
# policy_engine_mode: any).
#
# SCOPE NOTE: this gates the static PWA shell only. /api is excluded at the
# IngressRoute because openGym's login is WebAuthn passkeys and the installed
# PWA calls /api directly — a forward-auth 302 injected into a passkey ceremony
# fails rather than re-authenticating. The /api surface is guarded by openGym's
# own passkey auth with INVITE_ONLY=1 and ALLOW_GUEST=0.
#
# Users therefore log in TWICE (Authentik, then passkey). openGym has no OIDC
# support to collapse that, so the only alternative is removing this layer and
# relying on passkeys + invite-only. Tracked as a follow-up decision.
#
# The provider must ALSO be unioned into the embedded outpost, whose list is
# authoritative in talos-private-blueprint.yaml and is REPLACE-not-merge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-opengym-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  opengym.yaml: |
    version: 1
    metadata:
      name: openGym forward_single application
      labels:
        blueprints.goauthentik.io/description: "forward_single application for the openGym PWA shell (talos-apps group)"
    entries:
      # ========== openGym ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-opengym
        identifiers: {name: opengym}
        attrs:
          name: opengym
          mode: forward_single
          external_host: https://opengym.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-opengym, identifiers: {slug: opengym}, attrs: {name: openGym, slug: opengym, group: talos-apps, provider: !KeyOf p-opengym, meta_launch_url: https://opengym.talos00, meta_description: "Self-hosted gym & body-weight tracker", meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/dumbbell.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-opengym-own, identifiers: {target: !KeyOf a-opengym, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-opengym-ca, identifiers: {target: !KeyOf a-opengym, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}
