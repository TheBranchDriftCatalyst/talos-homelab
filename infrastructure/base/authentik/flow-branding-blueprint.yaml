---
# Authentik Blueprint: Catalyst flow-title de-branding.
#
# The "Welcome to authentik!" string on the login page is FLOW DATA, not CSS —
# it is the `title` field of the default-authentication-flow. This blueprint
# PATCHES that title (and, optionally, the other default flows) to Catalyst
# wording so no Authentik product name is rendered anywhere in the flow.
#
# Mechanism: entries matched by `identifiers` (slug) with state:present update
# ONLY the attrs listed (title) on the EXISTING flow — no other flow fields are
# touched. Because we match by slug, this is a partial patch, not a create.
#
# We intentionally patch ONLY default-authentication-flow (guaranteed to exist
# on every Authentik install). Other default-* slugs vary by version/enabled
# stages; patching a slug that does not exist would try to CREATE an incomplete
# flow and fail the whole blueprint — so the extra flows are left commented for
# the operator to enable per their instance (verify the slug exists first via
# `ak list_flows` / the admin UI).
#
# ORCHESTRATOR: wire this new ConfigMap up —
#   ConfigMap name: authentik-flow-branding-blueprint
#   key:            flow-branding.yaml
#   add to kustomization.yaml resources AND to blueprints.configMaps in the
#   authentik HelmRelease so the worker mounts + reconciles it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-flow-branding-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
    brand: catalyst
data:
  flow-branding.yaml: |
    version: 1
    metadata:
      name: Catalyst Flow Branding
      labels:
        blueprints.goauthentik.io/description: "De-brand default flow titles to Catalyst wording"
    entries:
      # The login page header — replaces "Welcome to authentik!".
      - model: authentik_flows.flow
        identifiers:
          slug: default-authentication-flow
        state: present
        attrs:
          title: "Welcome to Catalyst"

      # ---- OPTIONAL (uncomment only after confirming the slug exists) --------
      # - model: authentik_flows.flow
      #   identifiers: {slug: default-invalidation-flow}
      #   state: present
      #   attrs: {title: "You have been signed out of Catalyst"}
      #
      # - model: authentik_flows.flow
      #   identifiers: {slug: default-recovery-flow}
      #   state: present
      #   attrs: {title: "Reset your Catalyst password"}
      #
      # - model: authentik_flows.flow
      #   identifiers: {slug: default-user-settings-flow}
      #   state: present
      #   attrs: {title: "Catalyst account settings"}
      #
      # - model: authentik_flows.flow
      #   identifiers: {slug: default-provider-authorization-explicit-consent}
      #   state: present
      #   attrs: {title: "Authorize access to Catalyst"}
      #
      # If a version instead sources the greeting from the identification stage
      # rather than the flow title, patch the stage's title as well:
      # - model: authentik_stages_identification.identificationstage
      #   identifiers: {name: default-authentication-identification}
      #   state: present
      #   attrs: {title: "Welcome to Catalyst"}
