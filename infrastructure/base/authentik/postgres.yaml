---
# CloudNativePG database for Authentik (TALOS-fijt). Replaces the Authentik
# Helm chart's BUNDLED `postgresql` subchart (StatefulSet authentik-postgresql-0
# on node-local `local-path` — the same node-pinned, single-replica failure mode
# we've been retiring fleet-wide). Authentik is the SSO/OIDC backend for Grafana,
# MinIO, Forgejo, litellm, zot and boomtime, so it moves to a 3-instance,
# streaming-replicated, node-independent CNPG cluster with object-store backups.
#
# PASSWORD STRATEGY — Option B (adopt the EXISTING password):
#   The app role's credential is supplied by the `authentik-postgres-app`
#   ExternalSecret below (type kubernetes.io/basic-auth, username=authentik,
#   password = the SAME 1Password `authentik.postgresql-password` field that
#   `authentik-secrets.AUTHENTIK_POSTGRESQL__PASSWORD` already reads). CNPG's
#   `bootstrap.initdb.secret` consumes it instead of generating a random
#   `authentik-postgres-app`. Net effect: the `authentik` role's password in the
#   new cluster is byte-identical to what Authentik already sends, so the app's
#   existing `AUTHENTIK_POSTGRESQL__PASSWORD` env keeps working untouched and the
#   ONLY helmrelease change is the DB host + disabling the bundled subchart.
#   (Option A — rewiring Authentik's env to a CNPG-generated -app secret — was
#   rejected: it edits the critical secret wiring of the SSO backend for no
#   benefit here, since the 1Password field already gives us a stable password.)
#
# NOTE: because we supply our own app secret, CNPG does NOT create (and the
# reflect-cnpg-app-secrets Kyverno policy does NOT match) a generated
# `<cluster>-app`. We therefore stamp the emberstack/reflector annotations +
# `cnpg.io/cluster` label directly on the ExternalSecret target so dbgate still
# pre-connects, exactly as it does for the generated secrets elsewhere.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  # Keep Velero/Kopia off CNPG-managed pods & PVCs — CNPG owns its own backups
  # (barmanObjectStore WAL archiving + daily ScheduledBackup to MinIO). Without
  # this, critical-data-daily (defaultVolumesToFsBackup: true, includes
  # authentik) redundantly fs-backed-up every replica's pgdata.
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imagePullPolicy: IfNotPresent
  storage:
    size: 8Gi # matches the retired bundled PVC data-authentik-postgresql-0 (8Gi)
    # local-path = the node's NVMe (Talos EPHEMERAL mounts at /var, which is where
    # local-path provisions from). Moved off NFS 2026-08-21 (TALOS-1ujn, TALOS-bna2).
    #
    # CHOSEN ON MEASUREMENT, not intuition. authentik commits 20 tx/s — 4x any other
    # cluster in the fleet, because every SSO check writes a session — and each commit
    # costs a WAL fsync. On NFS that fsync is a network round trip. Its READ path did
    # not need this (cnpg_pg_stat_database_blks_read is 0.00/s; the working set lives
    # entirely in shared buffers) — the win here is write latency, not reads.
    #
    # SAFE ONLY BECAUSE instances IS 3. local-path is WaitForFirstConsumer, so each PV
    # pins to the node that first used it. Three instances + CNPG's default pod
    # anti-affinity means three copies on three different nodes, so losing a node
    # loses one pinned volume and CNPG promotes a survivor automatically. NEVER reduce
    # this cluster to instances:1 while on local-path — that combination is strictly
    # worse than NFS, because a node loss then strands the only copy with no recovery
    # path short of a barman restore.
    storageClass: local-path
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  # Object-store backups → MinIO (TALOS-a1hk). Config lives in the ObjectStore
  # CR (objectstore.yaml) — migrated off the in-tree barmanObjectStore (removed
  # in CNPG 1.30) to the barman-cloud CNPG-I plugin. Same bucket/prefix/creds;
  # base backups: the ScheduledBackup below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-postgres
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      # Adopt the pre-provisioned app credential (Option B). username in this
      # secret MUST equal owner (authentik) per the CNPG basic-auth contract.
      secret:
        name: authentik-postgres-app
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
---
# Pre-provisioned app-role credential for the CNPG cluster above (Option B).
# type: kubernetes.io/basic-auth with username=authentik + password sourced from
# the SAME 1Password property Authentik's own secret uses, so both ends stay in
# lockstep across cluster rebuilds with zero manual coordination.
#
# MUST exist before the Cluster bootstraps — CNPG's initdb references it. Flux
# applies both in the same kustomization; CNPG simply retries until ESO has
# materialized this secret (a few seconds against 1Password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-app
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Lets tooling that keys off the CNPG cluster label find this secret,
          # since CNPG won't stamp its own label on a user-supplied secret.
          cnpg.io/cluster: authentik-postgres
        annotations:
          # dbgate auto-connect: mirror into the `databases` namespace. We set
          # these directly because the reflect-cnpg-app-secrets Kyverno policy
          # only matches CNPG-GENERATED -app secrets. (TALOS-7jxm parity)
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "databases"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "databases"
      data:
        username: authentik
        password: "{{ .pgpassword }}"
  data:
    - secretKey: pgpassword
      remoteRef:
        key: authentik
        property: postgresql-password
---
# Daily base backup for authentik-postgres → MinIO object store (TALOS-a1hk).
# Continuous WAL archiving is handled by the Cluster's barmanObjectStore; this
# ScheduledBackup drives the periodic base backups WAL replays sit on top of.
# 30-day retention is enforced by the Cluster's backup.retentionPolicy.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-postgres-daily
  namespace: authentik
spec:
  # 02:15 every day. CNPG cron is 6-field (seconds first): sec min hour dom mon dow.
  schedule: "0 15 2 * * *"
  immediate: true # take one right away so backups exist before the first tick
  backupOwnerReference: self
  # barman-cloud CNPG-I plugin (see objectstore.yaml) — in-tree method removed in CNPG 1.30
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: authentik-postgres
