---
# Authentik Blueprint for Zot registry OIDC SSO.
#
# Chain: Group (zot-admins) + OAuth2Provider (zot) + Application (zot). Same
# pattern as grafana-blueprint. Zot's UI logs users in via OIDC discovery
# against the PUBLIC issuer https://auth.knowledgedump.space/application/o/zot/
# (Zot can't split browser vs pod endpoints, so both hit the public host).
#
# SECRET: client_secret from !Env ZOT_OIDC_CLIENT_SECRET, injected into the
# authentik worker from the authentik-zot-oidc Secret (1Password zot.oidc-
# client-secret) — the SAME field the registry-side zot-secrets ExternalSecret
# reads, so both ends stay in lockstep. optional:true so a missing secret can
# never CrashLoop the worker (same safety pattern as grafana/boomtime).
#
# REDIRECT URIs: both zot.talos00 (test host) and registry.talos00 (post-
# cutover host) callbacks are registered so OIDC works before AND after the
# registry.talos00 cutover. Zot's callback path is /zot/auth/callback/<provider
# key>, and our provider key is "oidc".
#
# Mounted into authentik-server AND authentik-worker as
# /blueprints/custom/zot-oidc.yaml. See TALOS-6vf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-zot-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  zot-oidc.yaml: |
    version: 1
    metadata:
      name: Zot Registry OIDC SSO
      labels:
        blueprints.goauthentik.io/description: "Zot registry OIDC SSO: group, OAuth2 provider, and application"
    entries:

      - model: authentik_core.group
        id: zot-admins-group
        identifiers:
          name: zot-admins
        attrs:
          is_superuser: false

      - model: authentik_providers_oauth2.oauth2provider
        id: zot-oauth2-provider
        identifiers:
          name: zot
        attrs:
          name: zot
          client_type: confidential
          client_id: zot
          client_secret: !Env ZOT_OIDC_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          redirect_uris:
            - matching_mode: strict
              url: http://registry.talos00/zot/auth/callback/oidc
            - matching_mode: strict
              url: http://zot.talos00/zot/auth/callback/oidc
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

      - model: authentik_core.application
        id: zot-application
        identifiers:
          slug: zot
        attrs:
          name: Zot Registry
          slug: zot
          provider: !KeyOf zot-oauth2-provider
          meta_launch_url: http://registry.talos00
          meta_description: "Zot OCI container registry (replaces Nexus)"
          meta_publisher: "Catalyst Homelab"
          open_in_new_tab: false
          policy_engine_mode: any
