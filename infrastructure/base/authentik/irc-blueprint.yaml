---
# Authentik Blueprint: IRC (soju bouncer + gamja web client).
#
# WHY THIS EXISTS: Traefik's `authentik` forward-auth middleware hands the
# request to the embedded outpost, and the outpost answers 404 — not a login
# redirect — for any external_host it does not recognise. So attaching the
# middleware to a route with no provider behind it makes the app return 404 with
# a perfectly valid IngressRoute and nothing in the Traefik logs. That is
# exactly how irc.talos00 presented: /socket (no middleware) served correctly
# while / returned 404.
#
# Access = `talos-apps` OR `cluster-admin` (two PolicyBindings,
# policy_engine_mode: any). Both groups are owned by other blueprints and
# referenced here with !Find.
#
# NOTE: gamja's web UI is gated here, but soju's /socket and /uploads routes are
# deliberately NOT behind forward-auth — a WebSocket upgrade intercepted by
# forward-auth cannot fall back to a login page, it just fails. soju
# authenticates the IRC connection itself.
#
# The provider must ALSO be unioned into the embedded outpost, whose list is
# authoritative in talos-private-blueprint.yaml and is REPLACE-not-merge.
# Adding it here alone is not enough.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-irc-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  irc.yaml: |
    version: 1
    metadata:
      name: IRC forward_single application
      labels:
        blueprints.goauthentik.io/description: "forward_single application for the gamja IRC web client (talos-apps group)"
    entries:
      # ========== IRC (gamja) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-irc
        identifiers: {name: irc}
        attrs:
          name: irc
          mode: forward_single
          external_host: https://irc.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-irc, identifiers: {slug: irc}, attrs: {name: IRC, slug: irc, group: talos-apps, provider: !KeyOf p-irc, meta_launch_url: https://irc.talos00, meta_description: "soju bouncer + gamja web client", meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/irc.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-irc-own, identifiers: {target: !KeyOf a-irc, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-irc-ca, identifiers: {target: !KeyOf a-irc, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}
