        id: p-homepage-arrs
        identifiers: {name: homepage-arrs}
        attrs:
          name: homepage-arrs
          mode: forward_single
          external_host: https://arrs.homepage.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-homepage-arrs, identifiers: {slug: homepage-arrs}, attrs: {name: Homepage (arrs), slug: homepage-arrs, group: talos-media, provider: !KeyOf p-homepage-arrs, meta_launch_url: https://arrs.homepage.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-homepage-arrs-own, identifiers: {target: !KeyOf a-homepage-arrs, group: !Find [authentik_core.group, [name, talos-media]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-homepage-arrs-ca, identifiers: {target: !KeyOf a-homepage-arrs, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== data — data.homepage.talos00 (talos-admin OR cluster-admin) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-homepage-data
        identifiers: {name: homepage-data}
        attrs:
          name: homepage-data
          mode: forward_single
          external_host: https://data.homepage.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-homepage-data, identifiers: {slug: homepage-data}, attrs: {name: Homepage (data), slug: homepage-data, group: talos-admin, provider: !KeyOf p-homepage-data, meta_launch_url: https://data.homepage.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-homepage-data-own, identifiers: {target: !KeyOf a-homepage-data, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-homepage-data-ca, identifiers: {target: !KeyOf a-homepage-data, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== home — home.homepage.talos00 (talos-home OR cluster-admin) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-homepage-home
        identifiers: {name: homepage-home}
