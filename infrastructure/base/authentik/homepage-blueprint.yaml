      - {model: authentik_policies.policybinding, id: b-homepage-home-ca, identifiers: {target: !KeyOf a-homepage-home, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== infra — infra.homepage.talos00 (talos-admin OR cluster-admin) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-homepage-infra
        identifiers: {name: homepage-infra}
        attrs:
