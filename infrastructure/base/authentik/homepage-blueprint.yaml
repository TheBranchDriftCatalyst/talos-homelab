---
# Authentik Blueprint: Homepage dashboards — per-instance forward_single SSO (TALOS-xgrl.18).
#
# Domain: talos00 (bare, LAN-only). The multi-instance gethomepage.dev stack
# (applications/homepage) publishes 8 boards, each its OWN Application
# (forward_single) → its own launcher tile. gethomepage dashboards ship with NO
# built-in auth, so forward-auth is a clean single sign-on (no double-login).
# Each board's /outpost.goauthentik.io/* path reaches the embedded outpost via the
# broadened HostRegexp route in authentik/ingressroute.yaml
# (`^[a-z0-9.-]+\.talos00$` — covers BOTH homepage.talos00 and the 2-label
# <board>.homepage.talos00).
#
# ACCESS (policy_engine_mode: any = OR across bindings):
#   master  homepage.talos00        → cluster-admin ONLY (the god-view / admin overview)
#   apps    apps.homepage.talos00   → talos-apps  OR cluster-admin
#   arrs    arrs.homepage.talos00   → talos-media OR cluster-admin
#   data    data.homepage.talos00   → talos-admin OR cluster-admin
#   home    home.homepage.talos00   → talos-home  OR cluster-admin
#   infra   infra.homepage.talos00  → talos-admin OR cluster-admin
#   llm     llm.homepage.talos00    → talos-apps  OR cluster-admin
#   obs     obs.homepage.talos00    → talos-admin OR cluster-admin
#
# This blueprint owns NO groups — every group (cluster-admin/talos-admin/talos-apps
# from talos-private-blueprint, talos-media from arr-stack-blueprint, talos-home
# from home-blueprint) is referenced by !Find. Each provider is unioned into the
# embedded outpost, whose providers list is AUTHORITATIVE (REPLACE-not-merge) in
# talos-private-blueprint.yaml → the 8 !Find entries live there.
#
# Mounted via chart-native blueprints.configMaps (helmrelease.yaml) on the worker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-homepage-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  homepage.yaml: |
    version: 1
    metadata:
      name: Homepage dashboards forward_single applications
      labels:
        blueprints.goauthentik.io/description: "Per-instance forward_single applications for the multi-instance Homepage dashboard stack"
    entries:
      # ========== master — homepage.talos00 (cluster-admin ONLY, the god-view) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-homepage-master
        identifiers: {name: homepage-master}
        attrs:
          name: homepage-master
          mode: forward_single
          external_host: https://homepage.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-homepage-master, identifiers: {slug: homepage-master}, attrs: {name: Homepage (master), slug: homepage-master, group: cluster-admin, provider: !KeyOf p-homepage-master, meta_launch_url: https://homepage.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-homepage-master-ca, identifiers: {target: !KeyOf a-homepage-master, group: !Find [authentik_core.group, [name, cluster-admin]], order: 0}, attrs: {enabled: true}}

      # ========== apps — apps.homepage.talos00 (talos-apps OR cluster-admin) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-homepage-apps
        identifiers: {name: homepage-apps}
        attrs:
          name: homepage-apps
          mode: forward_single
          external_host: https://apps.homepage.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-homepage-apps, identifiers: {slug: homepage-apps}, attrs: {name: Homepage (apps), slug: homepage-apps, group: talos-apps, provider: !KeyOf p-homepage-apps, meta_launch_url: https://apps.homepage.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-homepage-apps-own, identifiers: {target: !KeyOf a-homepage-apps, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-homepage-apps-ca, identifiers: {target: !KeyOf a-homepage-apps, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== arrs — arrs.homepage.talos00 (talos-media OR cluster-admin) ==========
