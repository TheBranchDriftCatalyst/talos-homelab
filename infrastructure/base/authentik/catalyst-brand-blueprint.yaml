---
# Authentik Blueprint: catalyst (default) brand
#
# Default brand — fires for any request that doesn't match a more specific
# brand domain (e.g. the kelsboi brand owned by talos-private). Lives in
# talos-homelab because it's the cluster's "home" identity, and Authentik
# itself is deployed here.
#
# Mounted into authentik-server AND authentik-worker as
#   /blueprints/custom/catalyst-brand.yaml
# via this ConfigMap (volumeMount in helmrelease.yaml). The worker
# auto-discovers any blueprint files under /blueprints/custom/ and reconciles
# them on a schedule (typically within ~minute of pod start).
#
# REFERENCES:
#   - Brand asset bytes live in authentik-catalyst-brand-assets ConfigMap,
#     mounted at /web/dist/catalyst-brand-logo.svg and
#     /web/dist/catalyst-brand-favicon.svg (Authentik serves them as
#     /static/dist/catalyst-brand-*.svg).
#   - Authentik Brand model docs:
#     https://docs.goauthentik.io/docs/sys-mgmt/brands
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-catalyst-brand-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
    brand: catalyst
data:
  catalyst-brand.yaml: |
    version: 1
    metadata:
      name: Catalyst Brand
      labels:
        blueprints.goauthentik.io/description: "Default brand for the Catalyst homelab"
    entries:
      - model: authentik_brands.brand
        id: catalyst-brand
        identifiers:
          # Match the existing built-in default brand (Authentik enforces
          # at-most-one default, so we *rebrand* it rather than create a
          # second default-true entry).
          domain: authentik-default
        attrs:
          domain: authentik-default
          default: true
          branding_title: "Catalyst"
          branding_logo: /static/dist/catalyst-brand-logo.svg
          branding_favicon: /static/dist/catalyst-brand-favicon.svg
          # Rotating login background: the flow renders inside the ak-flow-executor SHADOW
          # DOM, so the light-DOM custom.css (.pf-c-background-image / --ak-flow-background)
          # NEVER reached it — that element doesn't even exist on the flow page. The native
          # brand field IS the right mechanism and accepts a full URL (verified live on
          # 2025.12.4 — the old "URL fails validation" note was wrong). The catalyst-bg nginx
          # serves a random bg1-6.jpg per request from MinIO over LE-trusted bg.knowledgedump.space.
          branding_default_flow_background: "https://bg.knowledgedump.space/" # (TALOS-4o0k)
          # ---------------------------------------------------------------
          # branding_custom_css: SHADOW-DOM overrides.
          # The globally-mounted /web/dist/custom.css (authentik-custom-css
          # ConfigMap) only reaches the LIGHT DOM (page background, .pf-c-login
          # wrapper, brand logo) — which is why the card/background/logo themed
          # correctly. The primary button and the "Powered by authentik" footer
          # live INSIDE the flow stage's web-component shadow roots, which that
          # sheet cannot reach. Authentik ADOPTS this per-brand custom CSS into
          # each component's shadow root, so the selectors below DO reach them.
          # CSS custom properties also inherit across the shadow boundary.
          # Refs: docs.goauthentik.io/brands/custom-css ; gh issue #20275.
          # ---------------------------------------------------------------
          branding_custom_css: |
            /* Recolor the primary "Log in" button. Custom properties pierce the
               shadow boundary; we set PF4 + PF5 (+ PF6 best-effort) names so the
               button turns Catalyst-magenta regardless of the PatternFly version
               authentik ships. These are the SOLID fallback. */
            :root {
              --pf-global--primary-color--100: #ff2e97;
              --pf-global--primary-color--200: #b14bff;
              --pf-global--active-color--100: #ff2e97;
              --pf-global--link--Color: #00e5ff;
              --pf-global--link--Color--hover: #ff6ec7;
              --pf-c-button--m-primary--BackgroundColor: #ff2e97;
              --pf-c-button--m-primary--hover--BackgroundColor: #ff5cae;
              --pf-c-button--m-primary--active--BackgroundColor: #e01f82;
              --pf-c-button--m-primary--focus--BackgroundColor: #ff5cae;
              --pf-c-button--m-primary--Color: #0a0a0f;
              --pf-v5-global--primary-color--100: #ff2e97;
              --pf-v5-global--link--Color: #00e5ff;
              --pf-v5-c-button--m-primary--BackgroundColor: #ff2e97;
              --pf-v5-c-button--m-primary--hover--BackgroundColor: #ff5cae;
              --pf-v5-c-button--m-primary--active--BackgroundColor: #e01f82;
              --pf-v5-c-button--m-primary--focus--BackgroundColor: #ff5cae;
              --pf-v5-c-button--m-primary--Color: #0a0a0f;
              --pf-v6-c-button--m-primary--BackgroundColor: #ff2e97;
              --pf-v6-c-button--m-primary--Color: #0a0a0f;
            }
            /* Gradient fill via direct selector (proven to reach the login
               button when set in brand custom CSS). Vars above are the fallback. */
            .pf-c-button.pf-m-primary,
            .pf-v5-c-button.pf-m-primary,
            button[type="submit"].pf-m-primary {
              background: linear-gradient(135deg,#ff2e97 0%,#b14bff 50%,#00e5ff 100%) !important;
              border: none !important;
              color: #0a0a0f !important;
              border-radius: 9px !important;
              font-weight: 700 !important;
              letter-spacing: .08em !important;
              text-transform: uppercase !important;
              box-shadow: 0 0 18px rgba(255,46,151,.4) !important;
            }
            .pf-c-button.pf-m-primary:hover,
            .pf-v5-c-button.pf-m-primary:hover,
            button[type="submit"].pf-m-primary:hover {
              filter: brightness(1.08);
              box-shadow: 0 0 28px rgba(255,46,151,.6) !important;
            }
            /* DE-BRAND: hide the "Powered by authentik" footer band + version.
               ui_footer_links is empty for this brand, so hiding the whole
               footer is safe. */
            .pf-c-login__main-footer-band,
            .pf-c-login__footer {
              display: none !important;
            }
            /* kept separate so an engine without :has() can't drop the rule above */
            .pf-c-login__main-footer-links-item:has(a[href*="goauthentik"]) {
              display: none !important;
            }
            a[href*="goauthentik.io"] { display: none !important; }

            /* =================================================================
               CATALYST FLOW-CARD THEME  (migrated from the custom-css ConfigMap)
               These element selectors target elements that render INSIDE the
               ak-flow-executor shadow root (.pf-c-login__main / .ak-stage, the
               form controls, titles, alerts). The globally-mounted
               /web/dist/custom.css is LIGHT-DOM only and can never reach them,
               so the login card used to render as a plain WHITE box. Authentik
               ADOPTS this brand CSS into each component's shadow root, so the
               rules below finally apply. (The page background +
               .pf-c-background-image gradient stay in the ConfigMap — that is the
               portal/light-DOM shell, not the flow card.)
               ================================================================= */
            /* Catalyst palette tokens — element selectors below reference these;
               custom properties inherit across the shadow boundary, but we also
               define them here so the flow shadow root resolves them standalone. */
            :root {
              --cat-bg:          #08080c;
              --cat-bg-2:        #0d0d16;
              --cat-surface:     #14141f;
              --cat-surface-2:   #1b1b2b;
              --cat-border:      #2a2140;
              --cat-border-2:    #3a2f57;
              --cat-text:        #e9e7f3;
              --cat-muted:       #a6a2bf;
              --cat-magenta:     #ff2e97;
              --cat-pink:        #ff6ec7;
              --cat-purple:      #b14bff;
              --cat-indigo:      #7c4dff;
              --cat-cyan:        #00e5ff;
              --cat-teal:        #21e6c1;
              --cat-danger:      #ff2975;
              --cat-grad: linear-gradient(135deg, #ff2e97 0%, #b14bff 50%, #00e5ff 100%);
              --cat-glow-magenta: 0 0 24px rgba(255,46,151,.35);
              --cat-glow-cyan:    0 0 24px rgba(0,229,255,.30);
              --cat-font-display: 'Orbitron','Rajdhani',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
              --cat-font-body:    'Rajdhani',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
              --cat-font-mono:    ui-monospace,'JetBrains Mono','Cascadia Code','SF Mono','Space Mono',Menlo,monospace;
            }
            /* Login / flow card — glassmorphism panel + gradient-glow ring */
            .pf-c-login__main,
            .ak-stage {
              background: linear-gradient(180deg, rgba(20,20,31,.94), rgba(13,13,22,.94)) !important;
              -webkit-backdrop-filter: blur(18px) saturate(140%);
                      backdrop-filter: blur(18px) saturate(140%);
              border: 1px solid var(--cat-border) !important;
              border-radius: 16px !important;
              box-shadow:
                0 0 0 1px rgba(255,46,151,.18),
                0 24px 70px rgba(0,0,0,.62),
                0 0 46px rgba(124,77,255,.16) !important;
              position: relative;
              overflow: visible;
            }
            .pf-c-login__main::before {
              content: "";
              position: absolute;
              inset: -1px;
              border-radius: 17px;
              padding: 1px;
              background: var(--cat-grad);
              -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              -webkit-mask-composite: xor;
                      mask-composite: exclude;
              opacity: .65;
              pointer-events: none;
            }
            .pf-c-login__main-header,
            .pf-c-login__header {
              background: transparent !important;
            }
            .pf-c-brand,
            .pf-c-login__main-header img,
            img.pf-c-brand {
              max-height: 92px !important;
              height: auto !important;
              filter: drop-shadow(0 0 14px rgba(255,46,151,.35));
            }
            /* Titles / headings inside the stage (the gradient-text treatment for
               the main header title is applied by the block just below, which
               follows this one so it wins on the shared title selectors). */
            h1, h2, h3, h4, h5, h6,
            .pf-c-title,
            .pf-c-login__main-header-title,
            .pf-c-login__main-header .pf-c-title {
              font-family: var(--cat-font-display) !important;
              font-weight: 700 !important;
              letter-spacing: 0.045em !important;
              color: var(--cat-text) !important;
              text-shadow: 0 0 14px rgba(255,46,151,.25);
            }
            /* Body copy / labels / helper text inside the stage */
            p, span, div, label, li,
            .pf-c-form__label-text,
            .pf-c-login__main-footer-links,
            .pf-c-content {
              font-family: var(--cat-font-body) !important;
              color: var(--cat-text);
            }
            small, .pf-c-form__helper-text, .pf-u-color-200 { color: var(--cat-muted) !important; }
            code, pre, .pf-c-code-block, kbd { font-family: var(--cat-font-mono) !important; }
            /* Secondary / link buttons (primary handled by the block above) */
            .pf-c-button.pf-m-secondary {
              background: transparent !important;
              border: 1.5px solid var(--cat-cyan) !important;
              color: var(--cat-cyan) !important;
              font-family: var(--cat-font-display) !important;
              letter-spacing: 0.06em !important;
              border-radius: 9px !important;
              transition: all .2s ease !important;
            }
            .pf-c-button.pf-m-secondary:hover {
              background: rgba(0,229,255,.12) !important;
              box-shadow: var(--cat-glow-cyan) !important;
            }
            .pf-c-button.pf-m-link { color: var(--cat-cyan) !important; }
            .pf-c-button.pf-m-link:hover { color: var(--cat-pink) !important; }
            /* Form controls — identification / password / recovery / enrollment */
            .pf-c-form-control,
            .pf-c-text-input-group__text-input,
            input[type="text"], input[type="password"],
            input[type="email"], input[type="number"], select, textarea {
              background: var(--cat-surface-2) !important;
              border: 1px solid var(--cat-border) !important;
              color: var(--cat-text) !important;
              font-family: var(--cat-font-body) !important;
              border-radius: 8px !important;
              transition: border-color .18s ease, box-shadow .18s ease !important;
            }
            .pf-c-form-control:focus, input:focus, select:focus, textarea:focus {
              border-color: var(--cat-magenta) !important;
              box-shadow: 0 0 0 3px rgba(255,46,151,.22) !important;
              outline: none !important;
            }
            .pf-c-form-control::placeholder { color: var(--cat-muted) !important; }
            *:focus-visible { outline: 2px solid var(--cat-cyan) !important; outline-offset: 2px !important; }
            .pf-c-check__input, .pf-c-radio__input, input[type="checkbox"], input[type="radio"] {
              accent-color: var(--cat-magenta) !important;
            }
            /* Links inside the stage */
            a { color: var(--cat-cyan) !important; transition: color .18s ease, text-shadow .18s ease !important; }
            a:hover { color: var(--cat-pink) !important; text-shadow: 0 0 10px rgba(255,110,199,.5) !important; }
            /* Alerts / stage messages (denied / invalid / recovery success) */
            .pf-c-alert.pf-m-danger,
            .pf-c-alert.pf-m-warning {
              background: rgba(255,41,117,.10) !important;
              border: 1px solid var(--cat-danger) !important;
              border-radius: 10px !important;
              color: var(--cat-text) !important;
            }
            .pf-c-alert.pf-m-success,
            .pf-c-alert.pf-m-info {
              background: rgba(0,229,255,.09) !important;
              border: 1px solid var(--cat-cyan) !important;
              border-radius: 10px !important;
              color: var(--cat-text) !important;
            }

            /* Give the (now "Welcome to Catalyst") stage heading the neon
               gradient-text treatment inside the shadow root too. */
            .pf-c-login__main-header-title,
            .pf-c-title.pf-m-3xl,
            .ak-stage h1 {
              background: linear-gradient(135deg,#ff2e97,#00e5ff);
              -webkit-background-clip: text; background-clip: text;
              -webkit-text-fill-color: transparent; color: transparent !important;
              text-transform: uppercase; letter-spacing: .04em;
            }
            /* NOTE: the rotating login background (.pf-c-background-image) is LIGHT DOM,
               so it is wired in the mounted custom.css ConfigMap, NOT here — branding_custom_css
               only reaches the shadow DOM. A copy here never applied. (TALOS-4o0k) */

          # Leaving flow_* unset → falls through to the globally-default flows.
          # flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          # flow_invalidation:   !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          # flow_recovery:       !Find [authentik_flows.flow, [slug, default-recovery-flow]]
          # flow_unenrollment:   !Find [authentik_flows.flow, [slug, default-unenrollment-flow]]
          # flow_user_settings:  !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
