---
# Authentik Blueprint for Grafana OIDC SSO Integration
#
# Creates the chain needed for Grafana SSO via Authentik:
#   1. Group          - grafana-admins (empty by default; add members via UI)
#   2. OAuth2Provider - grafana (confidential, client_id=grafana)
#   3. Application    - grafana (slug=grafana, bound to provider above)
#
# Unlike the litellm blueprint, Grafana does its OWN role mapping (via the
# generic_oauth `role_attribute_path` JMESPath in grafana-instance.yaml), so we
# do NOT need a custom ScopeMapping here. The default `profile` scope already
# emits the `groups` claim (with include_claims_in_id_token: true), which
# Grafana evaluates: members of "Catalyst Admins" or "grafana-admins" -> Admin,
# everyone else -> Viewer.
#
# Mounted into authentik-server AND authentik-worker as
#   /blueprints/custom/grafana-oidc.yaml
# via this ConfigMap (volumeMount in helmrelease.yaml). The worker auto-discovers
# any blueprint files under /blueprints/custom/ and reconciles them.
#
# SECRET HANDLING (no secrets in git):
#   The OAuth2Provider client_secret is read from the env var
#   GRAFANA_OIDC_CLIENT_SECRET via the !Env YAML tag. That env var is injected
#   into the authentik worker pod from the in-namespace Secret
#   "authentik-grafana-oidc" (key: client-secret), populated by the
#   ExternalSecret of the same name from 1Password (item: grafana,
#   property: oidc-client-secret).
#
#   The matching value is consumed by the Grafana instance as
#   GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, sourced from the SAME 1Password
#   property (via the grafana-oidc ExternalSecret in the monitoring namespace).
#   Both ends pull from one field, so they stay in sync across cluster rebuilds
#   with no manual coordination.
#
# URL NOTE (internal/external split):
#   Grafana is internal-only (http://grafana.talos00). All OAuth URLs point at
#   http://auth.talos00 so the browser redirect and the pod-side token exchange
#   hit the same host, keeping the id_token `iss` claim consistent. The Grafana
#   pod reaches auth.talos00 by hairpinning through Traefik (192.168.1.54).
#   Redirect URI must match Grafana's {root_url}/login/generic_oauth.
#
# PROVISION FIRST (one-time): create the 1Password item "grafana" field
# "oidc-client-secret" (e.g. `openssl rand -hex 32`) BEFORE this reconciles.
# The worker env is optional:true so a missing secret can never CrashLoop it
# (same safety pattern as boomtime) — the provider is just created with an empty
# secret until the field exists, then restart authentik-worker.
#
# MANUAL POST-INSTALL (one-time, per user):
#   1. Log into Authentik as akadmin
#   2. Directory > Groups > "grafana-admins" > add users who should be Grafana Admin
#      (or rely on the existing "Catalyst Admins" group — both map to Admin)
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-grafana-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  grafana-oidc.yaml: |
    # Authentik Blueprint: Grafana OIDC SSO (full IaC)
    # Docs: https://docs.goauthentik.io/docs/customize/blueprints
    version: 1
    metadata:
      name: Grafana OIDC SSO
      labels:
        blueprints.goauthentik.io/description: "Grafana OIDC SSO: group, OAuth2 provider, and application"
    entries:

      # ---------------------------------------------------------------------
      # 1. Group: grafana-admins
      #    Empty by default. Members map to Grafana "Admin" role (alongside
      #    the existing "Catalyst Admins" group) via role_attribute_path.
      # ---------------------------------------------------------------------
      - model: authentik_core.group
        id: grafana-admins-group
        identifiers:
          name: grafana-admins
        attrs:
          is_superuser: false

      # ---------------------------------------------------------------------
      # 2. OAuth2Provider: grafana
      #    Confidential client. client_secret pulled from the env var
      #    GRAFANA_OIDC_CLIENT_SECRET (injected into the worker pod from the
      #    authentik-grafana-oidc Secret, sourced from 1Password via ESO).
      # ---------------------------------------------------------------------
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-oauth2-provider
        identifiers:
          name: grafana
        attrs:
          name: grafana
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          access_code_validity: minutes=1
          access_token_validity: minutes=10
          refresh_token_validity: days=30
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          redirect_uris:
            - matching_mode: strict
              url: http://grafana.talos00/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

      # ---------------------------------------------------------------------
      # 3. Application: grafana
      #    Bound to the OAuth2 provider above.
      # ---------------------------------------------------------------------
      - model: authentik_core.application
        id: grafana-application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf grafana-oauth2-provider
          meta_launch_url: http://grafana.talos00
          meta_description: "Grafana - metrics, logs, and traces visualization"
          meta_publisher: "Catalyst Homelab"
          open_in_new_tab: false
          policy_engine_mode: any
          group: talos-admin
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, grafana]], group: !Find [authentik_core.group, [name, talos-admin]], order: 0}
        attrs: {enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, grafana]], group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}
        attrs: {enabled: true}
