        id: p-sillytavern
        identifiers: {name: sillytavern}
        attrs:
          name: sillytavern
          mode: forward_single
          external_host: https://sillytavern.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-sillytavern, identifiers: {slug: sillytavern}, attrs: {name: SillyTavern, slug: sillytavern, group: talos-apps, provider: !KeyOf p-sillytavern, meta_launch_url: https://sillytavern.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/sillytavern.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-sillytavern-own, identifiers: {target: !KeyOf a-sillytavern, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-sillytavern-ca, identifiers: {target: !KeyOf a-sillytavern, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

