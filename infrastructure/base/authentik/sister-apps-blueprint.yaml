---
# Authentik Blueprint: sister-repo apps — per-app forward_single SSO (TALOS-xgrl.14).
#
# These 8 apps live in SISTER repos (ArgoCD-deployed), but their Authentik
# forward-auth wiring is owned HERE (Flux). Each becomes its OWN Application
# (forward_single) → its own launcher tile:
#
#   talos-apps group  : Lobe Chat, SillyTavern, SearXNG, Catalyst UI, Dungeon Library
#   talos-admin group : Dagster, Neo4j Browser, Media Explorer
#
# Access = the app's own group OR cluster-admin (two PolicyBindings,
# policy_engine_mode: any). Both groups are defined in talos-private-blueprint.yaml
# (cluster-admin/talos-admin/talos-apps live there) → referenced via !Find here,
# matching the linkwarden/boomtime/litellm blueprints.
#
# forward_single apps route /outpost.goauthentik.io/* to authentik-server via the
# shared HostRegexp outpost route in authentik/ingressroute.yaml (covers bare
# *.talos00) — no per-app route needed. Each provider is ALSO unioned into the
# embedded outpost, whose provider list is authoritative (REPLACE-not-merge) in
# talos-private-blueprint.yaml → the 8 !Find entries must be added THERE.
#
# Mounted via chart-native blueprints.configMaps (helmrelease.yaml) as
# /blueprints/mounted/cm-authentik-sister-apps-blueprint/sister-apps.yaml on the
# worker. The operator must be a member of talos-apps/talos-admin (or cluster-admin,
# which is OR'd in) to reach these tiles.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-sister-apps-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  sister-apps.yaml: |
    version: 1
    metadata:
      name: sister-repo apps forward_single SSO
      labels:
        blueprints.goauthentik.io/description: "per-app forward_single applications for ArgoCD-deployed sister-repo apps (talos-apps + talos-admin)"
    entries:
      # ========== Lobe Chat (talos-apps) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-lobe-chat
        identifiers: {name: lobe-chat}
        attrs:
          name: lobe-chat
          mode: forward_single
          external_host: https://lobechat.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-lobe-chat, identifiers: {slug: lobe-chat}, attrs: {name: Lobe Chat, slug: lobe-chat, group: talos-apps, provider: !KeyOf p-lobe-chat, meta_launch_url: https://lobechat.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/lobe-chat.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-lobe-chat-own, identifiers: {target: !KeyOf a-lobe-chat, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-lobe-chat-ca, identifiers: {target: !KeyOf a-lobe-chat, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== SillyTavern (talos-apps) ==========
