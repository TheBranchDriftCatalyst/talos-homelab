      - {model: authentik_core.application, id: a-catalyst-ui, identifiers: {slug: catalyst-ui}, attrs: {name: Catalyst UI, slug: catalyst-ui, group: talos-apps, provider: !KeyOf p-catalyst-ui, meta_launch_url: https://catalyst.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/storybook.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-catalyst-ui-own, identifiers: {target: !KeyOf a-catalyst-ui, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-catalyst-ui-ca, identifiers: {target: !KeyOf a-catalyst-ui, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

