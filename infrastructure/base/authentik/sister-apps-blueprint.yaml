            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-searxng, identifiers: {slug: searxng}, attrs: {name: SearXNG, slug: searxng, group: talos-apps, provider: !KeyOf p-searxng, meta_launch_url: https://searxng.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/searxng.png, policy_engine_mode: any}}
