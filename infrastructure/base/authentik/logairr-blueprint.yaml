---
# Authentik Blueprint: logAIrr (log triage context inspector).
#
# WHY THIS EXISTS AT ALL: Traefik's `authentik` forward-auth middleware hands the request to the
# embedded outpost, and the outpost answers 404 — not a login redirect — for any external_host
# it does not recognise. So attaching the middleware to a route with no provider behind it makes
# the app return 404 with a perfectly valid IngressRoute and nothing in the Traefik logs.
# logairr.talos00 presented exactly this way.
#
# THREE REGISTRATION POINTS, all required. This ConfigMap must be listed in:
#   1. infrastructure/base/authentik/kustomization.yaml      (so it is applied)
#   2. helmrelease.yaml -> blueprints.configMaps             (so it is MOUNTED; there is no
#      label auto-discovery)
#   3. talos-private-blueprint.yaml -> embedded-outpost providers union (so the OUTPOST can see
#      it). That list is REPLACE-not-merge and authoritative in that one file: a provider
#      defined only here is invisible to the outpost, which is the 404 above.
#
# WHAT IS BEHIND THIS DOOR: every error log body the cluster produced in the window, including
# bodies from the SSH honeypot and the reverse proxy — i.e. text written by strangers. It is a
# read-only inspector and it calls no model, but it is still the most sensitive surface in the
# namespace, so access is `cluster-admin` ONLY, not `talos-apps`. The other apps here are
# services; this one is a window onto all of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-logairr-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  logairr.yaml: |
    version: 1
    metadata:
      name: logairr forward_single application
      labels:
        blueprints.goauthentik.io/description: "forward_single application for the logAIrr context inspector (cluster-admin only)"
    entries:
      # ========== logairr ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-logairr
        identifiers: {name: logairr}
        attrs:
          name: logairr
          mode: forward_single
          external_host: https://logairr.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-logairr, identifiers: {slug: logairr}, attrs: {name: logAIrr, slug: logairr, group: talos-apps, provider: !KeyOf p-logairr, meta_launch_url: https://logairr.talos00, meta_description: "Log triage context inspector — what the LLM would be handed, dry run", meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/robot.png, policy_engine_mode: any}}
      # cluster-admin ONLY. See the note above on what is readable through this.
      - {model: authentik_policies.policybinding, id: b-logairr-ca, identifiers: {target: !KeyOf a-logairr, group: !Find [authentik_core.group, [name, cluster-admin]], order: 0}, attrs: {enabled: true}}
