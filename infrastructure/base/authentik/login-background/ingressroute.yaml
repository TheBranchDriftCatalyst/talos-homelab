---
# catalyst-bg login-background — public HTTPS (Cloudflare). Mirrors the
# auth.knowledgedump.space public pattern in ../ingressroute.yaml EXACTLY so the
# image loads over the same LE-trusted, Cloudflare-proxied edge the login page
# does (no mixed-content / untrusted-cert block). (TALOS-4o0k)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-bg
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: bg.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bg.knowledgedump.space`)
      kind: Rule
      services:
        - name: catalyst-bg
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-bg-http
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`bg.knowledgedump.space`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: catalyst-bg
          port: 80
