---
# catalyst-bg — rotating login-background proxy (TALOS-4o0k). See configmap.yaml
# for the WHY. Tiny, stateless, non-root nginx that random-picks + proxies a
# MinIO object per request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-bg
  namespace: authentik
  labels:
    app.kubernetes.io/name: catalyst-bg
    app.kubernetes.io/part-of: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-bg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalyst-bg
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # nginx-unprivileged: master+workers run as uid 101, listens on 8080
          # by default (no root, no privileged port) — fits readOnlyRootFilesystem.
          image: nginxinc/nginx-unprivileged:stable-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # readOnlyRootFilesystem => nginx's writable scratch dirs must be
            # tmpfs-backed emptyDirs.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
      volumes:
        - name: conf
          configMap:
            name: catalyst-bg
            items:
              - key: default.conf
                path: default.conf
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalyst-bg
  namespace: authentik
  labels:
    app.kubernetes.io/name: catalyst-bg
    app.kubernetes.io/part-of: authentik
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalyst-bg
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
