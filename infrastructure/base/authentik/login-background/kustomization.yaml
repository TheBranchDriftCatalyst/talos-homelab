---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# catalyst-bg — rotating login-background service for the Authentik login page.
# Random-picks bg1..bg6 from the MinIO `catalyst-bgs` bucket per request and
# proxies it out over an LE-trusted, Cloudflare-proxied host (TALOS-4o0k).
resources:
  - configmap.yaml
  - deployment.yaml
  - ingressroute.yaml
