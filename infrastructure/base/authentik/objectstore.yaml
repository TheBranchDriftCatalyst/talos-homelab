---
# Barman Cloud plugin ObjectStore for authentik-postgres — the former
# Cluster.spec.backup.barmanObjectStore stanza moved verbatim (same bucket/
# prefix/creds — WAL history and base backups carry over). retentionPolicy
# moves here too (was Cluster.spec.backup.retentionPolicy).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: authentik-postgres
  annotations:
    # Converting to a CatalystCNPGAppDB (TALOS-npt4). The manifests are removed from git
    # in the next commit and the composite adopts these objects in place; without this Flux
    # treats the removal as a deletion and CNPG deletes the PVCs. This is the identity
    # provider for the whole cluster — that outcome logs everyone out of everything.
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: authentik
spec:
  retentionPolicy: "30d" # prune backups + WALs older than 30 days
  configuration:
    destinationPath: s3://cnpg-backups/authentik-postgres
    endpointURL: http://minio-hl.minio.svc:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
