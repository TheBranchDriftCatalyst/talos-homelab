---
# Authentik Blueprint: infra/admin UIs — per-app forward_single SSO (TALOS-xgrl.14).
#
# Domain: talos00 (bare, LAN-only). Each app (crowdsec/goldilocks/kube-ops-view/hubble/
# dbgate/plausible) becomes its OWN Application (forward_single) → its own launcher tile in
# the `talos-admin` section. Access = the `talos-admin` group OR `cluster-admin` (two
# PolicyBindings, policy_engine_mode: any). forward_single apps route /outpost.goauthentik.io/*
# to authentik-server via the broadened HostRegexp route in authentik/ingressroute.yaml.
#
# Both `talos-admin` and `cluster-admin` are owned by talos-private-blueprint.yaml →
# referenced here via !Find (cross-blueprint).
#
# Each provider must ALSO be unioned into the embedded outpost — that list is authoritative
# in talos-private-blueprint.yaml (REPLACE-not-merge), so the !Find entries live there.
#
# Mounted via chart-native blueprints.configMaps (helmrelease.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-infra-admin-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  infra-admin.yaml: |
    version: 1
    metadata:
      name: infra-admin per-app forward_single applications
      labels:
        blueprints.goauthentik.io/description: "Per-app forward_single applications for the talos-admin infra UIs"
    entries:
      # ========== CrowdSec ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-crowdsec
        identifiers: {name: crowdsec}
        attrs:
          name: crowdsec
          mode: forward_single
          external_host: https://crowdsec.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-crowdsec, identifiers: {slug: crowdsec}, attrs: {name: CrowdSec, slug: crowdsec, group: talos-admin, provider: !KeyOf p-crowdsec, meta_launch_url: https://crowdsec.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/crowdsec.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-crowdsec-own, identifiers: {target: !KeyOf a-crowdsec, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-crowdsec-ca, identifiers: {target: !KeyOf a-crowdsec, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== Goldilocks ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-goldilocks
        identifiers: {name: goldilocks}
        attrs:
          name: goldilocks
          mode: forward_single
          external_host: https://goldilocks.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-goldilocks, identifiers: {slug: goldilocks}, attrs: {name: Goldilocks, slug: goldilocks, group: talos-admin, provider: !KeyOf p-goldilocks, meta_launch_url: https://goldilocks.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/goldilocks.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-goldilocks-own, identifiers: {target: !KeyOf a-goldilocks, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-goldilocks-ca, identifiers: {target: !KeyOf a-goldilocks, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== Kube Ops View ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-kube-ops-view
        identifiers: {name: kube-ops-view}
        attrs:
          name: kube-ops-view
          mode: forward_single
          external_host: https://kube-ops-view.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-kube-ops-view, identifiers: {slug: kube-ops-view}, attrs: {name: Kube Ops View, slug: kube-ops-view, group: talos-admin, provider: !KeyOf p-kube-ops-view, meta_launch_url: https://kube-ops-view.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-kube-ops-view-own, identifiers: {target: !KeyOf a-kube-ops-view, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-kube-ops-view-ca, identifiers: {target: !KeyOf a-kube-ops-view, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== Hubble ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-hubble
        identifiers: {name: hubble}
        attrs:
          name: hubble
          mode: forward_single
          external_host: https://hubble.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-hubble, identifiers: {slug: hubble}, attrs: {name: Hubble, slug: hubble, group: talos-admin, provider: !KeyOf p-hubble, meta_launch_url: https://hubble.talos00, meta_icon: https://raw.githubusercontent.com/cilium/hubble/main/Documentation/images/hubble_logo.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-hubble-own, identifiers: {target: !KeyOf a-hubble, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-hubble-ca, identifiers: {target: !KeyOf a-hubble, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== DbGate ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-dbgate
        identifiers: {name: dbgate}
        attrs:
          name: dbgate
          mode: forward_single
          external_host: https://dbgate.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-dbgate, identifiers: {slug: dbgate}, attrs: {name: DbGate, slug: dbgate, group: talos-admin, provider: !KeyOf p-dbgate, meta_launch_url: https://dbgate.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/dbgate.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-dbgate-own, identifiers: {target: !KeyOf a-dbgate, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-dbgate-ca, identifiers: {target: !KeyOf a-dbgate, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== Plausible (dashboard only — public tracking route stays anonymous) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-plausible
        identifiers: {name: plausible}
        attrs:
          name: plausible
          mode: forward_single
          external_host: https://plausible.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-plausible, identifiers: {slug: plausible}, attrs: {name: Plausible, slug: plausible, group: talos-admin, provider: !KeyOf p-plausible, meta_launch_url: https://plausible.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/plausible-analytics.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-plausible-own, identifiers: {target: !KeyOf a-plausible, group: !Find [authentik_core.group, [name, talos-admin]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-plausible-ca, identifiers: {target: !KeyOf a-plausible, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}
