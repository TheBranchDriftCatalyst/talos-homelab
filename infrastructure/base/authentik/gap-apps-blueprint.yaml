---
# Authentik Blueprint: SSO-gap apps — per-app forward_single SSO (TALOS-xgrl.18).
#
# Domain: talos00 (bare, LAN-only). Apps that were previously reachable WITHOUT SSO and are
# now brought under Authentik forward-auth. Each becomes its OWN Application (forward_single)
# → its own launcher tile. Access = its group OR cluster-admin (two PolicyBindings,
# policy_engine_mode: any). forward_single apps route /outpost.goauthentik.io/* to
# authentik-server via the broadened HostRegexp route in authentik/ingressroute.yaml.
#
# This blueprint owns NO groups — every group is owned by a self-contained blueprint and
# referenced here via !Find (same pattern as sister-apps-blueprint.yaml):
#   · talos-home  — owned by home-blueprint.yaml            (Scrypted, sits with Frigate)
#   · talos-apps  — owned by talos-private-blueprint.yaml   (SecureXNG)
#   · cluster-admin — owned by talos-private-blueprint.yaml (superset, OR'd into every app)
#
# Each provider must ALSO be unioned into the embedded outpost — that list is authoritative
# in talos-private-blueprint.yaml (REPLACE-not-merge), so the !Find entries live THERE.
# Provider names == the app slug (scrypted, securexng).
#
# Mounted via chart-native blueprints.configMaps (helmrelease.yaml → authentik-gap-apps-blueprint).
# The operator must be a member of the relevant group (or cluster-admin, which is OR'd in).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-gap-apps-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  gap-apps.yaml: |
    version: 1
    metadata:
      name: SSO-gap apps per-app forward_single applications
      labels:
        blueprints.goauthentik.io/description: "forward_single applications for apps newly brought under Authentik SSO (scrypted/securexng)"
    entries:
      # ========== Scrypted (talos-home — NVR, sits with Frigate) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-scrypted
        identifiers: {name: scrypted}
        attrs:
          name: scrypted
          mode: forward_single
          external_host: https://scrypted.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-scrypted, identifiers: {slug: scrypted}, attrs: {name: Scrypted, slug: scrypted, group: talos-home, provider: !KeyOf p-scrypted, meta_launch_url: https://scrypted.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/scrypted.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-scrypted-own, identifiers: {target: !KeyOf a-scrypted, group: !Find [authentik_core.group, [name, talos-home]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-scrypted-ca, identifiers: {target: !KeyOf a-scrypted, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== SecureXNG (talos-apps — VPN-routed meta-search) ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-securexng
        identifiers: {name: securexng}
        attrs:
          name: securexng
          mode: forward_single
          external_host: https://securexng.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-securexng, identifiers: {slug: securexng}, attrs: {name: SecureXNG, slug: securexng, group: talos-apps, provider: !KeyOf p-securexng, meta_launch_url: https://securexng.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/searxng.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-securexng-own, identifiers: {target: !KeyOf a-securexng, group: !Find [authentik_core.group, [name, talos-apps]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-securexng-ca, identifiers: {target: !KeyOf a-securexng, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}
