---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: ">=2025.10.0 <2026.0.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Global settings
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: AUTHENTIK_POSTGRESQL__PASSWORD

    # Authentik server
    authentik:
      error_reporting:
        enabled: false
      postgresql:
        # Migrated off the bundled subchart to the CloudNativePG cluster
        # (authentik-postgres, TALOS-fijt). -rw = the read-write primary
        # endpoint. name/user unchanged; the password env below still reads the
        # SAME 1Password-backed value (Option B), so no credential change.
        host: authentik-postgres-rw
        name: authentik
        user: authentik
      redis:
        # Points at the Dragonfly cache `authentik-cache` (dragonfly.yaml,
        # TALOS-5aop). This chart value becomes AUTHENTIK_REDIS__HOST in the
        # server/worker env — it is the ONLY redis host knob (no separate env
        # override exists in this HelmRelease). Was `authentik-redis-master`,
        # the bundled subchart svc that the chart no longer renders. Port stays
        # the default 6379; the operator's svc is authentik-cache:6379.
        host: authentik-cache

    # Blueprint delivery via the chart-native mechanism (TALOS-xgrl.16).
    # The chart mounts each listed ConfigMap (all its keys) under
    # /blueprints/mounted/cm-<name>/ on the WORKER pod — the worker is the
    # component that imports/reconciles blueprints, so server mounting is not
    # needed (and the chart intentionally does NOT mount them on the server).
    # Authentik scans /blueprints/ recursively and applies every blueprint
    # found. There is NO label auto-discovery; ConfigMaps must be listed here
    # explicitly AND still exist as resources in kustomization.yaml.
    blueprints:
      configMaps:
        - authentik-litellm-blueprint
        - authentik-boomtime-blueprint
        - authentik-grafana-blueprint
        - authentik-zot-blueprint
        - authentik-forgejo-blueprint
        - authentik-minio-blueprint
        - authentik-linkwarden-blueprint
        - authentik-immich-blueprint
        - authentik-arr-stack-blueprint
        - authentik-infra-admin-blueprint
        - authentik-home-blueprint
        - authentik-media-experimental-blueprint
        - authentik-sister-apps-blueprint
        - authentik-media-oidc-blueprint
        - authentik-talos-private-blueprint
        - authentik-catalyst-brand-blueprint
        # Owned by the talos-private repo (ArgoCD creates the CM in ns authentik); mounted
        # here by name. Must exist BEFORE this line (mount is REQUIRED, not optional). TALOS-xgrl.14
        - authentik-media-blueprint

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      ingress:
        enabled: false  # We'll use Traefik IngressRoute
      # Mount custom CSS + catalyst brand SVG assets. Blueprints are NO LONGER
      # mounted here — they are delivered via the chart-native
      # `blueprints.configMaps` value above (TALOS-xgrl.16). Only non-blueprint
      # assets (custom CSS, brand SVGs served from /web/dist) remain manual.
      volumes:
        - name: custom-css
          configMap:
            name: authentik-custom-css
        - name: catalyst-brand-assets
          configMap:
            name: authentik-catalyst-brand-assets
      volumeMounts:
        - name: custom-css
          mountPath: /web/dist/custom.css
          subPath: custom.css
        - name: catalyst-brand-assets
          mountPath: /web/dist/catalyst-brand-logo.svg
          subPath: catalyst-brand-logo.svg
        - name: catalyst-brand-assets
          mountPath: /web/dist/catalyst-brand-favicon.svg
          subPath: catalyst-brand-favicon.svg

    worker:
      replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
      # LITELLM_OIDC_CLIENT_SECRET is referenced by the litellm-blueprint
      # via the !Env YAML tag. Sourced from the authentik-litellm-oidc
      # Secret (managed by the ExternalSecret of the same name).
      env:
        - name: LITELLM_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-litellm-oidc
              key: client-secret
        # !Env source for boomtime-blueprint.yaml's OAuth2Provider client_secret.
        # optional:true is DELIBERATE: it lets the worker start even before the
        # authentik-boomtime-oidc Secret exists (i.e. before the 1Password
        # `boomtime.oidc-client-secret` field is provisioned) — so shipping this
        # blueprint can NEVER CrashLoop the worker and take down existing SSO
        # (litellm/kelsboi). Until the secret is populated, the boomtime provider
        # is created with an empty client_secret (harmless — nothing points at it
        # yet). AFTER provisioning the 1P field: `kubectl rollout restart
        # deploy/authentik-worker -n authentik` so !Env re-evaluates and the
        # provider gets the real secret.
        - name: BOOMTIME_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-boomtime-oidc
              key: client-secret
              optional: true
        # !Env source for grafana-blueprint.yaml's OAuth2Provider client_secret.
        # optional:true (same rationale as boomtime): the worker starts even
        # before authentik-grafana-oidc exists, so shipping this blueprint can
        # never CrashLoop the worker and take down existing SSO. Until the
        # 1Password `grafana.oidc-client-secret` field is populated, the grafana
        # provider is created with an empty client_secret (harmless — Grafana
        # just won't complete the handshake yet). AFTER provisioning the field:
        # `kubectl rollout restart deploy/authentik-worker -n authentik`.
        - name: GRAFANA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-oidc
              key: client-secret
              optional: true
        # !Env source for zot-blueprint.yaml's OAuth2Provider client_secret.
        # optional:true (same rationale as grafana/boomtime) — the worker starts
        # even before authentik-zot-oidc exists, so shipping this blueprint can
        # never CrashLoop the worker. Restart authentik-worker after the
        # 1Password zot.oidc-client-secret field is populated. See TALOS-6vf.
        - name: ZOT_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-zot-oidc
              key: client-secret
              optional: true
        # !Env source for forgejo-blueprint.yaml (TALOS-6nf). optional:true.
        - name: FORGEJO_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-forgejo-oidc
              key: client-secret
              optional: true
        # !Env source for minio-blueprint.yaml (TALOS-475t). optional:true —
        # worker starts even before authentik-minio-oidc exists, so shipping
        # this blueprint can never CrashLoop the worker. Restart authentik-worker
        # after the 1Password minio.oidc-client-secret field is populated.
        - name: MINIO_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-minio-oidc
              key: client-secret
              optional: true
        # !Env sources for linkwarden-blueprint.yaml (TALOS-zuia). Linkwarden's
        # client_id is itself a secret, so BOTH id and secret are injected here.
        # optional:true (same rationale as minio) — the worker starts even before
        # authentik-linkwarden-oidc exists, so shipping this blueprint can never
        # CrashLoop the worker. Restart authentik-worker after the 1Password
        # linkwarden.authentik-client-id/-secret fields are populated so !Env
        # re-evaluates and the provider gets the real credentials.
        - name: LINKWARDEN_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: authentik-linkwarden-oidc
              key: client-id
              optional: true
        - name: LINKWARDEN_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-linkwarden-oidc
              key: client-secret
              optional: true
        # !Env source for immich-blueprint.yaml (native OIDC, TALOS-xgrl.14). optional:true —
        # worker starts even before authentik-immich-oidc exists (before the 1Password
        # immich.oidc-client-secret field is provisioned), so this blueprint can never
        # CrashLoop the worker. Restart authentik-worker after the 1Password field lands.
        - name: IMMICH_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-immich-oidc
              key: client-secret
              optional: true
        - name: AUDIOBOOKSHELF_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef: {name: authentik-audiobookshelf-oidc, key: client-secret, optional: true}
        - name: KOMGA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef: {name: authentik-komga-oidc, key: client-secret, optional: true}
        - name: KAVITA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef: {name: authentik-kavita-oidc, key: client-secret, optional: true}
      # Blueprints are delivered to the worker via the chart-native
      # `blueprints.configMaps` value above (TALOS-xgrl.16) — the chart mounts
      # them on the worker (the blueprint reconciler). No manual volumes/
      # volumeMounts needed here. The worker still consumes the
      # *_OIDC_CLIENT_SECRET env vars above (the !Env sources the blueprints
      # reference at reconcile time).

    # Embedded PostgreSQL — RETIRED (TALOS-fijt). Disabled in favor of the
    # CloudNativePG cluster `authentik-postgres` (see postgres.yaml). Setting
    # enabled:false makes Helm remove the bundled `authentik-postgresql`
    # StatefulSet on upgrade; its PVC `data-authentik-postgresql-0` is a
    # volumeClaimTemplate PVC and is RETAINED (not deleted) — that's the
    # rollback net. Redis below is a SEPARATE subchart and is untouched. The
    # auth block is kept (inert while disabled) purely to document prior state.
    postgresql:
      enabled: false
      auth:
        database: authentik
        username: authentik
        existingSecret: authentik-secrets
        secretKeys:
          adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
          userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
      primary:
        # Tolerate control-plane taint - local-path PV is bound to talos00
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # Velero opt-in fs-backup for the postgres data volume
        podAnnotations:
          backup.velero.io/backup-volumes: data
        persistence:
          enabled: true
          size: 8Gi
          storageClass: local-path
        resources:
          requests:
            cpu: 50m
            memory: 128Mi

    # Embedded Redis — RETIRED (TALOS-5aop). Migrated to the Dragonfly cache
    # `authentik-cache` (dragonfly.yaml); authentik.redis.host above points there.
    # As of chart 2025.12.x this bundled `redis` subchart no longer renders ANY
    # resources anyway (no pod/svc created), so authentik-redis-master never
    # existed and authentik silently ran on its local cache. Setting enabled:false
    # makes the intent explicit — stop declaring the dead subchart. The remaining
    # keys are inert while disabled; kept purely to document prior state.
    redis:
      enabled: false
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          size: 2Gi
          storageClass: local-path
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
