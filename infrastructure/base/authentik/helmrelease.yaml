---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: ">=2025.10.0 <2026.0.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Global settings
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: AUTHENTIK_POSTGRESQL__PASSWORD

    # Authentik server
    authentik:
      error_reporting:
        enabled: false
      postgresql:
        host: authentik-postgresql
        name: authentik
        user: authentik
      redis:
        host: authentik-redis-master

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      ingress:
        enabled: false  # We'll use Traefik IngressRoute
      # Mount custom CSS and blueprints.
      #
      # Brands split across two repos:
      #   - catalyst-* ConfigMaps owned by this repo (talos-homelab / Flux).
      #   - kelsboi-*  ConfigMaps owned by talos-private (ArgoCD-synced); we
      #     reference them with optional: true so the pod still starts if
      #     Argo hasn't created them yet.
      volumes:
        - name: custom-css
          configMap:
            name: authentik-custom-css
        - name: litellm-blueprint
          configMap:
            name: authentik-litellm-blueprint
        - name: boomtime-blueprint
          configMap:
            name: authentik-boomtime-blueprint
        - name: grafana-blueprint
          configMap:
            name: authentik-grafana-blueprint
        - name: talos-private-blueprint
          configMap:
            name: authentik-talos-private-blueprint
        - name: catalyst-brand-assets
          configMap:
            name: authentik-catalyst-brand-assets
        - name: catalyst-brand-blueprint
          configMap:
            name: authentik-catalyst-brand-blueprint
        - name: kelsboi-brand-assets
          configMap:
            name: authentik-kelsboi-brand-assets
            optional: true
        - name: kelsboi-brand-blueprint
          configMap:
            name: authentik-kelsboi-brand-blueprint
            optional: true
      volumeMounts:
        - name: custom-css
          mountPath: /web/dist/custom.css
          subPath: custom.css
        - name: litellm-blueprint
          mountPath: /blueprints/custom/litellm-role-mapping.yaml
          subPath: litellm-role-mapping.yaml
        - name: boomtime-blueprint
          mountPath: /blueprints/custom/boomtime-oidc.yaml
          subPath: boomtime-oidc.yaml
        - name: grafana-blueprint
          mountPath: /blueprints/custom/grafana-oidc.yaml
          subPath: grafana-oidc.yaml
        - name: talos-private-blueprint
          mountPath: /blueprints/custom/talos-private.yaml
          subPath: talos-private.yaml
        - name: catalyst-brand-assets
          mountPath: /web/dist/catalyst-brand-logo.svg
          subPath: catalyst-brand-logo.svg
        - name: catalyst-brand-assets
          mountPath: /web/dist/catalyst-brand-favicon.svg
          subPath: catalyst-brand-favicon.svg
        - name: catalyst-brand-blueprint
          mountPath: /blueprints/custom/catalyst-brand.yaml
          subPath: catalyst-brand.yaml
        - name: kelsboi-brand-assets
          mountPath: /web/dist/kelsboi-brand-logo.svg
          subPath: kelsboi-brand-logo.svg
        - name: kelsboi-brand-assets
          mountPath: /web/dist/kelsboi-brand-favicon.svg
          subPath: kelsboi-brand-favicon.svg
        - name: kelsboi-brand-blueprint
          mountPath: /blueprints/custom/kelsboi-brand.yaml
          subPath: kelsboi-brand.yaml

    worker:
      replicas: 1
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
      # LITELLM_OIDC_CLIENT_SECRET is referenced by the litellm-blueprint
      # via the !Env YAML tag. Sourced from the authentik-litellm-oidc
      # Secret (managed by the ExternalSecret of the same name).
      env:
        - name: LITELLM_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-litellm-oidc
              key: client-secret
        # !Env source for boomtime-blueprint.yaml's OAuth2Provider client_secret.
        # optional:true is DELIBERATE: it lets the worker start even before the
        # authentik-boomtime-oidc Secret exists (i.e. before the 1Password
        # `boomtime.oidc-client-secret` field is provisioned) — so shipping this
        # blueprint can NEVER CrashLoop the worker and take down existing SSO
        # (litellm/kelsboi). Until the secret is populated, the boomtime provider
        # is created with an empty client_secret (harmless — nothing points at it
        # yet). AFTER provisioning the 1P field: `kubectl rollout restart
        # deploy/authentik-worker -n authentik` so !Env re-evaluates and the
        # provider gets the real secret.
        - name: BOOMTIME_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-boomtime-oidc
              key: client-secret
              optional: true
        # !Env source for grafana-blueprint.yaml's OAuth2Provider client_secret.
        # optional:true (same rationale as boomtime): the worker starts even
        # before authentik-grafana-oidc exists, so shipping this blueprint can
        # never CrashLoop the worker and take down existing SSO. Until the
        # 1Password `grafana.oidc-client-secret` field is populated, the grafana
        # provider is created with an empty client_secret (harmless — Grafana
        # just won't complete the handshake yet). AFTER provisioning the field:
        # `kubectl rollout restart deploy/authentik-worker -n authentik`.
        - name: GRAFANA_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-grafana-oidc
              key: client-secret
              optional: true
      # Worker needs blueprints for processing
      volumes:
        - name: litellm-blueprint
          configMap:
            name: authentik-litellm-blueprint
        - name: boomtime-blueprint
          configMap:
            name: authentik-boomtime-blueprint
        - name: grafana-blueprint
          configMap:
            name: authentik-grafana-blueprint
        - name: talos-private-blueprint
          configMap:
            name: authentik-talos-private-blueprint
        - name: catalyst-brand-blueprint
          configMap:
            name: authentik-catalyst-brand-blueprint
        - name: kelsboi-brand-blueprint
          configMap:
            name: authentik-kelsboi-brand-blueprint
            optional: true
      volumeMounts:
        - name: litellm-blueprint
          mountPath: /blueprints/custom/litellm-role-mapping.yaml
          subPath: litellm-role-mapping.yaml
        - name: boomtime-blueprint
          mountPath: /blueprints/custom/boomtime-oidc.yaml
          subPath: boomtime-oidc.yaml
        - name: grafana-blueprint
          mountPath: /blueprints/custom/grafana-oidc.yaml
          subPath: grafana-oidc.yaml
        - name: talos-private-blueprint
          mountPath: /blueprints/custom/talos-private.yaml
          subPath: talos-private.yaml
        - name: catalyst-brand-blueprint
          mountPath: /blueprints/custom/catalyst-brand.yaml
          subPath: catalyst-brand.yaml
        - name: kelsboi-brand-blueprint
          mountPath: /blueprints/custom/kelsboi-brand.yaml
          subPath: kelsboi-brand.yaml

    # Embedded PostgreSQL
    postgresql:
      enabled: true
      auth:
        database: authentik
        username: authentik
        existingSecret: authentik-secrets
        secretKeys:
          adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
          userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
      primary:
        # Tolerate control-plane taint - local-path PV is bound to talos00
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        # Velero opt-in fs-backup for the postgres data volume
        podAnnotations:
          backup.velero.io/backup-volumes: data
        persistence:
          enabled: true
          size: 8Gi
          storageClass: local-path
        resources:
          requests:
            cpu: 50m
            memory: 128Mi

    # Embedded Redis
    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          size: 2Gi
          storageClass: local-path
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
