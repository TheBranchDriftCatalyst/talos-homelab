---
# Native OIDC for the LAN-only Manyfold instance in the openscad namespace.
# The client secret is injected into authentik-worker from 1Password through
# authentik-manyfold-oidc; the same field is consumed by Manyfold's
# manyfold-secrets ExternalSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-manyfold-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  manyfold-oidc.yaml: |
    version: 1
    metadata:
      name: Manyfold OIDC SSO
      labels:
        blueprints.goauthentik.io/description: "Manyfold native OIDC SSO"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: manyfold-oauth2-provider
        identifiers:
          name: manyfold
        attrs:
          name: manyfold
          client_type: confidential
          client_id: manyfold
          client_secret: !Env MANYFOLD_OIDC_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          redirect_uris:
            - matching_mode: strict
              url: https://manyfold.talos00/users/auth/openid_connect/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

      - model: authentik_core.application
        id: manyfold-application
        identifiers:
          slug: manyfold
        attrs:
          name: Manyfold
          slug: manyfold
          provider: !KeyOf manyfold-oauth2-provider
          meta_launch_url: https://manyfold.talos00
          meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/manyfold.png
          meta_description: "Manyfold - self-hosted 3D model library"
          meta_publisher: "Catalyst Homelab"
          open_in_new_tab: false
          policy_engine_mode: any
          group: talos-apps

      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, manyfold]], group: !Find [authentik_core.group, [name, talos-apps]], order: 0}
        attrs: {enabled: true}
      - model: authentik_policies.policybinding
        identifiers: {target: !Find [authentik_core.application, [slug, manyfold]], group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}
        attrs: {enabled: true}
