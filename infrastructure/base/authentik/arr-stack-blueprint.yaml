---
# Authentik Blueprint: arr-stack media apps — per-app forward_single SSO (TALOS-xgrl.14).
#
# Domain: talos00 (bare, LAN-only). Each arr-stack app (sonarr/radarr/... ) becomes its
# OWN Application (forward_single) → its own launcher tile in the `talos-media` section.
# Access = the `talos-media` group OR `cluster-admin` (two PolicyBindings, policy_engine_mode:
# any). forward_single apps route /outpost.goauthentik.io/* to authentik-server via the
# broadened HostRegexp route in authentik/ingressroute.yaml (now covers bare *.talos00).
#
# The `talos-media` group is defined ONCE here (this blueprint owns it). `cluster-admin`
# is owned by talos-private-blueprint.yaml → referenced via !Find (cross-blueprint).
#
# Each provider is also unioned into the embedded outpost — that list is authoritative
# in talos-private-blueprint.yaml (REPLACE-not-merge), so the !Find entries live there.
#
# Mounted via chart-native blueprints.configMaps (helmrelease.yaml) as
# /blueprints/mounted/cm-authentik-arr-stack-blueprint/arr-stack.yaml on the worker.
# NOTE: the operator must add themselves to the `talos-media` group in the Authentik UI
# (or rely on cluster-admin membership, which is OR'd in).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-arr-stack-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  arr-stack.yaml: |
    version: 1
    metadata:
      name: arr-stack media SSO per-app applications
      labels:
        blueprints.goauthentik.io/description: "talos-media access group + per-app forward_single applications for the arr-stack"
    entries:
      # ---------- Access group owned by this blueprint ----------
      - {model: authentik_core.group, id: g-talos-media, identifiers: {name: talos-media}, attrs: {attributes: {description: "arr-stack media apps (sonarr/radarr/prowlarr/... )."}}}

      # ========== Sonarr ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-sonarr
        identifiers: {name: sonarr}
        attrs:
          name: sonarr
          mode: forward_single
          external_host: https://sonarr.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-sonarr, identifiers: {slug: sonarr}, attrs: {name: Sonarr, slug: sonarr, group: talos-media, provider: !KeyOf p-sonarr, meta_launch_url: https://sonarr.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/sonarr.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-sonarr-own, identifiers: {target: !KeyOf a-sonarr, group: !KeyOf g-talos-media, order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-sonarr-ca, identifiers: {target: !KeyOf a-sonarr, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

      # ========== Radarr ==========
