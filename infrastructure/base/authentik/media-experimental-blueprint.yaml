---
# Authentik Blueprint: media-experimental + tdarr/metube/tubesync — per-app
# forward_single SSO (TALOS-xgrl.14).
#
# Domain: talos00 (bare, LAN-only). Each app becomes its OWN Application
# (forward_single) → its own launcher tile in the `talos-media` section. Access =
# the `talos-media` group OR `cluster-admin` (two PolicyBindings, policy_engine_mode:
# any). forward_single apps route /outpost.goauthentik.io/* to authentik-server via
# the shared HostRegexp route in authentik/ingressroute.yaml (covers bare *.talos00).
#
# The `talos-media` group is defined ONCE in arr-stack-blueprint.yaml (that blueprint
# owns it) → referenced here via !Find (cross-blueprint). `cluster-admin` is owned by
# talos-private-blueprint.yaml → also !Find.
#
# Each provider must ALSO be unioned into the embedded outpost — that list is
# authoritative in talos-private-blueprint.yaml (REPLACE-not-merge), so the !Find
# entries for these 11 providers must be added there (see task report).
#
# Mounted via chart-native blueprints.configMaps (helmrelease.yaml) — add
# `authentik-media-experimental-blueprint` to that list and to
# authentik/kustomization.yaml resources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-media-experimental-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
data:
  media-experimental.yaml: |
    version: 1
    metadata:
      name: media-experimental per-app forward_single applications
      labels:
        blueprints.goauthentik.io/description: "per-app forward_single applications for the media-experimental stack + tdarr/metube/tubesync (talos-media group)"
    entries:
      # ========== Booksonic ==========
      - model: authentik_providers_proxy.proxyprovider
        id: p-booksonic
        identifiers: {name: booksonic}
        attrs:
          name: booksonic
          mode: forward_single
          external_host: https://booksonic.talos00
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_core.propertymapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
      - {model: authentik_core.application, id: a-booksonic, identifiers: {slug: booksonic}, attrs: {name: Booksonic, slug: booksonic, group: talos-media, provider: !KeyOf p-booksonic, meta_launch_url: https://booksonic.talos00, meta_icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/booksonic.png, policy_engine_mode: any}}
      - {model: authentik_policies.policybinding, id: b-booksonic-own, identifiers: {target: !KeyOf a-booksonic, group: !Find [authentik_core.group, [name, talos-media]], order: 0}, attrs: {enabled: true}}
      - {model: authentik_policies.policybinding, id: b-booksonic-ca, identifiers: {target: !KeyOf a-booksonic, group: !Find [authentik_core.group, [name, cluster-admin]], order: 1}, attrs: {enabled: true}}

