---
# Cost backstop for the red-team vantage: deletes any XInstance labelled
# part-of=aws-redteam older than 2h. This is NOT the primary teardown (that is
# git-off, which Flux prunes) — it exists so a box left "on" in git cannot burn
# money indefinitely. Modeled on infrastructure/base/gpu-inference reaper.
#
# NOTE the Flux-vs-reaper tension (gpu-inference doc): if the claim is still the
# "on" file, deleting the XR here just makes Flux re-create it next reconcile.
# So the reaper only truly reaps once the claim is commented out; while on, it
# caps a single box's age. Belt, not braces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redteam-reaper
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redteam-reaper
rules:
  - apiGroups: ["aws.catalyst.io"]
    resources: ["xinstances"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redteam-reaper
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: redteam-reaper}
subjects:
  - {kind: ServiceAccount, name: redteam-reaper, namespace: crossplane-system}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redteam-reaper
  namespace: crossplane-system
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: redteam-reaper
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532}
          containers:
            - name: reaper
              image: alpine/k8s:1.34.9
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # CRD may be absent when the AWS chain is off — exit clean.
                  # Guard on the RESOURCE (SA has xinstances list), NOT the CRD object — the SA has no
                  # customresourcedefinitions RBAC, so `kubectl get crd` always failed silently and the
                  # reaper NEVER reaped (the cost backstop was dead). CRD absent => this errors => exit 0.
                  kubectl get xinstance >/dev/null 2>&1 || { echo "no XInstance CRD / no access; nothing to reap"; exit 0; }
                  NOW=$(date +%s); MAX=7200
                  R=$(mktemp)  # tally reaped names across the pipe subshell (count survives in the file)
                  kubectl get xinstance -l app.kubernetes.io/part-of=aws-redteam \
                    -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.creationTimestamp}{"\n"}{end}' | while read -r name ts; do
                    [ -z "$name" ] && continue
                    age=$(( NOW - $(date -d "$ts" +%s) ))
                    if [ "$age" -gt "$MAX" ]; then echo "reaping $name (age ${age}s > ${MAX}s)"; kubectl delete xinstance "$name" && echo 1 >> "$R"; fi
                  done
                  N=$(wc -l < "$R" 2>/dev/null | tr -d " "); rm -f "$R"; N=${N:-0}
                  echo "reaper done (reaped ${N})"
                  # reaper activity -> pushgateway (dashboard-aws-inventory reaper row); || true so a metrics blip never fails the reaper
                  printf 'reaper_last_run_timestamp_seconds %s\nreaper_last_reaped_count %s\n' "$(date +%s)" "${N}" | curl -s --max-time 10 --data-binary @- http://prometheus-pushgateway.monitoring:9091/metrics/job/redteam-reaper || true
