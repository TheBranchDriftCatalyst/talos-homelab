---
# ██ AUTONOMOUS red-team vantage ██ — OFF by default (commented out of
# kustomization.yaml). Flip on = git-commit; flip off = comment + commit (Flux
# prunes). See README.md.
#
# A genuine off-net EC2 box that, on boot, runs the framework's external probe
# battery against the home WAN origin, writes the summary to the SERIAL CONSOLE
# (retrievable via 'aws ec2 get-console-output' — no inbound, no key, no SSM),
# then halts. This is the "deferred true-cold pass" the 2026-09-09 engagement
# could not do from the NAT-hairpinned VPN.
#
# Zero composition change: uses XInstance as-is with openPort:0 (no ingress).
# Values below are from the read-only preflight (redteam-preflight Job), region
# us-west-2: default VPC vpc-3536d651, public subnet subnet-36191741,
# AL2023 x86_64 AMI ami-075d448db8fb256af (dnf; curl/dig/jq installable).
#
# userData embeds infrastructure/base/aws-redteam/probe.sh VERBATIM (base64).
# Keep them identical — probe.sh is the canonical source.
apiVersion: aws.catalyst.io/v1alpha1
kind: XInstance
metadata:
  name: redteam-vantage
  labels:
    app.kubernetes.io/part-of: aws-redteam
    catalyst.io/stage: redteam
spec:
  instanceName: redteam-vantage
  instanceType: t3.micro
  ami: ami-075d448db8fb256af
  region: us-west-2
  vpcId: vpc-3536d651
  subnetId: subnet-36191741
  rootVolumeGb: 8
  openPort: 0            # NO inbound — probes dial OUT; results via serial console
  userData: |
    #!/bin/bash
    exec > >(tee /dev/console) 2>&1
    echo "=== CATALYST-REDTEAM cloud-init start $(date -u +%FT%TZ) ==="
    dnf install -y bind-utils jq >/dev/null 2>&1 || yum install -y bind-utils jq >/dev/null 2>&1
    echo "" | base64 -d > /root/probe.sh
    chmod +x /root/probe.sh
    echo "=== CATALYST-REDTEAM PROBE BEGIN ==="
    /root/probe.sh
    echo "=== CATALYST-REDTEAM PROBE END ==="
    # Cost backstop: halt in 20 min regardless. Primary teardown is git-off; the
    # reaper CronJob is the cluster backstop. A halted EBS box is retrievable via
    # get-console-output and cheap; delete the claim to terminate.
    shutdown -h +20
