---
# RBAC for provider-kubernetes's InjectedIdentity to manage the kind THIS composition
# renders. Crossplane grants provider-kubernetes broad rights over core kinds but NOT
# arbitrary CRDs, so without this every composed Object sits in ReconcileError:
#   observe failed: ingressroutes.traefik.io ... is forbidden: User
#   "system:serviceaccount:crossplane-system:provider-kubernetes" cannot get ...
#
# Shipped here rather than relying on catalyst-websecure-ingress's identical grant.
# ClusterRoles are additive, so the overlap costs nothing, and it keeps this directory
# independently deployable instead of silently depending on a sibling Kustomization that
# someone could narrow or retire.
#
# The ClusterProviderConfig `default` for the namespaced group is defined by
# catalyst-cnpg-appdb/provider-wiring.yaml — only RBAC is added here.
#
# Scoped to exactly the one kind this composition manages, and deliberately NOT a blanket
# grant on traefik.io: provider-kubernetes applies any manifest it is handed, so a wide
# grant is effectively a wide grant to anyone who can write a Composition. Notably this
# does NOT grant `middlewares` — this composite must never mint a Traefik Middleware, and
# the RBAC says so as well as the comments do.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane:provider-kubernetes:injected-applet
  labels:
    app.kubernetes.io/part-of: crossplane
rules:
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane:provider-kubernetes:injected-applet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane:provider-kubernetes:injected-applet
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
