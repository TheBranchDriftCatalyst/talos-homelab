---
# Dragonfly (Redis-compatible) cache for Argo CD.
# Replaces the argo-cd chart's bundled `redis:8.x-alpine` Deployment (redis.enabled: false).
# Provisioned by the dragonfly-operator (Dragonfly CRD, dragonflydb.io/v1alpha1).
#
# CACHE-ONLY / EPHEMERAL: Argo CD uses redis purely as a rebuildable cache (repo/manifest
# cache + app state). No snapshot PVC — a restart just drops the cache and Argo repopulates
# it on the next reconcile. Cutover therefore needs no data migration.
#
# AUTH — intentionally NO password (see helmrelease.yaml externalRedis wiring):
#   * Argo reaches this only in-cluster via ClusterIP; no external exposure.
#   * The argo-cd chart's externalRedis path reads REDIS_PASSWORD from key `redis-password`
#     with optional:true. With no password configured, Argo sends no AUTH and connects
#     cleanly to this no-auth Dragonfly.
#   * The pre-existing `argocd-redis` Secret (key `auth`) is IGNORED in externalRedis mode
#     (that path reads a different key, `redis-password`), so no auth handshake to reconcile.
#
# SERVICE: the operator creates `svc/argocd-dragonfly:6379` (named after this CR). This does
# NOT collide with the bundled `svc/argocd-redis` (which is removed at cutover).
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: argocd-dragonfly
  namespace: argocd
spec:
  replicas: 1
  # Pin the image to the known-good version run by the boomtime-cache reference consumer,
  # on the operator's own registry. (prefer-latest: bump alongside the operator.)
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
  # Dragonfly sizes itself to the HOST thread count (~16 here) and would demand ~256Mi/thread
  # → OOM-exits under a small limit. Pin 1 proactor thread + an explicit maxmemory so it fits
  # the cache footprint. (Canonical knobs — see applications/crossplane-demo/dragonfly.yaml,
  # TALOS-ja5. Dragonfly needs ~256Mi/thread or OOMs; this pins ~512Mi.)
  args:
    - "--proactor_threads=1" # 256Mi/thread floor → fits the 512Mi limit
    - "--maxmemory=256mb"
    # Prometheus /metrics: the operator defaults to --primary_port_http_enabled=false (RESP-only
    # on 6379), which DISABLES the /metrics endpoint → nothing to scrape. Re-enable HTTP on the
    # main port; it coexists with RESP (Argo's redis client is unaffected, verified PING→PONG),
    # and the dragonfly-instances PodMonitor scrapes :6379/metrics. REQUIRED for the Dragonfly
    # Grafana dashboard to populate — apply the same flag to every Dragonfly CR. (TALOS-0tbh)
    - "--primary_port_http_enabled=true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
