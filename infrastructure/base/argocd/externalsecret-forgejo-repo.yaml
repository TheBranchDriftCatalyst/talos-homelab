---
# ArgoCD repository credentials for the in-cluster Forgejo forge.
#
# WHY THIS IS NOT LIKE externalsecret-private-repo.yaml NEXT DOOR: that one is
# an SSH key, scoped to `git@github.com:TheBranchDriftCatalyst`. The same shape
# cannot be reused here, because Forgejo has NO SSH ROUTE — its IngressRoute
# publishes port 3000 over HTTP/HTTPS and nothing else, and no SSH server is
# configured on the pod. (Forgejo's UI still offers an
# `ssh://git@localhost/...` clone URL. That is its unconfigured default, not a
# working endpoint; nothing listens on it.) So this is HTTPS with a token.
#
# THE URL IS THE IN-CLUSTER SERVICE, not forge.knowledgedump.space. ArgoCD runs
# three metres away from Forgejo inside the same cluster; routing its polling
# out through Traefik, external-dns, a public DNS record and back in again
# would make application sync depend on the entire ingress path being healthy —
# and on the homelab's WAN. The `info` links on the Application still point at
# the public URL, because those are for humans with browsers.
#
# `repo-creds` (not `repository`) so this covers every repo under /panda
# without one secret per app. fchat-bouncer is the first; it will not be the
# last.
#
# REQUIRES 1Password item `forgejo` with property `argocd-repo-token` — a
# Forgejo access token with at least read:repository, issued to `panda`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: forgejo-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      type: Opaque
      data:
        type: git
        url: http://forgejo.forgejo.svc.cluster.local:3000/panda
        username: panda
        # A token, used in the password field. Forgejo accepts an access token
        # wherever it accepts a password for git-over-HTTP.
        password: '{{ .repoToken }}'

  data:
    - secretKey: repoToken
      remoteRef:
        key: forgejo
        property: argocd-repo-token
