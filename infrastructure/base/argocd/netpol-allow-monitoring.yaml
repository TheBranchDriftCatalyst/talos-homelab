---
# Additive NetworkPolicy: allow the monitoring namespace to scrape argocd's repo-server
# metrics. The argocd chart's rendered NetworkPolicies restrict ingress to argocd-internal
# peers only, which black-holed the monitoring exporters (alloy) every ~1s. k8s unions all
# NetworkPolicies selecting a pod, so this purely OPENS the scrape path without touching the
# chart-managed policies. (TALOS-xgrl.10)
#
# The companion allow-monitoring-to-dragonfly policy that used to live here was removed —
# infrastructure/base/kyverno-policies/dragonfly-allow-monitoring.yaml now GENERATES an
# identical allow-monitoring-to-<name> NetworkPolicy for every Dragonfly CR in the cluster
# (here: allow-monitoring-to-argocd-dragonfly). repo-server is NOT a Dragonfly, so it has no
# generated counterpart and must stay hand-written here. (TALOS-a38d.9)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-repo-server
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 8081}
