---
# Additive NetworkPolicies: allow the monitoring namespace to scrape argocd's
# Dragonfly (redis) and repo-server metrics. The argocd/dragonfly-rendered
# NetworkPolicies restrict ingress to argocd-internal peers only, which black-holed
# the monitoring exporters (redis-exporter-argocd-dragonfly, alloy) every ~1s.
# k8s unions all NetworkPolicies selecting a pod, so these purely OPEN the two
# scrape paths without touching the chart/operator-managed policies. (TALOS-xgrl.10)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-dragonfly
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app: argocd-dragonfly
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-repo-server
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 8081}
