---
# SEV-2 (TALOS-xgrl.7): was plain-HTTP `web` only — ArgoCD login + session tokens
# transited the LAN in cleartext. Now HTTPS (Traefik terminates TLS; argocd-server
# runs --insecure) + web→HTTPS redirect. No forward-auth: ArgoCD authenticates its
# own UI/API/CLI (adding Authentik here would double-auth and break the CLI/API).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "ArgoCD"
    gethomepage.dev/description: "GitOps Continuous Delivery"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "argocd.png"
    gethomepage.dev/siteMonitor: "http://argocd-server.argocd.svc.cluster.local"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.talos00`)
      kind: Rule
      # lan-only, added 2026-09-26 after an EXTERNAL true-cold pentest (AWS EC2,
      # egress 34.222.37.226) reached this UI 200 by sending `Host: argocd.talos00`
      # to https://108.64.138.156/ -- the confirmed P0 core of the TALOS-a8vo.4
      # host-spoof class. .talos00 is a naming convention, not a boundary: Traefik
      # routes on the Host header regardless of entrypoint and :443 is WAN-forwarded.
      # Targeted fix so the P0 does not wait on the full entrypoint-default inversion.
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: argocd-server
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-http
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argocd.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: argocd-server
          port: 80
