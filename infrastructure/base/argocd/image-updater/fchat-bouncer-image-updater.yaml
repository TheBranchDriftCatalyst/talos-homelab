---
# Auto-rolls the fchat-bouncer Deployment when a new image tag appears in ZOT.
#
# Unlike every other ImageUpdater CR here, this one watches the in-cluster
# registry rather than GHCR — see the Zot entry added to registries.conf in
# configmap-patch.yaml. It is published to by Forgejo Actions, in this cluster,
# from a Forgejo repo. Nothing in this app's chain is off-site.
#
# The tag list is intentionally narrow — we want deterministic writes:
#   - `latest`     ← pushed only on default-branch (main) pushes
#   - `main`       ← docker-publish workflow branch tag
#   - `sha-<7c>`   ← immutable per-commit ref (drives per-commit auto-deploy)
#
# WHAT IT ACTUALLY WRITES. This used to claim the updater "rewrites the pinned
# tag in the overlay's `images:` block, so k8s/talos00/kustomization.yaml gets
# updated in git". It does not, and believing that sends you looking for a
# commit that is never coming. `writeBackConfig.method: argocd` patches
# spec.source.kustomize.images on the ArgoCD Application object — a live
# override that does not touch the repo. The tag committed in the overlay is a
# starting hint and stays behind on purpose; `argocd app get fchat-bouncer` is
# where the deployed tag is true.
#
# NOTE: the app's Deployment is replicas:1 / strategy:Recreate on purpose (it
# holds a single live F-Chat login). An image update is therefore a brief
# outage, not a rolling swap — by design, since two pods would log the same
# character in twice and kick each other in a loop.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: fchat-bouncer
  namespace: argocd
  # DECLARED, because the controller cannot add it itself.
  #
  # argocd-image-updater v1.2.2 fails its own finalizer-add with
  # "ImageUpdater ... is invalid: [spec.namespace: Required value]" — on an
  # object that plainly has spec.namespace. Whatever it sends loses the spec,
  # and the reconcile then aborts before any registry work happens, so the CR
  # sits with no status and drops out of the reconcile set entirely.
  #
  # The other three ImageUpdaters here do not hit it: they were created in May
  # and July, already carry the finalizer, and so never take the add path. This
  # one was created after the controller was upgraded and is the only CR that
  # exercises it.
  #
  # Adding it by hand works and then Flux prunes it straight back, because it
  # was not in git. So it is in git. Remove this once the upstream add path is
  # fixed; keeping it costs nothing but a line.
  finalizers:
    - resources-finalizer.argocd-image-updater.argoproj.io
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: newest-build
    allowTags: "regexp:^(latest|main|sha-[a-f0-9]{7,40})$"
    # Zot DOES need a credential, despite defaultPolicy ["read"]. That policy
    # covers repositories; the updater's first call is the /v2/ base endpoint,
    # which challenges anyway — measured 401 from inside the cluster. Dropping
    # this on the strength of that policy is exactly why no tag was ever seen.
    pullSecret: pullsecret:argocd-image-updater-system/zot-secret
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: fchat-bouncer
      images:
        - alias: fchat-bouncer
          # This name must match THREE places or the updater no-ops in silence:
          # here, the `images:` key in the app's k8s/talos00/kustomization.yaml,
          # and the image in k8s/base/deployment.yaml.
          imageName: registry.talos00/talos00-registry/fchat-bouncer
          manifestTargets:
            kustomize:
              name: registry.talos00/talos00-registry/fchat-bouncer
