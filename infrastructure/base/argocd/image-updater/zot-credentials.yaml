---
# Registry credentials for the image updater, so it can read Zot.
#
# WHY IT NEEDS ANY. Zot's accessControl sets defaultPolicy ["read"], which
# covers repositories and reads like "anonymous is fine" — it is not enough.
# The updater's first call is the registry base endpoint, /v2/, and that
# challenges even when repository reads would not: measured 401 from inside the
# cluster. An earlier version of this setup dropped the pullSecret on the
# strength of that defaultPolicy and the updater simply never saw a tag.
#
# Both hostnames are present because they are one registry reached three ways
# and a docker config matches on the exact host string: the in-cluster Service
# (what this controller dials), registry.talos00 (what the manifests name, and
# what the kubelet pulls), and the public host (what CI pushes to).
#
# Same 1Password item every other Zot consumer uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
  namespace: argocd-image-updater-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zot-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{
            "zot.registry.svc.cluster.local:5000":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"},
            "registry.talos00":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"},
            "registry.knowledgedump.space":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}
          }}
  data:
    - secretKey: username
      remoteRef: { key: nexus-admin, property: username }
    - secretKey: password
      remoteRef: { key: nexus-admin, property: password }
