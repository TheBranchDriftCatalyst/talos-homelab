apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openscad
  namespace: argocd
  labels:
    app.kubernetes.io/name: openscad
    app.kubernetes.io/part-of: catalyst
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: GitHub Repository
      value: https://github.com/TheBranchDriftCatalyst/openscad
    - name: Application
      value: https://manyfold.talos00
  source:
    repoURL: https://github.com/TheBranchDriftCatalyst/openscad.git
    targetRevision: main
    path: k8s/overlays/talos00
  destination:
    server: https://kubernetes.default.svc
    namespace: openscad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
    - group: postgresql.cnpg.io
      kind: Cluster
      managedFieldsManagers:
        - manager
