apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD Application manifests
# These are auto-applied by Flux when pushed to main
# ArgoCD then watches the target repos and auto-syncs
resources:
  - catalyst-ui.yaml
  - catalyst-llm.yaml
  - arr-stack-private.yaml
  # immich-video-faces.yaml REMOVED 2026-08-14 — source repo deleted from GitHub, app was orphaned with zero tracked resources
  - kasa-exporter.yaml
  - catalyst-data.yaml
  - dungeon-library.yaml
  - boomtime.yaml
  - openscad.yaml
  - fchat-bouncer.yaml
  - logairr.yaml
  # hot-ones — extracted out of arr-stack-private into its own app, still
  # deploying into media-private (TALOS-6j4p). Source is the hot-ones repo at
  # k8s/cluster; prune is OFF on both this and arr-stack-private until the
  # cutover closes (TALOS-xr14).
  - hot-ones.yaml
  # scene-engine — extracted out of arr-stack-private into its own app, still
  # deploying into media-private (TALOS-cmer). Source is the Forgejo repo
  # panda/scene-engine at k8s/cluster, reusing the forgejo-repo-creds prefix
  # credential. prune is OFF on this app and must also be OFF in git on
  # arr-stack-private until the cutover closes — the resources being adopted
  # include the scene-engine-postgres CNPG database.
  - scene-engine.yaml
