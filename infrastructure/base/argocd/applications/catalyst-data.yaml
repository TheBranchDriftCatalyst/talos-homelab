apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalyst-data
  namespace: argocd
  labels:
    app.kubernetes.io/name: catalyst-data
    app.kubernetes.io/part-of: catalyst
  # Image update config lives in the ImageUpdater CRD at
  # infrastructure/base/argocd/image-updater/catalyst-data-image-updater.yaml
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: GitHub Repository
      value: https://github.com/TheBranchDriftCatalyst/catalyst-data
  source:
    repoURL: https://github.com/TheBranchDriftCatalyst/catalyst-data.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: catalyst-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Kyverno ClusterPolicy `ingressroute-lan-only-talos00` (landed 2026-10-24)
    # prepends the `lan-only` middleware to every *.talos00 IngressRoute, and its
    # `existing-*` rules set mutateExistingOnPolicyUpdate, so it retrofits routes
    # that were already applied. Git never carries that entry, so ArgoCD read it as
    # drift and selfHeal stripped it on every reconcile — Kyverno then put it back.
    # That is a revert loop, not one-off drift: all six affected apps re-synced
    # every few minutes for ~12 days. The cost is not just a lost Synced signal —
    # each cycle leaves a brief window where the WAN-exposure guard is absent from
    # the live route. Kyverno owns this field; ArgoCD must not compare it.
    - group: traefik.io
      kind: IngressRoute
      jqPathExpressions:
        - .spec.routes[].middlewares
