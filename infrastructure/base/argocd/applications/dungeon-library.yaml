---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dungeon-library
  namespace: argocd
  labels:
    app.kubernetes.io/name: dungeon-library
    app.kubernetes.io/part-of: catalyst
  annotations:
    # ArgoCD Image Updater configuration
    argocd-image-updater.argoproj.io/image-list: dungeon-library=ghcr.io/thebranchdriftcatalyst/dungeon-library
    argocd-image-updater.argoproj.io/dungeon-library.update-strategy: latest
    argocd-image-updater.argoproj.io/dungeon-library.allow-tags: regexp:^(latest|main|[a-f0-9]{7,40})$
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # External links shown in ArgoCD UI
  info:
    - name: GitHub Repository
      value: https://github.com/TheBranchDriftCatalyst/dungeon-library
    - name: Container Registry
      value: https://ghcr.io/thebranchdriftcatalyst/dungeon-library
    - name: Application
      value: http://dungeon-library.talos00

  # Source repository
  source:
    repoURL: git@github.com:TheBranchDriftCatalyst/dungeon-library.git
    targetRevision: main
    path: k8s

  # Destination cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: dungeon-library

  # Sync policy
  syncPolicy:
    automated:
      prune: true # Delete resources that are no longer in git
      selfHeal: true # Automatically sync when cluster state differs
      allowEmpty: false # Don't delete all resources if source is empty

    syncOptions:
      - CreateNamespace=true # Automatically create the namespace if it doesn't exist
      - PrunePropagationPolicy=foreground # Wait for resources to be deleted
      - PruneLast=true # Prune at the end of sync

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in certain fields
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas # Ignore replica count changes (e.g., from HPA)
    # Kyverno ClusterPolicy `ingressroute-lan-only-talos00` (landed 2026-10-24)
    # prepends the `lan-only` middleware to every *.talos00 IngressRoute, and its
    # `existing-*` rules set mutateExistingOnPolicyUpdate, so it retrofits routes
    # that were already applied. Git never carries that entry, so ArgoCD read it as
    # drift and selfHeal stripped it on every reconcile — Kyverno then put it back.
    # That is a revert loop, not one-off drift: all six affected apps re-synced
    # every few minutes for ~12 days. The cost is not just a lost Synced signal —
    # each cycle leaves a brief window where the WAN-exposure guard is absent from
    # the live route. Kyverno owns this field; ArgoCD must not compare it.
    - group: traefik.io
      kind: IngressRoute
      jqPathExpressions:
        - .spec.routes[].middlewares
