---
# ArgoCD Application for catalyst-llm
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalyst-llm
  namespace: argocd
  labels:
    app.kubernetes.io/name: catalyst-llm
    app.kubernetes.io/part-of: catalyst
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source repository
  source:
    repoURL: https://github.com/TheBranchDriftCatalyst/catalyst-llm.git
    targetRevision: main
    path: k8s/talos00

  # Destination cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: catalyst-llm

  # Sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in certain fields
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # Kyverno ClusterPolicy `ingressroute-lan-only-talos00` (landed 2026-10-24)
    # prepends the `lan-only` middleware to every *.talos00 IngressRoute, and its
    # `existing-*` rules set mutateExistingOnPolicyUpdate, so it retrofits routes
    # that were already applied. Git never carries that entry, so ArgoCD read it as
    # drift and selfHeal stripped it on every reconcile — Kyverno then put it back.
    # That is a revert loop, not one-off drift: all six affected apps re-synced
    # every few minutes for ~12 days. The cost is not just a lost Synced signal —
    # each cycle leaves a brief window where the WAN-exposure guard is absent from
    # the live route. Kyverno owns this field; ArgoCD must not compare it.
    - group: traefik.io
      kind: IngressRoute
      jqPathExpressions:
        - .spec.routes[].middlewares
