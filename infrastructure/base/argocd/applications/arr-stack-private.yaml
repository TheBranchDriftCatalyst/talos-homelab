---
# ArgoCD Application for arr-stack-private
#
# Copy this file to: talos-homelab/infrastructure/base/argocd/applications/arr-stack-private.yaml
#
# This is the ONLY thing that needs to be added to talos-homelab.
# All configuration (IPs, domains, etc) is in this repo's base/cluster-config.yaml
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-stack-private
  namespace: argocd
  labels:
    app.kubernetes.io/name: arr-stack-private
    app.kubernetes.io/part-of: arr-stack
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ESO v1 CRDs server-default many fields; without server-side DIFF the app
    # flags them OutOfSync forever (SSA alone does not fix the comparison)
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default

  source:
    repoURL: git@github.com:TheBranchDriftCatalyst/talos-private.git # renamed from private.git — old URL redirect confused repo-server caching (2026-08-14)
    targetRevision: main
    path: .  # Root kustomization combines base/ + tdarr-patches/

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  # The ESO controller populates three default subkeys on every
  # ExternalSecret (conversionStrategy, decodingStrategy, metadataPolicy)
  # that aren't in git, which ArgoCD flags as drift even though the ESes
  # are SecretSynced=True. Match BOTH `data[]` and `dataFrom[]` patterns —
  # ESes can use either; protonvpn-credentials uses dataFrom[].extract.
  # Added dataFrom path 2026-05-30 after dashboard showed it OutOfSync.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.dataFrom[].extract.conversionStrategy
        - .spec.dataFrom[].extract.decodingStrategy
        - .spec.dataFrom[].extract.metadataPolicy

  syncPolicy:
    automated:
      # TEMPORARY GUARD — TALOS-cmer, scene-engine cutover. RESTORE TO true when it closes.
      #
      # Second time this guard has been needed; the first was the hot-ones
      # cutover (TALOS-xr14). scene-engine is the higher-stakes one: this app
      # currently tracks 26 of its objects, including a RAW CNPG Cluster
      # (scene-engine-postgres, instances:2) plus the ObjectStore and
      # ScheduledBackup that are the only route back to that data — where
      # hot-ones' database was a composite whose PVCs were never ArgoCD-tracked.
      #
      # Removing `- scene-engine/` from the talos-private kustomization while
      # prune is on deletes all of it with foreground propagation.
      #
      # IN GIT, not a `kubectl patch`: this Application is Flux-managed
      # (applications/kustomization.yaml:10, argocd Kustomization interval 10m),
      # so a live patch is reverted within ten minutes and re-arms prune
      # mid-migration. A patch-triggered sync also drops EVERY spec syncOption
      # including ServerSideApply — see TALOS-7yw4.
      prune: false
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false  # media namespace already exists from arr-stack
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true  # Needed for cluster-scoped PVs

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
