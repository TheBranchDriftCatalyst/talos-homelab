---
# ArgoCD Application for arr-stack-private
#
# Copy this file to: talos-homelab/infrastructure/base/argocd/applications/arr-stack-private.yaml
#
# This is the ONLY thing that needs to be added to talos-homelab.
# All configuration (IPs, domains, etc) is in this repo's base/cluster-config.yaml
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arr-stack-private
  namespace: argocd
  labels:
    app.kubernetes.io/name: arr-stack-private
    app.kubernetes.io/part-of: arr-stack
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # ESO v1 CRDs server-default many fields; without server-side DIFF the app
    # flags them OutOfSync forever (SSA alone does not fix the comparison)
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default

  source:
    repoURL: git@github.com:TheBranchDriftCatalyst/talos-private.git # renamed from private.git — old URL redirect confused repo-server caching (2026-08-14)
    targetRevision: main
    path: .  # Root kustomization combines base/ + tdarr-patches/

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  # The ESO controller populates default subkeys on every ExternalSecret that
  # aren't in git, which ArgoCD flags as drift even though the ESes are
  # SecretSynced=True. Match BOTH `data[]` and `dataFrom[]` patterns — ESes can
  # use either; protonvpn-credentials uses dataFrom[].extract.
  # Added dataFrom path 2026-05-30 after dashboard showed it OutOfSync.
  #
  # Completed to eight entries 2026-10-14 (TALOS-go7p). The list was six, and
  # the two additions — .spec.data[].remoteRef.nullBytePolicy and
  # .spec.target.deletionPolicy — are newer ESO fields than the original. Both
  # ARE defaulted server-side here: all three ExternalSecrets in this app's
  # scope read `nullBytePolicy: Ignore` on every remoteRef and
  # `deletionPolicy: Retain` on target live, none of it declared in git.
  # The omission was latent, not active — these three only read Synced because
  # their field ownership is long-established under ServerSideApply. The same
  # gap bit immediately on the freshly-adopted hot-ones ExternalSecrets, which
  # sat OutOfSync until both fields were exempted. Keep in step with the
  # identical lists in hot-ones.yaml and scene-engine.yaml.
  #
  # The three .spec.dataFrom[].extract.* paths are NOT exercised today — none
  # of the three ESes uses dataFrom[]. They are kept because a jqPathExpression
  # over a missing path is a no-op, and so the next ES added here does not have
  # to rediscover the gap.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
        - .spec.dataFrom[].extract.conversionStrategy
        - .spec.dataFrom[].extract.decodingStrategy
        - .spec.dataFrom[].extract.metadataPolicy
        - .spec.target.deletionPolicy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false  # media namespace already exists from arr-stack
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true  # Needed for cluster-scoped PVs

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
