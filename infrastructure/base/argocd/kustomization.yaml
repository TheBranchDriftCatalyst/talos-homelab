apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrelease.yaml
  # Dragonfly (Redis-compatible) cache — replaces the argo-cd chart's bundled redis
  - dragonfly.yaml
  - ingressroute.yaml
  # Repository credentials (from 1Password via ESO)
  - externalsecret-private-repo.yaml
  # Discord webhook for notifications (from 1Password via ESO)
  - discord-webhook-externalsecret.yaml
  # Admin credentials (from 1Password via ESO)
  - admin-credentials-externalsecret.yaml
  # Prometheus ServiceMonitors for metrics scraping
  - servicemonitor.yaml
  # Additive netpols so monitoring can scrape dragonfly + repo-server (TALOS-xgrl.10)
  - netpol-allow-monitoring.yaml
  # ArgoCD Image Updater - auto-updates container images
  - image-updater/
  # ArgoCD Application manifests - auto-applied by Flux
  - applications/
