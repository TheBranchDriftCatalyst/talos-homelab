---
# ArgoCD <-> Authentik OIDC client secret (TALOS-yxtx follow-up).
#
# SELF-CONTAINED ESO Password generator — no 1Password field to provision, so
# this cannot sit half-configured waiting on an operator step (the failure mode
# the grafana/zot/boomtime blueprints all carry a warning about).
#
# DIRECTION NOTE — the generator lives HERE, in ns argocd, and is reflected INTO
# ns authentik, which is the reverse of the media-experimental OIDC apps.
# Reason: ArgoCD will only resolve a `$<secret>:<key>` reference from argocd-cm
# if the secret carries the label `app.kubernetes.io/part-of: argocd`, and the
# ESO target is the only place that label can be set declaratively. Reflector
# copies secret DATA, not labels, so generating in authentik and mirroring here
# would produce an unlabelled secret and ArgoCD would silently fail to resolve
# the reference. The authentik end only needs the raw bytes for a secretKeyRef,
# which the mirror provides fine — so the labelled copy is the source.
#
# WHY REFLECTOR AND NOT A SECOND ExternalSecret: the Password generator is
# namespaced and mints a FRESH value on every evaluation. A second generator in
# ns authentik would produce a DIFFERENT secret and the handshake would fail
# with invalid_client. Reflector copies the exact bytes, in lockstep.
#
# refreshInterval "0" = generate once and stay stable. Do NOT edit this spec
# casually: an ESO generator re-evaluates on ANY spec change, which rotates the
# secret on both ends — and authentik-worker needs a restart to re-read its env
# before the new value takes effect, so the two ends are briefly mismatched.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: argocd-oidc-client-secret
  namespace: argocd
spec:
  length: 48
  digits: 12
  symbols: 0 # alphanumeric: avoids URL/encoding edge cases in the token request
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: "0" # generate once — must stay identical to the authentik provider's
  target:
    name: argocd-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          # REQUIRED. argocd-cm resolves `clientSecret: $argocd-oidc:client-secret`
          # only against secrets bearing this label; without it the reference is
          # left unresolved and login fails with no useful error.
          app.kubernetes.io/part-of: argocd
        annotations:
          # Fan the SAME generated value into ns authentik, where the worker
          # injects it as ARGOCD_OIDC_CLIENT_SECRET for the blueprint's !Env.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "authentik"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "authentik"
      data:
        client-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: argocd-oidc-client-secret
