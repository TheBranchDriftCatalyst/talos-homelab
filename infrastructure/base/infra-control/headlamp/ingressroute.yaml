---
# SEV-2 (TALOS-xgrl.7): was plain-HTTP `web` with no auth. Now HTTPS + Authentik
# forward-auth SSO + web→HTTPS redirect. Paired with the bounded `view` role.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: infra-control
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Headlamp"
    gethomepage.dev/description: "Kubernetes Dashboard"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/weight: "10"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes-dashboard.png"
    gethomepage.dev/href: "https://headlamp.talos00"
    gethomepage.dev/siteMonitor: "http://headlamp.infra-control.svc.cluster.local:80"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headlamp.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: headlamp
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-http
  namespace: infra-control
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headlamp.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: headlamp
          port: 80
