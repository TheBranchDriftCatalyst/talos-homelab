---
# Apache Guacamole — clientless remote-desktop gateway (moved from the gaming ns to
# infra-control as a general admin/remote-access tool; TALOS-xgrl.6). SSO-protected at
# guacamole.priv.talos00 (talos-private group); RDP target is the gaming Windows VM
# via its cross-namespace FQDN. The former public admin/admin is replaced with a
# sha256-hashed credential.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: infra-control
  labels: {app: guacd}
spec:
  replicas: 1
  selector:
    matchLabels: {app: guacd}
  template:
    metadata:
      labels: {app: guacd}
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd:1.6.0 # pinned (was :latest)
          ports:
            - {containerPort: 4822, name: guacd}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: infra-control
  labels: {app: guacd}
spec:
  type: ClusterIP
  selector: {app: guacd}
  ports:
    - {name: guacd, port: 4822, targetPort: 4822}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-config
  namespace: infra-control
  labels: {app: guacamole}
data:
  user-mapping.xml: |
    <user-mapping>
      <!-- admin password is sha256-hashed (was public admin/admin, TALOS-xgrl.6).
           Access is additionally gated by Authentik SSO (talos-private group). -->
      <authorize username="admin" password="c120dcbd788652edac015cd8d573431204f1b4f6bddf53287d132c31f38c8dc6" encoding="sha256">
        <connection name="Windows Gameserver (RDP)">
          <protocol>rdp</protocol>
          <param name="hostname">windows-gameserver-rdp.gaming.svc.cluster.local</param>
          <param name="port">3389</param>
          <param name="security">any</param>
          <param name="ignore-cert">true</param>
          <param name="color-depth">32</param>
          <param name="resize-method">reconnect</param>
          <param name="enable-wallpaper">true</param>
          <param name="enable-font-smoothing">true</param>
          <param name="clipboard-encoding">UTF-8</param>
        </connection>
      </authorize>
    </user-mapping>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: infra-control
  labels: {app: guacamole}
spec:
  replicas: 1
  selector:
    matchLabels: {app: guacamole}
  template:
    metadata:
      labels: {app: guacamole}
    spec:
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0 # pinned (was :latest)
          env:
            - {name: GUACD_HOSTNAME, value: guacd}
            - {name: GUACD_PORT, value: "4822"}
            - {name: WEBAPP_CONTEXT, value: ROOT}
          ports:
            - {containerPort: 8080, name: http}
          volumeMounts:
            - {name: config, mountPath: /etc/guacamole/user-mapping.xml, subPath: user-mapping.xml}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: guacamole-config}
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: infra-control
  labels: {app: guacamole}
spec:
  type: ClusterIP
  selector: {app: guacamole}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
# SSO-protected route — guacamole.priv.talos00 behind Authentik forward-auth.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacamole
  namespace: infra-control
  labels: {app: guacamole}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Apache Guacamole"
    gethomepage.dev/description: "Clientless remote desktop gateway"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/icon: "guacamole.png"
    gethomepage.dev/href: "https://guacamole.priv.talos00"
    gethomepage.dev/siteMonitor: "http://guacamole.infra-control.svc.cluster.local:8080"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`guacamole.priv.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: guacamole
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacamole-http
  namespace: infra-control
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`guacamole.priv.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: guacamole
          port: 8080
