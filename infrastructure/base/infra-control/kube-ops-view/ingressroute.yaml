apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-ops-view
  namespace: infra-control
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Kube Ops View"
    gethomepage.dev/description: "Cluster Visualizer"
    gethomepage.dev/group: "Home & Tools"
    gethomepage.dev/weight: "12"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/kubernetes.png"
    gethomepage.dev/siteMonitor: "http://kube-ops-view.infra-control.svc.cluster.local:80"
spec:
  # HTTPS + Authentik forward-auth SSO (TALOS-xgrl.14). talos-admin / cluster-admin gated.
  # TLS: default TLSStore serves the *.talos00 wildcard via SNI.
  entryPoints:
    - websecure
  routes:
    - match: Host(`kube-ops-view.talos00`)
      kind: Rule
      middlewares:
        # MIGRATED to the dedicated *.talos00 outpost (TALOS-22nn stage 1), so
        # this app's login stays on the LAN (https://auth.talos00) instead of
        # round-tripping out to https://auth.knowledgedump.space.
        #
        # PAIRED EDIT, NOT STANDALONE: this needs the priority-2000 callback
        # route in infrastructure/base/authentik-lan-outpost/app-callbacks.yaml,
        # because authentik-outpost-priv sends EVERY *.talos00
        # /outpost.goauthentik.io/ path to the embedded outpost at priority 1000.
        # Without it the auth check and the callback are answered by two
        # different outposts advertising different browser hosts, and the flow
        # 400s or loops. Revert both or neither.
        - name: authentik-lan
          namespace: authentik
        # Consolidated catalyst navbar. Last in the chain so auth runs first and the
        # body injector only ever rewrites an already-authorised response.
        - name: catalyst-nav
          namespace: traefik
      services:
        - name: kube-ops-view
          port: 80
---
# HTTP→HTTPS redirect for kube-ops-view.talos00.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-ops-view-http
  namespace: infra-control
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kube-ops-view.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: kube-ops-view
          port: 80
