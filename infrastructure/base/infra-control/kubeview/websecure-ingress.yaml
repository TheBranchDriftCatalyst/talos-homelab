---
# KubeView exposed via CatalystWebSecureIngress (TALOS-l2sm.10 MVP; re-homed off .priv.talos00
# to the infra domain, TALOS-hbba). One claim renders the websecure + web-redirect IngressRoute
# pair AND a NetworkPolicy locking ingress to Traefik — kubeview had NO NetworkPolicy before
# (east-west finding 003: forward-auth was perimeter-only). SSO: forward-auth via the shared
# authentik middleware; the Authentik Application (group talos-admin) is registered separately
# in authentik/talos-private-blueprint.yaml (external_host re-homed to kubeview.talos00).
apiVersion: net.catalyst.io/v1alpha1
kind: CatalystWebSecureIngress
metadata:
  name: kubeview
  namespace: infra-control
  annotations:
    catalyst.io/replaced-loc: "39"
spec:
  host: kubeview.talos00
  backend:
    service: kubeview
    port: 80
    selector:
      app: kubeview
  # Infra/admin tool: LAN-only (ipAllowList) BEFORE forward-auth — not reachable via external
  # ingress, only from 192.168/10.x. (operator directive 2026-09-10)
  middlewares:
    - {name: lan-only, namespace: traefik}
    - {name: authentik, namespace: authentik}
    # Consolidated catalyst navbar, last so both gates run before the body
    # injector touches the response. Needed as well as spec.homepage below:
    # build_nav.py requires BOTH a catalyst* middleware AND the annotation.
    - {name: catalyst-nav, namespace: traefik}

  # Advertises kubeview in the navbar and on the dashboards. Rendered into
  # gethomepage.dev/* annotations by the composition (siteMonitor / href are
  # derived from these by kyverno, so they are deliberately absent here).
  homepage:
    name: KubeView
    description: "Live cluster topology and object browser"
    group: Infrastructure
    icon: kubeview.png
    weight: 30
