---
# KubeView — SSO-protected via Authentik forward-auth on kubeview.priv.talos00
# (TALOS-xgrl.1/.13). Access requires membership in the talos-private group. Paired
# with the scoped read-only RBAC (no secrets). HTTPS only + web→HTTPS redirect.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubeview
  namespace: infra-control
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kubeview.priv.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: kubeview
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubeview-http
  namespace: infra-control
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kubeview.priv.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: kubeview
          port: 80
