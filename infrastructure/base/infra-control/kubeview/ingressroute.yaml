---
# SEV-1 fix (TALOS-xgrl.1): KubeView has NO built-in auth and proxies a cluster-read
# ServiceAccount. Was on plain-HTTP `web` with no middleware = anyone on the LAN browsed
# the whole cluster. Now: HTTPS + Authentik forward-auth (SSO), with web→HTTPS redirect.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubeview
  namespace: infra-control
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kubeview.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: kubeview
          port: 80
  tls: {}
---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubeview-http
  namespace: infra-control
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kubeview.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: kubeview
          port: 80
