apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeview
  namespace: infra-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeview
# CLUSTER-WIDE READER — deliberate, compensated exception (not the default).
# History: TALOS-xgrl.1 scoped this down from ['*'] to exclude secrets, because back then
# KubeView was an UNAUTHENTICATED, pod-reachable UI reading every Secret. That threat model
# no longer holds: KubeView is now (a) SSO-gated behind Authentik forward-auth and (b)
# NetworkPolicy-locked so ONLY Traefik can reach it (both via its CatalystWebSecureIngress,
# TALOS-l2sm.10). kubeview v2.2.0 additionally BLOCKS HTTP serving until its Secrets informer
# cache-syncs, so denying secrets = permanent 502. Operator decision (2026-09-10): grant the
# broad READ-ONLY access it needs, made safe by SSO + netpol + read-only verbs. Some services
# genuinely need cluster-wide read; the rule is that it is an explicit, documented, access-
# controlled exception like this one — never the silent default.
rules:
  - apiGroups: ['']
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - events
      - secrets  # cluster-wide READ ONLY — see the header note (SSO + netpol compensate)
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['deployments', 'replicasets', 'statefulsets', 'daemonsets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources: ['ingresses']
    verbs: ['get', 'list', 'watch']
  # kubeview 2.2.0 (from the :latest bump) also watches these for its topology graph;
  # denying them blocks informer cache-sync and the HTTP server never binds :8000 (502).
  # Both are safe read-only topology data. Secrets stay EXCLUDED (SEV-1 TALOS-xgrl.1).
  - apiGroups: ['autoscaling']
    resources: ['horizontalpodautoscalers']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['discovery.k8s.io']
    resources: ['endpointslices']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['batch']
    resources: ['jobs', 'cronjobs']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeview
subjects:
  - kind: ServiceAccount
    name: kubeview
    namespace: infra-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeview
  namespace: infra-control
  labels:
    app: kubeview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeview
  template:
    metadata:
      labels:
        app: kubeview
    spec:
      serviceAccountName: kubeview
      containers:
        - name: kubeview
          image: ghcr.io/benc-uk/kubeview:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IN_CLUSTER
              value: 'true'
          resources:
            requests:
              memory: '128Mi'
              cpu: '10m'
---
apiVersion: v1
kind: Service
metadata:
  name: kubeview
  namespace: infra-control
  labels:
    app: kubeview
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: kubeview
