apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeview
  namespace: infra-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeview
# SEV-1 fix (TALOS-xgrl.1): was apiGroups/resources ['*'] which INCLUDED secrets
# cluster-wide — an unauthenticated UI reading every Secret. Scoped to exactly the
# kinds KubeView renders in its topology; secrets are deliberately excluded.
rules:
  - apiGroups: ['']
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - events
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['deployments', 'replicasets', 'statefulsets', 'daemonsets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['networking.k8s.io']
    resources: ['ingresses']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['batch']
    resources: ['jobs', 'cronjobs']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeview
subjects:
  - kind: ServiceAccount
    name: kubeview
    namespace: infra-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeview
  namespace: infra-control
  labels:
    app: kubeview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeview
  template:
    metadata:
      labels:
        app: kubeview
    spec:
      serviceAccountName: kubeview
      containers:
        - name: kubeview
          image: ghcr.io/benc-uk/kubeview:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: IN_CLUSTER
              value: 'true'
          resources:
            requests:
              memory: '128Mi'
              cpu: '10m'
---
apiVersion: v1
kind: Service
metadata:
  name: kubeview
  namespace: infra-control
  labels:
    app: kubeview
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: kubeview
