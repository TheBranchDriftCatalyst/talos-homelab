---
# AWS S3 provider (upjet family) — TALOS-hk7i. Installing the s3 member pulls
# in the provider-family-aws base automatically. Latest verified 2026-08-14.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v2.7.0
---
# EC2 provider — composed by XInstance and XGPUInstance. Re-added 2026-08-23
# after the 2026-08-15 removal (see the incident note at the bottom of this
# file); this is the provider whose ~250 managed resources caused that outage.
#
# It is safe to install now because activation is gated: activation-policy.yaml
# activates exactly five ec2 resources (Instance, SecurityGroup,
# SecurityGroupRule, EBSVolume, VolumeAttachment) and the rest stay Inactive
# ManagedResourceDefinitions, which create no CRD and start no controller. The
# 2026-08-15 configuration would have registered all ~250 as CRDs.
#
# Pinned to v2.7.0 to match the installed provider-family-aws rather than
# v2.7.1 (latest): a member on a newer patch pulls the shared family up with it,
# which would drag provider-aws-s3 through an upgrade in the same change. Bump
# family and members together, separately from this.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-ec2
spec:
  package: xpkg.upbound.io/upbound/provider-aws-ec2:v2.7.0
---
# IAM provider — composed by XFargateApp (Role + RolePolicyAttachment). Same
# gating as ec2 above: activation-policy.yaml admits those two resources and
# leaves the rest Inactive.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-iam
spec:
  package: xpkg.upbound.io/upbound/provider-aws-iam:v2.7.0
---
# ECS + CloudWatch Logs providers — the remaining XFargateApp dependencies
# (ecs Cluster/TaskDefinition/Service, cloudwatchlogs Group). Grouped in one
# commit rather than staged individually like ec2 and iam: the CRD-explosion
# risk that made staging worthwhile is structurally gone once activation is
# gated, and it was measured twice before this landed — ec2 activated 5 of 208
# resources, iam 2 of 44, neither restarting crossplane core.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-ecs
spec:
  package: xpkg.upbound.io/upbound/provider-aws-ecs:v2.7.0
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-cloudwatchlogs
spec:
  package: xpkg.upbound.io/upbound/provider-aws-cloudwatchlogs:v2.7.0
---
# Composition pipeline function — Crossplane 2.x Compositions are Pipeline-mode
# only; patch-and-transform is the standard step function.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.10.9
---

# NOTE 2026-08-15 INCIDENT: the ecs/iam/cloudwatchlogs/ec2 providers were
# REMOVED after they destabilised the cluster. Six upjet providers register
# well over a thousand CRDs between them (ec2 alone ~250); crossplane core was
# OOMKilled and the apiserver saturated on their list/watch traffic — with the
# control-plane taint temporarily off, they had also scheduled onto talos00,
# taking the API server down. They provide ZERO value until the TALOS-3g8f
# credentials gate is satisfied, so they are re-added only alongside real
# creds, one at a time, with crossplane core resourced for the CRD load first.
# The XFargateApp/XInstance/XGPUInstance XRDs + examples remain in git.
