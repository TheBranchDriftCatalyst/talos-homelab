---
# AWS S3 provider (upjet family) — TALOS-hk7i. Installing the s3 member pulls
# in the provider-family-aws base automatically. Latest verified 2026-08-14.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-s3
spec:
  package: xpkg.upbound.io/upbound/provider-aws-s3:v2.7.0
---
# Composition pipeline function — Crossplane 2.x Compositions are Pipeline-mode
# only; patch-and-transform is the standard step function.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-patch-and-transform:v0.10.9
---
# ECS Fargate chain (TALOS-hk7i / XFargateApp): task orchestration, execution
# role, logs, and SG networking. Same family/version as s3.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-aws-ecs}
spec: {package: xpkg.upbound.io/upbound/provider-aws-ecs:v2.7.0}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-aws-iam}
spec: {package: xpkg.upbound.io/upbound/provider-aws-iam:v2.7.0}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-aws-cloudwatchlogs}
spec: {package: xpkg.upbound.io/upbound/provider-aws-cloudwatchlogs:v2.7.0}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: provider-aws-ec2}
spec: {package: xpkg.upbound.io/upbound/provider-aws-ec2:v2.7.0}
