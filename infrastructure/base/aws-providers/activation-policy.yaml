---
# Managed resource activation allowlist (TALOS-hk7i).
#
# WHY THIS EXISTS. The upjet AWS providers are enormous: provider-aws-ec2 alone
# ships ~250 managed resources, and every activated one becomes a real CRD
# costing roughly 3MiB of apiserver memory plus a provider controller with its
# own informer and watch. That is what saturated the apiserver and OOMKilled
# crossplane core on 2026-08-15 (see the incident note in provider.yaml). The
# answer is not "more RAM" — it is to stop registering 250 CRDs to use 5.
#
# Crossplane 2.x providers advertise the SafeStart capability (verified:
# `kubectl get providerrevisions -o jsonpath='{..status.capabilities}'` returns
# ["SafeStart"] for every provider here). Such providers install
# ManagedResourceDefinitions in state Inactive rather than CRDs directly, and
# only an MRAP promotes an MRD to Active. Per the MRD API itself: "State toggles
# whether the underlying CRD is created or not." An Inactive MRD costs one small
# etcd object and starts no controller.
#
# The chart's default MRAP activated "*", which defeated the whole mechanism.
# operators/crossplane/helmrelease.yaml now sets provider.defaultActivations to
# [] so the init container stops seeding that catch-all, and this policy — owned
# by Flux, reviewable in git — is the single activation source.
#
# MRAPs are ADDITIVE across objects: a resource is Active if ANY policy matches
# it. So a second catch-all anywhere would silently undo this file.
#
# Entries are exact MRD names (<plural>.<group>), which is what the docs require
# for non-wildcard matches. Every entry below is a resource some Composition in
# infrastructure/base/aws actually composes — keep this list and those
# Compositions in lockstep. Adding a resource to a Composition without adding it
# here fails at reconcile with "no matches for kind".
#
# Only the cluster-scoped (legacy) API group is activated. The v2 namespaced
# twins (*.aws.m.upbound.io) would double the CRD count and no Composition here
# references them.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: catalyst-activations
spec:
  activate:
    # --- s3: XBucket (xbucket-composition.yaml) — provider installed ---
    - buckets.s3.aws.upbound.io
    - bucketversionings.s3.aws.upbound.io
    - bucketserversideencryptionconfigurations.s3.aws.upbound.io
    - bucketpublicaccessblocks.s3.aws.upbound.io
    - bucketlifecycleconfigurations.s3.aws.upbound.io

    # --- ec2: XInstance + XGPUInstance (x{gpu,}instance-composition.yaml) ---
    - instances.ec2.aws.upbound.io
    - securitygroups.ec2.aws.upbound.io
    - securitygrouprules.ec2.aws.upbound.io
    - ebsvolumes.ec2.aws.upbound.io
    - volumeattachments.ec2.aws.upbound.io

    # --- XFargateApp (xfargateapp-composition.yaml). These are INERT until the
    # ecs/iam/cloudwatchlogs providers are re-added: an MRAP entry with no
    # matching MRD simply never matches. Listed now so re-adding those providers
    # is a one-line change here rather than a rediscovery of this analysis.
    - clusters.ecs.aws.upbound.io
    - taskdefinitions.ecs.aws.upbound.io
    - services.ecs.aws.upbound.io
    - roles.iam.aws.upbound.io
    - rolepolicyattachments.iam.aws.upbound.io
    - groups.cloudwatchlogs.aws.upbound.io
