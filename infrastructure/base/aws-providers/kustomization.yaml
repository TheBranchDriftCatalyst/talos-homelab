---
# Layer 1 of the AWS chain (TALOS-hk7i): crossplane packages only — no CRD
# dependencies, so it applies clean while everything downstream waits for the
# CRDs these packages generate. Same layering pattern as crossplane-demo vs
# crossplane-demo-object.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - activation-policy.yaml
  - provider.yaml
