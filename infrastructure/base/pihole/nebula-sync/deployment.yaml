---
# ⚠️ NAMING: "nebula-sync" here = PI-HOLE CONFIG SYNC (v6 Teleporter backup/restore).
# It is NOT related to "Nebula" the Slack overlay-network mesh VPN or its "lighthouse"
# nodes — entirely unrelated project, just an unfortunate name collision. This worker
# only touches Pi-hole's REST API; it has nothing to do with networking/VPN.
#
# Pi-hole config sync worker that FOLLOWS THE ACTIVE PRIMARY.
#
# With one VIP for DNS+web, the user's UI + config changes land on whatever pod holds the
# Cilium L2 lease (the active primary). This worker loops every SYNC_INTERVAL seconds:
# it discovers that pod, backs up its config via the v6 Teleporter API, and restores it to
# every OTHER pod — so settings/blocklists made through the single UI propagate and standbys
# stay failover-ready. Teleporter carries pihole.toml + gravity.db (adlists, allow/deny,
# clients, groups) — NOT stats (those stay per-pod, which is correct).
#
# A long-running loop (not a per-minute CronJob) avoids spinning up ~1440 pods/day. Restores
# only ever hit IDLE standbys (the active pod is skipped), so the interval has no DNS impact.
#
# LABELS: this pod is deliberately app=nebula-sync, NOT app=pihole — carrying app=pihole would
# (a) make it a phantom endpoint of the DNS VIP Service and (b) make it a self-sync target.
# The loop selects real Pi-hole pods with `app=pihole,statefulset.kubernetes.io/pod-name`.
# SHELL VARS use bare $VAR (no braces): Flux postBuild envsubst rewrites ${...} tokens even
# inside this args block, so ${VAR} would be eaten — bare $VAR is left for the shell to expand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  namespace: pihole
  labels:
    app: nebula-sync
    app.kubernetes.io/component: config-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nebula-sync
  template:
    metadata:
      labels:
        app: nebula-sync
        app.kubernetes.io/component: config-sync
    spec:
      serviceAccountName: nebula-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sync
          image: alpine/k8s:1.34.1 # bundles kubectl + curl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - name: SYNC_INTERVAL
              value: "300" # seconds between syncs (5 min; config/failover are infrequent)
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # This kubectl build doesn't auto-detect in-cluster config, so write a
              # kubeconfig pointing at the in-cluster API + reading the SA token from its
              # file (tokenFile → no token on argv, survives rotation). Bare $VARs dodge Flux.
              printf 'apiVersion: v1\nkind: Config\nclusters:\n- name: c\n  cluster:\n    server: https://%s:%s\n    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\ncontexts:\n- name: c\n  context:\n    cluster: c\n    user: u\ncurrent-context: c\nusers:\n- name: u\n  user:\n    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token\n' "$KUBERNETES_SERVICE_HOST" "$KUBERNETES_SERVICE_PORT" > /tmp/kubeconfig
              export KUBECONFIG=/tmp/kubeconfig
              KUBECTL="kubectl --request-timeout=10s"
              # password via stdin (never on the curl argv / process list)
              auth() { printf '{"password":"%s"}' "$PIHOLE_PASSWORD" | curl -s --max-time 10 -X POST "http://$1/api/auth" -H 'Content-Type: application/json' --data @- | sed -n 's/.*"sid":"\([^"]*\)".*/\1/p'; }
              # only real StatefulSet pihole pods (excludes THIS worker + anything else)
              PSEL='app=pihole,statefulset.kubernetes.io/pod-name'
              sync_once() {
                NODE=$($KUBECTL get lease cilium-l2announce-pihole-pihole -n kube-system -o jsonpath='{.spec.holderIdentity}' 2>/dev/null)
                [ -n "$NODE" ] || { echo "no L2 lease holder yet; skip"; return 0; }
                ACTIVE_IP=$($KUBECTL get pods -n pihole -l "$PSEL" --field-selector spec.nodeName="$NODE" -o jsonpath='{.items[0].status.podIP}' 2>/dev/null)
                ACTIVE_POD=$($KUBECTL get pods -n pihole -l "$PSEL" --field-selector spec.nodeName="$NODE" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                [ -n "$ACTIVE_IP" ] || { echo "cannot resolve active pod on $NODE; skip"; return 0; }
                SID=$(auth "$ACTIVE_IP"); [ -n "$SID" ] || { echo "auth to active $ACTIVE_POD failed; skip"; return 0; }
                curl -s --max-time 20 -o /tmp/tele.zip -H "X-FTL-SID: $SID" "http://$ACTIVE_IP/api/teleporter"
                SZ=$(wc -c </tmp/tele.zip 2>/dev/null || echo 0)
                [ "$SZ" -gt 100 ] || { echo "backup too small ($SZ); skip"; return 0; }
                # heartbeat: a healthy cycle reached the active primary + got its config.
                # (Liveness tracks loop-alive, NOT per-replica restore success.)
                date +%s > /tmp/last-sync
                OK=0; FAIL=0
                for IP in $($KUBECTL get pods -n pihole -l "$PSEL" -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}' 2>/dev/null); do
                  { [ -z "$IP" ] || [ "$IP" = "$ACTIVE_IP" ]; } && continue
                  RSID=$(auth "$IP"); [ -n "$RSID" ] || { echo "  $IP auth failed"; FAIL=$((FAIL+1)); continue; }
                  CODE=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H "X-FTL-SID: $RSID" -F "file=@/tmp/tele.zip" "http://$IP/api/teleporter")
                  [ "$CODE" = "200" ] && OK=$((OK+1)) || { echo "  $IP restore HTTP=$CODE"; FAIL=$((FAIL+1)); }
                done
                echo "$(date -u +%FT%TZ) primary=$ACTIVE_POD synced=$OK failed=$FAIL"
              }
              echo "nebula-sync worker starting (interval $SYNC_INTERVAL s)"
              date +%s > /tmp/last-sync
              while true; do sync_once; sleep "$SYNC_INTERVAL"; done
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          livenessProbe: # self-heal if the loop wedges (no reached-active in ~2 intervals)
            exec:
              command: ["/bin/sh", "-c", "test $(( $(date +%s) - $(cat /tmp/last-sync 2>/dev/null || echo 0) )) -lt 900"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
