---
# PodMonitor for the nebula-sync config-sync worker.
#
# ⚠️ "nebula-sync" = PI-HOLE CONFIG SYNC (v6 Teleporter). NOT "Nebula" the mesh VPN.
#
# WHAT it scrapes:
#   nebula-sync is a long-running loop Deployment (NOT a batch CronJob), so a scraped
#   /metrics endpoint is the right Prometheus pattern (proper up/gauge/counter-reset
#   semantics) — Pushgateway/remote_write are for jobs that EXIT (see the pushgateway
#   HelmRelease note + the pod-cleanup CronJob). sync.sh writes Prometheus exposition text
#   to a shared emptyDir; a sibling busybox-httpd container serves it on port "metrics"
#   (9092, path /metrics). Mirrors this dir's pihole podmonitor.yaml.
#
# HOW it's discovered:
#   The v2-otel Alloy runs prometheus.operator.podmonitors "default" with NO selector, so
#   ANY PodMonitor in ANY namespace is scraped — no special release/label required. Alloy
#   adds pod/namespace labels; metrics carry only a `result` label (success|failure).
#
# METRICS emitted (see nebula-sync/sync.sh write_metrics):
#   nebula_sync_runs_total{result}            counter — cycles by outcome
#   nebula_sync_last_success_timestamp_seconds gauge  — drives "Last sync age" + the
#                                                        "nebula-sync run" dashboard annotation
#   nebula_sync_last_run_timestamp_seconds     gauge  — last attempt (any result)
#   nebula_sync_duration_seconds               gauge  — last cycle wall-time
#   nebula_sync_replicas_synced / _failed      gauge  — per-cycle standby restore tallies
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nebula-sync
  namespace: pihole
  labels:
    app.kubernetes.io/name: nebula-sync
    app.kubernetes.io/component: metrics
spec:
  namespaceSelector:
    matchNames:
      - pihole
  selector:
    matchLabels:
      app: nebula-sync # set on the Deployment's pod template (NOT app=pihole)
  podMetricsEndpoints:
    - port: metrics # busybox httpd sidecar containerPort name (9092)
      path: /metrics
      interval: 30s
