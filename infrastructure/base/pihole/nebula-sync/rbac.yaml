---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nebula-sync
  namespace: pihole
  labels:
    app: pihole
    app.kubernetes.io/component: config-sync
---
# ClusterRole (not namespaced Role) so it's immune to the kustomization's
# `namespace: pihole` transformer — it must read the L2 lease in kube-system.
# Read-only, minimal: the L2 lease (to find the active pod) + pihole pods (IPs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nebula-sync
  labels:
    app: pihole
    app.kubernetes.io/component: config-sync
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nebula-sync
  labels:
    app: pihole
    app.kubernetes.io/component: config-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nebula-sync
subjects:
  - kind: ServiceAccount
    name: nebula-sync
    namespace: pihole
