---
# Pi-hole admin password from 1Password (item `pihole-admin`, property `password`).
# The SAME value is pulled into the external-dns-pihole namespace so external-dns
# can authenticate to Pi-hole's API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-admin
  namespace: pihole
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pihole-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: pihole-admin
        property: password
