---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mojo2600
  namespace: pihole
spec:
  interval: 24h
  url: https://mojo2600.github.io/pihole-kubernetes/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: pihole
      version: '2.38.0' # appVersion 2026.07.2 = Pi-hole v6
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: pihole
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: pihole/pihole
      # tag inherits chart appVersion (Pi-hole v6)
    # HA: one Pi-hole per node (DaemonSet-equivalent via replicas + hard anti-affinity),
    # so a single node failure never takes DNS down. Config is entirely FTLCONF env
    # (wildcard/upstreams/revServers/password) → storage can be ephemeral, each pod
    # self-configures identically. No node pin.
    replicaCount: 5 # = node count
    strategyType: RollingUpdate
    priorityClassName: pihole-critical # critical infra: schedule first, never evict
    # SOFT anti-affinity (preferred, not required): pods still spread one-per-node
    # in steady state, but rolling updates never deadlock — a new pod can schedule
    # even while an old pod still occupies its target node (brief co-location is fine).
    # Hard/required anti-affinity + per-pod gravity downloads made helm upgrades time
    # out and roll back → DNS outage. Soft avoids that.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: pihole
              topologyKey: kubernetes.io/hostname
    # Tolerate the control-plane taint so a Pi-hole also runs on talos00 — every
    # node needs a local backend for the eTP:Local VIP to fail over to any node.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Admin password from ESO.
    admin:
      enabled: true
      existingSecret: pihole-admin
      passwordKey: password

    # Prometheus metrics via the chart's exporter sidecar (ekofr/pihole-exporter),
    # which speaks the Pi-hole v6 REST API and re-exposes metrics on :9617 (port
    # name "prometheus"). It auths using the SAME pihole-admin secret (PIHOLE_PASSWORD).
    # The chart's own PodMonitor stays DISABLED — this repo owns the scrape config
    # explicitly in git via infrastructure/base/pihole/podmonitor.yaml (avoids the
    # double-scrape you'd get from two PodMonitors). See that file for scrape/label notes.
    monitoring:
      podMonitor:
        enabled: false
      sidecar:
        enabled: true
        port: 9617

    # DNS (:53) owns the LAN VIP .240 (Cilium LB-IPAM). Single VIP +
    # externalTrafficPolicy:Local → whichever node holds the L2 lease serves DNS from
    # its local pod; node dies → lease + traffic move to another node that also has a
    # Pi-hole. Automatic failover, one IP, client IPs preserved.
    #
    # Web is NOT on this VIP (see serviceWeb). Sharing .240 across two eTP:Local
    # services put their L2 announce leases on DIFFERENT nodes (dns→talos06,
    # web→talos03), so BOTH nodes ARP-announced .240 and DNS leaked to a second
    # instance (~20% to the web-lease node's pod). Removing the web VIP leaves .240
    # single-lease → single-active DNS. (TALOS-ghw)
    serviceDns:
      type: LoadBalancer
      mixedService: true # single Service carrying TCP+UDP :53
      externalTrafficPolicy: Local # preserve client IPs (per-client stats/hostnames)
      annotations:
        lbipam.cilium.io/ips: "192.168.1.240"
        lbipam.cilium.io/sharing-key: "pihole"
    serviceWeb:
      # ClusterIP, not LoadBalancer: the web UI is reached via Traefik
      # (pihole.talos00 → pihole-web pod endpoints, sticky sessions), so the .240 web
      # VIP was redundant — and its L2 lease on a second node is what split DNS. With
      # ClusterIP, .240 belongs solely to pihole-dns. Direct http://192.168.1.240/admin
      # no longer serves; use http://pihole.talos00/admin.
      type: ClusterIP
      http:
        enabled: true
        port: 80
      https:
        enabled: false

    # Ephemeral: PVC disabled so the N replicas don't contend on one RWO volume.
    # (Gravity/blocklists re-download on pod start; HA masks the per-pod warm-up.)
    persistentVolumeClaim:
      enabled: false

    # Sane limits — Pi-hole is lightweight; generous CPU burst keeps it snappy
    # under query spikes, memory bounded so it can't starve a node.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi

    # Upstreams: rely on the chart defaults (FTLCONF_dns_upstreams=8.8.8.8;8.8.4.4,
    # FTLCONF_dns_listeningMode=all). Do NOT set FTLCONF_dns_upstreams here — the
    # chart already renders it, and a second entry is a duplicate-env error.
    # (Legacy dnsmasq.upstreamServers is also avoided — v6 rejects server= lines.)
    extraEnvVars:
      FTLCONF_dns_listeningMode: "all" # answer on the LB IP (belt-and-suspenders)
      # Conditional forwarding: send reverse (PTR) lookups for the LAN subnet to the
      # router so Pi-hole can show CLIENT HOSTNAMES instead of raw IPs in the graphs.
      # Format: <enabled>,<cidr>,<router-ip>#<port>,<local-domain>
      # Domain matches the router's DHCP "Domain Name" (localdomain).
      # ⚠ Adjust 192.168.1.1 if your gateway/DHCP-DNS is elsewhere.
      FTLCONF_dns_revServers: "true,192.168.1.0/24,192.168.1.1#53,localdomain"
      # SINGLE-POINT wildcard: every *.${CLUSTER_DOMAIN} resolves to Traefik.
      # Derived from cluster-settings (Flux postBuild substitutes ${...} here):
      #   CLUSTER_DOMAIN=talos00, TALOS_NODE_IP=192.168.1.54 → address=/talos00/192.168.1.54
      # Replaces per-service /etc/hosts AND avoids annotating 58 IngressRoutes.
      # v6-native (FTLCONF misc.dnsmasq_lines), not the legacy server= path that crashes.
      FTLCONF_misc_dnsmasq_lines: "address=/${CLUSTER_DOMAIN}/${TALOS_NODE_IP}"
