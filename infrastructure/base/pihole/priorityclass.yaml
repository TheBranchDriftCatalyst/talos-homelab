---
# High priority for Pi-hole — it's LAN-critical DNS. Ensures pods schedule ahead
# of normal workloads and are the last to be evicted under node pressure. Value is
# below the built-in system-cluster-critical (2000000000) so it never outranks
# core control-plane components.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pihole-critical
value: 900000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "LAN-critical DNS (Pi-hole) — schedule first, evict last."
