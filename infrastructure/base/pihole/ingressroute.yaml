---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Pi-hole"
    gethomepage.dev/description: "LAN DNS + ad-blocking"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "pi-hole.png"
    gethomepage.dev/href: "http://pihole.${CLUSTER_DOMAIN}/admin"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pihole.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: pihole-web
          port: 80
