---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Pi-hole"
    gethomepage.dev/description: "LAN DNS + ad-blocking"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "pi-hole.png"
    gethomepage.dev/href: "http://pihole.${CLUSTER_DOMAIN}/admin"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pihole.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        # Active/standby failover (NOT round-robin): route through the VIP-backed
        # pihole-web-vip Service (see web-vip-endpoint.yaml) so ALL web traffic
        # converges on the single active pod behind the eTP:Local VIP. Pi-hole v6
        # keeps its API session store per-instance, so one shared active pod means
        # sessions always work; the L2 lease fails over to another node on failure.
        - name: pihole-web-vip
          port: 80
