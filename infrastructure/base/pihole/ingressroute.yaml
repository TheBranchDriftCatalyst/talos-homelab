---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Pi-hole"
    gethomepage.dev/description: "LAN DNS + ad-blocking"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "pi-hole.png"
    gethomepage.dev/href: "http://pihole.${CLUSTER_DOMAIN}/admin"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pihole.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        # Session affinity: pin each browser to ONE pod. Pi-hole v6 keeps its API
        # session store PER-INSTANCE (proven: a SID from pod A is invalid on pod B),
        # so any spreading of a browser's requests across pods → 401 logout.
        #
        # IMPORTANT: point at pihole-web (the pod-endpoint Service), NOT the VIP.
        # Traefik dials pod IPs directly here, so the sticky cookie deterministically
        # pins a browser to one pod. Routing via the LB VIP does NOT work: eTP:Local
        # only pins EXTERNAL traffic; for in-cluster (Traefik→VIP) traffic Cilium
        # fans the VIP back out across all 5 pods (measured 1/8 session hits), which
        # is why the VIP-as-failover attempt logged users straight back out.
        - name: pihole-web
          port: 80
          sticky:
            cookie:
              name: pihole_lb
              httpOnly: true
