---
# Failover (active/standby) target for the Pi-hole web UI via Traefik.
#
# WHY: Pi-hole v6 keeps its API session store PER-INSTANCE (no shared backend).
# With 5 replicas, if Traefik load-balances across the pod endpoints a browser's
# post-login SID lands on one pod and the next request hits another → 401. We want
# "always one active instance, fail over only when it dies" rather than round-robin.
#
# HOW: Instead of pointing the IngressRoute at the pihole-web Service (which fans out
# to all 5 pod endpoints), point it at THIS selector-less Service whose single manual
# endpoint is the shared LoadBalancer VIP (192.168.1.240). That VIP is
# externalTrafficPolicy:Local, so Cilium's L2 lease sends all traffic to the ONE node
# currently holding it → that node's local Pi-hole pod. Every request (from any Traefik
# replica) converges on the same active pod, so sessions just work. When that node dies
# the L2 lease moves to another node and traffic follows automatically — the same proven
# failover mechanism DNS already uses. Verified Traefik pods can reach the VIP.
apiVersion: v1
kind: Service
metadata:
  name: pihole-web-vip
  namespace: pihole
  labels:
    app: pihole
    app.kubernetes.io/component: web-failover
spec:
  type: ClusterIP
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole-web-vip
  namespace: pihole
  labels:
    kubernetes.io/service-name: pihole-web-vip
addressType: IPv4
ports:
  - name: web
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - "192.168.1.240" # shared Pi-hole LoadBalancer VIP (eTP:Local → single active pod)
    conditions:
      ready: true
