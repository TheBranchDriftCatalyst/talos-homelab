---
# Pod delete/list for the wedge-buster-cdi-certs CronJob (defined in
# infrastructure/base/kube-system/wedge-buster/cronjob-cdi-certs.yaml).
# Lives here rather than in the wedge-buster kustomization because that
# kustomization's `namespace: kube-system` transformer would override the
# `cdi` namespace on these. Scoped to pods-in-cdi only — the cluster-wide
# wedge-buster ClusterRole stays deployments-patch-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wedge-buster-cdi-pods
  namespace: cdi
  labels:
    app.kubernetes.io/name: wedge-buster
    app.kubernetes.io/component: maintenance
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wedge-buster-cdi-pods
  namespace: cdi
  labels:
    app.kubernetes.io/name: wedge-buster
    app.kubernetes.io/component: maintenance
subjects:
  - kind: ServiceAccount
    name: wedge-buster
    namespace: kube-system
roleRef:
  kind: Role
  name: wedge-buster-cdi-pods
  apiGroup: rbac.authorization.k8s.io
