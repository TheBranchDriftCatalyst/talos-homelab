---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    # Pin the VM rollout strategy explicitly to Stage BEFORE any KubeVirt upgrade:
    # v1.6.0 changes the DEFAULT from Stage → LiveUpdate. Stage = VM config changes
    # apply on next restart (safe/predictable); LiveUpdate = hot-apply (needs the
    # VMLiveUpdateFeatures gate + more moving parts). Explicit here so the 1.4→1.9
    # upgrade doesn't silently flip behavior. (TALOS-zadf.31)
    vmRolloutStrategy: Stage
    developerConfiguration:
      featureGates: []
  # 2026-05-30: removed the customizeComponents.patches that forced all
  # virt-api admission webhooks to failurePolicy=Ignore. The original
  # rationale (virt-operator crashlooping → Fail webhooks stalled cluster-
  # wide pod admission) was downstream of TALOS-yyt (CiliumIdentity bloat).
  # With the meltdown cascade fixed, virt-api is stable and Fail is correct:
  # bad VirtualMachine CRs SHOULD be rejected at admission, not silently
  # accepted. virt-operator reconciles the webhooks back to KubeVirt's
  # built-in defaults.
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
