---
# CDI (Containerized Data Importer) — KubeVirt's DataVolume import/upload/clone
# machinery. Vendored upstream release manifest (cdi-operator.yaml, v1.60.3 =
# the exact hand-deployed version being ADOPTED, not upgraded) + the live CR.
# The stale-webhook-cert wedge backstop lives in kube-system/wedge-buster
# (cronjob-cdi-certs); upstream never fixed it (kubevirt#15210).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cdi-operator.yaml
  - cdi-cr.yaml
