---
# CDI custom resource — captured VERBATIM from the live cluster 2026-08-14
# (TALOS-l19s: CDI was hand-deployed ~2026-05 and never committed; Flux now
# owns it). Spec must stay identical to live at adoption time so the operator
# sees no change and nothing restarts. Upgrades: bump cdi-operator.yaml to the
# release matching the KubeVirt hop (TALOS-zxb chain) — v1.63↔KubeVirt 1.6,
# v1.65↔1.8 confirmed pairings.
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
    - HonorWaitForFirstConsumer
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
