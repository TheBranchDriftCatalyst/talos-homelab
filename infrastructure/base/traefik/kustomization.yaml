apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrelease.yaml
  - service-internal.yaml
  - middlewares.yaml
  - tlsstore.yaml
  # *.homepage.talos00 wildcard for the multi-instance Homepage dashboards —
  # the bare *.talos00 wildcard can't cover 2-label board hosts (TALOS-xgrl.18).
  - homepage-wildcard-certificate.yaml
# Note: ${DOMAIN} substitution is handled by Flux postBuild from cluster-settings ConfigMap
# The variable ${DOMAIN} in helmrelease.yaml will be replaced during Flux reconciliation
