---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: traefik
      version: '>=41.0.0 <42.0.0' # Lock to v41.x (Traefik v3.7.x) — TALOS-zadf.19 (was 37.x/v3.6.2)
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h

  install:
    crds: Create
    createNamespace: false

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true

  values:
    # Global settings
    deployment:
      kind: DaemonSet # Use DaemonSet for hostPort binding
      replicas: 1
      # chart v41 moved podLabels under deployment (was top-level). (TALOS-zadf.19)
      podLabels:
        app: traefik
      # Mount the CrowdSec bouncer API key so the bouncer plugin can read it via
      # crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key. (TALOS-pbn)
      additionalVolumes:
        - name: crowdsec-bouncer-key
          secret:
            secretName: crowdsec-bouncer-key
            optional: true # boot even before the secret exists (breaks the crowdsec↔traefik cycle)
        # CA for VERIFYING the CrowdSec LAPI certificate (TALOS-k5vm). Published into every
        # namespace by trust-manager, so traefik needs no cross-namespace copy and picks up
        # CA rotation automatically -- which matters because the previous crowdsec-specific
        # CA expires 2026-12-09 and this bouncer is fail-closed.
        # Mounted here in its OWN commit, BEFORE the middleware starts requiring it: the
        # Middleware CR is dynamic config and applies with no pod restart, so flipping both
        # at once could demand the file before the pods carrying it exist.
        - name: crowdsec-lapi-ca
          configMap:
            name: homelab-ca-bundle
            optional: true

    # Mount for the CrowdSec bouncer key volume above (into the Traefik container).
    additionalVolumeMounts:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        readOnly: true
      - name: crowdsec-lapi-ca
        mountPath: /etc/traefik/crowdsec-ca
        readOnly: true

    # HostPort rollout fix: terminate all old pods before starting new
    # ones. `maxSurge: 1` (the chart default) tries to schedule a new
    # pod alongside the existing one on the same node, which always
    # fails with a hostPort collision on 80/443, so every port-change
    # rollout gets stuck.
    # NOTE: the helm chart reads `updateStrategy` at the TOP LEVEL,
    # not under `deployment:` — nesting it there silently falls back
    # to the chart defaults. See:
    # https://github.com/traefik/traefik-helm-chart/blob/v37.4.0/traefik/values.yaml
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0

    # Service configuration
    service:
      enabled: true
      type: ClusterIP

    # Ports configuration
    ports:
      web:
        port: 80
        exposedPort: 80
        protocol: TCP
        hostPort: 80 # Bind to host port 80
        # Trust Cloudflare + pod proxies' X-Forwarded-For so ClientHost = the real visitor IP
        # (feeds the CrowdSec traefik parser + the bouncer plugin). (TALOS-pbn)
        forwardedHeaders:
          # TALOS-lxz5.1.4: 10.0.0.0/8 REMOVED — trusting the whole pod/service CIDR let any
          # pod forge X-Forwarded-For and impersonate an arbitrary client IP (poisoning
          # CrowdSec ClientHost + arr DisabledForLocalAddresses). Only Cloudflare ranges are
          # trusted now; real ingress transits Cloudflare. In-cluster XFF is no longer honored.
          trustedIPs: &cfTrustedIPs
            - "173.245.48.0/20"
            - "103.21.244.0/22"
            - "103.22.200.0/22"
            - "103.31.4.0/22"
            - "141.101.64.0/18"
            - "108.162.192.0/18"
            - "190.93.240.0/20"
            - "188.114.96.0/20"
            - "197.234.240.0/22"
            - "198.41.128.0/17"
            - "162.158.0.0/15"
            - "104.16.0.0/13"
            - "104.24.0.0/14"
            - "172.64.0.0/13"
            - "131.0.72.0/22"
            - "2400:cb00::/32"
            - "2606:4700::/32"
            - "2803:f800::/32"
            - "2405:b500::/32"
            - "2405:8100::/32"
            - "2a06:98c0::/29"
            - "2c0f:f248::/32"
      websecure:
        port: 443
        exposedPort: 443
        protocol: TCP
        hostPort: 443 # Bind to host port 443
        forwardedHeaders:
          trustedIPs: *cfTrustedIPs
      traefik:
        port: 9000
        exposedPort: 9000
        protocol: TCP
      metrics:
        port: 9100
        exposedPort: 9100
        protocol: TCP
      # TALOS-a8vo P0-1: the `socks` (:1080) and `httpproxy` (:8080) VPN-proxy
      # entrypoints were REMOVED. They fronted the vpn-gateway gluetun proxy
      # (IngressRouteTCP HostSNI(*), unauthenticated) on node hostPorts, giving any
      # LAN client an open, un-authed pivot INTO the cluster (proved: LAN ->
      # authentik-postgres:5432 + argocd/authentik backends, bypassing forward-auth).
      # No in-cluster workload consumed the proxy Service (repo-grep verified; only
      # homepage's siteMonitor hits the :8000 control API, which is unaffected).
      # gluetun stays consumable in-cluster via `gluetun.vpn-gateway.svc:1080/:8080`
      # (ClusterIP Service retained). The killswitch (FIREWALL_OUTBOUND_SUBNETS) was
      # also tightened to DROP the pod/service CIDRs so even an in-cluster proxy user
      # cannot pivot east-west. See infrastructure/base/vpn-gateway/.
      #
      # TALOS-a8vo P0-4: dedicated LAN-only ingress entrypoints. `web`/`websecure`
      # (:80/:443) stay WAN-facing for the ~11 genuinely-public routes; the internal
      # *.talos00 / *.priv.talos00 routes migrate onto weblan (:8081) / websecurelan
      # (:8443). Isolation = (a) these hostPorts are NOT forwarded by the edge router,
      # so WAN cannot reach them, and (b) a default `lan-only` middleware bound below
      # via additionalArguments. NOTE: per-port hostIP binding is NOT usable here —
      # this is a 5-node DaemonSet and each node has its own LAN IP, so there is no
      # single hostIP; the unforwarded-port + lan-only default is the isolation.
      # These entrypoints are INERT until routes declare them (no router => 404); the
      # route migration is a live, batched cutover run by the main session post-merge.
      # See docs/02-architecture/p0-4-lan-entrypoint-design.md.
      weblan:
        port: 8081
        exposedPort: 8081
        protocol: TCP
        hostPort: 8081
      websecurelan:
        port: 8443
        exposedPort: 8443
        protocol: TCP
        hostPort: 8443
      # Neo4j Bolt entrypoint — terminates raw Bolt TCP at 7687 for
      # catalyst-data's Neo4j Browser ingress (IngressRouteTCP). Without this,
      # http://neo4j.talos00 can load the browser SPA but queries over Bolt fail.
      bolt:
        port: 7687
        exposedPort: 7687
        protocol: TCP
        hostPort: 7687
        expose:
          default: true
      # Cowrie honeypot — removed from Traefik, using hostPort on deployment directly
    # Enable dashboard. TALOS-lxz5.1 (5.1.1): the dashboard + api@internal were
    # previously served unauthenticated on the plaintext `web` (:80) entrypoint and
    # reachable from the internet (GET /api/rawdata -> 200). It is now HTTPS-only on
    # `websecure` and gated by defense-in-depth middleware: `lan-only` (RFC1918 source
    # ranges, ns traefik) restricts to the LAN, then the `authentik` forward-auth
    # middleware (ns authentik) requires SSO login. Mirrors the crowdsec.talos00 admin
    # UI pattern. --api.insecure was also removed (see additionalArguments).
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${DOMAIN}`)
        entryPoints: ['websecure']
        middlewares:
          - name: lan-only
            namespace: traefik
          - name: authentik
            namespace: authentik

    # Enable access logs. JSON format + kept fields so the CrowdSec `crowdsecurity/traefik`
    # parser can read `ClientHost` (the real visitor IP). Still writes to stdout → Loki. (TALOS-pbn)
    # chart v41 renamed these: logs.general→log, logs.access→accessLog, defaultmode→defaultMode. (TALOS-zadf.19)
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        headers:
          # CrowdSec uses request_User-Agent; its other inputs are native fields.
          # Do not retain cookies, authorization, API keys, or response cookies.
          defaultMode: drop
          names:
            User-Agent: keep

    # Providers
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false

    # Additional arguments
    additionalArguments:
      # --serversTransport.insecureSkipVerify=true REMOVED (TALOS-pnyo). It disabled
      # certificate verification for EVERY https backend Traefik proxies to, cluster-wide,
      # which is the broadest instance of that pattern in this repo.
      #
      # Safe to drop because it was inert: verified that NOTHING currently uses it. No live
      # IngressRoute declares scheme: https or references a ServersTransport (0 of them), no
      # ServersTransport CRs exist, the single Ingress object carries no backend-protocol
      # annotation, and every forwardAuth address is plain http:// with tls=False. The
      # `scheme: https` hits elsewhere in this repo are ServiceMonitors and a client-facing
      # redirect, neither of which is a Traefik backend connection.
      #
      # Removing it matters for what comes NEXT rather than today: with the flag present, the
      # first https backend anyone adds would be proxied without verification and nothing
      # would say so. Without it, Traefik verifies by default, and a backend with a private
      # CA fails LOUDLY -- fix that with an explicit ServersTransport carrying rootCAs (or
      # insecureSkipVerify scoped to that one backend), never by restoring this global flag.
      # TALOS-lxz5.1 (5.1.1): --api.insecure removed. It exposed the full Traefik
      # API (incl. /api/rawdata) unauthenticated. The dashboard is now served only via
      # the authenticated websecure IngressRoute above; api@internal still backs it.
      - --api.dashboard=true
      # Bind the CrowdSec bouncer on both entrypoints — ALL ingress checked against
      # CrowdSec decisions before reaching services. Key verified mounted at
      # /etc/traefik/crowdsec/lapi-key (64 bytes) + bouncer "traefik" registered with
      # LAPI.
      #
      # FAIL-CLOSED, not fail-open (corrected TALOS-cscw). bouncer-middleware.yaml sets
      # updateMaxFailure: 5 with a 60s refresh and streamStartupBlock: true -- so after
      # ~5 minutes of an unreachable LAPI, and during startup, ingress is BLOCKED rather
      # than allowed. This comment previously said FAIL-OPEN, which is exactly the wrong
      # thing to read while debugging "everything returns 429" during a LAPI outage.
      #
      # Only LAN (192.168.0.0/16) bypasses via clientTrustedIPs -- that is the recovery
      # path. Pods do NOT: 10.0.0.0/8 was deliberately removed so a compromised pod
      # cannot forge X-Forwarded-For to exempt itself.
      # TALOS-e9h / TALOS-pbn.
      #
      # TALOS-lxz5.2 / 5.2.3: `traefik-strip-authentik-headers` runs FIRST on both
      # entrypoints so every inbound request has its client-supplied X-authentik-*
      # identity headers cleared BEFORE routing and BEFORE any forward-auth. This
      # stops a client forging `X-authentik-username: admin` to a backend that trusts
      # the header (Frigate proxy.header_map, etc.), including on un-gated routes. The
      # `authentik` forward-auth middleware re-adds the real values from the outpost
      # (authResponseHeaders) on gated routes, so SSO is unaffected. NOTE: these two
      # CLI flags are authoritative for entrypoint middlewares and override any
      # `ports.<ep>.middlewares` chart value — keep the full ordered list here.
      - --entrypoints.web.http.middlewares=traefik-strip-authentik-headers@kubernetescrd,traefik-bouncer@kubernetescrd
      - --entrypoints.websecure.http.middlewares=traefik-strip-authentik-headers@kubernetescrd,traefik-bouncer@kubernetescrd
      # TALOS-a8vo P0-4: the LAN entrypoints (weblan/websecurelan) carry the same
      # strip+bouncer chain PLUS a default `lan-only` (RFC1918 source ranges). Because
      # an entrypoint-default middleware applies to EVERY router on the entrypoint and
      # cannot be opted out per-router, this is safe ONLY here where every route is an
      # internal *.talos00 route — the ~11 genuinely-public routes stay on web/websecure
      # (which must NOT carry lan-only, or Cloudflare/WAN clients would be blocked).
      # This is why a dedicated entrypoint is used instead of inverting the web/websecure
      # default to lan-only. lan-only still admits the pod CIDR (10.0.0.0/8) — east-west
      # residue tracked as the P1 pod-CIDR-exclusion follow-up.
      - --entrypoints.weblan.http.middlewares=traefik-strip-authentik-headers@kubernetescrd,traefik-bouncer@kubernetescrd,traefik-lan-only@kubernetescrd
      - --entrypoints.websecurelan.http.middlewares=traefik-strip-authentik-headers@kubernetescrd,traefik-bouncer@kubernetescrd,traefik-lan-only@kubernetescrd

    # Security context - needed for hostPort
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      readOnlyRootFilesystem: false
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0

    podSecurityContext:
      fsGroup: 0
      runAsUser: 0
      runAsNonRoot: false

    # Resources. Measured 7d to 2026-08-24: p50 314Mi, peak 335Mi per pod --
    # flat at 1.07x, because Traefik holds its router/service table resident
    # and this cluster's route count is stable.
    #
    # request == limit at 512Mi (1.53x peak). Flatness is what makes req==lim
    # cheap here: there is no burst to accommodate, so pinning costs nothing
    # and gives the strongest eviction protection available to the ingress
    # path. Losing Traefik on a node takes every IngressRoute on it down.
    #
    # The old 128Mi request against 314Mi steady state under-declared the
    # DaemonSet by ~930Mi across five nodes. No cpu limit -- throttling the
    # ingress proxy is worse than anything the limit would prevent.
    # (TALOS-gj3n)
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 512Mi

    # Enable Prometheus metrics
    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        # Enable detailed metrics labels for dashboards
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        # Request duration histogram buckets (comma-separated string).
        #
        # The previous value was "0.1,0.3,1.2,5.0" and it made this histogram
        # BLIND. Measured 2026-09-25 before the change:
        #
        #   sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket
        #                     {entrypoint="websecure"}[1h]))
        #     le=0.1  -> 0.827      le=0.3 -> 0.847
        #     le=1.2  -> 0.870      le=5.0 -> 0.873    +Inf -> 0.877
        #
        # 94% of requests landed in the FIRST bucket, so p50, p90 and p99 all
        # reported ~0.1s and nothing below 100ms was distinguishable. That made
        # every latency question about the middleware chain unanswerable -- you
        # could not tell 5ms of body-injection from 80ms of it.
        #
        # CARDINALITY, since addEntryPointsLabels + addRoutersLabels +
        # addServicesLabels are all on above and this cluster has a history of
        # series-count trouble. Measured before: 798 label combinations
        # (198 entrypoint + 358 router + 242 service) x 5 series each = 3,990.
        # After: 798 x 12 = 9,576, so +5,586 series. Against a ~731k-series
        # remote-write WAL that is under 1%. Verified acceptable, not assumed.
        buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10"
        service:
          enabled: true
        # ServiceMonitor for Alloy/Mimir (not kube-prometheus-stack)
        serviceMonitor:
          enabled: false  # We use Alloy scraping instead

    # Tolerations - allow scheduling on control-plane nodes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Namespace
    namespaceOverride: 'traefik'

    # Traefik plugins (Yaegi-loaded from GitHub at startup) powering the central
    # analytics-injection middleware chain (infrastructure/base/analytics/):
    #   rewriteBody     — injects the Plausible <script> before </head> (declared further
    #                     down; shared with the themepark cross-app nav injection)
    #   rewriteHeaders  — additively allows analytics.knowledgedump.space in an app's CSP
    # NOTE: enabling these means each Traefik pod fetches the plugin source on startup, so a
    # rollout needs egress to github.com. The keys here are the names
    # Middleware.spec.plugin.<key> references. TALOS-4gg.
    #
    # `rewritebody` (traefik/plugin-rewritebody v0.3.1) used to be declared here for the
    # analytics injection. REMOVED 2026-09-25: its key differed from the `rewriteBody`
    # below by ONE CAPITAL LETTER and Traefik cannot hold both — it loaded five plugins
    # and silently dropped the lowercase one, so every Middleware referencing it failed
    # with "plugin: unknown plugin type: rewritebody" and Traefik DISABLED those routers.
    # boomtime.knowledgedump.space served a bare 404 for five days while the app itself
    # was healthy (200 on /, /health, /api/health from inside the cluster). Introduced by
    # 3e4dfb31 on 2026-09-20, which added the camelCase plugin without noticing the clash.
    #
    # Analytics now shares the packruler engine, which the comment on that plugin already
    # documents as the safer one: plugin-rewritebody implements no Hijack() (websocket
    # upgrades 500) and buffers EVERY response with no method/content-type gate. Schemas
    # are identical (lastModified + rewrites[{regex,replacement}]), so it was a drop-in.
    experimental:
      plugins:
        rewriteHeaders:
          moduleName: github.com/XciD/traefik-plugin-rewrite-headers
          version: v0.0.4
        # CrowdSec IPS bouncer — the `bouncer` Middleware (infrastructure/base/security/crowdsec/) queries the
        # CrowdSec LAPI to block malicious IPs + forwards to AppSec/WAF. Bound globally once verified
        # (see the entrypoint middlewares in additionalArguments). TALOS-pbn.
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.1
        # Bot Wrangler — serves /robots.txt from the ai-robots-txt list and, for LLM
        # scraper UAs that ignore it, PROXIES them (unbuffered) into the iocaine tarpit
        # via the `bot-wrangler` Middleware. Attached per-route on PUBLIC IngressRoutes
        # (not an entrypoint bind). Like the others, fetched from GitHub at pod start.
        # TALOS-mko.
        botWrangler:
          moduleName: github.com/holysoles/bot-wrangler-traefik-plugin
          version: v0.10.2
        # theme.park CSS injection — powers the Catalyst theme middlewares in
        # infrastructure/base/themepark/middlewares.yaml, replacing the arr-stack
        # DOCKER_MODS overlay. TALOS-1xcd.
        #
        # NOT `rewritebody` for this job, deliberately. plugin-rewritebody v0.3.1
        # implements no Hijack(), so websocket upgrades 500 — that would silently
        # kill Servarr SignalR (the live queue/activity panel), Jellyfin's /socket
        # and Plex's notification socket. It also buffers EVERY response with no
        # method/Accept/content-type gate, so a Range request for video would
        # accumulate in a bytes.Buffer inside a pod pinned at requests==limits==512Mi.
        # This plugin short-circuits non-GET, non-text/html and websocket-upgrade
        # requests onto the ORIGINAL ResponseWriter with zero buffering, and
        # decompresses gzip/deflate itself.
        #
        # v1.4.2 is vendored (vendor/modules.txt present), which is what makes it
        # Yaegi-loadable. Added in its OWN commit with no Middleware referencing it,
        # same discipline as the crowdsec-lapi-ca mount: a plugin Yaegi rejects
        # takes the Traefik process down at start.
        themepark:
          moduleName: github.com/packruler/traefik-themepark
          version: v1.4.2

        # Generic HTML-body rewriting, for the cross-app Catalyst nav bar
        # (infrastructure/base/themepark/middlewares.yaml). The themepark plugin
        # above can only emit <link> tags, and a nav needs real <a href> elements
        # — which CSS cannot create — so the nav ships as a <script> injected here.
        #
        # This is the SAME engine that traefik-themepark vendors internally, so it
        # carries the same safety properties that ruled out traefik/plugin-rewritebody
        # for these apps: it implements Hijack() (Servarr SignalR, Jellyfin's
        # /socket and Plex's notification socket keep working) and gates on
        # GET + text/html before buffering anything, so video is never buffered.
        #
        # No vendor/ directory, but go.mod declares zero external dependencies —
        # stdlib and its own subpackages only — so Yaegi resolves it fine.
        rewriteBody:
          moduleName: github.com/packruler/rewrite-body
          version: v1.2.0
