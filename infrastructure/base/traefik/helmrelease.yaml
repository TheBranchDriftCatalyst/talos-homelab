---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: traefik
      version: '>=41.0.0 <42.0.0' # Lock to v41.x (Traefik v3.7.x) — TALOS-zadf.19 (was 37.x/v3.6.2)
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h

  install:
    crds: Create
    createNamespace: false

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true

  values:
    # Global settings
    deployment:
      kind: DaemonSet # Use DaemonSet for hostPort binding
      replicas: 1
      # chart v41 moved podLabels under deployment (was top-level). (TALOS-zadf.19)
      podLabels:
        app: traefik
      # Mount the CrowdSec bouncer API key so the bouncer plugin can read it via
      # crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key. (TALOS-pbn)
      additionalVolumes:
        - name: crowdsec-bouncer-key
          secret:
            secretName: crowdsec-bouncer-key
            optional: true # boot even before the secret exists (breaks the crowdsec↔traefik cycle)

    # Mount for the CrowdSec bouncer key volume above (into the Traefik container).
    additionalVolumeMounts:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        readOnly: true

    # HostPort rollout fix: terminate all old pods before starting new
    # ones. `maxSurge: 1` (the chart default) tries to schedule a new
    # pod alongside the existing one on the same node, which always
    # fails with a hostPort collision on 80/443, so every port-change
    # rollout gets stuck.
    # NOTE: the helm chart reads `updateStrategy` at the TOP LEVEL,
    # not under `deployment:` — nesting it there silently falls back
    # to the chart defaults. See:
    # https://github.com/traefik/traefik-helm-chart/blob/v37.4.0/traefik/values.yaml
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0

    # Service configuration
    service:
      enabled: true
      type: ClusterIP

    # Ports configuration
    ports:
      web:
        port: 80
        exposedPort: 80
        protocol: TCP
        hostPort: 80 # Bind to host port 80
        # Trust Cloudflare + pod proxies' X-Forwarded-For so ClientHost = the real visitor IP
        # (feeds the CrowdSec traefik parser + the bouncer plugin). (TALOS-pbn)
        forwardedHeaders:
          trustedIPs: &cfTrustedIPs
            - "10.0.0.0/8" # pods/services (Cilium, svc 10.96/12)
            - "173.245.48.0/20"
            - "103.21.244.0/22"
            - "103.22.200.0/22"
            - "103.31.4.0/22"
            - "141.101.64.0/18"
            - "108.162.192.0/18"
            - "190.93.240.0/20"
            - "188.114.96.0/20"
            - "197.234.240.0/22"
            - "198.41.128.0/17"
            - "162.158.0.0/15"
            - "104.16.0.0/13"
            - "104.24.0.0/14"
            - "172.64.0.0/13"
            - "131.0.72.0/22"
            - "2400:cb00::/32"
            - "2606:4700::/32"
            - "2803:f800::/32"
            - "2405:b500::/32"
            - "2405:8100::/32"
            - "2a06:98c0::/29"
            - "2c0f:f248::/32"
      websecure:
        port: 443
        exposedPort: 443
        protocol: TCP
        hostPort: 443 # Bind to host port 443
        forwardedHeaders:
          trustedIPs: *cfTrustedIPs
      traefik:
        port: 9000
        exposedPort: 9000
        protocol: TCP
      metrics:
        port: 9100
        exposedPort: 9100
        protocol: TCP
      # VPN proxy entrypoints
      socks:
        port: 1080
        exposedPort: 1080
        protocol: TCP
        hostPort: 1080
        expose:
          default: true
      httpproxy:
        port: 8080
        exposedPort: 8080
        protocol: TCP
        hostPort: 8080
        expose:
          default: true
      # Neo4j Bolt entrypoint — terminates raw Bolt TCP at 7687 for
      # catalyst-data's Neo4j Browser ingress (IngressRouteTCP). Without this,
      # http://neo4j.talos00 can load the browser SPA but queries over Bolt fail.
      bolt:
        port: 7687
        exposedPort: 7687
        protocol: TCP
        hostPort: 7687
        expose:
          default: true
      # Cowrie honeypot — removed from Traefik, using hostPort on deployment directly
    # Enable dashboard
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${DOMAIN}`)
        entryPoints: ['web']

    # Enable access logs. JSON format + kept fields so the CrowdSec `crowdsecurity/traefik`
    # parser can read `ClientHost` (the real visitor IP). Still writes to stdout → Loki. (TALOS-pbn)
    # chart v41 renamed these: logs.general→log, logs.access→accessLog, defaultmode→defaultMode. (TALOS-zadf.19)
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        headers:
          defaultMode: keep

    # Providers
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false

    # Additional arguments
    additionalArguments:
      - --serversTransport.insecureSkipVerify=true # For self-signed certs
      - --api.insecure=true # Enable insecure API (homelab only)
      - --api.dashboard=true
      # Bind the CrowdSec bouncer on both entrypoints — ALL ingress checked against
      # CrowdSec decisions before reaching services. Key verified mounted at
      # /etc/traefik/crowdsec/lapi-key (64 bytes) + bouncer "traefik" registered with
      # LAPI. FAIL-OPEN (bouncer-middleware.yaml); LAN/pods in clientTrustedIPs bypass.
      # TALOS-e9h / TALOS-pbn.
      - --entrypoints.web.http.middlewares=traefik-bouncer@kubernetescrd
      - --entrypoints.websecure.http.middlewares=traefik-bouncer@kubernetescrd

    # Security context - needed for hostPort
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      readOnlyRootFilesystem: false
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0

    podSecurityContext:
      fsGroup: 0
      runAsUser: 0
      runAsNonRoot: false

    # Resources
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

    # Enable Prometheus metrics
    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        # Enable detailed metrics labels for dashboards
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        # Request duration histogram buckets (comma-separated string)
        buckets: "0.1,0.3,1.2,5.0"
        service:
          enabled: true
        # ServiceMonitor for Alloy/Mimir (not kube-prometheus-stack)
        serviceMonitor:
          enabled: false  # We use Alloy scraping instead

    # Tolerations - allow scheduling on control-plane nodes
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # Namespace
    namespaceOverride: 'traefik'

    # Traefik plugins (Yaegi-loaded from GitHub at startup) powering the central
    # analytics-injection middleware chain (infrastructure/base/analytics/):
    #   rewritebody     — injects the Plausible <script> before </head> in HTML responses
    #   rewriteHeaders  — additively allows analytics.knowledgedump.space in an app's CSP
    # NOTE: enabling these means each Traefik pod fetches the plugin source on startup, so a
    # rollout needs egress to github.com. The keys here (rewritebody/rewriteHeaders) are the
    # names Middleware.spec.plugin.<key> references. TALOS-4gg.
    experimental:
      plugins:
        rewritebody:
          moduleName: github.com/traefik/plugin-rewritebody
          version: v0.3.1
        rewriteHeaders:
          moduleName: github.com/XciD/traefik-plugin-rewrite-headers
          version: v0.0.4
        # CrowdSec IPS bouncer — the `bouncer` Middleware (infrastructure/base/crowdsec/) queries the
        # CrowdSec LAPI to block malicious IPs + forwards to AppSec/WAF. Bound globally once verified
        # (see the entrypoint middlewares in additionalArguments). TALOS-pbn.
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.1
        # Bot Wrangler — serves /robots.txt from the ai-robots-txt list and, for LLM
        # scraper UAs that ignore it, PROXIES them (unbuffered) into the iocaine tarpit
        # via the `bot-wrangler` Middleware. Attached per-route on PUBLIC IngressRoutes
        # (not an entrypoint bind). Like the others, fetched from GitHub at pod start.
        # TALOS-mko.
        botWrangler:
          moduleName: github.com/holysoles/bot-wrangler-traefik-plugin
          version: v0.10.2
