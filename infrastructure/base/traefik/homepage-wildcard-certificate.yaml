---
# Wildcard certificate for *.homepage.talos00 (multi-instance Homepage dashboards).
# Signed by the homelab internal CA (homelab-ca-issuer ClusterIssuer).
#
# WHY a dedicated cert: the bare *.talos00 wildcard (talos00-wildcard-tls) only
# matches SINGLE-label hosts, so it covers homepage.talos00 (master) but NOT the
# 2-label boards apps.homepage.talos00 / arrs.homepage.talos00 / … . This cert's
# `*.homepage.talos00` SAN covers every board; `homepage.talos00` is added too so
# master is served from the same cert for uniformity. (TALOS-xgrl.18)
#
# Stored in the traefik namespace so Traefik auto-discovers the issued secret via
# SNI once it is registered in the default TLSStore (tlsstore.yaml). Any homepage
# IngressRoute with websecure + tls:{} then serves it automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homepage-talos00-wildcard
  namespace: traefik
spec:
  secretName: homepage-talos00-wildcard-tls
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.homepage.talos00"
    - "homepage.talos00"
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days before expiry
