---
# descheduler — hourly pod-COUNT rebalancer (kubernetes-sigs/descheduler). [TALOS-wnsq]
#
# ============================================================================
# WHY THIS EXISTS — THIS IS A DATA-PROTECTION FIX, NOT TIDINESS.
# ============================================================================
#
# talos02-gpu sat at 109/110 pods — 99% of the kubelet maxPods ceiling — while using only
# ~37% of its memory. Once a node reaches maxPods the kubelet REJECTS every new pod:
#
#   "Pod was rejected: Node didn't have enough resource: pods, requested: 1, used: 110,
#    capacity: 110"
#
# Velero's node-agent creates a short-lived backup-helper pod per PodVolumeBackup. On a
# node at the ceiling those helpers cannot be admitted, so the failure chain is:
#
#   backup-helper rejected
#     -> 22 of 67 PodVolumeBackups Canceled
#       -> parent Backup waits 4h then errors
#          "timed out waiting for all PodVolumeBackups to complete"
#         -> daily backup PartiallyFailed, three days running
#            (2026-08-19, -20, -21; the 2026-08-18 run was clean).
#
# A pod-COUNT imbalance is silently eating our backup coverage. That is the bug this
# component fixes. Rebalancing here is restoring data protection, not housekeeping.
#
# ROOT CAUSE: kube-scheduler balances by RESOURCE REQUESTS, never by pod COUNT. The two
# 61Gi nodes (talos02-gpu, talos06) keep winning NodeResourcesFit scoring and keep
# attracting pods until they hit the pod ceiling with memory to spare. ~10% of running
# pods (33/313) declare no requests at all, which makes that scoring blinder still.
# Nothing in stock Kubernetes ever moves a pod after placement — hence the descheduler.
#
# NOTE ON THE ALTERNATIVE FIX: raising kubelet maxPods above 110 would also stop the
# rejections, but that lives in Talos machine config under configs/ which is GITIGNORED
# in this repo — applying it would be live-only drift with no GitOps record. Tracked
# separately; this component is the in-repo, reconcilable half of the fix.
#
# ============================================================================
# WHY A CRONJOB, NOT THE CONTINUOUS DEPLOYMENT
# ============================================================================
# The chart can run either. We deliberately run the CronJob form:
#   - Bounded blast radius: each run is a process that starts, evicts at most a handful
#     of pods, and exits. There is no long-lived controller that can wander.
#   - Observable: one Job per run, one pod log per run, retained in Job history. "What
#     did the balancer do at 14:17?" is answerable by reading one pod's log.
#   - Interruptible: `suspend: true` on the CronJob stops it instantly and completely,
#     with no rollout and no leader-election lease to clean up.
#   - Continuous eviction is churn we do not need. This cluster's imbalance builds up
#     over days, not seconds; an hourly nudge converges in about half a day.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: descheduler
      # prefer-latest: 0.36.0 is the newest chart AND appVersion (released 2026-05-20).
      # This chart ships NO CRDs, so there is no `install.crds` handling to do — same as
      # the metrics-server / crowdsec peers.
      version: '0.36.0'
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: descheduler
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    kind: CronJob # asserted explicitly; see the CronJob rationale in the header
    cronJobApiVersion: batch/v1

    # Hourly at :17 (off the hour so we do not pile onto the other hourly cron work in
    # this cluster), but DELIBERATELY SKIPPING 02:00-06:00 UTC.
    #
    # WHY THE GAP: Velero's schedules fire at 02:00 and 02:30 UTC and the parent Backup
    # will wait up to 4h for its PodVolumeBackups. Evicting a pod mid-PodVolumeBackup
    # CANCELS that PVB — which is precisely the failure mode this component exists to
    # stop. Balancing during the backup window would make the fix its own bug.
    # timeZone pinned so this window can never drift with the controller-manager's TZ.
    schedule: "17 0-1,7-23 * * *"
    timeZone: Etc/UTC
    suspend: false

    # If the controller misses a start (API server blip), only catch up within 5 min —
    # never fire a stale run hours later, possibly inside the backup window.
    startingDeadlineSeconds: 300
    # Hard stop well inside the 1h cadence so two runs can never overlap.
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 3600
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3

    # v=3 prints the per-node utilization table and every eviction decision (including
    # the reason a pod was skipped). That log IS the audit trail for this component.
    cmdOptions:
      v: 3

    # Chart default is 500m/256Mi requests==limits. That is a large reservation for a
    # process that lives ~10s an hour, and reserved-but-idle CPU is part of how we got
    # here. Request small; cap memory only (house style: no CPU limits, they only add
    # throttling).
    # `cpu: null` is REQUIRED, not decoration: Helm deep-merges maps, so omitting the key
    # would leave the chart's default cpu limit of 500m in place.
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: null, memory: 256Mi}

    # Completes the `restricted` PSA set the chart's container securityContext already
    # covers (non-root, no privilege escalation, drop ALL, read-only rootfs).
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    # A ServiceMonitor is deliberately NOT enabled: a CronJob pod lives ~10s, so a 30s
    # scrape would miss most runs. Job success/failure and the pod log are the signal.

    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      # ---- talos00 (control plane) is excluded from the whole policy ----------------
      # talos00 is tainted node-role.kubernetes.io/control-plane:NoSchedule, so nothing
      # we evict can ever land there. But it is at 17/110 pods, 22% cpu, 27% mem — i.e.
      # LowNodeUtilization would happily classify it "underutilized" and use it as the
      # justification to start evicting, toward a node that cannot accept the pods.
      # Filtering it out here means the strategy only ever reasons about real receivers,
      # and it can never try to pack pods onto the control plane.
      nodeSelector: "!node-role.kubernetes.io/control-plane"

      # ---- global cap per run ------------------------------------------------------
      # NOTE: LowNodeUtilization's own `evictionLimits` struct in v0.36 has ONLY a
      # `node` field — there is no `total`. The cluster-wide cap therefore has to live
      # here at the top level. Start conservative: 3 evictions per run, ~19 runs/day.
      maxNoOfPodsToEvictTotal: 3

      # Grace period is deliberately NOT set: leaving it unset makes each pod use its
      # own terminationGracePeriodSeconds, which is what stateful workloads here expect.

      profiles:
        - name: pod-count-balance
          pluginConfig:
            # ================== SAFETY: which pods may be touched ==================
            - name: DefaultEvictor
              args:
                # THE most important safety flag. nodeFit makes the descheduler simulate
                # scheduling the pod elsewhere (taints/tolerations, node affinity,
                # nodeSelector, resource fit) BEFORE evicting, and skip it if there is
                # no viable node. Without this we would happily evict a pod into a
                # permanent Pending. It is also what protects the GPU workloads on
                # talos02-gpu: nothing else in the cluster offers nvidia.com/gpu, so
                # they simply never qualify for eviction.
                nodeFit: true

                # Don't fight in-flight rollouts / freshly Flux-reconciled workloads.
                # A pod younger than 10m is probably still settling; leave it alone.
                minPodAge: 10m

                # Makes the `descheduler.alpha.kubernetes.io/prefer-no-eviction` pod
                # annotation a HARD opt-out rather than a hint (the default,
                # "Preferred", ignores it entirely). Gives every workload owner a
                # per-pod escape hatch that actually works.
                noEvictionPolicy: Mandatory

                podProtections:
                  # v0.36 replaced the old evictXxx booleans with named protections.
                  # FOUR protections are ON BY DEFAULT and listing one here would TURN
                  # IT OFF. We turn off NOTHING — the empty list is the assertion:
                  #   PodsWithLocalStorage -> emptyDir/hostPath pods stay put.
                  #   DaemonSetPods        -> DaemonSets are not movable BY DEFINITION
                  #                           (13 of talos02-gpu's pods are DaemonSet
                  #                           pods; evicting one just respawns it on the
                  #                           same node and wastes an eviction budget).
                  #   SystemCriticalPods   -> priorityClassName system-cluster-critical
                  #                           and system-node-critical are never evicted.
                  #   FailedBarePods       -> pods with no controller owner are never
                  #                           evicted; nothing would recreate them.
                  defaultDisabled: []

                  # ---- the local-path landmine -------------------------------------
                  # PodsWithLocalStorage above covers emptyDir/hostPath but NOT PVCs.
                  # `local-path` is this cluster's DEFAULT StorageClass, is
                  # WaitForFirstConsumer, and every one of its 62 PVs carries a HARD
                  # spec.nodeAffinity to one specific node. Evict such a pod and the
                  # replacement can only ever be scheduled back to that same node — and
                  # if that node stops accepting pods, it is stranded Pending forever.
                  # This repo has already been burned by exactly that: a clickstack
                  # mongo PVC bound to talos00 went permanently Pending once the
                  # control-plane taint came back.
                  #
                  # nodeFit does NOT save us here — it evaluates node predicates, not
                  # PV node affinity — so this protection is the load-bearing guard.
                  #
                  # Scoped to local-path ON PURPOSE rather than protecting all PVC
                  # pods: verified live that every PV on the other classes
                  # (fatboy-nfs-appdata, synology-nfs, tdarr-nfs, tdarr-appdata, and
                  # the unclassed static PVs) is plain NFS to 192.168.1.36 with NO
                  # nodeAffinity, i.e. genuinely movable. Blanket-protecting PVC pods
                  # would freeze most of the fleet and make this component a no-op.
                  extraEnabled:
                    - PodsWithPVC
                  config:
                    PodsWithPVC:
                      protectedStorageClasses:
                        - name: local-path

                # PodDisruptionBudgets: the descheduler evicts through the Eviction API
                # subresource, so the 38 PDBs already in this cluster are enforced by
                # the API server itself — an eviction that would violate a PDB is
                # simply refused. There is no flag to bypass it and we add none.
                #
                # We deliberately do NOT enable the `PodsWithoutPDB` protection: that
                # would protect every pod that LACKS a PDB, which in a homelab is
                # nearly everything, reducing this to a no-op.

            # ================== STRATEGY: balance on pod COUNT ==================
            - name: LowNodeUtilization
              args:
                # Semantics that drive these numbers:
                #   underutilized = BELOW every threshold        (all of cpu AND mem AND pods)
                #   overutilized  = ABOVE any targetThreshold    (cpu OR mem OR pods)
                # Percentages are of ALLOCATABLE, computed from pod REQUESTS (pods =
                # count / 110).
                #
                # Measured distribution on 2026-08-21 (talos00 excluded above):
                #   node          cpu%  mem%  pods
                #   talos01        19    67    40/110 = 36%
                #   talos02-gpu    69    45   109/110 = 99%   <- the problem
                #   talos03        13    64    53/110 = 48%
                #   talos06        74    53    94/110 = 85%   <- next in line
                #
                # `pods` is the whole point — it is the BINDING constraint. cpu and
                # memory are included anyway, and NOT left to default, because an
                # unspecified resource defaults to 100% on both sides and would let the
                # balancer shove pods onto a node that is fine on count but tight on
                # memory.
                thresholds:
                  # cpu 30: comfortably above talos01 (19) and talos03 (13), far below
                  # talos02-gpu (69) and talos06 (74) — cpu never falsely marks a
                  # receiver as busy.
                  cpu: 30
                  # memory 75: THE GUARD FOR talos03. talos03 has only 14Gi allocatable
                  # and is already at 64%; talos01 is at 67%. Once a receiver crosses
                  # 75% memory it stops counting as underutilized, and if BOTH cross it
                  # there are zero receivers and the strategy aborts on its own. That is
                  # a self-limiting brake: rebalancing stops before it can turn a
                  # pod-count problem into a memory problem. 75 rather than 70 because
                  # at 70 talos01 (67) is one small pod from disabling the whole
                  # component — 75 keeps ~1.8Gi of working room on talos01, ~1.1Gi on
                  # talos03.
                  memory: 75
                  # pods 55 (= 60 pods): above talos03's 48% so both light nodes qualify
                  # as receivers, below talos06's 85% so it is never mistaken for one.
                  pods: 55
                targetThresholds:
                  # cpu 80 / memory 80: set ABOVE every current value on purpose. We do
                  # not want cpu or memory to be what triggers eviction today — pod count
                  # is the actual failure. They act as a relief valve: if a node ever
                  # does cross 80% requested memory it becomes an eviction SOURCE, so
                  # the same mechanism drains a genuine memory hotspot.
                  cpu: 80
                  memory: 80
                  # pods 75 (= 83 pods) is the number that matters. It makes
                  # talos02-gpu (99%) and talos06 (85%) sources, and leaves ~27 pods of
                  # headroom below the 110 ceiling — enough that a Velero backup wave
                  # (67 PodVolumeBackups, one helper pod each) can always be admitted.
                  # That headroom IS the fix.
                  pods: 75

                # Conservative on purpose for the first deployment: at most 2 evictions
                # per node per run (capped to 3 cluster-wide by maxNoOfPodsToEvictTotal
                # above). talos02-gpu needs to shed ~26 pods to reach 75%, so this
                # converges over roughly half a day of hourly runs instead of one
                # disruptive stampede. Raise only after several clean runs.
                evictionLimits:
                  node: 2

                # kube-system is excluded from EVICTION. Its pods still COUNT toward
                # node utilization (which is correct — they occupy real pod slots), they
                # are just filtered out before anything is evicted. Cilium, CoreDNS,
                # kube-proxy and friends being bounced by a balancer is a cluster-wide
                # outage risk we take on for exactly zero benefit.
                evictableNamespaces:
                  exclude:
                    - kube-system

          plugins:
            balance:
              enabled:
                - LowNodeUtilization
            # Every other strategy the chart enables by default (RemoveDuplicates,
            # RemovePodsHavingTooManyRestarts, RemovePodsViolatingNodeTaints,
            # RemovePodsViolatingNodeAffinity, RemovePodsViolatingInterPodAntiAffinity,
            # RemovePodsViolatingTopologySpreadConstraint) is OFF. This component has
            # one job. Each of those would evict pods for reasons unrelated to the pod
            # ceiling, and every extra eviction is unexplained churn during an incident.
            deschedule:
              enabled: []
