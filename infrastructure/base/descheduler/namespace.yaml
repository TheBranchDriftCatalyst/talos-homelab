---
apiVersion: v1
kind: Namespace
metadata:
  name: descheduler
  labels:
    app.kubernetes.io/managed-by: flux
    # The descheduler runs non-root, read-only-rootfs, drops ALL caps and (via
    # podSecurityContext in the HelmRelease) sets seccompProfile RuntimeDefault,
    # so it satisfies `restricted` — no reason to grant it anything looser.
    pod-security.kubernetes.io/enforce: restricted
