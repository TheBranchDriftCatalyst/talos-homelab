---
# Kyverno — Kubernetes policy engine (validate / mutate / generate) via YAML policies.
# Installed for the CNPG->dbgate auto-reflection mutating policy (TALOS-7jxm), and reusable
# for other cluster governance. Lean single-replica controllers for a homelab.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: '3.8.2'
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  # KEEP THIS LITERAL. Every other HelmRelease in the repo had its retries stripped in
  # TALOS-a38d.5, because the helmrelease-remediation-defaults Kyverno policy now injects
  # remediation.retries: 3 at admission. This release lives in kyverno, which is in Kyverno's
  # resourceFilters exclusion list, so the webhook NEVER sees it -- removing these lines here
  # would silently drop it to Flux's retries: 0 default, not to 3.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Single replica per controller — homelab, not HA-critical.
    # EXCEPTION: the admission controller is the ONE fail-closed webhook
    # (kyverno-resource-validating-webhook-cfg, failurePolicy=Fail, matching
    # pods/deployments/etc). At replicas=1 a single eviction / node drain /
    # rollout leaves ZERO admission pods and blocks ALL matching create/update
    # cluster-wide until it recovers. Run 2 replicas + a PodDisruptionBudget
    # (minAvailable:1) so a voluntary disruption can never take the last one
    # down. (TALOS-kmjc.7)
    admissionController:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 384Mi}
    backgroundController:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
    reportsController:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
    cleanupController:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
