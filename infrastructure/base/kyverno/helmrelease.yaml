---
# Kyverno — Kubernetes policy engine (validate / mutate / generate) via YAML policies.
# Installed for the CNPG->dbgate auto-reflection mutating policy (TALOS-7jxm), and reusable
# for other cluster governance. Lean single-replica controllers for a homelab.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: '3.8.2'
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Single replica per controller — homelab, not HA-critical.
    admissionController:
      replicas: 1
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 384Mi}
    backgroundController:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
    reportsController:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
    cleanupController:
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
