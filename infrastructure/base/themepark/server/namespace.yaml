---
apiVersion: v1
kind: Namespace
metadata:
  name: themepark
  labels:
    app.kubernetes.io/part-of: themepark
    # Pod Security Standards. NOTE this is deliberately weaker than iocaine's.
    # The upstream theme.park image is a linuxserver alpine-nginx build: its s6
    # init must run as root and must write to /config (it copies the css tree
    # there and runs themes.py against it), so `restricted` is NOT satisfiable
    # without forking the image — which is exactly what this design avoids.
    # Enforce baseline, audit/warn at restricted, and expect the restricted
    # finding to stand.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    goldilocks.fairwinds.com/enabled: 'true'
    goldilocks.fairwinds.com/vpa-update-mode: 'off'
