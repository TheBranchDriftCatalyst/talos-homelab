---
# Default deny. The theme server is a static file server; it needs to talk to
# nothing and nothing but Traefik needs to talk to it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all
  namespace: themepark
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# DNS egress only — required for pod startup.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: themepark
spec:
  endpointSelector:
    matchLabels:
      app: themepark
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# THE allow-apiserver-egress POLICY IS GONE, and that is a privilege reduction, not an
# oversight.
#
# It existed for one reason: the nav-discovery sidecar listed IngressRoutes cluster-wide to
# build the nav manifest, and the default-deny above would otherwise blackhole the call. That
# sidecar is deleted — the catalyst-nav operator is the sole producer of the nav manifest now —
# so nothing in this namespace talks to the apiserver any more. The theme server is a static
# file server again, exactly as the default-deny's comment claims: "it needs to talk to
# nothing and nothing but Traefik needs to talk to it."
#
# If something here ever needs the apiserver again, re-add it deliberately. Do not restore it
# to fix a nav problem: the nav manifest is not produced in this pod.

---
# Ingress on :80 from Traefik only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: themepark
spec:
  endpointSelector:
    matchLabels:
      app: themepark
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
