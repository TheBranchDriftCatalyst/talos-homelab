---
# Default deny. The theme server is a static file server; it needs to talk to
# nothing and nothing but Traefik needs to talk to it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all
  namespace: themepark
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# DNS egress only — required for pod startup.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: themepark
spec:
  endpointSelector:
    matchLabels:
      app: themepark
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Ingress on :80 from Traefik only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: themepark
spec:
  endpointSelector:
    matchLabels:
      app: themepark
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
