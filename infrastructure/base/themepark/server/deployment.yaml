---
# Self-hosted theme.park static server. Serves the CSS that Traefik injects into
# the media apps (see ../middlewares.yaml).
#
# WHY THE STOCK UPSTREAM IMAGE, UNMODIFIED:
# On boot the image's s6 init copies /app/themepark/css -> /config/www/css and
# then runs `python3 themes.py`, which generates a two-line @import stub at
# css/base/<app>/<theme>.css for EVERY (app x theme) pair it finds by listing
# css/theme-options/. So mounting ONE file into that directory yields a
# `catalyst` theme for all ~60 supported apps, generated at runtime, with no
# image build, no registry push and no fork to rebase.
#
# The theme itself is authored in the sister repo workspace/catalyst-themepark
# and vendored here as css/catalyst.css. Do not hand-edit it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: themepark
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
    app.kubernetes.io/part-of: themepark
spec:
  # Two replicas, because this serves a SUBRESOURCE. When it is briefly
  # unavailable the apps do not fail loudly — they just render unthemed, which
  # reads as "the theme broke" rather than "a pod is restarting". A single
  # replica means every rollout is a visible outage.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: themepark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: themepark
        app: themepark
    spec:
      # NO serviceAccountName, deliberately — so this pod runs as the namespace `default` SA,
      # which is bound to nothing. The `themepark-nav` SA that used to be named here existed
      # ONLY to give the deleted nav-discovery sidecar cluster-wide read on IngressRoutes;
      # with the sidecar gone, nothing in this pod talks to the apiserver, and rbac.yaml is
      # deleted rather than left as an unused grant. See the note where the sidecar was.
      containers:
        - name: themepark
          # Pinned by digest, not :latest. There are no semver tags on this repo,
          # and the image CONTENTS determine which themes exist and what the
          # generated stubs @import -- so a silent upstream change could alter or
          # break the rendered theme with no manifest diff. version-checker will
          # flag the pin; that is the intended trade.
          image: ghcr.io/themepark-dev/theme.park:latest@sha256:c8a01c56d27f2e07336e4762fa1bba061c45e054701366fa1ba8d3840d724dfd
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: America/Los_Angeles
            # themes.py writes absolute URLs into themes.json from this. The
            # generated per-app stubs use ROOT-relative @imports and do not care,
            # but the addon/favicon lookup path does.
            - name: TP_DOMAIN
              value: theme.${CLUSTER_DOMAIN}
            - name: TP_SCHEME
              value: https
            # Serve the tree under /catalyst/ IN ADDITION to /. The init script
            # seds the nginx conf, giving `location /catalyst/` plus the sub_filter
            # that rewrites the generated stubs' ROOT-relative imports:
            #     url("/css/  ->  url("/catalyst/css/
            # That rewrite is the whole reason subfolder serving works — without it
            # a stub served under the prefix would @import /css/... from the APP's
            # origin, where nothing answers.
            #
            # DO NOT shorten this to something like `tp`. The init script guards
            # the rewrite with `grep -q "$TP_URLBASE"` against the nginx conf, and
            # `tp` is a substring of `http2 on;` — so it concludes the rewrite has
            # already happened and silently skips it, leaving the prefix at the
            # default /themepark/ with no error anywhere. Any value that appears
            # as a substring of the stock config is a silent no-op.
            - name: TP_URLBASE
              value: catalyst
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # subPath: drop our theme into the image's theme-options directory
            # WITHOUT clobbering the ~30 upstream themes that live alongside it.
            # A subPath mount is frozen at pod start and never sees ConfigMap
            # updates -- which is fine here and in fact required, because
            # themes.py only runs at init. The configMapGenerator hash suffix is
            # what makes an edit roll the pod. See ../server/kustomization.yaml.
            - name: catalyst-theme
              mountPath: /app/themepark/css/theme-options/catalyst.css
              subPath: catalyst.css
              readOnly: true
            # Deliberately NOT under theme-options/: it is not a theme.park
            # theme and must not appear in the generated per-app stubs.
            - name: catalyst-theme
              mountPath: /app/themepark/css/catalyst-nav.css
              subPath: catalyst-nav.css
              readOnly: true
            # Same reasoning as catalyst-nav.css above: NOT under theme-options/.
            # It is one app's base stylesheet, not a theme, and putting it there
            # would make themes.py generate a `catalyst-dbgate` theme stub for
            # all ~60 apps. Its own ConfigMap, not catalyst-theme -- see
            # ../server/kustomization.yaml for the size reason.
            - name: catalyst-dbgate
              mountPath: /app/themepark/css/catalyst-dbgate.css
              subPath: catalyst-dbgate.css
              readOnly: true
            # argocd's base sheet: same shape as dbgate's above — one app's DOM
            # mapping, NOT under theme-options/, its own ConfigMap for the
            # annotation-size ceiling. See ../server/kustomization.yaml.
            - name: catalyst-argocd
              mountPath: /app/themepark/css/catalyst-argocd.css
              subPath: catalyst-argocd.css
              readOnly: true
            # s6 init copies the whole css tree here and runs themes.py against
            # it, so /config MUST be writable. Contents are fully regenerated on
            # every boot -- there is nothing to persist, hence emptyDir and not a
            # PVC. This is also why readOnlyRootFilesystem is not set.
            # Same subPath reasoning as the CSS above: drop one file into the
            # image's resources/ without clobbering what is already there.
            - name: catalyst-nav
              mountPath: /app/themepark/resources/catalyst-nav.js
              subPath: catalyst-nav.js
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Probe the GENERATED file, not `/`. `/` is served straight from the
          # image and would report healthy even if themes.py failed and the
          # catalyst theme did not exist -- which is the only failure that
          # actually matters here.
          readinessProbe:
            httpGet:
              path: /css/base/sonarr/catalyst.css
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /css/theme-options/catalyst.css
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      # THE nav-discovery SIDECAR IS GONE, and this pod no longer produces the nav
      # manifest at all.
      #
      # It used to run `discover.sh` -> `build_nav.py` on a 300-second loop, listing every
      # IngressRoute in the cluster and writing catalyst-nav.json into the emptyDir nginx
      # serves from. That was a SECOND implementation of a derivation the catalyst-nav
      # operator already performs — one in Python here, one in Go there — kept in step only
      # by a byte-for-byte parity task that no CI in this repo runs.
      #
      # /catalyst/resources/catalyst-nav.json is now served by the operator, at the SAME
      # path, through a higher-priority Traefik route:
      #   infrastructure/base/catalyst-nav/operator/public-manifest-route.yaml
      # Nothing on the client side changed — every catalyst-inject-* middleware still
      # injects the same <script> pointing at the same URL.
      #
      # WENT WITH IT: the themepark-nav-discovery ConfigMap, the themepark-nav
      # ServiceAccount and its cluster-wide IngressRoute read RBAC (so this pod no longer
      # talks to the apiserver, and its allow-apiserver-egress CiliumNetworkPolicy is
      # deleted too), and the NAV_REFRESH_SECONDS / NAV_SCOPE env. NAV_SCOPE still exists,
      # on the operator's Deployment, which is now its only reader.
      #
      # WHAT STAYED, and must: the `config` emptyDir below (the image's s6 init copies the
      # css tree into it and runs themes.py, so /config must be writable), and the
      # catalyst-nav.js mount — that is the nav CLIENT, still served from here and still
      # the thing every themed app loads.
      volumes:
        - name: catalyst-theme
          configMap:
            name: themepark-catalyst-css
        - name: catalyst-dbgate
          configMap:
            name: themepark-catalyst-dbgate
        - name: catalyst-argocd
          configMap:
            name: themepark-catalyst-argocd
        - name: catalyst-nav
          configMap:
            name: themepark-catalyst-nav
        # nginx's writable document root. The s6 init copies the image's whole css tree in
        # here and runs themes.py against it, so /config MUST be writable; the contents are
        # fully regenerated on every boot, which is why this is an emptyDir and not a PVC.
        #
        # NO LONGER SHARED WITH ANYTHING. It used to be the handoff between nginx and the
        # nav-discovery sidecar, which wrote catalyst-nav.json into it. With that sidecar
        # deleted this volume has exactly one user again.
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: themepark
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  selector:
    app.kubernetes.io/name: themepark
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
