---
# Self-hosted theme.park static server. Serves the CSS that Traefik injects into
# the media apps (see ../middlewares.yaml).
#
# WHY THE STOCK UPSTREAM IMAGE, UNMODIFIED:
# On boot the image's s6 init copies /app/themepark/css -> /config/www/css and
# then runs `python3 themes.py`, which generates a two-line @import stub at
# css/base/<app>/<theme>.css for EVERY (app x theme) pair it finds by listing
# css/theme-options/. So mounting ONE file into that directory yields a
# `catalyst` theme for all ~60 supported apps, generated at runtime, with no
# image build, no registry push and no fork to rebase.
#
# The theme itself is authored in the sister repo workspace/catalyst-themepark
# and vendored here as css/catalyst.css. Do not hand-edit it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: themepark
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
    app.kubernetes.io/part-of: themepark
spec:
  # Two replicas, because this serves a SUBRESOURCE. When it is briefly
  # unavailable the apps do not fail loudly — they just render unthemed, which
  # reads as "the theme broke" rather than "a pod is restarting". A single
  # replica means every rollout is a visible outage.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: themepark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: themepark
        app: themepark
    spec:
      serviceAccountName: themepark-nav
      containers:
        - name: themepark
          # Pinned by digest, not :latest. There are no semver tags on this repo,
          # and the image CONTENTS determine which themes exist and what the
          # generated stubs @import -- so a silent upstream change could alter or
          # break the rendered theme with no manifest diff. version-checker will
          # flag the pin; that is the intended trade.
          image: ghcr.io/themepark-dev/theme.park:latest@sha256:c8a01c56d27f2e07336e4762fa1bba061c45e054701366fa1ba8d3840d724dfd
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: America/Los_Angeles
            # themes.py writes absolute URLs into themes.json from this. The
            # generated per-app stubs use ROOT-relative @imports and do not care,
            # but the addon/favicon lookup path does.
            - name: TP_DOMAIN
              value: theme.${CLUSTER_DOMAIN}
            - name: TP_SCHEME
              value: https
            # Serve the tree under /catalyst/ IN ADDITION to /. The init script
            # seds the nginx conf, giving `location /catalyst/` plus the sub_filter
            # that rewrites the generated stubs' ROOT-relative imports:
            #     url("/css/  ->  url("/catalyst/css/
            # That rewrite is the whole reason subfolder serving works — without it
            # a stub served under the prefix would @import /css/... from the APP's
            # origin, where nothing answers.
            #
            # DO NOT shorten this to something like `tp`. The init script guards
            # the rewrite with `grep -q "$TP_URLBASE"` against the nginx conf, and
            # `tp` is a substring of `http2 on;` — so it concludes the rewrite has
            # already happened and silently skips it, leaving the prefix at the
            # default /themepark/ with no error anywhere. Any value that appears
            # as a substring of the stock config is a silent no-op.
            - name: TP_URLBASE
              value: catalyst
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # subPath: drop our theme into the image's theme-options directory
            # WITHOUT clobbering the ~30 upstream themes that live alongside it.
            # A subPath mount is frozen at pod start and never sees ConfigMap
            # updates -- which is fine here and in fact required, because
            # themes.py only runs at init. The configMapGenerator hash suffix is
            # what makes an edit roll the pod. See ../server/kustomization.yaml.
            - name: catalyst-theme
              mountPath: /app/themepark/css/theme-options/catalyst.css
              subPath: catalyst.css
              readOnly: true
            # Deliberately NOT under theme-options/: it is not a theme.park
            # theme and must not appear in the generated per-app stubs.
            - name: catalyst-theme
              mountPath: /app/themepark/css/catalyst-nav.css
              subPath: catalyst-nav.css
              readOnly: true
            # s6 init copies the whole css tree here and runs themes.py against
            # it, so /config MUST be writable. Contents are fully regenerated on
            # every boot -- there is nothing to persist, hence emptyDir and not a
            # PVC. This is also why readOnlyRootFilesystem is not set.
            # Same subPath reasoning as the CSS above: drop one file into the
            # image's resources/ without clobbering what is already there.
            - name: catalyst-nav
              mountPath: /app/themepark/resources/catalyst-nav.js
              subPath: catalyst-nav.js
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Probe the GENERATED file, not `/`. `/` is served straight from the
          # image and would report healthy even if themes.py failed and the
          # catalyst theme did not exist -- which is the only failure that
          # actually matters here.
          readinessProbe:
            httpGet:
              path: /css/base/sonarr/catalyst.css
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /css/theme-options/catalyst.css
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
        # Nav discovery. Writes catalyst-nav.json into the SAME emptyDir nginx
        # serves from, so the manifest is published at
        # /catalyst/resources/catalyst-nav.json with no extra nginx config and
        # no pod restart when apps come or go.
        #
        # The nav is DERIVED, never hardcoded: it is built from the
        # gethomepage.dev/* annotations already on the cluster's IngressRoutes.
        # Theme a new app and it joins the nav on the next refresh.
        - name: nav-discovery
          image: alpine/k8s:1.34.9
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '/nav/discover.sh']
          env:
            - name: NAV_REFRESH_SECONDS
              value: '300'
            # 'themed' (default) lists only apps carrying the Catalyst theme, so
            # every destination looks like the one you came from. 'all' would
            # advertise every gethomepage.dev-enabled route.
            - name: NAV_SCOPE
              value: themed
          securityContext:
            # Must match PUID/PGID above. The s6 init chowns /config to abc
            # (1000:1000), and this container drops ALL capabilities — which
            # removes CAP_DAC_OVERRIDE, the thing that normally lets root ignore
            # file permissions. So running as root here gets "Permission denied"
            # writing the manifest. Owning the uid is the fix; re-adding
            # DAC_OVERRIDE would also work and is strictly worse.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: nav-discovery
              mountPath: /nav
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: catalyst-theme
          configMap:
            name: themepark-catalyst-css
        - name: catalyst-nav
          configMap:
            name: themepark-catalyst-nav
        - name: nav-discovery
          configMap:
            name: themepark-nav-discovery
            defaultMode: 0755
        # Shared between nginx and the discovery sidecar: nginx serves from it,
        # the sidecar writes the nav manifest into it.
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: themepark
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  selector:
    app.kubernetes.io/name: themepark
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
