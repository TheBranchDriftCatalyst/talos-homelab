---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace MUST be set here, and this subdirectory MUST exist separately from
# the parent. Two constraints collide:
#   - kustomize only rewrites a generated ConfigMap reference when the
#     kustomization's namespace matches the consuming object's (same reasoning as
#     infrastructure/base/authentik/login-background/kustomization.yaml).
#   - the Traefik Middlewares in ../middlewares.yaml must live in ns `traefik`.
# One kustomization cannot set both namespaces, so the server gets its own.
namespace: themepark

resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - ingressroute.yaml
  - cilium-network-policy.yaml

# Generated, NOT a static ConfigMap. css/catalyst.css is mounted with subPath,
# and a subPath mount is FROZEN at pod start -- kubelet never propagates
# ConfigMap updates into one. With a stable name an edited theme would never
# reach the running pod, silently. The hash suffix makes an edit change the CM
# name -> the podTemplate -> roll the pod -> re-run themes.py.
configMapGenerator:
  - name: themepark-catalyst-css
    files:
      - css/catalyst.css
      # Nav-bar-only subset: tokens + one font face + the bar. For apps that
      # should get the cross-app nav WITHOUT having their UI restyled.
      - css/catalyst-nav.css
  # Per-app DOM mapping for dbgate, in its OWN ConfigMap rather than alongside
  # the two sheets above. Two reasons, and the second is the load-bearing one:
  #
  #   1. It is not the Catalyst theme. theme.park ships css/base/<app>/<app>-
  #      base.css for 58 apps and dbgate is not among them, so this is the file
  #      that would have come from the image — one app's DOM mapping, authored in
  #      the sister repo (src/app-dbgate.css) and vendored here like the rest.
  #
  #   2. SIZE. The two sheets above are 215 KB together and this one is 46 KB.
  #      Folding it in takes that ConfigMap to 269 KB, past the 256 KiB ceiling
  #      on the kubectl.kubernetes.io/last-applied-configuration annotation —
  #      which would make `kubectl apply -k` on this directory fail outright with
  #      "metadata.annotations: Too long". Flux would not care (kustomize-
  #      controller uses server-side apply and writes no such annotation, and the
  #      1 MiB ConfigMap DATA limit is still far off), so the breakage would show
  #      up only for whoever next tried to apply this by hand while debugging.
  #      Split, every ConfigMap here stays under the ceiling, and the next
  #      per-app sheet gets its own rather than making this worse.
  - name: themepark-catalyst-dbgate
    files:
      - css/catalyst-dbgate.css
  # The nav script. Lands in resources/, which the image's init copies into the
  # served tree — a new top-level directory would NOT be copied, so it has to
  # live under css/ or resources/.
  - name: themepark-catalyst-nav
    files:
      - resources/catalyst-nav.js
  # Discovery sidecar. Builds the nav manifest from the cluster's own
  # gethomepage.dev annotations, so no app is ever named in this repo.
  - name: themepark-nav-discovery
    files:
      - nav/discover.sh
      - nav/build_nav.py
