---
# ONE route publishes /catalyst/ on EVERY host in the cluster.
#
# This replaces a per-app `Host(x) && PathPrefix(/catalyst/)` route that had to
# be copied into every themed app's IngressRoute. That did not scale: theming a
# new app meant editing its manifest in two places and getting both right.
# Here, the assets are simply available everywhere, and theming an app is one
# middleware reference and nothing else.
#
# NO Host matcher on purpose — the rule matches on path alone, so it applies to
# any hostname Traefik serves. Hosts that are not themed simply never request
# these paths.
#
# priority must beat the apps' own catch-all Host() rules, which would otherwise
# swallow /catalyst/ and hand it to the application. Traefik derives priority
# from rule length when unset, and `Host(...)` is longer than this rule, so it
# has to be stated explicitly.
#
# NO auth, deliberately: browsers fetch these as subresources with no session
# and cannot follow a redirect to SSO. It serves static CSS and one script.
#
# ── HOST-GATED, 2026-09-26, AFTER A CONFIRMED PUBLIC DISCLOSURE ──────────────
# Because this route carried no Host matcher it was served on all 28 PUBLIC
# hostnames, and /catalyst/resources/catalyst-nav.json enumerates every
# internal *.talos00 host. Proven from OUTSIDE the network (not from the LAN,
# where router hairpinning makes any test look local): an external fetch of
# https://forge.knowledgedump.space/catalyst/resources/catalyst-nav.json
# returned HTTP 200 with all 25 hostnames.
#
# THE FIRST FIX WAS WRONG AND IS RECORDED HERE SO IT IS NOT RETRIED. Adding the
# `lan-only` ipAllowList middleware did NOT work, because the edge router
# source-NATs inbound WAN traffic: Traefik's own access log shows that external
# request as ClientHost=192.168.1.33 against Host=forge.knowledgedump.space.
# An RFC1918 source check therefore cannot distinguish WAN from LAN anywhere on
# this network, and any route relying on lan-only as its network control is
# relying on nothing. See the separate ticket for the fleet-wide consequences.
#
# The working control is the REQUESTED HOST, which the client cannot launder
# through NAT. HostRegexp keeps the route hostless in spirit — any *.talos00
# host still gets assets with no per-app route — while public hostnames simply
# do not match and fall through to the app's own router.
#
# The CSS and JS leak nothing (nav.js embeds no hostnames; the only .talos00
# string in catalyst.css is a code comment) — the manifest was the whole
# exposure. Gating the entire prefix anyway costs nothing today because NO
# public host is themed, and it makes public theming a deliberate decision. If
# a public host is ever themed, the manifest needs a public/private split
# first, not a relaxation of this rule.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-assets
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/catalyst/`) && HostRegexp(`^[a-z0-9-]+\.talos00$`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: catalyst-compress
          namespace: traefik
        - name: catalyst-asset-cache
          namespace: traefik
      services:
        - name: themepark
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-assets-http
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  entryPoints:
    - web
  routes:
    # Deliberately NOT redirect-https: Plex and Jellyfin are served over plain
    # HTTP, and an HTTPS-only asset origin would leave them unthemed.
    - match: PathPrefix(`/catalyst/`) && HostRegexp(`^[a-z0-9-]+\.talos00$`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: catalyst-compress
          namespace: traefik
        - name: catalyst-asset-cache
          namespace: traefik
      services:
        - name: themepark
          port: 80
