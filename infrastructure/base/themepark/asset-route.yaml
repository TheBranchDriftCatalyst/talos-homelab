---
# ONE route publishes /catalyst/ on EVERY host in the cluster.
#
# This replaces a per-app `Host(x) && PathPrefix(/catalyst/)` route that had to
# be copied into every themed app's IngressRoute. That did not scale: theming a
# new app meant editing its manifest in two places and getting both right.
# Here, the assets are simply available everywhere, and theming an app is one
# middleware reference and nothing else.
#
# NO Host matcher on purpose — the rule matches on path alone, so it applies to
# any hostname Traefik serves. Hosts that are not themed simply never request
# these paths.
#
# priority must beat the apps' own catch-all Host() rules, which would otherwise
# swallow /catalyst/ and hand it to the application. Traefik derives priority
# from rule length when unset, and `Host(...)` is longer than this rule, so it
# has to be stated explicitly.
#
# NO auth, deliberately: browsers fetch these as subresources with no session
# and cannot follow a redirect to SSO. It serves static CSS and one script.
#
# ── TWO CONTROLS, 2026-09-26, AFTER A CONFIRMED PUBLIC DISCLOSURE ───────────
# Because this route carried no Host matcher it was served on all 28 PUBLIC
# hostnames, and /catalyst/resources/catalyst-nav.json enumerates every internal
# *.talos00 host. Proven from outside the network: an external fetch of
# https://forge.knowledgedump.space/catalyst/resources/catalyst-nav.json
# returned HTTP 200 with all 25 hostnames.
#
# BOTH controls are here on purpose, because each defeats the other's bypass:
#
#   HostRegexp — a public hostname does not match, so the accidental exposure
#   above is closed structurally and cannot be laundered through NAT. But
#   Traefik routes on the Host HEADER, which the CLIENT supplies, and :443 on
#   the WAN IP is internet-reachable. Measured against this very rule:
#     curl -k -H 'Host: sonarr.talos00' https://<wan-ip>/catalyst/resources/catalyst-nav.json
#       -> 200, 2118B, the full manifest
#   Host-scoping alone is therefore NOT a network control.
#
#   lan-only — closes that Host-spoof path, because the source address is the
#   one thing the client cannot choose.
#
# A PREVIOUS REVISION REMOVED lan-only ON A FALSE PREMISE. It claimed the edge
# router source-NATs inbound WAN traffic, citing ClientHost=192.168.1.33 for a
# request believed to be external, and concluded "lan-only provides no network
# control anywhere on this network". THAT IS WRONG, and it was wrong about 27
# other routes too. Traefik's access log on the ingress node carries genuine
# off-net clients at their real public addresses — 193.46.255.72, 80.94.95.226,
# 45.141.235.110, 20.169.88.77, 43.132.214.228, 106.75.184.142 — so inbound WAN
# traffic is DNAT-only and the source address survives. 192.168.1.33 is a LAN
# host (1560 requests in the same log); what the router does SNAT is HAIRPINNED
# traffic, which appears as 192.168.1.1 or as the WAN IP 108.64.138.156. That is
# why a `curl --resolve` test run from the LAN passes lan-only unconditionally
# and reads as "the gate is broken".
#
# SO: never verify an IP gate with a --resolve test from the LAN. Assert on
# Traefik's own logged ClientHost, or test from a genuinely off-net vantage
# (a phone on cellular).
#
# NOT the whole exposure, and previous revisions of this comment said otherwise:
#   - catalyst.css (server/css/catalyst.css:274) contains a code comment reading
#     "A font at theme.talos00 loaded by sonarr.talos00 fails". That discloses
#     two internal hostnames AND the <app>.talos00 naming convention, which
#     combined with the ~60 app slugs enumerable under /catalyst/css/base/ turns
#     a gated host list into a guessable one.
#   - /catalyst/themes.json is a SECOND manifest-grade leak, 66,055B, in which
#     nearly every line is an absolute https://theme.talos00/css/... URL.
#   - nginx `alias /config/www/` under `location /catalyst/` publishes all 2887
#     files / 108MB the image ships, including themes.py, not just what we
#     inject. Allowlisting the four paths we actually reference is a separate,
#     independent win — see the follow-up ticket.
#
# Gating the entire prefix costs nothing today because NO public host is themed,
# and it makes public theming a deliberate decision. If a public host is ever
# themed, the manifest needs a public/private split first, not a relaxation of
# this rule.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-assets
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/catalyst/`) && HostRegexp(`^[a-z0-9-]+\.talos00$`)
      kind: Rule
      priority: 10000
      middlewares:
        # FIRST: reject before any body/cache work happens.
        - name: lan-only
          namespace: traefik
        - name: catalyst-compress
          namespace: traefik
        - name: catalyst-asset-cache
          namespace: traefik
      services:
        - name: themepark
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-assets-http
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  entryPoints:
    - web
  routes:
    # Deliberately NOT redirect-https: Plex and Jellyfin are served over plain
    # HTTP, and an HTTPS-only asset origin would leave them unthemed.
    - match: PathPrefix(`/catalyst/`) && HostRegexp(`^[a-z0-9-]+\.talos00$`)
      kind: Rule
      priority: 10000
      middlewares:
        # FIRST: reject before any body/cache work happens.
        - name: lan-only
          namespace: traefik
        - name: catalyst-compress
          namespace: traefik
        - name: catalyst-asset-cache
          namespace: traefik
      services:
        - name: themepark
          port: 80
---
# ── PUBLIC forge theme assets (TALOS-6nf) — TIGHT ALLOWLIST ──────────────────
# The gated routes above serve the WHOLE /catalyst/ tree, but ONLY on *.talos00
# + lan-only (nav.json/themes.json enumerate internal hosts — see the disclosure
# writeup above). To theme the PUBLIC forge (forge.knowledgedump.space) WITHOUT
# reopening that, serve ONLY the two stylesheets catalyst-inject-gitea-public
# injects, by EXACT Path (never PathPrefix) — so nav.json, themes.json and the
# rest of the 108MB tree stay 404 on the public host. NO nav bar here (needs the
# manifest public/private split — tracked as the nav-split epic). NO lan-only:
# deliberately internet-facing; CSS carries no host data (catalyst.css's one
# internal-host comment was scrubbed). Verify from off-net that ONLY these two
# paths answer on the public host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-assets-forge-public
  namespace: themepark
  labels:
    app.kubernetes.io/name: themepark
spec:
  entryPoints:
    - websecure
  routes:
    # EXACTLY the 6 files in the gitea theme's @import closure, anchored (^…$) so
    # a ../ path can't match. Verified in-pod: gitea-base.css @imports chroma +
    # monaco_vs_dark (css/base/gitea/) and placeholders + transparent
    # (css/defaults/); catalyst.css is the color theme; none @import further, and
    # all six were leak-scanned clean (no talos00/priv/knowledgedump). Everything
    # else under /catalyst/ — nav.json, themes.json, other theme-options, the rest
    # of the 108MB tree — is NOT matched here and stays 404 on the public host.
    - match: Host(`forge.knowledgedump.space`) && PathRegexp(`^/catalyst/css/(base/gitea/(gitea-base|chroma|monaco_vs_dark)|defaults/(placeholders|transparent)|theme-options/catalyst)\.css$`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: catalyst-compress
          namespace: traefik
        - name: catalyst-asset-cache
          namespace: traefik
      services:
        - name: themepark
          port: 80
