---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NO `namespace:` here on purpose. This kustomization spans two namespaces --
# the server in `themepark`, the injection middlewares in `traefik` -- so it must
# apply no namespace transform and let each child keep its own.

resources:
  - server
  # Declares its own `namespace: themepark`, and this kustomization applies no
  # namespace transform, so it lands correctly from here.
  - asset-route.yaml
  - middlewares.yaml
