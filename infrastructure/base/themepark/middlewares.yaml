---
# Catalyst theming — injected at Traefik, never inside the apps.
#
# HOW TO THEME AN APP: put ONE middleware reference on the route that serves its
# HTML. That is the whole contract.
#
#     middlewares:
#       - name: authentik            # only if the app already had it
#         namespace: authentik
#       - name: catalyst-sonarr      # theme.park supports this app
#         namespace: traefik
#   or
#       - name: catalyst-nav         # nav bar only, app left unstyled
#         namespace: traefik
#
# Those two names are CHAINS. Everything shared — response compression, the
# encoding pin the rewriter needs — lives inside them, so a route never repeats
# the plumbing and changing the plumbing changes every app at once.
#
# Never attach these to a route that only redirects, or to an /api or /feed
# bypass. The plugin no-ops there anyway (it acts only on GET + text/html), but
# a reference that does nothing is a lie in the manifest.
#
# Asset serving is NOT per app: one cluster-wide route publishes /catalyst/ on
# every host. See asset-route.yaml.
#
# ── WHY TWO KINDS ────────────────────────────────────────────────────────────
# `catalyst-<slug>`  full theme + nav. Only for apps theme.park ships a base
#                    stylesheet for, since that sheet is what maps the app's DOM
#                    onto our variables. Without one an app is half-themed, which
#                    looks worse than not themed at all.
# `catalyst-nav`     the cross-app bar and nothing else. The app keeps its own
#                    look entirely. One shared middleware, any number of apps.

---
# ── shared plumbing (referenced only through the chains below) ────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-compress
  namespace: traefik
spec:
  # Re-compress on the way OUT, restoring what catalyst-accept-encoding gives up.
  # Ordered BEFORE it in every chain, which is the only correct order: Traefik
  # runs middlewares forward on the request and in reverse on the response, so
  # this captures the client's real Accept-Encoding before it is overwritten,
  # and compresses the already-rewritten body on the way back.
  compress: {}

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-accept-encoding
  namespace: traefik
spec:
  # The rewriter decodes gzip, deflate and identity — never brotli, which Yaegi
  # has no implementation for. Its own Accept-Encoding narrowing lets brotli
  # through on the header a real browser sends, and it also bails on gzip with
  # chunked transfer (Jellyfin) while coping fine with identity (Plex). Rather
  # than depend on which backend happens to be decodable, ask for none.
  #
  # catalyst-compress above puts the compression back, so this costs nothing on
  # the wire.
  headers:
    customRequestHeaders:
      Accept-Encoding: 'identity'

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-asset-cache
  namespace: traefik
spec:
  # For the /catalyst/ asset route only. The upstream theme.park nginx hardcodes
  # no-store with etag off for everything it serves, so the stylesheet and nav
  # script were refetched in full on every page navigation with revalidation
  # impossible. 5 minutes: navigation is free, and a theme edit still appears
  # without anyone clearing a cache, which matters because the URLs are stable
  # and there is no ETag to revalidate against.
  headers:
    customResponseHeaders:
      Cache-Control: 'public, max-age=300, stale-while-revalidate=3600'
      # nginx also sends these two, and they would override the above.
      Pragma: ''
      Expires: ''

---
# ── nav-only injector: the cross-app bar WITHOUT restyling the app ───────────
#
# This is what most of the cluster gets. It adds the nav bar and nothing else:
# no typography changes, no component restyling, no scanlines. Its stylesheet is
# tokens + one font face + the bar (21KB raw, 11KB on the wire) rather than the
# full 93KB theme.
#
# Use this for any app that should be reachable from the bar but left looking
# like itself — which is most of them, and all of media-experimental and
# media-private.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-inject-nav
  namespace: traefik
spec:
  plugin:
    rewriteBody:
      lastModified: true
      rewrites:
        - regex: '<head>'
          replacement: '<head><script defer src="/catalyst/resources/catalyst-nav.js"></script>'
        - regex: '</head>'
          replacement: '<link rel="stylesheet" type="text/css" href="/catalyst/css/catalyst-nav.css"></head>'

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-nav
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: catalyst-compress
      - name: catalyst-accept-encoding
      - name: catalyst-inject-nav

