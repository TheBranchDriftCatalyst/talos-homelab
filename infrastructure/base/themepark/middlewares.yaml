---
# The cross-app nav bar. ONE middleware, shared by every themed app — unlike the
# theme middlewares above it carries nothing app-specific, because the script
# discovers where it is from location.hostname and discovers where it can go
# from catalyst-nav.json (built by the discovery sidecar from the cluster's own
# gethomepage.dev annotations). No app is named anywhere in this file.
#
# ANCHORED ON THE OPENING <head> TAG, and that choice is load-bearing.
#
# The themepark plugin rewrites </body> for servarr-family apps and </head> for
# the rest. If this middleware targets either of those it competes with the
# theme plugin for the same token on the same response, and only one injection
# survives — which is exactly what happened: Plex got both tags (theme on
# </head>, nav on </body>) while Jellyfin got only the theme, because for
# Jellyfin both plugins wanted </body>.
#
# The opening <head> is touched by neither plugin and appears exactly once in
# every app checked (sonarr, prowlarr, jellyfin, plex). A deferred script in
# <head> is also the canonical placement: it downloads in parallel and runs
# after the document is parsed.
#
# The src is ROOT-RELATIVE, so it loads from the app's own origin via that app's
# PathPrefix(`/catalyst/`) route. That matters beyond certificates here:
# qBittorrent ships a `script-src 'self'` CSP, and a same-origin script
# satisfies it with no CSP rewriting at all.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-nav
  namespace: traefik
spec:
  plugin:
    rewriteBody:
      lastModified: true
      # Gate before buffering: only GET + text/html is ever touched, so video,
      # API traffic and websocket upgrades pass through on the original writer.
      monitor:
        types:
          - text/html
        methods:
          - GET
      rewrites:
        - regex: '<head>'
          replacement: '<head><script defer src="/catalyst/resources/catalyst-nav.js"></script>'
