---
# Catalyst injection: ONE middleware per app, ONE body-rewriting pass.
#
# This deliberately does NOT use the themepark plugin any more. Both it and
# rewriteBody are body rewriters, and chaining them put two buffering rewrites
# on the same response — they nest, and the outer one discards what the inner
# one wrote. It only showed up when the client sent more than one
# Accept-Encoding value, which every real browser does: with a bare
# `Accept-Encoding: gzip` both injections landed, with Chrome's
# `gzip, deflate, br, zstd` the nav script silently vanished while the theme
# survived. A single middleware with two rewrites has no such interaction.
#
# The two anchors are chosen so they can never collide with each other:
#   <head>    -> the nav script, deferred (downloads in parallel, runs after parse)
#   </head> or </body> -> the theme stylesheet
#
# That second choice mirrors what the themepark plugin did and it matters: the
# servarr family gets the stylesheet before </body> so it lands AFTER the app's
# own late-loaded CSS. Putting a Servarr theme in </head> renders half-themed.
#
# Both URLs are ROOT-RELATIVE, served from the app's own origin via its
# PathPrefix(`/catalyst/`) route. Beyond avoiding cross-origin certificate
# trust, that is what makes qBittorrent work: it ships `script-src 'self'`,
# which a same-origin script satisfies with no CSP rewriting at all.
#
# Adding an app: copy a block, change the two slugs. Nothing else.

---
# Force a decodable response encoding. MUST be listed BEFORE the per-app
# middleware on every themed route.
#
# rewriteBody can decode gzip, deflate and identity — never brotli, which Yaegi
# has no implementation for. The plugin is supposed to narrow the request's
# Accept-Encoding itself, and it does for short lists, but with the header a
# real browser sends (`gzip, deflate, br, zstd`) brotli survives; Jellyfin then
# answers `Content-Encoding: br` and the plugin passes the body through
# untouched. Silent: no error, no log, just an unthemed app.
#
# `identity`, not `gzip`. The plugin advertises gzip support and it does work
# for some backends (Plex), but Jellyfin answers gzip + chunked with no
# Content-Length and the plugin then bails before rewriting — NEITHER injection
# fires, silently. Rather than depend on which backend happens to be
# decodable, ask for no compression on the documents we rewrite.
#
# This is the same conclusion infrastructure/base/analytics reached with its
# `strip-accept-encoding` middleware, for the same reason.
#
# COST, stated plainly: this applies to the whole route, so an app's JS/CSS
# bundles also transfer uncompressed — roughly 4-6x on a first load (Jellyfin's
# web bundle is the worst case at ~2MB -> ~10MB). Those assets are
# browser-cached afterwards, and this is a LAN. If that first load ever
# matters, the fix is a higher-priority route covering just the HTML document
# paths so only those drop compression.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-accept-encoding
  namespace: traefik
spec:
  headers:
    customRequestHeaders:
      Accept-Encoding: 'identity'

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: catalyst-jellyfin
  namespace: traefik
spec:
  plugin:
    rewriteBody:
      lastModified: true
      # NO explicit `monitor:` block. The plugin's EnsureDefaults() already
      # sets exactly types=[text/html], methods=[GET] — and spelling it out in
      # the CRD broke gzip handling entirely: Jellyfin (gzip) stopped being
      # injected while Plex (identity) kept working. Nested lists inside a
      # plugin struct do not survive the CRD -> Yaegi round-trip reliably; the
      # same quirk is why this plugin family ships a delimiter workaround for
      # its addons list. Leave the defaults alone.
      rewrites:
        - regex: '<head>'
          replacement: '<head><script defer src="/catalyst/resources/catalyst-nav.js"></script>'
        - regex: '</body>'
          replacement: '<link rel="stylesheet" type="text/css" href="/catalyst/css/base/jellyfin/catalyst.css"></body>'

