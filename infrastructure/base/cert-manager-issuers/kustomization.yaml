---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - homelab-ca-bundle.yaml
  - cluster-issuer.yaml
  - cloudflare-secret.yaml
  - letsencrypt-issuer.yaml
  # talos-private hierarchy wildcard (LAN-only). Replaces kelsboi + amber (TALOS-h4j).
  - priv-wildcard-certificate.yaml
  # DEACTIVATED (TALOS-5j9): amber external routing is off, so don't issue the wildcard cert
  # (avoids the _acme-challenge DNS records). Re-enable on reactivation with the new domain.
  # - amber-wildcard-certificate.yaml # talos-private migration (TALOS-h4j) — *.amber.knowledgedump.space
  - talos00-wildcard-certificate.yaml
  # Derives that certificate's SAN list from the cluster's IngressRoutes, so the
  # Apple-incompatible `*.talos00` wildcard is backed by explicit names without
  # anyone maintaining a list of 93 hostnames by hand.
  - san-discovery/rbac.yaml
  - san-discovery/cronjob.yaml
  - wildcard-certificate.yaml
  - priv-knowledgedump-wildcard-certificate.yaml
  - amberdark-wildcard-certificate.yaml

# The discovery scripts, shipped as a hashed ConfigMap so an edit rolls the
# CronJob's next run rather than silently keeping the old logic.
configMapGenerator:
  - name: talos00-san-scripts
    namespace: cert-manager
    files:
      - san-discovery/refresh_sans.sh
      - san-discovery/derive_sans.py
