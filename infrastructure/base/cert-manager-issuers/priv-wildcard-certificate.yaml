---
# Wildcard cert for the talos-private hierarchy: *.priv.talos00 (homelab-ca, internal).
#
# LAN-only. priv.talos00 is a valid registrable domain (under the PSL default rule
# `talos00` is the public suffix, so priv.talos00 is one level below it) — which means
# a shared Authentik SSO cookie for Domain=priv.talos00 IS accepted, unlike bare
# `talos00` (a public suffix, cookie rejected). Internal homelab-ca issuer (LE can't
# issue for the fake .talos00 TLD). pihole's existing address=/talos00/ wildcard
# already resolves *.priv.talos00 → Traefik.
#
# FUTURE (knowledgedump.space): when we take talos-private public, add a parallel
# *.priv.knowledgedump.space LE cert + Cloudflare DNS + external_host swap. Kept out
# for now (LAN-only). (TALOS-h4j / TALOS-xgrl.13)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: priv-talos00-wildcard
  namespace: traefik
spec:
  secretName: priv-talos00-wildcard-tls
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.priv.talos00"
    - "priv.talos00"
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days before expiry
