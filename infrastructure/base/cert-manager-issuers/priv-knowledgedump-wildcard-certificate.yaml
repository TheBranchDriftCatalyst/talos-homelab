apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: priv-knowledgedump-wildcard
  namespace: traefik
spec:
  secretName: priv-knowledgedump-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.priv.knowledgedump.space"
    - "priv.knowledgedump.space"
  duration: 2160h
  renewBefore: 720h
