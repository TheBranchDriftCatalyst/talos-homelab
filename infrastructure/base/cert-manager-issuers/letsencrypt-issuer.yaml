---
# Let's Encrypt Staging ClusterIssuer (for testing - higher rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging server (use for testing to avoid rate limits)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: djdanielsh@gmail.com # TODO: need to rxtract this to ESO
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
        - knowledgedump.space
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-amberdark
            key: api-token
      selector:
        dnsZones:
        - amberdark.net
---
# Let's Encrypt Production ClusterIssuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    # Production server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: djdanielsh@gmail.com # TODO: need to rxtract this to ESO
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
    # Cloudflare DNS-01 solver for knowledgedump.space
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
        - knowledgedump.space
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-amberdark
            key: api-token
      selector:
        dnsZones:
        - amberdark.net
    # deSEC DNS-01 solver REMOVED 2026-09-06: deSEC is gone. The kelsboi.dedyn.io zone was
    # retired by the talos-private migration (TALOS-h4j) — *.priv.talos00 replaced it, and no
    # Certificate in this repo requests a .dedyn.io name. Leaving the stanza would have left a
    # solver pointing at a webhook that no longer exists.
