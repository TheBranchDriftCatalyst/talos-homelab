---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbgate-connection-sync
  namespace: databases
---
# Discover every CNPG cluster AND every declarative tenant database, cluster-wide.
# `databases` is required since TALOS-clz4: multi-tenant clusters bootstrap a placeholder
# database and declare their real databases as Database CRs, so clusters alone no longer
# describe what dbgate should connect to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dbgate-connection-sync
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dbgate-connection-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dbgate-connection-sync
subjects:
  - kind: ServiceAccount
    name: dbgate-connection-sync
    namespace: databases
---
# In `databases`: read the mirrored -app secrets, write the generated connections secret,
# and restart dbgate when the connection set changes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbgate-connection-sync
  namespace: databases
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbgate-connection-sync
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbgate-connection-sync
subjects:
  - kind: ServiceAccount
    name: dbgate-connection-sync
    namespace: databases
