---
# Shared sync script used by BOTH the dbgate-connection-sync CronJob (periodic catch-up, with
# rollout-restart) and the dbgate initContainer (runs on every dbgate (re)deploy → "a deploy =
# a run", no restart needed since the main container envFroms the freshly-written Secret on start).
# Single writer either way — each run rebuilds the COMPLETE set, so even overlapping runs converge.
#
# ONE CONNECTION PER DATABASE, NOT PER CLUSTER (TALOS-clz4).
# This script used to key solely on Cluster.spec.bootstrap.initdb.database, which silently broke
# every multi-tenant cluster. Clusters following the placeholder-bootstrap pattern — bootstrap a
# throwaway database purely so CNPG mints the -app secret, then declare the real tenants as
# Database CRs — reported the PLACEHOLDER as their database. dbgate connected fine and showed an
# empty schema, which reads to a user as "dbgate cannot open the database".
#
# Concretely, before this fix: media/arr-postgres offered `arrstack` (0 tables) while
# prowlarr-main, prowlarr-log, radarr-main, radarr-log, sonarr-main and sonarr-log had no
# connection at all; catalyst-data offered `kgapp` and `dagsterapp`, both empty, while
# knowledge_graph and dagster were unreachable.
#
# So the database list per cluster is now the UNION of the initdb database and every Database CR
# pointing at that cluster. Union rather than "prefer Database CRs": there is no reliable way to
# tell a placeholder from a legitimately-used initdb database, and showing one empty extra entry
# is strictly better than hiding one that holds data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbgate-connection-sync-script
  namespace: databases
data:
  sync.sh: |
    #!/bin/sh
    set -eu
    NS=databases
    TMP=$(mktemp -d)
    # discover every CNPG cluster: namespace|name|initdb-database
    kubectl get clusters.postgresql.cnpg.io -A \
      -o jsonpath='{range .items[*]}{.metadata.namespace}|{.metadata.name}|{.spec.bootstrap.initdb.database}{"\n"}{end}' \
      > "$TMP/clusters"
    # discover every declarative tenant database: namespace|cluster|dbname|ensure
    # Tolerate failure so a missing CRD or an RBAC gap degrades to the old initdb-only behaviour
    # instead of resolving zero databases.
    if ! kubectl get databases.postgresql.cnpg.io -A \
      -o jsonpath='{range .items[*]}{.metadata.namespace}|{.spec.cluster.name}|{.spec.name}|{.spec.ensure}{"\n"}{end}' \
      > "$TMP/dbcrs" 2>/dev/null; then
      echo "WARNING: cannot list Database CRs - falling back to initdb databases only"
      : > "$TMP/dbcrs"
    fi
    CONNS=""
    : > "$TMP/data"
    while IFS='|' read -r ns name db; do
      [ -z "$name" ] && continue
      id=$(printf '%s' "$name" | sed -e 's/-postgres$//' -e 's/-db$//' -e 's/[^A-Za-z0-9]/_/g')
      sec="${name}-app"
      user=$(kubectl -n "$NS" get secret "$sec" -o jsonpath='{.data.username}' 2>/dev/null | base64 -d 2>/dev/null || true)
      pass=$(kubectl -n "$NS" get secret "$sec" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null || true)
      if [ -z "$user" ]; then echo "skip $ns/$name (no mirrored $sec yet)"; continue; fi
      [ -z "$db" ] && db=$(kubectl -n "$NS" get secret "$sec" -o jsonpath='{.data.dbname}' 2>/dev/null | base64 -d 2>/dev/null || true)
      [ -z "$db" ] && db="$user"
      # union: initdb database first, then this cluster's Database CRs; awk dedups, keeps order
      {
        [ -n "$db" ] && echo "$db"
        grep "^${ns}|${name}|" "$TMP/dbcrs" 2>/dev/null | while IFS='|' read -r _x _y d ens; do
          [ "$ens" = "absent" ] && continue
          [ -n "$d" ] && echo "$d"
        done
      } | awk 'NF && !seen[$0]++' > "$TMP/dbs"
      ndb=$(wc -l < "$TMP/dbs" | tr -d ' ')
      while read -r d; do
        [ -z "$d" ] && continue
        # Single-database clusters keep their original connection id so existing dbgate state is
        # not renamed out from under the user; only multi-database clusters get a db suffix.
        if [ "$ndb" -gt 1 ]; then
          slug=$(printf '%s' "$d" | sed -e 's/[^A-Za-z0-9]/_/g')
          cid="${id}_${slug}"
        else
          cid="$id"
        fi
        CONNS="${CONNS:+$CONNS,}$cid"
        # KEY=VALUE lines; base64-encoded into `data:` below. One line per key, values
        # are always single-line, so a plain first-= split is safe on read-back.
        {
          echo "ENGINE_$cid=postgres@dbgate-plugin-postgres"
          echo "SERVER_$cid=${name}-rw.${ns}.svc.cluster.local"
          echo "PORT_$cid=5432"
          echo "USER_$cid=$user"
          echo "PASSWORD_$cid=$pass"
          echo "DATABASE_$cid=$d"
          echo "LABEL_$cid=$name/$d ($ns)"
        } >> "$TMP/data"
      done < "$TMP/dbs"
    done < "$TMP/clusters"
    # Never publish an empty set - that would blank dbgate on a transient API failure.
    if [ -z "$CONNS" ]; then
      echo "ERROR: resolved zero connections, refusing to overwrite dbgate-cnpg-connections"
      exit 1
    fi
    HASH=$(md5sum < "$TMP/data" | cut -d' ' -f1)
    OLD=$(kubectl -n "$NS" get secret dbgate-cnpg-connections -o jsonpath='{.metadata.annotations.dbgate\.sync/hash}' 2>/dev/null || true)
    # Emit `data:` with base64 values, NOT `stringData:`. kubectl apply can only prune a key
    # it can see in the live object, and the API server rewrites stringData into data on
    # write - so last-applied tracked stringData while the object held data, the two never
    # correlated, and removed keys were never deleted. Stale ENGINE_/USER_/PASSWORD_ entries
    # (including old passwords) accumulated forever. They were inert, since dbgate only loads
    # ids listed in CONNECTIONS, but they were invisible cruft. Writing data: directly makes
    # the three-way merge prune correctly.
    {
      echo "apiVersion: v1"
      echo "kind: Secret"
      echo "metadata:"
      echo "  name: dbgate-cnpg-connections"
      echo "  namespace: $NS"
      echo "  annotations: { dbgate.sync/hash: \"$HASH\" }"
      echo "data:"
      echo "  CONNECTIONS: $(printf '%s' "$CONNS" | base64 | tr -d '\n')"
      while IFS= read -r line; do
        [ -z "$line" ] && continue
        k=${line%%=*}
        v=${line#*=}
        echo "  $k: $(printf '%s' "$v" | base64 | tr -d '\n')"
      done < "$TMP/data"
    } > "$TMP/secret.yaml"
    kubectl apply -f "$TMP/secret.yaml"
    echo "connections: [$CONNS]"
    # DO_RESTART=true (CronJob): roll dbgate when the set changed. initContainer sets false —
    # the main container will envFrom the freshly-written Secret when it starts.
    if [ "${DO_RESTART:-true}" = "true" ] && [ "$HASH" != "$OLD" ]; then
      echo "connection set changed -> rolling dbgate"
      kubectl -n "$NS" rollout restart deploy/dbgate
    else
      echo "no restart (DO_RESTART=${DO_RESTART:-true})"
    fi
