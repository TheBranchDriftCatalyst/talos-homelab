---
# CloudNativePG Operator
# Provides: Cluster, Backup, ScheduledBackup, Pooler CRDs
# Docs: https://cloudnative-pg.io/documentation/
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: databases
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: databases
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: '0.29.0'
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: databases
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Operator configuration
    replicaCount: 1

    # Measured 7d to 2026-08-24: p50 122Mi, peak 188Mi (1.5x). The 128Mi
    # request sat just above p50 with no ceiling at all.
    # request == limit at 256Mi (1.36x peak): the CNPG operator reconciles
    # all 15 Postgres clusters, and its eviction stalls every failover,
    # backup and switchover in the cluster at once. Flat enough to pin.
    # (TALOS-gj3n)
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi

    # Monitoring - enable Prometheus metrics
    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
        namespace: monitoring

    # Config - watch all namespaces for Cluster CRs
    config:
      create: true
      data:
        # Enable inherited annotations/labels on managed resources
        INHERITED_ANNOTATIONS: "app.kubernetes.io/*"
        INHERITED_LABELS: "app.kubernetes.io/*"

    # Webhook failurePolicy reverted to chart default (Fail) on 2026-05-30
    # after TALOS-yyt identified the real root cause (CiliumIdentity bloat
    # saturating etcd) and fixed it. The original Ignore patch was applied
    # 2026-05-29 because cnpg-operator was crashlooping and its Fail
    # webhooks were stalling cluster-wide pod admission for 10s × 7 hooks.
    # With the meltdown cascade eliminated, cnpg-operator is stable and
    # Fail is correct — we want validation to actually run.
