---
# Traefik IngressRoute for DbGate (LAN via dbgate.talos00)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dbgate
  namespace: databases
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "DbGate"
    gethomepage.dev/description: "Web database manager"
    gethomepage.dev/group: "Databases"
    gethomepage.dev/icon: "dbgate.png"
    gethomepage.dev/href: "http://dbgate.talos00"
    gethomepage.dev/siteMonitor: "http://dbgate.databases.svc.cluster.local:3000"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dbgate.talos00`)
      kind: Rule
      services:
        - name: dbgate
          port: 3000
