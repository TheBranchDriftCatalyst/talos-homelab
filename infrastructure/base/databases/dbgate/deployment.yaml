---
# DbGate - Lightweight web-based database management UI
# Supports PostgreSQL, MongoDB, MySQL, SQLite. Docs: https://dbgate.org/
# Promoted out of scratch into the databases namespace (TALOS-zadf) — lives alongside the
# CNPG / MongoDB / MinIO operators as the fleet's DB GUI. Fresh data volume on the move
# (old scratch connections not carried over; re-add as needed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbgate
  namespace: databases
  labels:
    app.kubernetes.io/name: dbgate
    app.kubernetes.io/component: database-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbgate
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: dbgate
          image: dbgate/dbgate:7.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Enable web mode
            - name: WEB_ROOT
              value: "/"
            # No login (LAN-only via dbgate.talos00 / *.talos00 hosts entry)
            - name: LOGINS
              value: ""
            # ---- Auto-linked CNPG Postgres connections (TALOS-7jxm) ----
            # Creds come from the reflector-mirrored <cluster>-app secrets in THIS namespace
            # (Kyverno annotates them → reflector mirrors them here). dbgate env format is
            # <PARAM>_<id>. See docs/patterns/cross-namespace-secret-reflection.md.
            - name: CONNECTIONS
              value: "crowdsec,forgejo,boomtime,homeassistant"
            - name: LABEL_crowdsec
              value: "crowdsec (CNPG)"
            - name: ENGINE_crowdsec
              value: "postgres@dbgate-plugin-postgres"
            - name: SERVER_crowdsec
              value: "crowdsec-postgres-rw.crowdsec.svc.cluster.local"
            - name: PORT_crowdsec
              value: "5432"
            - name: USER_crowdsec
              valueFrom: { secretKeyRef: { name: crowdsec-postgres-app, key: username } }
            - name: PASSWORD_crowdsec
              valueFrom: { secretKeyRef: { name: crowdsec-postgres-app, key: password } }
            - name: DATABASE_crowdsec
              valueFrom: { secretKeyRef: { name: crowdsec-postgres-app, key: dbname } }
            - name: LABEL_forgejo
              value: "forgejo (CNPG)"
            - name: ENGINE_forgejo
              value: "postgres@dbgate-plugin-postgres"
            - name: SERVER_forgejo
              value: "forgejo-postgres-rw.forgejo.svc.cluster.local"
            - name: PORT_forgejo
              value: "5432"
            - name: USER_forgejo
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: username } }
            - name: PASSWORD_forgejo
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: password } }
            - name: DATABASE_forgejo
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: dbname } }
            - name: LABEL_boomtime
              value: "boomtime (CNPG)"
            - name: ENGINE_boomtime
              value: "postgres@dbgate-plugin-postgres"
            - name: SERVER_boomtime
              value: "boomtime-postgres-rw.boomtime.svc.cluster.local"
            - name: PORT_boomtime
              value: "5432"
            - name: USER_boomtime
              valueFrom: { secretKeyRef: { name: boomtime-postgres-app, key: username } }
            - name: PASSWORD_boomtime
              valueFrom: { secretKeyRef: { name: boomtime-postgres-app, key: password } }
            - name: DATABASE_boomtime
              valueFrom: { secretKeyRef: { name: boomtime-postgres-app, key: dbname } }
            - name: LABEL_homeassistant
              value: "homeassistant (CNPG)"
            - name: ENGINE_homeassistant
              value: "postgres@dbgate-plugin-postgres"
            - name: SERVER_homeassistant
              value: "homeassistant-postgres-rw.home-automation.svc.cluster.local"
            - name: PORT_homeassistant
              value: "5432"
            # HA secret is user-provided (only username/password) — DB name is static.
            - name: DATABASE_homeassistant
              value: "homeassistant"
            - name: USER_homeassistant
              valueFrom: { secretKeyRef: { name: homeassistant-postgres-app, key: username } }
            - name: PASSWORD_homeassistant
              valueFrom: { secretKeyRef: { name: homeassistant-postgres-app, key: password } }
          volumeMounts:
            - name: data
              mountPath: /root/.dbgate
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dbgate-data
