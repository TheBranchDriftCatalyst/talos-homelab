---
# DbGate - Lightweight web-based database management UI
# Supports PostgreSQL, MongoDB, MySQL, SQLite. Docs: https://dbgate.org/
# Promoted out of scratch into the databases namespace (TALOS-zadf) — lives alongside the
# CNPG / MongoDB / MinIO operators as the fleet's DB GUI. Fresh data volume on the move
# (old scratch connections not carried over; re-add as needed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbgate
  namespace: databases
  labels:
    app.kubernetes.io/name: dbgate
    app.kubernetes.io/component: database-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbgate
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      # SA lets the initContainer (and it alone here) discover CNPG clusters + read the mirrored
      # -app secrets + write the connections Secret. (dbgate is a LAN DB-admin GUI that already
      # holds every DB credential, so this is not a meaningful escalation.)
      serviceAccountName: dbgate-connection-sync
      initContainers:
        # "a deploy = a run": regenerate the CNPG connections Secret BEFORE dbgate starts, so
        # every (re)deploy self-syncs — no CronJob lag, never an empty fresh pod. DO_RESTART=false
        # (the main container envFroms the freshly-written Secret on start). Same script the
        # CronJob uses (dbgate-connection-sync-script ConfigMap).
        - name: sync-connections
          image: alpine/k8s:1.31.7
          command: [sh, /scripts/sync.sh]
          env:
            - { name: DO_RESTART, value: "false" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: sync-script, mountPath: /scripts }
            - { name: sync-tmp, mountPath: /tmp }
      securityContext:
        fsGroup: 1000
      containers:
        - name: dbgate
          image: dbgate/dbgate:7.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Enable web mode
            - name: WEB_ROOT
              value: "/"
            # No login (LAN-only via dbgate.talos00 / *.talos00 hosts entry)
            - name: LOGINS
              value: ""
          # ALL CNPG Postgres connections come from a Secret generated by the SINGLE-WRITER
          # dbgate-connection-sync CronJob (../dbgate-connection-sync): it discovers every cnpg
          # Cluster + its reflector-mirrored -app secret and writes the complete dbgate
          # <PARAM>_<id> env into `dbgate-cnpg-connections`. New CNPG clusters appear with ZERO
          # manual changes. optional:true so dbgate boots before the CronJob's first run.
          # (A single writer replaces a Kyverno mutateExisting design that lost connections to
          # concurrent per-secret patches on this one Deployment — see
          # docs/patterns/cross-namespace-secret-reflection.md.)
          envFrom:
            - secretRef:
                name: dbgate-cnpg-connections
                optional: true
          volumeMounts:
            - name: data
              mountPath: /root/.dbgate
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dbgate-data
        - name: sync-script
          configMap:
            name: dbgate-connection-sync-script
        - name: sync-tmp
          emptyDir: {}
