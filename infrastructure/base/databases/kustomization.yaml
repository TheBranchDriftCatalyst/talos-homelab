---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - cloudnative-pg/
  - plugin-barman-cloud/ # CNPG-I backup plugin — replaces in-tree barmanObjectStore (removed in CNPG 1.30)
  - mongodb-operator/ # mongodb-kubernetes (MCK) operator — replaced community-operator (TALOS-zadf.57)
  - minio-operator/
  - mariadb-operator/ # MariaDB/MySQL operator — Youtarr needs MariaDB; CNPG cannot serve it
  - dbgate/ # DB GUI, promoted from scratch (TALOS-zadf)
  - dbgate-connection-sync/ # single-writer CronJob → dbgate-cnpg-connections Secret (TALOS-7jxm)
