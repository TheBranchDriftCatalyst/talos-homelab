---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - quota.yaml
  - rbac.yaml
  - cilium-network-policy.yaml
  - dbgate/ # the tenant's own DB UI (NOT the homelab dbgate)
  - dbgate-connection-sync/ # single-writer → dbgate-cnpg-connections Secret
# NOTE: seed/ is deliberately NOT listed here. It is a SEPARATE Flux Kustomization
# (clusters/catalyst-cluster/teak-talos-dev-seed.yaml) so you can `flux suspend` or delete the
# demo workloads without suspending the namespace scaffolding that the work laptop depends on.
