---
# teak-talos-dev — an isolated work tenant.
#
# The only thing that RUNS here is the tenant's own dbgate (+ its connection-sync CronJob).
# Everything else is a zero-runtime-cost guardrail. The workloads are applied by the work
# laptop (Tilt) and are not managed by Flux at all.
#
# The MVP demo (whoami + CNPG + Dragonfly + RabbitMQ) lived under seed/ and was removed once
# it had proven the tenant works end to end; it is recoverable from git history.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - quota.yaml # blast radius on shared nodes
  - rbac.yaml # the identity the work laptop authenticates as
  - cilium-network-policy.yaml # default-deny + the egress quarantine
  - certificate.yaml # *.teak.talos00 (shared *.talos00 cannot match a 2nd label)
  - dbgate/ # the tenant's own DB UI (NOT the homelab dbgate)
  - dbgate-connection-sync/ # single-writer → dbgate-cnpg-connections Secret
