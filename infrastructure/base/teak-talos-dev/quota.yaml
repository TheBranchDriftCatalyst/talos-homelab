---
# Blast radius. The tenant is on shared nodes, so the quota is what stops a runaway work
# workload from evicting homelab services. Cluster allocatable is ~60 CPU / ~180Gi across
# 5 nodes; this tenant may request at most ~10% of it.
#
# NOTE: because this quota sets requests.*/limits.*, EVERY container in the namespace must
# declare them. The LimitRange below supplies defaults so a bare `kubectl run` still works.
# When the quota is exhausted, Deployments/StatefulSets fail at the ReplicaSet layer — the
# error shows up in `kubectl -n teak-talos-dev describe rs|sts`, NOT on the Pod (there is no
# Pod). Check `kubectl -n teak-talos-dev describe quota` first when things "just don't start".
apiVersion: v1
kind: ResourceQuota
metadata:
  name: teak-talos-dev
  namespace: teak-talos-dev
spec:
  hard:
    requests.cpu: '6'
    requests.memory: 16Gi
    limits.cpu: '16'
    limits.memory: 32Gi
    pods: '50'
    services: '20'
    services.loadbalancers: '0' # tenant gets ingress via Traefik, never its own LB IP
    services.nodeports: '0' # a NodePort would bypass the network policy entirely
    persistentvolumeclaims: '15'
    requests.storage: 100Gi
    secrets: '50'
    configmaps: '50'
    # Object-count caps on the operator CRDs. Without these a single bad apply loop can ask
    # the shared operators to build unbounded Postgres/RabbitMQ clusters cluster-side.
    count/clusters.postgresql.cnpg.io: '5'
    count/rabbitmqclusters.rabbitmq.com: '3'
    count/dragonflies.dragonflydb.io: '3'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: teak-talos-dev
  namespace: teak-talos-dev
spec:
  limits:
    - type: Container
      # Supplied when a container omits them (required by the quota above).
      defaultRequest: { cpu: 50m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
      # Ceiling per container. Generous enough for a real dev workload; low enough that one
      # container cannot claim a whole node. Raising this is a deliberate operator decision.
      max: { cpu: '4', memory: 8Gi }
    - type: PersistentVolumeClaim
      max: { storage: 50Gi }
