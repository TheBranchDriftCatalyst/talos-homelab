---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbgate-connection-sync
  namespace: teak-talos-dev
---
# NOTE THE ABSENCE OF A ClusterRole. The homelab's equivalent needs cluster-wide read on the
# CNPG CRDs because it aggregates every namespace; this tenant's dbgate only ever shows this
# tenant's own stores, so every grant here is namespace-scoped. That is the isolation
# property — nothing in teak-talos-dev holds a cluster-scoped permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbgate-connection-sync
  namespace: teak-talos-dev
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases]
    verbs: [get, list]
  - apiGroups: [dragonflydb.io]
    resources: [dragonflies]
    verbs: [get, list]
  # Read the CNPG-generated -app secrets; write the generated connections secret.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, create, update, patch]
  # DELETE, scoped by resourceNames to the one Secret this job owns.
  # Required by the empty-tenant path: when discovery succeeds and finds no stores, the job
  # clears the connection set by deleting this Secret (dbgate's envFrom is optional:true, so it
  # then boots with no connections -- the same known-good state it had before the first sync).
  # Without this verb the job fails on RBAC and the CronJob error-loops; that is exactly what
  # happened the first time the tenant was emptied.
  # resourceNames rather than a blanket delete: this is not a real privilege increase either
  # way (the SA can already overwrite any secret in the namespace via update/patch), but it
  # keeps the grant describing precisely what the job does.
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [dbgate-cnpg-connections]
    verbs: [delete]
  # Roll dbgate when the connection set changes.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbgate-connection-sync
  namespace: teak-talos-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbgate-connection-sync
subjects:
  - kind: ServiceAccount
    name: dbgate-connection-sync
    namespace: teak-talos-dev
