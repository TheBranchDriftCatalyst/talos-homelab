---
# local-path, NOT the homelab's fatboy-nfs-appdata: tenant state stays off the home NAS.
# The cost is that this PVC pins dbgate to one node and does not survive that node's loss.
# Acceptable — the contents are saved queries and UI preferences; the CONNECTIONS themselves
# are regenerated from the CRDs on every deploy. Switch to fatboy-nfs-appdata if you would
# rather have reschedulability than that separation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbgate-data
  namespace: teak-talos-dev
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 500Mi
