---
# Dragonfly (Redis wire-compatible) — reconciled by the shared dragonfly-operator.
#
# Dragonfly sizes itself to the HOST thread count (16 on the bigger nodes here) and demands
# ~256Mi per proactor thread, so it will OOM-exit under a small limit unless the thread count
# is pinned. --proactor_threads=1 + an explicit --maxmemory is what makes it fit a dev budget.
#
# NO AUTH: the default-deny CiliumNetworkPolicy is what protects this, and the tenant's dbgate
# connects to it unauthenticated. If you add spec.authentication.passwordFromSecret you must
# also extend ../dbgate-connection-sync/configmap-script.yaml to read that secret.
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: teak-cache
  namespace: teak-talos-dev
spec:
  replicas: 1
  args:
    - '--proactor_threads=1'
    - '--maxmemory=256mb'
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
