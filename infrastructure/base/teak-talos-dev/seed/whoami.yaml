---
# MVP smoke test. If this answers on http://teak-whoami.talos00 the tenant's ingress path,
# scheduling, quota defaults and PSA level are all working.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: teak-talos-dev
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:latest
          # Always: floating tag. IfNotPresent would serve whatever each NODE cached, making
          # the running version depend on where the pod landed. (matches TALOS-6gnx)
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: teak-talos-dev
  labels:
    app: whoami
spec:
  type: ClusterIP
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Unauthenticated on purpose: this is the connectivity probe, and `curl -H Host:` against it
# is the fastest way to prove the tenant's ingress works. It reveals nothing but request
# headers and is only reachable from the LAN. Add the authentik middleware (see
# ../dbgate/ingressroute.yaml) if you would rather gate it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: teak-talos-dev
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`teak-whoami.talos00`)
      kind: Rule
      services:
        - name: whoami
          port: 80
