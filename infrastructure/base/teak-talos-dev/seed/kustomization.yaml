# MVP seed workloads. These are Flux-managed and will be reverted if edited live — they exist
# to prove the tenant works end to end. Anything the work laptop applies under a DIFFERENT
# name is untouched by Flux (prune is inventory-based). See ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - whoami.yaml
  - postgres.yaml
  - dragonfly.yaml
  - rabbitmq.yaml
