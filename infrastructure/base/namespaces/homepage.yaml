---
# Dedicated namespace for the multi-instance homepage dashboards (TALOS-qt7u).
# 8 gethomepage instances: master (homepage.talos00) + 7 domain boards
# (<domain>.homepage.talos00). Plain web app — baseline PSS is sufficient.
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  labels:
    app.kubernetes.io/part-of: homepage
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # Enable Goldilocks resource recommendations
    goldilocks.fairwinds.com/enabled: 'true'
