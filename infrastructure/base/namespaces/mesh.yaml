---
# mesh — self-hosted WireGuard mesh control plane (Headscale) for TALOS-iymy.
# Lets the Mac, the cluster, and off-net GPU boxes (AWS us-east-2) sit on ONE
# private tailnet with no public inbound to the workloads. baseline PSS is fine —
# headscale runs as a non-root single Go binary.
apiVersion: v1
kind: Namespace
metadata:
  name: mesh
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
