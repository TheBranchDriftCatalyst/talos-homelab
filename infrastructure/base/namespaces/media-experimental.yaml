---
# Experimental books / comics / audiobooks stack (bake-off).
# Isolated from the production `media` namespace for clean teardown.
apiVersion: v1
kind: Namespace
metadata:
  name: media-experimental
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: media-experimental
    experimental: "true"
    pod-security.kubernetes.io/enforce: baseline
