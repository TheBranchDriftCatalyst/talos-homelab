---
# cert-manager - X.509 certificate management for Kubernetes
# Provides automatic certificate provisioning and renewal
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      # v1.21.1 direct (TALOS-xsx, operator-approved off-policy jump): v1.16
      # capped at k8s 1.32 and this cluster is on 1.34 — already out of range.
      # CRD diff v1.16.2→v1.21.1 is 100% additive. NEVER v1.21.0 (ACME solver
      # Secret validation wedges 10h on missing ExternalSecret races) or
      # v1.19.0 (spurious cert re-issuance). v1.18+ GA defaults now in effect:
      # privateKey.rotationPolicy=Always, revisionHistoryLimit=1.
      version: 'v1.21.1'
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Install CRDs
    # installCRDs deprecated upstream — new crds block (keep=true guards CRDs
    # against release deletion)
    crds:
      enabled: true
      keep: true

    # Replicas for HA (1 for homelab)
    replicaCount: 1

    # Resources
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

    # Webhook configuration
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 96Mi

    # CA Injector
    cainjector:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 96Mi

    # Prometheus ServiceMonitor
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack

    # Enable feature gates
    featureGates: ''

    # Global settings
    global:
      leaderElection:
        namespace: cert-manager
