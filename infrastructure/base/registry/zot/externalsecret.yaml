---
# Zot registry secrets — templated by ESO from 1Password so nothing sensitive
# lands in git. Produces TWO files consumed by the Zot pod:
#
#   1. htpasswd  — a single user "panda" with the SAME password as the existing
#      Nexus pull token (nexus-pull-dockercfg). This is what makes the registry
#      hotswap transparent: pods keep pulling registry.talos00 with the same
#      credentials, no imagePullSecret change. Password sourced from 1Password
#      item "zot" property "registry-password" (set it to panda's current Nexus
#      registry password). ESO's sprig `htpasswd` renders the bcrypt line.
#
#   2. config.json — the full Zot config, with the Authentik OIDC client secret
#      injected inline (1Password "zot".oidc-client-secret, the SAME field the
#      authentik-zot-oidc ExternalSecret reads, so both ends of the handshake
#      stay in lockstep). Zot has no env-substitution for the client secret, so
#      the whole config is templated here.
#
# OIDC issuer is http://auth.talos00. Zot does OIDC discovery (can't split
# browser vs pod endpoints) AND panics if discovery fails at boot, so the issuer
# host must be reachable from BOTH the pod and the browser under the same name.
# The pod can't hairpin to the node LB, and the PUBLIC auth.knowledgedump.space
# is Cloudflare-blocked for server-side requests (403). Solution: a CoreDNS
# rewrite (infrastructure/base/kube-system/coredns) resolves auth.talos00 to the
# Authentik service IN-CLUSTER, so the pod reaches Authentik directly while the
# browser resolves auth.talos00 via /etc/hosts -> Traefik. Both use Host
# auth.talos00, so the discovery issuer + id_token iss are identical. No
# hardcoded IP, no hostAlias.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zot-secrets
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zot-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ htpasswd \"panda\" .registryPassword }}"
        config.json: |
          {
            "distSpecVersion": "1.1.1",
            "storage": { "rootDirectory": "/var/lib/registry", "dedupe": true, "gc": true, "gcDelay": "2h" },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "compat": ["docker2s2"],
              "auth": {
                "htpasswd": { "path": "/secret/htpasswd" },
                "openid": {
                  "providers": {
                    "oidc": {
                      "name": "Authentik",
                      "clientid": "zot",
                      "clientsecret": "{{ .oidcClientSecret }}",
                      "issuer": "http://auth.talos00/application/o/zot/",
                      "scopes": ["openid", "email", "profile"]
                    }
                  }
                }
              },
              "accessControl": {
                "repositories": {
                  "**": {
                    "policies": [
                      { "users": ["panda"], "actions": ["read", "create", "update", "delete"] }
                    ],
                    "defaultPolicy": ["read"]
                  }
                },
                "adminPolicy": { "users": ["panda"], "actions": ["read", "create", "update", "delete"] }
              }
            },
            "log": { "level": "info" },
            "extensions": {
              "search": { "enable": true, "cve": { "updateInterval": "6h" } },
              "ui": { "enable": true }
            }
          }
  data:
    - secretKey: registryPassword
      remoteRef:
        key: zot
        property: registry-password
    - secretKey: oidcClientSecret
      remoteRef:
        key: zot
        property: oidc-client-secret
