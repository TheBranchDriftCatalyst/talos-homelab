---
# Zot registry secrets — templated by ESO from 1Password so nothing sensitive
# lands in git. Produces TWO files consumed by the Zot pod:
#
#   1. htpasswd  — a single user "panda" with the SAME password as the existing
#      Nexus pull token (nexus-pull-dockercfg). This is what makes the registry
#      hotswap transparent: pods keep pulling registry.talos00 with the same
#      credentials, no imagePullSecret change. Password sourced from 1Password
#      item "zot" property "registry-password" (set it to panda's current Nexus
#      registry password). ESO's sprig `htpasswd` renders the bcrypt line.
#
# API KEYS (http.auth.apikey) are ENABLED. They are opt-in in Zot and were previously absent
# entirely, which is why /zot/auth/apikey answered 401 and no key ever worked -- there was
# nothing to mint or accept, not a bad key.
#
# How they work: an API key is issued to an OPENID-AUTHENTICATED user, so you must first log
# into the Zot UI via Authentik, then create one (UI, or POST /zot/auth/apikey with the session
# cookie). Use it as the PASSWORD in `docker login registry.knowledgedump.space -u <identity>`.
# htpasswd auth is unaffected and keeps working for the existing pull credentials.
#
# THE THING TO WATCH: accessControl below matches on the literal identity string. htpasswd
# logins present "panda"; an OIDC login presents whatever claim Zot derives from Authentik
# (preferred_username / email). If those differ, an API key will AUTHENTICATE but fall through
# to defaultPolicy ["read"] -- pushes 401/403 while pulls work, which reads as "the key is
# broken". If that happens, add the exact identity to the users list; Zot logs it on each
# authenticated request.
#
# METRICS + SCRUB are enabled (extensions.metrics / extensions.scrub).
#   metrics — Prometheus endpoint on the SAME port as the registry (5000), path /metrics.
#             Scraped by infrastructure/base/registry/zot/servicemonitor.yaml.
#   scrub   — periodic blob-integrity verification. 24h; Zot rejects an interval under 2h.
#             This matters more than usual here: storage is a single local-path PVC on one
#             node with no redundancy, so silent corruption would otherwise stay silent.
#
# NO RETENTION POLICY, deliberately. storage.retention prunes EXCESS tags, and this registry
# has exactly one tag per repository (15 tags across 16 repos, verified) -- so it would have
# nothing to delete. The usual time-based rule (keepTags.pulledWithin) would actively cause
# harm: talos-installer-talos0{1,2-gpu,3,6} and talos-intel-bt-firmware are pulled only during
# a node upgrade, so any "not pulled recently" policy deletes exactly the images a Talos
# upgrade needs. Disk is already bounded by dedupe + gc, which reclaim the untagged blobs left
# behind when a :latest tag is overwritten -- that is the real growth mechanism here.
# Revisit if repositories start carrying many tags.
#
#   2. config.json — the full Zot config, with the Authentik OIDC client secret
#      injected inline (1Password "zot".oidc-client-secret, the SAME field the
#      authentik-zot-oidc ExternalSecret reads, so both ends of the handshake
#      stay in lockstep). Zot has no env-substitution for the client secret, so
#      the whole config is templated here.
#
# OIDC issuer is https://auth.knowledgedump.space — SAME registrable domain as
# registry.knowledgedump.space. This is REQUIRED: Zot stores OAuth state in a
# client cookie with SameSite=Lax, so if the IdP is on a different site (e.g.
# auth.talos00) the cross-site callback DROPS the cookie ("failed to get state:
# named cookie not present"). Same-domain issuer -> same-site round-trip ->
# cookie survives.
#
# Reachability without Cloudflare's 403 or a node-LB hairpin: a CoreDNS rewrite
# (infrastructure/base/kube-system/coredns) resolves auth.knowledgedump.space to
# the Traefik service in-cluster, which serves the *.knowledgedump.space wildcard
# cert (valid TLS) and routes to Authentik. So the Zot pod does HTTPS discovery
# in-cluster; the browser resolves the same host via the Pi-hole wildcard ->
# Traefik. Identical issuer + id_token iss both sides. No hardcoded IP.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secrets
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zot-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ htpasswd \"panda\" .registryPassword \"bcrypt\" }}" # ESO 2.x: htpasswd now requires the algorithm arg
        config.json: |
          {
            "distSpecVersion": "1.1.1",
            "storage": { "rootDirectory": "/var/lib/registry", "dedupe": true, "gc": true, "gcDelay": "2h" },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "externalUrl": "https://registry.knowledgedump.space",
              "compat": ["docker2s2"],
              "auth": {
                "htpasswd": { "path": "/secret/htpasswd" },
                "openid": {
                  "providers": {
                    "oidc": {
                      "name": "Authentik",
                      "clientid": "zot",
                      "clientsecret": "{{ .oidcClientSecret }}",
                      "issuer": "https://auth.knowledgedump.space/application/o/zot/",
                      "scopes": ["openid", "email", "profile"]
                    }
                  }
                },
                "apikey": true
              },
              "accessControl": {
                "repositories": {
                  "**": {
                    "policies": [
                      { "users": ["panda"], "actions": ["read", "create", "update", "delete"] }
                    ],
                    "defaultPolicy": ["read"]
                  }
                },
                "adminPolicy": { "users": ["panda"], "actions": ["read", "create", "update", "delete"] }
              }
            },
            "log": { "level": "info" },
            "extensions": {
              "search": { "enable": true, "cve": { "updateInterval": "6h" } },
              "ui": { "enable": true },
              "metrics": { "enable": true, "prometheus": { "path": "/metrics" } },
              "scrub": { "enable": true, "interval": "24h" }
            }
          }
  data:
    - secretKey: registryPassword
      remoteRef:
        key: zot
        property: registry-password
    - secretKey: oidcClientSecret
      remoteRef:
        key: zot
        property: oidc-client-secret
