---
# Zot registry secrets — templated by ESO from 1Password so nothing sensitive
# lands in git. Produces TWO files consumed by the Zot pod:
#
#   1. htpasswd  — a single user "panda" with the SAME password as the existing
#      Nexus pull token (nexus-pull-dockercfg). This is what makes the registry
#      hotswap transparent: pods keep pulling registry.talos00 with the same
#      credentials, no imagePullSecret change. Password sourced from 1Password
#      item "zot" property "registry-password" (set it to panda's current Nexus
#      registry password). ESO's sprig `htpasswd` renders the bcrypt line.
#
#   2. config.json — the full Zot config, with the Authentik OIDC client secret
#      injected inline (1Password "zot".oidc-client-secret, the SAME field the
#      authentik-zot-oidc ExternalSecret reads, so both ends of the handshake
#      stay in lockstep). Zot has no env-substitution for the client secret, so
#      the whole config is templated here.
#
# OIDC issuer is https://auth.knowledgedump.space — SAME registrable domain as
# registry.knowledgedump.space. This is REQUIRED: Zot stores OAuth state in a
# client cookie with SameSite=Lax, so if the IdP is on a different site (e.g.
# auth.talos00) the cross-site callback DROPS the cookie ("failed to get state:
# named cookie not present"). Same-domain issuer -> same-site round-trip ->
# cookie survives.
#
# Reachability without Cloudflare's 403 or a node-LB hairpin: a CoreDNS rewrite
# (infrastructure/base/kube-system/coredns) resolves auth.knowledgedump.space to
# the Traefik service in-cluster, which serves the *.knowledgedump.space wildcard
# cert (valid TLS) and routes to Authentik. So the Zot pod does HTTPS discovery
# in-cluster; the browser resolves the same host via the Pi-hole wildcard ->
# Traefik. Identical issuer + id_token iss both sides. No hardcoded IP.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secrets
  namespace: registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: zot-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        htpasswd: "{{ htpasswd \"panda\" .registryPassword \"bcrypt\" }}" # ESO 2.x: htpasswd now requires the algorithm arg
        config.json: |
          {
            "distSpecVersion": "1.1.1",
            "storage": { "rootDirectory": "/var/lib/registry", "dedupe": true, "gc": true, "gcDelay": "2h" },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "externalUrl": "https://registry.knowledgedump.space",
              "compat": ["docker2s2"],
              "auth": {
                "htpasswd": { "path": "/secret/htpasswd" },
                "openid": {
                  "providers": {
                    "oidc": {
                      "name": "Authentik",
                      "clientid": "zot",
                      "clientsecret": "{{ .oidcClientSecret }}",
                      "issuer": "https://auth.knowledgedump.space/application/o/zot/",
                      "scopes": ["openid", "email", "profile"]
                    }
                  }
                }
              },
              "accessControl": {
                "repositories": {
                  "**": {
                    "policies": [
                      { "users": ["panda"], "actions": ["read", "create", "update", "delete"] }
                    ],
                    "defaultPolicy": ["read"]
                  }
                },
                "adminPolicy": { "users": ["panda"], "actions": ["read", "create", "update", "delete"] }
              }
            },
            "log": { "level": "info" },
            "extensions": {
              "search": { "enable": true, "cve": { "updateInterval": "6h" } },
              "ui": { "enable": true }
            }
          }
  data:
    - secretKey: registryPassword
      remoteRef:
        key: zot
        property: registry-password
    - secretKey: oidcClientSecret
      remoteRef:
        key: zot
        property: oidc-client-secret
