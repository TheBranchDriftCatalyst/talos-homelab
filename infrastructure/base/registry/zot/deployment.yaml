---
# Zot — OCI-native registry (single Go binary). Replaces Nexus (2Gi Java).
# Serves the Docker/OCI API (/v2/) AND the zui web UI on the same port (5000);
# native Authentik OIDC on the UI, htpasswd (user panda) for CLI push/pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — never two pods holding the volume
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
      annotations:
        # Intent: roll the pod when the templated config/htpasswd changes.
        #
        # CURRENTLY INERT — Stakater Reloader is NOT installed in this cluster (no deployment,
        # no CRD; this annotation is the only reference to it in the entire repo). Kept because
        # it is the right declaration if Reloader is ever added, but do not rely on it.
        #
        # So: config.json is mounted with subPath, which never updates in place, AND nothing
        # watches the Secret. A config change therefore requires an explicit
        #     kubectl -n registry rollout restart deploy/zot
        # after ESO re-renders zot-secrets. Without that the pod keeps serving the old config
        # indefinitely and the change looks like it silently did nothing.
        reloader.stakater.com/auto: "true"
    spec:
      # OIDC discovery to auth.talos00 works in-cluster via the CoreDNS rewrite
      # (infrastructure/base/kube-system/coredns) — no hostAlias / hardcoded IP.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.20
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # TCP probes: with htpasswd auth enabled, GET /v2/ returns 401 (auth
          # challenge), which k8s httpGet probes treat as failure. A TCP check
          # confirms Zot is listening without tripping on the auth challenge.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /secret/htpasswd
              subPath: htpasswd
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          secret:
            secretName: zot-secrets
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
