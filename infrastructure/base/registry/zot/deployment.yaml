---
# Zot — OCI-native registry (single Go binary). Replaces Nexus (2Gi Java).
# Serves the Docker/OCI API (/v2/) AND the zui web UI on the same port (5000);
# native Authentik OIDC on the UI, htpasswd (user panda) for CLI push/pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — never two pods holding the volume
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
      annotations:
        # Roll the pod when the templated config/htpasswd changes.
        reloader.stakater.com/auto: "true"
    spec:
      # Resolve auth.talos00 to the authentik-server ClusterIP so the pod can do
      # OIDC discovery + token exchange in-cluster under Host auth.talos00 (no
      # Cloudflare, no node-LB hairpin). Browser resolves auth.talos00 via
      # /etc/hosts -> Traefik -> same Authentik, so the issuer stays consistent.
      # If the authentik-server Service is ever recreated with a new ClusterIP,
      # update this IP (kubectl get svc -n authentik authentik-server). TALOS-6vf.
      hostAliases:
        - ip: "10.106.147.209"
          hostnames:
            - auth.talos00
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.20
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /v2/, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /v2/, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/zot/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /secret/htpasswd
              subPath: htpasswd
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: config
          secret:
            secretName: zot-secrets
        - name: data
          persistentVolumeClaim:
            claimName: zot-data
