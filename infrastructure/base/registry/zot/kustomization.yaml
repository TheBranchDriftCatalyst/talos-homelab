---
# Zot OCI registry — Nexus replacement (TALOS-6vf).
# Deployed alongside Nexus in the registry namespace; cutover flips
# registry.talos00 to Zot, then the Nexus manifests are removed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: registry

resources:
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
