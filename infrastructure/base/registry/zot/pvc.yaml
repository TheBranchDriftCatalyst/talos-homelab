---
# Zot registry storage. 30Gi is generous for a homelab hosted registry — Zot
# dedupes blobs and the old Nexus 100Gi was mostly regenerable proxy cache.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
