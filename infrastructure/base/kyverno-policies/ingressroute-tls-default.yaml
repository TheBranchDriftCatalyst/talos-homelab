---
# Give every websecure IngressRoute the `tls` block it is required to carry.
#
# THE BOILERPLATE THIS REPLACES: in Traefik, an IngressRoute served on the `websecure`
# entrypoint only gets TLS TERMINATION if it declares a `tls` stanza. An EMPTY stanza is the
# whole signal — it means "terminate TLS using the default TLSStore", which in this cluster
# is infrastructure/base/traefik/tlsstore.yaml (the wildcard cert). Omit it and Traefik
# serves the route as cleartext on :443, which fails in the browser rather than in CI — the
# worst place to find out.
#
# So `tls: {}` is not configuration, it is a tax: 65 byte-identical copies across 59 files,
# every one saying nothing more than "yes, https, like all the others". Verified 2026-08-21 —
# of the 57 in-repo IngressRoutes on `websecure`, all 57 carry exactly `tls: {}` and NONE
# carries anything else. Live cluster agrees: 79 websecure IngressRoutes, 79 with `tls: {}`,
# zero with a non-empty value. (The other 8 in-repo copies are the homepage overlay
# patch-host.yaml strategic-merge fragments, which have no entryPoints of their own and
# inherit them from the base at kustomize time.) (TALOS-a38d.3)
#
# ADD-IF-ABSENT ONLY. A hand-set value ALWAYS wins; the policy only fills a hole. This is not
# theoretical caution — `tls` is exactly where per-route divergence lands (mTLS `options`, a
# specific `secretName`, a `certResolver`), and silently flattening one of those to the
# default store would downgrade a route's security posture without changing a line of YAML.
# Never convert this policy to overwrite.
#
# ---------------------------------------------------------------------------------------
# WHY JSON6902 AND NOT THE `+(tls): {}` ANCHOR — read this before "simplifying" it back.
#
# The obvious implementation is the strategic-merge anchor used by the sibling policy
# homepage-annotation-derivation.yaml:
#
#     mutate:
#       patchStrategicMerge:
#         spec:
#           +(tls): {}          # <-- LOOKS right. Silently does NOTHING.
#
# That form is a NO-OP. Verified with `kyverno apply` on CLI v1.18.2 (same version as the
# cluster) against a websecure IngressRoute with no tls: the rule is evaluated, the
# precondition passes, the anchor matches — and the engine emits an empty patch, because
# strategic merge diffs VALUES and an empty map contributes no leaf to merge. The resource
# comes out unchanged and the run reports "skip", not "fail". Proven by swapping the value
# for a non-empty sentinel (`+(tls): {options: {name: SENTINEL}}`), which mutated correctly
# on exactly the right resources — isolating the empty map, not the precondition or the
# anchor, as the cause.
#
# This is the nastiest possible failure mode: a policy that reports healthy, shows Ready,
# and quietly does nothing. Since the ENTIRE POINT here is to materialise an empty object,
# strategic merge cannot express it and JSON6902 `add` is the mechanism that can.
#
# Consequence: add-if-absent moves from the `+()` anchor into a PRECONDITION, because
# JSON6902 `add` is an overwrite. The guard is `contains(keys(spec), 'tls')`, NOT the more
# natural-looking `spec.tls || 'ABSENT'` — in JMESPath an empty map is falsy, so the `||`
# form cannot tell "tls absent" from "tls present and empty" and would re-patch all 79 live
# routes on every admission. Key-presence distinguishes them exactly. Verified: a route that
# already has `tls: {}` is skipped, so this policy causes zero churn on the existing fleet.
#
# The JSON6902 path is safe here despite the usual `op: add` caveat (an add whose PARENT is
# missing fails): the parent is `/spec`, which every IngressRoute has by construction.
# ---------------------------------------------------------------------------------------
#
# KIND SCOPING — the two routes in this repo that DO set a non-empty tls
# (vpn-gateway/secure-chrome.yaml and vpn-gateway/secure-webtop.yaml, both
# `tls: {passthrough: true}` for Kasm/webtop, which speak their own HTTPS) are
# IngressRouteTCP, NOT IngressRoute. They are out of scope by KIND, so they are protected
# twice over: the match block never selects them, and the absence precondition would have
# spared them anyway. `passthrough` is in fact only valid on IngressRouteTCP — there is no
# such field on IngressRoute — which is why an IngressRoute-only policy can be this blunt.
#
# ENTRYPOINT PRECONDITION: `websecure` membership is a clean discriminator. Verified
# cluster-wide (2026-08-21): every IngressRoute lists EXACTLY ONE of `web` (111) or
# `websecure` (79) — never both, never neither — so no route wants TLS on one entrypoint but
# not the other. The `|| to_array('web')` guard keeps the expression TOTAL if a route ever
# omits entryPoints entirely: an absent list is treated as `web`, i.e. no TLS, the
# conservative direction. Same discriminator, same shape, as the `scheme` context variable in
# homepage-annotation-derivation.yaml — if one ever needs revisiting, so does the other.
#
# ADMISSION-ONLY — deliberately NO mutateExisting/generateExisting, unlike the two homepage
# policies. There is nothing to backfill: all 79 live websecure IngressRoutes already carry
# `tls: {}` literally, so a retroactive pass would be 79 no-ops. Skipping mutateExisting is
# also what keeps this policy free: mutateExisting runs in the BACKGROUND controller, which
# would need an aggregated ClusterRole granting update/patch on traefik.io/ingressroutes
# (see kyverno:background:homepage-instance). Admission-time mutation needs no RBAC at all,
# so this policy adds ZERO permissions to the cluster. `background: false` for the same
# reason. When the manifests are later stripped of their literal `tls: {}` (TALOS-a38d.3
# follow-up pass), Flux re-applies each object and admission re-adds the field then — so
# still no backfill needed, but note the ordering: this policy must be live BEFORE any
# manifest loses its tls line.
#
# failurePolicy Ignore: this is a convenience default, never a gate. A wedged Kyverno webhook
# must not be able to block an IngressRoute from being applied — a route that missed its
# mutation is far less bad than Flux being unable to reconcile ingress at all.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ingressroute-tls-default
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    policies.kyverno.io/title: Default TLS on websecure IngressRoutes
    policies.kyverno.io/category: Traefik
    policies.kyverno.io/subject: IngressRoute
    policies.kyverno.io/description: >-
      Adds an empty tls stanza (terminate with the default TLSStore) to any traefik.io
      IngressRoute whose entryPoints include websecure and which does not already declare
      one. Add-if-absent via a key-presence precondition — a hand-set tls block (mTLS
      options, secretName, certResolver) always wins, and a route that already has an empty
      tls is left alone. Admission-time only, so it needs no background-controller RBAC.
      IngressRouteTCP is out of scope, which is what protects the two tls.passthrough routes
      in vpn-gateway.
spec:
  # Mutation only — never block an IngressRoute because of this.
  failurePolicy: Ignore
  admission: true
  background: false
  rules:
    - name: add-default-tls
      match:
        any:
          # Fully qualified: traefik.io is the only group serving IngressRoute in this
          # cluster today, but pinning the version keeps the match stable if the legacy
          # traefik.containo.us CRDs are ever reinstalled alongside it.
          - resources:
              kinds:
                - traefik.io/v1alpha1/IngressRoute
      preconditions:
        all:
          # Only routes that actually terminate TLS.
          - key: "{{ contains(request.object.spec.entryPoints || to_array('web'), 'websecure') }}"
            operator: Equals
            value: true
          # ADD-IF-ABSENT guard. Key presence, not truthiness — see the long note above.
          - key: "{{ contains(keys(request.object.spec), 'tls') }}"
            operator: Equals
            value: false
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/tls
            value: {}
