---
# Namespace -> homepage "domain" (per-board instance) lookup table.
# Consumed by the `homepage-instance-assignment` ClusterPolicy (stamp-domain rule) via a
# context.configMap entry. Each IngressRoute annotated gethomepage.dev/enabled: "true" gets
# gethomepage.dev/instance.<domain>: "true" derived from its namespace, so it lands on the
# matching per-domain homepage board (in addition to the always-on master board).
#
# Keep this map in sync with cluster namespaces. A namespace absent from this map yields an
# empty domain -> the stamp-domain rule's `{{ domain }} NotEquals ""` precondition skips it
# (it still gets the master stamp). Add new namespaces here as domains are introduced.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-ns-domain-map
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: kyverno
data:
  # arrs board — media / *arr stack
  media: arrs
  downloads: arrs
  media-experimental: arrs
  tdarr: arrs
  metube: arrs
  tubesync: arrs
  # data board
  catalyst-data: data
  # llm board
  catalyst-llm: llm
  # infra board — platform / cluster services
  argocd: infra
  forgejo: infra
  traefik: infra
  registry: infra
  infra-control: infra
  crowdsec: infra
  iocaine: infra
  authentik: infra
  databases: infra
  kube-system: infra
  external-secrets: infra
  cert-manager: infra
  flux-system: infra
  # obs board — monitoring / observability
  monitoring: obs
  # home board
  home-automation: home
  default: home
  # apps board — misc application namespaces
  boomtime: apps
  catalyst: apps
  crossplane-demo: apps
  gaming: apps
  dungeon-library: apps
  vpn-gateway: apps
