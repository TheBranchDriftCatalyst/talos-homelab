---
# Default `remediation.retries: 3` on every Flux HelmRelease, for both install and upgrade.
#
# WHY THIS EXISTS: Flux's built-in default is retries: 0 — one failed Helm operation and the
# release is marked failed and STAYS failed until a human or a new revision pokes it. That is
# the wrong default in a single-node-ish homelab, where the common failure is transient and
# self-healing: an API server blip during a control-plane restart, a chart pull that races the
# registry, a webhook (Kyverno's own, cert-manager's) that is a few seconds from Ready. Three
# retries turns "wedged until noticed" into "converges by itself". Every author in this repo
# reached that conclusion independently, which is exactly why the literal appears 79 times.
#
# THE BOILERPLATE THIS REPLACES: 79 hand-written `retries: 3` lines across 40 of the repo's 42
# HelmReleases (2 per release: install + upgrade). Every single one is the same value for the
# same reason. This is boilerplate in the strict sense — nobody chose 3 per release, they
# copied the previous release. (TALOS-a38d.5)
#
# ---------------------------------------------------------------------------------------
# *** SCOPE: ONLY retries. DO NOT WIDEN THIS TO "DEFAULT THE INSTALL/UPGRADE POSTURE". ***
#
# The obvious next thought — "while we're here, default crds and cleanupOnFail too" — was
# considered and MEASURED, and it is wrong. Counts across all 42 HelmReleases, 2026-08-21:
#
#     install.crds:           unset=20   CreateReplace=15   Create=6      <- THREE values
#     upgrade.crds:           CreateReplace=21   unset=20
#     upgrade.cleanupOnFail:  unset=31   true=9   false=1
#
# retries has ONE value (3) with a single deliberate exception. crds has three, split roughly
# evenly, and SIX releases are deliberately ASYMMETRIC — `install: Create` with
# `upgrade: CreateReplace` (traefik, argocd, cert-manager, external-secrets,
# opentelemetry-operator, nfs-subdir-external-provisioner). The same release choosing a
# different value for each phase is the signature of intent, not copy-paste: adopt the CRDs on
# first install, replace them on upgrade. A default would erase that distinction on 20-31
# releases and change real behaviour.
#
# cleanupOnFail is worse. Exactly one release sets it FALSE — cilium — and that is the CNI. A
# failed Cilium upgrade must NOT roll back by tearing down cluster networking; you would lose
# the network you need to fix the network. Defaulting cleanupOnFail would either flip cilium
# (if it clobbered) or, if add-if-absent, silently enable teardown-on-failure for the 31
# releases that never opted in. Neither is a defaulting convenience; both are behaviour
# changes wearing one.
#
# retries is safe to default precisely BECAUSE it is uniform and additive: retrying a failed
# Helm operation three times cannot destroy anything a single attempt would not have.
# ---------------------------------------------------------------------------------------
#
# DRY-RUN, before landing (kyverno CLI 1.18.2, policy applied against every HelmRelease
# extracted from the repo):
#
#     pass: 2    fail: 0    error: 0    skip: 39
#
# Only TWO releases change — monitoring/grafana-operator and monitoring/prometheus-pushgateway,
# the only two with no remediation block at all. The other 39 already declare retries: 3 and
# are correctly SKIPPED by the add-if-absent anchor. INSTALLING THIS POLICY IS A ZERO-DIFF
# CHANGE for everything else, which is the whole sequencing argument: land the policy while
# every manifest still carries its literal (nothing can move), verify, and only then strip the
# literals in a separate, independently revertable commit. The mutated output was inspected —
# it adds ONLY retries and leaves spec.install.crds untouched.
#
# THE DELIBERATE EXCEPTION, preserved by construction: monitoring/clickstack runs
# `install.remediation.retries: 2` with `remediateLastFailure: false` — "don't tear down a
# stack that's still converging", after its 5m default once expired mid-boot and killed pods
# seconds from ready. Add-if-absent leaves that alone; the anchor never overwrites a value that
# is already there. Any future release that needs a different number just writes it down.
#
# ADD-IF-ABSENT, via `+()` anchors on remediation and retries — and note the anchor PLACEMENT,
# which is the whole trick and the gotcha the audit flagged. The parent keys `install` and
# `upgrade` are PLAIN; only `remediation` and `retries` are wrapped. A `+()` anchor means "add
# this subtree only if the key is absent", so `+(install)` would do NOTHING on the 40 releases
# that already have an `install:` block — it would not recurse into it — and the policy would
# silently be a no-op on everything it was written for. Plain parents let strategic merge
# recurse into the existing map and merge at the leaf. This is the same anchor-placement rule
# recorded on the sibling cnpg-velero-exclude.yaml; here it is confirmed empirically by the
# dry-run above (2 pass / 39 skip is only possible if recursion actually happens).
#
# The two `+()` levels are both needed and act independently per subtree: `+(remediation)`
# creates the block on a release that has `install:` but no remediation (grafana-operator has
# neither, pushgateway neither), and `+(retries)` covers the shape where a remediation block
# exists carrying only `remediateLastFailure` or `strategy`. A failing anchor skips its own
# key, not the patch — so a release with install.remediation set and upgrade absent gets
# upgrade filled in and install left alone. Proven by admission test, not assumed.
#
# ---------------------------------------------------------------------------------------
# *** SIX HELMRELEASES ARE OUT OF REACH AND MUST KEEP THEIR LITERAL retries. ***
#
# Kyverno's resourceFilters exclude kube-system, kube-public, kube-node-lease and kyverno
# itself — a deliberate deadlock guard, since a policy engine that can gate its own namespace
# can lock itself out (TALOS-a38d, [[kyverno-cannot-mutate-kube-system]]). Verified against the
# live kyverno ConfigMap 2026-08-21: `[*/*,kube-system,*]` and `[*/*,kyverno,*]` are both
# present, so admission requests from those namespaces never reach this policy.
#
# The HelmReleases living there:
#     kube-system/cilium
#     kube-system/hubble-observer
#     kube-system/metrics-server
#     kube-system/nfs-subdir-external-provisioner
#     kube-system/reflector
#     kyverno/kyverno
#
# These will NOT be mutated. Their literal `retries: 3` is load-bearing and was NOT stripped —
# removing it there would silently drop them to Flux's retries: 0 default, and it would do so
# on the CNI, the storage provisioner and the policy engine, i.e. the three releases where a
# stuck failed reconcile is hardest to notice and worst to have. If you are ever tidying
# HelmReleases and wonder why these six still spell it out: this is why. Leave them.
# ---------------------------------------------------------------------------------------
#
# ADMISSION-ONLY — deliberately no mutateExisting, for two reasons:
#   1. Zero new RBAC. mutateExisting runs in the BACKGROUND controller, which has no write
#      access to helm.toolkit.fluxcd.io/helmreleases and would need an aggregated ClusterRole
#      to get it. Admission-time mutation needs none, so this policy adds ZERO permissions to
#      the cluster. `background: false` for the same reason.
#   2. Nothing worth backfilling. The only two releases missing the field are grafana-operator
#      and prometheus-pushgateway, and both get it on their next apply — which Flux performs on
#      its normal reconcile interval. A retroactive write to 40 live HelmRelease specs would
#      bump every generation and trigger 40 simultaneous Helm reconciles to set a field that
#      only matters the next time one of them fails. Not worth the churn.
#   Admission coverage is sufficient regardless of who applies the object: Flux's
#   kustomize-controller, a `kubectl apply` by hand and `flux create hr` all pass through the
#   same webhook.
#
# failurePolicy Ignore: this is a defaulting convenience, never a gate. A wedged Kyverno
# webhook must not be able to block a HelmRelease from being created or updated — least of all
# during an incident, when re-applying infrastructure is the fix. Note the ordering hazard this
# avoids: Kyverno is itself installed by a HelmRelease, so a Fail policy on this kind is a
# bootstrap deadlock waiting to happen.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: helmrelease-remediation-defaults
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    policies.kyverno.io/title: Default HelmRelease remediation retries
    policies.kyverno.io/category: GitOps
    policies.kyverno.io/subject: HelmRelease
    policies.kyverno.io/description: >-
      Adds spec.install.remediation.retries=3 and spec.upgrade.remediation.retries=3 to any
      Flux HelmRelease that does not set them, replacing 79 hand-written copies of the same
      value. Flux defaults to 0 retries, which leaves a release wedged after a single transient
      failure. Add-if-absent, so a deliberate value always wins (monitoring/clickstack keeps
      its install retries: 2). Scoped to retries ONLY — crds and cleanupOnFail are per-release
      choices, not boilerplate, and must not be defaulted. HelmReleases in kube-system and
      kyverno are outside Kyverno's resourceFilters and keep their literal retries.
spec:
  # Mutation only — never block a HelmRelease because of this. See the note above.
  failurePolicy: Ignore
  admission: true
  background: false
  rules:
    - name: add-remediation-retries
      match:
        any:
          # Fully qualified: pins the Flux API group/version so the match cannot silently widen
          # if another CRD ever serves a kind named HelmRelease. Verified 2026-08-21: the
          # helmreleases CRD serves exactly one version, v2 (served=true storage=true), and all
          # 42 HelmReleases in this repo declare it, so nothing is missed by pinning. If a
          # future Flux ever serves a second version, add it here explicitly.
          - resources:
              kinds:
                - helm.toolkit.fluxcd.io/v2/HelmRelease
      mutate:
        # ADD-IF-ABSENT. Anchors on `remediation` and `retries` only; `install` and `upgrade`
        # stay PLAIN so strategic merge recurses into the block that is almost always already
        # there. Anchoring the parents instead would make this policy a silent no-op — see the
        # long note above before changing the shape of this patch.
        patchStrategicMerge:
          spec:
            install:
              +(remediation):
                +(retries): 3
            upgrade:
              +(remediation):
                +(retries): 3
