---
# RBAC: Kyverno's background controller CANNOT read/update Secrets by default (security).
# mutateExisting needs it — grant via an aggregated ClusterRole (the aggregation label wires
# these rules into the kyverno background-controller's role). Without this the policy reports
# "not authorized to update Secret". (TALOS-7jxm)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background:cnpg-secret-reflect
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, update, patch]
---
# The mutating policy: stamp emberstack/reflector annotations onto every CNPG-generated
# <cluster>-app secret so reflector mirrors it into the `databases` namespace (dbgate
# auto-connect). ONE rule covers both:
#   - existing -app secrets            → mutated when the policy is installed/updated
#     (mutateExistingOnPolicyUpdate)
#   - new/updated -app secrets         → the secret's own admission is the trigger; the
#     background controller applies the same patch shortly after.
# Selector: Secrets named `*-app` that carry the CNPG `cnpg.io/cluster` label (so only the
# app-credentials secret is touched, not the -ca / -replication / -server certs).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: reflect-cnpg-app-secrets
  annotations:
    policies.kyverno.io/title: Reflect CNPG app secrets into the databases namespace
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Auto-annotates every CloudNativePG <cluster>-app secret for emberstack/reflector so it is
      mirrored into the `databases` namespace, letting dbgate pre-connect to every CNPG cluster
      with zero per-cluster configuration.
spec:
  # Don't gate resource admission on this policy — mutation is background/async.
  admission: true
  background: true
  rules:
    - name: annotate-app-secret-for-reflection
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - "*-app"
              selector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
      mutate:
        # Apply to already-existing matching secrets when this policy is created/updated.
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: v1
            kind: Secret
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          metadata:
            annotations:
              reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
              reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "databases"
              reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
              reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "databases"
