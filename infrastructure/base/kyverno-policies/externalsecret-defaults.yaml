---
# RBAC: Kyverno's background controller has NO write access to ESO ExternalSecrets by
# default. mutateExisting (retroactive normalization of the ~58 existing ExternalSecrets)
# needs it — grant via an aggregated ClusterRole. The
# rbac.kyverno.io/aggregate-to-background-controller label wires these rules into the
# kyverno background-controller's aggregated role. Without this the policy reports
# "not authorized to update ExternalSecret". (Mirrors homepage-instance-assignment.yaml.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background:externalsecret-defaults
  labels:
    app.kubernetes.io/part-of: kyverno
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, update, patch]
---
# Mutating policy: default the boilerplate every ExternalSecret in this repo repeats —
#   spec.secretStoreRef: {name: onepassword, kind: ClusterSecretStore}
#   spec.refreshInterval: 1h
# so new ExternalSecrets can omit both and just declare their data/remoteRef.
#
# ADD-IF-ABSENT only (patchStrategicMerge `+(...)` anchors — never overwrite):
#   - the intentional refreshInterval: "0" outliers (generate-once secrets, e.g.
#     minio/cnpg-minio-backup) keep their value;
#   - any future non-onepassword secretStoreRef is left untouched.
# The secretStoreRef rule additionally SKIPS generator-sourced ExternalSecrets
# (dataFrom[].sourceRef.generatorRef — the minio Password-generator secrets), which
# deliberately have NO secretStoreRef; stamping an unused onepassword ref onto them
# would be inert but misleading.
#
# Runs at admission (new/updated ExternalSecrets) AND retroactively via
# mutateExistingOnPolicyUpdate (existing ExternalSecrets, when this policy is
# created/updated), so the fleet gets normalized without touching 58 files.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: externalsecret-defaults
  annotations:
    policies.kyverno.io/title: Default ExternalSecret secretStoreRef and refreshInterval
    policies.kyverno.io/category: Secret Management
    policies.kyverno.io/subject: ExternalSecret
    policies.kyverno.io/description: >-
      Adds-if-absent the cluster-standard secretStoreRef (onepassword ClusterSecretStore)
      and refreshInterval (1h) to every ExternalSecret. Never overwrites explicit values,
      so refreshInterval "0" outliers and non-onepassword stores are preserved; skips
      generator-sourced ExternalSecrets for the store default. Applies retroactively to
      existing ExternalSecrets via mutateExisting.
spec:
  # Don't gate resource admission on this policy — mutation is background/async for
  # existing resources, inline for new ones.
  admission: true
  background: true
  rules:
    # --- Default refreshInterval: 1h (add-if-absent; "0" outliers keep theirs) ----------
    - name: default-refresh-interval
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
      mutate:
        # Apply to already-existing ExternalSecrets when this policy is created/updated.
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: external-secrets.io/v1beta1
            kind: ExternalSecret
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          spec:
            +(refreshInterval): 1h
    # --- Default secretStoreRef: onepassword (add-if-absent, non-generator ES only) -----
    - name: default-secret-store-ref
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
      preconditions:
        all:
          # Skip generator-sourced ExternalSecrets (dataFrom[].sourceRef.generatorRef):
          # they intentionally have no secretStoreRef. Filter on absent dataFrom yields
          # null -> `|| []` -> length 0, so plain store-backed ES still match.
          - key: "{{ length(request.object.spec.dataFrom[?sourceRef] || `[]`) }}"
            operator: Equals
            value: 0
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: external-secrets.io/v1beta1
            kind: ExternalSecret
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          spec:
            # `+()` on the key adds the whole block only when secretStoreRef is absent —
            # an existing (possibly non-onepassword) ref is never modified.
            +(secretStoreRef):
              name: onepassword
              kind: ClusterSecretStore
