---
# Derives the MECHANICAL gethomepage annotations from the IngressRoute spec itself, so new
# routes only need the genuinely-unique ones (enabled/name/group/icon/description/widget.type
# + widget credentials).
# Companion to homepage-instance-assignment.yaml (TALOS-vo0i / TALOS-kjcn).
#
#   gethomepage.dev/siteMonitor  <- http://<routes[0].services[0].name>.<ns>.svc.cluster.local:<port>
#   gethomepage.dev/href         <- http(s)://<host from Host(`...`) in routes[0].match>
#   gethomepage.dev/widget.url   <- the siteMonitor value (identical in 16/16 live routes)
#
# ADD-IF-ABSENT ONLY (`+(...)` strategic-merge anchors): any hand-set value ALWAYS wins.
# This is deliberate — hand-set values encode things the spec can't know: health-check paths
# (minio `/minio/health/live`, alloy `/-/ready`), portless URLs (argocd-server, hubble-ui),
# href sub-paths (pihole `/admin`, iocaine), external hosts (forge/registry.knowledgedump.space),
# and non-first-service/port divergences (maintainerr :80 vs svc :6246, pulsarr :80 vs :3003).
# Never convert this policy to overwrite.
#
# Why patchStrategicMerge (not patchesJson6902 like the sibling policy): Kyverno forbids
# variables only in JSON6902 *paths*; here the KEYS are static and only the VALUES are
# variables, which strategic merge supports fine.
#
# Guard rails (preconditions) — a rule SKIPS rather than derive something wrong when:
#   - siteMonitor: routes[0].services[0] is missing, is a TraefikService (no <name>.<ns>.svc
#     DNS), or its port is a NAME (e.g. `http`) instead of a number.
#   - href: routes[0].match has no Host(`...`) clause (Path-only/CIDR matches).
#   - widget.url: the route declares no widget.type, or siteMonitor is not (yet) set.
# Multi-`Host()` matches use the FIRST host (non-greedy regex).
#
# RBAC: reuses the aggregated ClusterRole kyverno:background:homepage-instance (defined in
# homepage-instance-assignment.yaml) — it already grants the background controller
# update/patch on traefik.io/ingressroutes. Do not delete that ClusterRole while this
# policy exists.
#
# Applies at admission (async, via background controller — same mutateExisting pattern as
# the sibling policy) AND retroactively to all existing IngressRoutes on policy create/update.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: homepage-annotation-derivation
  annotations:
    policies.kyverno.io/title: Homepage annotation derivation
    policies.kyverno.io/category: Homepage
    policies.kyverno.io/subject: IngressRoute
    policies.kyverno.io/description: >-
      Derives gethomepage.dev/siteMonitor (in-cluster service URL), gethomepage.dev/href
      (LAN host URL, scheme taken from the entrypoint) and gethomepage.dev/widget.url
      (mirrors siteMonitor) from the IngressRoute spec for every homepage-enabled route
      that does not already set them. Add-if-absent only — hand-set values always win.
      Applies retroactively to existing IngressRoutes via mutateExisting.
spec:
  admission: true
  background: true
  rules:
    # --- siteMonitor: http://<svc>.<ns>.svc.cluster.local:<port> ------------------------
    - name: derive-site-monitor
      match:
        any:
          - resources: { kinds: [IngressRoute] }
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."gethomepage.dev/enabled" || '''' }}'
            operator: Equals
            value: "true"
          # First service of the first route must exist and be a plain Service (a
          # TraefikService has no <name>.<ns>.svc.cluster.local DNS record).
          - key: '{{ request.object.spec.routes[0].services[0].name || '''' }}'
            operator: NotEquals
            value: ""
          - key: '{{ request.object.spec.routes[0].services[0].kind || ''Service'' }}'
            operator: Equals
            value: Service
          # Port must be numeric — a named port (e.g. `http`) would derive a bogus URL.
          - key: '{{ regex_match(''^[0-9]+$'', to_string(request.object.spec.routes[0].services[0].port || ''absent'')) }}'
            operator: Equals
            value: true
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          metadata:
            annotations:
              +(gethomepage.dev/siteMonitor): 'http://{{ request.object.spec.routes[0].services[0].name }}.{{ request.object.metadata.namespace }}.svc.cluster.local:{{ request.object.spec.routes[0].services[0].port }}'
    # --- href: http(s)://<host> from the Host(`...`) clause of routes[0].match -----------
    - name: derive-href
      match:
        any:
          - resources: { kinds: [IngressRoute] }
      context:
        # Scheme comes from the entrypoint. Verified cluster-wide (2026-08-21): every
        # IngressRoute lists EXACTLY ONE of `web` (111) or `websecure` (79) — never both, never
        # neither — so membership of `websecure` is an unambiguous discriminator. This is the
        # whole reason ~45 of the 50 hand-written href annotations existed: they were there only
        # to say https. (TALOS-a38d.1)
        # `|| to_array('web')` keeps the expression total if a route ever omits entryPoints;
        # http:// is the conservative guess and a hand-set href still wins regardless.
        - name: scheme
          variable:
            jmesPath: "contains(request.object.spec.entryPoints || to_array('web'), 'websecure') && 'https' || 'http'"
            default: http
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."gethomepage.dev/enabled" || '''' }}'
            operator: Equals
            value: "true"
          # Only derive when there is an actual Host(`...`) clause to extract from.
          - key: '{{ regex_match(''Host\(`[^`]+`\)'', request.object.spec.routes[0].match || '''') }}'
            operator: Equals
            value: true
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          metadata:
            annotations:
              # Non-greedy `.*?` -> first Host() clause wins on multi-host matches.
              +(gethomepage.dev/href): '{{ scheme }}://{{ regex_replace_all(''^.*?Host\(`([^`]+)`\).*$'', request.object.spec.routes[0].match, ''${1}'') }}'
    # --- widget.url: mirrors siteMonitor -------------------------------------------------
    # Homepage widgets that talk to the app's own API point at the in-cluster service, i.e. the
    # same URL siteMonitor already carries: byte-identical in 16 of 16 live routes that set both.
    # Widgets pointing somewhere else (a sidecar, an external API) just set widget.url by hand
    # and the `+()` anchor leaves it alone. (TALOS-a38d.2)
    #
    # Reads the siteMonitor ANNOTATION rather than re-deriving it from the spec, so a hand-set
    # siteMonitor (health-check paths, portless URLs) propagates to the widget too. This rule
    # therefore CHAINS off derive-site-monitor: on a brand-new route the object has no siteMonitor
    # when it is admitted, and derive-site-monitor's own patch is what re-triggers this rule.
    # Verified live (TALOS-a38d probe, 2026-08-21): a fresh IngressRoute carrying only
    # enabled+widget.type got siteMonitor AND the matching widget.url within one poll interval,
    # so the chain closes on its own. Worst case it lands on the next mutateExistingOnPolicyUpdate
    # pass — eventually consistent, never wrong.
    - name: derive-widget-url
      match:
        any:
          - resources: { kinds: [IngressRoute] }
      preconditions:
        all:
          - key: '{{ request.object.metadata.annotations."gethomepage.dev/enabled" || '''' }}'
            operator: Equals
            value: "true"
          # Only routes that actually declare a widget.
          - key: '{{ request.object.metadata.annotations."gethomepage.dev/widget.type" || '''' }}'
            operator: NotEquals
            value: ""
          - key: '{{ request.object.metadata.annotations."gethomepage.dev/siteMonitor" || '''' }}'
            operator: NotEquals
            value: ""
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            name: "{{ request.object.metadata.name }}"
            namespace: "{{ request.object.metadata.namespace }}"
        patchStrategicMerge:
          metadata:
            annotations:
              +(gethomepage.dev/widget.url): '{{ request.object.metadata.annotations."gethomepage.dev/siteMonitor" }}'
