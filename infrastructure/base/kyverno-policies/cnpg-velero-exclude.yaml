---
# Keep Velero off the pods and PVCs of every CloudNativePG cluster that backs ITSELF up.
#
# THE INVARIANT: this homelab runs two backup systems with a strict demarcation — CNPG owns
# Postgres (barman WAL archiving to MinIO + a daily ScheduledBackup), Velero owns everything
# else. Velero must therefore SKIP CNPG's pods and PVCs: a filesystem-level snapshot of a
# running Postgres data directory is a torn, non-point-in-time copy that is worse than no
# copy at all, because it looks like a backup and will not restore. The mechanism is the
# label `velero.io/exclude-from-backup: "true"`, which CNPG propagates from the Cluster's
# `spec.inheritedMetadata` down onto every child object it creates. Restoring one of these
# databases is ALWAYS a CNPG recovery, never a Velero restore.
#
# THE BOILERPLATE THIS REPLACES: 11 hand-written copies of the same three lines, one per
# CNPG Cluster. Verified live 2026-08-21 — all 11 clusters carry the label today, so
# INSTALLING THIS POLICY IS A ZERO-DIFF CHANGE. That is deliberate and is the whole
# sequencing argument: land the policy while every manifest still carries the label (nothing
# can move), and only then strip the literals one at a time in a separate pass with its own
# verification. The literals are NOT stripped by this commit.
#
# Two of the 11 live in SISTER repos (boomtime/boomtime-postgres and openscad/
# manyfold-postgres, both ArgoCD-managed) which this repo cannot edit. A ClusterPolicy is
# the only mechanism that can hold the invariant over those two, which is the main reason
# this is a policy at all rather than a lint rule. (TALOS-a38d.4)
#
# ---------------------------------------------------------------------------------------
# *** SAFETY: THIS LABEL REMOVES BACKUP COVERAGE. IT IS ONLY CORRECT WHERE CNPG ACTUALLY
# *** HAS BACKUPS CONFIGURED. Excluding a cluster that CNPG does not back up does not move
# *** its data to another system — it leaves the data with NO coverage at all, silently, and
# *** the failure is invisible until a restore is attempted.
#
# This is not hypothetical. TALOS-1psu is exactly this bug in production: boomtime/
# books-postgres carries `velero.io/exclude-from-backup: "true"` (hand-written, copied from a
# sibling manifest along with a comment asserting "CNPG owns its own backups") while having
# no barman plugin, no ObjectStore and no ScheduledBackup. Velero skips it because the label
# says to; CNPG never backs it up because nothing told it to. It has been live unprotected
# data since 2026-08-19. A second instance of the same copy-paste, gaming/guacamole-postgres,
# was found while grounding this policy — same label, same untrue comment, same zero
# coverage.
#
# So the naive version of this policy — "label every CNPG Cluster" — would have MECHANISED
# that bug and made it permanent. The precondition below exists to make that impossible:
# a cluster is excluded from Velero only if it demonstrably backs itself up. See the note on
# the precondition for why the discriminator is exact and which direction it fails in.
# ---------------------------------------------------------------------------------------
#
# ADD-IF-ABSENT ONLY, via the `+()` anchor on the LEAF key. A hand-set value always wins and
# unrelated inherited labels are preserved. Note the anchor placement: the parent keys
# (`spec`, `inheritedMetadata`, `labels`) are PLAIN, and only the label key is wrapped. This
# is load-bearing and is the same gotcha recorded for the HelmRelease pass in TALOS-a38d.5 —
# a `+()` anchor on a parent means "add this whole subtree only if the parent is absent",
# so `+(inheritedMetadata)` would silently do NOTHING on the 11 clusters that already have an
# `inheritedMetadata` block (which is all of them). Plain parents let strategic merge recurse
# into the existing map and merge at the leaf, which is what actually adds the label without
# clobbering siblings such as `inheritedMetadata.annotations` or the reflector labels.
#
# Unlike the sibling ingressroute-tls-default.yaml, strategic merge is safe here: that policy
# had to fall back to JSON6902 because it materialises an EMPTY map, which contributes no
# leaf and makes the merge a silent no-op. This patch's leaf value is the non-empty string
# "true", so it merges normally. Proven, not assumed — see the admission tests in the commit.
#
# ADMISSION-ONLY — deliberately no mutateExisting, for three independent reasons:
#   1. Nothing to backfill. All 11 live clusters already carry the label literally, so a
#      retroactive pass would be 11 no-ops.
#   2. It would need new RBAC. mutateExisting runs in the BACKGROUND controller, which has no
#      write access to postgresql.cnpg.io/clusters and would need an aggregated ClusterRole
#      (the pattern in reflect-cnpg-app-secrets.yaml). Admission-time mutation needs none, so
#      this policy adds ZERO permissions to the cluster. `background: false` for the same
#      reason.
#   3. It is the dangerous direction. mutateExisting writes to the LIVE spec of a running
#      database: it would put the two ArgoCD-tracked clusters permanently OutOfSync against
#      their sister repos, and a spec write to a healthy Cluster is a change the CNPG operator
#      reconciles onto its children. Not worth it to re-set a label that is already set.
#   Admission coverage is sufficient regardless of who creates the object — a new Cluster
#   applied by ArgoCD, Flux or by hand all pass through the same webhook.
#
# ORDERING for the follow-up strip pass: this policy must be live BEFORE any manifest loses
# its literal label, since the label is only re-added when the object is next admitted. For
# the two ArgoCD-tracked clusters, stripping additionally means the live object will differ
# from git, so it needs an `ignoreDifferences` entry on the Application or the sister repo
# keeps its literal. Strip one at a time and re-check `kubectl get cluster -A` in between.
#
# failurePolicy Ignore: this is a defaulting convenience, never a gate. A wedged Kyverno
# webhook must not be able to block a Postgres cluster from being created or updated —
# especially not during an incident, when creating a recovery cluster is the fix.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnpg-velero-exclude
  labels:
    app.kubernetes.io/part-of: kyverno
  annotations:
    policies.kyverno.io/title: Exclude self-backing CNPG clusters from Velero
    policies.kyverno.io/category: Backup
    policies.kyverno.io/subject: Cluster
    policies.kyverno.io/description: >-
      Adds spec.inheritedMetadata.labels[velero.io/exclude-from-backup]=true to any
      CloudNativePG Cluster that configures the barman-cloud plugin, so CNPG's pods and PVCs
      are skipped by Velero and Postgres restores go through CNPG recovery instead. Enforces
      the backup demarcation centrally, including on the two clusters that live in sister
      repos this repo cannot edit. Add-if-absent, so a hand-set value always wins. Clusters
      with NO barman plugin are deliberately left unlabelled so Velero still covers them —
      excluding a cluster CNPG does not back up leaves it with no coverage at all (TALOS-1psu).
spec:
  # Mutation only — never block a CNPG Cluster because of this.
  failurePolicy: Ignore
  admission: true
  background: false
  rules:
    - name: add-velero-exclude-to-backed-up-clusters
      match:
        any:
          # Fully qualified: pins the CNPG API group/version so the match cannot silently
          # widen if another CRD ever serves a kind named Cluster (Crossplane and Cilium both
          # ship kinds that collide on the short name).
          - resources:
              kinds:
                - postgresql.cnpg.io/v1/Cluster
      preconditions:
        all:
          # *** THE SAFETY GATE — read the SAFETY block above before touching this. ***
          #
          # Only label a cluster that demonstrably backs ITSELF up, i.e. one that declares the
          # barman-cloud CNPG-I plugin. That plugin is what performs WAL archiving to an
          # ObjectStore, and it is the prerequisite for a ScheduledBackup to have anywhere to
          # write.
          #
          # Verified exact, cluster-wide 2026-08-21: of the 11 live CNPG Clusters, the 9 that
          # declare the barman-cloud plugin are EXACTLY the 9 that have a ScheduledBackup, and
          # the 2 that do not (boomtime/books-postgres, gaming/guacamole-postgres) are exactly
          # the 2 with zero backup coverage. Zero exceptions in either direction, so plugin
          # presence is a faithful proxy for "CNPG owns this cluster's backups".
          #
          # WHY NOT LOOK UP THE ScheduledBackup DIRECTLY (an apiCall context) — it is the more
          # literal reading of the invariant and it is unusable: a Cluster and its
          # ScheduledBackup are applied by the same kustomization, so at the Cluster's
          # admission the ScheduledBackup usually does not exist yet. The lookup would fail on
          # every genuine first-apply and the cluster would never be labelled. The plugin
          # stanza is on the object being admitted, so it is always available and needs no
          # context, no API call and no read RBAC.
          #
          # FAILURE DIRECTION IS SAFE, and this is the point. A backup route this precondition
          # does not recognise (a future CNPG-I backup plugin; the in-tree
          # spec.backup.barmanObjectStore, removed in CNPG 1.30) means the cluster is NOT
          # labelled, so Velero keeps backing it up — redundant, wasteful, harmless. The
          # naive unconditional policy fails the other way: it would stamp the label onto a
          # cluster with no backups at all and delete its last coverage. Prefer a redundant
          # backup over a silent gap; if this ever needs relaxing, relax it toward MORE
          # coverage.
          #
          # not_null(..., `[]`) keeps the expression TOTAL: spec.plugins is absent on the 2
          # unbacked clusters, and a filter projection over null would error rather than
          # evaluate to empty. The `enabled != false` term catches a plugin that is declared
          # but switched off, which archives nothing.
          #
          # Kept on ONE line on purpose: a YAML folded scalar (>-) indents the continuation
          # and folds it back as a literal newline inside the JMESPath. It happens to
          # evaluate the same, but do not reintroduce the line break.
          - key: "{{ length(not_null(request.object.spec.plugins, `[]`)[?name == 'barman-cloud.cloudnative-pg.io' && enabled != `false`]) }}"
            operator: GreaterThan
            value: 0
      mutate:
        # ADD-IF-ABSENT. Anchor on the LEAF only; parents stay plain so strategic merge
        # recurses into an existing inheritedMetadata instead of skipping it. See the note
        # above — this placement is the difference between working and silently doing nothing.
        patchStrategicMerge:
          spec:
            inheritedMetadata:
              labels:
                +(velero.io/exclude-from-backup): "true"
