---
# Intel Device Plugins Operator - Manages Intel hardware device plugins
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: intel
  namespace: flux-system
spec:
  interval: 24h
  url: https://intel.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: intel-device-plugins
spec:
  interval: 30m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: '0.36.*' # Use latest 0.36.x (matches plugin/initImage 0.36.0)
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Operator manages GPU, QAT, SGX plugins via CRDs.
    #
    # resources is TOP-LEVEL. It was nested under `operator:`, which is not a chart
    # key, so it was silently ignored and the controller ran chart defaults
    # (100m/100Mi) rather than the 10m/64Mi below.
    #
    # The `kubeRbacProxy` image override that used to sit here is REMOVED, not
    # relocated: chart 0.36.0 has no kube-rbac-proxy anywhere -- no values key, no
    # template reference -- and the live Deployment has exactly one container
    # (`manager`). The deprecated-gcr.io problem it described is genuinely gone
    # upstream, so there is nothing left to point at quay.io/brancz. TALOS-1zwj.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
