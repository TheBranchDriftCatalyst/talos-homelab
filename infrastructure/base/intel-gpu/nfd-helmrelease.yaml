---
# Node Feature Discovery - Auto-detect and label node hardware features
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 30m
  chart:
    spec:
      chart: node-feature-discovery
      version: '0.19.*' # 0.19.x (was 0.18.x — fixed v0.17.4 fatal-on-transient-API-loss churn, TALOS-8u7)
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Master component (runs on control plane)
    master:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    # Worker component (runs on all nodes as DaemonSet)
    worker:
      # Measured 7d to 2026-08-24: p50 61Mi, peak 70Mi per node. The 32Mi
      # request was roughly half the steady state on every node, and the
      # chart's 512Mi limit was 7x peak -- wrong in both directions.
      # BURSTABLE 96Mi / 192Mi. (TALOS-gj3n)
      resources:
        requests:
          cpu: 5m
          memory: 96Mi
        limits:
          memory: 192Mi
      config:
        sources:
          cpu:
            cpuid:
              # Exclude common features to reduce label noise
              attributeBlacklist:
                - BMI1
                - BMI2
                - CLMUL
                - CMOV
                - CX16
                - ERMS
                - F16C
                - HTT
                - LZCNT
                - MMX
                - MMXEXT
                - NX
                - POPCNT
                - RDRAND
                - RDSEED
                - RDTSCP
                - SSE
                - SSE2
                - SSE3
                - SSE4
                - SSE42
                - SSSE3
          pci:
            deviceClassWhitelist:
              - '0200' # Network controller
              - '03' # Display controller (GPU)
              - '0300' # VGA controller
              - '0302' # 3D controller
              - '12' # Processing accelerators
            deviceLabelFields:
              - class
              - vendor
              - device

    # Garbage collector for stale labels
    gc:
      enable: true
      replicaCount: 1
      interval: 1h
      # Measured 7d to 2026-08-24: p50 40Mi, peak 42Mi -- flat, and it runs
      # hourly. 128Mi request against 42Mi peak was 86Mi reserved for nothing;
      # the chart's 1024Mi limit was 24x peak. (TALOS-gj3n)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    # Prometheus metrics
    prometheus:
      enable: true
