---
# Node Feature Discovery - Auto-detect and label node hardware features
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 30m
  chart:
    spec:
      chart: node-feature-discovery
      version: '0.19.*' # 0.19.x (was 0.18.x — fixed v0.17.4 fatal-on-transient-API-loss churn, TALOS-8u7)
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Master component (runs on control plane)
    master:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    # Worker component (runs on all nodes as DaemonSet)
    worker:
      # Measured 7d to 2026-08-24: p50 61Mi, peak 70Mi per node. The 32Mi
      # request was roughly half the steady state on every node, and the
      # chart's 512Mi limit was 7x peak -- wrong in both directions.
      # BURSTABLE 96Mi / 192Mi. (TALOS-gj3n)
      resources:
        requests:
          cpu: 5m
          memory: 96Mi
        limits:
          memory: 192Mi
      config:
        sources:
          cpu:
            cpuid:
              # Exclude common features to reduce label noise
              attributeBlacklist:
                - BMI1
                - BMI2
                - CLMUL
                - CMOV
                - CX16
                - ERMS
                - F16C
                - HTT
                - LZCNT
                - MMX
                - MMXEXT
                - NX
                - POPCNT
                - RDRAND
                - RDSEED
                - RDTSCP
                - SSE
                - SSE2
                - SSE3
                - SSE4
                - SSE42
                - SSSE3
          pci:
            deviceClassWhitelist:
              - '0200' # Network controller
              - '03' # Display controller (GPU)
              - '0300' # VGA controller
              - '0302' # 3D controller
              - '12' # Processing accelerators
              - '0280' # Wireless network controller — the WiFi cards
            deviceLabelFields:
              - class
              - vendor
              - device

          # USB. NOT enabled by the chart — NFD's default USB whitelist is 0e/ef/fe/ff
          # (video, misc, application, vendor-specific), which is why this cluster had
          # ZERO usb-* labels despite every bare-metal node carrying a Bluetooth radio.
          #
          # These are the classes worth scheduling against, i.e. "I plugged a thing in and
          # a pod needs to find it":
          usb:
            deviceClassWhitelist:
              - '02' # CDC / communications — serial adapters
              - '03' # HID
              - '08' # Mass storage
              - '0a' # CDC data — the other half of USB serial
              - '0e' # Video — webcams, capture cards
              - 'e0' # Wireless — Bluetooth radios live here
            # class ONLY, deliberately — no vendor, no device.
            #
            # The pci source above labels class_vendor_device, which is right for GPUs where
            # you care WHICH card. Here the question is "does this node have a Bluetooth
            # radio / a serial dongle at all", and the hardware differs per node: Intel
            # 8087:0026 on talos06, 8087:0037 on talos02-gpu, 8087:0032 on talos01, Realtek
            # 0bda:a728 on talos03 and talos06. Labelling by vendor+device would give a
            # DIFFERENT label on every node and nothing could select them as a group.
            #
            # With class only, every node with any Bluetooth radio gets the same label:
            #     feature.node.kubernetes.io/usb-e0.present=true
            # and any node with a Zigbee/Matter stick gets usb-02 / usb-0a. That is what
            # applications/bt-radar/base/40-bt-agent.yaml selects on. Plug a dongle into any
            # node and it is labelled within one NFD interval — no manual kubectl label —
            # and the label disappears again when it is unplugged.
            deviceLabelFields:
              - class

    # Garbage collector for stale labels
    gc:
      enable: true
      replicaCount: 1
      interval: 1h
      # Measured 7d to 2026-08-24: p50 40Mi, peak 42Mi -- flat, and it runs
      # hourly. 128Mi request against 42Mi peak was 86Mi reserved for nothing;
      # the chart's 1024Mi limit was 24x peak. (TALOS-gj3n)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    # Prometheus metrics
    prometheus:
      enable: true
