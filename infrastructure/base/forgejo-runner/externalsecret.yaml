---
# The runner's registration token.
#
# Forgejo issues this from Site Administration -> Actions -> Runners ("Create
# new runner"). It is a ONE-SHOT enrolment credential, not a long-lived one:
# `forgejo-runner register` trades it for a durable runner secret written to
# /data/.runner, and the token is spent at that point. That is why the init
# container below is guarded on .runner already existing — re-running register
# with a spent token fails, and on a pod restart that would be the only thing
# standing between the runner and a CrashLoop.
#
# Stored in 1Password item `forgejo`, property `runner-registration-token`,
# alongside the OIDC client secret that item already holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secrets
  namespace: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: forgejo-runner-secrets
    creationPolicy: Owner
  data:
    - secretKey: registration-token
      remoteRef:
        key: forgejo
        property: runner-registration-token
