---
# Runner state, all on one volume: /data/.runner (the durable credential
# register() writes), the action cache, the docker CLI staged for job
# containers, and the Docker daemon's own image store. RWO + Recreate, single
# replica — two runners sharing one .runner file would both answer as the same
# registered runner.
#
# local-path rather than NFS: this is caches and one small credential file, all
# rewritten constantly, and none of it is worth replicating. A lost cache costs
# one slow build.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo-runner
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# The runner's own config — NOT the workflow's.
#
# LABELS ARE THE CONTRACT between this file and `runs-on:` in a workflow. A job
# whose `runs-on` matches no label here is not rejected; it sits queued forever
# with no error anywhere, which is the most confusing failure this component
# has. `docker` and `ubuntu-latest` both map to the same image so a workflow
# copied from a GitHub repo runs unmodified.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yml: |
    log:
      level: info
    runner:
      capacity: 1
      timeout: 30m
      labels:
        - "docker:docker://node:22-bookworm"
        - "ubuntu-latest:docker://node:22-bookworm"
        # A Python job image. Added because actions/setup-python cannot work
        # on a private runner: it resolves its code from the mirror and then
        # downloads the interpreter from GitHub, which this chain deliberately
        # cannot reach. An image that already IS 3.12 needs no action at all.
        # It has no node, so a workflow using this label cannot use JavaScript
        # actions — actions/checkout included — and has to `git fetch`.
        - "python:docker://python:3.12-bookworm"
      # Handed to every job. DOCKER_CONFIG points at the read-only mount below,
      # so `docker push` is already authenticated to Zot and a workflow needs no
      # login step and no repo secrets — see zot-dockerconfig.yaml.
      envs:
        DOCKER_CONFIG: /zotcfg
    cache:
      enabled: true
      dir: /data/cache
    container:
      # Talk to the DinD sidecar over the socket they share. Without this the
      # runner looks for the HOST's /var/run/docker.sock, which on Talos does
      # not exist at all — containerd is the runtime and there is no dockerd.
      docker_host: unix:///var/run/docker.sock
      # EMPTY, so act_runner creates a network per job — not "bridge".
      #
      # Naming the default bridge looked harmless and broke service
      # containers. Docker's default bridge has no embedded DNS, so a job
      # cannot resolve its own services by name: a Postgres service reported
      # healthy while the job got "could not translate host name db to
      # address". A per-job user-defined network provides that resolution, and
      # it also isolates concurrent jobs from each other.
      network: ""
      privileged: false
      # THE JOB IMAGE HAS NO DOCKER CLI. node:22-bookworm carries node and git
      # (which actions/checkout needs) and nothing else, so a workflow that
      # shells out to `docker` would fail with "command not found" despite a
      # perfectly good daemon on the other end of the socket. Rather than
      # maintain a bespoke image, the CLI is staged onto the shared volume by an
      # init container and bind-mounted in. It is a statically linked Go binary
      # — verified: `ldd` reports "not a valid dynamic program" — so the copy
      # taken from an Alpine image runs unmodified on Debian.
      #
      # The daemon resolves these source paths against ITS OWN filesystem, which
      # is why the DinD container mounts /data and /zotcfg too.
      options: -v /data/bin/docker:/usr/local/bin/docker:ro -v /zotcfg:/zotcfg:ro
      valid_volumes:
        - /data/cache
        - /data/bin/docker
        - /zotcfg
---
# Forgejo Actions runner + a Docker daemon for it to build with.
#
# WHY DinD AND NOT THE HOST SOCKET: Talos has no host Docker. A build needs a
# daemon, so the pod brings its own. The sidecar is `privileged: true`, which is
# the whole reason this lives in its own namespace; see
# namespaces/forgejo-runner.yaml.
#
# TLS IS OFF between the two containers (DOCKER_TLS_CERTDIR=""). They share an
# emptyDir socket inside ONE pod — the traffic never leaves it — and the
# alternative is provisioning and rotating certs for a localhost link. The
# socket directory is an emptyDir, not a hostPath, so nothing outside the pod
# can reach the daemon either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC, and one .runner credential
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # Stage the docker CLI where job containers can bind-mount it. `cp -f`
        # every start rather than a guard, so a version bump to the image below
        # actually takes effect — this is 45MB onto a local disk, not something
        # worth being clever about.
        - name: stage-docker-cli
          image: docker:29.8-cli
          command: [sh, -ceu]
          args:
            - |
              mkdir -p /data/bin
              cp -f /usr/local/bin/docker /data/bin/docker
              chmod 0755 /data/bin/docker
              echo "staged $(/data/bin/docker --version)"
          volumeMounts:
            - { name: data, mountPath: /data }

        # Enrol once, then never again. The guard is not a nicety: registering
        # writes a durable credential to /data/.runner, and an unconditional
        # re-register on every pod restart is both pointless and noisy. The
        # token itself comes from the Secret that token-job.yaml maintains — no
        # human copies it out of the UI any more.
        - name: register
          image: code.forgejo.org/forgejo/runner:13.2.0
          command: [sh, -ceu]
          args:
            - |
              if [ -f /data/.runner ]; then
                echo "already registered; leaving /data/.runner alone"
                exit 0
              fi
              # The IN-CLUSTER service, not forge.knowledgedump.space: this hop
              # never needs to leave the cluster, and routing it through Traefik
              # and public DNS would make enrolment depend on ingress being up.
              forgejo-runner register --no-interactive \
                --instance "http://forgejo.forgejo.svc.cluster.local:3000" \
                --token "${REGISTRATION_TOKEN}" \
                --name "talos00-k8s" \
                --labels "docker:docker://node:22-bookworm,ubuntu-latest:docker://node:22-bookworm,python:docker://python:3.12-bookworm"
          env:
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef: { name: forgejo-runner-registration, key: registration-token }
          volumeMounts:
            - { name: data, mountPath: /data }
          workingDir: /data
      containers:
        - name: dind
          image: docker:29.8-dind
          # dockerd creates the socket root:docker, and `docker` is a GID that
          # exists only inside this Alpine image — the runner container next to
          # it is not in that group and gets "permission denied while trying to
          # connect to the docker API". Handing the socket to GID 1000 fixes it
          # for every container in the pod at once, because `fsGroup: 1000`
          # above is already in each one's supplementary groups.
          args: ["--group", "1000"]
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # see the note above
          volumeMounts:
            - { name: docker-sock, mountPath: /var/run }
            # The image store, on the PVC. Without this it lands in the
            # container's writable layer and every pod restart throws away all
            # cached layers, so each build starts cold.
            - { name: data, mountPath: /var/lib/docker, subPath: docker }
            # /data and /zotcfg are mounted HERE as well as in the runner, and
            # not by accident: the daemon creates the job containers, so it is
            # the daemon's filesystem that has to contain the bind-mount
            # sources named in container.options above.
            - { name: data, mountPath: /data }
            - { name: zotcfg, mountPath: /zotcfg, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 4Gi }
          # `docker info` rather than a TCP probe: the socket answering is the
          # only thing the runner needs, and it is what is slow on a cold start.
          readinessProbe:
            exec: { command: [docker, info] }
            initialDelaySeconds: 10
            periodSeconds: 10

        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.0
          # WAIT FOR THE DAEMON FIRST. The runner starts faster than dockerd and
          # exits 1 with "cannot ping the docker daemon", so without this it
          # CrashLoops three or four times on every rollout before settling.
          # That is self-correcting and it is also indistinguishable, at a
          # glance, from the permission fault it looked like the first time.
          #
          # Uses the CLI the init container staged — this image has no docker
          # binary of its own, which is the same reason job containers get one
          # bind-mounted.
          command: [sh, -ceu]
          args:
            - |
              until /data/bin/docker info >/dev/null 2>&1; do
                echo "waiting for the docker daemon"
                sleep 2
              done
              exec forgejo-runner daemon --config /config/config.yml
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          volumeMounts:
            - { name: docker-sock, mountPath: /var/run }
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
            - { name: zotcfg, mountPath: /zotcfg, readOnly: true }
          workingDir: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: docker-sock
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: zotcfg
          secret:
            secretName: zot-dockerconfig
