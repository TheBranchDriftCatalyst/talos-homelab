# Scrape the CF records exporter → Mimir (Alloy scrapes any PodMonitor).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-dns-cf-exporter
  namespace: external-dns
  labels:
    app: external-dns-cf-exporter
spec:
  selector:
    matchLabels:
      app: external-dns-cf-exporter
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
