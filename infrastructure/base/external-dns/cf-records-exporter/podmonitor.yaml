# Scrape the CF records exporter → Mimir (Alloy scrapes any PodMonitor).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-dns-cf-exporter
  namespace: external-dns
  labels:
    app: external-dns-cf-exporter
spec:
  selector:
    matchLabels:
      app: external-dns-cf-exporter
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      # TALOS-lfxg: /metrics serves a cached snapshot refreshed every 5m (SCRAPE_INTERVAL),
      # so 30s scraping just duplicates points — 60s matches the data cadence. This does NOT
      # touch the Cloudflare API (no CF-side rate impact); it only reads the local cache.
      interval: 60s
