---
# TLS cert for the 1Password Connect API, signed by the internal homelab CA (TALOS-dw2p #2).
# Lets Connect serve HTTPS on :8443 alongside HTTP:8080 so ESO can be cut over without downtime.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onepassword-connect-tls
  namespace: external-secrets
spec:
  secretName: onepassword-connect-tls
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d
  privateKey: {algorithm: ECDSA, size: 256}
  dnsNames:
    - onepassword-connect.external-secrets.svc.cluster.local
    - onepassword-connect.external-secrets.svc
    - onepassword-connect
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
