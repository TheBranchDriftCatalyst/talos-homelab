apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      # TALOS-8q0 two-step migration (step 1 of 2): 0.16.2 serves BOTH
      # external-secrets.io/v1 and v1 — the API break is v0.17 (stops
      # serving v1beta1). Repo manifests get rewritten to v1 next, THEN the
      # jump to 2.6.0 (newest line tested on k8s 1.34; 2.7+ wants 1.35+).
      # TALOS-8q0 step 2/2: all v1beta1 manifests rewritten to v1 (repo +
      # boomtime + catalyst-data). 2.6.0 = newest line tested on k8s 1.34
      # per the ESO stability matrix — no 2.7+ until the k8s 1.35/1.36
      # campaign lands.
      version: '2.6.0'
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # External Secrets Operator configuration
    installCRDs: true

    # Webhook configuration
    webhook:
      port: 9443

    # Resources
    resources:
      requests:
        cpu: 10m
        memory: 64Mi

    # Metrics and monitoring
    serviceMonitor:
      enabled: true
      interval: 30s

    # Cert controller for webhook certificates
    certController:
      create: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
