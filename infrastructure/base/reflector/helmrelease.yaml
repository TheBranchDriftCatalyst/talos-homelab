---
# emberstack/reflector — mirrors Secrets/ConfigMaps across namespaces via annotations.
# Used to reflect the CNPG <cluster>-app secrets into the `databases` namespace so dbgate
# can pre-connect to every CNPG Postgres cluster (TALOS-zadf / TALOS-7jxm). Source secrets
# get the reflector annotations via each CNPG Cluster's spec.inheritedMetadata.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: '10.0.63'
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: kube-system
      interval: 12h
  # KEEP THIS LITERAL. Every other HelmRelease in the repo had its retries stripped in
  # TALOS-a38d.5, because the helmrelease-remediation-defaults Kyverno policy now injects
  # remediation.retries: 3 at admission. This release lives in kube-system, which is in Kyverno's
  # resourceFilters exclusion list, so the webhook NEVER sees it -- removing these lines here
  # would silently drop it to Flux's retries: 0 default, not to 3.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi} # was 128Mi — OOMKilled repeatedly (audit); 2x headroom
