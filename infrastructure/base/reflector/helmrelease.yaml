---
# emberstack/reflector — mirrors Secrets/ConfigMaps across namespaces via annotations.
# Used to reflect the CNPG <cluster>-app secrets into the `databases` namespace so dbgate
# can pre-connect to every CNPG Postgres cluster (TALOS-zadf / TALOS-7jxm). Source secrets
# get the reflector annotations via each CNPG Cluster's spec.inheritedMetadata.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: '10.0.63'
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: kube-system
      interval: 12h
  # KEEP THIS LITERAL. Every other HelmRelease in the repo had its retries stripped in
  # TALOS-a38d.5, because the helmrelease-remediation-defaults Kyverno policy now injects
  # remediation.retries: 3 at admission. This release lives in kube-system, which is in Kyverno's
  # resourceFilters exclusion list, so the webhook NEVER sees it -- removing these lines here
  # would silently drop it to Flux's retries: 0 default, not to 3.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Soft-repel from talos03. gj3n's platform DaemonSets need ~1Gi/node at their measured
    # requests, and talos03 (12.8Gi allocatable, the node that wedged) cannot pay it while
    # also hosting singletons. Preference, not a pin.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [talos03]

    # 7d to 2026-08-24: p50 211Mi, peak 252Mi — it holds a watch on every
    # mirrored secret. The 32Mi request was 6.6x under steady state, and the
    # 256Mi limit (raised after repeated OOMKills) is only 1.02x peak, which
    # is why it kept getting killed. Both corrected. (TALOS-gj3n)
    resources:
      requests: {cpu: 10m, memory: 320Mi}
      limits: {memory: 512Mi}
