---
# Composition for CatalystWebSecureIngress. Renders three objects through provider-kubernetes
# (kubernetes.m.crossplane.io/v1alpha1 Object — the NAMESPACED group, required because a v2
# namespaced composite may only compose namespaced resources):
#   - the websecure IngressRoute (TLS + forward-auth)
#   - the web IngressRoute (:80 -> HTTPS redirect)
#   - the NetworkPolicy (ingress locked to Traefik)
# Every composed resource carries catalyst.io/composition + managed-by so the adoption
# dashboard counts it (and finds hand-written look-alikes that lack the label). TLS is left
# to the cluster's ingressroute-tls-default Kyverno mutation (injects tls:{} on websecure),
# same as every hand-written route here.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: catalyst-websecure-ingress
  labels:
    catalyst.io/provider: kubernetes
spec:
  compositeTypeRef:
    apiVersion: net.catalyst.io/v1alpha1
    kind: CatalystWebSecureIngress
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # ---- 1. websecure IngressRoute (TLS + forward-auth) ----------------------
          - name: ir-websecure
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: traefik.io/v1alpha1
                    kind: IngressRoute
                    metadata:
                      labels:
                        catalyst.io/composition: catalyst-websecure-ingress
                        catalyst.io/managed-by: crossplane
                    spec:
                      entryPoints: [websecure]
                      routes:
                        - kind: Rule
                          match: "PLACEHOLDER"
                          middlewares:
                            - name: authentik
                              namespace: authentik
                          services:
                            - name: PLACEHOLDER
                              port: 80
            patches:
              - fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms: [{type: string, string: {type: Format, fmt: "%s-ir-websecure"}}]
              - fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms: [{type: string, string: {type: Format, fmt: "%s-websecure"}}]
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.host
                toFieldPath: spec.forProvider.manifest.spec.routes[0].match
                transforms: [{type: string, string: {type: Format, fmt: "Host(`%s`)"}}]
              - fromFieldPath: spec.backend.service
                toFieldPath: spec.forProvider.manifest.spec.routes[0].services[0].name
              - fromFieldPath: spec.backend.port
                toFieldPath: spec.forProvider.manifest.spec.routes[0].services[0].port
              # Whole-chain patch: spec.middlewares replaces the base [authentik] default.
              # Skipped when unset (base [authentik] kept). Order is preserved as given.
              - fromFieldPath: spec.middlewares
                toFieldPath: spec.forProvider.manifest.spec.routes[0].middlewares

              # ---- gethomepage.dev/* : navbar + dashboard advertisement ----------
              # Without these the composition emitted NO annotations, so every app
              # built from this XR was structurally invisible to themepark's
              # build_nav.py -- which only advertises a route annotated
              # gethomepage.dev/enabled="true". That was a property of the
              # abstraction, not a mistake on any one claim.
              #
              # Each patch is skipped when its source field is absent (Crossplane's
              # default fromFieldPath policy is Optional), so a claim with no
              # spec.homepage block renders exactly as before.
              #
              # NOTE a link also needs a catalyst* middleware in spec.middlewares.
              # The annotation is only half of build_nav.py's test; carrying one
              # without the other is the silent half-configured case.
              #
              # enabled and weight are converted because annotation VALUES must be
              # strings -- a bool or int here is rejected by the API server, and the
              # XRD types them honestly rather than forcing the operator to quote.
              - fromFieldPath: spec.homepage.enabled
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/enabled"]
                transforms: [{type: convert, convert: {toType: string}}]
              - fromFieldPath: spec.homepage.instance
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/instance"]
              - fromFieldPath: spec.homepage.name
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/name"]
              - fromFieldPath: spec.homepage.description
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/description"]
              - fromFieldPath: spec.homepage.group
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/group"]
              - fromFieldPath: spec.homepage.icon
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/icon"]
              - fromFieldPath: spec.homepage.weight
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/weight"]
                transforms: [{type: convert, convert: {toType: string}}]

              # ---- nav.catalyst.io/* : DECLARED nav membership (phase 5) ----------
              # The nav counterpart to the gethomepage block above, and the reason
              # it exists: build_nav.py INFERS `themed` from middleware name
              # substrings, and infers the group from a free-text annotation. Both
              # inferences have failed in this cluster (see spec.nav's description
              # in xrd.yaml). These annotations carry the DECLARATION instead.
              #
              # BACKWARD COMPATIBILITY IS A PROPERTY OF THE SOURCE PATHS, not of
              # anything written here. Every patch below reads from spec.nav.*, and
              # function-patch-and-transform's only conditional is "skip the patch
              # when its source field path is absent" (v0.10.9, fn.go:221). A claim
              # with no spec.nav block therefore renders byte-identically to before
              # this block was added — which is what keeps kubeview and system-graph,
              # the two live claims, untouched by this change even though
              # compositionUpdatePolicy: Automatic moves them onto the new revision
              # the moment it is committed.
              #
              # NOTHING HERE IS VISIBLE TO THE LIVE PIPELINE. build_nav.py reads two
              # annotation prefixes, `gethomepage.dev/` and `catalyst.nav/`.
              # `nav.catalyst.io/` is neither, so these four keys are inert until the
              # catalyst-nav operator becomes the reader in phase 6. That inertness is
              # the point: it is what lets the declaration land on live routes and be
              # inspected (kubectl get ingressroute -o yaml) before anything depends
              # on it.
              - fromFieldPath: spec.nav.themed
                toFieldPath: spec.forProvider.manifest.metadata.annotations["nav.catalyst.io/themed"]
                transforms: [{type: convert, convert: {toType: string}}]
              - fromFieldPath: spec.nav.group
                toFieldPath: spec.forProvider.manifest.metadata.annotations["nav.catalyst.io/group"]
              - fromFieldPath: spec.nav.order
                toFieldPath: spec.forProvider.manifest.metadata.annotations["nav.catalyst.io/order"]
                transforms: [{type: convert, convert: {toType: string}}]
              # One annotation, comma-joined: annotation values are strings and P&T
              # cannot loop over a list. The XRD forbids commas and whitespace inside
              # each group name and requires minItems: 1, so this encoding is lossless
              # and never emits an empty value (Join on an empty array yields "", which
              # would read as "gated to nobody").
              - fromFieldPath: spec.nav.visibility.authentikGroups
                toFieldPath: spec.forProvider.manifest.metadata.annotations["nav.catalyst.io/visibility.authentik-groups"]
                transforms: [{type: string, string: {type: Join, join: {separator: ","}}}]

              # ---- the two gethomepage keys DERIVED from the nav declaration ------
              # These are what make spec.nav sufficient on its own: the live pipeline
              # still groups by gethomepage.dev/group and sorts by
              # gethomepage.dev/weight, so an app that declared only spec.nav would
              # otherwise land in the "Other" group at weight 50. Deriving them here
              # means one declaration produces correct behaviour in BOTH pipelines with
              # no hand-written annotation and nothing for an operator to keep in sync.
              #
              # The XRD makes spec.homepage.group/.weight mutually exclusive with
              # spec.nav, so each of these annotation keys has exactly ONE source on
              # any admissible claim and the outcome never depends on patch order.
              #
              # THE TITLE MAP IS THE THIRD COPY of the taxonomy (the first is
              # catalyst-nav/taxonomy.yaml, the second the XRD's enum). A `map`
              # transform ERRORS on an unmapped key — ResolveMap returns "key %s is not
              # found in map" — which surfaces as a composition render failure and
              # Synced=False on the claim, not as a missing annotation. The XRD's enum
              # keeps the input inside this key set, and
              # tests/test_nav_taxonomy_drift.py keeps all three copies equal.
              - fromFieldPath: spec.nav.group
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/group"]
                transforms:
                  - type: map
                    map:
                      comms-and-apps: Comms & Apps
                      downloads: Downloads
                      home-and-tools: Home & Tools
                      infrastructure: Infrastructure
                      library: Library
                      media: Media
                      media-automation: Media Automation
                      observability: Observability
              - fromFieldPath: spec.nav.order
                toFieldPath: spec.forProvider.manifest.metadata.annotations["gethomepage.dev/weight"]
                transforms: [{type: convert, convert: {toType: string}}]

          # ---- 2. web IngressRoute (:80 -> HTTPS redirect) -------------------------
          - name: ir-web
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: traefik.io/v1alpha1
                    kind: IngressRoute
                    metadata:
                      labels:
                        catalyst.io/composition: catalyst-websecure-ingress
                        catalyst.io/managed-by: crossplane
                    spec:
                      entryPoints: [web]
                      routes:
                        - kind: Rule
                          match: "PLACEHOLDER"
                          middlewares:
                            - name: redirect-https
                              namespace: traefik
                          services:
                            - name: PLACEHOLDER
                              port: 80
            patches:
              - fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms: [{type: string, string: {type: Format, fmt: "%s-ir-web"}}]
              - fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms: [{type: string, string: {type: Format, fmt: "%s-web"}}]
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.host
                toFieldPath: spec.forProvider.manifest.spec.routes[0].match
                transforms: [{type: string, string: {type: Format, fmt: "Host(`%s`)"}}]
              - fromFieldPath: spec.backend.service
                toFieldPath: spec.forProvider.manifest.spec.routes[0].services[0].name
              - fromFieldPath: spec.backend.port
                toFieldPath: spec.forProvider.manifest.spec.routes[0].services[0].port
              - fromFieldPath: spec.redirectMiddleware.name
                toFieldPath: spec.forProvider.manifest.spec.routes[0].middlewares[0].name
              - fromFieldPath: spec.redirectMiddleware.namespace
                toFieldPath: spec.forProvider.manifest.spec.routes[0].middlewares[0].namespace

          # ---- 3. NetworkPolicy (ingress locked to Traefik) -----------------------
          - name: netpol
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      labels:
                        catalyst.io/composition: catalyst-websecure-ingress
                        catalyst.io/managed-by: crossplane
                    spec:
                      podSelector: {}
                      policyTypes: [Ingress]
                      ingress:
                        # Only Traefik may reach the backend. Everything else (any pod in
                        # any namespace) is default-denied for ingress once this selects the pod.
                        - from:
                            - namespaceSelector:
                                matchLabels:
                                  kubernetes.io/metadata.name: traefik
            patches:
              - fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms: [{type: string, string: {type: Format, fmt: "%s-netpol"}}]
              - fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.backend.selector
                toFieldPath: spec.forProvider.manifest.spec.podSelector.matchLabels
