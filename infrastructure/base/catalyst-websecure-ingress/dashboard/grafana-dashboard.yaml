---
# GrafanaDashboard for CatalystWebSecureIngress — owned by the composition dir, lands in the
# shared 'compositions' folder. Adoption + IngressRoute drying-up candidates (routes without
# the composition label = conversion worklist) + LOC dried. (TALOS-l2sm.10)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: compositions-catalyst-websecure-ingress
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: compositions
spec:
  folderRef: compositions
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-compositions-catalyst-websecure-ingress
    key: dashboard.json
