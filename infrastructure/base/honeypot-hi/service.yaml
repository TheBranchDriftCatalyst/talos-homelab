# ClusterIP only — INTERNAL. No hostPort, no world ingress, no WAN forward (Phase 2a is internal-only).
apiVersion: v1
kind: Service
metadata:
  name: beelzebub
  namespace: honeypot-hi
  labels: {app: beelzebub}
spec:
  type: ClusterIP
  selector: {app: beelzebub}
  ports:
    - {name: ssh, port: 2222, targetPort: 2222, protocol: TCP}
    - {name: metrics, port: 2112, targetPort: 2112, protocol: TCP}
