# LLM API key for Beelzebub's LLMHoneypot plugin. Budget-capped / scoped key (a LiteLLM virtual key
# with a low limit, or a scoped OpenAI key). USER: create 1Password item `beelzebub-llm` (vault
# catalyst-eso) with field `api-key`. Injected into the service config by the initContainer, never
# committed to the ConfigMap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beelzebub-llm-key
  namespace: honeypot-hi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: beelzebub-llm-key
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef: {key: beelzebub-llm, property: api-key}
