# High-interaction honeypot (Phase 2, TALOS-ztch). Beelzebub LLM-emulated SSH — an AI generates a
# convincing shell so it defeats anti-honeypot fingerprinting AND the write+chmod+execute canary, with
# NO real system to escape. INTERNAL-ONLY for now (ClusterIP, no world ingress, no WAN forward); cowrie
# stays the public honeypot until this is validated. No hostPort -> restricted PSS (unlike cowrie).
apiVersion: v1
kind: Namespace
metadata:
  name: honeypot-hi
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
