apiVersion: apps/v1
kind: Deployment
metadata:
  name: beelzebub
  namespace: honeypot-hi
  labels: {app: beelzebub}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: beelzebub}}
  template:
    metadata:
      labels: {app: beelzebub}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # initContainer renders the LLM key from the Secret into the service config (key never in git/CM).
      initContainers:
        - name: render-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'sed "s|__LLM_API_KEY__|$LLM_API_KEY|" /tmpl/ssh-2222.yaml > /services/ssh-2222.yaml && echo rendered'
          env:
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: beelzebub-llm-key, key: LLM_API_KEY}}
          volumeMounts:
            - {name: services-tmpl, mountPath: /tmpl, readOnly: true}
            - {name: services-rendered, mountPath: /services}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      containers:
        - name: beelzebub
          image: m4r10/beelzebub:v3.9.1
          ports:
            - {name: ssh, containerPort: 2222, protocol: TCP}
            - {name: metrics, containerPort: 2112, protocol: TCP}
          volumeMounts:
            - {name: core, mountPath: /configurations/beelzebub.yaml, subPath: beelzebub.yaml, readOnly: true}
            - {name: services-rendered, mountPath: /configurations/services, readOnly: true}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: core, configMap: {name: beelzebub-core}}
        - {name: services-tmpl, configMap: {name: beelzebub-services-tmpl}}
        - {name: services-rendered, emptyDir: {}}
