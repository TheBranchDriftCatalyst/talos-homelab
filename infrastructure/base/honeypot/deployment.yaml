---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeypot
  labels:
    app: cowrie
    app.kubernetes.io/name: cowrie
    app.kubernetes.io/component: honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cowrie
        app.kubernetes.io/name: cowrie
        app.kubernetes.io/component: honeypot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: talos03
      containers:
        - name: cowrie
          image: cowrie/cowrie:latest
          imagePullPolicy: Always
          ports:
            - name: ssh
              containerPort: 2222
              hostPort: 2222
              protocol: TCP
            - name: telnet
              containerPort: 2223
              hostPort: 2223
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: cowrie-config
              mountPath: /cowrie/cowrie-git/etc/cowrie.cfg
              subPath: cowrie.cfg
              readOnly: true
            - name: cowrie-var-lib
              mountPath: /cowrie/cowrie-git/var/lib/cowrie
            - name: cowrie-var-log
              mountPath: /cowrie/cowrie-git/var/log/cowrie
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 30
            periodSeconds: 5
        # Log-shipper sidecar: streams Cowrie's JSON event log to STDOUT so it
        # reaches both (a) Alloy -> Loki (durable, queryable in Grafana) and
        # (b) the CrowdSec agent (CRI stdout tail -> crowdsecurity/cowrie parser
        # -> decisions). Cowrie's output_jsonlog only writes a file in the shared
        # emptyDir; nothing tailed it before (TALOS-l05 / TALOS-e9h). `touch`
        # first so `tail -F` doesn't race Cowrie creating the file.
        - name: logship
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'touch /var/log/cowrie/cowrie.json; exec tail -n+1 -F /var/log/cowrie/cowrie.json'
          volumeMounts:
            - name: cowrie-var-log
              mountPath: /var/log/cowrie
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: cowrie-config
          configMap:
            name: cowrie-config
        # Honeypot state (downloads, snapshots, tty captures, instance
        # UUID) is intentionally ephemeral. Cowrie auto-creates its
        # subdirs on startup, and ship-to-Mimir/Graylog via output plugins
        # is the durable record. Avoids the local-path PVC getting pinned
        # to a node that doesn't match the hostPort nodeSelector.
        - name: cowrie-var-lib
          emptyDir: {}
        - name: cowrie-var-log
          emptyDir: {}
