---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeypot
  labels:
    app: cowrie
    app.kubernetes.io/name: cowrie
    app.kubernetes.io/component: honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cowrie
        app.kubernetes.io/name: cowrie
        app.kubernetes.io/component: honeypot
    spec:
      # NO KUBERNETES API CREDENTIAL IN A BOX WE INVITE ATTACKERS INTO.
      # Without this the API server projects a live serviceaccount token into
      # every container at /var/run/secrets/kubernetes.io/serviceaccount. The
      # default SA is unprivileged and the egress policy blocks the apiserver
      # outright (verified: 10.96.0.1:443 and node:6443 both unreachable from
      # the pod), so this is defence in depth rather than a live hole — but a
      # real cluster credential sitting inside the honeypot is exactly the kind
      # of thing that becomes a hole the moment one of those other controls is
      # relaxed. The projected volume disappears entirely with this set.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Pod-level so both containers inherit it. Blocks the exotic syscalls
        # (keyctl, ptrace, userfaultfd, bpf...) that container escapes are
        # built from. Cowrie is a Python SSH server and busybox is tail(1);
        # neither needs anything outside the default profile.
        seccompProfile:
          type: RuntimeDefault
      # Moved off talos03. The node choice here was always arbitrary — the honeypot
      # Kustomization says as much ("dedicating a box is a later phase") — and cowrie
      # has no node-bound storage: its volumes are a ConfigMap and two emptyDirs.
      #
      # talos03 is the 15 GiB node that wedged on memory exhaustion. After reserving
      # memory for kubelet its allocatable is 12.5 GiB, and it was sitting at 93% of
      # that in requests, which blocks the honest platform DaemonSet requests in
      # TALOS-gj3n from ever fitting. cowrie's 272Mi is part of what buys that room.
      #
      # SOFT, not a pin. hostPort 2222/2223 already means one cowrie per node, and
      # those ports are free on all four other nodes (verified). This just says
      # "anywhere but the tight one" rather than trading one arbitrary hostname for
      # another. (TALOS-3hl8.5)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [talos03]
      containers:
        - name: cowrie
          image: cowrie/cowrie:latest
          imagePullPolicy: Always
          ports:
            - name: ssh
              containerPort: 2222
              hostPort: 2222
              protocol: TCP
            - name: telnet
              containerPort: 2223
              hostPort: 2223
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: cowrie-config
              mountPath: /cowrie/cowrie-git/etc/cowrie.cfg
              subPath: cowrie.cfg
              readOnly: true
            - name: cowrie-var-lib
              mountPath: /cowrie/cowrie-git/var/lib/cowrie
            - name: cowrie-var-log
              mountPath: /cowrie/cowrie-git/var/log/cowrie
          # NOTE: the cowrie/cowrie image is shell-less (no /bin/sh) so exec
          # probes are impossible, and the only listening ports ARE the honeypot
          # ports — so every tcpSocket probe is logged by Cowrie as a
          # session.connect/closed and pollutes the capture data. The old 5s
          # readiness + 10s liveness produced ~700 fake sessions/hour (8x real
          # traffic in load tests). Readiness is meaningless here (access is via
          # hostPort, not the Service), so it's removed; liveness is slowed to
          # 5-min so noise is negligible. Honeypot analytics/CrowdSec additionally
          # filter the pod CIDR (10.244.0.0/16) — kubelet probe traffic is never a
          # real attacker. (TALOS-u3l follow-up.)
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 60
            periodSeconds: 300
            failureThreshold: 3
        # Log-shipper sidecar: streams Cowrie's JSON event log to STDOUT so it
        # reaches both (a) Alloy -> Loki (durable, queryable in Grafana) and
        # (b) the CrowdSec agent (CRI stdout tail -> crowdsecurity/cowrie parser
        # -> decisions). Cowrie's output_jsonlog only writes a file in the shared
        # emptyDir; nothing tailed it before (TALOS-l05 / TALOS-e9h). `touch`
        # first so `tail -F` doesn't race Cowrie creating the file.
        - name: logship
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'touch /var/log/cowrie/cowrie.json; exec tail -n+1 -F /var/log/cowrie/cowrie.json'
          volumeMounts:
            - name: cowrie-var-log
              mountPath: /var/log/cowrie
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: cowrie-config
          configMap:
            name: cowrie-config
        # Honeypot state (downloads, snapshots, tty captures, instance
        # UUID) is intentionally ephemeral. Cowrie auto-creates its
        # subdirs on startup, and ship-to-Mimir/Graylog via output plugins
        # is the durable record. Avoids the local-path PVC getting pinned
        # to a node that doesn't match the hostPort nodeSelector.
        - name: cowrie-var-lib
          emptyDir: {}
        - name: cowrie-var-log
          emptyDir: {}
