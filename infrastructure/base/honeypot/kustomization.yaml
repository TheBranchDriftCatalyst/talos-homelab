---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: honeypot

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - cilium-network-policy.yaml
  # pvc.yaml is BACK: var/lib/cowrie holds malware samples and tty session
  # recordings, which are binary artifacts no log pipeline carries. On an
  # emptyDir every restart destroyed them. See pvc.yaml for why local-path
  # (node-local, siloed) rather than the shared NFS export.
  - pvc.yaml
  # Off-node durability for those artifacts. Mounts the cowrie volume
  # READ-ONLY and is the only thing here that touches shared storage.
  - backup-cronjob.yaml
  # IngressRouteTCP removed — using hostPort for raw TCP (SSH/Telnet)
