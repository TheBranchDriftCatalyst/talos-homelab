# ClusterIP for the detonation VM's SSH (masquerade forwards virt-launcher:22 -> guest:22). INTERNAL
# ONLY — for validation via port-forward + future attacker-routing from a honeypot front. No world.
apiVersion: v1
kind: Service
metadata:
  name: detonation-vm-ssh
  namespace: honeypot-vm
  labels: {app: detonation-vm}
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: detonation-vm
  ports:
    - {name: ssh, port: 22, targetPort: 22, protocol: TCP}
