# Ephemeral detonation VM: containerDisk (NO persistent disk) so every reboot = pristine — an attacker
# can trash it and a restart wipes them. Real Debian 12 + sshd (weak creds, honeypot persona). Isolation
# is the load-bearing control (cilium-network-policy.yaml): the guest NATs through the virt-launcher pod,
# so the CNP on that pod caps the guest's reach to DNS + public 80/443 (no LAN, no cluster, no metadata).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: detonation-vm
  namespace: honeypot-vm
  labels: {app: detonation-vm}
spec:
  # Halted by default — flip to Always (or start on-demand) when routing an attacker/detonating a sample.
  # Deploying Halted keeps the sandbox cold until deliberately used; validated by starting it manually.
  runStrategy: Always  # ACTIVE WAN honeypot (fronted by wan-proxy on talos02-gpu:2222); hotswap: Halted=off
  template:
    metadata:
      labels:
        app: detonation-vm
        kubevirt.io/domain: detonation-vm
    spec:
      nodeSelector:
        # HARD-pinned to talos02-gpu — same reasoning as cowrie (TALOS-a8vo): now that this is a
        # WAN-exposed REAL shell, placement must avoid the highest-risk nodes. NEVER a control-plane node
        # (talos00/01/03 — a virt-launcher/container escape there reaches etcd/apiserver) and NEVER talos06
        # (co-located with every database, MinIO, and the ESO secrets broker). talos02-gpu is the only
        # kubevirt-schedulable worker with no local datastores — the CNP cages guest egress, but node
        # blast-radius on an escape is a separate axis the netpol does not cover. Co-located with wan-proxy.
        kubernetes.io/hostname: talos02-gpu
      domain:
        cpu: {cores: 2}
        memory: {guest: 2Gi}
        devices:
          disks:
            - name: root
              disk: {bus: virtio}
            - name: cloudinit
              disk: {bus: virtio}
          interfaces:
            - name: default
              masquerade: {}    # guest NATs through the virt-launcher pod -> CNP governs its egress
              ports:
                - {name: ssh, port: 22, protocol: TCP}   # virt-launcher:22 -> guest:22 (internal SSH / future routing)
        resources:
          requests: {memory: 2Gi}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          containerDisk:
            image: quay.io/containerdisks/debian:12   # ephemeral cloud image; reboot = pristine
        - name: cloudinit
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              hostname: web-prod-01
              password: hunter2
              chpasswd: {expire: false}
              ssh_pwauth: true
              disable_root: false
              runcmd:
                - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
                - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
                - systemctl restart ssh || systemctl restart sshd || true
                # In-guest capture (host Falco can't see inside a KubeVirt guest): auditd logs every exec +
                # outbound connect; PROMPT_COMMAND ships each shell command to syslog. Lands in the guest's
                # /var/log (ephemeral). Shipping it OFF the VM (retain PVC + archive / CNP-safe relay) = 2c.2.
                - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y auditd || true
                - auditctl -a always,exit -F arch=b64 -S execve -k exec 2>/dev/null || true
                - auditctl -a always,exit -F arch=b64 -S connect -k net 2>/dev/null || true
                - systemctl enable --now auditd || true
                - echo 'export PROMPT_COMMAND="history -a; logger -t detonation-shell -- \"$(id -un): $(history 1)\""' >> /etc/profile
