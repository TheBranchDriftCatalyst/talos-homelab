# WAN front for the detonation VM. The VM (KubeVirt) can't bind a node hostPort itself, so this tiny
# socat proxy is pinned to talos02-gpu (the WAN:22 -> :2222 forward target, same node as cowrie/beelzebub)
# and forwards raw TCP to the VM's SSH via the detonation-vm-ssh Service. This is the attacker-routing
# layer (Phase 2c.2). socat -d -d logs every connection's peer address to stdout -> Alloy -> Loki AND is
# tailed by the CrowdSec agent (see crowdsec acquisition + the detonation-vm parser/scenario) so attacker
# IPs flow to the 3 pipelines: local blocklist, AbuseIPDB reports, and the Traefik bouncer bans. Source IP
# is NOT preserved into the guest (sshd has no PROXY proto) — capture happens here at the front.
# HOTSWAP: scale this to 0 (or Halt the VM) to take the VM honeypot offline.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detonation-wan-proxy
  namespace: honeypot-vm
  labels:
    app: detonation-wan-proxy
    app.kubernetes.io/name: detonation-wan-proxy
    app.kubernetes.io/component: honeypot
spec:
  replicas: 1 # HOTSWAP toggle: 0 = VM offline from WAN
  selector:
    matchLabels:
      app: detonation-wan-proxy
  template:
    metadata:
      labels:
        app: detonation-wan-proxy
        app.kubernetes.io/name: detonation-wan-proxy
        app.kubernetes.io/component: honeypot
    spec:
      automountServiceAccountToken: false # no cluster cred on the WAN-exposed front
      nodeSelector:
        kubernetes.io/hostname: talos02-gpu # router forwards WAN:22 -> 192.168.1.144:2222 (this node)
      containers:
        - name: socat
          image: alpine/socat:1.8.0.0
          args:
            - "-d"
            - "-d"
            - "TCP-LISTEN:2222,fork,reuseaddr"
            - "TCP:detonation-vm-ssh.honeypot-vm.svc.cluster.local:22"
          ports:
            - name: ssh
              containerPort: 2222
              hostPort: 2222
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
---
# WAN ingress to the proxy (:2222 from the world) + egress to the VM's SSH + DNS. Default-deny otherwise.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: detonation-wan-proxy-policy
  namespace: honeypot-vm
spec:
  endpointSelector:
    matchLabels:
      app: detonation-wan-proxy
  ingress:
    - fromEntities: ["world"] # WAN-exposed honeypot front (WAN:22 -> hostPort 2222)
      toPorts:
        - ports:
            - { port: "2222", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            kubevirt.io/domain: detonation-vm
      toPorts:
        - ports:
            - { port: "22", protocol: TCP }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
