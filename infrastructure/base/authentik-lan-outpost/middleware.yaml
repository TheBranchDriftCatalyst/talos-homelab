---
# `authentik-lan` — a SECOND Traefik forward-auth middleware, pointing at the
# dedicated talos00 outpost instead of the embedded one (TALOS-22nn).
#
# ====================== NOTHING REFERENCES THIS. ON PURPOSE. ==================
# It exists so the cutover can be staged. The live middleware is
# `authentik/authentik` (infrastructure/base/authentik/middleware.yaml) and 97
# IngressRoute references in this repo point at it. Repointing THAT one address
# moves every app at once; if the new path is wrong, nothing in the cluster is
# reachable — including the ArgoCD and Traefik dashboards needed to undo it.
# ==============================================================================
#
# DELIBERATELY BYTE-IDENTICAL to `authentik/authentik` except for `address`.
# That is the whole design: when an app is moved, exactly ONE variable changes,
# so a failure has exactly one candidate cause. amberdark's equivalent
# middleware uses `trustForwardHeader: false` and
# `authResponseHeadersRegex: "(?i)^X-Authentik-"`, both arguably better — but
# adopting them here would make a cutover failure ambiguous between three
# changes. Harden afterwards, as its own change, with its own verification.
#
# SAME NAMESPACE as the middleware it shadows (`authentik`, not `traefik`), so
# moving an app is a one-token edit — `name: authentik` -> `name: authentik-lan`
# with `namespace: authentik` untouched. A cross-namespace move would also work
# (Traefik runs with allowCrossNamespace=true) but adds a second thing to get
# right in 60 files.
#
# ---------------------------------------------------------------------------
# MOVING AN APP TAKES TWO EDITS, NOT ONE. READ THIS BEFORE THE CUTOVER.
#
# This middleware only handles the forward-auth SUBREQUEST. The browser-facing
# /outpost.goauthentik.io/* paths (start, callback, sign_out) are routed
# separately, and TODAY every one of them goes to the embedded outpost via
# `authentik-outpost-priv` in infrastructure/base/authentik/ingressroute.yaml:
#
#   match: (HostRegexp(`^[a-z0-9.-]+\.talos00$`) || ...) && PathPrefix(`/outpost.goauthentik.io/`)
#   priority: 1000  ->  services: authentik-server
#
# Point an app's middleware here while its callback path still lands on the
# embedded outpost and the flow breaks: the two outposts advertise different
# browser hosts, so the redirect and the callback disagree. The app will loop or
# 400 and it will look like this middleware is broken.
#
# So per app, both of:
#   1. its IngressRoute middleware: `name: authentik` -> `name: authentik-lan`
#   2. a per-host callback route at priority > 1000, e.g.
#        match: Host(`<app>.talos00`) && PathPrefix(`/outpost.goauthentik.io/`)
#        priority: 2000
#        services: [{name: talos00-outpost, port: 9000}]
#      (amberdark does the same thing fleet-wide with
#       `amberdark-outpost-callbacks` at priority 1000.)
#
# The fleet-wide version of (2) — swapping `authentik-outpost-priv`'s service to
# talos00-outpost — moves ALL 60 apps' callbacks in one apply. It is NOT
# included in this directory for that reason.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-lan
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/instance: talos00
spec:
  forwardAuth:
    address: http://talos00-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
