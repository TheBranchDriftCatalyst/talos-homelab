---
# UI authentication is delegated to Authentik at Traefik. Prevent direct pod/service
# access from bypassing that gate. Egress to LAPI/metrics remains unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-web-ui-ingress
  namespace: crowdsec
spec:
  podSelector:
    matchLabels:
      app: crowdsec-web-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
