---
# CrowdSec keys from 1Password item `crowdsec` (TALOS-pbn). USER pre-req: field
# `bouncer-api-key` (openssl rand -hex 32) — present, enables the Traefik bouncer.
# ENROLL_KEY (Console, app.crowdsec.net) is DECOUPLED into its own ExternalSecret
# below so a missing enroll-key can't block the bouncer registration (ESO fails
# the WHOLE ExternalSecret if any one property is absent). Add the Console
# enrollment via TALOS-5of when you have an enroll-key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-keys
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-keys
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_KEY_traefik # LAPI auto-registers bouncer "traefik" with this
      remoteRef: {key: crowdsec, property: bouncer-api-key}
---
# The SAME bouncer key, mounted into Traefik (ns traefik) as a file the plugin reads
# (crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key). Same 1Password property on both ends.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: lapi-key
      remoteRef: {key: crowdsec, property: bouncer-api-key}
---
# Console enrollment key (app.crowdsec.net) — DECOUPLED per the note at top: a
# SEPARATE ExternalSecret with creationPolicy: Merge adds ENROLL_KEY into the
# crowdsec-keys secret WITHOUT coupling it to the bouncer key. If `enroll-key` is
# ever absent in 1Password, only THIS ExternalSecret fails — bouncer registration
# (crowdsec-keys Owner ES above) is unaffected. The chart reads
# crowdsec-keys/ENROLL_KEY (optional) and runs `cscli console enroll` on LAPI
# start → the instance shows in the Console as pending → Accept it. (TALOS-5of)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-enroll
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-enroll
    creationPolicy: Owner
  data:
    - secretKey: ENROLL_KEY
      remoteRef: {key: crowdsec, property: enroll-key}
---
# Discord webhook URL for CrowdSec ban notifications (rec #6). Pulled from the SAME 1Password item
# the Flux/Alertmanager Discord integration uses (`flux-discord-webhook` / property webhook_url), so
# there is one source of truth. Injected into the LAPI pod as ${DISCORD_WEBHOOK_URL} (helmrelease
# lapi.env) and consumed by config.notifications.discord.yaml. Kept as its own ExternalSecret (not
# merged into crowdsec-keys) so a missing webhook can never block bouncer/enroll secrets.
#
# NOTE (secret plumbing): the existing `discord-webhook` secret lives in flux-system + monitoring
# (reflected, key `address`). Rather than widen that reflector's allowed-namespaces to crowdsec, we
# pull straight from 1Password here — same decoupled pattern as crowdsec-keys/crowdsec-enroll. No
# reflector change needed. (If 1Password is unavailable, alternative is to add `crowdsec` to the
# flux-system/discord-webhook reflection-allowed-namespaces and key it as DISCORD_WEBHOOK_URL.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-discord
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-discord
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef: {key: flux-discord-webhook, property: webhook_url}
