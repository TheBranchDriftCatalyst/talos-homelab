---
# CrowdSec keys from 1Password item `crowdsec` (TALOS-pbn). USER pre-req: create the item with
# fields `bouncer-api-key` (openssl rand -hex 32) and `enroll-key` (from app.crowdsec.net → Enroll).
# Until then this sits in SecretSyncedError (harmless — CrowdSec still runs, just no enroll/bouncer).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-keys
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-keys
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_KEY_traefik # LAPI auto-registers bouncer "traefik" with this
      remoteRef: {key: crowdsec, property: bouncer-api-key}
    - secretKey: ENROLL_KEY
      remoteRef: {key: crowdsec, property: enroll-key}
---
# The SAME bouncer key, mounted into Traefik (ns traefik) as a file the plugin reads
# (crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key). Same 1Password property on both ends.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crowdsec-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: lapi-key
      remoteRef: {key: crowdsec, property: bouncer-api-key}
