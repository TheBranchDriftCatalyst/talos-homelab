---
# CloudNativePG database for CrowdSec LAPI (TALOS-pbn). Replaces the previous SQLite-on-
# local-path datastore, whose failure mode was: local-path is node-local + Delete-reclaim, so
# any LAPI reschedule or PVC recreation silently wiped EVERY registered machine. Agents, the
# traefik bouncer, and the web-ui re-register from env / the machine-registrar CronJob — but the
# appsec component registers via a ONE-SHOT init container with no re-register path, so it then
# CrashLoopBackOff'd forever ("API error: ent: machine not found" / 401) and the Web UI's AppSec
# metrics endpoint failed. Moving the datastore to Postgres makes LAPI stateless + node-
# independent (it reconnects over the network after any reschedule); durability/backups are
# CNPG's job. SQLite-on-NFS was rejected (NFS advisory-lock flakiness → corruption).
#
# CNPG creates:
#   - a 'crowdsec' database owned by user 'crowdsec'
#   - Secret 'crowdsec-postgres-app' (username/password/dbname/host/port/uri) — LAPI reads DB
#     creds from it; no manual password, no 1Password field
#   - Service 'crowdsec-postgres-rw' (read-write endpoint)
# Auto-discovered by the cluster-wide cnpg-clusters PodMonitor + the CloudNativePG dashboard.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-postgres
  namespace: crowdsec
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. It is being converted
    # to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are removed in the
    # following commit and the composite adopts the live objects. Without this annotation,
    # removing the manifest would prune the Cluster and CNPG would delete its PVCs — i.e.
    # destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # No reflector annotations here: the reflect-cnpg-app-secrets ClusterPolicy stamps the four
  # emberstack/reflector annotations onto EVERY CNPG <cluster>-app secret cluster-wide, so the
  # databases-namespace mirror for dbgate is automatic. (TALOS-7jxm / TALOS-a38d.10)
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imagePullPolicy: IfNotPresent
  storage:
    size: 5Gi
    # local-path = the node's NVMe. Postgres commits are WAL fsyncs, and on NFS every
    # one of those is a network round trip to the Synology. CNPG's own guidance is
    # local storage, because durability here comes from streaming replication plus
    # barman backups, not from the filesystem underneath.
    #
    # Safe at instances: 3 and ONLY at 3. local-path is WaitForFirstConsumer, so each
    # PV pins to the node that first mounts it; a single instance on local-path would
    # be stranded by a node loss. Three instances with CNPG's default pod
    # anti-affinity means three copies on three nodes, and a lost node is a promotion
    # rather than an outage. Never drop this cluster to 1 while it is on local-path —
    # if it must run single-instance, move it back to NFS first. (TALOS-npt4)
    storageClass: local-path
  monitoring:
    enablePodMonitor: false # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  # Object-store backups → MinIO (TALOS-xgrl). Config lives in the ObjectStore
  # CR (objectstore.yaml) — migrated off the in-tree barmanObjectStore (removed
  # in CNPG 1.30) to the barman-cloud CNPG-I plugin. Same bucket/prefix/creds;
  # base backups: scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: crowdsec-postgres
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
