---
# Blocklist mirror — the FILTERED decision feed the UniFi (UDM SE) firewall bouncer pulls.
#
# The UDM enforces at the true perimeter (L3/L4 nftables), before traffic reaches the
# cluster — complementing the Traefik bouncer, which only sees HTTP L7. But the UDM must NOT
# receive the full LAPI decision set, for two reasons, and this mirror encodes both as
# server-side filters so the edge device physically cannot see what it should not:
#
#   exclude_scenarios_containing: [cowrie]
#       THE honeypot-safety filter. Cowrie is reached via WAN:22 -> hostPort, i.e. through
#       the UDM. If a cowrie ban reached the UDM firewall the attacker would be dropped at
#       the edge and could never return to the honeypot — the bait would die after one
#       session. Excluding the scenario here means the edge never sees a cowrie-only IP.
#       (An attacker who ALSO trips a real scenario still gets edge-banned by THAT decision.)
#
#   only_include_decisions_from: [crowdsec, CAPI]
#       Sends the ~2.8k high-signal decisions (our own scenario hits + community threat
#       intel) and deliberately DROPS the ~30k static blocklist-de import (origin
#       cscli-import). Those are generic internet bad actors, cheap to keep at Traefik, and
#       30k churning entries would stress a consumer firewall's ipset for near-zero gain.
#
# The mirror is itself a LAPI bouncer (key BOUNCER_KEY_unifimirror, registered by the helm
# LAPI env + ESO, same pattern as the traefik bouncer). It serves a plain-text IP list the
# UDM fetches over the LAN.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-blocklist-mirror-config
  namespace: crowdsec
data:
  crowdsec-blocklist-mirror.yaml: |
    config:
      log_level: info
      listen_uri: 0.0.0.0:41412
    crowdsec_config:
      lapi_url: https://crowdsec-service.crowdsec.svc.cluster.local:8080/
      lapi_key: ${LAPI_KEY}
      # In-cluster hop to LAPI, which serves TLS with the homelab CA. Same posture as the
      # Traefik plugin (crowdsecLapiTLSInsecureVerify: true) — verify skipped on the trusted
      # cluster network rather than shipping the CA into yet another pod.
      insecure_skip_verify: true
      update_frequency: 30s
      supported_decisions_types:
        - ban
      # ---- the two load-bearing filters (see header) ----
      exclude_scenarios_containing:
        - cowrie
      only_include_decisions_from:
        - crowdsec
        - CAPI
    blocklists:
      - format: plain_text
        endpoint: /security.txt
        aggregate: true
        authentication:
          # LAN-only: the Service below binds a Cilium LB IP that MUST be firewalled on the
          # UDM so only the UDM itself can reach :41412. The served list is non-sensitive
          # (public attacker IPs) but should not be world-readable on the LAN. Basic-auth can
          # be layered later (creds via ESO) if the LAN is considered hostile.
          type: none
    metrics:
      enabled: true
      endpoint: /metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-blocklist-mirror
  namespace: crowdsec
  labels: {app: crowdsec-blocklist-mirror}
spec:
  replicas: 1
  selector:
    matchLabels: {app: crowdsec-blocklist-mirror}
  template:
    metadata:
      labels: {app: crowdsec-blocklist-mirror}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mirror
          image: docker.io/crowdsecurity/blocklist-mirror:v0.0.5
          args: ["-c", "/etc/crowdsec-blocklist-mirror/crowdsec-blocklist-mirror.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            # The mirror's own LAPI bouncer key. Registered by the helm LAPI env
            # (BOUNCER_KEY_unifimirror) from the crowdsec-keys secret (ESO -> 1Password).
            - name: LAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-keys
                  key: BOUNCER_KEY_unifimirror
                  optional: true
          ports:
            - {name: mirror, containerPort: 41412, protocol: TCP}
          volumeMounts:
            - {name: config, mountPath: /etc/crowdsec-blocklist-mirror, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: crowdsec-blocklist-mirror-config}
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-blocklist-mirror
  namespace: crowdsec
  annotations:
    # A dedicated LAN IP from the pihole pool (192.168.1.240-250; .240 in use, .242 free),
    # matching the established lbipam pattern. Firewall this to the UDM on the UDM itself.
    lbipam.cilium.io/ips: "192.168.1.243"
  labels: {app: crowdsec-blocklist-mirror}
spec:
  type: LoadBalancer
  selector: {app: crowdsec-blocklist-mirror}
  ports:
    - {name: mirror, port: 41412, targetPort: 41412, protocol: TCP}
