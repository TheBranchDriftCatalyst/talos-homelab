---
# Daily base backup for crowdsec-postgres → MinIO object store (TALOS-xgrl).
# Continuous WAL archiving is handled by the Cluster's barmanObjectStore; this
# ScheduledBackup drives the periodic base backups WAL replays sit on top of.
# 30-day retention is enforced by the Cluster's backup.retentionPolicy.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: crowdsec-postgres-daily
  namespace: crowdsec
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. It is being converted
    # to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are removed in the
    # following commit and the composite adopts the live objects. Without this annotation,
    # removing the manifest would prune the Cluster and CNPG would delete its PVCs — i.e.
    # destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # 02:30 daily — staggered fleet-wide (forgejo 02:00, authentik 02:15,
  # linkwarden 02:45, ...). CNPG cron is 6-field: sec min hour dom mon dow.
  schedule: "0 30 2 * * *"
  immediate: true # take one right away so backups exist before the first tick
  backupOwnerReference: self
  # barman-cloud CNPG-I plugin (see objectstore.yaml) — in-tree method removed in CNPG 1.30
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: crowdsec-postgres
