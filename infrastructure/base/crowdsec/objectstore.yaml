---
# Barman Cloud plugin ObjectStore for crowdsec-postgres — the former
# Cluster.spec.backup.barmanObjectStore stanza moved verbatim (same bucket/
# prefix/creds — WAL history and base backups carry over). retentionPolicy
# moves here too (was Cluster.spec.backup.retentionPolicy).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: crowdsec-postgres
  namespace: crowdsec
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. It is being converted
    # to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are removed in the
    # following commit and the composite adopts the live objects. Without this annotation,
    # removing the manifest would prune the Cluster and CNPG would delete its PVCs — i.e.
    # destroy the database.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  retentionPolicy: "30d" # prune backups + WALs older than 30 days
  configuration:
    destinationPath: s3://cnpg-backups/crowdsec-postgres
    endpointURL: http://minio-hl.minio.svc:9000
    s3Credentials:
      accessKeyId:
        name: cnpg-minio-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-minio-backup
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
