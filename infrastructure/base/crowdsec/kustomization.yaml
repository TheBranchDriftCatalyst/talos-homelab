---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dynamic-allowlist.yaml # auto-refresh the operator's dynamic home IP into a cscli allowlist
  - namespace.yaml
  - helmrepository.yaml
  - postgres.yaml # CatalystCNPGAppDB — Cluster + ObjectStore + ScheduledBackup (TALOS-pbn)
  - helmrelease.yaml
  - externalsecret.yaml # crowdsec-keys (crowdsec ns) + crowdsec-bouncer-key (traefik ns)
  - bouncer-middleware.yaml # Middleware `bouncer` in ns traefik
  - webui.yaml # crowdsec-web-ui local UI (crowdsec.talos00) until Console enrollment (TALOS-5of)
  - machine-registrar.yaml # self-heals the web-ui LAPI machine (belt-and-suspenders now DB is durable)
  - podmonitor.yaml # scrapes cs_* engine metrics (:6060) → Mimir for the crowdsec-ops dashboard (rec #8)
