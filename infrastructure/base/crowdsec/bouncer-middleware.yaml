---
# CrowdSec bouncer Traefik middleware (TALOS-pbn). Lives in ns `traefik`; referenced globally as
# traefik-bouncer@kubernetescrd once the entrypoint bind is added to the Traefik helmrelease.
# Requires experimental.plugins.bouncer in the Traefik helmrelease + the crowdsec-bouncer-key secret
# mounted at /etc/traefik/crowdsec. FAIL-OPEN: a LAPI/AppSec outage can never take ingress down.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bouncer
  namespace: traefik
spec:
  plugin:
    bouncer:
      enabled: "true"
      logLevel: INFO
      # --- LAPI (stream mode: decisions cached locally, LAPI is out-of-band) ---
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key
      # --- FAIL-OPEN: never block on LAPI trouble (there is NO crowdsecLapiUnreachableBlock key) ---
      updateIntervalSeconds: "60"
      updateMaxFailure: "-1" # never start blocking regardless of how long LAPI is unreachable
      streamStartupBlock: "false" # if LAPI is down at Traefik boot, serve traffic (don't wedge)
      httpTimeoutSeconds: "10"
      defaultDecisionSeconds: "60"
      remediationStatusCode: "403"
      # --- real client IP behind Cloudflare + pods (trust CF/pod proxies' X-Forwarded-For) ---
      forwardedHeadersTrustedIPs:
        - "10.0.0.0/8" # pods/services
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
      # --- plugin-side allowlist: these bypass ALL bouncer checks (LAN never locked out) ---
      clientTrustedIPs:
        - "192.168.0.0/16"
        - "10.0.0.0/8"
      # --- AppSec / WAF (detect-only server-side; keep ingress up if AppSec dies) ---
      crowdsecAppsecEnabled: "true"
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      crowdsecAppsecFailureBlock: "true" # AppSec internal 500 → block (present-but-erroring is suspicious)
      crowdsecAppsecUnreachableBlock: "false" # AppSec pod down → pass (never take ingress down)
      crowdsecAppsecBodyLimit: "10485760"
