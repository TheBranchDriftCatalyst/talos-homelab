---
# Default-deny plus the three flows this operator actually needs.
#
# Modelled on infrastructure/base/themepark/server/cilium-network-policy.yaml, including the
# failure mode documented there: without the apiserver egress rule the default-deny blackholes
# the API call, "the pod stays 2/2 Running and the only symptom is a nav manifest that never
# appears."
#
# The one addition over themepark's set is INGRESS FROM THE APISERVER — a webhook is called by
# the control plane, so a policy that only allows ingress from Traefik would leave the
# admission path blackholed. With failurePolicy: Fail that presents as "every NavEntry write is
# refused", with a timeout rather than an error, which is a genuinely confusing way to discover
# a network policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
spec:
  endpointSelector:
    matchLabels:
      app: catalyst-nav-operator
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
spec:
  endpointSelector:
    matchLabels:
      app: catalyst-nav-operator
  egress:
    # `toEntities: kube-apiserver` is the Cilium-native way to express this: it resolves to
    # whatever the real API server endpoints are, so it keeps working across control-plane IP
    # changes, unlike a hardcoded CIDR.
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-webhook-ingress
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
spec:
  endpointSelector:
    matchLabels:
      app: catalyst-nav-operator
  ingress:
    # The admission call. Same entity-based reasoning as the egress rule above.
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
spec:
  endpointSelector:
    matchLabels:
      app: catalyst-nav-operator
  ingress:
    # Alloy scrapes by pod annotation from the monitoring namespace. Without this the
    # prometheus.io/scrape annotations on the Deployment are honoured by Alloy and then
    # dropped by the default-deny — a target that is permanently `down` with no other symptom.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet probes the health port. Cilium exempts the host from policy by default in most
    # configurations, but stating it removes the dependency on that default — a silently
    # failing probe would CrashLoop the operator and take the webhook with it.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
# THIS POLICY IS THE PRIMARY CONTROL ON THE PER-IDENTITY MANIFEST ENDPOINT. Read
# operator/internal/navserve's threat model before changing it.
#
# The endpoint decides what a caller may see from X-authentik-groups, which Traefik's
# forward-auth middleware sets from the Authentik outpost's response
# (infrastructure/base/authentik/middleware.yaml:13-24) — REPLACING whatever the client sent
# under that name. A request that did not traverse that middleware carries whatever groups its
# sender felt like claiming, and NO HTTP handler can tell the two apart: there is no header
# that proves provenance. So "only Traefik can open a connection to this port" is not defence
# in depth here, it is the defence.
#
# The namespace default-denies ingress (default-deny-all, above), so without this rule the port
# is unreachable by everything including Traefik. With it, it is reachable by the ingress
# controller and nothing else — not another app's pod, not a compromised workload, not a
# process on the node.
#
# Kept as its OWN policy rather than a fourth rule on allow-metrics-scrape so that deleting the
# manifest endpoint, or quarantining it, is one object and does not disturb the Alloy scrape or
# the kubelet probe.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-manifest-ingress-from-traefik
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
    app.kubernetes.io/component: manifest
spec:
  endpointSelector:
    matchLabels:
      app: catalyst-nav-operator
  ingress:
    # Namespace-scoped and nothing narrower: Traefik runs as a DaemonSet whose pod labels have
    # changed across chart revisions, and a selector pinned to a label that gets renamed fails
    # CLOSED here — the nav bar stops rendering cluster-wide — which is loud, but needlessly
    # fragile for a boundary whose purpose is "the ingress controller, not arbitrary pods".
    # Same shape as infrastructure/base/themepark/server/cilium-network-policy.yaml.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
