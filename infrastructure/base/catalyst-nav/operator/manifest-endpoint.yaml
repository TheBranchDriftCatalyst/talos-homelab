---
# The per-identity manifest endpoint's Service. Phase 3 of the catalyst-nav strangler fig.
#
# THE ROUTE IS NOW manifest-route.yaml, NOT ABSENT. This file carried the standing note that
# nothing routed to this Service and that phase 4 had three things to get right. Phase 4 has
# been written: manifest-route.yaml is the IngressRoute, and its header answers all three
# point by point (no catalyst-asset-cache and no other catalyst-* middleware; forward-auth +
# lan-only, with `authentik-lan` rather than the `authentik` this note used to name, because
# that name went stale; websecure only). The client half -- the `credentials: 'omit'` that
# would have anonymised every caller -- is addressed in catalyst-nav.js, which now selects
# between the static file and this endpoint per app.
#
# STILL INERT UNTIL TWO SEPARATE THINGS HAPPEN, and neither is in this directory:
#   - the Flux Kustomization at clusters/catalyst-cluster/catalyst-nav.yaml must be applied,
#     which is what makes any of this tree exist in the cluster at all; and
#   - an app's own catalyst-inject-<app> middleware must gain data-nav-manifest="identity".
#     Until one does, every app still reads the static file and this endpoint is unused even
#     once it is routable. See docs/02-architecture/catalyst-nav-cutover.md.
#
# A SEPARATE Service from catalyst-nav-webhook rather than a second port on it: the webhook
# Service is the clientConfig target of a failurePolicy: Fail ValidatingWebhookConfiguration,
# and widening the object the apiserver's admission path depends on in order to publish an
# unrelated HTTP endpoint is how an admission outage gets caused by a nav change.
apiVersion: v1
kind: Service
metadata:
  name: catalyst-nav-manifest
  namespace: catalyst-nav
  labels:
    app.kubernetes.io/name: catalyst-nav
    app.kubernetes.io/component: manifest
    app.kubernetes.io/part-of: catalyst
spec:
  selector:
    app.kubernetes.io/name: catalyst-nav
    app.kubernetes.io/component: operator
  ports:
    - name: http
      port: 80
      targetPort: manifest
      protocol: TCP
