---
# Pull secret for Zot (registry.talos00). The same ESO pattern every other
# consuming namespace declares -- monitoring, crossplane-demo, media-private,
# bt-radar, fchat-bouncer -- because a Secret is namespaced and nothing mirrors
# this one.
#
# OMITTED FROM THE FIRST CUT OF THIS COMPONENT, exactly as the hyperdx-rum copy
# warns it would be. Repeating that warning here because it did not stop the
# omission happening a second time: it is invisible until deploy time. The
# manifests validate, `kustomize build` succeeds, the server-side dry-run passes,
# Flux reports the Kustomization applied -- and then the pod sits in
# ImagePullBackOff with "no basic auth credentials". Nothing before the kubelet
# knows a credential is required, so no earlier gate can catch it.
#
# Observed here 2026-11-06 during the phase-4 cutover: image built, pushed,
# digest pinned and resolvable, and the pull still failed because the Deployment
# carried no imagePullSecrets. The credential lives on the Deployment, not in the
# cluster's default pull path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
  namespace: catalyst-nav
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.talos00": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: {key: nexus-admin, property: username}
    - secretKey: password
      remoteRef: {key: nexus-admin, property: password}
