---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A strangler-fig migration for the Catalyst navbar taxonomy (API group
# nav.catalyst.io/v1alpha1).
#
# THE FLUX WIRING NOW EXISTS: clusters/catalyst-cluster/catalyst-nav.yaml (phase 4). This
# component is no longer unreferenced, so the standing claim that nothing here has ever run
# against the live apiserver stops being true the moment that Kustomization is applied. Read
# its header before applying it — the operator image it pins has not been built yet, and the
# NavEntry webhook is failurePolicy: Fail.
#
# Phase 2 added operator/: a controller that WATCHES IngressRoutes, NavGroups, NavEntries and
# CatalystWebSecureIngress claims, reconciles the same nav model build_nav.py derives, reports
# what published and what was rejected on status.conditions, and refuses a NavEntry whose
# navGroupRef names no NavGroup. It publishes into a ConfigMap that nothing reads — see
# operator/kustomization.yaml for what deploying it would and would not change.
#
# infrastructure/base/themepark/server/nav/ (discover.sh + build_nav.py) is the live nav
# pipeline and is untouched by this directory. It keeps deriving catalyst-nav.json from
# gethomepage.dev/* annotations exactly as it does today. A later phase teaches that
# pipeline to resolve against NavGroup/NavEntry objects instead of taking annotation
# strings verbatim; until that phase lands, these CRDs and taxonomy objects have zero
# effect on what ships to the browser even once applied.
#
# Resource order matters only in the sense that the CRDs must exist before the taxonomy's
# NavGroup instances can be created — Kustomize/kubectl apply -k does not guarantee
# ordering across separate files within one apply, so when this DOES get wired into a
# Flux Kustomization, expect the first reconcile to retry the taxonomy.yaml objects once
# while the CRDs establish. Listed in dependency order here for a human reading the file,
# not because that's what makes it work.
#
# operator/ is last for the same human-readability reason: its webhook references the CRDs, and
# its Deployment is pointless before the taxonomy exists.
resources:
  - navgroup-crd.yaml
  - naventry-crd.yaml
  - taxonomy.yaml
  - operator/ # phase 2: the controller, its RBAC, and the NavEntry validating webhook
