# Forgejo — multi-format package registry (npm/PyPI/Maven/NuGet/Cargo/...) + git
# forge + UI, CloudNativePG-backed. Companion to the Zot docker registry.
# TALOS-6nf. Authentik OIDC added as a follow-up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forgejo

resources:
  - postgres.yaml
  - externalsecret.yaml
  - deployment.yaml
  - admin-job.yaml
  - ingressroute.yaml
