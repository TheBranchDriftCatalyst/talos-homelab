---
# CloudNativePG database for Forgejo (TALOS-6nf). CNPG creates:
#   - a 'forgejo' database owned by user 'forgejo'
#   - Secret 'forgejo-postgres-app' (username/password/dbname/host/port/uri)
#   - Service 'forgejo-postgres-rw' (read-write endpoint)
# The Forgejo Deployment reads DB creds from that generated secret — no manual
# password, no 1Password field. Auto-discovered by the cluster-wide
# cnpg-clusters PodMonitor + shows up in the CloudNativePG Databases dashboard.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  # (secret reflection to `databases` for dbgate now handled globally by the
  # reflect-cnpg-app-secrets Kyverno policy — no per-cluster inheritedMetadata needed. TALOS-7jxm)
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imagePullPolicy: IfNotPresent
  storage:
    size: 10Gi
    storageClass: fatboy-nfs-appdata # interim node-independent storage; NVMe block later (TALOS-1ujn)
  monitoring:
    enablePodMonitor: false  # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  # Object-store backups → MinIO (TALOS-a1hk). CNPG 1.24.1 in-tree barman API
  # (NOT the plugin). Continuous WAL archiving + base backups land in the shared
  # `cnpg-backups` bucket under a per-cluster prefix. Creds reuse the MinIO root
  # key via the cnpg-minio-backup Secret (see backup-credentials.yaml).
  backup:
    retentionPolicy: "30d"          # prune backups + WALs older than 30 days
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/forgejo-postgres
      endpointURL: http://minio-hl.minio.svc:9000
      s3Credentials:
        accessKeyId:
          name: cnpg-minio-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-minio-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
