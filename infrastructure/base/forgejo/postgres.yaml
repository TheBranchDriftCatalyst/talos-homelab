---
# CloudNativePG database for Forgejo (TALOS-6nf). CNPG creates:
#   - a 'forgejo' database owned by user 'forgejo'
#   - Secret 'forgejo-postgres-app' (username/password/dbname/host/port/uri)
#   - Service 'forgejo-postgres-rw' (read-write endpoint)
# The Forgejo Deployment reads DB creds from that generated secret — no manual
# password, no 1Password field. Auto-discovered by the cluster-wide
# cnpg-clusters PodMonitor + shows up in the CloudNativePG Databases dashboard.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  # (secret reflection to `databases` for dbgate now handled globally by the
  # reflect-cnpg-app-secrets Kyverno policy — no per-cluster inheritedMetadata needed. TALOS-7jxm)
  inheritedMetadata:
    labels:
      # CNPG owns its own backups (barman WAL + ScheduledBackup) — keep Velero off its pods/PVCs
      velero.io/exclude-from-backup: "true"
  instances: 3 # HA: streaming-replicated across nodes; survives a node loss (TALOS-hx77)
  imagePullPolicy: IfNotPresent
  storage:
    size: 10Gi
    # local-path = node NVMe. Every Postgres commit is a WAL fsync, and on NFS that is
    # a network round trip to the Synology. Durability here comes from streaming
    # replication plus barman backups, not from the filesystem — which is CNPG's own
    # guidance.
    #
    # Safe at instances: 3 and ONLY at 3. local-path is WaitForFirstConsumer so each PV
    # pins to the node that first mounts it; a single instance would be stranded by a
    # node loss. Three instances with CNPG's default anti-affinity means three copies on
    # three nodes and a lost node becomes a promotion. Never drop to 1 while on
    # local-path — move back to NFS first if it ever must run single. (TALOS-npt4)
    storageClass: local-path
  monitoring:
    enablePodMonitor: false  # covered by the global cnpg-clusters PodMonitor (TALOS-7u3)
  # Object-store backups → MinIO (TALOS-a1hk). Config lives in the ObjectStore
  # CR (objectstore.yaml) — migrated off the in-tree barmanObjectStore (removed
  # in CNPG 1.30) to the barman-cloud CNPG-I plugin. Same bucket/prefix/creds;
  # base backups: scheduledbackup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-postgres
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
