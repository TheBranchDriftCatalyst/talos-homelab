---
# Forgejo's database, as a CatalystCNPGAppDB (TALOS-6nf).
#
# Replaces a hand-written Cluster plus a separate ObjectStore and ScheduledBackup (101 lines
# across three files). The composite renders all three, plus the ExternalSecret that
# materialises the MinIO backup credentials in this namespace — previously that depended on
# the forgejo namespace being present on a central reflector allowlist, and a missing entry
# there does not fail at apply time, it fails at 02:00 with 'secrets cnpg-minio-backup not
# found'.
#
# This is the forge's only durable state: every repository, user, access token, OAuth
# application and package-registry record lives here. Git object storage is separate, but a
# lost database means none of it is reachable.
#
# CNPG still creates what it always did: a 'forgejo' database owned by 'forgejo', Secret
# 'forgejo-postgres-app' (username/password/dbname/host/port/uri) that the Forgejo Deployment
# reads its credentials from, and Service 'forgejo-postgres-rw'. The reflect-cnpg-app-secrets
# Kyverno policy mirrors that app secret into the databases namespace for dbgate.
apiVersion: db.catalyst.io/v1alpha1
kind: CatalystCNPGAppDB
metadata:
  name: forgejo-postgres
  namespace: forgejo
spec:
  database: forgejo
  owner: forgejo
  # Three replicas, and three is the floor while this is on local-path: local-path is
  # WaitForFirstConsumer, so each PV pins to the node that first mounted it and a single
  # instance would be stranded by a node loss. Three copies on three nodes makes a lost node
  # a promotion instead of an outage. (TALOS-npt4 / TALOS-hx77)
  instances: 3
  storageSize: 10Gi
  # The node's NVMe. Every Postgres commit is a WAL fsync, and on NFS that is a network round
  # trip to the Synology; durability here comes from streaming replication plus barman
  # backups, not from the filesystem underneath.
  storageClass: local-path
  # Pinned rather than inherited so an operator upgrade cannot walk this cluster onto a new
  # Postgres major on its own — that is a decision, not a default.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.0
  # 02:00 daily, unchanged — forgejo is the first slot in the deliberately staggered fleet
  # (authentik 02:15, crowdsec 02:30, linkwarden 02:45, ... guacamole 04:15) so fourteen
  # databases do not all hit MinIO in the same minute. 6-field cron: sec min hour dom mon dow.
  backupSchedule: "0 0 2 * * *"
  resources:
    requestsCpu: 50m
    requestsMemory: 256Mi
