---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# Non-secret Forgejo config as env vars (the image entrypoint runs
# environment-to-ini to turn these into app.ini). Shared by the Deployment and
# the admin Job via envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-env
  namespace: forgejo
data:
  FORGEJO__database__DB_TYPE: postgres
  FORGEJO__database__HOST: forgejo-postgres-rw.forgejo.svc.cluster.local:5432
  FORGEJO__database__SSL_MODE: require
  FORGEJO__server__DOMAIN: forge.knowledgedump.space
  FORGEJO__server__ROOT_URL: https://forge.knowledgedump.space/
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__packages__ENABLED: "true"
  FORGEJO__actions__ENABLED: "false"
  # OIDC (Authentik) — auto-create a Forgejo account on first SSO login and map
  # the username from the token's preferred_username claim. The auth SOURCE
  # itself is a DB record added by the bootstrap Job (admin auth add-oauth).
  FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
  FORGEJO__oauth2_client__USERNAME: "preferred_username"
  FORGEJO__oauth2_client__ACCOUNT_LINKING: "auto"
---
# Forgejo — git forge + multi-format package registry (npm, PyPI, Maven, NuGet,
# Cargo, RubyGems, Composer, Conan, ...). The image entrypoint (s6) generates
# app.ini from FORGEJO__ env, auto-migrates the DB, and serves. DB creds come
# from the CNPG-generated forgejo-postgres-app secret. The 'panda' admin is
# seeded by the forgejo-admin Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.2
          envFrom:
            - configMapRef: { name: forgejo-env }
          env:
            - name: FORGEJO__database__NAME
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: dbname } }
            - name: FORGEJO__database__USER
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: username } }
            - name: FORGEJO__database__PASSWD
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: password } }
          ports:
            - { name: http, containerPort: 3000 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 45
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - { name: http, port: 3000, targetPort: http }
