---
# LEGACY — local-path, pinned to talos01 by PV nodeAffinity. Superseded by
# forgejo-data-nfs (TALOS-upme). Kept only so the migration is reversible;
# the human validating the cutover gates its removal. Nothing mounts it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
# Forgejo's on-disk state: app.ini (holds the generated INTERNAL_TOKEN,
# JWT_SECRET and oauth2 keys), sshd host keys, git hook templates, the avatar
# store, the goleveldb queue and the bleve issue index — plus, going forward,
# the git repositories under /data/git/repositories and the package registry
# under /data/gitea/packages. The DATABASE is on CNPG (forgejo-postgres), so
# there is no SQLite here and the NFS-locking objection that moved the arr
# stack off NFS does not apply; single replica + Recreate keeps one writer.
#
# 20Gi -> 10Gi: measured content at cutover was 156 KB in 31 files. The
# nfs-subdir provisioner carves a subdir out of the shared export and enforces
# no quota, so this figure is nominal headroom for repos/packages rather than a
# reservation, and the class has allowVolumeExpansion.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data-nfs
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fatboy-nfs-appdata
  resources:
    requests:
      storage: 10Gi
---
# Non-secret Forgejo config as env vars (the image entrypoint runs
# environment-to-ini to turn these into app.ini). Shared by the Deployment and
# the admin Job via envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-env
  namespace: forgejo
data:
  FORGEJO__database__DB_TYPE: postgres
  FORGEJO__database__HOST: forgejo-postgres-rw.forgejo.svc.cluster.local:5432
  FORGEJO__database__SSL_MODE: require
  FORGEJO__server__DOMAIN: forge.knowledgedump.space
  FORGEJO__server__ROOT_URL: https://forge.knowledgedump.space/
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__packages__ENABLED: "true"
  FORGEJO__actions__ENABLED: "false"
  # OIDC (Authentik) — auto-create a Forgejo account on first SSO login and map
  # the username from the token's preferred_username claim. The auth SOURCE
  # itself is a DB record added by the bootstrap Job (admin auth add-oauth).
  FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
  FORGEJO__oauth2_client__USERNAME: "preferred_username"
  FORGEJO__oauth2_client__ACCOUNT_LINKING: "auto"
---
# Forgejo — git forge + multi-format package registry (npm, PyPI, Maven, NuGet,
# Cargo, RubyGems, Composer, Conan, ...). The image entrypoint (s6) generates
# app.ini from FORGEJO__ env, auto-migrates the DB, and serves. DB creds come
# from the CNPG-generated forgejo-postgres-app secret. The 'panda' admin is
# seeded by the forgejo-admin Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.3
          envFrom:
            - configMapRef: { name: forgejo-env }
          env:
            - name: FORGEJO__database__NAME
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: dbname } }
            - name: FORGEJO__database__USER
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: username } }
            - name: FORGEJO__database__PASSWD
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: password } }
          ports:
            - { name: http, containerPort: 3000 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 45
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-nfs  # was forgejo-data (local-path/talos01), TALOS-upme
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - { name: http, port: 3000, targetPort: http }
