---
# Public HTTPS: forge.knowledgedump.space. DNS-only (proxied=false) — package
# uploads (npm/PyPI/etc.) can exceed Cloudflare's 100MB proxy cap. TLS via the
# *.knowledgedump.space wildcard (TLSStore).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-public
  namespace: forgejo
  annotations:
    external-dns.alpha.kubernetes.io/hostname: forge.knowledgedump.space
    external-dns.alpha.kubernetes.io/target: knowledgedump.space
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`forge.knowledgedump.space`)
      kind: Rule
      middlewares:
        # LLM-scraper UAs browsing the code get PROXY'd to the iocaine tarpit;
        # git/OCI clients (non-bot UAs) pass through untouched. (TALOS-mko)
        - name: bot-wrangler
          namespace: traefik
        # Per-client rate limit on the public route (TALOS-lxz5.4.2 / finding
        # 009). NO body cap here — package/OCI uploads stream large bodies.
        - name: rate-limit
          namespace: traefik
      services:
        - name: forgejo
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo-public-http
  namespace: forgejo
spec:
  entryPoints: [web]
  routes:
    - match: Host(`forge.knowledgedump.space`)
      kind: Rule
      middlewares:
        - { name: redirect-https, namespace: traefik }
      services:
        - name: forgejo
          port: 3000
---
# Internal: forge.talos00 (LAN + in-cluster, HTTP).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Forgejo"
    gethomepage.dev/description: "Git forge + package registry (npm/PyPI/...)"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/href: "https://forge.knowledgedump.space"
spec:
  entryPoints: [web]
  routes:
    - match: Host(`forge.talos00`)
      kind: Rule
      middlewares:
        # Full Catalyst theme + the cross-app nav bar. Forgejo is a Gitea fork,
        # so it rides theme.park's `gitea` base sheet — that sheet consumes 37
        # CSS variables and the theme now defines all 37 (TALOS-343d.1); before
        # that it supplied 15 and the undefined ones fell back to stock Gitea.
        #
        # LAN ROUTE ONLY, deliberately. The nav manifest enumerates every
        # *.talos00 hostname in the cluster, so injecting it into the public
        # forge.knowledgedump.space route above would publish the internal
        # topology to the internet. If the public route is ever themed, the
        # manifest needs a public/private split first.
        - name: catalyst-gitea
          namespace: traefik
      services:
        - name: forgejo
          port: 3000
