---
# One-shot Job that ensures the 'panda' admin exists. It talks to the CNPG DB
# directly with a minimal throwaway app.ini (no shared PVC, no entrypoint/
# env-to-ini dependency), runs migrations idempotently, then creates the admin
# (idempotent — ignores "already exists"). Runs as the git user (1000) because
# forgejo refuses to run as root. Reuses the Zot 'panda' password via ESO.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-admin-bootstrap
  namespace: forgejo
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/component: admin-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bootstrap
          image: codeberg.org/forgejo/forgejo:16.0.2
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: dbname } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: username } }
            - name: DB_PASSWD
              valueFrom: { secretKeyRef: { name: forgejo-postgres-app, key: password } }
            - name: ADMIN_PW
              valueFrom: { secretKeyRef: { name: forgejo-secrets, key: admin-password } }
          command:
            - sh
            - -c
            - |
              set -e
              export GITEA_WORK_DIR=/tmp/forgejo
              mkdir -p /tmp/forgejo/conf
              cat > /tmp/forgejo/conf/app.ini <<EOF
              APP_NAME = Forgejo
              WORK_PATH = /tmp/forgejo
              RUN_MODE = prod
              [security]
              INSTALL_LOCK = true
              [database]
              DB_TYPE  = postgres
              HOST     = forgejo-postgres-rw.forgejo.svc.cluster.local:5432
              NAME     = ${DB_NAME}
              USER     = ${DB_USER}
              PASSWD   = ${DB_PASSWD}
              SSL_MODE = require
              EOF
              CFG=/tmp/forgejo/conf/app.ini
              echo "==> migrate (idempotent, ensures schema)"
              forgejo -c "$CFG" migrate
              echo "==> ensure admin 'panda'"
              if forgejo -c "$CFG" admin user list 2>/dev/null | awk '{print $2}' | grep -qx panda; then
                echo "    admin 'panda' already exists"
              else
                forgejo -c "$CFG" admin user create --admin --username panda \
                  --email panda@catalyst.local --password "$ADMIN_PW" --must-change-password=false
                echo "    admin 'panda' created"
              fi
              echo "==> done"
