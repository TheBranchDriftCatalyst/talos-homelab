---
# Daily base backup for forgejo-postgres → MinIO object store (TALOS-a1hk).
# Continuous WAL archiving is handled by the Cluster's barmanObjectStore; this
# ScheduledBackup drives the periodic base backups that WAL replays sit on top
# of. 30-day retention is enforced by the Cluster's backup.retentionPolicy.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: forgejo-postgres-daily
  namespace: forgejo
  annotations:
    # Do NOT let Flux delete this object when its manifest leaves git. It is being converted
    # to a CatalystCNPGAppDB composite (TALOS-npt4); the manifests are removed in the
    # following commit and the composite adopts the live objects. Without this annotation,
    # removing the manifest would prune the Cluster and CNPG would delete its PVCs — i.e.
    # destroy the forge's database.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # 02:00 every day. CNPG cron is 6-field (seconds first): sec min hour dom mon dow.
  schedule: "0 0 2 * * *"
  immediate: true # take one right away so backups exist before the first 02:00 tick
  backupOwnerReference: self
  # barman-cloud CNPG-I plugin (see objectstore.yaml) — in-tree method removed in CNPG 1.30
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: forgejo-postgres
