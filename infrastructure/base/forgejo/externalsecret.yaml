---
# Forgejo admin password — reuses the SAME 1Password field as the Zot registry
# (zot.registry-password, user 'panda'), so there's one credential for both
# registries and no new 1Password item to provision for the core deploy.
# (OIDC client secret is added later in a separate follow-up.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: forgejo-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: zot
        property: registry-password
    # OIDC client secret — SAME 1Password field the authentik-forgejo-oidc
    # ExternalSecret reads (forgejo.oidc-client-secret), so both ends of the
    # handshake stay in lockstep. Consumed by the auth-source bootstrap Job.
    - secretKey: oidc-client-secret
      remoteRef:
        key: forgejo
        property: oidc-client-secret
