---
# Git-over-SSH for Forgejo (TALOS-6nf). Forgejo's built-in SSH server listens on :22 in the pod
# (DISABLE_SSH=false, verified listening on 0.0.0.0:22). Traefik only does HTTP, so SSH gets its own
# raw-TCP LoadBalancer with a Cilium L2-announced LAN VIP (192.168.1.249 from lan-forgejo-pool, see
# cilium/lb-ipam.yaml).
#
# PORT 2222, not 22: WAN:22 is the honeypot (security/honeypots) — deliberately catching attackers on
# the standard SSH port. So Forgejo git-SSH uses 2222 everywhere for a single, consistent clone URL:
#   git clone ssh://git@forge.knowledgedump.space:2222/<owner>/<repo>.git   (SSH_DOMAIN/SSH_PORT in forgejo-env)
# The VIP serves :2222 (-> container :22). WAN reach via the unifi-port-forward operator annotation
# (WAN:2222 -> this VIP's :ssh). LAN reach: forge.knowledgedump.space is DNS-only (-> WAN IP) so LAN
# clients hairpin through the same forward, or hit the VIP directly at 192.168.1.249:2222.
#
# externalTrafficPolicy: Cluster — git-SSH authenticates by SSH KEY, not client IP, so no need for
# Local/client-IP preservation; any elected node announces + routes to the single Forgejo pod.
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: forgejo
  labels:
    app: forgejo-ssh # matched by lan-forgejo-pool + lan-forgejo-l2 (cilium/lb-ipam.yaml)
  annotations:
    # unifi-port-forward operator (annotation mode): WAN:2222 -> this LB ingress IP's :ssh port.
    unifi-port-forward.fiskhe.st/mapping: "2222:ssh"
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - {name: ssh, port: 2222, targetPort: 22, protocol: TCP}
