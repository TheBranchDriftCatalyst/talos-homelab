---
# Altinity ClickHouse Operator
# Provides CRDs (clickhouse.altinity.com/v1):
#   - ClickHouseInstallation
#   - ClickHouseInstallationTemplate
#   - ClickHouseOperatorConfiguration
#   - ClickHouseKeeperInstallation
# Docs: https://docs.altinity.com/altinitykubernetesoperator/
#
# NOTE: The upstream install bundle defaults the operator to the kube-system
# namespace. We deliberately override that here — the operator runs in the
# dedicated `clickhouse` namespace (HelmRelease/HelmRepository namespace +
# default targetNamespace) and watches ALL namespaces via watchNamespaces.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: altinity-clickhouse-operator
  namespace: clickhouse
spec:
  interval: 1h
  url: https://docs.altinity.com/clickhouse-operator/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: clickhouse
spec:
  interval: 30m
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: '0.27.2'
      sourceRef:
        kind: HelmRepository
        name: altinity-clickhouse-operator
        namespace: clickhouse
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Force the operator Deployment name to `clickhouse-operator`
    # (matches the Flux healthCheck target).
    fullnameOverride: clickhouse-operator

    # Watch ClickHouseInstallation resources in ALL namespaces.
    # ".*" is a regex matching every namespace.
    watchNamespaces:
      - ".*"

    # Single operator pod, small footprint for the homelab.
    operator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
