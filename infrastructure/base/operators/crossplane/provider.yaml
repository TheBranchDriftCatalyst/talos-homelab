---
# provider-kubernetes lets Crossplane provision arbitrary Kubernetes objects
# (via the kubernetes.crossplane.io Object CR). Installed as a Crossplane
# package; Crossplane must reconcile the HelmRelease first so the
# pkg.crossplane.io CRDs exist before this Provider applies (Flux retries).
#
# DeploymentRuntimeConfig pins the provider controller's ServiceAccount name
# to a deterministic value ("provider-kubernetes") so the ClusterRoleBinding
# in provider-rbac.yaml can reference it. Without this, Crossplane's package
# manager generates a hashed SA name (provider-kubernetes-<hash>) that cannot
# be referenced at apply time.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.2.1
  runtimeConfigRef:
    name: provider-kubernetes
