---
# Official upstream RabbitMQ operators (vendored release manifests). Switched off the Bitnami
# Helm chart, whose images (docker.io/bitnami/*) are no longer freely pullable → ImagePullBackOff
# (Bitnami paywalled/moved their registry in 2025). These use the freely-pullable rabbitmq/*
# images and self-manage their webhook certs via cert-manager. (TALOS-ja5)
# CRDs: RabbitmqCluster (cluster-operator); Queue/Exchange/Binding/User/Permission/Vhost/... (topology).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-operator.yaml # rabbitmq-system Namespace + RabbitmqCluster CRD + cluster operator
  - messaging-topology-operator.yaml # Queue/Exchange/... CRDs + topology operator (cert-manager webhook)
