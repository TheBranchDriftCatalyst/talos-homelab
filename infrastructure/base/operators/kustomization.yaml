---
# Self-service operator catalog (TALOS-ja5). Each subdir installs one operator as a Flux
# HelmRelease (namespace + helmrelease + kustomization), mirroring databases/cloudnative-pg.
# Deployed by clusters/catalyst-cluster/operators.yaml (wait:true + per-operator healthChecks
# so CRDs register before the crossplane-demo CRs apply).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rabbitmq-operator/ # RabbitmqCluster + Queue/Exchange/... (rabbitmq.com)
  - keda/ # ScaledObject/ScaledJob/TriggerAuthentication (keda.sh)
  - dragonfly-operator/ # Dragonfly (dragonflydb.io)
  - crossplane/ # Provider/Object + provider-kubernetes (crossplane.io)
  - clickhouse-operator/ # ClickHouseInstallation (clickhouse.altinity.com)
  - opensearch-operator/ # OpenSearchCluster (opensearch.opster.io)
  - argo-workflows/ # Workflow/WorkflowTemplate/CronWorkflow (argoproj.io)
