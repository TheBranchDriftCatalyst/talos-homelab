---
# KEDA HTTP add-on — the request BUFFER for scale-from-zero GPU inference (TALOS-o3jn).
#
# KEDA core (helmrelease.yaml, v2.20.2) can scale a Deployment to zero, but nothing holds
# an inbound request while the target warms. The add-on's interceptor does exactly that:
# it queues the request, reports queue depth to KEDA, and releases the request only once
# the target Deployment reports READY.
#
# That last part is why gateway readiness must gate on the real GPU backend — see
# gpu-inference/gateway-deployment.yaml. If the gateway went Ready as soon as its own pod
# started, the interceptor would release buffered requests into a backend that is still
# minutes from existing.
#
# TIMEOUTS: deliberately LONG and IDENTICAL to every other hop (600s). A cold start here
# is EC2 boot + s5cmd sync + weights into VRAM = 2-5 min realistic. The shortest link in
# the chain wins, so Traefik, the interceptor and the gateway all use the same number.
# See gpu-inference/README.md for the full budget.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The add-on must point at the EXISTING keda core install, not stand up its own.
    operator:
      # How long the interceptor holds a request waiting for the target to become Ready.
      # This is THE cold-start buffer window.
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
    interceptor:
      replicas:
        min: 1        # never scale the interceptor itself to zero — it IS the front door
        max: 3
      # Long timeouts: a buffered request may legitimately wait minutes for a cold GPU.
      # keda-add-ons-http exposes these as env on the interceptor.
      additionalEnvVars:
        - name: KEDA_HTTP_CONNECT_TIMEOUT
          value: "10s"
        - name: KEDA_RESPONSE_HEADER_TIMEOUT
          value: "600s"     # matches Traefik + nginx proxy_read_timeout
        - name: KEDA_CONDITION_WAIT_TIMEOUT
          value: "600s"     # how long to wait for the target to report Ready
      resources:
        requests: {cpu: 25m, memory: 64Mi}
        limits: {memory: 256Mi}
    scaler:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
