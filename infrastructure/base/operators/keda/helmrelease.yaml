---
# KEDA — Kubernetes Event-Driven Autoscaling
#
# CRDs provided (keda.sh/v1alpha1):
#   ScaledObject, ScaledJob, TriggerAuthentication, ClusterTriggerAuthentication
#   (also CloudEventSource / ClusterCloudEventSource)
#
# Cert handling: KEDA self-manages its admission webhook certificates
# (keda-operator generates/rotates them) — cert-manager is NOT required.
#
# Note: KEDA ships its CRDs as chart templates (not in a crds/ dir), so the
# Flux install/upgrade.crds policy below does not govern them; they are applied
# as ordinary manifests. The policy is kept for consistency with the repo's
# operator pattern.
#
# Docs: https://keda.sh/docs/
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
  namespace: keda
spec:
  interval: 1h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: '2.20.2'
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # keda-operator
    operator:
      replicaCount: 1
    # keda-operator-metrics-apiserver
    metricsServer:
      replicaCount: 1
    # keda-admission-webhooks
    webhooks:
      replicaCount: 1

    # Prometheus metrics: the chart defaults to --enable-prometheus-metrics=false, so the
    # operator emits NO keda_* scaler/trigger/error series (only the metrics-apiserver's
    # keda_internal_* gRPC metrics are live). Enable the operator's Prometheus server so the
    # KEDA Autoscaling dashboard's scaler/trigger/resource panels populate. Keep the chart's
    # PodMonitor OFF — the hand-authored keda-monitoring PodMonitor is the single scrape source
    # (Alloy auto-discovers it). (TALOS-0tbh)
    prometheus:
      operator:
        enabled: true
        podMonitor:
          enabled: false

    # Small homelab resource footprint per component
    resources:
      operator:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      metricServer:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      webhooks:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
