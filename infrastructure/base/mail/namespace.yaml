---
apiVersion: v1
kind: Namespace
metadata:
  name: mail
  labels:
    app.kubernetes.io/managed-by: flux
    # baseline: Stalwart runs non-root on high ports (SMTP 2525, HTTP 8080) so it
    # needs no privileged binding; baseline leaves headroom for the image's needs.
    pod-security.kubernetes.io/enforce: baseline
