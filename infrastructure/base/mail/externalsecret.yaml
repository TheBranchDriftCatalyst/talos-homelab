---
# SINGLE SOURCE OF TRUTH for the Stalwart outbound relay's Gmail credentials.
# The sending account's EMAIL and its APP PASSWORD are one identity, so both live
# in the ONE 1Password item "mail-relay" and are pulled together here:
#   - field "username" = the Workspace account ([email protected])
#   - field "password" = that account's 16-char Google App Password
# Stalwart reads auth-username, auth-secret AND the From identity from this secret,
# so swapping the mailer account = editing this single 1Password item (both fields),
# no manifest change. ESO re-syncs hourly; Stalwart re-reads on pod restart.
# (Migration to a dedicated mailer@ user tracked in TALOS-w5b.6.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-relay-credentials
  namespace: mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: mail-relay-credentials
    creationPolicy: Owner
  data:
    - secretKey: relay-username
      remoteRef:
        key: mail-relay
        property: username
    - secretKey: relay-password
      remoteRef:
        key: mail-relay
        property: password
