---
# Gmail app password for the Stalwart outbound relay (smarthost auth).
#
# 1Password item: "mail-relay", field "password" = the 16-char Google App Password
# generated on the knowledgedump.space Workspace account that owns SMTP sending.
#
# The account EMAIL (SASL username / From identity) is NOT secret and lives in the
# Stalwart config in git — only the app password is pulled here. Rotate by updating
# the 1Password item; ESO re-syncs every hour and Stalwart re-reads on pod restart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mail-relay-credentials
  namespace: mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: mail-relay-credentials
    creationPolicy: Owner
  data:
    - secretKey: relay-password
      remoteRef:
        key: mail-relay
        property: password
