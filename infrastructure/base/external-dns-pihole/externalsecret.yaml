---
# Pull the same pihole-admin password (1Password item `pihole-admin`) into this
# namespace so external-dns can authenticate to Pi-hole's API.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pihole-admin
  namespace: external-dns-pihole
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pihole-admin
    creationPolicy: Owner
  data:
    - secretKey: EXTERNAL_DNS_PIHOLE_PASSWORD
      remoteRef:
        key: pihole-admin
        property: password
