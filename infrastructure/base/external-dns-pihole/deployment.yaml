---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-pihole
  namespace: external-dns-pihole
  labels:
    app.kubernetes.io/name: external-dns-pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns-pihole
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns-pihole
    spec:
      serviceAccountName: external-dns-pihole
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: external-dns
          # v0.17.0: current Pi-hole v6 REST API support (v0.16.1 spoke the old v5
          # /admin/api.php path → 404 against Pi-hole v6).
          image: registry.k8s.io/external-dns/external-dns:v0.17.0
          args:
            # Watch the same IngressRoutes as the Cloudflare instance
            - --source=traefik-proxy
            - --source=ingress
            # Pi-hole provider → LAN-only zone
            - --provider=pihole
            - --pihole-server=http://pihole-web.pihole.svc.cluster.local
            - --pihole-api-version=6 # supported in v0.17.0 (not v0.16.1); selects v6 REST API
            - --domain-filter=talos00.lan
            # Traefik is hostPort (no LB IP) → point all records at the node IP
            - --default-targets=192.168.1.54
            - --policy=upsert-only
            # Pi-hole can't store TXT ownership records → no registry
            - --registry=noop
            - --traefik-disable-legacy
            - --log-level=info
            - --log-format=text
            - --interval=1m
          env:
            - name: EXTERNAL_DNS_PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: EXTERNAL_DNS_PIHOLE_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7979
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7979
            initialDelaySeconds: 5
            periodSeconds: 10
