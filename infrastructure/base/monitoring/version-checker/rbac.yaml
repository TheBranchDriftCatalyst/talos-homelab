---
# version-checker watches ALL pods cluster-wide to discover running container
# images, then queries each image's registry for newer tags. Read-only on pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: version-checker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: version-checker
    app.kubernetes.io/component: exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: version-checker
  labels:
    app.kubernetes.io/name: version-checker
rules:
  # Cluster-wide read of pods to enumerate running container images.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: version-checker
  labels:
    app.kubernetes.io/name: version-checker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: version-checker
subjects:
  - kind: ServiceAccount
    name: version-checker
    namespace: monitoring
