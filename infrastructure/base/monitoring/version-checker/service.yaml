---
# ClusterIP exposing the version-checker /metrics endpoint (port name `web`
# matches the container port and upstream convention). Scraped by the
# ServiceMonitor below.
apiVersion: v1
kind: Service
metadata:
  name: version-checker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: version-checker
    app.kubernetes.io/component: exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: version-checker
  ports:
    - name: web
      port: 8080
      targetPort: web
      protocol: TCP
