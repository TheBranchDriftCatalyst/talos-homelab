---
# jetstack/version-checker — image-version exporter.
# Enumerates every running container cluster-wide, queries its source registry
# for newer tags, and exposes:
#   version_checker_is_latest{namespace,pod,container,image,current_version,latest_version}
#   (gauge: 1=latest, 0=out-of-date)
# Powers the "App Ops — Image Versions" Grafana dashboard (metrics land in Mimir
# via the ServiceMonitor -> Alloy cluster-wide scrape).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: version-checker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: version-checker
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: version-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: version-checker
        app.kubernetes.io/component: exporter
    spec:
      # Soft-repel from talos03. gj3n raised the platform DaemonSet requests to their
      # measured values, which need ~800Mi on every node — and talos03, the 12.8Gi node
      # that wedged, had only 34Mi free once eda0's singleton increases landed there.
      # This is one of three singletons moved to make room. Preference, not a pin: if
      # talos03 is the only node with space, running here beats not running.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [talos03]
      serviceAccountName: version-checker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: version-checker
          # PATCHED FORK, not upstream. Built from v0.11.0 + three fixes; the
          # patch and its tests are in scratchpad/version-checker-v0.11.0.patch.
          # Revert to quay.io/jetstack/version-checker as soon as a release
          # contains them (v0.11.0 was still the latest as of 2026-10-20).
          #
          # WHAT WAS BROKEN. 12,015 error lines/day across 165 signatures, all
          # "no tags found for given image URL", and -- the part that actually
          # mattered -- ~117 containers silently NOT version-checked at all,
          # which defeats the point of this exporter. It was never a
          # credentials problem: no workload in the cluster was failing to pull.
          #
          #   1. pkg/client/fallback: RepoImageFromPath returned ("", ""), so
          #      every host without a dedicated client asked the whole fallback
          #      chain for the EMPTY image.
          #   2. pkg/client/fallback: a client answering "no error, zero tags"
          #      counted as success. Once (1) is fixed the anonymous Docker Hub
          #      client gets asked for foreign registries' paths -- e.g.
          #      "kyverno/kyverno", "forgejo/forgejo" -- replies HTTP 200 with
          #      no results, ends the search before the OCI client is ever
          #      tried, and gets cached for that host for five hours. Fixing
          #      (1) alone takes a representative sample from 2/14 to 5/14.
          #   3. pkg/client/gcr: the host regex claims *.k8s.io and injected the
          #      gcr.io legacy "google-containers" org, requesting
          #      /v2/google-containers/kube-apiserver/tags/list -> 404 with a
          #      text/plain body -> the logged "invalid character 'r' looking
          #      for beginning of value".
          #
          # Measured on a sample mirroring the failing refs: 2/14 -> 14/14
          # resolved, WITH NO CREDENTIALS AT ALL. So the Docker Hub and private
          # registry auth sketched under NOISE GUARD (b) is not needed for
          # these lookups; the OCI client does the scoped-bearer dance
          # anonymously, it was simply never being reached.
          #
          # Upstream's own client tests still pass; the patch adds tests to
          # pkg/client/fallback, which had none, and each fix was verified by
          # mutation -- reverting it turns the new tests red.
          image: registry.talos00/talos00-registry/version-checker:v0.11.0-registryfix1
          command: ["version-checker"]
          args:
            # Automatically check EVERY container on the cluster without needing
            # a per-pod enable annotation. Opt individual containers OUT with
            # `enable.version-checker.io/<container>: "false"`.
            - --test-all-containers
            # Metrics + /metrics endpoint (matches Service/ServiceMonitor port).
            - --metrics-serving-address=0.0.0.0:8080
            # How long a resolved image->tags lookup is cached before re-querying
            # the registry. Long TTL keeps us well under registry rate limits;
            # version drift changes slowly so freshness isn't a concern.
            - --image-cache-timeout=30m
            - --log-level=info
          # NOISE GUARD (a): Docker Hub anonymous pulls are rate-limited
          # (~100 manifest reqs / 6h / IP). --test-all-containers across the whole
          # cluster can throttle for docker.io images; with a 30m cache this is
          # acceptable for a first pass. If Docker Hub 429s become noisy, add
          # Docker Hub creds via the env below (see NOISE GUARD (b)).
          #
          # NOISE GUARD (b) — PRIVATE REGISTRY AUTH. This block used to say the
          # lookup failures were an auth gap affecting "only a handful of
          # images", and that was wrong on both counts: 114 of 153 failing refs
          # were in that group, 69 of them PUBLIC ghcr.io images needing no
          # auth whatsoever. The cause was the three client bugs described on
          # the image above, and the patched image resolves all of them
          # anonymously. Credentials are not the fix and were never missing.
          #
          # Two notes kept because they remain true:
          #   - registry.talos00 resolves only on the nodes (Talos
          #     extraHostEntries -> 192.168.1.54); CoreDNS has never heard of
          #     it. version-checker has no prefix/api_url split like
          #     argocd-image-updater, so reaching Zot from this pod needs a
          #     hostAliases entry plus VERSION_CHECKER_SELFHOSTED_* creds from
          #     ESO. Not wired; those refs still fail, and that is a known gap.
          #   - DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD would still lift the
          #     anonymous Docker Hub rate limit in NOISE GUARD (a).
          #
          # NOISE GUARD (c) — TAG NOISE: pre-release / SHA / date-stamped tags can
          # produce false "out-of-date" flips. Suppress per-container with pod
          # annotations (opt-in): `use-metadata.version-checker.io/<container>`,
          # `match-regex.version-checker.io/<container>`, and the pin-* family
          # (`pin-major`/`pin-minor`/`pin-patch`.version-checker.io/<container>).
          # Add those on the noisy workload's pod template, not here.
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
          # Measured 7d to 2026-08-24: p50 163Mi, peak 223Mi. The 64Mi request
          # was 2.5x under steady state. Limit stays 512Mi — 2.3x peak, and
          # the OOMKill history below says do not tighten it. [TALOS-eda0]
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              # 256Mi OOMKilled (exit137) tracking ~300 images → version_checker series vanish on each
              # restart, staling the App-Ops Image-Versions dashboard. Raised to 512Mi (audit SEV-3).
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: web
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: web
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
