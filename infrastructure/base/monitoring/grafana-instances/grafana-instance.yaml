---
# Grafana instance managed by grafana-operator
# Replaces kube-prometheus-stack bundled Grafana
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: 'grafana'
spec:
  # Use external secret for admin credentials (from 1Password via ESO)
  # Disable operator's default admin secret creation - we manage it via ExternalSecrets
  disableDefaultAdminSecret: true
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
                # Authentik OIDC client secret (from 1Password via ESO).
                # Grafana auto-maps this env var to
                # [auth.generic_oauth] client_secret, so the secret never
                # touches git or the spec.config block below.
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET

  # Grafana configuration
  config:
    server:
      root_url: http://grafana.talos00
    # Anonymous viewer access stays ON (unauthenticated read-only dashboards).
    auth.anonymous:
      enabled: 'true'
      org_role: Viewer
    # Built-in admin/password login stays enabled as a break-glass fallback;
    # the Authentik "Sign in" button is added alongside it (auto_login off).
    # OIDC SSO via Authentik (blueprint: infrastructure/base/authentik/grafana-blueprint.yaml).
    #
    # Split-host OIDC (deliberate): the browser-facing auth_url uses
    # http://auth.talos00 (what the user's browser resolves via /etc/hosts),
    # while the pod-side token_url/api_url use in-cluster service DNS. The
    # Grafana pod CANNOT hairpin to auth.talos00 (node LB IP), so a single-host
    # config fails token exchange with "Failed to get token from provider".
    # Grafana's generic_oauth does not enforce id_token issuer matching, so the
    # host mismatch between auth_url and token_url is harmless.
    auth.generic_oauth:
      enabled: 'true'
      name: Authentik
      icon: signin
      client_id: grafana
      # client_secret comes from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET env (above)
      scopes: 'openid profile email'
      auth_url: http://auth.talos00/application/o/authorize/
      token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
      api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
      use_pkce: 'true'
      allow_sign_up: 'true'
      auto_login: 'false'
      # Map Authentik groups -> Grafana role. Members of "Catalyst Admins" or
      # "grafana-admins" become Admin; everyone else who logs in gets Viewer.
      role_attribute_path: "(contains(groups[*], 'Catalyst Admins') || contains(groups[*], 'grafana-admins')) && 'Admin' || 'Viewer'"
      role_attribute_strict: 'false'
    log:
      mode: console
      level: info

  # NO persistence — Grafana runs as pure cattle. /var/lib/grafana is ephemeral
  # (emptyDir). ALL state is code: dashboards are GrafanaDashboard CRs and
  # datasources are GrafanaDatasource CRs, re-pushed by grafana-operator on every
  # restart. Any dashboard worth keeping MUST be promoted to a CR under
  # infrastructure/base/monitoring/grafana-dashboards/ — UI-only edits do not
  # survive a pod roll. (A persistentVolumeClaim block used to live here but was
  # never wired into the deployment by grafana-operator v5, so it did nothing for
  # 52 days; removed to avoid the misleading Pending PVC.)

  # Service configuration
  service:
    spec:
      type: ClusterIP
      ports:
        - name: grafana
          port: 3000
          targetPort: 3000
