---
# IngressRoute for Grafana managed by grafana-operator
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Dashboards & Visualization"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/weight: "1"
    gethomepage.dev/icon: "grafana.png"
    gethomepage.dev/siteMonitor: "http://grafana-service.monitoring.svc.cluster.local:3000"
    gethomepage.dev/widget.type: "grafana"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`grafana.talos00`)
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        - name: lan-only
          namespace: traefik
        # HyperDX RUM **and** the catalyst navbar, from ONE middleware. Grafana
        # is the RUM canary -- LAN-only and SSO-gated so the audience is the
        # operator, and a heavy SPA so the data is interesting.
        #
        # DO NOT ADD traefik/catalyst-nav HERE. It is a rewriteBody, this is a
        # rewriteBody, and chaining two is a silent failure mode in this cluster
        # (the second regex may never match and nothing reports it). The bar is
        # injected by the SAME single rewrite as the RUM tag instead -- see
        # monitoring/v2-otel/hyperdx-rum/middlewares.yaml, same pattern as
        # boomtime/amberdark, which merge their RUM tag into their Plausible
        # rewrite for exactly this reason.
        #
        # The `catalyst` prefix on the name is what gets grafana a LINK in the
        # bar: build_nav.py only advertises routes carrying a catalyst* mw.
        #
        # Replay is FULLY MASKED on this host (both masks left at their
        # defaults): Grafana panels can show production data, and an admin
        # surface is the wrong place to record what is on screen.
        - name: catalyst-nav-rum-grafana
          namespace: monitoring
      services:
        - name: grafana-service
          port: 3000
