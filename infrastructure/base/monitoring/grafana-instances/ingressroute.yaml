---
# IngressRoute for Grafana managed by grafana-operator
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Grafana"
    gethomepage.dev/description: "Dashboards & Visualization"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/weight: "1"
    gethomepage.dev/icon: "grafana.png"
    gethomepage.dev/siteMonitor: "http://grafana-service.monitoring.svc.cluster.local:3000"
    gethomepage.dev/widget.type: "grafana"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`grafana.talos00`)
      # lan-only added 2026-09-26 (TALOS-a8vo.4). WAN-reachable admin/AI surface on the
      # web entrypoint with no auth; host-spoof from off-net reached it. Blocks off-LAN.
      middlewares:
        - name: lan-only
          namespace: traefik
        # HyperDX RUM: traces, console capture and session replay. Grafana is
        # the canary for this -- LAN-only and SSO-gated so the audience is the
        # operator, a heavy SPA so the data is interesting, and it carries no
        # other body rewriter, which matters because chaining two rewriteBody
        # middlewares is a silent failure mode here.
        #
        # Replay is FULLY MASKED on this host (both masks left at their
        # defaults): Grafana panels can show production data, and an admin
        # surface is the wrong place to record what is on screen.
        - name: hyperdx-rum-grafana
          namespace: monitoring
      services:
        - name: grafana-service
          port: 3000
