# Grafana OIDC client secret from 1Password.
# Pulls the SAME 1Password property (grafana.oidc-client-secret) that the
# authentik-grafana-oidc ExternalSecret uses, so both ends of the Authentik
# OIDC handshake stay in lockstep across cluster rebuilds with no manual
# coordination. Consumed by the Grafana instance as
# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (see grafana-instance.yaml).
#
# PROVISION FIRST: create the 1Password item "grafana" field
# "oidc-client-secret" (e.g. `openssl rand -hex 32`) before this reconciles.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: grafana
        property: oidc-client-secret
