---
# Dragonfly cache cluster-wide monitoring: one PodMonitor that auto-discovers
# every Dragonfly instance in every namespace. Pairs with the label-driven
# "Dragonfly Cache" Grafana dashboard (Ops/Databases).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - podmonitor.yaml
