---
# redis_exporter sidecar-style Deployment for the argocd/argocd-dragonfly cache.
#
# WHY a separate exporter instead of scraping Dragonfly directly: Dragonfly
# multiplexes RESP + a minimal HTTP/1.1 server on the SAME :6379 socket. Alloy's
# Prometheus scraper cannot cleanly pull that endpoint (the scrape hangs / times
# out at 10s → up=0; documented in TALOS-tf6o). oliver006/redis_exporter instead
# connects to Dragonfly over the pure RESP protocol (Dragonfly is fully
# redis-compatible — verified `redis-cli PING`→PONG on argocd-dragonfly-0),
# runs the standard INFO/CONFIG probes, and re-exposes clean `redis_*` metrics
# over plain HTTP on :9121/metrics, which Alloy scrapes normally.
#
# This exporter lives in the `monitoring` namespace (not argocd) so ALL cache
# monitoring wiring stays Flux-owned and co-located with the rest of the
# exporters; it reaches the cache cross-namespace via the operator-created
# ClusterIP svc `argocd-dragonfly.argocd:6379`. No auth (the CR runs
# password-less; see infrastructure/base/argocd/dragonfly.yaml).
#
# The pod carries label `redis_cache: argocd-dragonfly`; the shared PodMonitor
# projects it onto every series via podTargetLabels, so the dashboard's $redis
# variable distinguishes fleet instances. (TALOS-tf6o / epic TALOS-0tbh)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter-argocd-dragonfly
  namespace: monitoring
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: dragonfly-monitoring
    redis_cache: argocd-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
      redis_cache: argocd-dragonfly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: dragonfly-monitoring
        redis_cache: argocd-dragonfly
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis-exporter
          # oliver006/redis_exporter — the de-facto redis/valkey/dragonfly exporter.
          # (prefer-latest: bump alongside the redis_exporter release cadence.)
          image: oliver006/redis_exporter:v1.89.0-alpine
          args:
            - "--redis.addr=redis://argocd-dragonfly.argocd.svc.cluster.local:6379"
            - "--web.listen-address=:9121"
          ports:
            - name: metrics # PodMonitor references this port name
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 64Mi}
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 15
