---
# Cluster-wide auto-discovery PodMonitor for ALL RabbitmqCluster instances.
#
# WHY: the rabbitmq-cluster-operator enables the `rabbitmq_prometheus` plugin by
# default (metrics on port 15692, /metrics) but does NOT create a
# PodMonitor/ServiceMonitor, so nothing is scraped out of the box. This single
# PodMonitor selects EVERY RabbitMQ server pod in EVERY namespace by the
# operator-managed label `app.kubernetes.io/component: rabbitmq`, so any
# RabbitmqCluster is scraped automatically with zero per-cluster config. Alloy's
# `prometheus.operator.podmonitors "default"` already discovers PodMonitors
# across all namespaces (no selector), so this Just Works the moment it lands.
#
# SCRAPE TARGET: the operator names the metrics container port `prometheus`
# (15692). Metrics land in Mimir with labels namespace + pod (the RabbitMQ node);
# the "RabbitMQ Messaging" dashboard templates on those.
#
# NOTE: as of authoring the only RabbitmqCluster is crossplane-demo/demo-rabbit
# and it is partly down (ALLREPLICASREADY=False, 0 running server pods), so NO
# rabbitmq_* series exist yet — panels populate once demo-rabbit recovers and is
# scraped.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rabbitmq-clusters
  namespace: monitoring
  labels:
    app.kubernetes.io/component: rabbitmq-monitoring
    app.kubernetes.io/part-of: rabbitmq
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  podMetricsEndpoints:
    - port: prometheus # rabbitmq server container metrics port (15692)
      path: /metrics
      interval: 30s
