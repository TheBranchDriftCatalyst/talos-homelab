---
# RabbitMQ cluster-wide monitoring: one PodMonitor that auto-discovers every
# RabbitMQ server pod in every namespace. Pairs with the label-driven
# "RabbitMQ Messaging" Grafana dashboard (Ops/Databases).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - podmonitor.yaml
