---
# Grafana Loki - Log aggregation
# Native OTLP support via /otlp/v1/logs endpoint
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: '6.23.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  values:
    # The chart's default chunks cache is an 8GB memcached with a matching 9830Mi
    # request AND limit. Measured over 24h on this cluster it peaks at 140Mi and
    # floors at 19Mi — it has never come close to filling, because this homelab does
    # not push enough chunks through Loki to need it.
    #
    # That default was reserving 9.6GiB of scheduler capacity for 140Mi of real use,
    # on talos02-gpu. Requests are what kube-scheduler packs on, so that is 9.6GiB
    # other workloads could not be given. It was the single largest phantom
    # reservation in the cluster — larger than anything the fleet-wide audit flagged.
    #
    # -m 1024 with a 1536Mi request is ~7x the observed peak. If Loki's query
    # performance ever suggests the cache is undersized, raise BOTH numbers together:
    # memcached will happily accept -m larger than its request and then get OOMKilled
    # when it tries to use it. (TALOS-ri7d)
    chunksCache:
      allocatedMemory: 1024
      resources:
        requests:
          cpu: 100m
          memory: 1536Mi
        limits:
          memory: 1536Mi
    # Deployment mode - single binary for homelab
    deploymentMode: SingleBinary
    loki:
      # Disable multi-tenancy
      auth_enabled: false
      # Common config
      commonConfig:
        replication_factor: 1
      # Schema - TSDB with v13 for OTLP support
      schemaConfig:
        configs:
          - from: '2024-01-01'
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h
      # Storage - MinIO S3-compatible
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          endpoint: minio-hl.minio.svc:9000
          # ${...} expanded at runtime via -config.expand-env=true (see
          # singleBinary.extraArgs). Creds injected from loki-s3-credentials
          # (ESO → 1Password `minio`) via singleBinary.extraEnvFrom. TALOS-tmqq
          accessKeyId: "${AWS_ACCESS_KEY_ID}"
          secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
          s3ForcePathStyle: true
          insecure: true
      # Limits
      limits_config:
        retention_period: 720h # 1 month (30 days)
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 15
        max_streams_per_user: 5000
        max_query_series: 500
        max_line_size: 512kb
        # Accept older logs (for batch job logs, historical imports)
        reject_old_samples: true
        reject_old_samples_max_age: 720h # 1 month to match retention
      # Compactor for retention
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem
        compaction_interval: 10m
        # OTLP endpoint enabled by default in Loki 3.x
        # Accessible at /otlp/v1/logs
    # Single binary config
    singleBinary:
      replicas: 1
      # Expand ${AWS_ACCESS_KEY_ID}/${AWS_SECRET_ACCESS_KEY} in the Loki config
      # and source them from the loki-s3-credentials Secret (ESO → 1Password
      # `minio`). SingleBinary reads singleBinary.extraArgs/extraEnvFrom (NOT
      # the top-level loki.* equivalents). TALOS-tmqq
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: loki-s3-scoped # scoped `loki` user (bucket-only), not root — TALOS-xgrl.12
      # Tolerate control-plane taint - local-path PV is bound to talos00
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
      persistence:
        enabled: true
        storageClass: local-path
        size: 30Gi
    # Disable distributed components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # Gateway disabled - direct access
    gateway:
      enabled: false
    # Monitoring
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    # Disable extras
    test:
      enabled: false
    lokiCanary:
      enabled: false
