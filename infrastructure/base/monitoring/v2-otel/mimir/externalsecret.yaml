---
# Mimir S3 (MinIO) credentials (TALOS-tmqq). Injected into every Mimir pod via
# global.extraEnvFrom; the structuredConfig references ${AWS_ACCESS_KEY_ID} /
# ${AWS_SECRET_ACCESS_KEY} which Mimir expands at runtime (-config.expand-env=true
# is enabled by default in the mimir-distributed chart). Sourced from the same
# 1Password `minio` root-user/root-password every S3 consumer reads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mimir-s3-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: mimir-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: '{{ .rootUser }}'
        AWS_SECRET_ACCESS_KEY: '{{ .rootPassword }}'
  data:
    - secretKey: rootUser
      remoteRef: {key: minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: minio, property: root-password}
