---
# Grafana Mimir - Scalable metrics backend
# Replaces Prometheus for long-term metrics storage with native OTLP support
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: mimir-distributed
      version: '6.1.0' # TALOS-zadf.1 (was 5.5.1). Mimir 2.14.0->3.1.2 (chart 5->6 major). Latest STABLE 6.x — 6.2.x is weekly-only, not for a metrics backend. Config validated (expand-env S3 creds intact, no removed 3.0 keys used).
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  values:
    # S3 (MinIO) credentials injected into every Mimir pod from the
    # mimir-s3-credentials Secret (ESO → 1Password `minio`). structuredConfig
    # below references ${AWS_ACCESS_KEY_ID}/${AWS_SECRET_ACCESS_KEY}; the
    # mimir-distributed chart runs all services with -config.expand-env=true by
    # default, so Mimir expands them at startup. (TALOS-tmqq)
    global:
      extraEnvFrom:
        - secretRef:
            name: mimir-s3-scoped # scoped `mimir` user (bucket-only), not root — TALOS-xgrl.12
    # Classic (non-Kafka) architecture — TALOS-iuig migration 2026-08-13.
    # Chart 6.x defaults to the experimental Kafka ingest-storage (a single-broker
    # SPOF the chart itself calls demo-only). Going classic requires ALL THREE of:
    # ingest_storage.enabled=false + kafka.enabled=false + ingester
    # push_grpc_method_enabled=true — flipping only kafka.enabled leaves the
    # ingester with NO ingest path at all (the 2026-08 SEV-2 crashloop).
    kafka:
      enabled: false
    # Single-zone deployment for homelab
    mimir:
      structuredConfig:
        # Multi-tenancy disabled for simplicity
        multitenancy_enabled: false
        # Classic ingest path (TALOS-iuig) — see kafka note above
        ingest_storage:
          enabled: false
        # Memberlist self-healing (2026-08-13 ring-wedge incident): cross-node
        # gossip dials sporadically time out during heavy-transfer windows
        # (nightly backup burst saturating the LAN), and with single-replica
        # ingester/distributor rings one unlucky burst left the ingester stuck
        # non-ACTIVE for hours ("too many unhealthy instances in the ring")
        # until a pod bounce re-registered it. rejoin_interval re-merges gossip
        # islands automatically; the raised ingester heartbeat timeout rides
        # out slow propagation instead of flapping unhealthy at the 1m default.
        memberlist:
          rejoin_interval: 1m
        # Limits
        limits:
          # Increase default limits for homelab use
          ingestion_rate: 100000
          ingestion_burst_size: 200000
          max_global_series_per_user: 1000000
          max_fetched_series_per_query: 100000
          # Ruler limits - allow more rules per group (kasa has 24)
          ruler_max_rules_per_rule_group: 50
          ruler_max_rule_groups_per_tenant: 100
          # Retention - 1 year of metrics
          compactor_blocks_retention_period: 8760h
        # Compactor
        compactor:
          data_dir: /data/compactor
          deletion_delay: 12h
          sharding_ring:
            kvstore:
              store: memberlist
        # Ingester
        ingester:
          # Classic distributor→ingester gRPC push (TALOS-iuig) — required when
          # ingest_storage is off; without it the ingester has no ingest path
          push_grpc_method_enabled: true
          ring:
            # RF=3 across 3 ingesters (2026-08-13, post-kafka-migration HA):
            # ring tolerates one unhealthy member — the recurring memberlist
            # ring-wedge class stops taking queries down. RF=2 would be worse
            # than 1 (quorum=2 of 2). ~3x ingester memory, accepted.
            replication_factor: 3
            # Ride out slow gossip propagation during transfer bursts instead
            # of flapping unhealthy at the 1m default (see memberlist note above)
            heartbeat_timeout: 3m
            kvstore:
              store: memberlist
        # Store gateway
        store_gateway:
          sharding_ring:
            replication_factor: 1
            kvstore:
              store: memberlist
        # Ruler (alerting)
        ruler:
          enable_api: true
          ring:
            kvstore:
              store: memberlist
        # Alertmanager
        alertmanager:
          data_dir: /data/alertmanager
          enable_api: true
          # Mimir 3.x serves the AM API under the external_url PATH; the chart's ruler posts to
          # /alertmanager/api/v2/alerts, so external_url MUST carry the /alertmanager prefix or every
          # alert 404s (broke on the 2.14→3.1.2 upgrade — audit SEV-1). (TALOS-zadf.1)
          external_url: http://alertmanager.talos00/alertmanager
        # Storage - S3 via MinIO
        common:
          storage:
            backend: s3
            s3:
              endpoint: minio-hl.minio.svc:9000
              bucket_name: mimir
              access_key_id: "${AWS_ACCESS_KEY_ID}"
              secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
              insecure: true
        # Blocks storage configuration
        blocks_storage:
          backend: s3
          s3:
            endpoint: minio-hl.minio.svc:9000
            bucket_name: mimir
            access_key_id: "${AWS_ACCESS_KEY_ID}"
            secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
            insecure: true
          bucket_store:
            sync_dir: /data/mimir-sync
        # Alertmanager storage - must use different prefix than blocks
        alertmanager_storage:
          backend: s3
          s3:
            endpoint: minio-hl.minio.svc:9000
            bucket_name: mimir
            access_key_id: "${AWS_ACCESS_KEY_ID}"
            secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
            insecure: true
          storage_prefix: alertmanager
        # Ruler storage - must use different prefix than blocks
        ruler_storage:
          backend: s3
          s3:
            endpoint: minio-hl.minio.svc:9000
            bucket_name: mimir
            access_key_id: "${AWS_ACCESS_KEY_ID}"
            secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
            insecure: true
          storage_prefix: ruler
          # OTLP ingestion is enabled by default in Mimir 2.9+
          # Access via /otlp/v1/metrics endpoint
    # rollout-operator gates pod eviction in this namespace via a validating
    # webhook. The chart default is failurePolicy: Fail, which means that if the
    # operator is itself unavailable, NOTHING in the monitoring namespace can be
    # evicted — cluster-wide, not just on the affected node.
    #
    # That is a deadlock, and it fired twice on 2026-08-23 during the Talos
    # upgrade (TALOS-w5fq). The operator is a SINGLE replica with no node pinning,
    # so draining whichever node it happens to occupy evicts the operator itself;
    # its Service then has no endpoints, every subsequent eviction call fails with
    #   dial tcp 10.103.87.139:443: connect: no route to host
    # and the drain never completes. It blocked two upgrade attempts on talos06
    # and had earlier stalled the talos01 drain, where it was misread as transient.
    #
    # Ignore is the correct trade here. What the webhook buys is ordered,
    # zone-aware rollouts — worth having when it works, but this is a
    # single-zone homelab, and losing that ordering during a drain is far cheaper
    # than a monitoring namespace that cannot evict anything. The guarantee is
    # nice-to-have; the deadlock is an outage.
    rollout_operator:
      webhooks:
        failurePolicy: Ignore

    # Component sizing for homelab (minimal; ingester+stateless HA'd 2026-08-13
    # after the ring-wedge incident — see structuredConfig ingester.ring note)
    # Sizes below are max_over_time / p50 over 7d to 2026-08-24, measured per
    # container across every pod in the window. [TALOS-eda0]
    ingester:
      replicas: 3
      # p50 1316-1383Mi, peak 2567-2718Mi across the three. 512Mi against a
      # ~1350Mi steady state was under-declared by a factor of ~2.6 -- 3.8 GiB
      # the scheduler could not see, and this is the same under-declaration
      # class that wedged talos03.
      # The peak is not an anomaly: the head block grows until the 2h flush, so
      # this is a sawtooth and the top of the tooth recurs every cycle. Request
      # at ~peak is correct here; requesting at p50 under-requests for half of
      # every cycle. Limit is 1.9x peak and deliberately NOT tight -- an
      # OOMKill mid-head loses unflushed samples across the replication factor.
      resources:
        requests:
          cpu: 100m
          memory: 2560Mi
        limits:
          memory: 5120Mi
      persistence:
        enabled: true
        storageClass: local-path
        size: 20Gi
      zoneAwareReplication:
        enabled: false
    distributor:
      # Soft-repel from talos03. gj3n raised the platform DaemonSets to their measured
      # requests (~800Mi/node); talos03 is the 12.8Gi node that wedged and had 34Mi free
      # afterwards, leaving traefik and alloy-node Pending there. The distributor is
      # freely movable — no PVC, no pin — and talos06/talos02-gpu each have >25Gi free.
      # Preference, not a pin: running on talos03 beats not running.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [talos03]
      replicas: 2
      # p50 79Mi but peak 1115Mi -- 14.1x. Request stays at 256Mi (3.2x p50):
      # you do not request a spiky component at its peak.
      # NO LIMIT, deliberately. TALOS-eda0 proposed 96Mi/256Mi; the measured
      # peak is 4.4x that limit, so it would OOMKill the write path on any
      # ingest burst. Distributors sit in front of the ingesters; dropping
      # them drops samples.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
    querier:
      replicas: 2
      # p50 66Mi, peak 733Mi -- 11.1x, a single large range query. Request
      # unchanged, NO LIMIT. The proposed 96Mi/192Mi limit is 3.8x below the
      # measured peak.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
    query_frontend:
      replicas: 2
      # p50 63Mi, peak 722Mi -- 11.5x. Request unchanged, NO LIMIT. Same
      # reasoning as querier; the proposed 64Mi/192Mi would OOMKill it.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
    store_gateway:
      replicas: 1
      # p50 110Mi, peak 448Mi -- 4.1x on index-header load. NO LIMIT: a limit
      # near p50 kills it mid-load and it re-reads the whole index header.
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      zoneAwareReplication:
        enabled: false
    compactor:
      replicas: 1
      # p50 61Mi, peak 616Mi -- 10.1x. It idles near zero and spikes hard
      # during compaction. NO LIMIT: an OOMKill mid-compaction leaves partial
      # blocks and re-runs the whole compaction, strictly worse than the burst.
      resources:
        requests:
          cpu: 50m
          memory: 320Mi
      persistence:
        enabled: true
        storageClass: local-path
        size: 20Gi
    # Disable components not needed for homelab
    ruler:
      enabled: true
      replicas: 1
      # p50 282Mi, peak 329Mi -- flat, it evaluates the same rule set on a
      # fixed interval. 128Mi was under-declared by 2.2x against steady state.
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 640Mi
    alertmanager:
      enabled: true
      replicas: 1
      # p50 55Mi, peak 60Mi -- flat.
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 192Mi
      persistence:
        enabled: true
        storageClass: local-path
        size: 5Gi
    # Disable built-in minio - using external MinIO instance
    minio:
      enabled: false
    # Nginx gateway
    # DEAD BLOCK — mimir-distributed 6.1.0 has no top-level `nginx` key, so
    # nothing under here is read. Verified 2026-08-24 against the live
    # ConfigMap: mimir-gateway-nginx still carries
    #   resolver kube-dns.kube-system.svc.cluster.local.;
    # which is precisely the value the comment below says does not work, and
    # the /prometheus/-/healthy snippet is absent from it entirely. The
    # resources block is dead too — that one is fixed under `gateway:` below.
    # Left in place rather than deleted because moving the resolver and the
    # serverSnippet to gateway.nginx.config changes live gateway behaviour
    # for the whole metrics write path, which is a separate decision.
    nginx:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
      nginxConfig:
        # Fix DNS resolution - use kube-dns IP instead of hostname
        # Default uses "kube-dns.kube-system.svc.cluster.local." which doesn't work
        resolver: "10.96.0.10"
        # MinIO Console checks /-/healthy to validate Prometheus URL
        # See: https://github.com/minio/console/issues/2829
        serverSnippet: |
          location = /prometheus/-/healthy {
            return 200 'Mimir is healthy';
            add_header Content-Type text/plain;
          }
    # Monitoring
    metaMonitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
    # Gateway for external access
    gateway:
      enabledNonEnterprise: true
      # Had no request and no limit. The 64Mi under the `nginx:` block above
      # never applied — mimir-distributed 6.1.0 has no top-level `nginx` key,
      # the gateway is configured entirely under `gateway:`.
      # Measured 24h to 2026-08-24: p50 13Mi, peak 19Mi (1.4x). BURSTABLE.
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 64Mi
