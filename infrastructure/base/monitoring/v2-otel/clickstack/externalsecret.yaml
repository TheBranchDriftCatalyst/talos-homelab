---
# HyperDX ingestion API key (TALOS-4clh). NOT a SaaS/licence key — HyperDX
# mints this itself when the first team is created and stores it in our own
# MongoDB; it authenticates OTLP writes into the ClickStack collector so
# arbitrary pods can't dump into the log store.
#
# Consumed by Alloy's otlphttp exporter as an `authorization` header (see
# ../alloy/helmrelease.yaml). Rotating it = update the 1Password field; ESO
# re-syncs and Alloy re-reads on its next config load.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hyperdx-ingestion
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hyperdx-ingestion
    creationPolicy: Owner
  data:
    - secretKey: ingestion_api_key
      remoteRef:
        key: hyperdx
        property: ingestion_api_key
