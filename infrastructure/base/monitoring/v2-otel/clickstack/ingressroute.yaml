---
# HyperDX UI at http://hyperdx.talos00 (TALOS-cjny). LAN-only via the `web`
# entrypoint, HyperDX's own auth for now — Authentik forward-auth is the
# follow-up (house SSO pattern, see authentik-sso-patterns).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hyperdx
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "HyperDX"
    gethomepage.dev/description: "ClickStack log analytics (SQL over logs)"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/weight: "15"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`hyperdx.talos00`)
      kind: Rule
      services:
        - name: clickstack-app
          port: 3000
