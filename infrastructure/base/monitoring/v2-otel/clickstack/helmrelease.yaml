---
# ClickStack / HyperDX (TALOS-cjny) — dedicated log-analytics UI + OTel
# collector. chart 1.1.1 / app 2.8.0 (latest 2026-08).
#
# Deviations from chart defaults, all deliberate:
#  - clickhouse.enabled=false  -> we use the Altinity-operator CHI
#    (clickhouse.yaml) instead of the chart's unmanaged StatefulSet. Keeps
#    ClickHouse under the same operator/CRD pattern as plausible.
#  - mongodb.image bumped 5.0.32 -> 8.3.8. Mongo holds HyperDX APP STATE only
#    (users/dashboards/saved searches) — no log data — so it is rebuildable
#    if the major jump misbehaves; revert to mongo:5.0.32-focal if HyperDX
#    fails to connect (documented on TALOS-cjny).
#  - usageStatsEnabled=false (homelab, no phone-home).
#  - chart ingress left off: exposure is our Traefik IngressRoute
#    (ingressroute.yaml -> hyperdx.talos00).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
spec:
  interval: 30m
  # 20m: the stack has a slow, interdependent startup — mongo init, then the
  # app, then the otel-collector's OpAMP handshake back to the app. The 5m
  # default expired mid-boot and each retry TERMINATED pods that were seconds
  # from ready (observed 2026-08-15), looking like a crashloop that wasn't.
  timeout: 20m
  chart:
    spec:
      chart: clickstack
      version: '1.1.1'
      sourceRef:
        kind: HelmRepository
        name: hyperdx
        namespace: monitoring
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 2
      remediateLastFailure: false # don't tear down a stack that's still converging
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    cleanupOnFail: true
  values:
    global:
      storageClassName: local-path

    # Bundled ClickHouse OFF — the Altinity CHI is the store.
    #
    # config.users still matters with enabled:false — the chart templates the
    # COLLECTOR's CLICKHOUSE_USER/PASSWORD and the app's connection from these
    # keys. Chart defaults invent users (otelcollector/app) that only its own
    # bundled StatefulSet would create; against our CHI they'd fail auth and
    # the collector never becomes ready (observed 2026-08-15). Point them at
    # `default` with an empty password, matching the plausible CHI precedent
    # (ClusterIP-only, no ingress on 8123/9000) — no invented secrets in git.
    clickhouse:
      enabled: false
      config:
        users:
          otelUserName: "default"
          otelUserPassword: ""
          appUserPassword: ""

    # App state only (dashboards/users/saved searches), not logs.
    mongodb:
      enabled: true
      image: "mongo:8.3.8"

    # Collector writes OTLP -> ClickHouse over the native protocol.
    otel:
      clickhouseEndpoint: "tcp://clickhouse-hyperdx-logs.monitoring.svc:9000"

    hyperdx:
      # The app container runs THREE node processes (API :8000, Next.js UI
      # :3000, alert-task). The chart ships no limits; under node memory
      # pressure the container was OOMKilled (exit 137) and came back with the
      # UI process missing while readiness — which only probes the API port —
      # still reported 1/1. Explicit headroom keeps the UI alive. (2026-08-15)
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      appUrl: "http://hyperdx.talos00"
      # Override the chart's default (which appends :3000) — Traefik serves
      # this on :80, so the browser-facing URL carries no port.
      frontendUrl: "http://hyperdx.talos00"
      usageStatsEnabled: false
      # PRE-PROVISIONED SOURCES (TALOS-cjny) — so the UI needs no click-ops.
      # HyperDX auto-provisions these when a team has NO sources yet, which
      # means changes here only apply to a FRESH team: to re-apply, drop the
      # sources from Mongo and restart the app (documented on the ticket).
      #
      # Derived from the chart defaults with two deliberate changes:
      #  1. the log source's trace/span id expressions read the JSON BODY, not
      #     the native OTLP columns — our pod logs are stdout-scraped via
      #     loki.source.kubernetes, which cannot populate TraceId/SpanId, while
      #     boomtime stamps trace_id/span_id into its slog JSON (TALOS-kvg1).
      #     This is what makes the log -> trace pivot actually work.
      #  2. the metric + session sources are dropped: Mimir owns metrics and
      #     nothing writes hyperdx_sessions, so they'd be dead entries.
      # Log<->trace correlation (traceSourceId/logSourceId) is already wired.
      defaultSources: |
        [
          {
            "from": {
              "databaseName": "default",
              "tableName": "otel_logs"
            },
            "kind": "log",
            "timestampValueExpression": "TimestampTime",
            "name": "Logs",
            "displayedTimestampValueExpression": "Timestamp",
            "implicitColumnExpression": "Body",
            "serviceNameExpression": "ServiceName",
            "bodyExpression": "Body",
            "eventAttributesExpression": "LogAttributes",
            "resourceAttributesExpression": "ResourceAttributes",
            "defaultTableSelectExpression": "Timestamp,ServiceName,SeverityText,Body",
            "severityTextExpression": "SeverityText",
            "traceIdExpression": "JSONExtractString(Body, 'trace_id')",
            "spanIdExpression": "JSONExtractString(Body, 'span_id')",
            "connection": "Local ClickHouse",
            "traceSourceId": "Traces",
            "sessionSourceId": "Sessions",
            "metricSourceId": "Metrics"
          },
          {
            "from": {
              "databaseName": "default",
              "tableName": "otel_traces"
            },
            "kind": "trace",
            "timestampValueExpression": "Timestamp",
            "name": "Traces",
            "displayedTimestampValueExpression": "Timestamp",
            "implicitColumnExpression": "SpanName",
            "serviceNameExpression": "ServiceName",
            "bodyExpression": "SpanName",
            "eventAttributesExpression": "SpanAttributes",
            "resourceAttributesExpression": "ResourceAttributes",
            "defaultTableSelectExpression": "Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName",
            "traceIdExpression": "TraceId",
            "spanIdExpression": "SpanId",
            "durationExpression": "Duration",
            "durationPrecision": 9,
            "parentSpanIdExpression": "ParentSpanId",
            "spanNameExpression": "SpanName",
            "spanKindExpression": "SpanKind",
            "statusCodeExpression": "StatusCode",
            "statusMessageExpression": "StatusMessage",
            "connection": "Local ClickHouse",
            "logSourceId": "Logs",
            "sessionSourceId": "Sessions",
            "metricSourceId": "Metrics"
          }
        ]

      # Point the UI at the operator-managed CHI (default user, no password —
      # ClusterIP-only, same posture as the plausible CHI).
      defaultConnections: |
        [
          {
            "name": "ClickHouse (hyperdx-logs)",
            "host": "http://clickhouse-hyperdx-logs.monitoring.svc:8123",
            "port": 8123,
            "username": "default",
            "password": ""
          }
        ]
