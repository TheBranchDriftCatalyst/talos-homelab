---
# ClickHouse for ClickStack/HyperDX log analytics (TALOS-cjny) — provisioned by
# the Altinity operator, same pattern as crossplane-demo/plausible. This is the
# LOG STORE half of the two-tier logging design:
#   Loki       = cheap ops tail (recent debugging, 7-14d) — UNCHANGED
#   ClickHouse = dedicated analytics store (SQL over logs, long retention)
# Alloy dual-writes to both (see ../alloy/helmrelease.yaml).
#
# The operator creates ClusterIP Service `clickhouse-hyperdx-logs`
# (8123 http / 9000 native). The chart's BUNDLED clickhouse is disabled — this
# CHI is the backend for both the OTel collector (writes) and HyperDX (reads).
#
# Auth: `default` user, no password, cluster-internal only — matches the
# existing plausible CHI precedent (LAN/ClusterIP, no ingress on 8123/9000).
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: hyperdx-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: clickhouse-hyperdx-logs
    app.kubernetes.io/part-of: clickstack
    app.kubernetes.io/component: log-store
spec:
  configuration:
    clusters:
      - name: logs
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      default/networks/ip:
        - "::/0"
      default/access_management: "1"
    files:
      # Keep ClickHouse's OWN logs quiet. Critical here: Alloy ships container
      # logs INTO this ClickHouse, so a chatty CH would recursively amplify its
      # own log volume. warning-level + dropped system logs breaks that loop.
      config.d/logs.xml: |
        <clickhouse>
            <logger>
                <level>warning</level>
                <console>true</console>
            </logger>
            <metric_log remove="remove" />
            <asynchronous_metric_log remove="remove" />
            <query_thread_log remove="remove" />
            <text_log remove="remove" />
            <trace_log remove="remove" />
            <session_log remove="remove" />
            <part_log remove="remove" />
        </clickhouse>
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume
      podTemplate: clickhouse
  templates:
    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 50Gi
    podTemplates:
      - name: clickhouse
        spec:
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: clickhouse
              # Latest stable line (2026-08). Chart default was 25.7 — the
              # operator-managed CHI is the source of truth, not the chart.
              image: clickhouse/clickhouse-server:26.7-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 200m, memory: 1Gi}
                limits: {memory: 4Gi}
