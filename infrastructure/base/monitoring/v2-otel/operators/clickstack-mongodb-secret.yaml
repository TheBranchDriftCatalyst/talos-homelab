---
# ClickStack MongoDB credential — deliberately in the OPERATORS layer, not with
# the rest of clickstack.
#
# WHY HERE: the monitoring Kustomization substitutes ${CLICKSTACK_MONGO_URI} into
# the clickstack HelmRelease via postBuild. postBuild substitution happens BEFORE
# apply, so the secret must already exist when monitoring renders. If this lived
# in ./v2-otel alongside the HelmRelease it would deadlock permanently: monitoring
# cannot render without the secret, and the secret is never created because
# monitoring cannot render. Same failure class as the atomic-dry-run deadlock that
# forced the AWS three-layer split (57766e8b).
#
# monitoring-v2-operators applies ./v2-otel/operators and monitoring dependsOn it,
# so ordering is guaranteed.
# Self-provisioning password -- no human step, nothing secret in git.
#
# ROTATION CAVEAT (see the eso-generator-rotation gotcha): generator-backed
# secrets regenerate on ANY spec change to this object, and refreshInterval "0"
# does not prevent it. If it regenerates, the operator updates the Mongo user but
# HyperDX keeps the old URI until the clickstack Kustomization re-renders. Do not
# edit this generator's spec casually; if you must, expect to reconcile monitoring
# afterwards so the substituted URI catches up.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: clickstack-mongodb-password
  namespace: monitoring
spec:
  length: 32
  digits: 8
  symbols: 0          # no symbols: this value is embedded in a mongodb:// URI
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
# Key name MUST be `password` -- MongoDBCommunity's passwordSecretRef reads that key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-mongodb-password
  namespace: monitoring
spec:
  refreshInterval: "0"
  target:
    name: clickstack-mongodb-password
    template:
      engineVersion: v2
      metadata:
        annotations:
          # Mirrored into flux-system because Kustomization.postBuild.substituteFrom
          # resolves the Secret in the KUSTOMIZATION's namespace (flux-system), not
          # the namespace the workload lives in. Without this the monitoring
          # Kustomization fails with `secrets "clickstack-mongodb-password" not
          # found` even though the secret plainly exists in monitoring.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "flux-system"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "flux-system"
      data:
        password: "{{ .password }}"
        # Full URI, templated from the SAME generated value so the two can never
        # drift. Flux substitutes this into the HelmRelease via postBuild, which
        # keeps the credential out of git.
        CLICKSTACK_MONGO_URI: "mongodb://hyperdx:{{ .password }}@clickstack-mongodb-svc.monitoring.svc.cluster.local:27017/hyperdx?authSource=hyperdx&replicaSet=clickstack-mongodb"
        CLICKSTACK_MONGO_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: clickstack-mongodb-password
