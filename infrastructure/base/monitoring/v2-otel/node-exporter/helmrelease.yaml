---
# Node Exporter - Hardware and OS metrics from cluster nodes
# Scraped by Alloy, stored in Mimir
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-node-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-node-exporter
      version: '4.56.1'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  values:
    # DaemonSet runs on all nodes
    fullnameOverride: prometheus-node-exporter

    # Pod annotations for Alloy discovery
    # Alloy looks for app.kubernetes.io/name: prometheus-node-exporter
    service:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9100'

    # Resources for homelab
    # Measured 7d to 2026-08-24: p50 30Mi, peak 37Mi. 32Mi sat just under
    # peak. BURSTABLE. Folded in from TALOS-eda0 for the same DaemonSet
    # reason as alloy-node above. (TALOS-gj3n / TALOS-eda0)
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi

    # Tolerations to run on all nodes including control plane
    tolerations:
      - effect: NoSchedule
        operator: Exists

    # Host network and PID for accurate metrics
    hostNetwork: true
    hostPID: true
    hostRootFsMount:
      enabled: true
      mountPropagation: HostToContainer

    # RAPL power metrics — node power draw in watts
    #
    # The `rapl` collector is ENABLED BY DEFAULT in node-exporter, so there is
    # no --collector.rapl flag to add. It was already running on every scrape
    # and failing silently:
    #   node_scrape_collector_success{collector="rapl"} 0
    #
    # The cause is permissions, not configuration. /sys/devices/virtual/powercap/
    # */energy_uj is mode 0400 root-only (the PLATYPUS side-channel mitigation,
    # CVE-2020-8694) and the exporter runs as uid 65534. Kubernetes cannot grant
    # ambient capabilities, so adding DAC_READ_SEARCH lands it in CapBnd but not
    # CapEff and does NOT work — the only real options are running the exporter
    # as root or relaxing the file mode. This chart-native init container does
    # the latter: chown root:65534 + chmod g+r on energy_uj only. The files end
    # up group-readable rather than world-readable, and the long-running,
    # host-network exporter stays unprivileged.
    #
    # Image is pinned to the same node-exporter image the DaemonSet already runs
    # (it is busybox-based and has find/chown/chmod) instead of the chart default
    # quay.io/prometheus/busybox:latest, which would add a new :latest image to
    # the fleet — node-dependent under IfNotPresent, and unparseable by
    # version-checker (TALOS-zpoa). Keep this tag in step with the chart's
    # appVersion when bumping the chart.
    permissionInitContainer:
      image:
        registry: quay.io
        repository: prometheus/node-exporter
        tag: v1.12.1
        pullPolicy: IfNotPresent
      fixes:
        rapl: true

    # Collectors configuration
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
