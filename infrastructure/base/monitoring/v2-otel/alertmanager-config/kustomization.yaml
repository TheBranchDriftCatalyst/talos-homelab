---
# alertmanager-config — pushes tenant config into Mimir's multi-tenant
# Alertmanager for the 'anonymous' tenant.
#
# Wiring:
#   PrometheusRule CRs (baseline-alerts/)
#     → Alloy mimir.rules.kubernetes sync → Mimir Ruler
#     → alerts fire against this tenant config
#     → routed to the alertmanager-discord bridge (normal alerts) or the
#       external heartbeat webhook (PipelineHeartbeat watchdog)
#
# Discord delivery (TALOS-2pz):
#   Mimir Alertmanager posts NATIVE webhook JSON to the in-cluster
#   `alertmanager-discord` bridge (discord-bridge.yaml), which translates it
#   to a real Discord embed. This replaced the slack_configs -> Discord /slack
#   shim that 400'd on Slack attachment/color fields (5/5 notifications lost).
#   The bridge reads the `discord-webhook` Secret (key `address`, RAW webhook)
#   directly — reflected into this namespace from flux-system by
#   emberstack/reflector (source ExternalSecret:
#   infrastructure/base/flux-notifications/discord-webhook-externalsecret.yaml).
#
# External dead-man's-switch (TALOS-2pz):
#   The `watchdog-heartbeat` receiver posts to $HEARTBEAT_URL. Until you arm
#   it, the pusher defaults $HEARTBEAT_URL to an inert .invalid placeholder
#   (config stays valid, delivery no-ops). TO ARM external detection:
#     1. Create a healthchecks.io check (or an uptime-kuma push monitor).
#        Copy the ping URL.
#     2. Provide it as Secret `alertmanager-heartbeat` (key `url`) in this
#        namespace — either add it to 1Password + an ExternalSecret here, or
#        `kubectl create secret generic alertmanager-heartbeat -n monitoring
#        --from-literal=url=https://hc-ping.com/<uuid>`.
#        The cronjob already references it (optional secretKeyRef).
#   Result: the PipelineHeartbeat alert pings every 1 min. If pings stop for
#   the check's configured grace, healthchecks.io/uptime-kuma pages you — the
#   observability stack itself has failed and can no longer alert on its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - rbac.yaml
  - config-template.yaml
  - cronjob.yaml
  - discord-bridge.yaml
