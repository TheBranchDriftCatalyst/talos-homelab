---
# Alertmanager → Discord bridge (native, content-based)
#
# Alertmanager's webhook_configs POST their own JSON schema, which Discord does
# not understand. This tiny stdlib-only translator receives that webhook and
# POSTs a plain Discord `content` message (the most robust Discord format —
# verified 204, no embed-validation pitfalls). It REPLACES both:
#   - the old slack_configs → Discord `/slack` shim (400'd on attachments), and
#   - the rogerrum/alertmanager-discord embed bridge (emitted invalid embeds:
#     `{"embeds": ["0"]}` + rate-limited itself).
# Discord is the only alerting target — there is no slack path anymore.
#
# Reads the raw Discord webhook URL from the `discord-webhook` Secret (key
# `address`). No pip deps (Python stdlib only), so no registry/rate-limit risk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-discord-bridge
  namespace: monitoring
data:
  bridge.py: |
    import http.server, json, os, urllib.request
    WEBHOOK = os.environ["DISCORD_WEBHOOK"].strip()

    def post_discord(content):
        body = json.dumps({"content": content[:1900]}).encode()
        req = urllib.request.Request(WEBHOOK, data=body, headers={
            "Content-Type": "application/json",
            # Discord/Cloudflare 403s the default 'Python-urllib' UA — must set one.
            "User-Agent": "Catalyst-Alertmanager-Discord/1.0",
        })
        with urllib.request.urlopen(req, timeout=10) as r:
            return r.status

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            # health/readiness probe
            self.send_response(200); self.end_headers(); self.wfile.write(b"ok")

        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0) or 0)
            try:
                data = json.loads(self.rfile.read(n) or b"{}")
            except Exception:
                data = {}
            alerts = data.get("alerts", []) or [{}]
            status = (data.get("status") or "firing").lower()
            emoji = "\U0001F534" if status == "firing" else "✅"  # red / check
            for a in alerts:
                lbl = a.get("labels", {}) or {}
                ann = a.get("annotations", {}) or {}
                name = lbl.get("alertname", "alert")
                sev = lbl.get("severity", "")
                ns = lbl.get("namespace", "")
                msg = ann.get("summary") or ann.get("description") or name
                line = "{} **[{}] {}**\n{}".format(emoji, status.upper(), name, msg)
                meta = []
                if sev:
                    meta.append("severity: `{}`".format(sev))
                if ns:
                    meta.append("ns: `{}`".format(ns))
                if meta:
                    line += "\n" + " · ".join(meta)
                try:
                    post_discord(line)
                except Exception as e:
                    print("discord post failed:", e, flush=True)
            self.send_response(200); self.end_headers(); self.wfile.write(b"ok")

        def log_message(self, *a):  # quiet
            return

    print("alertmanager-discord bridge listening on :9094", flush=True)
    http.server.HTTPServer(("0.0.0.0", 9094), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord
  namespace: monitoring
  labels:
    app: alertmanager-discord
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-discord
  template:
    metadata:
      labels:
        app: alertmanager-discord
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: python:3.12-alpine
          command: ["python", "/app/bridge.py"]
          env:
            # NOTE: the discord-webhook Secret currently points at the "The Lair"
            # Discord server's #talos00 channel. It needs to be MOVED to the
            # catalyst-dev Discord channel — update the source ExternalSecret /
            # 1Password item (discord-webhook, key `address`) with the new
            # channel's webhook URL, then reconcile. (TODO: migrate channel)
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: discord-webhook
                  key: address
          ports:
            - containerPort: 9094
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 9094
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: alertmanager-discord-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-discord
  namespace: monitoring
  labels:
    app: alertmanager-discord
spec:
  selector:
    app: alertmanager-discord
  ports:
    - name: http
      port: 9094
      targetPort: 9094
