---
# Alertmanager config template for the Mimir Alertmanager 'anonymous'
# tenant. Pushed by the alertmanager-config-pusher CronJob. Discord is the
# only alerting target; the webhook URL lives in the alertmanager-discord
# bridge (discord-bridge.yaml), so nothing is substituted into this template.
#
# Two routes:
#   1. Watchdog → dedicated receiver for future external observer wiring
#      (currently a null receiver; see external-observer TODO in kustomization.yaml).
#      This is the PipelineHeartbeat alert; when routed to an out-of-band
#      service like healthchecks.io, absence of the ping means the
#      observability stack itself is broken.
#   2. Everything else → Discord webhook via the shared flux-discord
#      URL.
#
# Grouping: 5m group_wait / 5m group_interval / 4h repeat_interval —
# suitable for a homelab where duplicate pages are worse than latency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config-template
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-config-template
    app.kubernetes.io/component: alertmanager-config
data:
  alertmanager.tmpl.yaml: |
    global:
      resolve_timeout: 5m

    route:
      # Top-level route: fan out by category then by severity.
      receiver: discord-default
      group_by: ['alertname', 'severity', 'category']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog — dead-man's switch. Routed to an EXTERNAL heartbeat
        # (healthchecks.io / uptime-kuma ping URL) via webhook_configs, so
        # the absence of pings is detectable OUT OF BAND — if the whole
        # observability stack (Alloy->Mimir->Alertmanager) is dead, no ping
        # arrives and the external monitor pages you. See $HEARTBEAT_URL
        # wiring in cronjob.yaml. (TALOS-2pz)
        - matchers:
            - alertname="PipelineHeartbeat"
          receiver: watchdog-heartbeat
          # Fast heartbeat cadence; external observer sees a steady stream.
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1m
          continue: false

        # Critical alerts get their own group so pages aren't merged
        # with warnings on the same 5m group_interval window.
        - matchers:
            - severity="critical"
          receiver: discord-critical
          group_wait: 15s
          repeat_interval: 1h
          continue: false

    receivers:
      # Discord via the in-cluster alertmanager-discord bridge (discord-bridge.yaml):
      # Alertmanager posts its native webhook JSON to the bridge, which sends a
      # Discord message. The bridge holds the webhook URL (discord-webhook Secret).
      # Discord is the only target — there is no slack path. (TALOS-2pz)
      - name: discord-default
        webhook_configs:
          - url: "http://alertmanager-discord.monitoring.svc.cluster.local:9094/"
            send_resolved: true

      - name: discord-critical
        webhook_configs:
          - url: "http://alertmanager-discord.monitoring.svc.cluster.local:9094/"
            send_resolved: true

      # Watchdog receiver — external dead-man's-switch heartbeat. $HEARTBEAT_URL
      # is substituted from the `alertmanager-heartbeat` Secret (key `url`) by
      # the pusher CronJob; until that Secret exists it defaults to an inert
      # RFC-2606 .invalid placeholder so the config stays VALID (Alertmanager
      # loads it; delivery simply no-ops). Set the Secret to a healthchecks.io /
      # uptime-kuma ping URL to arm external detection. (TALOS-2pz)
      - name: watchdog-heartbeat
        webhook_configs:
          - url: "$HEARTBEAT_URL"
            send_resolved: false

    # Inhibit rules — a critical alert on a component silences the
    # matching warning-severity alert on the same component so pages
    # aren't duplicated.
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'component', 'category']
