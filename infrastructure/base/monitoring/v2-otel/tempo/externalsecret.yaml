---
# Tempo S3 (MinIO) credentials (TALOS-tmqq). Injected into the tempo pod via
# tempo.extraEnvFrom; the tempo config (both the chart values block and the
# postRenderer-patched ConfigMap) references ${AWS_ACCESS_KEY_ID} /
# ${AWS_SECRET_ACCESS_KEY}, expanded at runtime because tempo.extraArgs adds
# -config.expand-env=true. Sourced from the same 1Password `minio`
# root-user/root-password every S3 consumer reads.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tempo-s3-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tempo-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: '{{ .rootUser }}'
        AWS_SECRET_ACCESS_KEY: '{{ .rootPassword }}'
  data:
    - secretKey: rootUser
      remoteRef: {key: minio, property: root-user}
    - secretKey: rootPassword
      remoteRef: {key: minio, property: root-password}
