---
# Grafana Alloy - Unified telemetry collector
# Replaces: OTEL Collector, Fluent Bit, Grafana Agent
# Native support for Loki, Mimir, Prometheus, OTLP
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: '1.11.1'
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  values:
    alloy:
      # HyperDX/ClickStack ingestion key (TALOS-4clh) — ESO-managed secret,
      # read in the config below via sys.env(). Never inlined in git.
      extraEnv:
        - name: HYPERDX_INGESTION_KEY
          valueFrom:
            secretKeyRef:
              name: hyperdx-ingestion
              key: ingestion_api_key
        # Go's default GOGC=100 lets the heap grow to 2x live before it
        # collects, and RSS follows the GC target, not the live set.
        # Measured 2026-08-24: live heap 2584Mi, next_gc 5266Mi, RSS 5666Mi
        # — the GC target IS the RSS. GOMEMLIMIT is a soft ceiling on total
        # Go runtime memory: the collector runs more often instead of
        # letting RSS double. Go never OOMs itself on it.
        # If alloy's live heap ever approaches this, GC thrashes (CPU burn,
        # not a crash) — that is the signal to cut cardinality again, and
        # the 8Gi limit below is the backstop for a genuine runaway.
        - name: GOMEMLIMIT
          value: "3750MiB"
      # Resources - Alloy does heavy Prometheus scraping + OTEL collection
      # 730,891 remote-write WAL series at ~3.7KiB of live heap each is
      # 2.6Gi of genuine working set; the old 1Gi request was 4x under and
      # invisible to the scheduler. BURSTABLE: GOMEMLIMIT is the operative
      # ceiling, the hard limit only fires if GOMEMLIMIT has already failed.
      resources:
        requests:
          cpu: 200m
          memory: 4Gi
        limits:
          memory: 8Gi
      configMap:
        create: true
        content: |
          // ============================================
          // OTLP Receivers - Accept telemetry from apps
          // ============================================
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }

            output {
              metrics = [otelcol.processor.batch.default.input]
              logs    = [otelcol.processor.batch.default.input]
              traces  = [otelcol.processor.batch.default.input]
            }
          }

          // ============================================
          // Grafana Faro receiver - browser RUM (TALOS-xfjl.10)
          // ============================================
          // Ingests web-vitals measurements, errors and events - and optionally
          // browser traces - from the catalyst nav/RUM bundles injected into the
          // themed apps.
          //
          // REACHED SAME-ORIGIN, not on a hostname of its own. A companion
          // IngressRoute publishes PathPrefix(/catalyst-rum/) on EVERY host,
          // exactly like themepark's /catalyst/ asset route. That one decision
          // removes four separate problem classes at once:
          //   - no CORS preflight to get wrong across 14+ app origins
          //   - no CSP connect-src edit per app; 'self' already covers it, which
          //     matters because qbittorrent sends bare default-src 'self'
          //   - no mixed content on plex/jellyfin, which are served plain HTTP
          //   - no new DNS name or certificate SAN (and *.talos00 is a
          //     single-label parent, which Apple clients reject outright)
          // The origin list below is therefore belt-and-braces: browsers still
          // send Origin on a POST, so the receiver must recognise it.
          //
          // WHY logs go straight to loki.write and NOT via otelcol.processor.batch:
          // faro.receiver's output.logs is typed loki.LogsReceiver, not an otelcol
          // consumer, so it cannot feed the otelcol pipeline directly. Forwarding
          // to otelcol.receiver.loki.clickstack.receiver alongside it preserves the
          // dual-write this cluster does for every other log source (TALOS-cjny) -
          // that component is itself a loki.LogsReceiver, so it is type-compatible.
          //
          // Traces DO go through the batch processor, so browser spans reach
          // ClickStack like every other trace and can be correlated with the
          // Traefik spans from TALOS-xfjl.9.
          faro.receiver "browser" {
            server {
              listen_address = "0.0.0.0"
              listen_port    = 12347

              // NO cors_allowed_origins, deliberately. PROBED on the live
              // receiver 2026-09-25: the allowlist does NOT gate the POST.
              // /collect returned 202 for an allowlisted origin, a
              // non-allowlisted one, AND a request with no Origin header at
              // all; the list only decides whether the preflight grants
              // Access-Control-Allow-Origin. Since this is reached
              // same-origin (see above) the browser never preflights, so the
              // list would protect nothing while silently rotting every time
              // an app is added - and a stale entry fails CLOSED in the
              // browser with no server-side signal, which is exactly the
              // silent-failure class this workstream exists to remove.
              //
              // Access control is therefore the IngressRoute's lan-only
              // middleware plus the rate limit below, not CORS.

              // Default is 5MiB. A web-vitals batch is well under 1KiB; the
              // ceiling only matters for stack traces and resolved sourcemaps.
              max_allowed_payload_size = "2MiB"

              rate_limiting {
                enabled    = true
                rate       = 100
                burst_size = 200
              }
            }

            output {
              // Logs go through loki.process.faro first, NOT straight to
              // loki.write -- see that component for why.
              logs   = [loki.process.faro.receiver]
              traces = [otelcol.processor.batch.default.input]
            }
          }

          // Promote two Faro fields to Loki labels.
          //
          // WHY THIS EXISTS. faro.receiver emits a logfmt line and attaches NO
          // stream labels, so every browser payload from every app landed in
          // ONE stream, {service_name="unknown_service"}, shared with anything
          // else lacking a service name. Verified on the live cluster before
          // this component existed: finding a single known beacon required
          // {service_name="unknown_service"} |= "faroprobe" and scanned 824
          // lines to return 1. Per-app FCP/LCP panels are not buildable on
          // that, and query cost is driven by the stream selector, so a line
          // filter does not help.
          //
          // CARDINALITY IS DELIBERATELY BOUNDED. Only two fields are promoted:
          //   app  <- app_name, bounded by the POC app list
          //   kind <- one of log | measurement | event | exception
          // That is a small, fixed number of streams. Do NOT promote
          // session_id, user_id, url or anything else per-visitor -- that is
          // unbounded and is how a Loki install falls over.
          loki.process "faro" {
            forward_to = [
              loki.write.default.receiver,
              otelcol.receiver.loki.clickstack.receiver,
            ]

            stage.logfmt {
              mapping = {
                "app_name" = "",
                "kind"     = "",
              }
            }

            stage.labels {
              values = {
                app  = "app_name",
                kind = "kind",
              }
            }
          }

          // ============================================
          // Processors
          // ============================================
          otelcol.processor.batch "default" {
            timeout = "10s"
            send_batch_size = 1024

            output {
              metrics = [otelcol.exporter.otlphttp.mimir.input]
              // Logs are still DUAL-WRITTEN (TALOS-cjny/xam9): Loki keeps its
              // pipeline unchanged while ClickStack gets a copy for SQL
              // analytics and log<->trace correlation (otel_logs carries
              // TraceId/SpanId). Loki goes in TALOS-suxd.7.
              //
              // TRACES ARE NO LONGER DUAL-WRITTEN: Tempo was deleted in
              // TALOS-suxd.5, so ClickStack is the only trace sink. Removed
              // together with the otelcol.exporter.otlp "tempo" component, because a
              // reference to a component that no longer exists is a whole-config
              // rejection, not a warning -- and Alloy then refuses to start,
              // taking metrics and logs down with it.
              logs    = [
                otelcol.exporter.loki.default.input,
                otelcol.exporter.otlphttp.clickstack.input,
              ]
              traces  = [
                otelcol.exporter.otlphttp.clickstack.input,
              ]
            }
          }

          // ============================================
          // Exporters
          // ============================================

          // Logs -> Loki
          otelcol.exporter.loki "default" {
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }

          // ============================================
          // ClickStack / HyperDX (dual-write) — TALOS-cjny / TALOS-xam9
          // ============================================
          // Pod logs arrive as LOKI entries, so they need conversion to OTLP
          // first; OTLP-native logs/traces go straight to the exporter from
          // otelcol.processor.batch.default.
          otelcol.receiver.loki "clickstack" {
            output {
              logs = [otelcol.processor.groupbyattrs.clickstack.input]
            }
          }

          // ---------------------------------------------------------------
          // Give ClickStack a real OTel Resource. TALOS-7e6j.
          //
          // THE PROBLEM: everything except HyperDX's own app reaches
          // ClickStack through otelcol.receiver.loki, which lands Loki stream
          // labels as LOG-RECORD attributes and sets NO resource attributes at
          // all. The ClickHouse exporter fills the ServiceName column from the
          // resource attribute `service.name`, so 99.65% of rows (275,468 of
          // 276,446 in one hour) arrived with ServiceName = '' AND an empty
          // ResourceAttributes map. The only service that ever showed up in
          // HyperDX's ServiceName facet was hdx-oss-api -- the HyperDX app
          // itself, because it speaks native OTLP with a real SDK.
          //
          // That is not only cosmetic: ServiceName is the LEADING column of
          // otel_logs' ORDER BY, so an empty value collapses the primary index
          // to time-only, and HyperDX's Kubernetes views have no k8s.* resource
          // attributes to filter on.
          //
          // WHY groupbyattrs AND NOT a transform alone: in OTTL's `log`
          // context, `resource` is the ResourceLogs' resource, which is SHARED
          // by every record under it. Writing resource.attributes per record
          // would race -- the last record processed would win for the whole
          // group. groupbyattrs is the component built for this: it regroups
          // records so each distinct label set gets its OWN ResourceLogs, then
          // the rename below is safe because it runs once per resource.
          //
          // WHY THE KEYS ARE COPIED BACK DOWN below: groupbyattrs MOVES, it
          // does not copy. Left alone it would delete LogAttributes['namespace']
          // and friends -- which would silently break all 44 ported dashboard
          // panels, the abuseipdb reporter's SQL, and the Logs source's own
          // serviceNameExpression, none of which would error; they would just
          // return nothing.
          otelcol.processor.groupbyattrs "clickstack" {
            keys = ["cluster", "namespace", "pod", "container", "node", "app", "app_kubernetes_io_name", "job"]

            output {
              logs = [otelcol.processor.transform.clickstack.input]
            }
          }

          otelcol.processor.transform "clickstack" {
            // ignore, not propagate: a malformed record must never take down
            // the whole log pipeline.
            error_mode = "ignore"

            // Pass 1 -- on the RESOURCE, which groupbyattrs has now made
            // unique per label set. Renames to k8s semantic conventions and
            // derives service.name with the same precedence the Logs source's
            // serviceNameExpression already uses (app -> app_kubernetes_io_name
            // -> container -> unknown), so the column and the expression agree.
            log_statements {
              context = "resource"
              statements = [
                `set(attributes["k8s.cluster.name"],   attributes["cluster"])   where attributes["cluster"] != nil`,
                `set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil`,
                `set(attributes["k8s.pod.name"],       attributes["pod"])       where attributes["pod"] != nil`,
                `set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil`,
                `set(attributes["k8s.node.name"],      attributes["node"])      where attributes["node"] != nil`,
                `set(attributes["service.name"], attributes["app"])                    where attributes["app"] != nil`,
                `set(attributes["service.name"], attributes["app_kubernetes_io_name"]) where attributes["service.name"] == nil and attributes["app_kubernetes_io_name"] != nil`,
                `set(attributes["service.name"], attributes["container"])              where attributes["service.name"] == nil and attributes["container"] != nil`,
                // kernel-capture is a FILE tail from alloy-node, not a pod log, so it
                // has no namespace/pod/container to be named from -- fall back to the
                // Loki job. It was the only stream left unnamed (7 rows/min) and it is
                // the one stream that cannot be re-collected after the fact.
                `set(attributes["service.name"], attributes["job"])                    where attributes["service.name"] == nil and attributes["job"] != nil`,
                `set(attributes["service.name"], "unknown")                            where attributes["service.name"] == nil`,
              ]
            }

            // Pass 2 -- copy the flat keys back onto each log record, so every
            // existing LogAttributes['...'] consumer keeps working. Reading
            // from the resource and writing to the record is safe in `log`
            // context; it is the reverse direction that races.
            log_statements {
              context = "log"
              statements = [
                `set(attributes["cluster"],   resource.attributes["cluster"])   where attributes["cluster"] == nil and resource.attributes["cluster"] != nil`,
                `set(attributes["namespace"], resource.attributes["namespace"]) where attributes["namespace"] == nil and resource.attributes["namespace"] != nil`,
                `set(attributes["pod"],       resource.attributes["pod"])       where attributes["pod"] == nil and resource.attributes["pod"] != nil`,
                `set(attributes["container"], resource.attributes["container"]) where attributes["container"] == nil and resource.attributes["container"] != nil`,
                `set(attributes["node"],      resource.attributes["node"])      where attributes["node"] == nil and resource.attributes["node"] != nil`,
                `set(attributes["app"],       resource.attributes["app"])       where attributes["app"] == nil and resource.attributes["app"] != nil`,
                `set(attributes["app_kubernetes_io_name"], resource.attributes["app_kubernetes_io_name"]) where attributes["app_kubernetes_io_name"] == nil and resource.attributes["app_kubernetes_io_name"] != nil`,
                `set(attributes["job"],       resource.attributes["job"])       where attributes["job"] == nil and resource.attributes["job"] != nil`,
              ]
            }

            // Pass 3 -- SEVERITY. See TALOS-qzbh.1.
            log_statements {
              context = "log"
              statements = [
                // Severity, derived HERE so the ClickStack collector never guesses.
                // Its inference is gated on `severity_number == 0 and severity_text == ""`,
                // so setting these fields upstream disables it entirely -- which is the
                // point: the released collector (2.8.0, the newest published) matches
                // level keywords with NO word boundary, so the word "clusterroles"
                // contains "err" and made kyverno emit ~1,688 ERRORs/hour. Fixed in
                // upstream main but unreleased. Drop this block when a release ships it.
                `set(log.cache["lvl"], log.body.string) where log.body != nil`,
                `replace_pattern(log.cache["lvl"], "\x1b\\[[0-9;]*m", "")`,
                // structured  (logfmt level= / JSON "level"|"severity" string / Mongo "s")
                `set(log.severity_text, "fatal") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)(\\blevel=(fatal|panic|emerg|crit)|\"(level|severity)\"\\s*:\\s*\"(fatal|panic|emerg|crit)|\"s\"\\s*:\\s*\"F\")")`,
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)(\\blevel=(error|err)\\b|\"(level|severity)\"\\s*:\\s*\"(error|err)|\"s\"\\s*:\\s*\"E\")")`,
                `set(log.severity_text, "warn") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)(\\blevel=(warn|warning)|\"(level|severity)\"\\s*:\\s*\"(warn|warning)|\"s\"\\s*:\\s*\"W\")")`,
                `set(log.severity_text, "info") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)(\\blevel=(info|information)|\"(level|severity)\"\\s*:\\s*\"(info|information)|\"s\"\\s*:\\s*\"I\")")`,
                `set(log.severity_text, "debug") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)(\\blevel=(debug|dbug)|\"(level|severity)\"\\s*:\\s*\"(debug|dbug)|\"s\"\\s*:\\s*\"D\")")`,
                `set(log.severity_text, "trace") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)(\\blevel=trace|\"(level|severity)\"\\s*:\\s*\"trace)")`,
                // numeric     (pino/bunyan "level":NN)
                `set(log.severity_text, "fatal") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\"level\"\\s*:\\s*(6[0-9]|[7-9][0-9])")`,
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\"level\"\\s*:\\s*5[0-9]")`,
                `set(log.severity_text, "warn") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\"level\"\\s*:\\s*4[0-9]")`,
                `set(log.severity_text, "info") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\"level\"\\s*:\\s*3[0-9]")`,
                `set(log.severity_text, "debug") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\"level\"\\s*:\\s*2[0-9]")`,
                `set(log.severity_text, "trace") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\"level\"\\s*:\\s*1[0-9]")`,
                // klog        (^E0115 ...)
                `set(log.severity_text, "fatal") where log.severity_text == "" and IsMatch(log.cache["lvl"], "^F[0-9]{4} ")`,
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "^E[0-9]{4} ")`,
                `set(log.severity_text, "warn") where log.severity_text == "" and IsMatch(log.cache["lvl"], "^W[0-9]{4} ")`,
                `set(log.severity_text, "info") where log.severity_text == "" and IsMatch(log.cache["lvl"], "^I[0-9]{4} ")`,
                // zerolog     (TRC/DBG/INF/WRN/ERR/FTL, ANSI already stripped)
                `set(log.severity_text, "fatal") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\\bFTL\\b")`,
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\\bERR\\b")`,
                `set(log.severity_text, "warn") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\\bWRN\\b")`,
                `set(log.severity_text, "info") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\\bINF\\b")`,
                `set(log.severity_text, "debug") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\\bDBG\\b")`,
                `set(log.severity_text, "trace") where log.severity_text == "" and IsMatch(log.cache["lvl"], "\\bTRC\\b")`,
                // exception   (compound Error/Exception tokens)
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\b\\w*(error|exception)s?\\b")`,
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\b(errno|traceback|stacktrace)\\b")`,
                // keyword     (word-bounded last resort)
                `set(log.severity_text, "fatal") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\b(fatal|panic|emerg)")`,
                `set(log.severity_text, "error") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\b(error|err)\\b")`,
                `set(log.severity_text, "warn") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\b(warn|notice)")`,
                `set(log.severity_text, "debug") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\b(debug|dbug)")`,
                `set(log.severity_text, "trace") where log.severity_text == "" and IsMatch(log.cache["lvl"], "(?i)\\btrace\\b")`,
                // Nothing declared a level: info. NEVER leave it empty, or the
                // collector reclaims the line and guesses.
                `set(log.severity_text, "info") where log.severity_text == ""`,
                `set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_number == 0 and log.severity_text == "fatal"`,
                `set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_number == 0 and log.severity_text == "error"`,
                `set(log.severity_number, SEVERITY_NUMBER_WARN) where log.severity_number == 0 and log.severity_text == "warn"`,
                `set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_number == 0 and log.severity_text == "info"`,
                `set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_number == 0 and log.severity_text == "debug"`,
                `set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.severity_number == 0 and log.severity_text == "trace"`,
              ]
            }

            output {
              logs = [otelcol.processor.batch.clickstack.input]
            }
          }

          otelcol.processor.batch "clickstack" {
            timeout = "10s"
            // send_batch_max_size MUST be >= send_batch_size. Alloy rejects the
            // ENTIRE config otherwise and refuses to start — that crashlooped
            // the collector on 2026-08-15 when only send_batch_size was set.
            send_batch_size     = 4096
            send_batch_max_size = 8192

            output {
              logs = [otelcol.exporter.otlphttp.clickstack.input]
            }
          }

          otelcol.exporter.otlphttp "clickstack" {
            client {
              endpoint = "http://clickstack-otel-collector.monitoring.svc:4318"
              tls {
                insecure = true
              }
              // ClickStack secures OTLP ingest with the team's ingestion key
              // (minted by our own HyperDX, stored in our own MongoDB).
              headers = {
                "authorization" = sys.env("HYPERDX_INGESTION_KEY"),
              }
            }
          }

          // Metrics -> Mimir (via OTLP HTTP)
          otelcol.exporter.otlphttp "mimir" {
            client {
              endpoint = "http://mimir-gateway.monitoring.svc:80/otlp"
              tls {
                insecure = true
              }
            }
          }

          // ============================================
          // Kubernetes Discovery
          // ============================================
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.kubernetes "services" {
            role = "service"
          }

          discovery.kubernetes "endpoints" {
            role = "endpoints"
          }

          // ============================================
          // Prometheus Operator CRD Support
          // ============================================
          // Scrape targets defined by PodMonitor CRDs
          // This allows per-namespace or per-app metric collection config
          prometheus.operator.podmonitors "default" {
            forward_to = [prometheus.relabel.add_cluster.receiver]

            // Scrape all namespaces (no filter = all)
            // namespaces = ["vpn-gateway", "monitoring"]
          }

          // Scrape targets defined by ServiceMonitor CRDs
          // Standard Prometheus Operator pattern for service discovery
          prometheus.operator.servicemonitors "default" {
            forward_to = [prometheus.relabel.add_cluster.receiver]

            // Scrape all namespaces (no filter = all)
            // namespaces = ["monitoring"]
          }

          // ============================================
          // Cluster Log Collection
          // ============================================
          // Relabel pod targets to add proper Kubernetes labels for Loki
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Extract namespace
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            // Extract pod name
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            // Extract container name
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            // Extract node name
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Extract app label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            // Extract app.kubernetes.io/name label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app_kubernetes_io_name"
            }
            // Extract k8s-app label (for Cilium and system components)
            rule {
              source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
              target_label  = "k8s_app"
            }
            // Add cluster label
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
            // Add job label for consistency
            rule {
              target_label = "job"
              replacement  = "kubernetes-pods"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pod_logs.output
            // DUAL-WRITE: same stream to Loki AND (via the loki->OTLP
            // converter) to ClickStack.
            forward_to = [
              loki.write.default.receiver,
              otelcol.receiver.loki.clickstack.receiver,
            ]
          }

          // ============================================
          // Prometheus Scraping - Cluster Metrics
          // ============================================
          // Comprehensive labeling for dashboard compatibility
          // Based on kube-prometheus-stack patterns

          // ----------------------------------------
          // Kubelet Metrics
          // ----------------------------------------
          discovery.relabel "kubelet" {
            targets = discovery.kubernetes.nodes.targets

            // Route through k8s API
            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc:443"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
              replacement   = "/api/v1/nodes/$1/proxy/metrics"
            }
            // Standard labels for dashboards
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "instance"
            }
            // kubernetes_io_hostname for dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "kubernetes_io_hostname"
            }
            // kubernetes_node for legacy dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "kubernetes_node"
            }
            // Cluster label for multi-cluster dashboards
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "kubelet" {
            job_name        = "kubelet"
            targets         = discovery.relabel.kubelet.output
            scheme          = "https"
            scrape_interval = "60s"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              // The ca_file below is NOT doing anything: insecure_skip_verify overrides it,
              // so this reads like verification is happening when it is not. Left in place
              // only so it is ready if the note below is ever acted on. TALOS-pnyo.
              //
              // Verification genuinely cannot work here today. Talos serves the kubelet with
              // a PER-NODE self-signed CA, not the cluster CA. Measured against the live
              // endpoint from inside this pod:
              //   openssl s_client -connect <node>:10250 -CAfile <serviceaccount ca.crt>
              //   s: CN = talos00@...   i: CN = talos00-ca@...
              //   -> Verify return code: 19 (self-signed certificate in certificate chain)
              // Dropping insecure_skip_verify would fail the handshake and silently kill
              // kubelet and cadvisor metrics -- trading an authentication gap for a much
              // larger monitoring blind spot.
              //
              // The REAL fix is Talos-side, not here: enable kubelet serving-cert rotation
              // (rotate-server-certificates plus a CSR approver) so kubelet certs are issued
              // by the cluster CA. Then delete insecure_skip_verify and this comment.
              ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              insecure_skip_verify = true
            }
            forward_to = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // cAdvisor Metrics (container-level)
          // ----------------------------------------
          discovery.relabel "cadvisor" {
            targets = discovery.kubernetes.nodes.targets

            rule {
              target_label = "__address__"
              replacement  = "kubernetes.default.svc:443"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
              replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
            }
            // Node label for node-level aggregation
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "node"
            }
            // Instance as node name (not IP)
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "instance"
            }
            // kubernetes_io_hostname for dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "kubernetes_io_hostname"
            }
            // kubernetes_node for legacy dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "kubernetes_node"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "cadvisor" {
            job_name        = "cadvisor"
            targets         = discovery.relabel.cadvisor.output
            scheme          = "https"
            scrape_interval = "60s"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            tls_config {
              // The ca_file below is NOT doing anything: insecure_skip_verify overrides it,
              // so this reads like verification is happening when it is not. Left in place
              // only so it is ready if the note below is ever acted on. TALOS-pnyo.
              //
              // Verification genuinely cannot work here today. Talos serves the kubelet with
              // a PER-NODE self-signed CA, not the cluster CA. Measured against the live
              // endpoint from inside this pod:
              //   openssl s_client -connect <node>:10250 -CAfile <serviceaccount ca.crt>
              //   s: CN = talos00@...   i: CN = talos00-ca@...
              //   -> Verify return code: 19 (self-signed certificate in certificate chain)
              // Dropping insecure_skip_verify would fail the handshake and silently kill
              // kubelet and cadvisor metrics -- trading an authentication gap for a much
              // larger monitoring blind spot.
              //
              // The REAL fix is Talos-side, not here: enable kubelet serving-cert rotation
              // (rotate-server-certificates plus a CSR approver) so kubelet certs are issued
              // by the cluster CA. Then delete insecure_skip_verify and this comment.
              ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              insecure_skip_verify = true
            }
            forward_to = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Pod Metrics (prometheus.io/scrape annotated)
          // ----------------------------------------
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            // Only scrape pods with prometheus.io/scrape annotation
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
              regex         = "true"
              action        = "keep"
            }
            // Exclude cilium-operator (handled by dedicated scraper with io_cilium_app label)
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "cilium-operator"
              action        = "drop"
            }
            // Use custom path if specified
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
            }
            // Use custom port if specified
            rule {
              source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
              regex         = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement   = "$1:$2"
              target_label  = "__address__"
            }
            // Standard Kubernetes labels
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            // Node for node-level aggregation
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // App labels for service discovery
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app_kubernetes_io_name"
            }
            // k8s-app label for Cilium and other system components
            rule {
              source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
              target_label  = "k8s_app"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "pods" {
            job_name        = "kubernetes-pods"
            targets         = discovery.relabel.pods.output
            scrape_interval = "60s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // kube-state-metrics
          // ----------------------------------------
          // NOTE: Do NOT add namespace relabel - kube-state-metrics metrics
          // already include the correct namespace label for each resource.
          // Adding a namespace relabel would overwrite it with "monitoring".
          discovery.relabel "kube_state_metrics" {
            targets = discovery.kubernetes.services.targets

            rule {
              source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
              regex         = "kube-state-metrics"
              action        = "keep"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "kube_state_metrics" {
            job_name        = "kube-state-metrics"
            targets         = discovery.relabel.kube_state_metrics.output
            scrape_interval = "60s"
            // Honor labels from KSM to preserve namespace, pod, etc.
            honor_labels    = true
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Node Exporter (node hardware/OS metrics)
          // ----------------------------------------
          discovery.relabel "node_exporter" {
            targets = discovery.kubernetes.endpoints.targets

            rule {
              source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
              regex         = "prometheus-node-exporter"
              action        = "keep"
            }
            // Use node name as instance (instead of IP:port)
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "instance"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // kubernetes_io_hostname for dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "kubernetes_io_hostname"
            }
            // kubernetes_node for legacy dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "kubernetes_node"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "node_exporter" {
            // Use kubernetes-service-endpoints job name for dashboard compatibility
            job_name        = "kubernetes-service-endpoints"
            targets         = discovery.relabel.node_exporter.output
            scrape_interval = "60s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Hubble Metrics (Cilium network flow metrics)
          // ----------------------------------------
          discovery.relabel "hubble_metrics" {
            targets = discovery.kubernetes.endpoints.targets

            // Keep only hubble-metrics service
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "hubble-metrics"
              action        = "keep"
            }
            // Endpoints-role SD also emits targets for the backing pods' OTHER
            // declared container ports (cilium agents declare several that are
            // closed or non-HTTP) — and the instance=pod-name relabel below
            // collapsed good+phantom targets into one name, so 4/5 agents
            // showed ServiceDown 24/7 while :9965 was perfectly scrapable.
            // Keep only the service's actual endpoint port.
            rule {
              source_labels = ["__meta_kubernetes_endpoint_port_name"]
              regex         = "hubble-metrics"
              action        = "keep"
            }
            // Pod name label for dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            // Node label
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Instance as pod name for dashboard compatibility
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "instance"
            }
            // k8s_app label for Cilium/Hubble dashboards
            rule {
              source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
              target_label  = "k8s_app"
            }
            // Namespace
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            // Service
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }
            // Cluster label
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "hubble_metrics" {
            job_name        = "hubble"
            targets         = discovery.relabel.hubble_metrics.output
            // 30s interval for compatibility with dashboard rate[1m] windows
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Cilium Operator Metrics (port 9963)
          // ----------------------------------------
          discovery.relabel "cilium_operator" {
            targets = discovery.kubernetes.pods.targets

            // Keep only cilium-operator pods
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "cilium-operator"
              action        = "keep"
            }
            // Set metrics port to 9963
            rule {
              source_labels = ["__address__"]
              regex         = "([^:]+)(?::\\d+)?"
              replacement   = "$1:9963"
              target_label  = "__address__"
            }
            // Pod name label
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            // Node label
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Namespace
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            // Add io_cilium_app label for dashboard compatibility
            rule {
              target_label = "io_cilium_app"
              replacement  = "operator"
            }
            // k8s_app label
            rule {
              source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
              target_label  = "k8s_app"
            }
            // Cluster label
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "cilium_operator" {
            job_name        = "cilium-operator"
            targets         = discovery.relabel.cilium_operator.output
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // ArgoCD Metrics
          // ----------------------------------------
          discovery.relabel "argocd" {
            targets = discovery.kubernetes.endpoints.targets

            // Keep only argocd-*-metrics services
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_service_name"]
              regex         = "argocd;argocd-.*-metrics"
              action        = "keep"
            }
            // Endpoints-role SD also emits targets for the backing pods' OTHER
            // container ports (server :8080 API, repo-server :8081 gRPC) — those
            // phantom targets can never be scraped and fired ServiceDown 24/7.
            // Keep only the service's actual endpoint port (named `metrics`).
            rule {
              source_labels = ["__meta_kubernetes_endpoint_port_name"]
              regex         = "metrics"
              action        = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "argocd" {
            job_name        = "argocd"
            targets         = discovery.relabel.argocd.output
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Blackbox Exporter (probe metrics)
          // ----------------------------------------
          discovery.relabel "blackbox" {
            targets = discovery.kubernetes.endpoints.targets

            // Keep only blackbox exporter service
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "prometheus-blackbox-exporter"
              action        = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "blackbox" {
            job_name        = "blackbox"
            targets         = discovery.relabel.blackbox.output
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // Blackbox probe targets - scrape blackbox exporter with target params
          // Uses static targets with relabeling to set probe targets
          discovery.relabel "blackbox_probes" {
            targets = [
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "http://grafana-service.monitoring:3000", "instance" = "grafana" },
              // mimir-gateway is the Mimir gateway: it serves 200 on "/" but
              // 404 on "/ready" (only individual Mimir components expose
              // /ready). Probing /ready read DOWN (http 404). Use "/". TALOS-5356.
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "http://mimir-gateway.monitoring:80/", "instance" = "mimir" },
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "http://loki.monitoring:3100/ready", "instance" = "loki" },
              // Traefik dashboard/api/ping are on the `traefik-internal` service
              // (port 9000). The `traefik` service does not expose 9000, so the
              // probe hung to the 5s timeout and read DOWN. TALOS-5356.
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "http://traefik-internal.traefik:9000/ping", "instance" = "traefik" },
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "http://argocd-server.argocd:80", "instance" = "argocd" },
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "http://hubble-ui.kube-system:80", "instance" = "hubble-ui" },
              // ── INGRESS-PATH probes (TALOS-65i2) ────────────────────────
              // Every target above is a DIRECT service URL, so none of them
              // traverse Traefik's websecure entrypoint or its middleware chain
              // — and traefik-internal:9000/ping is Traefik's own health
              // endpoint, which middlewares never touch. That is why all of them
              // stayed green through a 100-minute total outage: the CrowdSec
              // bouncer was 403ing every request through the middleware chain,
              // which nothing probed.
              //
              // These two go through the REAL path a pod takes: cluster DNS
              // resolves these hostnames to Traefik's ClusterIP, so the probe
              // crosses entrypoint -> middlewares -> service, exactly like the
              // boomtime pod's failing OIDC discovery call did. A fleet-wide
              // block turns these red in ~1 scrape interval.
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "https://boomtime.knowledgedump.space/", "instance" = "ingress-boomtime" },
              // The exact URL whose 403 crash-looped boomtime. Public, unauthenticated.
              { "__address__" = "prometheus-blackbox-exporter.monitoring:9115", "__param_target" = "https://auth.knowledgedump.space/application/o/boomtime/.well-known/openid-configuration", "instance" = "ingress-authentik-oidc" },
            ]

            rule {
              source_labels = ["__param_target"]
              target_label  = "target"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "blackbox_probes" {
            job_name        = "blackbox-probes"
            scrape_interval = "60s"
            metrics_path    = "/probe"
            params          = { "module" = ["http_2xx"] }
            targets         = discovery.relabel.blackbox_probes.output
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Pushgateway Metrics (batch job metrics)
          // ----------------------------------------
          discovery.relabel "pushgateway" {
            targets = discovery.kubernetes.endpoints.targets

            // Keep only pushgateway service
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "prometheus-pushgateway"
              action        = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "pushgateway" {
            job_name        = "pushgateway"
            targets         = discovery.relabel.pushgateway.output
            scrape_interval = "60s"
            // Honor labels from pushed metrics (preserves job="pod_cleanup" etc)
            honor_labels    = true
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // MinIO Metrics (S3-compatible storage)
          // ----------------------------------------
          prometheus.scrape "minio" {
            job_name        = "minio"
            scrape_interval = "60s"
            metrics_path    = "/minio/v2/metrics/cluster"
            targets         = [{ "__address__" = "minio-hl.minio.svc:9000" }]
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Traefik Metrics (Ingress controller)
          // ----------------------------------------
          discovery.relabel "traefik" {
            targets = discovery.kubernetes.endpoints.targets

            // Keep only traefik-metrics service
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "traefik-metrics"
              action        = "keep"
            }
            // Keep ONLY the metrics port (9100). The k8s `endpoints` SD role
            // also surfaces every OTHER container port of the pods backing the
            // traefik-metrics service (80/443/1080/8080/9000/7687) as targets —
            // none of those serve /metrics, so ~25 phantom targets (5 non-metrics
            // ports x 5 pods) stay permanently up==0 and inflate the ServiceDown
            // alert. Filtering on the metrics port keeps only the real /metrics
            // endpoint. (TALOS-xgrl.11)
            rule {
              source_labels = ["__address__"]
              regex         = "(.+):9100"
              action        = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "traefik" {
            job_name        = "traefik"
            targets         = discovery.relabel.traefik.output
            scrape_interval = "30s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Service Monitors (prometheus.io annotated services)
          // ----------------------------------------
          discovery.relabel "service_monitors" {
            targets = discovery.kubernetes.endpoints.targets

            // Keep services with prometheus.io/scrape annotation
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
              regex         = "true"
              action        = "keep"
            }
            // Exclude node-exporter (handled separately)
            rule {
              source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
              regex         = "prometheus-node-exporter"
              action        = "drop"
            }
            // Exclude hubble-metrics (handled separately with pod labels)
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "hubble-metrics"
              action        = "drop"
            }
            // Exclude pushgateway (handled separately with honor_labels)
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "prometheus-pushgateway"
              action        = "drop"
            }
            // Exclude blackbox-exporter (handled by dedicated `blackbox` +
            // `blackbox_probes` scrapes; leaving it enabled here would
            // double-scrape the `up{}` series and wedge Alloy's WAL with
            // out-of-order rejects — see AlloyWALSampleRejection alert).
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              regex         = "prometheus-blackbox-exporter"
              action        = "drop"
            }
            // Exclude kube-state-metrics (handled by the dedicated
            // `kube_state_metrics` scrape above with honor_labels=true). Without
            // this drop KSM is scraped TWICE: here with honor_labels=false, so
            // its `namespace` label collides to "monitoring" and the real value
            // is shoved into `exported_namespace`. That doubled every KSM series
            // (~491x2), corrupted namespace/node labels forcing every dashboard
            // to filter job="kube-state-metrics", and threw
            // err-mimir-sample-duplicate-timestamp WAL rejects. See TALOS-57t.
            rule {
              source_labels = ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
              regex         = "kube-state-metrics"
              action        = "drop"
            }
            // Use custom port if specified
            rule {
              source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
              regex         = "([^:]+)(?::\\d+)?;(\\d+)"
              replacement   = "$1:$2"
              target_label  = "__address__"
            }
            // Use custom path if specified
            rule {
              source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
              regex         = "(.+)"
              target_label  = "__metrics_path__"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_service_name"]
              target_label  = "service"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
            }
          }

          prometheus.scrape "service_monitors" {
            job_name        = "kubernetes-service-endpoints"
            targets         = discovery.relabel.service_monitors.output
            scrape_interval = "60s"
            forward_to      = [prometheus.relabel.add_cluster.receiver]
          }

          // ----------------------------------------
          // Common Metric Relabeling
          // ----------------------------------------
          // Add cluster label to all metrics (fallback)
          prometheus.relabel "add_cluster" {
            // Drop ClickHouse error-string metric pollution. The
            // clickhouse-operator metrics exporter (clickhouse ns, scraped via
            // the kubernetes-pods annotation job) emits system.errors as series
            // whose __name__ is the literal error string, e.g.
            // `chi_clickhouse_Code:_241__DB::Exception...`. Each distinct error
            // becomes a new metric name (~133 seen), polluting Mimir's series
            // index. Legit ClickHouse metrics (chi_clickhouse_event_*,
            // chi_clickhouse_metric_*, ...) are NOT matched by this regex.
            // (TALOS-xgrl.11)
            rule {
              source_labels = ["__name__"]
              regex         = "chi_clickhouse_Code.*"
              action        = "drop"
            }
            rule {
              target_label = "cluster"
              replacement  = "talos-homelab"
              action       = "replace"
            }
            forward_to = [prometheus.remote_write.mimir.receiver]
          }

          // ============================================
          // Remote Write to Mimir
          // ============================================
          // WAL bounds (2026-07-15 TALOS-234 root cause fix):
          // Alloy's default max_keepalive_time is 8h, but during the 30d
          // meltdown the WAL grew to 30 DAYS of samples that Mimir kept
          // rejecting as "sample-timestamp-too-old", blocking fresh samples.
          // Explicit tight bounds guarantee that a Mimir outage of any
          // duration only backlogs 2h of WAL — after that, samples are
          // forcibly dropped and fresh scrapes flow again. Trades
          // recoverability of long outages (>2h) for pipeline liveness.
          // (Also mitigates alloy/alloy#4038 — default truncate_frequency
          // reportedly not respected in clustering mode.)
          prometheus.remote_write "mimir" {
            endpoint {
              url = "http://mimir-gateway.monitoring.svc:80/api/v1/push"
            }
            wal {
              truncate_frequency = "15m"
              min_keepalive_time = "30m"
              max_keepalive_time = "2h"
            }
          }

          // ============================================
          // Mimir Rules Sync (PrometheusRule CRDs -> Mimir Ruler)
          // ============================================
          // Watches PrometheusRule CRDs and syncs them to Mimir's ruler API
          // This allows recording rules defined in app repos to be automatically
          // provisioned to Mimir when deployed via ArgoCD/Flux
          mimir.rules.kubernetes "rules" {
            address = "http://mimir-gateway.monitoring.svc:80"
            tenant_id = "anonymous"

            // Sync rules every 30 seconds
            sync_interval = "30s"

            // Watch all PrometheusRule CRDs in the cluster
            // No selector = sync all rules
          }

          // ============================================
          // Self-monitoring
          // ============================================
          prometheus.exporter.self "alloy" {}

          prometheus.scrape "self" {
            targets         = prometheus.exporter.self.alloy.targets
            scrape_interval = "60s"
            forward_to      = [prometheus.remote_write.mimir.receiver]
          }

      # Extra ports for OTLP
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
        # Browser RUM ingest (faro.receiver "browser"). Reached through the
        # PathPrefix(/catalyst-rum/) IngressRoute in faro-route.yaml, never
        # directly - see the receiver's comment for why same-origin matters.
        - name: faro-http
          port: 12347
          targetPort: 12347
          protocol: TCP

    # Controller settings
    controller:
      # Alloy configuration
      # SOFT preference away from the two memory-tight nodes. alloy is the largest
      # single memory consumer in the cluster (3.5-4 GiB steady after the cardinality
      # fix) and had landed on talos01 by scheduler choice with no affinity at all —
      # because kube-scheduler packs on REQUESTS, and talos01 had request-headroom
      # while having barely a gigabyte genuinely free.
      #
      # Measured min free memory over 7d, straight from the kernel, no modelling:
      #   talos03  0.61 GiB   talos01  1.21 GiB   talos00  1.61 GiB
      #   talos06 25.44 GiB   talos02-gpu 26.57 GiB
      # talos03 actually wedged on memory exhaustion and needed a physical power
      # cycle. Three of five nodes have been within ~1.6 GiB of the floor; the two
      # destinations have never dropped below 25 GiB.
      #
      # Deliberately `preferred`, not `required` — a hint, not a pin. If the big
      # nodes are unavailable alloy still schedules rather than going Pending, which
      # matters because losing the metrics agent is how you go blind to the next
      # incident. (TALOS-3zf9)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [talos01, talos03]
      type: deployment
      replicas: 1

    # RBAC for Kubernetes API access (scraping kubelet, pods, etc.)
    rbac:
      create: true

    serviceAccount:
      create: true

    # ClusterRole rules for Prometheus scraping
    crds:
      create: false

    # Service
    service:
      enabled: true
      type: ClusterIP

    # ServiceMonitor
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
