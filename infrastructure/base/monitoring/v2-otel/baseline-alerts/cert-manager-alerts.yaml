---
# cert-manager certificate expiry + renewal-health alerts.
#
# Motivated by the 2026-08-08 incident: the *.knowledgedump.space wildcard cert
# EXPIRED because cert-manager's DNS-01 renewal had been stuck for ~30 days (a
# broken Cloudflare API token in the `cloudflare-dns` 1Password item → the zone
# lookup failed → the challenge never validated), and NOTHING alerted on it —
# the Certificate object even reported Ready=True the whole time. When the cert
# lapsed, every *.knowledgedump.space TLS service broke (boomtime's OIDC
# discovery failed on boot → CrashLoopBackOff).
#
# cert-manager is already scraped (servicemonitor/cert-manager), so these rules
# just watch metrics it already exports — no new scrape config needed.
#
# The load-bearing alert is CertManagerCertExpiringSoon: it fires on the expiry
# TIMESTAMP, independent of the (misleading) Ready condition, so a silently
# stuck renewal is caught ~3 weeks before the outage.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: monitoring
spec:
  groups:
    - name: cert-manager.expiry
      rules:
        # ~3 weeks of runway to fix a stuck renewal before TLS breaks.
        - alert: CertManagerCertExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) < (21 * 24 * 3600)
            and
            (certmanager_certificate_expiration_timestamp_seconds - time()) >= (7 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "cert {{ $labels.namespace }}/{{ $labels.name }} expires in <21d and hasn't renewed"
            description: >-
              cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} expires at
              {{ $value | humanizeTimestamp }} (under 21 days) and has NOT renewed. A Ready=True
              Certificate can still be silently stuck — inspect the chain:
              kubectl describe certificate/certificaterequest/order/challenge -n {{ $labels.namespace }}.
              Common cause: a DNS-01 solver credential (Cloudflare API token) that lost zone access.
        # Danger zone: <7 days, or already expired (metric goes negative).
        - alert: CertManagerCertExpiryImminent
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "cert {{ $labels.namespace }}/{{ $labels.name }} expires in <7d (or is EXPIRED)"
            description: >-
              cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} is within 7 days
              of expiry (or already expired — negative time-to-expiry). TLS for its domains is about
              to break or has broken. Fix the renewal path NOW.
    - name: cert-manager.health
      rules:
        # Catches issuance/renewal failures that DO surface on the Ready condition
        # (the expiry alert covers the ones that don't).
        - alert: CertManagerCertNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "cert {{ $labels.namespace }}/{{ $labels.name }} not Ready for >1h"
            description: >-
              cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} has not been Ready
              for over an hour — an issuance or renewal is failing. Check the CertificateRequest/Order.
