---
# Platform-regression alerts — born from the 2026-08-13 upgrade-day incidents.
# Each rule maps to a failure class that burned SILENTLY that day until a human
# looked at a dashboard:
#
#   1. ESO generator rotation → MinIO password drift → SignatureDoesNotMatch
#      across Loki/Mimir/Tempo (and Velero/CNPG one restart away).
#   2. ExternalSecrets stuck not-Ready (htpasswd template signature change) —
#      materialized Secrets keep working, so nothing pages until rotation fails.
#   3. Flux kustomizations dammed behind a stale controller REST-mapper.
#
# Thresholds calibrated against live baselines 2026-08-14: minio 4xx floor is
# ~0.02/s (routine HEAD-404s), objstore failures and loki drops are flat 0.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-regression-alerts
  namespace: monitoring
spec:
  groups:
    - name: platform-regressions.objectstore
      rules:
        # Mimir + Tempo expose thanos_objstore metrics for every bucket op.
        # ANY sustained failure rate = a broken data path (auth, network, or
        # bucket gone) — this is the alert that would have caught the
        # SignatureDoesNotMatch storm hours earlier.
        - alert: ObjectStoreOperationsFailing
          expr: |
            sum by (namespace, container) (rate(thanos_objstore_bucket_operation_failures_total[10m])) > 0.05
          for: 10m
          labels:
            severity: critical
            component: object-storage
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} object-storage operations failing"
            description: >-
              Sustained bucket-operation failures ({{ $value | humanize }}/s) from
              {{ $labels.container }}. If credentials rotated (ESO generator regen —
              see eso-generator-rotation-gotcha), force the MinIO password sync:
              `kubectl create job --from=cronjob/scoped-users-minio-provision -n minio`
              then restart the affected consumers.

        # Server-side catch-all: a surge of 4xx at MinIO itself catches ANY
        # consumer with bad creds (incl. ones with no client metrics). Baseline
        # floor ~0.02/s; the 2026-08-13 incident ran >1.7/s from loki alone.
        - alert: MinIOClientErrorSurge
          expr: |
            sum(rate(minio_s3_requests_4xx_errors_total[10m])) > 0.5
          for: 15m
          labels:
            severity: warning
            component: object-storage
          annotations:
            summary: "MinIO 4xx error surge ({{ $value | humanize }}/s)"
            description: >-
              Client-error rate at MinIO is far above the ~0.02/s baseline —
              usually a consumer with rotated/stale credentials (SignatureDoesNotMatch)
              or a missing bucket. Check `mc admin trace` or per-consumer logs.

        # Alloy dropping log entries = logs being LOST (WAL exhausted or Loki
        # rejecting). During the incident Loki refused writes for ~2h.
        - alert: LogWriteEntriesDropped
          expr: |
            sum(rate(loki_write_dropped_entries_total[10m])) > 0.1
          for: 15m
          labels:
            severity: critical
            component: logging
          annotations:
            summary: "Alloy is dropping log entries ({{ $value | humanize }}/s)"
            description: >-
              loki.write is dropping entries — Loki is rejecting writes or the WAL
              is exhausted. Logs are being permanently lost. Check loki-0 logs for
              S3/auth errors first (2026-08-13 class).

    - name: platform-regressions.gitops
      rules:
        # Flux resource stuck not-Ready. 30m grace skips normal reconcile churn;
        # a stale REST-mapper dam or a broken apply holds False for hours.
        - alert: FluxReconciliationStuck
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind=~"Kustomization|HelmRelease"} == 1
          for: 30m
          labels:
            severity: warning
            component: flux
          annotations:
            summary: "Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} not Ready >30m"
            description: >-
              Sustained Ready=False. If the message is a phantom 'NotFound' for
              objects that exist, the controller's REST-mapper is stale after a
              CRD api-version removal — `kubectl rollout restart deploy/kustomize-controller
              -n flux-system` (same class hit ArgoCD's application-controller).

        # ExternalSecret not-Ready: materialized Secrets keep apps alive, so
        # this fails silently until a rotation matters. Caught real breakage
        # (htpasswd template change) the day it was written.
        - alert: ExternalSecretNotReady
          expr: |
            externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 30m
          labels:
            severity: warning
            component: external-secrets
          annotations:
            summary: "ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} not Ready >30m"
            description: >-
              Secret sync is failing (the materialized Secret still works, so the
              app looks fine — until rotation). `kubectl describe externalsecret
              {{ $labels.name }} -n {{ $labels.exported_namespace }}` for the error;
              template-function signature changes (e.g. ESO 2.x htpasswd) look like
              'could not execute template'.

    - name: platform-regressions.cnpg-backups
      rules:
        # Plugin-based CNPG backups: barman sidecar exports last-available
        # timestamp per instance. >28h = the daily ScheduledBackup missed.
        - alert: CNPGPluginBackupStale
          expr: |
            time() - max by (namespace, pod) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0) > 100800
          for: 30m
          labels:
            severity: warning
            component: cnpg-backup
          annotations:
            summary: "CNPG backup for {{ $labels.namespace }}/{{ $labels.pod }} is >28h old"
            description: >-
              The barman-cloud plugin's last available backup is older than the
              daily cadence allows. Check the Backup CRs
              (`kubectl get backups.postgresql.cnpg.io -n {{ $labels.namespace }}`)
              and the cnpg-backup MinIO credential (generator-rotation class).
