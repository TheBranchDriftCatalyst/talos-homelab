---
# Standalone kube-state-metrics for V2 OTEL stack
# Replaces the bundled version from kube-prometheus-stack
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-state-metrics
      version: '5.27.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Replicas
    replicas: 1

    # Enable prometheus.io annotations for Alloy discovery
    # prometheusScrape: true adds the annotations automatically
    prometheusScrape: true

    # All collectors enabled by default, explicitly list important ones
    collectors:
      - certificatesigningrequests
      - configmaps
      - cronjobs
      - daemonsets
      - deployments
      - endpoints
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - leases
      - limitranges
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - replicationcontrollers
      - resourcequotas
      - secrets
      - services
      - statefulsets
      - storageclasses
      - volumeattachments

    # Resources for homelab
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        # Hygiene ceiling only — NOT the crashloop cause. KSM was never OOMKilled
        # (no limit existed; it died exit 1, not 137). ~3-5x expected usage @275 pods.
        memory: 256Mi

    # Root cause of the 1198-restart/70d crashloop is NOT memory or cardinality: at
    # pod startup KSM connects to the apiserver ClusterIP (10.96.0.1:443) before
    # Cilium programs its endpoint → EPERM "operation not permitted" → exit 1 (KSM
    # has zero client-creation retry). A too-tight liveness probe then amplifies it
    # (503 → kill → restart → re-hits the race). Loosen both probes so a transient
    # CNI/watch blip is tolerated instead of triggering a kill-restart cascade.
    # (TALOS-uylg — deeper Cilium startup-race fix tracked separately.)
    livenessProbe:
      initialDelaySeconds: 20
      periodSeconds: 15
      failureThreshold: 8
    readinessProbe:
      initialDelaySeconds: 10
      failureThreshold: 6

    # Self-monitoring
    selfMonitor:
      enabled: true
