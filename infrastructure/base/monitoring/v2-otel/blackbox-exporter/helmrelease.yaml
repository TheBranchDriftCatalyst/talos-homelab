---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: '>=9.0.0 <10.0.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 12h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    # Ensure replica count is set
    replicaCount: 1

    # Resources for homelab
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

    # Blackbox exporter configuration
    config:
      modules:
        # HTTP 2xx probe
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
            valid_status_codes: [] # Defaults to 2xx
            method: GET
            no_follow_redirects: false
            fail_if_ssl: false
            fail_if_not_ssl: false
            preferred_ip_protocol: 'ip4'

        # HTTP POST probe
        http_post_2xx:
          prober: http
          timeout: 5s
          http:
            method: POST
            valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']

        # TCP connect probe
        tcp_connect:
          prober: tcp
          timeout: 5s

        # ICMP ping probe
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: 'ip4'

        # DNS probe
        dns_udp:
          prober: dns
          timeout: 5s
          dns:
            transport_protocol: 'udp'
            preferred_ip_protocol: 'ip4'
            query_name: 'kubernetes.default.svc.cluster.local'

    # ServiceMonitor for Prometheus discovery
    serviceMonitor:
      enabled: true
      defaults:
        labels:
          prometheus: kube-prometheus
        interval: 30s
        scrapeTimeout: 30s

      # Probe targets - add your endpoints here
      # NOTE (2026-08-08, TALOS-5356): these targets were written for the old
      # kube-prometheus-stack and never updated after the v2-otel/Mimir
      # migration. The kube-prometheus-stack-* services no longer exist, so
      # every probe read DOWN (probe_success=0). Corrected to the real
      # v2-otel service names + per-service health paths below.
      targets:
        # Grafana is served by grafana-operator as `grafana-service:3000`
        # (old kube-prometheus-stack-grafana:80 no longer exists).
        - name: grafana
          url: http://grafana-service.monitoring.svc:3000/api/health
          module: http_2xx
        # Alertmanager is now Mimir's Alertmanager (mimir-alertmanager:8080).
        # The old kube-prometheus-stack-alertmanager:9093 service is gone.
        - name: alertmanager
          url: http://mimir-alertmanager.monitoring.svc:8080/
          module: http_2xx
        # Traefik dashboard/api/ping live on the `traefik-internal` service
        # port 9000 — the `traefik` service does NOT expose 9000, so probing
        # traefik:9000 hung until the 5s module timeout (probe_success=0).
        - name: traefik-dashboard
          url: http://traefik-internal.traefik.svc:9000/ping
          module: http_2xx
        # DISABLED: v2-otel replaced the Prometheus server with Mimir. There is
        # no kube-prometheus-stack-prometheus service. The Mimir gateway is
        # already probed by the Alloy `blackbox-probes` job (instance=mimir),
        # so a second probe here would just duplicate it.
        # - name: prometheus
        #   url: http://mimir-gateway.monitoring.svc:80/
        #   module: http_2xx
        # DISABLED: Graylog is not deployed (the `observability` namespace has
        # no workloads). Re-enable when Graylog is running.
        # - name: graylog
        #   url: http://graylog.observability.svc:9000
        #   module: http_2xx
        # DISABLED: no OpenSearch cluster is deployed yet — only the
        # opensearch-operator is installed. When a cluster exists it serves
        # HTTPS with auth, so an http_2xx probe would fail; probe reachability
        # with tcp_connect against :9200 instead.
        # - name: opensearch
        #   url: opensearch-cluster-master.observability.svc:9200
        #   module: tcp_connect

    # Pod labels
    podLabels:
      app: blackbox-exporter
