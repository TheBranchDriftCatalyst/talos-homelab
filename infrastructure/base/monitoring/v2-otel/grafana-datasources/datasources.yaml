---
# Mimir datasource - OTLP Metrics (primary for application telemetry)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  datasource:
    name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir-gateway.monitoring.svc:80/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
    editable: false
---
# Loki datasource - Logs
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki-v2
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  datasource:
    name: Loki
    type: loki
    uid: loki-v2
    access: proxy
    url: http://loki.monitoring.svc:3100
    isDefault: false
    jsonData:
      maxLines: 1000
      timeout: 60
    editable: false
