---
# catalyst-rum: serves the HyperDX browser SDK and authenticates its telemetry.
#
# Source repo: workspace/catalyst-rum -> panda/catalyst-rum on Forgejo, built to
# Zot by .forgejo/workflows/docker-publish.yml.
#
# TWO JOBS, ONE POD, deliberately:
#   /rum.js, /sdk.js  static, same-origin with the page that loads them
#   /v1/logs,/v1/traces  proxied to the ClickStack collector with the ingestion
#                        key attached HERE, server-side
#
# The key is the reason this pod exists at all. Upstream's documented browser
# setup passes the ingestion key to HyperDX.init() in client-side JS, which on
# any public host publishes a write credential for the whole observability
# stack in page source. A Traefik Middleware cannot read a Secret, and routing
# the key in via Flux postBuild/envsubst would mean enabling substitution on
# the monitoring Kustomization -- which also carries the Alloy river config,
# full of $-expressions envsubst would mangle. One nginx template reading one
# env var keeps it contained.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-rum
  labels:
    app.kubernetes.io/name: catalyst-rum
    app.kubernetes.io/component: rum
spec:
  # Two replicas because this sits on the page-load path of every opted-in app.
  # It is stateless, so this is purely about not serving a 502 during a roll.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-rum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalyst-rum
    spec:
      # registry.talos00 requires auth even for a pull; without this the pod
      # sits in ImagePullBackOff reporting "no basic auth credentials".
      imagePullSecrets:
        - name: nexus-pull-dockercfg
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        # fsGroup is REQUIRED, not hygiene. An emptyDir is created root:root, so
        # a container running as uid 101 cannot write into one -- and this image
        # MUST write, because its entrypoint renders the nginx config at startup
        # into /etc/nginx/conf.d. Without this the render silently fails, conf.d
        # stays EMPTY, and nginx comes up with no server block at all: the
        # container reports Running and healthy-looking while every request is
        # refused. fsGroup makes kubelet chown the volumes to this gid.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Pinned to the tag AND its digest. `latest` on a stale tag is an
          # upgrade trigger -- it fast-forwards across every release at once the
          # first time a node re-pulls -- and a digest is strictly stronger than
          # any tag. scene-engine is pinned the same way for the same reason.
          # Built by Forgejo from panda/catalyst-rum commit 2a3189c.
          image: registry.talos00/talos00-registry/catalyst-rum:sha-2a3189c@sha256:0bf99dd01ecd988081fdc1531b7b9c9f3400a57e8976f0fe9e838cefdac3032b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Minted by our own HyperDX and stored in our own MongoDB; the same
            # single 1Password field Alloy reads (item `hyperdx`, property
            # ingestion_api_key). Both ends of the handshake resolve here, which
            # is what TALOS-cjny established after the placeholder-key 401.
            - name: HYPERDX_INGESTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperdx-ingestion
                  key: ingestion_api_key
            - name: OTEL_COLLECTOR
              value: clickstack-otel-collector.monitoring.svc:4318
          # Liveness checks THIS pod, not the collector -- see the template
          # comment. Coupling them would turn a ClickHouse problem into an
          # SDK-delivery outage and roll these pods for nothing.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes all three even when nothing is cached, so a
            # read-only root filesystem needs them.
            #
            # conf.d is NOT optional here and is the one login-background does
            # not need: that pod mounts a finished default.conf from a
            # ConfigMap, whereas this image RENDERS its config at startup
            # (/docker-entrypoint.d/20-envsubst-on-templates.sh writes
            # /etc/nginx/conf.d/default.conf), which a read-only root rejects:
            #   "can't create /etc/nginx/conf.d/default.conf: Read-only file system"
            # The pod CrashLoopBackOffs. This is the cost of baking the config
            # in rather than ConfigMap-mounting it, and it is invisible when
            # testing the image by hand -- `docker run` applies no
            # securityContext, so the same image passed every local check.
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: catalyst-rum
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  selector:
    app.kubernetes.io/name: catalyst-rum
  ports:
    - name: http
      port: 80
      targetPort: http
