---
# Pull secret for Zot (registry.talos00). Same ESO pattern every other consuming
# namespace uses -- crossplane-demo, media-private, bt-radar, fchat-bouncer each
# declare their own, because a Secret is namespaced and there is no mirroring in
# play here.
#
# This was MISSING from the first cut of this directory and the omission is
# invisible until deploy time: the manifests validate, kustomize builds, the
# server-side dry-run passes, and then the pod sits in ImagePullBackOff with
# "no basic auth credentials". Found by trying to pull the image with a bare
# `kubectl run` and noticing that scene-engine -- which is deployed and running
# -- fails in EXACTLY the same way, because the credential lives on the
# Deployment, not in the cluster's default pull path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-pull-dockercfg
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nexus-pull-dockercfg
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "registry.talos00": {
                "username": "{{ .username }}",
                "password": "{{ .password }}",
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef: {key: nexus-admin, property: username}
    - secretKey: password
      remoteRef: {key: nexus-admin, property: password}
