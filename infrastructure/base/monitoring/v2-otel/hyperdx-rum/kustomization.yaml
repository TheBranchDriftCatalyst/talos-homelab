---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here -- the parent (../kustomization.yaml) sets
# `namespace: monitoring` and everything in this directory belongs there,
# including the Traefik Middlewares. They do NOT need to live in the traefik
# namespace: an IngressRoute references a middleware by name AND namespace, and
# grafana's route already reaches across to traefik/lan-only. Keeping them with
# the pod they describe means one directory owns the whole feature.

resources:
  - pull-secret.yaml
  - server.yaml
  - route.yaml
  - middlewares.yaml
