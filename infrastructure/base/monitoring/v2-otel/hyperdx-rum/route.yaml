---
# ONE route publishes /hyperdx-rum/ on EVERY host, so both the SDK and the
# beacon are always SAME-ORIGIN with the page that uses them.
#
# This is the same shape, and the same reasoning, as the Faro route next door
# (../alloy/faro-route.yaml) and themepark's asset route: a hostless PathPrefix
# rule applies to any hostname Traefik serves, so opting an app in is one
# middleware reference and nothing else.
#
# Same-origin is not a convenience, it removes four separate problems:
#   - No CORS. The browser never preflights a same-origin POST.
#   - No CSP edit per app. connect-src falls back to default-src and
#     same-origin counts as 'self', so even qBittorrent's bare
#     `default-src 'self'` permits the beacon with no per-app middleware.
#   - No mixed content. Plex and Jellyfin are served over plain HTTP as well as
#     HTTPS; the beacon follows whichever scheme the page used, which is why the
#     `web` route below is NOT a redirect-https.
#   - No new DNS name or certificate SAN. `*.talos00` is a single-label parent
#     that Apple clients reject outright, so a dedicated rum.talos00 would be
#     its own project.
#
# ACCESS CONTROL is lan-only plus the shared rate-limit (100/s, burst 200 --
# the same ceiling the Faro receiver enforces in-process). This endpoint is
# write-only and unauthenticated FROM THE BROWSER by design: the pod behind it
# attaches the real credential, so there is nothing for a page to hold. If an
# app on a public host is ever opted in, lan-only has to come off this route
# and the rate limit becomes the only control -- make that a deliberate change,
# not a side effect.
#
# priority must beat the apps' own catch-all Host() rules, which would
# otherwise swallow /hyperdx-rum/ and hand it to the application. Traefik
# derives priority from rule length when unset, and Host(...) is longer.
#
# Two objects because Kyverno's ingressroute-no-combined-entrypoints (Enforce)
# denies a single route listing both entrypoints.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hyperdx-rum-strip
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  stripPrefix:
    prefixes:
      - /hyperdx-rum

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hyperdx-rum
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/hyperdx-rum/`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: hyperdx-rum-strip
          namespace: monitoring
      services:
        - name: catalyst-rum
          port: 80
  tls: {}

---
# PUBLIC ingest, scoped to named hosts. The route above is lan-only, which is
# RFC1918-only -- a visitor arriving through Cloudflare is NOT in those ranges,
# so every public beacon would be 403'd and the sessions table would stay empty
# with no error anywhere except the browser console.
#
# WHY HOST-SCOPED instead of just dropping lan-only from the hostless route:
# this endpoint writes into ClickHouse, and the pod behind it attaches the real
# credential, so anything that reaches it can write. Enumerating the hosts that
# are allowed to be public keeps that surface a list someone has to edit on
# purpose, rather than a blanket opening that arrives as a side effect of
# instrumenting one app. Add a host here only when that app is actually public.
#
# PRIORITY MUST EXCEED the hostless route's 10000. Both rules match a request to
# boomtime.knowledgedump.space/hyperdx-rum/..., and on a tie Traefik's choice is
# not something to rely on -- if the lan-only route won, public beacons would be
# rejected intermittently, which is far worse to debug than a clean failure.
#
# Control here is the shared rate-limit (100/s, burst 200 -- the same ceiling
# the Faro receiver enforces in-process). There is deliberately no auth: the
# browser holds no credential by design.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hyperdx-rum-public
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`boomtime.knowledgedump.space`) || Host(`amberdark.net`)) && PathPrefix(`/hyperdx-rum/`)
      kind: Rule
      priority: 10100
      middlewares:
        - name: rate-limit
          namespace: traefik
        - name: hyperdx-rum-strip
          namespace: monitoring
      services:
        - name: catalyst-rum
          port: 80
  tls: {}

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hyperdx-rum-http
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  entryPoints:
    - web
  routes:
    # Deliberately NOT redirect-https, matching the Faro and asset routes: Plex
    # and Jellyfin are served over plain HTTP, and an HTTPS-only ingest origin
    # would make their beacons mixed-content and silently dropped.
    - match: PathPrefix(`/hyperdx-rum/`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: lan-only
          namespace: traefik
        - name: rate-limit
          namespace: traefik
        - name: hyperdx-rum-strip
          namespace: monitoring
      services:
        - name: catalyst-rum
          port: 80
