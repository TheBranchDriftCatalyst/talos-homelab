---
# PER-APP opt-in handles. Reference one of these from an app's IngressRoute to
# instrument it; nothing here touches an app until it opts in.
#
# One middleware per app rather than one shared middleware, because the
# injected tag carries that app's identity in data-service -- it becomes
# ServiceName in ClickHouse, and a shared tag would file every app's sessions
# under one name. Same structure as the analytics sites-middlewares.
#
# TWO RULES BEFORE ADDING AN APP HERE:
#
# 1. NEVER put an app behind BOTH this and an analytics/themepark inject. Those
#    are also rewriteBody middlewares, and chaining body rewriters is a
#    documented SILENT failure mode in this cluster -- the second one's regex
#    may never match and nothing reports it. Check the target route for any
#    `*-inject-*` or `catalyst-inject-*` middleware first. (grafana, the first
#    app here, carries only lan-only -- verified before choosing it.)
#
# 2. Session replay RECORDS WHAT THE USER SEES. The loader masks all inputs and
#    all text by default and that default should stay; data-unmask="true" is a
#    per-app decision about a specific screen, not a way to "see more". Private
#    media UIs and anything under media-private are the wrong place for this.
#
# WHERE THE OTHER APPS LIVE: boomtime and amberdark are instrumented too, but
# NOT from this file. Both already carry a Plausible rewriteBody, and chaining
# body rewriters is the silent failure described in rule 1 below -- so their RUM
# tag is emitted from the SAME single rewrite as their Plausible tag, in
# infrastructure/base/analytics/sites-middlewares.yaml. Look there, not here.
# Only apps with no existing injector get a middleware in this file.
#
# Accept-Encoding is stripped by reusing traefik/strip-accept-encoding from the
# analytics chain -- the rewriteBody plugin cannot match </head> in a gzip or
# brotli body, it would see compressed bytes and never fire.

# ---------------------------------------------------------------------------
# grafana -- the first and currently only opted-in app.
#
# Chosen as the canary deliberately: it is LAN-only and SSO-gated so the
# audience is just the operator, it is a heavy SPA so the RUM data is actually
# interesting, its IngressRoute is Flux-owned IN THIS REPO (no sister-repo
# change), it carries no other body rewriter, and -- the point -- if RUM breaks
# Grafana, HyperDX itself still works to show why. Instrumenting HyperDX first
# would have removed the tool needed to debug it.
# ---------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hyperdx-rum-inject-grafana
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  plugin:
    rewriteBody:
      lastModified: true
      rewrites:
        # TWO payloads, ONE rewriteBody -- the RUM tag AND the catalyst navbar.
        #
        # This is the boomtime/amberdark pattern described at the top of this
        # file, applied to grafana: an app that needs two injections gets them
        # from a SINGLE rewrite, never from two chained rewriteBody middlewares.
        # Adding traefik/catalyst-nav alongside this one would be exactly the
        # silent failure rule 1 warns about -- the second regex may never match
        # and nothing reports it.
        #
        # The two rewrites below target DIFFERENT anchors (<head> vs </head>) so
        # neither can consume the other's match. The nav stylesheet rides along
        # in the </head> replacement rather than taking a third rewrite, because
        # a second rewrite also keyed on </head> would have to match the output
        # of the first -- which works, but depends on the plugin's rewrite order
        # staying sequential. One anchor, one rewrite.
        - regex: '<head>'
          replacement: '<head><script defer src="/catalyst/resources/catalyst-nav.js"></script>'
        # ONE tag, NO inline JS. An onload= handler would need CSP
        # 'unsafe-inline'; the loader reads its config from data-* instead and
        # appends the SDK itself. See rum.js in the catalyst-rum repo.
        - regex: "</head>"
          replacement: '<script src="/hyperdx-rum/rum.js" data-service="grafana" defer></script><link rel="stylesheet" type="text/css" href="/catalyst/css/catalyst-nav.css"></head>'

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  # RENAMED from hyperdx-rum-grafana (it now injects the navbar too). The
  # `catalyst` prefix is LOAD-BEARING, not cosmetic: themepark's nav manifest
  # builder only advertises a route that carries a middleware whose name starts
  # with "catalyst" (build_nav.py, `injected`), so under the old name grafana
  # would get the bar injected and still never appear as a LINK in it.
  #
  # The name also contains "nav", which build_nav.py's `themed` test reads as
  # nav-only -- grafana keeps its own styling, so its entry must not be dimmed
  # like a fully re-themed app. Those two tests and these names move together.
  name: catalyst-nav-rum-grafana
  labels:
    app.kubernetes.io/name: catalyst-rum
spec:
  chain:
    middlewares:
      # Left exactly as it was: no catalyst-compress. This chain has served
      # grafana uncompressed since the RUM canary landed and works; adding
      # compression here would be an unrelated behaviour change to a route
      # whose body is now being rewritten for two consumers.
      - name: strip-accept-encoding
        namespace: traefik
      - name: hyperdx-rum-inject-grafana
        namespace: monitoring
