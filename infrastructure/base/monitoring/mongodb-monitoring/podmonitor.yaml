---
# Cluster-wide auto-discovery PodMonitor for ALL MongoDBCommunity instances.
#
# Mirrors the cnpg-clusters PodMonitor deliberately — same "one global monitor,
# zero per-database toil" shape. The difference: CNPG's operator stamps a usable
# role label (cnpg.io/podRole=instance) on every instance pod, whereas the
# MongoDB operator only sets app=<resource>-svc, which is per-resource and no use
# as a cross-cluster selector. So the house label catalyst.io/mongodb=instance is
# applied in each MongoDBCommunity's statefulSet.spec.template.metadata.labels,
# and selected here.
#
# TO ONBOARD A NEW MONGO: add that one label to its CR. Nothing to change here.
#
# The metrics themselves come from a percona/mongodb_exporter SIDECAR in each
# pod — the MongoDB operator ships none (verified 2026-08-20: mongodb_up was
# absent from Mimir entirely, so any dashboard authored before this landed would
# have been empty panels).
#
# Alloy's prometheus.operator.podmonitors "default" already discovers PodMonitors
# across all namespaces, so this is picked up with no further wiring.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mongodb-clusters
  namespace: monitoring
  labels:
    app.kubernetes.io/component: mongodb-monitoring
    app.kubernetes.io/part-of: mongodb
spec:
  # `{}` would mean "this PodMonitor's OWN namespace" in Prometheus Operator
  # semantics; any:true is required to reach mongo pods in other namespaces.
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      catalyst.io/mongodb: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
