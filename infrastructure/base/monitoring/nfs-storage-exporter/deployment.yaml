---
# NFS backend free-space exporter. The probe LOGIC lives in probe.sh (loaded via a
# ConfigMap — kustomize configMapGenerator), so this manifest stays code-free.
# Mirrors the pihole/nebula-sync pattern: a loop container writes Prometheus text
# to a shared emptyDir; a busybox-httpd sidecar serves it; a PodMonitor scrapes it.
#
# Fills the gap node-exporter can't: the NAS behind the NFS storage classes. See
# probe.sh for the df-on-a-probe-PVC trick (no privilege, no hardcoded server).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-storage-exporter
  namespace: monitoring
  labels:
    app: nfs-storage-exporter
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO probe PVC — never two pods mounting at once
  selector:
    matchLabels:
      app: nfs-storage-exporter
  template:
    metadata:
      labels:
        app: nfs-storage-exporter
        app.kubernetes.io/component: metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: probe
          image: alpine:3.20 # busybox df/awk/date/sh — no extra packages needed
          command: ["/bin/sh", "/scripts/probe.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writes only to the /metrics emptyDir
            capabilities: {drop: ["ALL"]}
          env:
            - name: PROBE_PATH
              value: "/nas"
            - name: STORAGECLASS
              value: "fatboy-nfs-appdata" # label only; reported by df, not trusted for the server
            - name: INTERVAL
              value: "60"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: metrics # probe.sh writes Prometheus text here; the sidecar serves it
              mountPath: /metrics
            - name: nas # NFS probe PVC; df here reports the whole NAS filesystem
              mountPath: /nas
              readOnly: true
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 32Mi}
        # Metrics endpoint. busybox:1.36 is the repo-wide standard; its httpd applet
        # serves the textfile probe.sh writes to the shared emptyDir. Scraped by
        # nfs-storage-exporter/podmonitor.yaml → Mimir via Alloy.
        - name: metrics
          image: busybox:1.36
          command: ["httpd", "-f", "-p", "9092", "-h", "/metrics"]
          ports:
            - name: metrics # PodMonitor references this port name
              containerPort: 9092
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: metrics
              mountPath: /metrics
              readOnly: true
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 16Mi}
      volumes:
        - name: script
          configMap:
            name: nfs-storage-exporter-script # configMapGenerator (see kustomization.yaml)
            defaultMode: 0555
        - name: metrics # shared between probe.sh (writer) and busybox httpd (reader)
          emptyDir: {}
        - name: nas
          persistentVolumeClaim:
            claimName: nfs-free-probe
