---
# NFS backend free-space exporter — closes the gap node-exporter can't reach (the
# NAS behind the NFS storage classes). Feeds the "NAS Free" panels on the Central
# Cluster Storage dashboard. Included by ../v2-otel/kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - podmonitor.yaml

# probe.sh shipped as a ConfigMap. disableNameSuffixHash → the Deployment can
# reference `nfs-storage-exporter-script` by a stable name. The substitute:disabled
# annotation keeps Flux postBuild envsubst from touching the shell $VARs / awk $N.
configMapGenerator:
  - name: nfs-storage-exporter-script
    files:
      - probe.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled

# disableNameSuffixHash stays here FOR NOW, unlike aws-inventory-exporter, and that is a
# known defect rather than a decision: probe.sh is read by a long-running Deployment, so a
# script edit updates the ConfigMap in place and nothing restarts (TALOS-h1ng).
# Removing it was tried and REVERTED on 2026-10-02: kustomize generated
# nfs-storage-exporter-script-<hash> but did NOT rewrite deployment.yaml's volume
# reference, leaving the Deployment pointing at a name that no longer exists - which would
# have failed the mount outright. The identical change DOES rewrite correctly in
# aws-inventory-exporter, whose volume is written in flow style, so something about this
# file's shape defeats the nameReference transformer. Diagnose before retrying.
generatorOptions:
  disableNameSuffixHash: true
