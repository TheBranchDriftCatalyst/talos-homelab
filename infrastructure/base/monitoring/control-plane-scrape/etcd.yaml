---
# etcd metrics — Talos exposes http://192.168.1.54:2381/metrics (no auth).
# Selector-less headless Service + manual Endpoints pointing at the
# control-plane node; ServiceMonitor picked up by Alloy
# (prometheus.operator.servicemonitors "default", no selector).
apiVersion: v1
kind: Service
metadata:
  name: kube-etcd
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-etcd
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 2381
      protocol: TCP
      targetPort: 2381
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-etcd
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-etcd
subsets:
  - addresses:
      - ip: 192.168.1.54
    ports:
      - name: metrics
        port: 2381
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-etcd
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-etcd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-etcd
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      scheme: http
      interval: 30s
