---
# Control-plane metrics scraping (etcd, scheduler, controller-manager,
# apiserver) via ServiceMonitors picked up by Alloy.
# Namespaces are set explicitly per-resource (kube-system for the
# Services/Endpoints/ServiceMonitors; RBAC is cluster-scoped).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - etcd.yaml
  - scheduler.yaml
  - controller-manager.yaml
  - apiserver.yaml
  - rbac.yaml
