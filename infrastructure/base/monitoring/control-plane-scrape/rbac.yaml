---
# Authorize Alloy's ServiceAccount token to GET /metrics on the
# control-plane components (scheduler :10259, controller-manager :10257,
# apiserver :6443 all delegate authz to the apiserver via SubjectAccessReview).
#
# Bound to the `alloy` ServiceAccount (monitoring ns) — the Alloy Deployment
# is the instance running prometheus.operator.servicemonitors/podmonitors;
# the alloy-node DaemonSet does not scrape ServiceMonitors.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-metrics
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-control-plane-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-metrics
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
