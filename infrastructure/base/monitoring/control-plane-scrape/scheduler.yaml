---
# kube-scheduler metrics — https://192.168.1.54:10259/metrics
# (HTTPS + bearer token; 403 without). Alloy's ServiceAccount token is
# authorized via the control-plane-metrics ClusterRole (rbac.yaml).
apiVersion: v1
kind: Service
metadata:
  name: kube-scheduler-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler-metrics
spec:
  clusterIP: None
  ports:
    - name: https-metrics
      port: 10259
      protocol: TCP
      targetPort: 10259
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-scheduler-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler-metrics
subsets:
  - addresses:
      - ip: ${TALOS_NODE_IP}
    ports:
      - name: https-metrics
        port: 10259
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-scheduler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-scheduler-metrics
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: https-metrics
      scheme: https
      interval: 30s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # STAYS TRUE, AND IT IS NOT AN OVERSIGHT -- do not "fix" this without re-testing.
        # Talos serves the scheduler metrics endpoint (:10259) with a SELF-SIGNED
        # certificate that is NOT issued by the cluster CA, so there is nothing to verify
        # against. Measured from inside a monitoring pod against the live endpoint:
        #   openssl s_client -connect 192.168.1.54:10259 -CAfile <serviceaccount ca.crt>
        #   -> Verify return code: 19 (self-signed certificate in certificate chain)
        # Setting caFile here would fail the handshake and silently kill this scrape.
        #
        # The apiserver scrape in this same directory DOES verify (return code 0) -- the
        # difference is real, not inconsistency. Revisit only if Talos starts issuing these
        # from the cluster CA. TALOS-pnyo.
        insecureSkipVerify: true
