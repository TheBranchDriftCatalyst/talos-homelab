---
# kube-scheduler metrics — https://192.168.1.54:10259/metrics
# (HTTPS + bearer token; 403 without). Alloy's ServiceAccount token is
# authorized via the control-plane-metrics ClusterRole (rbac.yaml).
apiVersion: v1
kind: Service
metadata:
  name: kube-scheduler-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler-metrics
spec:
  clusterIP: None
  ports:
    - name: https-metrics
      port: 10259
      protocol: TCP
      targetPort: 10259
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-scheduler-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler-metrics
subsets:
  - addresses:
      - ip: 192.168.1.54
    ports:
      - name: https-metrics
        port: 10259
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-scheduler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-scheduler-metrics
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: https-metrics
      scheme: https
      interval: 30s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
