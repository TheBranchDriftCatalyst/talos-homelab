---
# KEDA monitoring: one PodMonitor that scrapes KEDA's Prometheus metrics
# (metrics-apiserver today; keda-operator scaler metrics once the operator's
# Prometheus server is enabled). Pairs with the "KEDA Autoscaling" Grafana
# dashboard (Ops/Cluster).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - podmonitor.yaml
