---
# Cluster-wide auto-discovery PodMonitor for KEDA's Prometheus metrics.
#
# WHY: the KEDA chart can create its own PodMonitors, but this repo centralises
# scrape config (Alloy's `prometheus.operator.podmonitors "default"` discovers
# every PodMonitor in every namespace with no selector), so we author one here
# instead of turning on the chart's PodMonitor.
#
# SELECTOR: both keda components share label `app.kubernetes.io/part-of:
# keda-operator`. We match that + a container port named `metrics`, which:
#   * matches keda-operator-metrics-apiserver TODAY (port metrics=8080) — serves
#     the keda_internal_metricsservice_grpc_* metrics (HPA metrics pipeline
#     health, panel 32), scraped immediately.
#   * matches keda-operator ONCE its Prometheus metrics server is enabled — that
#     adds the metrics=8080 port and emits the RICH scaler metrics the rest of
#     the dashboard needs (keda_scaler_active, keda_scaler_metrics_value,
#     keda_scaler_errors_total, keda_scaled_object_errors_total,
#     keda_trigger_totals, keda_resource_totals, keda_build_info, ...).
# The keda-admission-webhooks pod has no `metrics` port, so it is skipped.
#
# ACTION REQUIRED for the rich scaler metrics: the operator currently runs with
# `--enable-prometheus-metrics=false` and exposes NO metrics port. Set
# `prometheus.operator.enabled: true` (and keep `prometheus.operator.podMonitor.
# enabled: false` so this hand-authored PodMonitor stays the single source) in
# infrastructure/base/operators/keda/helmrelease.yaml. Until then, only the
# metrics-apiserver panels populate; scaler/trigger/resource panels stay empty.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: keda-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/component: keda-monitoring
    app.kubernetes.io/part-of: keda
spec:
  namespaceSelector:
    matchNames:
      - keda
  selector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  podMetricsEndpoints:
    - port: metrics # 8080 — metrics-apiserver now; keda-operator once enabled
      path: /metrics
      interval: 30s
