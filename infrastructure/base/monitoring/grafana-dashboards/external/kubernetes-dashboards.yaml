---
# GrafanaDashboard CRDs for Kubernetes cluster monitoring
# Migrated from scripts/import-grafana-dashboards.sh

# REMOVED (TALOS-9h2): k8s-cluster-monitoring (id 315, "classic") and
# k8s-pods-view (id 15760). Generic wall-of-metrics community dashboards that
# overlapped heavily and answered no specific question. Replaced by the custom
# "Catalyst K8s — Full System Ops" dashboard (resources/catalyst-k8s-dashboard.yaml).
#
# REMOVED earlier: k8s-comprehensive (id 15661, needs VictoriaMetrics).
---
# REMOVED: k8s-monitoring-overview (ID 14623)
# Reason: Uses Docker-specific queries (name=~"^k8s_.*", mountpoint="/")
# that don't work with containerd/Talos. Use kube-prometheus-stack dashboards instead.
---
# Kubernetes PVC Dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-pvc
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: kubernetes
spec:
  folder: 'Legacy'
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  grafanaCom:
    id: 13646
  datasources:
    - inputName: 'DS_PROMETHEUS'
      datasourceName: 'Mimir'
---
# Kubernetes Volumes Dashboard
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-volumes
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: kubernetes
spec:
  folder: 'Legacy'
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  grafanaCom:
    id: 11454
  datasources:
    - inputName: 'DS_PROMETHEUS'
      datasourceName: 'Mimir'
