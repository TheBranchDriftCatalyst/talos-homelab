---
# GrafanaDashboard CRDs for Cilium and Hubble monitoring
# Dashboard IDs sourced from grafana.com/orgs/isovalent/dashboards
#
# RETIRED (Legacy folder cleanup): cilium-agent (id 16611, uid vtuWtdumz),
# cilium-hubble (id 16613, uid 5HftnJAWz), and cilium-policy-verdicts
# (id 18015, uid nLIA2E37k). Replaced by the custom "Network Ops — Cilium &
# Hubble" dashboard (resources/network-ops.yaml) plus cilium-bpf-pressure,
# all in Ops/Network.

# Cilium Operator Metrics Dashboard
# Monitors: cilium-operator, CRD management, IPAM
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: cilium
spec:
  folderRef: ops-network
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  grafanaCom:
    id: 16612
  datasources:
    - inputName: 'DS_PROMETHEUS'
      datasourceName: 'Mimir'
---
