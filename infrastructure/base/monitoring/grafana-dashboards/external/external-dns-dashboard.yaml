---
# GrafanaDashboard CRD for External-DNS monitoring
#
# Custom operator-focused dashboard (replaces the weak community dashboard 15038,
# which was just a wall of raw internal counters + generic cgroup panels).
# Answers "what DNS records do I actually manage?" via a Loki-sourced record-change
# audit + live registry counts, plus real sync/health signal (last-sync AGE, drift
# between desired vs managed, error rates).
#
# JSON lives at ../json/external-dns.json and is packaged into the
# `dashboard-external-dns` ConfigMap by the grafana-dashboards kustomization
# (configMapGenerator). The dashboard `uid` (eea5u_I7z) is preserved so this
# REPLACES the existing "External DNS" dashboard rather than duplicating it.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-dns
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: dns
spec:
  folderRef: ops-network
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-external-dns
    key: external-dns.json
