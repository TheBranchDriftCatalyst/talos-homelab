---
# Loki Logging Dashboards for Kubernetes
# Best-of-breed dashboards for V2 OTEL stack (Mimir + Loki + Alloy)

# REMOVED (TALOS-9h2): kubernetes-general-mimir-loki (grafana.com id 21173).
# Generic cluster-overview dashboard that overlapped with the other two community
# k8s dashboards. Replaced by the custom "Catalyst K8s — Full System Ops"
# dashboard (resources/catalyst-k8s-dashboard.yaml). The Loki LOG dashboards
# below (18494, 18042) are kept — they're log browsers, not metric overlap.
---
# Kubernetes Logs from Loki (ID: 18494)
# Improved log browser with namespace/pod filters and regex search
# Better than 15141 - works out of the box
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-logs-loki
  namespace: monitoring
spec:
  folderRef: ops-observability
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  grafanaCom:
    id: 18494
  datasources:
    - inputName: 'DS_GRAFANACLOUD-SS3RG3-LOGS'
      datasourceName: 'Loki'
---
# Logging Dashboard via Loki v2 (ID: 18042)
# Universal and flexible logging dashboard
# Good fallback if other dashboards have issues
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: logging-loki-v2
  namespace: monitoring
spec:
  folderRef: ops-observability
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  grafanaCom:
    id: 18042
  datasources:
    - inputName: 'DS_LOKI'
      datasourceName: 'Loki'
