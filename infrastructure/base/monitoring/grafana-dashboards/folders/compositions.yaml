---
# "Compositions" Grafana folder — Crossplane composition adoption + DRY tracking.
#
# Declared centrally here (like every GrafanaFolder, so uids stay unique/reviewable),
# but each composition OWNS its own dashboard: the GrafanaDashboard CR lives in the
# composition's dir (e.g. infrastructure/base/catalyst-cnpg-appdb/grafana-dashboard.yaml)
# and lands here via `spec.folderRef: compositions`. grafana-operator runs cluster-scoped,
# so a dashboard CR declared alongside its composition reconciles into the shared Grafana.
# The dashboard grows a new panel-set per composition as each one is adopted (TALOS-l2sm.11).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: compositions
  namespace: monitoring
spec:
  uid: compositions
  title: 'Compositions'
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
