---
# Nested "Ops" Grafana folder hierarchy
#
# Parent folder "Ops" with per-domain child folders. Dashboards reference the
# child folder via `spec.folderRef: <child metadata.name>` (mutually exclusive
# with the old `spec.folder: '<String>'`).
#
# Requires: grafana-operator v5.20+ / Grafana 12.1+ (nested folders GA).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: ops
  namespace: monitoring
spec:
  uid: ops
  title: 'Ops'
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: ops-network
  namespace: monitoring
spec:
  uid: ops-network
  title: 'Network'
  parentFolderRef: ops
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: ops-cluster
  namespace: monitoring
spec:
  uid: ops-cluster
  title: 'Cluster'
  parentFolderRef: ops
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: ops-storage
  namespace: monitoring
spec:
  uid: ops-storage
  title: 'Storage'
  parentFolderRef: ops
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
---
