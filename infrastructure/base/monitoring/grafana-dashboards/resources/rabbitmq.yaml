---
# GrafanaDashboard CR: "RabbitMQ Messaging".
#
# Custom, fully label-driven dashboard for every RabbitmqCluster in the fleet —
# fed by the rabbitmq_prometheus plugin's rabbitmq_* metrics, scraped
# cluster-wide by the rabbitmq-clusters PodMonitor
# (infrastructure/base/monitoring/rabbitmq-monitoring/podmonitor.yaml).
#
# Templated on $namespace + $pod (RabbitMQ node), so ANY RabbitmqCluster appears
# automatically with no edits.
#
# NOTE: rabbitmq_* series only exist once a RabbitMQ node is running AND scraped.
# The only current cluster (crossplane-demo/demo-rabbit) is partly down
# (ALLREPLICASREADY=False), so panels stay empty until it recovers.
#
# JSON lives at ../json/rabbitmq.json, packaged into the `dashboard-rabbitmq`
# ConfigMap by the kustomization configMapGenerator (disableNameSuffixHash:
# true). uid "rabbitmq-messaging" is stable.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rabbitmq
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: infrastructure
spec:
  folderRef: ops-databases
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-rabbitmq
    key: rabbitmq.json
