---
# GrafanaDashboard CR: "App Ops — Image Versions".
#
# Container image-freshness dashboard for the whole fleet, fed by the
# version-checker exporter's version_checker_is_latest_version gauge
# (1 = latest tag, 0 = out-of-date) plus version_checker_is_latest_kube_version
# for the cluster's Kubernetes version delta. Surfaces out-of-date counts,
# a drill-down table of stale images (current vs latest tag), per-namespace
# stale totals, and a full filterable inventory. Templated on $namespace so
# any newly-tracked workload shows up automatically with no edits.
#
# JSON lives at ../json/app-ops-image-versions.json, packaged into the
# `dashboard-app-ops-image-versions` ConfigMap by the kustomization
# configMapGenerator (disableNameSuffixHash: true). uid
# "app-ops-image-versions" is stable.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: app-ops-image-versions
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: app
spec:
  folderRef: ops-app
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-app-ops-image-versions
    key: app-ops-image-versions.json
