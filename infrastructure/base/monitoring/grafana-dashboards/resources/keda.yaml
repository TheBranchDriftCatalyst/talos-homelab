---
# GrafanaDashboard CR: "KEDA Autoscaling".
#
# Custom, label-driven dashboard for KEDA event-driven autoscaling — fed by
# KEDA's keda_* Prometheus metrics (scraped by the keda-operator PodMonitor,
# infrastructure/base/monitoring/keda-monitoring/podmonitor.yaml) plus
# kube-state-metrics for the resulting HPA replica counts.
#
# Templated on $namespace + $scaledObject, so any newly-created ScaledObject
# appears automatically with no edits.
#
# The operator's Prometheus endpoint is enabled. Kubernetes scrape relabeling
# stores the workload namespace in `exported_namespace` because the target pod
# itself is in `keda`; dashboard queries deliberately use that label and
# deduplicate overlapping scrape paths before aggregating.
#
# Autoscaling is a cluster concern, so this lives in Ops/Cluster (folderRef
# ops-cluster) rather than Ops/Databases.
#
# JSON lives at ../json/keda.json, packaged into the `dashboard-keda` ConfigMap
# by the kustomization configMapGenerator (disableNameSuffixHash: true).
# uid "keda-autoscaling" is stable.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: keda
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: infrastructure
spec:
  folderRef: ops-cluster
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-keda
    key: keda.json
