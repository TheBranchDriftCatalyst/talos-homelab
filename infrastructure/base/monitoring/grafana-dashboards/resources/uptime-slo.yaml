---
# GrafanaDashboard CR: "Uptime / SLO".
#
# Availability / SLO overview for the fleet, driven entirely by the
# blackbox-exporter probes. Grounded 2026-08-08 against Mimir: `count(probe_success)`
# returned 13 series across two jobs —
#   - job="prometheus-blackbox-exporter" (from the blackbox HelmRelease serviceMonitor,
#     instance = full target URL): grafana, prometheus, alertmanager, traefik-dashboard,
#     graylog, opensearch
#   - job="blackbox-probes" (instance = friendly name): argocd, grafana, hubble-ui,
#     loki, mimir, tempo, traefik
# probe_success / probe_http_status_code / probe_duration_seconds all have 13 series.
# probe_ssl_earliest_cert_expiry returned NO data (all targets are plain HTTP), so the
# dashboard intentionally omits a TLS-expiry panel.
#
# Templated on $instance = label_values(probe_success, instance) (multi + All), so any
# new blackbox target appears automatically with no dashboard edits.
#
# JSON lives at ../json/uptime-slo.json, packaged into the `dashboard-uptime-slo`
# ConfigMap by the kustomization configMapGenerator (disableNameSuffixHash: true).
# uid "uptime-slo" is stable.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: uptime-slo
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: observability
spec:
  folderRef: ops-observability
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-uptime-slo
    key: uptime-slo.json
