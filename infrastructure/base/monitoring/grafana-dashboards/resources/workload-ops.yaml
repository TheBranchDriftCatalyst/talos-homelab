---
# Workload Ops — Namespace & App Drill-down
#
# GENERATED: edit scripts/gen-workload-ops.py and re-run it, NOT the JSON.
# (`grafana-sync.sh pull` is debugging-only here, so there is no UI->code path
#  that could diverge from the generator.)
#
# Answers the per-APP question the cluster dashboards do not: "how is manyfold
# actually running right now?" catalyst-k8s-dashboard owns cluster/node capacity
# and cluster-wide top-N; this one scopes to a namespace + workload.
#
# FILTERS
#   $namespace — label_values(kube_pod_info, namespace), multi + All
#   $workload  — multi + All, built with query_result() + a regex, NOT
#                label_values(): Grafana compiles label_values(expr,lbl) into
#                /api/v1/label/<lbl>/values?match[]=expr and match[] accepts only
#                a SERIES SELECTOR, so the label_replace union 400s and the
#                dropdown SILENTLY falls back to All.
#                Three disjoint owner_kind branches:
#                  ReplicaSet -> "<workload>-<hash>"   (hash has no dash)
#                  Job        -> "<workload>-<digits>" (CronJob runs collapse
#                                onto one workload name instead of ~40 entries)
#                  other      -> owner_name IS the workload (StatefulSet /
#                                DaemonSet / CNPG Cluster / Node)
#                Anchored regexes mean "manyfold" selects ONLY the Deployment pod,
#                never manyfold-postgres-* / manyfold-cache-*.
#
# JOIN RULES (both forms appear on purpose — do NOT collapse them):
#   vector math (*)      -> "* on(namespace,pod) group_left() ..."
#   set ops (and/or)     -> same join WITHOUT group_left(); group_left() on a set
#                           operation is a PromQL PARSE ERROR.
#   1-to-1 on container  -> collapse BOTH sides with `max by (namespace,pod,container)`
#                           first. A restarting container briefly has two cAdvisor
#                           series under different container ids and the query
#                           aborts with "found duplicate series for the match group".
#
# MAGNITUDE CORRECTNESS — every one of these was measured wrong in v1:
#   * "Peak" stats use reducer `max`, not lastNotNull. With lastNotNull they showed
#     the LATEST instant, so whisparr read 21.2% when its true window peak was
#     36.9% — 42% understated, and the 80/95 thresholds could never fire.
#   * Restarts use max_over_time-min_over_time, never increase(). increase()
#     extrapolates a single +1 counter step and rendered 3 restarts as ~13 across 9
#     fractional bars. "Restarts over time" must NOT carry an `interval` override:
#     $__interval has to equal the step or the windows overlap and double-draw.
#   * Memory-%-of-limit is PER CONTAINER against its own limit. Summing whole-pod
#     usage over only the limited containers' limits inflated immich to 17.24%
#     when the true worst container was 10.93% — and hid immich-server (598MB,
#     no limit) entirely.
#   * request/limit reference lines are PER POD. A workload-wide total sits N times
#     too high with N replicas and invites the opposite conclusion.
#   * Network pins interface=~"eth0|tun0". hostNetwork pods share the node netns, so
#     cAdvisor attributes every veth/cilium_*/NIC counter to them: cilium reported
#     14.94 MB/s against the node's actual 14.74 MB/s, and an unfiltered leaderboard
#     was three unrelated pods all reporting the same node.
#   * All per-pod targets are topk(20) so namespace=All/workload=All degrades to a
#     "noisiest 20" view instead of 303 pod lines against a cluster-wide reference.
#
# RATE WINDOWS: cAdvisor scrapes every 60s here (measured). Grafana's datasource
# assumes shorter, so at wide ranges $__rate_interval collapses to ~60s — ONE
# sample per window — and rate() needs TWO, silently rendering "No data" at 24h
# while working at 1h. Every $__rate_interval panel therefore sets interval: 2m.
#
# GROUNDING (mimir-query-frontend, X-Scope-OrgID: anonymous). All targets executed
# across FIVE scopes — openscad/manyfold (no limits), media-private/whisparr (has
# limits + restart history), media-private/immich (4 containers, mixed limits),
# kube-system/cilium (hostNetwork DaemonSet), monitoring/* (wide) — 0 broken.
#   LIVE: container_cpu_usage_seconds_total 1033 | container_memory_working_set_bytes 1033
#         container_memory_rss / _cache ~1036 each | container_cpu_cfs_*_periods_total 114
#         (ONLY containers WITH a cpu limit emit these) | container_oom_events_total 1044
#         container_network_receive/transmit_bytes_total ~3.2k | kube_pod_owner 328
#         kube_pod_info 328 | kube_pod_start_time 344 | kube_pod_status_qos_class 1032
#         (BestEffort 66 / Burstable 277 / Guaranteed 1) | kube_pod_status_phase 1640
#         kube_pod_container_status_ready 384 (per-CONTAINER; the pod-level
#         kube_pod_status_ready has only 344 and scores a 4-container pod as 1)
#         kube_pod_container_status_restarts_total 368 | resource_requests 619
#         resource_limits 240 (most workloads set NO limits) | last_terminated_reason 114
#   SPARSE — empty is CORRECT, not a bug:
#         kube_pod_container_status_waiting_reason 1 (empty unless something crash-loops)
#         all limit/throttle panels are empty for workloads with no limits set
#   ABSENT — no panel possible:
#         kube_pod_status_unschedulable absent, kube_pod_status_reason 0 series -> the
#         REASON a pod is Pending is NOT discoverable here; panel description says so.
#         HPA: only 1 series cluster-wide, and keda.json already owns that ground.
#
# CORRECTIONS to the v1 notes in this file:
#   * v1 claimed verification against media-private/whisparr "4 pods". It resolves to
#     ONE pod, which is exactly why the N-pod request/limit overlay bug was
#     structurally invisible at authoring time. Multi-pod cases are now covered by
#     immich and by the wide monitoring/* scope.
#   * v1 dismissed filesystem metrics from container_fs_usage_bytes (64 series).
#     container_fs_reads_bytes_total has 767 — the dismissal generalised from the
#     wrong metric. Still no disk panel (scope), but the stated reason was wrong.
#   * Do NOT add container!="POD". No series in this cluster carries it. cAdvisor
#     emits container / pod-cgroup / pause, and the latter two have the label
#     ABSENT, which container!="" already excludes. The container!="POD" clauses in
#     resource-efficiency.json and talos00-memory-deepdive.json are vestigial.
#   * Tunnel interfaces (ip6tnl0/sit0/tunl0) are all exactly 0 and were never the
#     network problem — hostNetwork pods were.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: workload-ops
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: cluster
spec:
  folderRef: ops-cluster
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-workload-ops
    key: workload-ops.json
