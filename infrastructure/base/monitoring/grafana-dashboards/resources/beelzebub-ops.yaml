---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: beelzebub-ops
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: security
spec:
  folderRef: ops-security
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-beelzebub-ops
    key: beelzebub-ops.json
