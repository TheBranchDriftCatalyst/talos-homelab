---
# CrowdSec enforcement, detection and pipeline health. Native shared LAPI gauges
# are deduplicated; the bounded read-only decision exporter supplies local IP/expiry
# rows. Loki supplies observation history. Scenario overflows include simulation.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: crowdsec-ops
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: security
spec:
  folderRef: ops-security
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  configMapRef:
    name: dashboard-crowdsec-ops
    key: crowdsec-ops.json
