---
# GrafanaDashboard CR: "Monitoring Ops" (meta-monitoring / observability explorer).
#
# ONE focused dashboard to operate the monitoring stack ITSELF: scrape-target
# health, per-job series counts & cardinality, the Alloy -> Mimir/Loki/Tempo
# ingestion pipeline, and problem-spotters for double-scrapes and cardinality
# blowups.
#
# CORRECTNESS: kube_* queries are scoped to job="kube-state-metrics". KSM is
# double-scraped on this cluster (also via job="kubernetes-service-endpoints",
# honor_labels collision). The "Double-Scrape Detection" row deliberately
# surfaces that duplication. See TALOS-57t.
#
# All targets use the Mimir datasource (uid "mimir"). There is no trace panel:
# Tempo was deleted in TALOS-suxd.5 and its "Tempo Instances Up" stat went with
# it. Traces now live in ClickStack, which has no PromQL surface to chart here --
# they are viewed in HyperDX, and the Grafana-side deep link is TALOS-suxd.8.
#
# JSON at ../json/monitoring-ops.json -> ConfigMap dashboard-monitoring-ops
# (configMapGenerator, disableNameSuffixHash). uid "monitoring-ops" is stable.
# See TALOS-70n.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: monitoring-ops
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: infrastructure
spec:
  folderRef: ops-observability
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-monitoring-ops
    key: monitoring-ops.json
