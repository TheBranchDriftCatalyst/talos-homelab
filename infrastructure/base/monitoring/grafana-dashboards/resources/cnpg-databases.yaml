---
# GrafanaDashboard CR: "CloudNativePG Databases".
#
# Custom, fully label-driven dashboard for every CloudNativePG cluster in the
# fleet — fed by CNPG's built-in cnpg_* metrics (scraped cluster-wide by the
# cnpg-monitoring PodMonitor) plus kube-state-metrics / cadvisor / kubelet for
# provisioned resource tracking. Replaces the empty postgres_exporter dashboard
# (grafana.com id 9628) removed from external/infrastructure-dashboards.yaml.
#
# Templated on $namespace + $cluster (cluster derived from pod name <cluster>-N),
# so ANY newly-provisioned CNPG database appears automatically with no edits.
# Queries dedup with `max by (namespace, pod)` so a transient double-scrape
# (e.g. a cluster still running the operator's own PodMonitor) can't double-count.
#
# JSON lives at ../json/cnpg-databases.json, packaged into the
# `dashboard-cnpg-databases` ConfigMap by the kustomization configMapGenerator
# (disableNameSuffixHash: true). uid "cnpg-databases" is stable. See TALOS-7u3.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cnpg-databases
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: infrastructure
spec:
  folder: 'Infrastructure'
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-cnpg-databases
    key: cnpg-databases.json
