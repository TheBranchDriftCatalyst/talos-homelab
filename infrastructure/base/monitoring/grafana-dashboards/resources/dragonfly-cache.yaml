---
# GrafanaDashboard CR: "Dragonfly / Redis Cache".
#
# Custom, label-driven dashboard for every Dragonfly cache in the fleet — fed by
# redis_exporter's redis_* Prometheus metrics. Each Dragonfly gets a dedicated
# oliver006/redis_exporter (infrastructure/base/monitoring/redis-monitoring/)
# that talks pure RESP to the cache and exposes clean redis_* over HTTP :9121,
# scraped by the redis-exporter PodMonitor. This REPLACES the abandoned
# direct-scrape of Dragonfly's multiplexed RESP+HTTP :6379/metrics, which Alloy
# could not scrape (scrape hangs/times out — TALOS-tf6o).
#
# Templated on $redis (the redis_cache pod label the PodMonitor projects onto
# every series), so ANY newly-added exporter shows up automatically — add a cache
# by dropping another exporter Deployment into redis-monitoring/.
#
# NOTE: redis_* series only exist once the redis_exporter Deployments are running
# and scraped. Until this base is reconciled, panels stay empty; they populate as
# soon as redis_up == 1 for each cache.
#
# JSON lives at ../json/dragonfly-cache.json, packaged into the
# `dashboard-dragonfly-cache` ConfigMap by the kustomization configMapGenerator
# (disableNameSuffixHash: true). uid "dragonfly-cache" is stable.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dragonfly-cache
  namespace: monitoring
  labels:
    app.kubernetes.io/component: dashboard
    dashboard-category: infrastructure
spec:
  folderRef: ops-databases
  instanceSelector:
    matchLabels:
      dashboards: 'grafana'
  configMapRef:
    name: dashboard-dragonfly-cache
    key: dragonfly-cache.json
