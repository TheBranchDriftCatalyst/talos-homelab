---
# CloudNativePG cluster-wide monitoring: one PodMonitor that auto-discovers
# every CNPG instance in every namespace. Pairs with the label-driven
# "CloudNativePG Databases" Grafana dashboard so any provisioned DB appears
# automatically. See TALOS-7u3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - podmonitor.yaml
