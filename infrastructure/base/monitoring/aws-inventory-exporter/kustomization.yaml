---
# AWS account-wide inventory exporter (TALOS-iymy -> TALOS-hnod). Resource Explorer
# first, tagging API as the coverage floor, joined against the live Crossplane managed-
# resource set; feeds dashboard-aws-inventory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  # aws-credentials mirror removed — the exporter now uses the scoped read-only IAM user
  # (catalyst-aws-inventory-ro; creds in secret aws-inventory-ro-creds, provisioned by
  # infrastructure/base/aws/inventory-ro-user.yaml). TALOS-iymy hardening.
  - deployment.yaml
  - podmonitor.yaml
  # ── OFF BY DEFAULT: uncomment to arm ────────────────────────────────────────────────
  # rbac.yaml gives the exporter its own ServiceAccount + an aggregated ClusterRole so it
  # can read managed resources and actually compute managed-vs-orphaned. ⚠️ Uncomment it
  # TOGETHER WITH `serviceAccountName:` in deployment.yaml, in the same commit —
  # uncommenting either alone is wrong (see the deployment.yaml header).
  - rbac.yaml
  #
  # alerts.yaml fires on a confirmed orphan, on a fleet that is active but placing
  # nothing, and on the classification going untrustworthy. Arm it after rbac.yaml,
  # because until the MR index is readable the orphan series does not exist and the
  # untrustworthy alert would be permanently firing.
  - alerts.yaml
configMapGenerator:
  - name: aws-inventory-exporter-script
    files:
      - exporter.py
# NO disableNameSuffixHash. The hash is what makes an exporter.py edit actually take
# effect: the generated ConfigMap name changes with its content, kustomize rewrites the
# Deployment's volume reference to match, and the pod template therefore changes, so the
# Deployment rolls. With the hash disabled the ConfigMap was updated in place, the pod
# template stayed byte-identical, NOTHING restarted, and the running process kept serving
# from the copy it read at startup - while Flux reported Ready and the commit looked
# applied. That silently ran stale code five separate times on 2026-10-02 (TALOS-h1ng),
# including once where the fix being verified was for a false "unmanaged" classification.
# The asymmetry is what makes it so easy to miss: an ENV VAR change does roll the pod,
# because env lives in the pod template. Only file content was affected.
# Nothing references this ConfigMap by a fixed name except deployment.yaml's volume, and
# kustomize rewrites that reference itself - which is why the hash was never needed.
