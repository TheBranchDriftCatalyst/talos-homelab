---
# AWS inventory + status exporter (TALOS-iymy). Sweeps all regions; feeds dashboard-aws-inventory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - externalsecret.yaml
  - deployment.yaml
  - podmonitor.yaml
configMapGenerator:
  - name: aws-inventory-exporter-script
    files:
      - exporter.py
generatorOptions:
  disableNameSuffixHash: true
