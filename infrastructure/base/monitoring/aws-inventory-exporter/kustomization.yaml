---
# AWS inventory + status exporter (TALOS-iymy). Sweeps all regions; feeds dashboard-aws-inventory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  # aws-credentials mirror removed — the exporter now uses the scoped read-only IAM user
  # (catalyst-aws-inventory-ro; creds in secret aws-inventory-ro-creds, provisioned by
  # infrastructure/base/aws/inventory-ro-user.yaml). TALOS-iymy hardening.
  - deployment.yaml
  - podmonitor.yaml
configMapGenerator:
  - name: aws-inventory-exporter-script
    files:
      - exporter.py
generatorOptions:
  disableNameSuffixHash: true
