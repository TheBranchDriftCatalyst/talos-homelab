---
# aws-credentials mirrored into `monitoring` for the inventory exporter (the source of truth
# lives in crossplane-system; secrets can't be mounted cross-namespace). Same 1Password item,
# same shared-credentials-file shape the exporter reads via AWS_SHARED_CREDENTIALS_FILE.
# TODO(hardening): swap the 1Password item for a dedicated READ-ONLY IAM user (describe/list only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: aws-credentials
    creationPolicy: Owner
    template:
      data:
        creds: |
          [default]
          aws_access_key_id = {{ .access_key_id }}
          aws_secret_access_key = {{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef: {key: aws-credentials, property: access_key_id}
    - secretKey: secret_access_key
      remoteRef: {key: aws-credentials, property: secret_access_key}
