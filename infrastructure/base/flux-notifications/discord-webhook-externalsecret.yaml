---
# ExternalSecret to sync Discord webhook URL from 1Password
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: flux-system
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore

  target:
    name: discord-webhook
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: flux-notifications
        annotations:
          # Mirror into ns `monitoring` for the Mimir Alertmanager
          # tenant-config pusher CronJob (reads key `address`). Replaces
          # the former duplicate ExternalSecret in
          # infrastructure/base/monitoring/v2-otel/alertmanager-config/.
          # Same emberstack/reflector pattern as arr-stack shared secrets.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "monitoring"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring"
      type: Opaque

  data:
    - secretKey: address
      remoteRef:
        key: flux-discord-webhook
        property: webhook_url
