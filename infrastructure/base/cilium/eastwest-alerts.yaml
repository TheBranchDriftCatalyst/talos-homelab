---
# East-West (Cilium datapath) degradation alerts — the safety net for the WireGuard rollout
# (TALOS-dw2p #1) and ongoing pod-network health. Auto-synced to the Mimir ruler.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-eastwest
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: cilium, release: monitoring}
spec:
  groups:
    - name: cilium-eastwest
      rules:
        - alert: CiliumDropRateHigh
          # baseline is ~0.2 pkt/s (benign stale-IP); a sustained spike signals a datapath
          # regression (e.g. a bad WireGuard rollout / MTU fragmentation).
          expr: sum(rate(cilium_drop_count_total[5m])) > 50
          for: 10m
          labels: {severity: warning, area: network}
          annotations:
            summary: "Cilium east-west drop rate high ({{ $value | printf \"%.1f\" }} pkt/s)"
            description: "Sustained pod-network packet drops — check for MTU/fragmentation after any CNI change."
        - alert: CiliumNodeConnectivityLatencyHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(cilium_node_health_connectivity_latency_seconds_bucket[5m]))) > 0.25
          for: 10m
          labels: {severity: warning, area: network}
          annotations:
            summary: "Cilium cross-node p99 connectivity latency high ({{ $value | printf \"%.3f\" }}s)"
            description: "Node-to-node latency elevated — WireGuard overhead spike or datapath issue."
        - alert: CiliumTransparentEncryptionOff
          # cilium 1.20 exports no wireguard peer-count metric; use the feature gauge. Once WireGuard
          # is enabled cluster-wide this is 1 on every node — a node reporting 0 means its pod traffic
          # is NOT being encrypted. (Runtime datapath breakage is caught by the drop/latency alerts.)
          expr: min(cilium_feature_adv_connect_and_lb_transparent_encryption) == 0
          for: 15m
          labels: {severity: warning, area: network}
          annotations:
            summary: "Cilium transparent encryption OFF on at least one node — pod traffic there is PLAINTEXT"
            description: "A node reports encryption feature=0; WireGuard is not covering its pod traffic."
