---
# LoadBalancer IPAM pool for LAN-facing services. Scoped by serviceSelector to
# Pi-hole ONLY (so the two minio LoadBalancers stay cluster-internal/pending).
# Requires l2announcements.enabled + kubeProxyReplacement (values.yaml).
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pihole-pool
spec:
  blocks:
    - start: "192.168.1.240"
      stop: "192.168.1.250"
  serviceSelector:
    matchLabels:
      app: pihole
---
# Announce the pool's LoadBalancer IPs on the LAN via ARP (L2). No BGP needed.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-pihole-l2
spec:
  serviceSelector:
    matchLabels:
      app: pihole
  # No nodeSelector: Pi-hole now runs on EVERY node (one-per-node HA), so whichever
  # node Cilium elects to announce the VIP has a local backend — required for
  # externalTrafficPolicy:Local (client-IP preservation). Node dies → lease + VIP
  # move to another node that also has a Pi-hole. Automatic failover.
  loadBalancerIPs: true
  externalIPs: false
  # interfaces omitted → announce on the interface holding the node's LAN IP.
---
# ---------------------------------------------------------------------------
# Traefik ingress VIP (TALOS-sa0n). Until 2026-08-15 svc/traefik was
# type=LoadBalancer with EXTERNAL-IP <pending> forever, because the pool above
# selects app=pihole only. All LAN ingress therefore arrived via NodePort/
# hostPort on INDIVIDUAL node IPs, and the *.talos00 wildcard in Pi-hole
# pointed at ONE node — a hard single point of failure. Proven that day: the
# traefik pod on talos00 came back from a reboot with no routes and 404'd every
# .talos00 host, while talos01/talos06 served 200 the whole time.
#
# A dedicated VIP that Cilium announces via L2 (ARP) from a healthy node gives
# automatic failover: node dies -> lease + VIP move -> ingress follows.
#
# CUTOVER: this is ADDITIVE. Node-IP/NodePort access keeps working unchanged;
# nothing breaks on apply. Point Pi-hole's *.talos00 wildcard at the VIP below
# when ready, and ingress stops depending on any single node.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-traefik-pool
spec:
  blocks:
    # .240-.250 belongs to the Pi-hole pool above; .251 is verified free.
    # .252 kept spare for a future LAN-facing LoadBalancer.
    - start: "192.168.1.251"
      stop: "192.168.1.252"
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-traefik-l2
spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  # No nodeSelector: traefik is a DaemonSet on every node, so whichever node
  # Cilium elects always has a local backend.
  loadBalancerIPs: true
  externalIPs: false
  # NOTE: svc/traefik is externalTrafficPolicy=Cluster and is left that way
  # deliberately — flipping to Local changes client-IP preservation, which
  # CrowdSec's bouncer depends on for ban decisions. Evaluate separately.

---
# Honeypot SSH VIP (TALOS-qish). Single L2-announced LAN IP that fronts BOTH cowrie + beelzebub as a
# 50/50 sticky pool. .238 is below the pihole pool (.240+) and verified outside DHCP. Repoint the router
# forward WAN:22 -> 192.168.1.238:22 to send attackers here. externalTrafficPolicy:Local on the Service
# preserves the attacker source IP (raw TCP has no X-Forwarded-For) — both backends are pinned to
# talos02-gpu so a local backend always exists where Cilium announces the VIP.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-honeypot-pool
spec:
  blocks:
    - start: "192.168.1.238"
      stop: "192.168.1.238"
  serviceSelector:
    matchLabels:
      app: honeypot-vip
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-honeypot-l2
spec:
  serviceSelector:
    matchLabels:
      app: honeypot-vip
  loadBalancerIPs: true
  externalIPs: false
