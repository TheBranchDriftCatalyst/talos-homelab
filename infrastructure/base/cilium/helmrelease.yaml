---
# Cilium CNI — INFRA, Flux-managed (TALOS-ocj, activated 2026-05-30).
#
# Activated after TALOS-yyt root-cause fix (identity bloat → etcd
# saturation → meltdown cascade). With the cascade eliminated, the
# DS-rollout-during-take-ownership risk that bricked the cluster on
# 2026-05-29 is no longer present: helm release name matches the existing
# manual install, so helm-controller adopts without take-ownership churn.
#
# Per the dual-GitOps demarcation (docs/02-architecture/dual-gitops.md):
#   Flux = infrastructure (CNI, ingress, storage, observability, operators)
#   ArgoCD = applications only (plex, arr stack, catalyst-ui, etc.)
# Cilium is CNI. It belongs in Flux. (Confirmed by user 2026-05-29.)
#
# Bootstrap chicken-and-egg:
#   Cilium IS the CNI. Flux needs network. Network needs Cilium.
#   Solution: bootstrap Cilium manually once with helm template + kubectl apply
#   on a fresh cluster, then this HelmRelease takes over future reconciliation.
#   On an existing cluster: `helm upgrade --install cilium cilium/cilium
#   --version 1.16.6 -f infrastructure/base/cilium/values.yaml -n kube-system
#   --take-ownership` once to seed the helm release secret, then Flux adopts.
#
# Values live next to this file (`values.yaml`) and are mounted via a
# kustomize-generated ConfigMap (`cilium-values`) referenced by valuesFrom
# below. This keeps the values readable as a regular YAML file editable in
# any IDE, without inlining the 280+ line block into the HelmRelease.
#
# CRITICAL: prune is intentionally FALSE on the Flux Kustomization that
# owns this file (see clusters/catalyst-cluster/cilium.yaml). NEVER let
# Flux auto-prune the CNI — a misconfiguration could delete every
# Cilium-related resource and brick the cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  # Match the release name used by the historical manual install so the
  # existing helm release secret (created by --take-ownership) is found.
  releaseName: cilium
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: '1.20.0' # hop 4 (FINAL): 1.19.6→1.20.0 (TALOS-p2g3.4). upgradeCompatibility:"1.19"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
  # KEEP THIS LITERAL. Every other HelmRelease in the repo had its retries stripped in
  # TALOS-a38d.5, because the helmrelease-remediation-defaults Kyverno policy now injects
  # remediation.retries: 3 at admission. This release lives in kube-system, which is in Kyverno's
  # resourceFilters exclusion list, so the webhook NEVER sees it -- removing these lines here
  # would silently drop it to Flux's retries: 0 default, not to 3.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    # Force replacement of immutable fields (e.g. Service spec changes).
    # Cilium upgrades occasionally need this when chart versions bump
    # selector labels.
    force: false
    cleanupOnFail: false
  # Don't wait for the rollout — Cilium DS restart can take 5+ minutes
  # per the maxUnavailable: 1 + agent startup time. Flux would otherwise
  # mark the reconcile as failed and retry, compounding API pressure.
  test:
    enable: false

  # postRenderers: REMOVED 2026-08-22 (TALOS-1d4o).
  #
  # All four patches targeted cilium-spire resources — the Namespace PSA labels, the
  # spire-agent SA-token TTL 600s→3600s override, and the KeyManager-disk ConfigMap +
  # emptyDir pair. With authentication.mutual.spire disabled in values.yaml, the chart
  # no longer renders any of those resources.
  #
  # Removing them is MANDATORY, not tidy-up. The TTL patch carried an `op: test` guard
  # against /spec/template/spec/volumes/3/... on a DaemonSet that no longer exists;
  # a JSON-patch target that renders to nothing aborts the ENTIRE postRender, and per
  # this repo's own history that abort is SILENT (helm-controller logs it and moves on
  # with the un-rendered release). Leaving them would have quietly broken every future
  # Cilium reconcile. See docs/02-architecture/cilium-spire-disposition.md §3.
  #
  # Nothing else in this release used a postRenderer, so the key is gone entirely.
  # If SPIRE is ever re-enabled, restore this block from git history alongside the
  # two values.yaml booleans — the TTL and KeyManager patches are load-bearing
  # workarounds for the crashloop wedge, not decoration.
