---
# kube-system Namespace — PSA labels, preserved verbatim from the file this replaces.
#
# THIS IS NOT A NEW RESOURCE. It reproduces, byte-for-byte, what `kustomize build
# infrastructure/base/cilium` already emitted before 2026-08-22. It exists because
# removing SPIRE surfaced a long-standing surprise worth writing down:
#
#   The file this replaces was `spire-namespace.yaml`, which declared
#   `Namespace/cilium-spire`. It never created cilium-spire. This kustomization sets
#   `namespace: kube-system`, and kustomize's namespace transformer does not just stamp
#   `metadata.namespace` onto namespaced resources — for a `Namespace` object it REWRITES
#   `metadata.name`. So that manifest rendered as `Namespace/kube-system` carrying
#   `pod-security.kubernetes.io/enforce|warn: privileged`, and the live kube-system
#   Namespace is labelled `kustomize.toolkit.fluxcd.io/name: cilium` to prove it.
#
#   The real cilium-spire namespace was always created by the Cilium chart (its live
#   labels say `app.kubernetes.io/managed-by: Helm`), and the HelmRelease postRenderer
#   supplied its PSA labels. The comments in helmrelease.yaml claiming
#   "the standalone spire-namespace.yaml has been quietly doing all the work" were
#   mistaken about which namespace it was doing that work on.
#
# Is the label load-bearing? No — it is defence in depth. kube-system is listed in the
# apiserver's PodSecurity admission `exemptions.namespaces` (verified 2026-08-22 from
# /system/config/kubernetes/kube-apiserver/admission-control-config.yaml, alongside
# media-prod and local-path-storage), and an exempt namespace bypasses PSA regardless of
# its labels. The cluster-wide default is enforce=baseline, which would otherwise reject
# the hostNetwork/privileged pods that kube-system is full of — Cilium's included.
#
# It is kept anyway, and kept explicit, for two reasons: dropping it would have been an
# unrelated live change smuggled in on a CNI commit, and if the Talos exemption list is
# ever trimmed the label is the only thing standing between baseline enforcement and
# every privileged pod in kube-system.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
