---
# IngressRoute for Hubble UI - Cilium's network flow visualization
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: cilium
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "main"
    gethomepage.dev/name: "Hubble"
    gethomepage.dev/description: "Network Observability"
    gethomepage.dev/group: "Monitoring"
    gethomepage.dev/weight: "20"
    gethomepage.dev/icon: "https://raw.githubusercontent.com/cilium/hubble/main/Documentation/images/hubble_logo.png"
    gethomepage.dev/siteMonitor: "http://hubble-ui.kube-system.svc.cluster.local"
    # KEPT DELIBERATELY (TALOS-a38d.1): everywhere else this repo lets
    # homepage-annotation-derivation derive href, but Kyverno CANNOT mutate anything in
    # kube-system — the resource webhook namespaceSelector excludes it (and kyverno,
    # kube-public, kube-node-lease), matching the resourceFilters entry [*/*,kube-system,*].
    # Strip this and the Hubble tile silently loses its link. Same reason spec.tls below
    # is written out by hand.
    gethomepage.dev/href: "https://hubble.talos00"
spec:
  # HTTPS + Authentik forward-auth SSO (TALOS-xgrl.14). talos-admin / cluster-admin gated.
  # TLS: default TLSStore serves the *.talos00 wildcard via SNI.
  entryPoints:
    - websecure
  routes:
    - match: Host(`hubble.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: hubble-ui
          port: 80
  # KEPT DELIBERATELY (TALOS-a38d.3): ingressroute-tls-default cannot reach kube-system
  # (see the href note above), so this websecure route must declare its own tls or Traefik
  # serves it as cleartext on :443.
  tls: {}
---
# HTTP→HTTPS redirect for hubble.talos00.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble-ui-http
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`hubble.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: hubble-ui
          port: 80
