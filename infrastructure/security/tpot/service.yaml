# Stable ClusterIPs for the T-Pot guest ports (masquerade forwards these to the guest). The proxies
# target these; nothing here is world-exposed by itself.
---
apiVersion: v1
kind: Service
metadata:
  name: tpot-ssh
  namespace: honeypot-vm
  labels: { app: tpot }
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: tpot
  ports:
    - { name: ssh, port: 22, targetPort: 22, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: tpot-mgmt
  namespace: honeypot-vm
  labels: { app: tpot }
spec:
  type: ClusterIP
  selector:
    kubevirt.io/domain: tpot
  ports:
    - { name: webui, port: 64297, targetPort: 64297, protocol: TCP }
