# talos06 ONLY. Same as network-hostentries.yaml PLUS tdarr.talos00.
#
# extraHostEntries is a list, so this REPLACES the shared block rather than appending — hence
# the full set repeated here. Must come AFTER network-hostentries.yaml in the patch order.
#
# The extra alias is drift, not design: it was added when tdarr was pinned to this node and
# never propagated to the others. Reproduced faithfully so the migration diff is clean.
# Normalising it is a separate, visible change.
machine:
  network:
    extraHostEntries:
      - ip: 192.168.1.54
        aliases:
          - registry.talos00
          - nexus.talos00
          - argocd.talos00
          - grafana.talos00
          - prometheus.talos00
          - catalyst.talos00
          - tdarr.talos00
